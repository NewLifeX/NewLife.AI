<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 防暗黑模式白屏闪烁：在 CSS 加载前立即应用 dark 类
      try {
        var s = JSON.parse(localStorage.getItem('newlife-settings') || '{}').state
        var t = s && s.theme
        if (t === 'dark' || (!t || t === 'system') && matchMedia('(prefers-color-scheme:dark)').matches) {
          document.documentElement.classList.add('dark')
        }
      } catch(e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NewLife - 智能助手</title>
    <!-- 字体已通过 npm 包 local import，见 main.tsx -->
    <!-- OG meta tags（默认值，由前端 JS 和/or 后端中间件动态覆盖） -->
    <meta property="og:title" content="NewLife - 智能助手" />
    <meta property="og:site_name" content="星语" />
    <meta property="og:description" content="智能AI对话助手" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NewLife - 智能助手" />
    <meta name="twitter:description" content="智能AI对话助手" />
    <meta name="twitter:image" content="/logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
