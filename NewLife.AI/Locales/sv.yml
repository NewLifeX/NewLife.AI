"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[System] Verktyg har misslyckats i {0} omgångar i följd. Prova ett annat angreppssätt eller anropa verktyget ask_user för att be användaren om hjälp."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[System] Verktygsanrop har misslyckats i {0} omgångar i följd (misslyckade verktyg: {1}). Sluta upprepa samma verktyg; ändra argumenten eller byt verktyg eller angreppssätt och anropa ask_user vid behov."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[System] De tidigare verktygsresultaten nedan har komprimerats till en sammanfattning (anropa verktygen igen om du behöver detaljer):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Innehållet är för långt; {0} tecken i mitten utelämnades, ursprunglig längd {1} tecken; begränsa intervallet eller anropa verktyget igen för att få hela innehållet)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "Verktyget {0} är blockerat av kodlagret (riskfylld åtgärd)"
"Tool {0} was rejected by the user": "Verktyget {0} avvisades av användaren"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "Verktygsleverantören är tillfälligt otillgänglig (kretsen öppen) och väntas återhämta sig inom {0}s. Kontakta administratören för att återställa kretsbrytaren om du behöver försöka igen nu"
"Tool {0} returned an empty result": "Verktyget {0} returnerade ett tomt resultat"
"[{0} call failed] ": "[{0}-anrop misslyckades] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Renderat i klienten: {0}] Resultatet är redan renderat i användargränssnittet; infoga inte bildlänkar eller filsökvägar i svaret"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "Verktyget {0} förväntar sig detta parameterschema: {1}. Försök igen enligt schemat."
