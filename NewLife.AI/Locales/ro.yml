"Identical call already failed; duplicate execution skipped": "Un apel identic a eșuat deja; execuția duplicată a fost omisă"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[Eroare repetată: {0}] Același apel cu aceste argumente a eșuat anterior: {1}. Nu reîncerca neschimbat; modifică argumentele sau treci la alt instrument sau altă abordare."
"Unknown reason": "Motiv necunoscut"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[Sistem] Instrumentele au eșuat timp de {0} runde consecutive. Încearcă o altă abordare sau apelează instrumentul ask_user pentru a cere ajutor utilizatorului."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Sistem] Apelurile instrumentelor au eșuat timp de {0} runde consecutive (instrumente eșuate: {1}). Oprește reîncercarea acelorași instrumente; modifică argumentele sau treci la alt instrument sau altă abordare și apelează ask_user dacă este nevoie."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Sistem] Rezultatele anterioare ale instrumentelor de mai jos au fost comprimate într-un rezumat (reapelează instrumentele dacă ai nevoie de detalii):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Conținut prea lung; {0} caractere din mijloc au fost omise, lungime inițială {1} caractere; restrânge intervalul sau reapelează instrumentul pentru conținutul complet)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "Instrumentul {0} este blocat de nivelul de cod (operațiune cu risc ridicat)"
"Tool {0} was rejected by the user": "Instrumentul {0} a fost respins de utilizator"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "Furnizorul de instrumente este temporar indisponibil (circuit deschis) și se estimează revenirea în {0}s. Contactați administratorul pentru a reseta întrerupătorul de circuit dacă trebuie să reîncercați acum"
"Tool {0} returned an empty result": "Instrumentul {0} a returnat un rezultat gol"
"[{0} call failed] ": "[Apelul {0} a eșuat] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Randat în client: {0}] Rezultatul este deja afișat în interfața utilizator; nu insera linkuri de imagini sau căi de fișiere în răspuns"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "Instrumentul {0} așteaptă această schemă de parametri: {1}. Reîncearcă conform schemei."
