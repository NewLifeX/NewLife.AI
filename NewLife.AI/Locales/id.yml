"Unknown reason": "Alasan tidak diketahui"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[Sistem] Alat gagal selama {0} putaran berturut-turut. Coba pendekatan lain atau panggil alat ask_user untuk meminta bantuan pengguna."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Sistem] Panggilan alat gagal selama {0} putaran berturut-turut (alat yang gagal: {1}). Hentikan pengulangan alat yang sama; ubah argumen atau beralih ke alat atau pendekatan lain, dan panggil ask_user jika perlu."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Sistem] Hasil alat sebelumnya di bawah ini telah dipadatkan menjadi ringkasan (panggil alat lagi jika membutuhkan detail):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Konten terlalu panjang; {0} karakter di tengah dihilangkan, panjang asli {1} karakter; persempit rentang atau panggil alat lagi untuk mendapatkan konten lengkap)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "Alat {0} diblokir oleh lapisan kode (operasi berisiko tinggi)"
"Tool {0} was rejected by the user": "Alat {0} ditolak oleh pengguna"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "Penyedia alat sementara tidak tersedia (pemutus sirkuit terbuka) dan diperkirakan pulih dalam {0} detik. Hubungi administrator untuk mereset pemutus sirkuit jika perlu mencoba lagi sekarang"
"Tool {0} returned an empty result": "Alat {0} mengembalikan hasil kosong"
"[{0} call failed] ": "[Panggilan {0} gagal] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Dirender di klien: {0}] Hasil sudah dirender di antarmuka pengguna; jangan sisipkan tautan gambar atau jalur berkas dalam balasan"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "Alat {0} mengharapkan skema parameter ini: {1}. Coba lagi sesuai skema."
