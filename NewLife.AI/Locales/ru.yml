"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "IPv4/IPv6-адрес для поиска; оставьте пустым, чтобы определить текущий публичный IP этого компьютера"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "Возвращает текущую погоду города, включая температуру, влажность, скорость ветра и условия. Ключ API не требуется"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "Название города; поддерживаются китайский и английский, например Shanghai, 上海, New York"
