"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[Система] На основе результатов инструментов выше сразу дай окончательный ответ. Не вызывай больше инструменты."
"Duplicate call from a previous round; execution skipped": "Повторный вызов из предыдущего раунда; выполнение пропущено"
"Duplicate of an earlier call; execution skipped": "Повторный вызов предыдущего вызова; выполнение пропущено"
"Skipped (duplicate call)": "Пропущено (повторный вызов)"
"[Duplicate skipped: {0}] {1}": "[Повтор пропущен: {0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[Повторно использовано: {0}] Аргументы совпадают с предыдущим вызовом; используется предыдущий результат"
"Identical call already failed; duplicate execution skipped": "Идентичный вызов уже завершился ошибкой; повторное выполнение пропущено"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[Повторная ошибка: {0}] Тот же вызов с этими аргументами уже завершился ошибкой: {1}. Не повторяй его без изменений; измени аргументы или перейди к другому инструменту или подходу."
"Unknown reason": "Неизвестная причина"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[Система] Инструменты завершались ошибкой {0} раундов подряд. Попробуй другой подход или вызови инструмент ask_user, чтобы попросить помощи у пользователя."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Система] Вызовы инструментов завершались ошибкой {0} раундов подряд (инструменты с ошибкой: {1}). Прекрати повторять те же инструменты; измени аргументы или перейди к другому инструменту или подходу и при необходимости вызови ask_user."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Система] Приведённые ниже более ранние результаты инструментов сжаты в сводку (вызови инструменты снова, если нужны подробности):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Содержимое слишком длинное; {0} символов в середине опущено, исходная длина {1} символов; сузь диапазон или вызови инструмент снова, чтобы получить полное содержимое)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "Инструмент {0} заблокирован на уровне кода (операция высокого риска)"
"Tool {0} was rejected by the user": "Пользователь отклонил выполнение инструмента {0}"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "Поставщик инструментов временно недоступен (разомкнут предохранитель); восстановление ожидается через {0} с. Обратитесь к администратору для сброса предохранителя, если нужно повторить попытку сейчас"
"Tool {0} returned an empty result": "Инструмент {0} вернул пустой результат"
"[{0} call failed] ": "[Ошибка вызова {0}] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Отображено в клиенте: {0}] Результат уже отображён в интерфейсе пользователя; не вставляй ссылки на изображения или пути к файлам в ответ"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "Инструмент {0} ожидает такую схему параметров: {1}. Повтори вызов согласно схеме."
