"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[Powtórzony błąd: {0}] To samo wywołanie z tymi argumentami już się nie powiodło: {1}. Nie ponawiaj bez zmian; zmień argumenty albo użyj innego narzędzia lub podejścia."
"Unknown reason": "Nieznany powód"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[System] Narzędzia zawiodły przez {0} kolejnych rund. Wypróbuj inne podejście albo wywołaj narzędzie ask_user, aby poprosić użytkownika o pomoc."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[System] Wywołania narzędzi zawiodły przez {0} kolejnych rund (narzędzia z błędem: {1}). Przestań ponawiać te same narzędzia; zmień argumenty albo użyj innego narzędzia lub podejścia, a w razie potrzeby wywołaj ask_user."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[System] Poniższe wcześniejsze wyniki narzędzi zostały skompresowane do podsumowania (wywołaj narzędzia ponownie, jeśli potrzebujesz szczegółów):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Treść zbyt długa; pominięto {0} znaków w środku, pierwotna długość {1} znaków; zawęź zakres albo wywołaj narzędzie ponownie, aby uzyskać pełną treść)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "Narzędzie {0} jest zablokowane przez warstwę kodu (operacja wysokiego ryzyka)"
"Tool {0} was rejected by the user": "Użytkownik odrzucił wykonanie narzędzia {0}"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "Dostawca narzędzi jest tymczasowo niedostępny (otwarty bezpiecznik); oczekiwane przywrócenie za {0}s. Skontaktuj się z administratorem, aby zresetować bezpiecznik, jeśli musisz teraz ponowić próbę"
"Tool {0} returned an empty result": "Narzędzie {0} zwróciło pusty wynik"
"[{0} call failed] ": "[Błąd wywołania {0}] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Wyrenderowano w kliencie: {0}] Wynik jest już wyświetlony w interfejsie użytkownika; nie wstawiaj linków do obrazów ani ścieżek plików w odpowiedzi"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "Narzędzie {0} oczekuje tego schematu parametrów: {1}. Ponów próbę zgodnie ze schematem."
