"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[System] Na podstawie powyższych wyników narzędzi podaj bezpośrednio ostateczną odpowiedź. Nie wywołuj już żadnych narzędzi."
"Duplicate call from a previous round; execution skipped": "Zduplikowane wywołanie z poprzedniej rundy; wykonanie pominięte"
