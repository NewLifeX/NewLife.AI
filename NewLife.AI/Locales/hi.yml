"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[सिस्टम] ऊपर दिए गए टूल परिणामों के आधार पर सीधे अंतिम उत्तर दें। और कोई टूल न कॉल करें।"
"Duplicate call from a previous round; execution skipped": "पिछले राउंड से डुप्लिकेट कॉल; निष्पादन छोड़ा गया"
"Duplicate of an earlier call; execution skipped": "पिछली कॉल का डुप्लिकेट; निष्पादन छोड़ा गया"
"Skipped (duplicate call)": "छोड़ा गया (डुप्लिकेट कॉल)"
"[Duplicate skipped: {0}] {1}": "[डुप्लिकेट छोड़ा गया: {0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[पुनः उपयोग किया गया: {0}] आर्ग्युमेंट पिछली कॉल के समान हैं; पिछला परिणाम पुनः उपयोग हो रहा है"
"Identical call already failed; duplicate execution skipped": "समान कॉल पहले ही विफल हो चुकी है; डुप्लिकेट निष्पादन छोड़ा गया"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[बार-बार विफलता: {0}] इन आर्ग्युमेंट के साथ वही कॉल पहले विफल हो चुकी है: {1}। जैसा है वैसा पुनः प्रयास न करें; आर्ग्युमेंट बदलें या किसी अन्य टूल या तरीके पर जाएँ।"
"Unknown reason": "अज्ञात कारण"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[सिस्टम] टूल {0} राउंड लगातार विफल रहे। कोई दूसरा तरीका आज़माएँ या उपयोगकर्ता से सहायता माँगने के लिए ask_user टूल कॉल करें।"
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[सिस्टम] टूल कॉल {0} राउंड लगातार विफल रहे (विफल टूल: {1})। वही टूल दोहराना बंद करें; आर्ग्युमेंट बदलें या किसी अन्य टूल या तरीके पर जाएँ, और आवश्यकता होने पर ask_user कॉल करें।"
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[सिस्टम] नीचे दिए गए पहले के टूल परिणाम सारांश में संकुचित किए गए हैं (यदि विवरण चाहिए तो टूल फिर से कॉल करें):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(सामग्री बहुत लंबी है; बीच के {0} अक्षर छोड़े गए, मूल लंबाई {1} अक्षर; पूरी सामग्री के लिए सीमा छोटी करें या टूल फिर से कॉल करें)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "टूल {0} को कोड परत द्वारा अवरुद्ध किया गया है (उच्च जोखिम वाला ऑपरेशन)"
"Tool {0} was rejected by the user": "उपयोगकर्ता ने टूल {0} का निष्पादन अस्वीकार किया"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "टूल प्रदाता अस्थायी रूप से अनुपलब्ध है (सर्किट खुला) और लगभग {0} सेकंड में पुनः सक्रिय होने की अपेक्षा है। यदि अभी पुनः प्रयास करना हो तो सर्किट ब्रेकर रीसेट करने के लिए व्यवस्थापक से संपर्क करें"
"Tool {0} returned an empty result": "टूल {0} ने खाली परिणाम लौटाया"
"[{0} call failed] ": "[{0} कॉल विफल] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[क्लाइंट में रेंडर किया गया: {0}] परिणाम पहले ही उपयोगकर्ता इंटरफ़ेस में रेंडर हो चुका है; उत्तर में छवि लिंक या फ़ाइल पथ न डालें"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "टूल {0} इस पैरामीटर स्कीमा की अपेक्षा करता है: {1}। स्कीमा के अनुसार पुनः प्रयास करें।"
