"Tool '{0}' not found in the server capabilities.": "सर्वर क्षमताओं में टूल '{0}' नहीं मिला।"
"Resource '{0}' not found in the server capabilities.": "सर्वर क्षमताओं में संसाधन '{0}' नहीं मिला।"
"Prompt '{0}' not found in the server capabilities.": "सर्वर क्षमताओं में प्रॉम्प्ट '{0}' नहीं मिला।"
"Missing required argument '{0}' for tool '{1}'": "टूल '{1}' के लिए आवश्यक तर्क '{0}' अनुपस्थित है"
"Rerank call failed": "रीरैंक कॉल विफल रहा"
"Tool not found: '{0}', searched {1} in {2} providers": "टूल नहीं मिला: '{0}', {2} प्रदाताओं में {1} खोजे गए"
"Read the content of a file, with optional line-range selection. Returns text prefixed with line numbers": "किसी फ़ाइल की सामग्री पढ़ता है, वैकल्पिक पंक्ति-सीमा के साथ। टेक्स्ट को पंक्ति संख्याओं के साथ लौटाता है"
"File path relative to the workspace": "फ़ाइल पथ, कार्यक्षेत्र के सापेक्ष"
"Start line number (1-based); omit to read from the first line": "प्रारंभिक पंक्ति संख्या (1 से शुरू); पहली पंक्ति से पढ़ने के लिए खाली छोड़ें"
"End line number (inclusive); omit to read to the end": "अंतिम पंक्ति संख्या (सम्मिलित); अंत तक पढ़ने के लिए खाली छोड़ें"
"Create a file or overwrite its content. Writing outside the workspace requires approval": "फ़ाइल बनाता है या उसकी सामग्री बदल देता है। कार्यक्षेत्र के बाहर लिखने के लिए स्वीकृति आवश्यक है"
"Content to write": "लिखी जाने वाली सामग्री"
"List a directory tree as text, with an optional recursion depth limit": "फ़ोल्डर वृक्ष को टेक्स्ट के रूप में दिखाता है, वैकल्पिक पुनरावर्तन गहराई सीमा के साथ"
"Directory path relative to the workspace; defaults to the workspace root": "फ़ोल्डर पथ, कार्यक्षेत्र के सापेक्ष; डिफ़ॉल्ट रूप से कार्यक्षेत्र का मूल"
"Maximum recursion depth. Default 2": "अधिकतम पुनरावर्तन गहराई। डिफ़ॉल्ट 2"
"Search files by name pattern; supports ** recursive matching": "फ़ाइलों को नाम पैटर्न से खोजता है; ** के माध्यम से पुनरावर्ती मिलान समर्थित है"
"glob pattern, e.g. **/*.cs": "ग्लोब पैटर्न, जैसे **/*.cs"
"Directory to start searching from; defaults to the workspace root": "वह फ़ोल्डर जहाँ से खोज शुरू होती है; डिफ़ॉल्ट रूप से कार्यक्षेत्र का मूल"
"Search file contents for text matching a regular expression, with file-type filtering and a result limit": "फ़ाइल सामग्री में रेगुलर एक्सप्रेशन से मेल खाता टेक्स्ट खोजता है, फ़ाइल प्रकार के अनुसार फ़िल्टर और परिणाम सीमा के साथ"
"Regular expression pattern": "रेगुलर एक्सप्रेशन पैटर्न"
"File glob pattern to restrict the search, e.g. **/*.cs": "खोज सीमित करने के लिए फ़ाइल ग्लोब पैटर्न, जैसे **/*.cs"
"Maximum number of results. Default 50": "अधिकतम परिणाम संख्या। डिफ़ॉल्ट 50"
"Run a shell command and return its standard output and standard error. Running outside the workspace requires approval": "शेल कमांड चलाता है और मानक आउटपुट तथा मानक त्रुटि लौटाता है। कार्यक्षेत्र के बाहर चलाने के लिए स्वीकृति आवश्यक है"
"Command to run, e.g. dotnet build": "चलाया जाने वाला कमांड, जैसे dotnet build"
"Working directory; defaults to the workspace root": "कार्य निर्देशिका; डिफ़ॉल्ट रूप से कार्यक्षेत्र का मूल"
"Timeout in seconds. Default 120": "सेकंड में समय-सीमा। डिफ़ॉल्ट 120"
"Run dotnet build and parse the MSBuild-formatted error messages from the output": "dotnet build चलाता है और आउटपुट से MSBuild प्रारूप की त्रुटि संदेशों का विश्लेषण करता है"
"Project file path or directory; defaults to the workspace root": "प्रोजेक्ट फ़ाइल या फ़ोल्डर का पथ; डिफ़ॉल्ट रूप से कार्यक्षेत्र का मूल"
"Pause and ask the user a question when the agent is uncertain. Only effective in a console environment": "जब एजेंट अनिश्चित हो तो रुककर उपयोगकर्ता से पूछता है। केवल टर्मिनल वातावरण में काम करता है"
"Question to ask the user": "उपयोगकर्ता से पूछा जाने वाला प्रश्न"
"Get the current date and time, including the full date, day of week, time, time zone, and Unix timestamp": "वर्तमान तिथि और समय लौटाता है, जिसमें पूर्ण तिथि, सप्ताह का दिन, समय, समय क्षेत्र और Unix टाइमस्टैम्प शामिल हैं"
"Evaluate a mathematical expression. Supports addition, subtraction, multiplication, division, parentheses, and modulo": "गणितीय व्यंजक की गणना करता है। जोड़, घटाव, गुणा, भाग, कोष्ठक और शेषफल समर्थित हैं"
"Mathematical expression, e.g. (3 + 5) * 2 - 10 / 3": "गणितीय व्यंजक, जैसे (3 + 5) * 2 - 10 / 3"
"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "दिए गए URL की सामग्री लाता है और मुख्य टेक्स्ट निकालता है। लेख, दस्तावेज़ और सार्वजनिक वेब पृष्ठ पढ़ने के लिए उपयोगी"
"Web page address to fetch; must be a full http/https URL": "लाए जाने वाले वेब पृष्ठ का पता; पूर्ण http/https URL होना चाहिए"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "लौटाए जाने वाले अधिकतम अक्षर, ताकि बहुत लंबी सामग्री बहुत अधिक टोकन न ले। डिफ़ॉल्ट 5000"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "सर्च इंजन से इंटरनेट पर खोजता है और शीर्षक, लिंक तथा अंश लौटाता है। ताज़ा समाचार, तथ्य-जाँच और समान कार्यों के लिए उपयोगी"
"Search keywords or a natural language question": "खोज कीवर्ड या प्राकृतिक भाषा में प्रश्न"
"Number of results to return, between 1 and 10. Default 5": "लौटाए जाने वाले परिणामों की संख्या, 1 से 10 के बीच। डिफ़ॉल्ट 5"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "किसी IP पते का स्थान खोजता है (देश, प्रांत, शहर, सेवा प्रदाता)। यदि ip खाली हो तो इस मशीन का वर्तमान सार्वजनिक IP खोजा जाता है"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "खोजा जाने वाला IPv4/IPv6 पता; इस मशीन के वर्तमान सार्वजनिक IP के लिए खाली छोड़ें"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "किसी शहर का वर्तमान मौसम लौटाता है, जिसमें तापमान, आर्द्रता, हवा की गति और मौसम की स्थिति शामिल है। API कुंजी आवश्यक नहीं"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "शहर का नाम; चीनी और अंग्रेज़ी समर्थित हैं, जैसे Shanghai, 上海, New York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "तापमान इकाई: C (सेल्सियस, डिफ़ॉल्ट) या F (फ़ारेनहाइट)"
"Translate text into the target language. Supports more than 60 languages": "टेक्स्ट का लक्ष्य भाषा में अनुवाद करता है। 60 से अधिक भाषाएँ समर्थित हैं"
"Text to translate": "अनुवाद किया जाने वाला टेक्स्ट"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "लक्ष्य भाषा कोड, जैसे zh (चीनी), en (अंग्रेज़ी), ja (जापानी), fr (फ़्रेंच), de (जर्मन), ko (कोरियाई)"
"Source language code; default auto (detect automatically)": "स्रोत भाषा कोड; डिफ़ॉल्ट auto (स्वचालित पहचान)"
