"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[Falha repetida: {0}] A mesma chamada com estes argumentos já falhou: {1}. Não repita como está; altere os argumentos ou mude de ferramenta ou abordagem."
"Unknown reason": "Motivo desconhecido"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[Sistema] As ferramentas falharam por {0} rodadas consecutivas. Tente outra abordagem ou chame a ferramenta ask_user para pedir ajuda ao usuário."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Sistema] As chamadas de ferramentas falharam por {0} rodadas consecutivas (ferramentas com falha: {1}). Pare de repetir as mesmas ferramentas; altere os argumentos ou mude de ferramenta ou abordagem e chame ask_user se precisar de ajuda."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Sistema] Os resultados anteriores de ferramentas foram compactados em um resumo (chame as ferramentas novamente se precisar de detalhes):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Conteúdo muito longo; {0} caracteres no meio foram omitidos, comprimento original {1} caracteres; reduza o intervalo ou chame a ferramenta novamente para obter o conteúdo completo)...\n"
