"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "O provedor de ferramentas está temporariamente indisponível (circuito aberto) e deve se recuperar em {0}s. Contate o administrador para redefinir o disjuntor se precisar tentar novamente agora"
