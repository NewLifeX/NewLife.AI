"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "يجلب محتوى عنوان URL المحدد ويستخرج النص الرئيسي. مفيد لقراءة المقالات والمستندات وأي صفحة ويب عامة"
"Web page address to fetch; must be a full http/https URL": "عنوان صفحة الويب المراد جلبها؛ يجب أن يكون عنوان URL كاملًا http/https"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "أقصى عدد أحرف يُعاد، حتى لا يستهلك المحتوى الطويل جدًا عددًا كبيرًا من الرموز. الافتراضي 5000"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "يبحث في الإنترنت بمحرك بحث ويعيد العناوين والروابط والمقتطفات. مفيد للأخبار الحديثة والتحقق من الحقائق والمهام المشابهة"
"Search keywords or a natural language question": "كلمات البحث أو سؤال بلغة طبيعية"
"Number of results to return, between 1 and 10. Default 5": "عدد النتائج المراد إرجاعها، بين 1 و10. الافتراضي 5"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "يبحث عن موقع عنوان IP (الدولة والمقاطعة والمدينة ومزود الخدمة). عند حذف ip يتم البحث عن عنوان IP العام الحالي لهذا الجهاز"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "عنوان IPv4/IPv6 المراد البحث عنه؛ اتركه فارغًا للبحث عن عنوان IP العام الحالي لهذا الجهاز"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "يعيد الطقس الحالي لمدينة، بما في ذلك درجة الحرارة والرطوبة وسرعة الرياح والأحوال الجوية. لا يلزم مفتاح API"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "اسم المدينة؛ يدعم الصينية والإنجليزية، مثل Shanghai و上海 وNew York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "وحدة الحرارة: C (مئوية، الافتراضي) أو F (فهرنهايت)"
"Translate text into the target language. Supports more than 60 languages": "يترجم النص إلى اللغة الهدف. يدعم أكثر من 60 لغة"
"Text to translate": "النص المراد ترجمته"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "رمز اللغة الهدف، مثل zh (الصينية) وen (الإنجليزية) وja (اليابانية) وfr (الفرنسية) وde (الألمانية) وko (الكورية)"
"Source language code; default auto (detect automatically)": "رمز اللغة المصدر؛ الافتراضي auto (كشف تلقائي)"
"Current Time": "الوقت الحالي"
"Calculator": "الحاسبة"
"Web Fetch": "جلب صفحة ويب"
"Web Search": "البحث في الويب"
"IP Location": "موقع IP"
"Weather": "الطقس"
