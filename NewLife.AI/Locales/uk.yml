"Question to ask the user": "Запитання до користувача"
"Get the current date and time, including the full date, day of week, time, time zone, and Unix timestamp": "Повертає поточні дату й час: повну дату, день тижня, час, часовий пояс і мітку часу Unix"
"Evaluate a mathematical expression. Supports addition, subtraction, multiplication, division, parentheses, and modulo": "Обчислює математичний вираз. Підтримує додавання, віднімання, множення, ділення, дужки та остачу від ділення"
"Mathematical expression, e.g. (3 + 5) * 2 - 10 / 3": "Математичний вираз, наприклад (3 + 5) * 2 - 10 / 3"
"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "Отримує вміст указаної адреси URL і видобуває основний текст. Корисно для читання статей, документів і загальнодоступних вебсторінок"
"Web page address to fetch; must be a full http/https URL": "Адреса вебсторінки для отримання; має бути повною адресою http/https"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "Максимальна кількість символів у відповіді, щоб занадто довгий вміст не споживав надто багато токенів. Типово 5000"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "Шукає в інтернеті через пошукову систему та повертає заголовки, посилання й уривки. Корисно для свіжих новин, перевірки фактів і подібних завдань"
"Search keywords or a natural language question": "Ключові слова для пошуку або запитання природною мовою"
"Number of results to return, between 1 and 10. Default 5": "Кількість результатів, від 1 до 10. Типово 5"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "Визначає розташування IP-адреси (країна, область, місто, провайдер). Якщо ip пропущено, визначається поточна публічна IP-адреса цього комп'ютера"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "Адреса IPv4/IPv6 для пошуку; залиште порожнім для поточної публічної IP-адреси цього комп'ютера"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "Повертає поточну погоду в місті: температуру, вологість, швидкість вітру та умови. Ключ API не потрібен"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "Назва міста; підтримуються китайська та англійська, наприклад Shanghai, 上海, New York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "Одиниця температури: C (Цельсій, типово) або F (Фаренгейт)"
"Translate text into the target language. Supports more than 60 languages": "Перекладає текст цільовою мовою. Підтримує понад 60 мов"
"Text to translate": "Текст для перекладу"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "Код цільової мови, наприклад zh (китайська), en (англійська), ja (японська), fr (французька), de (німецька), ko (корейська)"
"Source language code; default auto (detect automatically)": "Код мови оригіналу; типово auto (автоматичне визначення)"
