"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[Система] На основі результатів інструментів вище одразу дай остаточну відповідь. Не викликай більше інструменти."
"Duplicate call from a previous round; execution skipped": "Повторний виклик із попереднього раунду; виконання пропущено"
"Duplicate of an earlier call; execution skipped": "Повторний виклик попереднього виклику; виконання пропущено"
"Skipped (duplicate call)": "Пропущено (повторний виклик)"
"[Duplicate skipped: {0}] {1}": "[Повтор пропущено: {0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[Використано повторно: {0}] Аргументи збігаються з попереднім викликом; використовується попередній результат"
"Identical call already failed; duplicate execution skipped": "Ідентичний виклик уже завершився помилкою; повторне виконання пропущено"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[Повторна помилка: {0}] Той самий виклик із цими аргументами вже завершився помилкою: {1}. Не повторюй його без змін; зміни аргументи або перейди до іншого інструмента чи підходу."
"Unknown reason": "Невідома причина"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[Система] Інструменти завершувалися помилкою {0} раундів поспіль. Спробуй інший підхід або виклич інструмент ask_user, щоб попросити допомоги в користувача."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Система] Виклики інструментів завершувалися помилкою {0} раундів поспіль (інструменти з помилкою: {1}). Припини повторювати ті самі інструменти; зміни аргументи або перейди до іншого інструмента чи підходу і за потреби виклич ask_user."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Система] Наведені нижче попередні результати інструментів стиснуто в підсумок (виклич інструменти знову, якщо потрібні подробиці):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Вміст задовгий; {0} символів усередині пропущено, початкова довжина {1} символів; звузь діапазон або виклич інструмент знову, щоб отримати повний вміст)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "Інструмент {0} заблоковано на рівні коду (операція високого ризику)"
"Tool {0} was rejected by the user": "Користувач відхилив виконання інструмента {0}"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "Постачальник інструментів тимчасово недоступний (запобіжник розімкнено); очікується відновлення через {0} с. Зверніться до адміністратора, щоб скинути запобіжник, якщо потрібно повторити спробу зараз"
"Tool {0} returned an empty result": "Інструмент {0} повернув порожній результат"
"[{0} call failed] ": "[Помилка виклику {0}] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Відображено в клієнті: {0}] Результат уже відображено в інтерфейсі користувача; не вставляй посилання на зображення або шляхи до файлів у відповідь"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "Інструмент {0} очікує таку схему параметрів: {1}. Повтори виклик згідно зі схемою."
