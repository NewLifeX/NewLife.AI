"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[Rendszer] A fenti eszközeredmények alapján add meg közvetlenül a végleges választ. Ne hívj meg több eszközt."
"Duplicate call from a previous round; execution skipped": "Ismétlődő hívás egy korábbi körből; a végrehajtás kihagyva"
"Duplicate of an earlier call; execution skipped": "Korábbi hívás ismétlődése; a végrehajtás kihagyva"
"Skipped (duplicate call)": "Kihagyva (ismétlődő hívás)"
"[Duplicate skipped: {0}] {1}": "[Ismétlődés kihagyva: {0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[Újrahasznosítva: {0}] Az argumentumok megegyeznek egy korábbi hívással; a korábbi eredmény újrahasznosítva"
"Identical call already failed; duplicate execution skipped": "Ugyanaz a hívás már sikertelen volt; az ismétlődő végrehajtás kihagyva"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[Ismétlődő hiba: {0}] Ugyanaz a hívás ezekkel az argumentumokkal már sikertelen volt: {1}. Ne próbáld meg újra változatlanul; módosítsd az argumentumokat, vagy válts másik eszközre vagy megközelítésre."
"Unknown reason": "Ismeretlen ok"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[Rendszer] Az eszközök {0} körön át egymás után sikertelenek voltak. Próbálj más megközelítést, vagy hívd meg az ask_user eszközt, hogy segítséget kérj a felhasználótól."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Rendszer] Az eszközhívások {0} körön át egymás után sikertelenek voltak (sikertelen eszközök: {1}). Hagyd abba ugyanazon eszközök ismétlését; módosítsd az argumentumokat, vagy válts másik eszközre vagy megközelítésre, és szükség esetén hívd meg az ask_user eszközt."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Rendszer] Az alábbi korábbi eszközeredmények összefoglalóvá tömörítve (hívd meg újra az eszközöket, ha részletekre van szükség):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(A tartalom túl hosszú; {0} karakter kimaradt a közepéről, eredeti hossz {1} karakter; szűkítsd a tartományt vagy hívd meg újra az eszközt a teljes tartalomért)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "A(z) {0} eszközt a kódréteg blokkolja (nagy kockázatú művelet)"
"Tool {0} was rejected by the user": "A felhasználó elutasította a(z) {0} eszköz végrehajtását"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "Az eszközszolgáltató átmenetileg nem elérhető (áramkör nyitva), várhatóan {0}s múlva helyreáll. Ha most kell újrapróbálnia, kérje meg a rendszergazdát az áramkör-megszakító visszaállítására"
"Tool {0} returned an empty result": "A(z) {0} eszköz üres eredményt adott vissza"
"[{0} call failed] ": "[{0} hívás sikertelen] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Az ügyfélben megjelenítve: {0}] Az eredmény már meg van jelenítve a felhasználói felületen; ne illessz be képhivatkozásokat vagy fájlútvonalakat a válaszba"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "A(z) {0} eszköz ezt a paramétersémát várja: {1}. Próbáld újra a séma szerint."
