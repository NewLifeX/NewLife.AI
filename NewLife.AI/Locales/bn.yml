"[ToolRegistry] Tool {0} is already registered; skipped duplicate (source: {1}.{2})": "[ToolRegistry] টুল {0} ইতিমধ্যে নিবন্ধিত, ডুপ্লিকেট নিবন্ধন এড়িয়ে যাওয়া হয়েছে (উৎস: {1}.{2})"
"[ToolRegistry] JSON parse failed, Length={0}, error: {1}, first 200 chars: {2}": "[ToolRegistry] JSON পার্স ব্যর্থ, Length={0}, ত্রুটি: {1}, প্রথম 200 অক্ষর: {2}"
"[{0}] Request failed; retry {1}/{2} in {3}ms: {4}": "[{0}] অনুরোধ ব্যর্থ, পুনরায় চেষ্টা {1}/{2}, অপেক্ষা {3}ms: {4}"
"[{0}] Streaming request failed; retry {1}/{2} in {3}ms: {4}": "[{0}] স্ট্রিমিং অনুরোধ ব্যর্থ, পুনরায় চেষ্টা {1}/{2}, অপেক্ষা {3}ms: {4}"
"Planning produced no tasks; pipeline terminated": "পরিকল্পনা থেকে কোনো কাজ তৈরি হয়নি, পাইপলাইন সমাপ্ত"
"Pipeline execution error: {0}": "পাইপলাইন সম্পাদন ত্রুটি: {0}"
"Background generation completed, message {0}, content length {1}": "ব্যাকগ্রাউন্ড তৈরি সম্পন্ন, বার্তা {0}, বিষয়বস্তুর দৈর্ঘ্য {1}"
"Background generation failed, message {0}: {1}": "ব্যাকগ্রাউন্ড তৈরি ব্যর্থ, বার্তা {0}: {1}"
"Background generation callback failed: {0}": "ব্যাকগ্রাউন্ড তৈরি কলব্যাক ব্যর্থ: {0}"
"[{0}] GetResponseAsync error! {1}": "[{0}] GetResponseAsync ত্রুটি! {1}"
"Method '{0}' not found in MCP server capabilities.": "MCP সার্ভার সক্ষমতায় পদ্ধতি '{0}' পাওয়া যায়নি।"
"Tool '{0}' not found in the server capabilities.": "সার্ভার সক্ষমতায় টুল '{0}' পাওয়া যায়নি।"
"Resource '{0}' not found in the server capabilities.": "সার্ভার সক্ষমতায় রিসোর্স '{0}' পাওয়া যায়নি।"
"Prompt '{0}' not found in the server capabilities.": "সার্ভার সক্ষমতায় Prompt '{0}' পাওয়া যায়নি।"
"Missing required argument '{0}' for tool '{1}'": "টুল '{1}' এর জন্য প্রয়োজনীয় আর্গুমেন্ট '{0}' অনুপস্থিত"
"Rerank call failed": "রির্যাঙ্ক কল ব্যর্থ হয়েছে"
"Tool not found: '{0}', searched {1} in {2} providers": "টুল পাওয়া যায়নি: '{0}', {2}টি প্রদানকারীতে {1}টি খোঁজা হয়েছে"
"Read the content of a file, with optional line-range selection. Returns text prefixed with line numbers": "একটি ফাইলের বিষয়বস্তু পড়ে, ঐচ্ছিক লাইন-পরিসীমা সহ। টেক্সট লাইন নম্বরসহ ফিরিয়ে দেয়"
"File path relative to the workspace": "ফাইলের পথ, কার্যস্থলের সাপেক্ষে"
"Start line number (1-based); omit to read from the first line": "শুরুর লাইন নম্বর (১ থেকে শুরু); প্রথম লাইন থেকে পড়তে খালি রাখুন"
"End line number (inclusive); omit to read to the end": "শেষ লাইন নম্বর (অন্তর্ভুক্ত); শেষ পর্যন্ত পড়তে খালি রাখুন"
"Create a file or overwrite its content. Writing outside the workspace requires approval": "একটি ফাইল তৈরি করে বা তার বিষয়বস্তু প্রতিস্থাপন করে। কার্যস্থলের বাইরে লেখার জন্য অনুমোদন প্রয়োজন"
"Content to write": "যে বিষয়বস্তু লেখা হবে"
"List a directory tree as text, with an optional recursion depth limit": "ফোল্ডার গাছ টেক্সট হিসেবে দেখায়, ঐচ্ছিক পুনরাবৃত্তি গভীরতার সীমা সহ"
"Directory path relative to the workspace; defaults to the workspace root": "ফোল্ডারের পথ, কার্যস্থলের সাপেক্ষে; ডিফল্ট কার্যস্থলের মূল"
"Maximum recursion depth. Default 2": "সর্বোচ্চ পুনরাবৃত্তি গভীরতা। ডিফল্ট 2"
"Search files by name pattern; supports ** recursive matching": "নামের প্যাটার্ন অনুযায়ী ফাইল খোঁজে; ** দিয়ে পুনরাবৃত্ত মিলন সমর্থিত"
"glob pattern, e.g. **/*.cs": "গ্লোব প্যাটার্ন, যেমন **/*.cs"
"Directory to start searching from; defaults to the workspace root": "যে ফোল্ডার থেকে অনুসন্ধান শুরু হয়; ডিফল্ট কার্যস্থলের মূল"
"Search file contents for text matching a regular expression, with file-type filtering and a result limit": "ফাইলের বিষয়বস্তুতে রেগুলার এক্সপ্রেশনের সাথে মেলে এমন টেক্সট খোঁজে, ফাইলের ধরন অনুযায়ী ফিল্টার এবং ফলাফলের সীমা সহ"
"Regular expression pattern": "রেগুলার এক্সপ্রেশন প্যাটার্ন"
"File glob pattern to restrict the search, e.g. **/*.cs": "অনুসন্ধান সীমিত করার জন্য ফাইল গ্লোব প্যাটার্ন, যেমন **/*.cs"
"Maximum number of results. Default 50": "সর্বোচ্চ ফলাফল সংখ্যা। ডিফল্ট 50"
"Run a shell command and return its standard output and standard error. Running outside the workspace requires approval": "একটি শেল কমান্ড চালায় এবং প্রমিত আউটপুট ও প্রমিত ত্রুটি ফিরিয়ে দেয়। কার্যস্থলের বাইরে চালানোর জন্য অনুমোদন প্রয়োজন"
"Command to run, e.g. dotnet build": "যে কমান্ড চালানো হবে, যেমন dotnet build"
"Working directory; defaults to the workspace root": "কর্ম ডিরেক্টরি; ডিফল্ট কার্যস্থলের মূল"
"Timeout in seconds. Default 120": "সেকেন্ডে সময়সীমা। ডিফল্ট 120"
"Run dotnet build and parse the MSBuild-formatted error messages from the output": "dotnet build চালায় এবং আউটপুট থেকে MSBuild ফরম্যাটের ত্রুটি বার্তা বিশ্লেষণ করে"
"Project file path or directory; defaults to the workspace root": "প্রকল্প ফাইল বা ফোল্ডারের পথ; ডিফল্ট কার্যস্থলের মূল"
"Pause and ask the user a question when the agent is uncertain. Only effective in a console environment": "এজেন্ট অনিশ্চিত হলে থেমে ব্যবহারকারীকে জিজ্ঞাসা করে। শুধু টার্মিনাল পরিবেশে কাজ করে"
"Question to ask the user": "ব্যবহারকারীকে জিজ্ঞাসা করার প্রশ্ন"
"Get the current date and time, including the full date, day of week, time, time zone, and Unix timestamp": "বর্তমান তারিখ ও সময় ফিরিয়ে দেয়, যার মধ্যে পূর্ণ তারিখ, সপ্তাহের দিন, সময়, সময় অঞ্চল এবং Unix টাইমস্ট্যাম্প রয়েছে"
"Evaluate a mathematical expression. Supports addition, subtraction, multiplication, division, parentheses, and modulo": "একটি গাণিতিক অভিব্যক্তি গণনা করে। যোগ, বিয়োগ, গুণ, ভাগ, বন্ধনী এবং ভাগশেষ সমর্থিত"
"Mathematical expression, e.g. (3 + 5) * 2 - 10 / 3": "গাণিতিক অভিব্যক্তি, যেমন (3 + 5) * 2 - 10 / 3"
"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "প্রদত্ত URL-এর বিষয়বস্তু নিয়ে আসে এবং মূল টেক্সট বের করে। নিবন্ধ, নথি এবং প্রকাশ্য ওয়েব পৃষ্ঠা পড়ার জন্য উপযোগী"
"Web page address to fetch; must be a full http/https URL": "যে ওয়েব পৃষ্ঠার ঠিকানা নিয়ে আসতে হবে; সম্পূর্ণ http/https URL হতে হবে"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "সর্বোচ্চ কত অক্ষর ফেরত দেওয়া হবে, যাতে খুব লম্বা বিষয়বস্তু অতিরিক্ত টোকেন না নেয়। ডিফল্ট 5000"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "সার্চ ইঞ্জিন দিয়ে ইন্টারনেটে খোঁজে এবং শিরোনাম, লিংক ও সারাংশ ফিরিয়ে দেয়। সাম্প্রতিক খবর, তথ্য যাচাই এবং অনুরূপ কাজের জন্য উপযোগী"
"Search keywords or a natural language question": "অনুসন্ধান কীওয়ার্ড বা স্বাভাবিক ভাষার প্রশ্ন"
"Number of results to return, between 1 and 10. Default 5": "ফেরত দেওয়া ফলাফলের সংখ্যা, ১ থেকে ১০-এর মধ্যে। ডিফল্ট ৫"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "একটি IP ঠিকানার অবস্থান খোঁজে (দেশ, প্রদেশ, শহর, সেবা প্রদানকারী)। ip খালি থাকলে এই মেশিনের বর্তমান পাবলিক IP খোঁজা হয়"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "যে IPv4/IPv6 ঠিকানা খোঁজা হবে; এই মেশিনের বর্তমান পাবলিক IP-র জন্য খালি রাখুন"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "একটি শহরের বর্তমান আবহাওয়া ফিরিয়ে দেয়, যার মধ্যে তাপমাত্রা, আর্দ্রতা, বাতাসের গতি এবং আবহাওয়ার অবস্থা রয়েছে। API কী প্রয়োজন নেই"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "শহরের নাম; চীনা এবং ইংরেজি সমর্থিত, যেমন Shanghai, 上海, New York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "তাপমাত্রার একক: C (সেলসিয়াস, ডিফল্ট) অথবা F (ফারেনহাইট)"
"Translate text into the target language. Supports more than 60 languages": "টেক্সট লক্ষ্য ভাষায় অনুবাদ করে। ৬০-এর বেশি ভাষা সমর্থিত"
"Text to translate": "যে টেক্সট অনুবাদ করতে হবে"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "লক্ষ্য ভাষার কোড, যেমন zh (চীনা), en (ইংরেজি), ja (জাপানি), fr (ফরাসি), de (জার্মান), ko (কোরিয়ান)"
"Source language code; default auto (detect automatically)": "উৎস ভাষার কোড; ডিফল্ট auto (স্বয়ংক্রিয় শনাক্তকরণ)"
