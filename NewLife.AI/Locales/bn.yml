"Context budget is near {0:N0} tokens (estimated {1:N0}); truncated tool results and continuing the tool loop": "কনটেক্সট বাজেট {0:N0} tokens এর কাছাকাছি (আনুমানিক {1:N0}), টুল ফলাফল কেটে দেওয়া হয়েছে, টুল কল লুপ চলমান"
"Context budget reached {0:N0} tokens (estimated {1:N0}) and cannot be reduced further; aborting the tool loop": "কনটেক্সট বাজেট {0:N0} tokens এ পৌঁছেছে (আনুমানিক {1:N0}) এবং আর কমানো সম্ভব নয়, টুল কল লুপ বাধাগ্রস্ত"
"Tool {0} execution error: {1}": "টুল {0} সম্পাদন ত্রুটি: {1}"
"Tool {0} in options.Tools has no provider route; it will be passed through to the client": "options.Tools এ টুল {0} এর কোনো Provider রুট নেই, এটি ক্লায়েন্ট দ্বারা পাস-থ্রু সম্পাদিত হবে"
"Unable to resolve tool name from method {0}.{1}": "পদ্ধতি {0}.{1} থেকে টুল নাম নির্ধারণ করা যায়নি"
"Method {0}.{1} produced no function definition": "পদ্ধতি {0}.{1} কোনো ফাংশন সংজ্ঞা তৈরি করেনি"
"Method {0}.{1} is missing ToolDescriptionAttribute": "পদ্ধতি {0}.{1} এ ToolDescriptionAttribute অনুপস্থিত"
