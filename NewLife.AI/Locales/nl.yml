"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[Systeem] Tools zijn {0} rondes achter elkaar mislukt. Probeer een andere aanpak of roep de ask_user-tool aan om de gebruiker om hulp te vragen."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Systeem] Toolaanroepen zijn {0} rondes achter elkaar mislukt (mislukte tools: {1}). Stop met het herhalen van dezelfde tools; wijzig de argumenten of kies een andere tool of aanpak en roep indien nodig de ask_user-tool aan."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Systeem] De onderstaande eerdere toolresultaten zijn samengevat (roep de tools opnieuw aan als details nodig zijn):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Inhoud te lang; {0} tekens in het midden zijn weggelaten, oorspronkelijke lengte {1} tekens; verklein het bereik of roep de tool opnieuw aan voor de volledige inhoud)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "Tool {0} is geblokkeerd door de codelaag (risicovolle bewerking)"
"Tool {0} was rejected by the user": "Tool {0} is geweigerd door de gebruiker"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "De toolprovider is tijdelijk niet beschikbaar (stroomkring open) en herstelt naar verwachting over {0}s. Neem contact op met de beheerder om de stroomonderbreker te resetten als je nu opnieuw wilt proberen"
"Tool {0} returned an empty result": "Tool {0} heeft een leeg resultaat geretourneerd"
"[{0} call failed] ": "[Aanroep van {0} mislukt] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Weergegeven in de client: {0}] Het resultaat is al weergegeven in de gebruikersinterface; voeg geen afbeeldingslinks of bestandspaden toe aan je antwoord"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "Tool {0} verwacht dit parameterschema: {1}. Probeer opnieuw volgens het schema."
