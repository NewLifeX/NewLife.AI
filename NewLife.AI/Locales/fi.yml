"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[Toistuva virhe: {0}] Sama kutsu näillä argumenteilla on jo epäonnistunut: {1}. Älä yritä uudelleen sellaisenaan; muuta argumentteja tai vaihda työkalua tai lähestymistapaa."
"Unknown reason": "Tuntematon syy"
