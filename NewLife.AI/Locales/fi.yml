"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Järjestelmä] Alla olevat aiemmat työkalutulokset on tiivistetty yhteenvetoon (kutsu työkaluja uudelleen, jos tarvitset yksityiskohtia):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Sisältö on liian pitkä; {0} merkkiä keskeltä jätettiin pois, alkuperäinen pituus {1} merkkiä; rajaa aluetta tai kutsu työkalua uudelleen saadaksesi koko sisällön)...\n"
