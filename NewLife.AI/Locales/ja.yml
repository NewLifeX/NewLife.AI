"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[システム] 上記のツール結果に基づき、最終回答を直接返してください。これ以上ツールを呼び出さないでください。"
"Duplicate call from a previous round; execution skipped": "前のラウンドからの重複呼び出しのため、実行をスキップしました"
"Duplicate of an earlier call; execution skipped": "先行する呼び出しとの重複のため、実行をスキップしました"
"Skipped (duplicate call)": "スキップしました（重複呼び出し）"
"[Duplicate skipped: {0}] {1}": "[重複をスキップ：{0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[再利用：{0}] 引数が先行する呼び出しと同一のため、以前の結果を再利用しました"
"Identical call already failed; duplicate execution skipped": "同一の呼び出しが既に失敗しているため、重複実行をスキップしました"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[繰り返し失敗：{0}] 同じ引数の呼び出しは既に失敗しています：{1}。そのまま再試行せず、引数を変更するか別のツール／方法に切り替えてください。"
"Unknown reason": "不明な理由"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[システム] ツールが {0} ラウンド連続で失敗しました。別の方法を試すか、ask_user ツールを呼び出してユーザーに支援を求めてください。"
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[システム] ツール呼び出しが {0} ラウンド連続で失敗しました（失敗ツール：{1}）。同じツールの再試行を止め、引数を変更するか別のツール／方法に切り替え、必要なら ask_user ツールを呼び出してください。"
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[システム] 以下の過去のツール結果は要約に圧縮されました（詳細が必要ならツールを再度呼び出してください）："
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(内容が長すぎるため中間の {0} 文字を省略しました。元の長さは {1} 文字です。全文が必要なら範囲を狭めるかツールを再度呼び出してください)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "ツール {0} はコード層により強制ブロックされています（高リスク操作）"
"Tool {0} was rejected by the user": "ツール {0} はユーザーにより拒否されました"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "ツールプロバイダーは一時的に利用できません（サーキットオープン）。約 {0} 秒後に復旧する見込みです。今すぐ再試行する必要がある場合は管理者にサーキットブレーカーのリセットを依頼してください"
"Tool {0} returned an empty result": "ツール {0} は空の結果を返しました"
"[{0} call failed] ": "[{0} 呼び出し失敗] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[クライアントに描画済み：{0}] 結果は既にユーザーインターフェースに描画されています。返信に画像リンクやファイルパスを挿入しないでください"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "ツール {0} が期待する引数スキーマ：{1}。スキーマに従って再試行してください。"
