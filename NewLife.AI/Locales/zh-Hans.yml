"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[系统提示] 请基于已有的工具调用结果，直接给出最终回答。不要再次调用工具。"
"Duplicate call from a previous round; execution skipped": "跨轮次重复调用，已跳过执行"
"Duplicate of an earlier call; execution skipped": "调用与前序重复，已跳过执行"
"Skipped (duplicate call)": "已跳过（重复调用）"
"[Duplicate skipped: {0}] {1}": "[已去重：{0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[已复用：{0}] 参数与前序调用相同，已复用此前生成的结果"
"Identical call already failed; duplicate execution skipped": "相同调用已失败，已跳过重复执行"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[重复失败：{0}] 相同参数调用此前已失败：{1}。请勿原样重试，请修改参数或改用其他工具/思路。"
"Unknown reason": "未知原因"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[系统提示] 工具已连续失败 {0} 轮。请换一种思路，或调用 ask_user 工具向用户寻求帮助。"
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[系统提示] 工具调用已连续失败 {0} 轮（失败工具：{1}）。请停止重试相同工具，修改参数或改用其他工具/思路，必要时调用 ask_user 工具向用户寻求帮助。"
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[系统提示] 以下早期工具调用结果已压缩为摘要（如需细节请重新调用工具获取）："
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(内容过长已省略中间 {0} 字符，原始 {1} 字符；如需完整内容请缩小查询范围或重新调用工具)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "工具 {0} 已被代码层强制阻断（高风险操作）"
"Tool {0} was rejected by the user": "工具 {0} 被用户拒绝执行"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "工具提供者暂时不可用（熔断中），预计 {0}s 后恢复。如需立即重试请联系管理员重置熔断器"
"Tool {0} returned an empty result": "工具 {0} 返回了空结果"
"[{0} call failed] ": "[{0} 调用失败] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[已渲染到客户端：{0}]，结果已渲染到用户界面，请勿在回复中插入图片链接或文件路径"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "工具 {0} 期望的参数 schema：{1}，请按 schema 重试。"
