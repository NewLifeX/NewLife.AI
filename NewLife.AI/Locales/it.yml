"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Sistema] Le chiamate agli strumenti hanno fallito per {0} turni consecutivi (strumenti falliti: {1}). Smetti di riprovare gli stessi strumenti; modifica gli argomenti o passa a un altro strumento o approccio e chiama ask_user se serve aiuto."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Sistema] I risultati precedenti degli strumenti sono stati compressi in un riepilogo (richiama gli strumenti se servono dettagli):"
