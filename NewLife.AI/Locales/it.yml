"Tool {0} is blocked by the code layer (high-risk operation)": "Lo strumento {0} è bloccato dal livello di codice (operazione ad alto rischio)"
"Tool {0} was rejected by the user": "Lo strumento {0} è stato rifiutato dall'utente"
