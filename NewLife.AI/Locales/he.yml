"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[מערכת] בהתבסס על תוצאות הכלים שלעיל, תן ישירות את התשובה הסופית. אל תקרא לכלים נוספים."
"Duplicate call from a previous round; execution skipped": "קריאה כפולה מסיבוב קודם; הביצוע דולג"
"Duplicate of an earlier call; execution skipped": "קריאה כפולה של קריאה קודמת; הביצוע דולג"
"Skipped (duplicate call)": "דולג (קריאה כפולה)"
"[Duplicate skipped: {0}] {1}": "[כפילות דולגה: {0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[נעשה בו שימוש חוזר: {0}] הארגומנטים זהים לקריאה קודמת; התוצאה הקודמת נעשה בה שימוש חוזר"
"Identical call already failed; duplicate execution skipped": "קריאה זהה כבר נכשלה; ביצוע כפול דולג"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[כשל חוזר: {0}] אותה קריאה עם הארגומנטים האלה כבר נכשלה: {1}. אל תנסה שוב כמו שהוא; שנה את הארגומנטים או עבור לכלי או גישה אחרים."
"Unknown reason": "סיבה לא ידועה"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[מערכת] הכלים נכשלו במשך {0} סבבים רצופים. נסה גישה אחרת או קרא לכלי ask_user כדי לבקש עזרה מהמשתמש."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[מערכת] קריאות הכלים נכשלו במשך {0} סבבים רצופים (כלים שנכשלו: {1}). הפסק לחזור על אותם כלים; שנה את הארגומנטים או עבור לכלי או גישה אחרים, וקרא ל-ask_user אם יש צורך."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[מערכת] תוצאות הכלים המוקדמות שלהלן דחוסו לתקציר (קרא לכלים שוב אם יש צורך בפרטים):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(התוכן ארוך מדי; הושמטו {0} תווים באמצע, האורך המקורי {1} תווים; צמצם את הטווח או קרא לכלי שוב כדי לקבל את התוכן המלא)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "הכלי {0} חסום על ידי שכבת הקוד (פעולה בסיכון גבוה)"
"Tool {0} was rejected by the user": "המשתמש דחה את הפעלת הכלי {0}"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "ספק הכלים אינו זמין זמנית (מפסק מעגל פתוח) וצפוי להתאושש בעוד {0} שניות. פנה למנהל המערכת לאיפוס מפסק המעגל אם יש צורך לנסות שוב כעת"
"Tool {0} returned an empty result": "הכלי {0} החזיר תוצאה ריקה"
"[{0} call failed] ": "[קריאה ל-{0} נכשלה] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[הוצג בלקוח: {0}] התוצאה כבר מוצגת בממשק המשתמש; אל תכניס קישורי תמונות או נתיבי קבצים בתשובה"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "הכלי {0} מצפה לסכימת הפרמטרים הזו: {1}. נסה שוב בהתאם לסכימה."
