"Timeout in seconds. Default 120": "פסק זמן בשניות. ברירת מחדל 120"
"Run dotnet build and parse the MSBuild-formatted error messages from the output": "מריץ dotnet build ומנתח הודעות שגיאה בפורמט MSBuild מתוך הפלט"
"Project file path or directory; defaults to the workspace root": "נתיב קובץ הפרויקט או התיקייה; ברירת המחדל היא שורש סביבת העבודה"
"Pause and ask the user a question when the agent is uncertain. Only effective in a console environment": "עוצר ושואל את המשתמש כאשר הסוכן אינו בטוח. פועל רק בסביבת מסוף"
"Question to ask the user": "השאלה למשתמש"
"Get the current date and time, including the full date, day of week, time, time zone, and Unix timestamp": "מחזיר את התאריך והשעה הנוכחיים, כולל התאריך המלא, היום בשבוע, השעה, אזור הזמן וחותמת הזמן של Unix"
"Evaluate a mathematical expression. Supports addition, subtraction, multiplication, division, parentheses, and modulo": "מחשב ביטוי מתמטי. תומך בחיבור, חיסור, כפל, חילוק, סוגריים ושארית חילוק"
"Mathematical expression, e.g. (3 + 5) * 2 - 10 / 3": "ביטוי מתמטי, למשל (3 + 5) * 2 - 10 / 3"
"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "מביא את תוכן כתובת ה-URL שצוינה ומחלץ את הטקסט הראשי. שימושי לקריאת מאמרים, מסמכים ודפי אינטרנט ציבוריים"
"Web page address to fetch; must be a full http/https URL": "כתובת דף האינטרנט להבאה; חייבת להיות כתובת http/https מלאה"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "מספר התווים המרבי שיוחזר, כדי שתוכן ארוך מאוד לא יצרוך יותר מדי אסימונים. ברירת מחדל 5000"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "מחפש באינטרנט באמצעות מנוע חיפוש ומחזיר כותרות, קישורים ותקצירים. שימושי לחדשות עדכניות, אימות עובדות ומשימות דומות"
"Search keywords or a natural language question": "מילות חיפוש או שאלה בשפה טבעית"
"Number of results to return, between 1 and 10. Default 5": "מספר התוצאות שיוחזרו, בין 1 ל-10. ברירת מחדל 5"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "מאתר את מיקום כתובת ה-IP (מדינה, מחוז, עיר וספק). כאשר ip מושמט, נבדקת כתובת ה-IP הציבורית הנוכחית של מחשב זה"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "כתובת IPv4/IPv6 לבדיקה; השאירו ריק כדי לבדוק את כתובת ה-IP הציבורית הנוכחית של מחשב זה"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "מחזיר את מזג האוויר הנוכחי של עיר, כולל טמפרטורה, לחות, מהירות רוח ותנאים. אין צורך במפתח API"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "שם העיר; נתמכות סינית ואנגלית, למשל Shanghai, 上海, New York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "יחידת טמפרטורה: C (צלזיוס, ברירת מחדל) או F (פרנהייט)"
"Translate text into the target language. Supports more than 60 languages": "מתרגם טקסט לשפת היעד. תומך ביותר מ-60 שפות"
"Text to translate": "הטקסט לתרגום"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "קוד שפת היעד, למשל zh (סינית), en (אנגלית), ja (יפנית), fr (צרפתית), de (גרמנית), ko (קוריאנית)"
"Source language code; default auto (detect automatically)": "קוד שפת המקור; ברירת מחדל auto (זיהוי אוטומטי)"
