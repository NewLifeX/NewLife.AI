"Background generation completed, message {0}, content length {1}": "การสร้างเบื้องหลังเสร็จสิ้น ข้อความ {0} ความยาวเนื้อหา {1}"
"Background generation failed, message {0}: {1}": "การสร้างเบื้องหลังล้มเหลว ข้อความ {0}: {1}"
"Background generation callback failed: {0}": "คอลแบ็กการสร้างเบื้องหลังล้มเหลว: {0}"
"[{0}] GetResponseAsync error! {1}": "[{0}] ข้อผิดพลาด GetResponseAsync! {1}"
"Method '{0}' not found in MCP server capabilities.": "ไม่พบเมธอด '{0}' ในความสามารถของเซิร์ฟเวอร์ MCP"
"Tool '{0}' not found in the server capabilities.": "ไม่พบเครื่องมือ '{0}' ในความสามารถของเซิร์ฟเวอร์"
"Resource '{0}' not found in the server capabilities.": "ไม่พบทรัพยากร '{0}' ในความสามารถของเซิร์ฟเวอร์"
"Prompt '{0}' not found in the server capabilities.": "ไม่พบพรอมต์ '{0}' ในความสามารถของเซิร์ฟเวอร์"
"Missing required argument '{0}' for tool '{1}'": "ไม่พบอาร์กิวเมนต์ที่จำเป็น '{0}' สำหรับเครื่องมือ '{1}'"
"Rerank call failed": "การเรียก rerank ล้มเหลว"
"Tool not found: '{0}', searched {1} in {2} providers": "ไม่พบเครื่องมือ: '{0}' ค้นหา {1} รายการใน {2} ผู้ให้บริการ"
"Read the content of a file, with optional line-range selection. Returns text prefixed with line numbers": "อ่านเนื้อหาไฟล์ พร้อมระบุช่วงบรรทัดได้ ส่งคืนข้อความพร้อมหมายเลขบรรทัด"
"File path relative to the workspace": "พาธไฟล์ เทียบกับพื้นที่ทำงาน"
"Start line number (1-based); omit to read from the first line": "หมายเลขบรรทัดเริ่มต้น (เริ่มที่ 1) เว้นว่างเพื่ออ่านตั้งแต่บรรทัดแรก"
"End line number (inclusive); omit to read to the end": "หมายเลขบรรทัดสิ้นสุด (รวม) เว้นว่างเพื่ออ่านจนถึงท้ายไฟล์"
"Create a file or overwrite its content. Writing outside the workspace requires approval": "สร้างไฟล์หรือเขียนทับเนื้อหา การเขียนนอกพื้นที่ทำงานต้องได้รับการอนุมัติ"
"Content to write": "เนื้อหาที่จะเขียน"
"List a directory tree as text, with an optional recursion depth limit": "แสดงโครงสร้างโฟลเดอร์เป็นข้อความ พร้อมจำกัดความลึกการเรียกซ้ำแบบไม่บังคับ"
"Directory path relative to the workspace; defaults to the workspace root": "พาธโฟลเดอร์ เทียบกับพื้นที่ทำงาน ค่าเริ่มต้นคือรากของพื้นที่ทำงาน"
"Maximum recursion depth. Default 2": "ความลึกการเรียกซ้ำสูงสุด ค่าเริ่มต้น 2"
"Search files by name pattern; supports ** recursive matching": "ค้นหาไฟล์ตามรูปแบบชื่อ รองรับการจับคู่แบบเรียกซ้ำด้วย **"
"glob pattern, e.g. **/*.cs": "รูปแบบ glob เช่น **/*.cs"
"Directory to start searching from; defaults to the workspace root": "โฟลเดอร์ที่เริ่มค้นหา ค่าเริ่มต้นคือรากของพื้นที่ทำงาน"
"Search file contents for text matching a regular expression, with file-type filtering and a result limit": "ค้นหาข้อความที่ตรงกับนิพจน์ปกติในเนื้อหาไฟล์ พร้อมกรองตามชนิดไฟล์และจำกัดจำนวนผลลัพธ์"
"Regular expression pattern": "รูปแบบนิพจน์ปกติ"
"File glob pattern to restrict the search, e.g. **/*.cs": "รูปแบบ glob ของไฟล์เพื่อจำกัดขอบเขตการค้นหา เช่น **/*.cs"
"Maximum number of results. Default 50": "จำนวนผลลัพธ์สูงสุด ค่าเริ่มต้น 50"
"Run a shell command and return its standard output and standard error. Running outside the workspace requires approval": "เรียกใช้คำสั่ง shell และส่งคืนเอาต์พุตมาตรฐานและข้อผิดพลาดมาตรฐาน การเรียกใช้นอกพื้นที่ทำงานต้องได้รับการอนุมัติ"
"Command to run, e.g. dotnet build": "คำสั่งที่จะเรียกใช้ เช่น dotnet build"
"Working directory; defaults to the workspace root": "ไดเรกทอรีทำงาน ค่าเริ่มต้นคือรากของพื้นที่ทำงาน"
"Timeout in seconds. Default 120": "เวลาหมดอายุเป็นวินาที ค่าเริ่มต้น 120"
"Run dotnet build and parse the MSBuild-formatted error messages from the output": "เรียกใช้ dotnet build และวิเคราะห์ข้อความข้อผิดพลาดรูปแบบ MSBuild จากเอาต์พุต"
"Project file path or directory; defaults to the workspace root": "พาธไฟล์โปรเจกต์หรือโฟลเดอร์ ค่าเริ่มต้นคือรากของพื้นที่ทำงาน"
"Pause and ask the user a question when the agent is uncertain. Only effective in a console environment": "หยุดและถามผู้ใช้เมื่อเอเจนต์ไม่แน่ใจ ทำงานเฉพาะในสภาพแวดล้อมเทอร์มินัล"
"Question to ask the user": "คำถามที่ถามผู้ใช้"
"Get the current date and time, including the full date, day of week, time, time zone, and Unix timestamp": "ส่งคืนวันที่และเวลาปัจจุบัน รวมถึงวันที่เต็ม วันในสัปดาห์ เวลา เขตเวลา และตราประทับเวลา Unix"
"Evaluate a mathematical expression. Supports addition, subtraction, multiplication, division, parentheses, and modulo": "คำนวณนิพจน์คณิตศาสตร์ รองรับการบวก ลบ คูณ หาร วงเล็บ และเศษจากการหาร"
"Mathematical expression, e.g. (3 + 5) * 2 - 10 / 3": "นิพจน์คณิตศาสตร์ เช่น (3 + 5) * 2 - 10 / 3"
"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "ดึงเนื้อหาของ URL ที่ระบุและสกัดข้อความหลัก เหมาะสำหรับอ่านบทความ เอกสาร และหน้าเว็บสาธารณะ"
"Web page address to fetch; must be a full http/https URL": "ที่อยู่หน้าเว็บที่ต้องการดึง ต้องเป็น URL แบบ http/https แบบเต็ม"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "จำนวนอักขระสูงสุดที่ส่งคืน เพื่อไม่ให้เนื้อหายาวมากใช้โทเคนมากเกินไป ค่าเริ่มต้น 5000"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "ค้นหาบนอินเทอร์เน็ตด้วยเครื่องมือค้นหา และส่งคืนชื่อเรื่อง ลิงก์ และข้อความตัดตอน เหมาะสำหรับข่าวล่าสุด การตรวจสอบข้อเท็จจริง และงานที่คล้ายกัน"
"Search keywords or a natural language question": "คีย์เวิร์ดค้นหาหรือคำถามในภาษาธรรมชาติ"
"Number of results to return, between 1 and 10. Default 5": "จำนวนผลลัพธ์ที่ส่งคืน ระหว่าง 1 ถึง 10 ค่าเริ่มต้น 5"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "ค้นหาตำแหน่งที่ตั้งของที่อยู่ IP (ประเทศ จังหวัด เมือง ผู้ให้บริการ) หากไม่ระบุ ip จะค้นหาที่อยู่ IP สาธารณะปัจจุบันของเครื่องนี้"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "ที่อยู่ IPv4/IPv6 ที่ต้องการค้นหา เว้นว่างเพื่อใช้ IP สาธารณะปัจจุบันของเครื่องนี้"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "ส่งคืนสภาพอากาศปัจจุบันของเมือง รวมถึงอุณหภูมิ ความชื้น ความเร็วลม และสภาพอากาศ ไม่ต้องใช้คีย์ API"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "ชื่อเมือง รองรับภาษาจีนและอังกฤษ เช่น Shanghai, 上海, New York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "หน่วยอุณหภูมิ: C (เซลเซียส ค่าเริ่มต้น) หรือ F (ฟาเรนไฮต์)"
"Translate text into the target language. Supports more than 60 languages": "แปลข้อความไปยังภาษาเป้าหมาย รองรับมากกว่า 60 ภาษา"
"Text to translate": "ข้อความที่ต้องการแปล"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "รหัสภาษาเป้าหมาย เช่น zh (จีน), en (อังกฤษ), ja (ญี่ปุ่น), fr (ฝรั่งเศส), de (เยอรมัน), ko (เกาหลี)"
"Source language code; default auto (detect automatically)": "รหัสภาษาต้นทาง ค่าเริ่มต้น auto (ตรวจจับอัตโนมัติ)"
