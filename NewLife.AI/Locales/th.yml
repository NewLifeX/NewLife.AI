"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[ระบบ] จากผลลัพธ์ของเครื่องมือข้างต้น ให้ตอบคำตอบสุดท้ายโดยตรง ไม่ต้องเรียกใช้เครื่องมืออื่นอีก"
"Duplicate call from a previous round; execution skipped": "การเรียกซ้ำจากรอบก่อนหน้า ข้ามการทำงาน"
"Duplicate of an earlier call; execution skipped": "การเรียกซ้ำกับการเรียกก่อนหน้า ข้ามการทำงาน"
"Skipped (duplicate call)": "ข้ามแล้ว (เรียกซ้ำ)"
"[Duplicate skipped: {0}] {1}": "[ข้ามรายการซ้ำ: {0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[นำกลับมาใช้: {0}] อาร์กิวเมนต์เหมือนกับการเรียกก่อนหน้า จึงใช้ผลลัพธ์เดิมอีกครั้ง"
"Identical call already failed; duplicate execution skipped": "การเรียกที่เหมือนกันล้มเหลวไปแล้ว ข้ามการทำงานซ้ำ"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[ล้มเหลวซ้ำ: {0}] การเรียกเดิมด้วยอาร์กิวเมนต์นี้ล้มเหลวมาก่อนแล้ว: {1} อย่าลองใหม่แบบเดิม ให้เปลี่ยนอาร์กิวเมนต์หรือเปลี่ยนไปใช้เครื่องมือหรือแนวทางอื่น"
"Unknown reason": "ไม่ทราบสาเหตุ"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[ระบบ] เครื่องมือล้มเหลวติดต่อกัน {0} รอบ ลองใช้แนวทางอื่น หรือเรียกใช้เครื่องมือ ask_user เพื่อขอความช่วยเหลือจากผู้ใช้"
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[ระบบ] การเรียกใช้เครื่องมือล้มเหลวติดต่อกัน {0} รอบ (เครื่องมือที่ล้มเหลว: {1}) หยุดลองเครื่องมือเดิมซ้ำ เปลี่ยนอาร์กิวเมนต์หรือเปลี่ยนไปใช้เครื่องมือหรือแนวทางอื่น และเรียกใช้ ask_user หากจำเป็น"
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[ระบบ] ผลลัพธ์เครื่องมือก่อนหน้าด้านล่างถูกบีบอัดเป็นบทสรุป (เรียกเครื่องมืออีกครั้งหากต้องการรายละเอียด):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(เนื้อหายาวเกินไป; ตัด {0} อักขระตรงกลางออก ความยาวเดิม {1} อักขระ; ลดขอบเขตหรือเรียกเครื่องมืออีกครั้งเพื่อรับเนื้อหาทั้งหมด)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "เครื่องมือ {0} ถูกบล็อกโดยชั้นโค้ด (การดำเนินการที่มีความเสี่ยงสูง)"
"Tool {0} was rejected by the user": "ผู้ใช้ปฏิเสธการทำงานของเครื่องมือ {0}"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "ผู้ให้บริการเครื่องมือไม่พร้อมใช้งานชั่วคราว (วงจรเปิด) คาดว่าจะกลับมาใน {0} วินาที ติดต่อผู้ดูแลระบบเพื่อรีเซ็ตเซอร์กิตเบรกเกอร์หากต้องลองใหม่ตอนนี้"
"Tool {0} returned an empty result": "เครื่องมือ {0} ส่งคืนผลลัพธ์ว่างเปล่า"
"[{0} call failed] ": "[การเรียก {0} ล้มเหลว] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[แสดงผลในไคลเอนต์แล้ว: {0}] ผลลัพธ์ถูกแสดงในอินเทอร์เฟซผู้ใช้แล้ว อย่าใส่ลิงก์รูปภาพหรือพาธไฟล์ในคำตอบ"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "เครื่องมือ {0} คาดหวังสคีมาพารามิเตอร์นี้: {1} ลองใหม่ตามสคีมา"
