"Run dotnet build and parse the MSBuild-formatted error messages from the output": "dotnet build را اجرا می‌کند و پیام‌های خطا با قالب MSBuild را از خروجی تجزیه می‌کند"
"Project file path or directory; defaults to the workspace root": "مسیر فایل پروژه یا پوشه؛ پیش‌فرض ریشهٔ فضای کاری است"
"Pause and ask the user a question when the agent is uncertain. Only effective in a console environment": "وقتی عامل مطمئن نیست، متوقف می‌شود و از کاربر می‌پرسد. فقط در محیط ترمینال کار می‌کند"
"Question to ask the user": "پرسشی که از کاربر پرسیده می‌شود"
"Get the current date and time, including the full date, day of week, time, time zone, and Unix timestamp": "تاریخ و زمان کنونی را برمی‌گرداند، شامل تاریخ کامل، روز هفته، ساعت، منطقهٔ زمانی و مهر زمانی یونیکس"
"Evaluate a mathematical expression. Supports addition, subtraction, multiplication, division, parentheses, and modulo": "یک عبارت ریاضی را محاسبه می‌کند. جمع، تفریق، ضرب، تقسیم، پرانتز و باقیمانده را پشتیبانی می‌کند"
"Mathematical expression, e.g. (3 + 5) * 2 - 10 / 3": "عبارت ریاضی، مانند (3 + 5) * 2 - 10 / 3"
"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "محتوای نشانی URL داده‌شده را دریافت می‌کند و متن اصلی آن را استخراج می‌کند. برای خواندن مقاله‌ها، اسناد و صفحه‌های وب عمومی مناسب است"
"Web page address to fetch; must be a full http/https URL": "نشانی صفحهٔ وب برای دریافت؛ باید یک URL کامل http/https باشد"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "حداکثر تعداد نویسه‌های بازگشتی، تا محتوای بسیار طولانی توکن زیادی مصرف نکند. پیش‌فرض ۵۰۰۰"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "با یک موتور جستجو در اینترنت جستجو می‌کند و عنوان‌ها، پیوندها و چکیده‌ها را برمی‌گرداند. برای اخبار تازه، راستی‌آزمایی و کارهای مشابه مناسب است"
"Search keywords or a natural language question": "کلیدواژه‌های جستجو یا پرسش به زبان طبیعی"
"Number of results to return, between 1 and 10. Default 5": "تعداد نتایج بازگشتی، بین ۱ و ۱۰. پیش‌فرض ۵"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "موقعیت جغرافیایی یک نشانی IP را جستجو می‌کند (کشور، استان، شهر و ارائه‌دهندهٔ خدمات). اگر ip خالی بماند، نشانی IP عمومی کنونی این دستگاه جستجو می‌شود"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "نشانی IPv4/IPv6 برای جستجو؛ برای IP عمومی کنونی این دستگاه خالی بگذارید"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "آب‌وهوای کنونی یک شهر را برمی‌گرداند، شامل دما، رطوبت، سرعت باد و وضعیت جوی. کلید API لازم نیست"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "نام شهر؛ چینی و انگلیسی پشتیبانی می‌شود، مانند Shanghai، 上海، New York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "واحد دما: C (سلسیوس، پیش‌فرض) یا F (فارنهایت)"
"Translate text into the target language. Supports more than 60 languages": "متن را به زبان هدف ترجمه می‌کند. بیش از ۶۰ زبان را پشتیبانی می‌کند"
"Text to translate": "متنی که باید ترجمه شود"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "کد زبان هدف، مانند zh (چینی)، en (انگلیسی)، ja (ژاپنی)، fr (فرانسوی)، de (آلمانی)، ko (کره‌ای)"
"Source language code; default auto (detect automatically)": "کد زبان مبدأ؛ پیش‌فرض auto (تشخیص خودکار)"
