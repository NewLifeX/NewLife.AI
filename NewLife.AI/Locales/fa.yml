"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[سیستم] بر اساس نتایج ابزارهای بالا، پاسخ نهایی را مستقیماً بده. دیگر ابزاری فراخوانی نکن."
"Duplicate call from a previous round; execution skipped": "فراخوانی تکراری از دور قبلی؛ اجرا نادیده گرفته شد"
"Duplicate of an earlier call; execution skipped": "فراخوانی تکراری از فراخوانی قبلی؛ اجرا نادیده گرفته شد"
"Skipped (duplicate call)": "نادیده گرفته شد (فراخوانی تکراری)"
"[Duplicate skipped: {0}] {1}": "[تکرار نادیده گرفته شد: {0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[دوباره استفاده شد: {0}] آرگومان‌ها با فراخوانی قبلی یکسان است؛ نتیجهٔ قبلی دوباره استفاده می‌شود"
"Identical call already failed; duplicate execution skipped": "فراخوانی یکسان قبلاً شکست خورده است؛ اجرای تکراری نادیده گرفته شد"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[خطای تکراری: {0}] همان فراخوانی با این آرگومان‌ها قبلاً شکست خورده است: {1}. همان‌طور که هست دوباره تلاش نکن؛ آرگومان‌ها را تغییر بده یا به ابزار یا رویکرد دیگری برو."
"Unknown reason": "دلیل نامشخص"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[سیستم] ابزارها برای {0} دور پیاپی شکست خوردند. رویکرد دیگری را امتحان کن یا ابزار ask_user را برای کمک گرفتن از کاربر فراخوانی کن."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[سیستم] فراخوانی ابزارها برای {0} دور پیاپی شکست خورد (ابزارهای ناموفق: {1}). تکرار همان ابزارها را متوقف کن؛ آرگومان‌ها را تغییر بده یا به ابزار یا رویکرد دیگری برو و در صورت نیاز ask_user را فراخوانی کن."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[سیستم] نتایج قبلی ابزارها در زیر به خلاصه فشرده شده است (اگر جزئیات لازم است ابزارها را دوباره فراخوانی کن):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(محتوا بیش از حد طولانی است؛ {0} نویسه در میانه حذف شد، طول اصلی {1} نویسه؛ محدوده را باریک‌تر کن یا برای دریافت محتوای کامل ابزار را دوباره فراخوانی کن)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "ابزار {0} توسط لایهٔ کد مسدود شده است (عملیات پرخطر)"
"Tool {0} was rejected by the user": "کاربر اجرای ابزار {0} را رد کرد"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "ارائه‌دهندهٔ ابزار موقتاً در دسترس نیست (مدار باز) و پیش‌بینی می‌شود تا {0} ثانیه دیگر بازیابی شود. اگر باید همین حالا دوباره تلاش کنید، با مدیر سیستم برای بازنشانی قطع‌کنندهٔ مدار تماس بگیرید"
"Tool {0} returned an empty result": "ابزار {0} نتیجهٔ خالی برگرداند"
"[{0} call failed] ": "[فراخوانی {0} ناموفق بود] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[در کلاینت نمایش داده شد: {0}] نتیجه قبلاً در رابط کاربری نمایش داده شده است؛ پیوند تصویر یا مسیر فایل در پاسخ درج نکن"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "ابزار {0} این طرح‌وارهٔ پارامترها را انتظار دارد: {1}. مطابق طرح‌واره دوباره تلاش کن."
