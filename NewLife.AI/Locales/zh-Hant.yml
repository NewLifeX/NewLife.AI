"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[系統提示] 請根據既有的工具呼叫結果，直接給出最終回答。不要再次呼叫工具。"
"Duplicate call from a previous round; execution skipped": "跨輪次重複呼叫，已跳過執行"
"Duplicate of an earlier call; execution skipped": "呼叫與前序重複，已跳過執行"
"Skipped (duplicate call)": "已跳過（重複呼叫）"
"[Duplicate skipped: {0}] {1}": "[已去重：{0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[已重用：{0}] 參數與前序呼叫相同，已重用先前產生的結果"
"Identical call already failed; duplicate execution skipped": "相同呼叫已失敗，已跳過重複執行"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[重複失敗：{0}] 相同參數呼叫先前已失敗：{1}。請勿原樣重試，請修改參數或改用其他工具/思路。"
"Unknown reason": "未知原因"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[系統提示] 工具已連續失敗 {0} 輪。請換一種思路，或呼叫 ask_user 工具向使用者尋求協助。"
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[系統提示] 工具呼叫已連續失敗 {0} 輪（失敗工具：{1}）。請停止重試相同工具，修改參數或改用其他工具/思路，必要時呼叫 ask_user 工具向使用者尋求協助。"
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[系統提示] 以下早期工具呼叫結果已壓縮為摘要（如需細節請重新呼叫工具取得）："
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(內容過長已省略中間 {0} 字元，原始 {1} 字元；如需完整內容請縮小查詢範圍或重新呼叫工具)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "工具 {0} 已被程式碼層強制阻擋（高風險操作）"
"Tool {0} was rejected by the user": "工具 {0} 被使用者拒絕執行"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "工具提供者暫時無法使用（熔斷中），預計 {0}s 後恢復。如需立即重試請聯絡管理員重設熔斷器"
"Tool {0} returned an empty result": "工具 {0} 傳回了空結果"
"[{0} call failed] ": "[{0} 呼叫失敗] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[已呈現到用戶端：{0}]，結果已呈現到使用者介面，請勿在回覆中插入圖片連結或檔案路徑"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "工具 {0} 期望的參數 schema：{1}，請依 schema 重試。"
