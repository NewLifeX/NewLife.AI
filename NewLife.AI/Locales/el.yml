"trigger:bar chart": "ραβδόγραμμα"
"trigger:line chart": "γραμμικό γράφημα"
"trigger:pie chart": "κυκλικό γράφημα"
"trigger:chart": "γράφημα"
"trigger:table schema": "δομή πίνακα"
"trigger:kanban": "πίνακας kanban"
"trigger:map annotation": "χάρτης"
"trigger:mind map": "χάρτης νου"
"trigger:timeline": "χρονολόγιο"
"trigger:milestone": "ορόσημο"
"trigger:roadmap": "χάρτης πορείας"
"trigger:visualize": "οπτικοποίηση"
"[System] Based on the tool results above, give the final answer directly. Do not call any more tools.": "[Σύστημα] Με βάση τα παραπάνω αποτελέσματα εργαλείων, δώσε απευθείας την τελική απάντηση. Μην καλέσεις άλλα εργαλεία."
"Duplicate call from a previous round; execution skipped": "Διπλή κλήση από προηγούμενο γύρο· η εκτέλεση παραλείφθηκε"
"Duplicate of an earlier call; execution skipped": "Διπλή κλήση προηγούμενης κλήσης· η εκτέλεση παραλείφθηκε"
"Skipped (duplicate call)": "Παραλείφθηκε (διπλή κλήση)"
"[Duplicate skipped: {0}] {1}": "[Το διπλό παραλείφθηκε: {0}] {1}"
"[Reused: {0}] The arguments are identical to an earlier call; the previous result is reused": "[Επαναχρησιμοποιήθηκε: {0}] Τα ορίσματα είναι ίδια με προηγούμενη κλήση· το προηγούμενο αποτέλεσμα επαναχρησιμοποιείται"
"Identical call already failed; duplicate execution skipped": "Ίδια κλήση έχει ήδη αποτύχει· η διπλή εκτέλεση παραλείφθηκε"
"[Repeated failure: {0}] The same arguments failed earlier: {1}. Do not retry as-is; change the arguments or switch to another tool or approach.": "[Επαναλαμβανόμενο σφάλμα: {0}] Η ίδια κλήση με αυτά τα ορίσματα απέτυχε προηγουμένως: {1}. Μην επαναλάβεις ως έχει· άλλαξε τα ορίσματα ή χρησιμοποίησε άλλο εργαλείο ή προσέγγιση."
"Unknown reason": "Άγνωστος λόγος"
"[System] Tools have failed for {0} consecutive rounds. Try a different approach, or call the ask_user tool to ask the user for help.": "[Σύστημα] Τα εργαλεία απέτυχαν για {0} διαδοχικούς γύρους. Δοκίμασε άλλη προσέγγιση ή κάλεσε το εργαλείο ask_user για να ζητήσεις βοήθεια από τον χρήστη."
"[System] Tool calls have failed for {0} consecutive rounds (failed tools: {1}). Stop retrying the same tools; change the arguments or switch to another tool or approach, and call the ask_user tool if help is needed.": "[Σύστημα] Οι κλήσεις εργαλείων απέτυχαν για {0} διαδοχικούς γύρους (αποτυχημένα εργαλεία: {1}). Σταμάτα να επαναλαμβάνεις τα ίδια εργαλεία· άλλαξε τα ορίσματα ή χρησιμοποίησε άλλο εργαλείο ή προσέγγιση και κάλεσε το ask_user αν χρειάζεται."
"[System] The earlier tool results below were compressed into a digest (call the tools again if details are needed):": "[Σύστημα] Τα παρακάτω προηγούμενα αποτελέσματα εργαλείων συμπιέστηκαν σε σύνοψη (κάλεσε ξανά τα εργαλεία αν χρειάζεσαι λεπτομέρειες):"
"\n...(Content too long; {0} characters in the middle were omitted, original length {1} characters; narrow the range or call the tool again for the full content)...\n": "\n...(Το περιεχόμενο είναι πολύ μεγάλο· παραλείφθηκαν {0} χαρακτήρες στη μέση, αρχικό μήκος {1} χαρακτήρες· περιορίστε το εύρος ή καλέστε ξανά το εργαλείο για το πλήρες περιεχόμενο)...\n"
"Tool {0} is blocked by the code layer (high-risk operation)": "Το εργαλείο {0} είναι αποκλεισμένο από το επίπεδο κώδικα (λειτουργία υψηλού κινδύνου)"
"Tool {0} was rejected by the user": "Ο χρήστης απέρριψε την εκτέλεση του εργαλείου {0}"
"The tool provider is temporarily unavailable (circuit open) and is expected to recover in {0}s. Contact the administrator to reset the circuit breaker if a retry is needed now": "Ο πάροχος εργαλείων δεν είναι προσωρινά διαθέσιμος (ανοιχτό κύκλωμα) και αναμένεται αποκατάσταση σε {0}s. Επικοινωνήστε με τον διαχειριστή για επαναφορά του διακόπτη κυκλώματος αν χρειάζεται επανάληψη τώρα"
"Tool {0} returned an empty result": "Το εργαλείο {0} επέστρεψε κενό αποτέλεσμα"
"[{0} call failed] ": "[Η κλήση {0} απέτυχε] "
"[Rendered in the client: {0}] The result is already rendered in the user interface; do not insert image links or file paths in your reply": "[Αποδόθηκε στο πελάτη: {0}] Το αποτέλεσμα έχει ήδη αποδοθεί στη διεπαφή χρήστη· μην εισάγεις συνδέσμους εικόνων ή διαδρομές αρχείων στην απάντηση"
"Tool {0} expects this parameter schema: {1}. Retry according to the schema.": "Το εργαλείο {0} αναμένει αυτό το σχήμα παραμέτρων: {1}. Επανάλαβε σύμφωνα με το σχήμα."
