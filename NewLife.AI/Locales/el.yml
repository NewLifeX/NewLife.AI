"Run a shell command and return its standard output and standard error. Running outside the workspace requires approval": "Εκτελεί εντολή shell και επιστρέφει την τυπική έξοδο και το τυπικό σφάλμα. Η εκτέλεση εκτός του χώρου εργασίας απαιτεί έγκριση"
"Command to run, e.g. dotnet build": "Η εντολή προς εκτέλεση, π.χ. dotnet build"
"Working directory; defaults to the workspace root": "Κατάλογος εργασίας· προεπιλογή η ρίζα του χώρου εργασίας"
"Timeout in seconds. Default 120": "Χρονικό όριο σε δευτερόλεπτα. Προεπιλογή 120"
"Run dotnet build and parse the MSBuild-formatted error messages from the output": "Εκτελεί dotnet build και αναλύει τα μηνύματα σφάλματος μορφής MSBuild από την έξοδο"
"Project file path or directory; defaults to the workspace root": "Διαδρομή αρχείου έργου ή φακέλου· προεπιλογή η ρίζα του χώρου εργασίας"
"Pause and ask the user a question when the agent is uncertain. Only effective in a console environment": "Σταματά και ρωτά τον χρήστη όταν ο πράκτορας δεν είναι βέβαιος. Λειτουργεί μόνο σε περιβάλλον τερματικού"
"Question to ask the user": "Η ερώτηση προς τον χρήστη"
"Get the current date and time, including the full date, day of week, time, time zone, and Unix timestamp": "Επιστρέφει την τρέχουσα ημερομηνία και ώρα, συμπεριλαμβανομένης της πλήρους ημερομηνίας, της ημέρας της εβδομάδας, της ώρας, της ζώνης ώρας και της χρονοσφραγίδας Unix"
"Evaluate a mathematical expression. Supports addition, subtraction, multiplication, division, parentheses, and modulo": "Υπολογίζει μια μαθηματική παράσταση. Υποστηρίζει πρόσθεση, αφαίρεση, πολλαπλασιασμό, διαίρεση, παρενθέσεις και υπόλοιπο διαίρεσης"
"Mathematical expression, e.g. (3 + 5) * 2 - 10 / 3": "Μαθηματική παράσταση, π.χ. (3 + 5) * 2 - 10 / 3"
"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "Ανακτά το περιεχόμενο της καθορισμένης διεύθυνσης URL και εξάγει το κύριο κείμενο. Χρήσιμο για ανάγνωση άρθρων, εγγράφων και δημόσιων ιστοσελίδων"
"Web page address to fetch; must be a full http/https URL": "Η διεύθυνση της ιστοσελίδας προς ανάκτηση· πρέπει να είναι πλήρης διεύθυνση URL http/https"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "Μέγιστος αριθμός χαρακτήρων που επιστρέφονται, ώστε το πολύ μακρύ περιεχόμενο να μην καταναλώνει υπερβολικά πολλά tokens. Προεπιλογή 5000"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "Αναζητά στο διαδίκτυο με μηχανή αναζήτησης και επιστρέφει τίτλους, συνδέσμους και αποσπάσματα. Χρήσιμο για πρόσφατες ειδήσεις, επαλήθευση γεγονότων και παρόμοιες εργασίες"
"Search keywords or a natural language question": "Λέξεις-κλειδιά αναζήτησης ή ερώτηση σε φυσική γλώσσα"
"Number of results to return, between 1 and 10. Default 5": "Αριθμός αποτελεσμάτων προς επιστροφή, από 1 έως 10. Προεπιλογή 5"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "Αναζητά τη θέση μιας διεύθυνσης IP (χώρα, περιφέρεια, πόλη, πάροχος). Αν το ip παραλειφθεί, αναζητείται η τρέχουσα δημόσια διεύθυνση IP αυτού του μηχανήματος"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "Διεύθυνση IPv4/IPv6 προς αναζήτηση· αφήστε κενό για τη δημόσια IP αυτού του μηχανήματος"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "Επιστρέφει τον τρέχοντα καιρό μιας πόλης, συμπεριλαμβανομένης της θερμοκρασίας, της υγρασίας, της ταχύτητας ανέμου και των καιρικών συνθηκών. Δεν απαιτεί κλειδί API"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "Όνομα πόλης· υποστηρίζει κινεζικά και αγγλικά, π.χ. Shanghai, 上海, New York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "Μονάδα θερμοκρασίας: C (Κελσίου, προεπιλογή) ή F (Φαρενάιτ)"
"Translate text into the target language. Supports more than 60 languages": "Μεταφράζει κείμενο στη γλώσσα-στόχο. Υποστηρίζει περισσότερες από 60 γλώσσες"
"Text to translate": "Το κείμενο προς μετάφραση"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "Κωδικός γλώσσας-στόχου, π.χ. zh (κινεζικά), en (αγγλικά), ja (ιαπωνικά), fr (γαλλικά), de (γερμανικά), ko (κορεατικά)"
"Source language code; default auto (detect automatically)": "Κωδικός γλώσσας-πηγής· προεπιλογή auto (αυτόματη ανίχνευση)"
"Current Time": "Τρέχουσα ώρα"
