"List a directory tree as text, with an optional recursion depth limit": "디렉터리 트리를 텍스트로 나열합니다. 재귀 깊이를 제한할 수 있습니다"
"Directory path relative to the workspace; defaults to the workspace root": "워크스페이스 기준 디렉터리 경로. 기본값은 워크스페이스 루트입니다"
"Maximum recursion depth. Default 2": "최대 재귀 깊이. 기본값 2"
"Search files by name pattern; supports ** recursive matching": "파일 이름 패턴으로 파일을 검색합니다. ** 재귀 일치를 지원합니다"
"glob pattern, e.g. **/*.cs": "glob 패턴. 예: **/*.cs"
"Directory to start searching from; defaults to the workspace root": "검색을 시작할 디렉터리. 기본값은 워크스페이스 루트입니다"
"Search file contents for text matching a regular expression, with file-type filtering and a result limit": "정규식과 일치하는 텍스트를 파일 내용에서 검색합니다. 파일 형식 필터와 결과 수 제한을 지원합니다"
"Regular expression pattern": "정규식 패턴"
"File glob pattern to restrict the search, e.g. **/*.cs": "검색 대상을 제한하는 파일 glob 패턴. 예: **/*.cs"
"Maximum number of results. Default 50": "최대 결과 수. 기본값 50"
"Run a shell command and return its standard output and standard error. Running outside the workspace requires approval": "셸 명령을 실행하고 표준 출력과 표준 오류를 반환합니다. 워크스페이스 밖에서 실행하려면 승인이 필요합니다"
"Command to run, e.g. dotnet build": "실행할 명령. 예: dotnet build"
"Working directory; defaults to the workspace root": "작업 디렉터리. 기본값은 워크스페이스 루트입니다"
"Timeout in seconds. Default 120": "시간 제한(초). 기본값 120"
"Run dotnet build and parse the MSBuild-formatted error messages from the output": "dotnet build를 실행하고 출력에서 MSBuild 형식의 오류 메시지를 파싱합니다"
"Project file path or directory; defaults to the workspace root": "프로젝트 파일 경로 또는 디렉터리. 기본값은 워크스페이스 루트입니다"
"Pause and ask the user a question when the agent is uncertain. Only effective in a console environment": "에이전트가 불확실할 때 일시 중지하고 사용자에게 질문합니다. 콘솔 환경에서만 유효합니다"
"Question to ask the user": "사용자에게 할 질문"
"Get the current date and time, including the full date, day of week, time, time zone, and Unix timestamp": "현재 날짜와 시간(전체 날짜, 요일, 시간, 시간대, Unix 타임스탬프)을 가져옵니다"
"Evaluate a mathematical expression. Supports addition, subtraction, multiplication, division, parentheses, and modulo": "수식을 계산합니다. 덧셈, 뺄셈, 곱셈, 나눗셈, 괄호, 나머지를 지원합니다"
"Mathematical expression, e.g. (3 + 5) * 2 - 10 / 3": "수식. 예: (3 + 5) * 2 - 10 / 3"
"Fetch the content of the given URL and extract its main text. Use it to read articles, documents, or any public web page": "지정한 URL의 내용을 가져와 본문 텍스트를 추출합니다. 기사, 문서 또는 공개 웹 페이지를 읽을 때 사용합니다"
"Web page address to fetch; must be a full http/https URL": "가져올 웹 페이지 주소. 전체 http/https URL이어야 합니다"
"Maximum characters to return, to keep very long content from consuming too many tokens. Default 5000": "반환할 최대 문자 수. 긴 내용이 토큰을 너무 많이 차지하지 않도록 합니다. 기본값 5000"
"Search the internet with a search engine and return titles, links, and snippets. Use it for recent news, fact checking, and similar tasks": "검색 엔진으로 인터넷을 검색하고 제목, 링크, 요약을 반환합니다. 최신 뉴스나 사실 확인 등에 사용합니다"
"Search keywords or a natural language question": "검색 키워드 또는 자연어 질문"
"Number of results to return, between 1 and 10. Default 5": "반환할 결과 수(1~10). 기본값 5"
"Look up where an IP address is located (country, province, city, and ISP). When ip is omitted, looks up the current public IP of this machine": "IP 주소의 위치(국가, 성/도, 도시, ISP)를 조회합니다. ip를 생략하면 이 컴퓨터의 현재 공인 IP를 조회합니다"
"IPv4/IPv6 address to look up; leave empty to look up the current public IP of this machine": "조회할 IPv4/IPv6 주소. 비워 두면 이 컴퓨터의 현재 공인 IP를 조회합니다"
"Get the current weather of a city, including temperature, humidity, wind speed, and conditions. No API key required": "도시의 현재 날씨(기온, 습도, 풍속, 날씨 상태)를 가져옵니다. API 키가 필요 없습니다"
"City name; Chinese and English are supported, e.g. Shanghai, 上海, New York": "도시 이름. 중국어와 영어를 지원합니다. 예: Shanghai, 上海, New York"
"Temperature unit: C (Celsius, default) or F (Fahrenheit)": "온도 단위: C(섭씨, 기본) 또는 F(화씨)"
"Translate text into the target language. Supports more than 60 languages": "텍스트를 대상 언어로 번역합니다. 60개 이상의 언어를 지원합니다"
"Text to translate": "번역할 텍스트"
"Target language code, e.g. zh (Chinese), en (English), ja (Japanese), fr (French), de (German), ko (Korean)": "대상 언어 코드. 예: zh(중국어), en(영어), ja(일본어), fr(프랑스어), de(독일어), ko(한국어)"
"Source language code; default auto (detect automatically)": "원본 언어 코드. 기본값 auto(자동 감지)"
"Current Time": "현재 시간"
"Calculator": "계산기"
"Web Fetch": "웹 가져오기"
"Web Search": "웹 검색"
"IP Location": "IP 위치"
"Weather": "날씨"
"Text Translation": "텍스트 번역"
"Read File": "파일 읽기"
"Write File": "파일 쓰기"
"List Directory": "디렉터리 나열"
"File Search": "파일 검색"
"Content Search": "내용 검색"
"Run Command": "명령 실행"
"Get Compile Errors": "컴파일 오류 가져오기"
"Ask User": "사용자에게 질문"
