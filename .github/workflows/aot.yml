name: aot

# NativeAOT 防回归：分析器 0 告警 + 多 RID 原生发布冒烟。
# NativeAOT 官方不支持跨 OS 编译，每个 RID 用原生 runner 发布运行。
# 边界与实测结论见 Doc/AOT兼容性分析.md。

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # AOT 防回归：库自身 IL 告警 0 容忍（net8.0 与 net10.0，WarningsAsErrors 已在 csproj 声明）
  aot-analyzer:
    name: aot analyzer check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: AOT Analyzer Check
      run: |
        dotnet build NewLife.AI\NewLife.AI.csproj -f net8.0 -c Release
        dotnet build NewLife.AI\NewLife.AI.csproj -f net10.0 -c Release

  # NativeAOT 冒烟矩阵：win-x64 / linux-x64 / linux-arm64 为阻断门禁；win-arm64 与 macOS 双架构为观察期
  aot:
    name: aot (${{ matrix.rid }} ${{ matrix.tfm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
            tfm: net10.0
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
            tfm: net8.0
          - rid: win-arm64
            os: windows-11-arm
            bin: AotSmoke.exe
            tfm: net10.0
            experimental: true
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
            tfm: net10.0
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
            tfm: net8.0
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke
            tfm: net10.0
          - rid: osx-arm64
            os: macos-latest
            bin: AotSmoke
            tfm: net10.0
            experimental: true
          - rid: osx-x64
            os: macos-15-intel
            bin: AotSmoke
            tfm: net10.0
            experimental: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        # net8.0 目标需要 8.x 运行时跑 JIT 基线
        dotnet-version: |
          8.x
          10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline
      # 同一冒烟工程以 JIT 运行（37 场景），为 AOT 结果提供对照
      run: dotnet run -c Release -f ${{ matrix.tfm }} --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT Smoke
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -f ${{ matrix.tfm }} -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
    - name: Run NativeAOT Smoke
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}

  # ASP.NET Core 宿主 AOT：Kestrel 起真服务走 MCP HTTP 往返（MapMcp 的 RequestDelegate 路由 + DI 解析工具 + JSON-RPC 反序列化）
  aot-web:
    name: aot-web (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotWebSmoke.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotWebSmoke

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline
      run: dotnet run -c Release --project AotWebSmoke/AotWebSmoke.csproj
    - name: Publish NativeAOT Web Smoke
      run: dotnet publish AotWebSmoke/AotWebSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotWebSmoke/bin/aot-out
    - name: Run NativeAOT Web Smoke
      shell: bash
      run: ./AotWebSmoke/bin/aot-out/${{ matrix.bin }}

  # NativeAOT 冒烟（musl）：alpine 容器内原生发布运行
  aot-musl:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Publish & Run NativeAOT Smoke (alpine)
      run: |
        docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
          set -e
          apk add --no-cache bash curl clang build-base zlib-dev icu-libs >/dev/null
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet >/dev/null
          ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet run -c Release -f net10.0 --project AotSmoke/AotSmoke.csproj
          dotnet publish AotSmoke/AotSmoke.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
          ./AotSmoke/bin/aot-out/AotSmoke
        '

  # Windows x86（32位）：交叉发布后直接运行（观察期）
  win-x86:
    name: aot (win-x86)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Publish NativeAOT Smoke (win-x86)
      run: dotnet publish AotSmoke\AotSmoke.csproj -c Release -f net10.0 -r win-x86 -o AotSmoke\bin\aot-out
    - name: Run NativeAOT Smoke (win-x86)
      run: AotSmoke\bin\aot-out\AotSmoke.exe

  # Linux arm32（linux-arm）：x64 宿主无原生 runner（观察期）。
  # 主信号：QEMU 容器内用 arm32 .NET 运行时跑 JIT 冒烟
  linux-arm:
    name: smoke (linux-arm qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU (arm)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm
    - name: JIT Smoke in arm32 Container
      run: |
        docker run --rm --platform linux/arm/v7 -v "$PWD:/src" -w /src arm32v7/debian:bookworm-slim sh -c '
          set -e
          apt-get update -qq && apt-get install -y -qq curl libicu-dev ca-certificates >/dev/null
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --architecture arm --install-dir /usr/share/dotnet >/dev/null
          ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet run -c Release -f net10.0 --project AotSmoke/AotSmoke.csproj
        '
    # 探索：官方文档未给出 x64→arm32 的 NativeAOT 交叉配方，失败不阻断
    - name: Cross Publish NativeAOT (linux-arm, 探索)
      continue-on-error: true
      run: |
        sudo apt-get update && sudo apt-get install -y clang lld binutils-arm-linux-gnueabihf gcc-arm-linux-gnueabihf zlib1g-dev:armhf
        dotnet publish AotSmoke/AotSmoke.csproj -c Release -f net10.0 -r linux-arm -o AotSmoke/bin/aot-out-arm
    - name: Run NativeAOT Smoke (linux-arm, 探索)
      continue-on-error: true
      run: |
        docker run --rm --platform linux/arm/v7 -v "$PWD:/src" -w /src arm32v7/debian:bookworm-slim sh -c '
          set -e
          apt-get update -qq && apt-get install -y -qq libc6 >/dev/null
          ./AotSmoke/bin/aot-out-arm/AotSmoke
        '

  # LoongArch64（linux-loongarch64，观察期，人工触发，不阻塞）：官方无 runner、无 runtime pack、无 NativeAOT。
  # 宿主 x64 SDK 还原与构建（产出与 RID 无关的 IL），容器内仅用龙芯 SDK 执行 —— QEMU 下 MSBuild 链路不稳；
  # NativeAOT 仅作"发布探索"（允许失败），有产物才运行。
  loongarch64:
    name: smoke (linux-loongarch64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host, for restore)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK
      # 宿主下载（GitHub 直连快），容器通过挂载点使用；容器内 --info 是 QEMU 通路的第一道验证
      run: |
        curl -fL --retry 3 -o "$RUNNER_TEMP/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$RUNNER_TEMP/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
    - name: Restore & Build (host x64 SDK)
      run: |
        dotnet restore AotSmoke/AotSmoke.csproj
        dotnet build AotSmoke/AotSmoke.csproj -c Release -f net10.0 --no-restore
    - name: JIT Smoke (loong64 container, 37 场景)
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '/opt/dotnet/dotnet --info && /opt/dotnet/dotnet /src/AotSmoke/bin/Release/net10.0/AotSmoke.dll'
    - name: NativeAOT Publish (linux-loongarch64, 探索)
      continue-on-error: true
      run: |
        docker run --rm --platform linux/loong64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet" \
          -v "$HOME/.nuget/packages:/home/runner/.nuget/packages" \
          -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          lcr.loongnix.cn/debian:14-slim \
          sh -c '/opt/dotnet/dotnet publish AotSmoke/AotSmoke.csproj -c Release -f net10.0 -r linux-loongarch64 -o AotSmoke/bin/aot-out-la64'
    - name: Run NativeAOT Smoke (linux-loongarch64, 探索)
      continue-on-error: true
      run: |
        if [ -x AotSmoke/bin/aot-out-la64/AotSmoke ]; then
          docker run --rm --platform linux/loong64 \
            -v "$PWD:/src" -w /src \
            lcr.loongnix.cn/debian:14-slim \
            ./AotSmoke/bin/aot-out-la64/AotSmoke
        else
          echo "未产出 linux-loongarch64 原生可执行文件（NativeAOT 当前不支持 LA64），跳过运行"
        fi

  # RISC-V 64（linux-riscv64，观察期，人工触发，不阻塞）：运行时来自社区构建 filipnavara/dotnet-riscv。
  # 官方不发 linux-riscv64 runtime pack，NativeAOT 仅作"发布探索"；JIT 冒烟复用 37 场景验证平台行为一致性。
  riscv64:
    name: smoke (linux-riscv64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host, for restore)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (riscv64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: riscv64
    - name: Download RISC-V .NET SDK (community build)
      run: |
        curl -fL --retry 3 -o "$RUNNER_TEMP/riscv64-sdk.tar.gz" \
          https://github.com/filipnavara/dotnet-riscv/releases/download/10.0.113/dotnet-sdk-10.0.113-linux-riscv64.tar.gz
        mkdir -p "$HOME/riscv64" && tar -xzf "$RUNNER_TEMP/riscv64-sdk.tar.gz" -C "$HOME/riscv64"
        chmod +x "$HOME/riscv64/dotnet" || true
    - name: Restore & Build (host x64 SDK)
      run: |
        dotnet restore AotSmoke/AotSmoke.csproj
        dotnet build AotSmoke/AotSmoke.csproj -c Release -f net10.0 --no-restore
    - name: JIT Smoke in riscv64 Container (37 场景)
      run: |
        docker run --rm --platform linux/riscv64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/riscv64:/opt/dotnet:ro" \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          -e DOTNET_EnableHWIntrinsic=0 \
          -e DOTNET_EnableWriteXorExecute=0 \
          riscv64/ubuntu:24.04 \
          sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends libicu74 libssl3 libstdc++6 ca-certificates >/dev/null
            /opt/dotnet/dotnet --info
            /opt/dotnet/dotnet /src/AotSmoke/bin/Release/net10.0/AotSmoke.dll
          '
    - name: NativeAOT Publish (linux-riscv64, 探索)
      continue-on-error: true
      run: |
        docker run --rm --platform linux/riscv64 \
          -v "$PWD:/src" -w /src \
          -v "$HOME/riscv64:/opt/dotnet:ro" \
          -e DOTNET_ROOT=/opt/dotnet \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          riscv64/ubuntu:24.04 \
          sh -c '/opt/dotnet/dotnet publish AotSmoke/AotSmoke.csproj -c Release -f net10.0 -r linux-riscv64 -o AotSmoke/bin/aot-out-riscv64'
    - name: Run NativeAOT Smoke (linux-riscv64, 探索)
      continue-on-error: true
      run: |
        if [ -x AotSmoke/bin/aot-out-riscv64/AotSmoke ]; then
          docker run --rm --platform linux/riscv64 \
            -v "$PWD:/src" -w /src \
            riscv64/ubuntu:24.04 \
            ./AotSmoke/bin/aot-out-riscv64/AotSmoke
        else
          echo "未产出 linux-riscv64 原生可执行文件，跳过运行"
        fi
