name: aot

# NativeAOT 防回归：分析器 0 告警 + 多 RID 原生发布冒烟。
# NativeAOT 官方不支持跨 OS 编译，每个 RID 用原生 runner 发布运行。
# 边界与实测结论见 Doc/AOT兼容性分析.md。

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # AOT 防回归：库自身 IL 告警 0 容忍（net8.0 与 net10.0，WarningsAsErrors 已在 csproj 声明）
  aot-analyzer:
    name: aot analyzer check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: AOT Analyzer Check
      run: |
        dotnet build NewLife.AI\NewLife.AI.csproj -f net8.0 -c Release
        dotnet build NewLife.AI\NewLife.AI.csproj -f net10.0 -c Release

  # NativeAOT 冒烟矩阵：win-x64 / linux-x64 / linux-arm64 为阻断门禁；win-arm64 与 macOS 双架构为观察期
  aot:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: AotSmoke.exe
          - rid: win-arm64
            os: windows-11-arm
            bin: AotSmoke.exe
            experimental: true
          - rid: linux-x64
            os: ubuntu-latest
            bin: AotSmoke
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            bin: AotSmoke
          - rid: osx-arm64
            os: macos-latest
            bin: AotSmoke
            experimental: true
          - rid: osx-x64
            os: macos-15-intel
            bin: AotSmoke
            experimental: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Install NativeAOT Prerequisites (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: JIT Baseline
      # 同一冒烟工程以 JIT 运行（22 场景），为 AOT 结果提供对照
      run: dotnet run -c Release --project AotSmoke/AotSmoke.csproj
    - name: Publish NativeAOT Smoke
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
    - name: Run NativeAOT Smoke
      shell: bash
      run: ./AotSmoke/bin/aot-out/${{ matrix.bin }}

  # NativeAOT 冒烟（musl）：alpine 容器内原生发布运行
  aot-musl:
    name: aot (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Publish & Run NativeAOT Smoke (alpine)
      run: |
        docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
          set -e
          apk add --no-cache bash curl clang build-base zlib-dev icu-libs >/dev/null
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet >/dev/null
          ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet run -c Release --project AotSmoke/AotSmoke.csproj
          dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o AotSmoke/bin/aot-out
          ./AotSmoke/bin/aot-out/AotSmoke
        '

  # Windows x86（32位）：交叉发布后直接运行（观察期）
  win-x86:
    name: aot (win-x86)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Publish NativeAOT Smoke (win-x86)
      run: dotnet publish AotSmoke\AotSmoke.csproj -c Release -r win-x86 -o AotSmoke\bin\aot-out
    - name: Run NativeAOT Smoke (win-x86)
      run: AotSmoke\bin\aot-out\AotSmoke.exe

  # Linux arm32（linux-arm）：x64 宿主无原生 runner（观察期）。
  # 主信号：QEMU 容器内用 arm32 .NET 运行时跑 JIT 冒烟
  linux-arm:
    name: smoke (linux-arm qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup QEMU (arm)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm
    - name: JIT Smoke in arm32 Container
      run: |
        docker run --rm --platform linux/arm/v7 -v "$PWD:/src" -w /src arm32v7/debian:bookworm-slim sh -c '
          set -e
          apt-get update -qq && apt-get install -y -qq curl libicu-dev ca-certificates >/dev/null
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --architecture arm --install-dir /usr/share/dotnet >/dev/null
          ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet run -c Release --project AotSmoke/AotSmoke.csproj
        '

  # LoongArch64（linux-loongarch64，观察期，人工触发）：QEMU + 龙芯 SDK 容器内 JIT 冒烟。
  # 官方无 LA64 NativeAOT 运行时包，此处验证业务代码在该架构上的 JIT 行为。
  loongarch64:
    name: smoke (linux-loongarch64 qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host, for restore)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Set up QEMU (loong64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: loong64
    - name: Download Loongson .NET SDK
      run: |
        curl -fL --retry 3 -o "$RUNNER_TEMP/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$RUNNER_TEMP/la64-sdk.tar.gz" -C "$HOME/la64"
    - name: JIT Smoke (loong64 container)
      run: |
        dotnet restore AotSmoke/AotSmoke.csproj
        docker run --rm --platform linux/loong64 -v "$PWD:/src" -w /src \
          -v "$HOME/la64:/opt/dotnet:ro" -v "$HOME/.nuget:/home/runner/.nuget" \
          -e HOME=/home/runner -e DOTNET_CLI_HOME=/home/runner -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet -e PATH=/opt/dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          -e DOTNET_ROLL_FORWARD=LatestMajor -e DOTNET_EnableWriteXorExecute=0 \
          ghcr.io/loong64/debian:trixie bash -c '
            set -e
            apt-get update -qq || true
            apt-get install -y -qq ca-certificates libstdc++6 zlib1g libunwind8 || true
            dotnet --info
            dotnet run -c Release --project AotSmoke/AotSmoke.csproj
          '
