"Handler [{0}] OnAfter failed: {1}": "Trình xử lý [{0}] OnAfter thất bại: {1}"
"Handler [{0}] OnBefore failed (non-streaming): {1}": "Trình xử lý [{0}] OnBefore thất bại (không truyền trực tuyến): {1}"
"Handler [{0}] OnAfter failed (non-streaming): {1}": "Trình xử lý [{0}] OnAfter thất bại (không truyền trực tuyến): {1}"
"Streaming generation failed: {0}": "Tạo luồng thất bại: {0}"
"LLM context is missing the user message; skipping the call. ContextMessages.Count={0}": "Ngữ cảnh LLM thiếu tin nhắn người dùng; bỏ qua lệnh gọi. ContextMessages.Count={0}"
"Context window budget exceeded; interrupting the tool call loop": "Đã vượt hạn mức cửa sổ ngữ cảnh; ngắt vòng lặp gọi công cụ"
"Upstream rate limited (429), retry {0}, waiting {1}ms": "Thượng nguồn giới hạn tốc độ (429), lần thử lại {0}, chờ {1}ms"
"Upstream error {0}, retry {1}": "Lỗi thượng nguồn {0}, lần thử lại {1}"
"Failed to pre-create gateway conversation: {0}": "Tạo trước cuộc hội thoại cổng thất bại: {0}"
"Failed to record gateway conversation: {0}": "Ghi nhận cuộc hội thoại cổng thất bại: {0}"
"Failed to save gateway attachment: {0}": "Lưu tệp đính kèm của cổng thất bại: {0}"
"Name cannot be empty": "Tên không được để trống"
"Name '{0}' already exists": "Tên '{0}' đã tồn tại"
"Embedded resource china-map.svg was not found; make sure the csproj contains <EmbeddedResource Include=\"Resources\\china-map.svg\" />": "Không tìm thấy tài nguyên nhúng china-map.svg; vui lòng đảm bảo csproj có chứa <EmbeddedResource Include=\"Resources\\china-map.svg\" />"
"The message does not exist or the role does not match": "Tin nhắn không tồn tại hoặc vai trò không khớp"
"The conversation does not exist": "Hội thoại không tồn tại"
"Model '{0}' is unavailable": "Mô hình '{0}' không khả dụng"
"No model is available; configure and enable at least one model in the admin console first": "Không có mô hình khả dụng; vui lòng cấu hình và bật ít nhất một mô hình trong bảng điều khiển quản trị trước"
"Invalid parameter: sections cannot be empty": "Tham số không hợp lệ: sections không được để trống"
"Invalid parameter: sheets cannot be empty": "Tham số không hợp lệ: sheets không được để trống"
"MCP tool not found: '{0}'": "Không tìm thấy công cụ MCP: '{0}'"
"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Tạo tài liệu Word (.docx) và trả về liên kết tải xuống. Hỗ trợ tiêu đề, đoạn văn, danh sách, bảng, hình ảnh, ngắt trang, đường phân cách, hộp nhấn mạnh, thẻ KPI, trích dẫn và khối mã. Mảng JSON sections mô tả từng phần bằng heading, content và elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Tiêu đề tài liệu (tối đa 30 ký tự), ví dụ Báo cáo quý 2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Mảng phần (JSON). Trường của mỗi phần: heading (tiêu đề phần), headingLevel (1-3, mặc định 1), content (đoạn văn bản, tùy chọn), elements (mảng phần tử, tùy chọn). Các loại phần tử: paragraph ({type,text,tùy chọn bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,tùy chọn tableStyle}; rows là mảng hai chiều, mỗi hàng là mảng giá trị ô, ví dụ [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Chủ đề (tùy chọn): khóa kiểu thẻ (ví dụ enterprise-blue) hoặc tên dựng sẵn (blue/dark/corporate/warm/green/minimal); khi bỏ trống sẽ dùng kiểu trò chuyện hoặc mặc định thương hiệu"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Tạo bảng tính Excel (.xlsx) và trả về liên kết tải xuống. Hỗ trợ nhiều trang, kiểu tiêu đề, độ rộng cột, định dạng số, định dạng có điều kiện, khóa khung, tự động lọc và xác thực danh sách thả xuống. Tham số theme nhận khóa kiểu thẻ hoặc tên dựng sẵn (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Tiêu đề bảng tính (tối đa 30 ký tự), ví dụ Báo cáo doanh thu quý 2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Mảng trang (JSON). Trường của mỗi trang: name, headers (mảng tiêu đề), rows (mảng hai chiều; mỗi hàng là mảng giá trị ô, ví dụ [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (ví dụ [12,20,15]), numberFormat (ví dụ \"#,##0.00\" hoặc \"yyyy-MM-dd\"), conditionalFormats (mảng {range,type,color,value?}; type hỗ trợ dataBar/colorScale/greaterThan và các giá trị khác), charts (mảng biểu đồ), freezeRows (số hàng khóa), autoFilter (phạm vi lọc) và dropdowns (xác thực danh sách thả xuống)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Chủ đề (tùy chọn): khóa kiểu thẻ (ví dụ enterprise-blue) hoặc tên dựng sẵn (blue/dark/corporate/warm/green/minimal) điều khiển tiêu đề và màu tổng thể; khi bỏ trống sẽ dùng kiểu trò chuyện hoặc mặc định thương hiệu"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Tạo bản trình bày PowerPoint (.pptx) và trả về liên kết tải xuống. Hai chế độ đầu vào loại trừ nhau: (1) chế độ slides, AI mô tả nội dung có cấu trúc và bố cục được tạo tự động; (2) chế độ widgetSrc nhúng các thẻ show_widget đã tạo trước thành hình ảnh trang chiếu. Tham số theme nhận khóa kiểu thẻ (ví dụ enterprise-blue/raycast-dark/ppt-executive) hoặc tên dựng sẵn (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Tiêu đề bản trình bày (tối đa 30 ký tự), ví dụ Tổng kết quý 2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Mảng trang chiếu (JSON). Một phần tử = một trang chiếu, nhiều phần tử = bản trình bày đầy đủ. Loại trừ nhau với widgetSrc. Trường của mỗi trang chiếu: title, layout (title_only/title_content/two_column/chart_only/blank), background (màu hex), footer, showPageNumber (true/false), elements (danh sách phần tử), notes và transition. elements hỗ trợ: text (role=title/subtitle/body/kpi/caption; tùy chọn bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows là mảng hai chiều, mỗi hàng là mảng giá trị ô, ví dụ [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; tùy chọn tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Ví dụ: [{\"title\":\"Trang bìa\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Tổng kết quý 2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Đội ngũ NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Danh sách ID thẻ show_widget phân tách bằng dấu phẩy, ví dụ 'call_abc123,call_def456'. Loại trừ nhau với slides. Chuyển các thẻ đã tạo thành hình ảnh trang chiếu"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Chủ đề (tùy chọn): khóa kiểu thẻ (ví dụ enterprise-blue/ppt-executive) hoặc tên dựng sẵn (blue/dark/corporate/warm/green/minimal và các tên khác); khi bỏ trống sẽ dùng kiểu trò chuyện hoặc mặc định thương hiệu"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Hiển thị dữ liệu dưới dạng biểu đồ tương tác (thu phóng, di chuột, xuất ảnh). Nhanh hơn show_widget khoảng 20 lần: chỉ cần đặc tả JSON (khoảng 200 token) và giao diện sẽ vẽ ngay bằng ECharts. Hỗ trợ: bar, line (đường/vùng), pie (tròn/vành khuyên), scatter, radar, map_china (bản đồ nhiệt theo tỉnh của Trung Quốc), heatmap (bản đồ nhiệt dạng ma trận), gauge, funnel, treemap. Phù hợp cho so sánh số liệu, chuỗi thời gian (đường), phân tích tỷ trọng và phân bố địa lý. Lưu ý: với tuyến đường, sự kiện lịch sử, cột mốc và dòng thời gian hãy dùng show_timeline; công cụ này không hỗ trợ kiểu timeline. Phong cách hiển thị: truyền bảng màu qua data.colors thay vì dựa vào mặc định của ECharts. Gợi ý: màu thương hiệu cho một chuỗi, sắc độ cách đều (10-12 màu) cho nhiều chuỗi, màu bổ trợ cho so sánh, gradient đơn sắc cho xu hướng. Xanh dương và vàng kim cho tài chính, xanh dương/xanh lá/trắng cho y tế, tím/xanh dương/xanh lơ cho công nghệ và AI. Với tập dữ liệu lớn, đặt data.animation=false để giảm chi phí hiển thị."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Loại biểu đồ: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Tiêu đề biểu đồ (tối đa 30 ký tự), ví dụ GDP theo tỉnh năm 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Đối tượng JSON; cấu trúc được mô tả trong phần mô tả công cụ. Ví dụ bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Doanh thu\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; ví dụ radar nhiều chuỗi: {\"indicators\":[{\"name\":\"Tốc độ\",\"max\":100},{\"name\":\"Sức mạnh\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; điều kiện radar: số indicators phải bằng độ dài mỗi series[i].data, và data chỉ chứa số"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Trả về thông tin người dùng đang đăng nhập, bao gồm tên đăng nhập, tên hiển thị, email, di động, mã, vai trò, phòng ban, giới tính, tuổi, ngày sinh và ghi chú, cùng địa chỉ IP, thành phố và vị trí địa lý chi tiết của khách truy cập"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Tìm lược đồ bảng cơ sở dữ liệu bằng từ khóa. Kết quả gồm hai phần: (1) bản đồ bảng- kết nối (bảng Markdown cho biết mỗi bảng thuộc kết nối nào; các bảng cùng tên ở kết nối khác nhau được liệt kê riêng); (2) lược đồ XML của các bảng cho từng kết nối. Các lần gọi run_sql sau đó phải dùng tên kết nối trong bảng bản đồ"
"Search keywords, separated by commas or spaces": "Từ khóa tìm kiếm phân tách bằng dấu phẩy hoặc khoảng trắng"
"Restrict to a connection name; empty searches all connections": "Giới hạn theo tên kết nối; để trống sẽ tìm trong mọi kết nối"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Thực thi câu lệnh SQL trên kết nối cơ sở dữ liệu được chỉ định. Truy vấn SELECT/WITH trả về các hàng; câu lệnh không phải truy vấn như INSERT/UPDATE/DELETE trả về số hàng bị ảnh hưởng. connName phải khớp cột kết nối do search_table trả về"
"Database connection name (from the connection column of search_table)": "Tên kết nối cơ sở dữ liệu (từ cột kết nối của search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Câu lệnh SQL. SELECT/WITH trả về tập kết quả; câu lệnh không phải truy vấn trả về số hàng bị ảnh hưởng"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Tra ngày âm lịch, tiết khí và trạng thái ngày làm việc (ngày làm việc/ngày nghỉ/ngày làm bù) của một ngày cụ thể"
"Date to query in yyyy-MM-dd format. Defaults to today": "Ngày cần tra theo định dạng yyyy-MM-dd. Mặc định là hôm nay"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Hiển thị nhiệm vụ dưới dạng bảng Kanban nhiều cột (ví dụ Cần làm -> Đang làm -> Xong). Phù hợp để chia giai đoạn dự án, lập kế hoạch Sprint, hiển thị quy trình và phân loại trạng thái nhiệm vụ. Mỗi cột có thể có nhãn màu và giới hạn WIP; mỗi thẻ có thể có tiêu đề, mô tả, mức ưu tiên, nhãn, hạn chót, người phụ trách, danh sách việc con, tiến độ và liên kết. Hai bố cục: board (bảng nhiều cột mặc định) và swimlane (cột nhóm theo nhóm hoặc đơn vị)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Tiêu đề bảng (tối đa 30 ký tự), ví dụ Bảng Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Mảng JSON định nghĩa cột. Ví dụ: [{\"id\":\"todo\",\"title\":\"Cần làm\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Phân tích yêu cầu\",\"description\":\"Thu thập yêu cầu người dùng\",\"priority\":\"high\",\"tags\":[\"thiết kế\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Phỏng vấn người dùng\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Mọi trường ngoài id và title đều tùy chọn"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Chế độ bố cục: board (bảng nhiều cột mặc định) hoặc swimlane (cột nhóm theo nhóm hoặc đơn vị; cần tham số swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Mảng JSON định nghĩa làn (dùng khi layout=swimlane). Ví dụ: [{\"id\":\"sl1\",\"title\":\"Nhóm giao diện\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Nhóm máy chủ\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Đánh dấu các điểm tọa độ (thành phố hoặc POI) hoặc làm nổi bật các tỉnh trên bản đồ Trung Quốc, tạo bản đồ SVG có chú giải và hiển thị trong bong bóng trò chuyện. Hỗ trợ: (1) tô màu tỉnh tùy chỉnh; (2) điểm đánh dấu WGS84 kèm vĩ độ, kinh độ và nhãn; (3) chú giải tự động ở góc dưới bên phải. Cách dùng điển hình: phân bố dữ liệu theo tỉnh, vị trí thành phố, bản đồ nhiệt doanh số theo vùng."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Tiêu đề bản đồ (tối đa 30 ký tự), ví dụ GDP theo tỉnh năm 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Mảng JSON các điểm đánh dấu (có thể là mảng rỗng []). Định dạng: [{\"name\":\"Bắc Kinh\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Bắc Kinh\\n4376 tỷ\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng theo độ thập phân WGS84; color/size tùy chọn"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Mảng JSON các tỉnh làm nổi bật (có thể là mảng rỗng []). Định dạng: [{\"name\":\"Quảng Đông\",\"color\":\"#FFB347\",\"label\":\"Đứng đầu GDP\"}]. name nhận tên tỉnh bằng tiếng Trung (đầy đủ hoặc viết tắt); label tùy chọn"
"Legend title (optional), e.g. GDP scale": "Tiêu đề chú giải (tùy chọn), ví dụ Thang GDP"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Bảng màu (tùy chọn): blue/orange/green/purple/red; mặc định blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Kiểu điểm đánh dấu (tùy chọn): circle/pin/square; mặc định circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Hiển thị phân cấp tri thức hoặc quan hệ giữa các khái niệm dưới dạng sơ đồ tư duy tương tác có thể thu gọn. Đầu vào là dàn ý Markdown (# / ## / ###) mà giao diện chuyển thành cây trực quan. Phù hợp để sắp xếp tri thức, phân rã khái niệm, so sánh công nghệ, đánh giá phương án và tóm tắt nội dung. Phong cách hiển thị: chọn branchColors (3-8 màu hài hòa), maxDepth (độ phức tạp) và collapsed (thu gọn ban đầu để tập trung) theo chủ đề. Dùng tông lạnh (xanh dương/tím/xanh lơ) cho công nghệ và dữ liệu, tông ấm (cam/vàng kim/đỏ) cho kinh doanh và tiếp thị, xanh lá cho tự nhiên và sức khỏe. Với nút dày đặc, đặt maxDepth=2 để giữ dễ đọc. 6 bố cục: tree (mặc định, cây răng cưa, tổng quát) / radial (tỏa trái-phải, tốt nhất cho sơ đồ tri thức) / lr (từ trung tâm sang phải, sơ đồ luồng/cây quyết định) / rl (từ trung tâm sang trái, truy nguyên ngược) / tb (từ trung tâm xuống dưới, sơ đồ tổ chức) / bt (từ trung tâm lên trên, phân cấp từ dưới lên)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Tiêu đề sơ đồ tư duy (tối đa 30 ký tự), ví dụ Ngăn xếp công nghệ AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Dàn ý Markdown với # / ## / ### cho các cấp 1-3. Ví dụ:\n# Trí tuệ nhân tạo\n## Học máy\n### Học có giám sát\n### Học không giám sát\n## Học sâu\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Chế độ bố cục: tree (mặc định, cây răng cưa, tổng quát) / radial (tỏa trái-phải, tốt nhất cho sơ đồ tri thức) / lr (từ trung tâm sang phải, sơ đồ luồng/cây quyết định) / rl (từ trung tâm sang trái, truy nguyên ngược) / tb (từ trung tâm xuống dưới, sơ đồ tổ chức) / bt (từ trung tâm lên trên, phân cấp từ dưới lên)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Mảng JSON màu nhánh, ví dụ [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Gán lần lượt 3-8 màu hex cho các nhánh cấp một. Khi bỏ trống sẽ dùng bảng màu mặc định xanh dương/tím, xanh lá, vàng, đỏ, xanh lơ, xanh lá đậm, cam và tím"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Mảng JSON ID các nút thu gọn ban đầu, ví dụ [\"n2\",\"n5\"]. Để rỗng sẽ mở rộng tất cả. Dùng để tập trung vào các nhánh quan trọng"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Độ sâu hiển thị tối đa: 1 = chỉ nhánh cấp một, 2 = hai cấp, mặc định không giới hạn. Với nút dày đặc, đặt 2 để giữ dễ đọc"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Hiển thị dữ liệu chuỗi thời gian dưới dạng thẻ dòng thời gian tinh tế. Chỉ cần JSON (khoảng 100 token) và giao diện sẽ hiển thị ngay. Phù hợp cho cột mốc dự án, sự kiện lịch sử, kế hoạch phát hành và lịch sử phát triển. Mỗi sự kiện có thể có ngày, tiêu đề, mô tả, màu và danh mục. Phong cách hiển thị: đặt bảng màu tổng thể qua tham số palette (ví dụ gradient xanh dương-tím, đồng ấm, màu thương hiệu) để dòng thời gian có phong cách đồng nhất; item.color thay thế từng mục. Dùng density=relaxed cho năm sự kiện chọn lọc trở xuống và density=compact cho mười sự kiện trở lên. 8 bố cục: vertical (5-20 mục) / alternating-top (so le trên, trình tự ngược) / alternating-bottom (so le dưới, trình tự xuôi) / horizontal-left (ngang sang trái, ngược) / horizontal-right (ngang sang phải, xuôi) / s-curve (đường cong S, 8 mục trở xuống) / fishbone-left (xương cá trái, ngược) / fishbone-right (xương cá phải, xuôi)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Tiêu đề dòng thời gian (tối đa 30 ký tự), ví dụ Cột mốc sản phẩm"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Mảng JSON các sự kiện dòng thời gian. Ví dụ: [{\"date\":\"2024-01\",\"title\":\"Phát hành v1.0\",\"description\":\"Ra mắt các tính năng cốt lõi\",\"color\":\"#5470c6\",\"category\":\"cột mốc\"}]. description/color/category là tùy chọn"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Chế độ bố cục: vertical / alternating-top (so le trên, ngược) / alternating-bottom (so le dưới, xuôi) / horizontal-left (ngang, ngược) / horizontal-right (ngang, xuôi) / s-curve / fishbone-left (xương cá, ngược) / fishbone-right (xương cá, xuôi)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Mảng JSON bảng màu tổng thể, ví dụ [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Thay thế chuỗi tám màu mặc định. item.color được ưu tiên"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Khoảng cách mục: compact (12px) / normal (20px, mặc định) / relaxed (32px). relaxed phù hợp cho năm sự kiện chọn lọc trở xuống; compact cho mười sự kiện trở lên"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Hiển thị một đoạn SVG hoặc HTML trong bong bóng trò chuyện. Dùng cho dòng thời gian và sơ đồ quan hệ (SVG), xem trước biểu mẫu và thẻ dữ liệu (HTML), đồ họa thống kê (SVG). Không dùng cho biểu đồ Mermaid; hãy xuất Mermaid dưới dạng khối mã ```mermaid trong câu trả lời. Giới hạn: tối đa 200 KB; <script src=...> chỉ từ CDN đáng tin cậy. Phong cách hiển thị: chọn kiến trúc thông tin (Bento/luồng thẻ/Grid), thứ bậc chữ và hệ màu theo chủ đề. Tông lạnh không góc cạnh cho thảo luận kỹ thuật, màu trung tính với số liệu nổi bật cho báo cáo kinh doanh, gradient/kính mờ/chuyển động nhẹ cho công việc sáng tạo. Luôn chỉ định font-family và color rõ ràng; không dựa vào kiểu mặc định của trình duyệt."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Tiêu đề widget (tối đa 30 ký tự), ví dụ Luồng trạng thái đơn hàng"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG phải bắt đầu bằng <svg; đoạn HTML phải bắt đầu bằng phần tử gốc và không chứa <html><body>. Tối đa 200 KB; <script src=...> chỉ từ CDN đáng tin cậy. Không truyền cú pháp Mermaid (flowchart/graph/sequenceDiagram và tương tự); hãy xuất Mermaid dưới dạng khối mã ```mermaid trong câu trả lời"
"Placeholder text shown while loading (optional)": "Văn bản giữ chỗ hiển thị khi tải (tùy chọn)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Gợi ý chủ đề: light / dark / auto (theo hệ thống). HTML tạo ra nên chọn màu nền và màu chữ tương ứng; không truyền cho trình hiển thị giao diện"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Chiều cao ban đầu của widget, pixel (80-1200). Mặc định 480. Dùng 300-400 cho thẻ gọn và 600-800 cho biểu đồ lớn"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Chế độ nền: solid (mặc định) / transparent (để ghép ảnh chụp vào mẫu PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Chế độ trang chiếu PPT. Khi true thẻ được hiển thị theo tỷ lệ 16:9 sẵn sàng dán vào bản trình bày. Mặc định false hiển thị theo nội dung"
"Section heading text, e.g. Completed this week": "Văn bản tiêu đề phần, ví dụ Những việc đã hoàn thành tuần này"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Cấp tiêu đề: 1 = cấp một (lớn nhất), 2 = cấp hai, 3 = cấp ba; mặc định 1"
"Body paragraph text (optional; used together with elements)": "Đoạn văn bản (tùy chọn; dùng cùng elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Mảng phần tử có cấu trúc (tùy chọn): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Loại phần tử: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Nội dung văn bản (dùng khi type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Mảng mục danh sách (dùng khi type=bullet_list hoặc ordered_list)"
"Table header row (required when type=table)": "Hàng tiêu đề bảng (bắt buộc khi type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Các hàng dữ liệu bảng (bắt buộc khi type=table); mỗi hàng là mảng giá trị ô, ví dụ [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Kiểu bảng (tùy chọn khi type=table): headerBgColor (nền tiêu đề), headerFontColor (màu chữ tiêu đề), stripeColor (hàng so le)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL hình ảnh (bắt buộc khi type=image); hỗ trợ liên kết https:// bên ngoài hoặc tệp đính kèm nội bộ như /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Chiều rộng hình ảnh, cm (type=image); mặc định 14 cm"
"Image height in centimeters (type=image); default 10cm": "Chiều cao hình ảnh, cm (type=image); mặc định 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Văn bản in đậm hay không (tùy chọn khi type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Văn bản in nghiêng hay không (tùy chọn khi type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Văn bản gạch chân hay không (tùy chọn khi type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Cỡ chữ, point, ví dụ 12 (tùy chọn khi type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Màu chữ (RGB hex, ví dụ 2563EB; tùy chọn khi type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Căn lề văn bản: left/center/right/justify (tùy chọn khi type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Màu nền đoạn (RGB hex, ví dụ EFF6FF; tùy chọn khi type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Kiểu hộp nhấn mạnh (type=callout): info (xanh dương) / success (xanh lá) / warning (vàng) / danger (đỏ); mặc định info"
"KPI value (required when type=kpi), e.g. 17.68M": "Giá trị KPI (bắt buộc khi type=kpi), ví dụ 17,68 triệu"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Nhãn KPI (tùy chọn khi type=kpi), ví dụ tăng trưởng so với tháng trước"
"KPI trend (optional when type=kpi): up / down / flat": "Xu hướng KPI (tùy chọn khi type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Nguồn trích dẫn (tùy chọn khi type=quote), ví dụ Báo cáo thường niên 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Ngôn ngữ mã (tùy chọn khi type=code), ví dụ sql/python/javascript; quyết định tô màu cú pháp"
"Worksheet name, e.g. Q2 Data": "Tên trang tính, ví dụ Dữ liệu quý 2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Mảng tiêu đề cột, ví dụ [\"Ngày\",\"Doanh thu\",\"Thay đổi\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Các hàng dữ liệu (mảng hai chiều); mỗi hàng là mảng giá trị ô, ví dụ [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Kiểu tiêu đề (tùy chọn): headerBgColor (nền tiêu đề), headerFontColor (màu chữ tiêu đề), stripeColor (hàng so le)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Mảng độ rộng cột (tùy chọn), ví dụ [12, 20, 15]; giá trị là số ký tự xấp xỉ"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Định dạng số (tùy chọn), ví dụ \"#,##0.00\" hoặc \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Mảng định dạng có điều kiện (tùy chọn). Trường của mỗi mục: range (ví dụ \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan và các loại khác), color (màu chính), value (ngưỡng)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Mảng định nghĩa biểu đồ (tùy chọn): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Số hàng trên cùng được khóa (0 = không khóa, 1 = khóa hàng đầu; mặc định 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Phạm vi tự động lọc (ví dụ \"A1:E1\"); tắt khi để trống"
"Dropdown validation array (optional)": "Mảng thao tác xác thực danh sách thả xuống (tùy chọn)"
"Applied range (e.g. \"C2:C10\")": "Phạm vi áp dụng (ví dụ \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Loại điều kiện: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Màu (RGB hex, ví dụ 2563EB) dùng cho thanh dữ liệu, thang màu hoặc tô sáng"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Ngưỡng hoặc công thức (ví dụ 1000 hoặc =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Loại biểu đồ: bar / line / pie"
"Chart title (optional)": "Tiêu đề biểu đồ (tùy chọn)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Mảng nhãn trục danh mục, ví dụ [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Mảng chuỗi dữ liệu; mỗi mục chứa name và data"
"Applied range (e.g. \"A2:A100\")": "Phạm vi áp dụng (ví dụ \"A2:A100\")"
"Dropdown option array": "Mảng lựa chọn danh sách thả xuống"
"Title of this slide": "Tiêu đề của trang chiếu này"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Bố cục trang chiếu: title_only (chỉ tiêu đề, cho trang bìa) / title_content (tiêu đề + văn bản, mặc định) / two_column (hai cột) / chart_only (biểu đồ toàn chiều rộng) / blank (khoảng trống)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Màu nền trang chiếu, RGB hex ví dụ \"1F497D\"; khi bỏ trống sẽ dùng nền theo chủ đề"
"Slide element list; each element describes a text block, table, chart, or image": "Danh sách phần tử của trang chiếu; mỗi phần tử mô tả một khối văn bản, bảng, biểu đồ hoặc hình ảnh"
"Footer text displayed at the bottom of the slide; null hides it": "Văn bản chân trang hiển thị dưới trang chiếu; null sẽ ẩn"
"Whether to show the slide number in the bottom-right corner; default false": "Có hiển thị số trang chiếu ở góc dưới bên phải hay không; mặc định false"
"Speaker notes used as a reminder while presenting": "Ghi chú người thuyết trình dùng làm nhắc nhở khi trình bày"
"Transition animation: fade / push / wipe / zoom / split / cut": "Hiệu ứng chuyển: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Loại phần tử: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Vai trò ngữ nghĩa (chỉ phần tử text): title / subtitle / body / caption / kpi. Công cụ bố cục dùng để tự động định vị phần tử, không cần tọa độ"
"Text content (required when type=text)": "Nội dung văn bản (bắt buộc khi type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Cỡ chữ, point (tùy chọn); khi bỏ trống công cụ bố cục chọn theo role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Văn bản in đậm hay không; mặc định false"
"Whether the text is italic (optional for type=text); default false": "Văn bản in nghiêng hay không (tùy chọn khi type=text); mặc định false"
"Whether the text is underlined (optional for type=text); default false": "Văn bản gạch chân hay không (tùy chọn khi type=text); mặc định false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Màu chữ, RGB hex ví dụ \"FFFFFF\"; khi bỏ trống sẽ kế thừa màu chữ của chủ đề"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Mảng tiêu đề bảng (bắt buộc khi type=table), ví dụ [\"Chỉ số\",\"Q1\",\"Q2\",\"Thay đổi\"]"
"Chart type (required when type=chart): bar / line / pie": "Loại biểu đồ (bắt buộc khi type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Nhãn danh mục biểu đồ (bắt buộc khi type=chart), ví dụ [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Chuỗi dữ liệu (bắt buộc khi type=chart); mỗi mục chứa name (tên chuỗi) và data (mảng số)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Căn lề văn bản (phần tử text): l (trái) / ctr (giữa) / r (phải)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Màu nền hộp văn bản (phần tử text), RGB hex ví dụ \"EFF6FF\"; để trống là trong suốt"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Các đoạn văn bản giàu định dạng (phần tử text); khi có sẽ bỏ qua Content/FontSize/Bold/Color"
"Shape configuration (required when type=shape)": "Cấu hình hình khối (bắt buộc khi type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Kiểu bảng (tùy chọn khi type=table): headerBgColor (nền tiêu đề), headerFontColor (màu chữ tiêu đề), stripeColor (hàng so le)"
"Text content": "Nội dung văn bản"
"Font size in points; 0 inherits the text box default": "Cỡ chữ, point; 0 kế thừa mặc định của hộp văn bản"
"Whether the text is bold": "Văn bản in đậm hay không"
"Whether the text is italic": "Văn bản in nghiêng hay không"
"Whether the text is underlined": "Văn bản gạch chân hay không"
"Text color, hex RGB such as \"FF6B6B\"": "Màu chữ, RGB hex ví dụ \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL siêu liên kết; khi đặt, đoạn văn bản trở nên có thể nhấp"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Loại hình khối: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Màu tô (RGB hex, ví dụ 2563EB); null nghĩa là không tô"
"Border color (hex RGB); null means no border": "Màu viền (RGB hex); null nghĩa là không viền"
"Text displayed inside the shape (optional)": "Văn bản hiển thị bên trong hình khối (tùy chọn)"
"Text color inside the shape (hex RGB)": "Màu chữ bên trong hình khối (RGB hex)"
"Font size of the text inside the shape (points); 0 means default": "Cỡ chữ bên trong hình khối (point); 0 nghĩa là mặc định"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Màu nền hàng tiêu đề (RGB hex, ví dụ 2563EB); khi bỏ trống sẽ không áp dụng kiểu riêng"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "Màu chữ hàng tiêu đề (RGB hex, ví dụ FFFFFF); khi bỏ trống sẽ kế thừa mặc định"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "Màu hàng so le (nền các hàng dữ liệu chẵn, ví dụ EFF6FF xanh nhạt); khi bỏ trống sẽ không vẽ vằn"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "ID cột duy nhất (bắt buộc), ví dụ \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "Tiêu đề cột (bắt buộc, tối đa 20 ký tự)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "Màu tiêu đề cột (tùy chọn), hex, ví dụ \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "Giới hạn WIP (tùy chọn); khi vượt sẽ hiển thị tiêu đề cột màu đỏ"
"Card array (required)": "Mảng thẻ (bắt buộc)"
"Unique card ID (required)": "ID thẻ duy nhất (bắt buộc)"
"Card title (required, up to 40 characters)": "Tiêu đề thẻ (bắt buộc, tối đa 40 ký tự)"
"Supplementary description (optional, up to 100 characters)": "Mô tả bổ sung (tùy chọn, tối đa 100 ký tự)"
"Priority (optional): high | medium | low": "Mức ưu tiên (tùy chọn): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "Mảng nhãn (tùy chọn), ví dụ [\"thiết kế\",\"giao diện\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "Hạn chót (tùy chọn), ISO 8601 ví dụ \"2026-07-15\""
"Assignee name (optional)": "Tên người phụ trách (tùy chọn)"
"Subtask checklist (optional); each item has title and done": "Danh sách việc con (tùy chọn); mỗi mục chứa title và done"
"Completion progress (optional), 0-100": "Tỷ lệ hoàn thành (tùy chọn), 0-100"
"Related link URL (optional)": "URL liên kết (tùy chọn)"
"Subtask title": "Tiêu đề việc con"
"Whether the subtask is done": "Việc con đã hoàn thành hay chưa"
"Unique swimlane ID (required)": "ID làn duy nhất (bắt buộc)"
"Swimlane title (required)": "Tiêu đề làn (bắt buộc)"
"Column ID array contained in this swimlane (required)": "Mảng ID cột trong làn này (bắt buộc)"
"City or place name (required), e.g. Beijing": "Tên thành phố hoặc địa điểm (bắt buộc), ví dụ Bắc Kinh"
"Latitude (required), WGS84 decimal degrees": "Vĩ độ (bắt buộc), độ thập phân WGS84"
"Longitude (required), WGS84 decimal degrees": "Kinh độ (bắt buộc), độ thập phân WGS84"
"Marker label text (optional); supports \\n line breaks": "Văn bản nhãn điểm đánh dấu (tùy chọn); hỗ trợ \\\\n để ngắt dòng"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "Màu điểm đánh dấu (tùy chọn), hex ví dụ \"#E74C3C\"; khi bỏ trống sẽ luân phiên màu theo bảng màu"
"Marker size (optional); default 7": "Kích thước điểm đánh dấu (tùy chọn); mặc định 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "Tên tỉnh (bắt buộc); nhận tên tỉnh bằng tiếng Trung (đầy đủ hoặc viết tắt), ví dụ Quảng Đông"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "Màu làm nổi bật (tùy chọn), hex ví dụ \"#FFB347\"; mặc định là màu bảng"
"Highlight label (optional), e.g. No.1 GDP": "Nhãn làm nổi bật (tùy chọn), ví dụ Đứng đầu GDP"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "Ngày sự kiện (bắt buộc); bất kỳ định dạng, ví dụ \"2024-01\" hoặc \"2024 Q3\" hoặc \"Giai đoạn 1\""
"Event title (required, up to 30 characters)": "Tiêu đề sự kiện (bắt buộc, tối đa 30 ký tự)"
"Supplementary description (optional, up to 80 characters)": "Mô tả bổ sung (tùy chọn, tối đa 80 ký tự)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "Màu hex (tùy chọn), ví dụ \"#5470c6\"; khi bỏ trống bảng màu sẽ tự luân phiên"
"Event category label (optional), e.g. Milestone, Release, Issue": "Nhãn danh mục sự kiện (tùy chọn), ví dụ cột mốc, phát hành, sự cố"
