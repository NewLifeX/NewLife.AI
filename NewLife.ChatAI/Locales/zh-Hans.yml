"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "生成 Word 文档（.docx）并返回下载链接。支持标题/段落/列表/表格/图片/分页/分隔线/高亮框/KPI/引用/代码块。sections JSON 数组描述每个节，每节包含 heading（节标题）、content（正文）、elements（结构化元素）"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "文档标题（≤ 30 字），如「Q2季度总结报告」"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "文档节数组（JSON）。每节字段：heading（节标题文字）、headingLevel（级别1~3，默认1）、content（正文段落，可选）、elements（元素数组，可选）。elements 元素类型：paragraph（{type,text,可选bold/italic/underline/fontSize/color/alignment/backgroundColor}）、bullet_list（{type,items}）、ordered_list（{type,items}）、table（{type,headers,rows,可选tableStyle}，rows为二维数组每行一个单元格值数组如 [[\"张三\",\"85\"],[\"李四\",\"92\"]]）、image（{type,src,widthCm?,heightCm?}）、page_break（{type}）、divider（{type}分隔线）、callout（{type,text,variant?=info/success/warning/danger}高亮提示框）、kpi（{type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}大数字指标）、quote（{type,text,quoteSource?}引用块）、code（{type,text,codeLanguage?}代码块）"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "主题（可选）：卡片风格 Key（如 enterprise-blue）或内置名（blue/dark/corporate/warm/green/minimal），不传则沿用会话风格或品牌默认"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "生成 Excel 电子表格（.xlsx）并返回下载链接。支持多工作表、表头样式、列宽、数字格式、条件格式、冻结窗格、自动筛选、下拉验证。theme 参数使用卡片风格 Key 或内置名（blue/dark/corporate/warm/green/minimal）"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "工作簿标题（≤ 30 字），如「Q2营收报表」"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "工作表数组（JSON）。每表字段：name（表名）、headers（列头数组）、rows（二维数组，每行为一个单元格值数组，如 [[\"张三\",\"85\"],[\"李四\",\"92\"]]）、style（{headerBgColor,headerFontColor,stripeColor}）、columnWidths（列宽数组，如[12,20,15]）、numberFormat（数字格式，如\"#,##0.00\"或\"yyyy-MM-dd\"）、conditionalFormats（条件格式数组，每项{range,type,color,value?}，type支持dataBar/colorScale/greaterThan等）、charts（图表数组）、freezeRows（冻结行数）、autoFilter（筛选范围）、dropdowns（下拉验证）"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "主题（可选）：卡片风格 Key（如 enterprise-blue）或内置名（blue/dark/corporate/warm/green/minimal），决定表头与整体配色；不传则沿用会话风格或品牌默认"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "生成 PowerPoint 演示文稿（.pptx）并返回下载链接。两种输入模式互斥：①slides模式=AI描述结构化内容自动排版；②widgetSrc模式=嵌入已生成的show_widget卡片为幻灯片图片。theme参数使用卡片风格 Key（如 enterprise-blue/raycast-dark/ppt-executive）或内置名（blue/dark/green/warm/corporate/minimal）。"
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "演示文稿标题（≤ 30 字），如「Q2季度汇报」"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "幻灯片数组（JSON）。1个元素=单页；多个=完整PPT。与widgetSrc互斥，二选一。每页字段：title、layout(title_only/title_content/two_column/chart_only/blank)、background(背景色16进制)、footer(页脚)、showPageNumber(显示页码true/false)、elements(元素列表)、notes(备注)、transition(切换)。elements支持：text(role=title/subtitle/body/kpi/caption，可选bold/italic/underline/alignment=l/ctr/r/backgroundColor/color)、table(headers+rows，rows为二维数组每行一个单元格值数组如 [[\"张三\",\"85\"],[\"李四\",\"92\"]]，可加tableStyle={headerBgColor/headerFontColor/stripeColor})、chart(chartType=bar/line/pie/area/scatter+categories+series)、image(src)、shape(shape={shapeType,fillColor,lineColor,text,fontColor})。示例：[{\"title\":\"封面\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2汇报\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"新生命团队\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "show_widget 卡片 ID 列表（逗号分隔），如 'call_abc123,call_def456'。与slides互斥，二选一。将已生成的卡片渲染结果嵌入为幻灯片图片"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "主题（可选）：卡片风格 Key（如 enterprise-blue/ppt-executive）或内置名（blue/dark/corporate/warm/green/minimal 等），不传则沿用会话风格或品牌默认"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "将数据渲染为交互式图表（可缩放/悬停/导出图片）。比 show_widget 快 20 倍：只需输出 JSON 规范（约 200 tokens），前端 ECharts 立即渲染。支持：bar（柱状）、line（折线/面积）、pie（饼/环形）、scatter（散点）、radar（雷达）、map_china（中国省份热力地图）、heatmap（矩阵热力）、gauge（仪表盘）、funnel（漏斗）、treemap（矩形树图）。适用于数值比较、时序数值变化（折线图）、占比分析、地域分布等场景。⚠️ 行程规划、历史事件、里程碑、时间线等场景请使用 show_timeline，本工具不支持 timeline 类型。🎨 视觉风格：请通过 data.colors 数组主动传递配色方案（不要依赖默认 ECharts 配色）。选色建议：单系列用品牌主色、多系列用色相环均匀分布（10~12 色）、对比图用互补色、趋势图用单色渐变。财务数据用蓝金、健康医疗用蓝绿白、科技 AI 用紫蓝青。大数据量建议 data.animation=false 减少渲染压力。"
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "图表类型：bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "图表标题（≤ 30 字），如『2024年各省 GDP 分布』"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON 对象，结构见说明。bar示例：{\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"收入\",\"data\":[100,200]}],\"unit\":\"万元\"} ；radar多系列示例：{\"indicators\":[{\"name\":\"速度\",\"max\":100},{\"name\":\"力量\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ；⚠️radar要求：indicators数量==每个series[i].data长度，data必须是纯数值数组"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "获取当前登录用户的详细信息，包括用户名、昵称、邮箱、手机号、编码、角色、部门、性别、年龄、生日、备注，以及来访 IP 地址、所在城市和详细地理地址等档案数据"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "根据关键字搜索匹配的数据库表结构。返回包含两部分：① 表→连接映射表（Markdown表格，明确每个表属于哪个连接，同名表在不同连接下独立列出）；② 各连接下的表结构 XML 详情。后续 run_sql 须使用映射表中指定的连接名"
"Search keywords, separated by commas or spaces": "搜索关键字，多个用逗号或空格分隔"
"Restrict to a connection name; empty searches all connections": "限定连接名，为空则搜索所有连接"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "在指定数据库连接上执行SQL语句。SELECT/WITH 查询返回数据行；INSERT/UPDATE/DELETE 等非查询操作返回受影响行数。connName 必须与 search_table 返回的映射表中'所属连接'列一致"
"Database connection name (from the connection column of search_table)": "数据库连接名（来自 search_table 的'所属连接'列）"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL语句。SELECT/WITH 返回结果集，非查询操作返回受影响行数"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "查询指定日期的农历、节气及工作日状态（工作/放假/调休）"
"Date to query in yyyy-MM-dd format. Defaults to today": "要查询的日期，格式 yyyy-MM-dd。不传则默认今天"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "将任务清单渲染为多列看板（如：待办 → 进行中 → 已完成）。适用场景：项目拆解、Sprint 规划、工作流展示、任务状态分类。每列可有颜色标记和 WIP 上限，每张卡片可含标题、描述、优先级、标签、截止日期、负责人、子任务清单、进度和链接。📐 2 种布局：board（默认多列看板）/ swimlane（泳道视图，按团队/模块分组列）。"
"Board title (up to 30 characters), e.g. Sprint 1 Board": "看板标题（≤ 30 字），如「Sprint 1 任务看板」"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "列定义 JSON 数组。示例：[{\"id\":\"todo\",\"title\":\"待办\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"需求分析\",\"description\":\"整理用户需求\",\"priority\":\"high\",\"tags\":[\"设计\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"张三\",\"checklist\":[{\"title\":\"访谈用户\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]。color/wipLimit/description/priority/tags/dueDate/assignee/checklist/progress/link 均可省略"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "布局模式：board（默认多列看板）/ swimlane（泳道视图，按团队/模块分组列，需同时提供 swimlanes 参数）"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "泳道定义 JSON 数组（layout=swimlane 时使用）。示例：[{\"id\":\"sl1\",\"title\":\"前端团队\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"后端团队\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "在中国地图上标注坐标点（城市/POI）或高亮省份区域，生成带标注的 SVG 地图并渲染到对话气泡。支持：①自定义颜色的省份填充高亮；②WGS84 经纬度坐标标注点（含标签文字）；③右下角自动图例。典型用途：各省数据分布、城市位置展示、区域销售热力图。"
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "地图标题（≤ 30 字），如「2024年各省GDP分布」"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "坐标点标注 JSON 数组（可为空数组 []）。格式：[{\"name\":\"北京\",\"lat\":39.9,\"lng\":116.4,\"label\":\"北京\\n43760亿\",\"color\":\"#E74C3C\",\"size\":8}]。lat/lng 为 WGS84 十进制度，color/size 可省略"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "省份高亮 JSON 数组（可为空数组 []）。格式：[{\"name\":\"广东省\",\"color\":\"#FFB347\",\"label\":\"GDP第一\"}]。name 支持中文省份全称或简称，label 可省略"
"Legend title (optional), e.g. GDP scale": "图例标题（可选），如「GDP规模」"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "配色方案（可选），支持 blue/orange/green/purple/red，默认 blue"
"Marker style (optional): circle/pin/square; defaults to circle": "标注点样式（可选），如 circle/pin/square，默认 circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "将知识层级/概念关系渲染为可折叠的交互式思维导图。输入 Markdown 大纲（# / ## / ###），前端自动转换为可视化树状图。适用场景：知识梳理、概念拆解、技术对比、方案评估、内容归纳。🎨 视觉风格：请结合对话主题主动选择 branchColors（3~8 个协调色）、maxDepth（控制复杂度）、collapsed（初始折叠以聚焦重点）。技术/数据主题用冷色系（蓝紫青）、商业/营销用暖色系（橙金红）、自然/健康用绿色系。节点密集时建议 maxDepth=2 保持可读性。📐 6 种布局：tree（默认缩进树，通用）/ radial（左右放射，知识梳理/概念图首选）/ lr（中心向右，流程图/决策树）/ rl（中心向左，反向追溯）/ tb（中心向下，组织架构）/ bt（中心向上，自底向上层级）。"
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "思维导图标题（≤ 30 字），如「人工智能技术体系」"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown 大纲，用 # / ## / ### 表示 1~3 级层级。示例：\n# 人工智能\n## 机器学习\n### 监督学习\n### 无监督学习\n## 深度学习\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "布局模式：tree（默认缩进树，通用）/ radial（左右放射，知识梳理/概念图首选）/ lr（中心向右，流程图/决策树）/ rl（中心向左，反向追溯）/ tb（中心向下，组织架构）/ bt（中心向上，自底向上层级）"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "分支配色 JSON 数组，如 [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]。3~8 个十六进制颜色，按顺序分配给各一级分支。不传则使用蓝紫/绿/黄/红/天蓝/深绿/橙/紫默认色板"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "初始折叠的节点 ID 列表 JSON 数组，如 [\"n2\",\"n5\"]。空则全部展开。用于聚焦重点分支"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "最大可见深度，1=仅一级分支，2=一二级，默认无限制。节点密集时建议设为 2 保持可读性"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "将时间序列数据渲染为美观的时间轴卡片。只需输出 JSON（约 100 tokens），前端即时渲染。适用场景：项目里程碑、历史事件、版本迭代计划、发展历程。每个事件可含日期、标题、描述、颜色和类别。🎨 视觉风格：请通过 palette 参数设置全局配色方案（如蓝紫渐变/暖棕古铜/品牌色系），让时间线有统一的情绪基调。各 item.color 可覆盖单独条目。推荐 density=relaxed 用于≤5 条精选事件，density=compact 用于 10+ 条密集时间线。📐 8 种布局：vertical（纵向，5-20 条通用）/ alternating-top（交替上，左右交替、时间倒序）/ alternating-bottom（交替下，左右交替、时间顺序）/ horizontal-left（横向左，时间倒序、箭头左）/ horizontal-right（横向右，时间顺序、箭头右）/ s-curve（S 形蜿蜒路径，≤8 条）/ fishbone-left（鱼骨左，时间倒序、箭头左）/ fishbone-right（鱼骨右，时间顺序、箭头右）。"
"Timeline title (up to 30 characters), e.g. Product Milestones": "时间轴标题（≤ 30 字），如「产品发展里程碑」"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "时间轴事件 JSON 数组。示例：[{\"date\":\"2024-01\",\"title\":\"v1.0发布\",\"description\":\"基础功能上线\",\"color\":\"#5470c6\",\"category\":\"里程碑\"}]。description/color/category 可省略"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "布局模式：vertical（纵向）/ alternating-top（交替上，左右交替倒序）/ alternating-bottom（交替下，左右交替顺序）/ horizontal-left（横向左，倒序）/ horizontal-right（横向右，顺序）/ s-curve（S形）/ fishbone-left（鱼骨左，倒序）/ fishbone-right（鱼骨右，顺序）"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "全局配色方案 JSON 数组，如 [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]。覆盖默认 8 色轮转。各 item.color 优先级更高"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "条目间距：compact（紧凑 12px）/ normal（默认 20px）/ relaxed（宽松 32px）。≤5 条精选事件推荐 relaxed，10+ 条推荐 compact"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "将 SVG 或 HTML 片段渲染到对话气泡中。适用：时间线/关系图（SVG）、表单预览/数据卡片（HTML）、统计图表（SVG）。禁止用于 Mermaid 图表，Mermaid 请在正文以 ```mermaid 代码块输出。约束：≤ 200KB，<script src=...> 仅限受信任 CDN。🎨 视觉风格：请根据对话主题为生成的 HTML/SVG 选择信息架构（Bento/卡片流/Grid）、字体层级和色彩体系。技术讨论用冷色无衬线、商业报告用中性色+关键数字突出、创意设计可用渐变/玻璃态/微动效。显式指定 font-family 和 color，禁止浏览器默认样式。"
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widget 标题（≤ 30 字），如『订单状态流程图』"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG 以 <svg 开头；HTML 片段以根标签开头，不含 <html><body>。最大 200KB，<script src=...> 仅限受信任 CDN。禁止传入 Mermaid 语法（flowchart/graph/sequenceDiagram 等），Mermaid 应在正文以 ```mermaid 代码块输出"
"Placeholder text shown while loading (optional)": "加载占位文本，可选。渲染完成前展示"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "主题提示：light（浅色）/ dark（深色）/ auto（跟随系统）。AI 生成 HTML 时应据此选择背景色和文字色，不传入前端渲染"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Widget 初始高度（px，80~1200），默认 480。紧凑卡片建议 300-400，大图表建议 600-800"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "背景模式：solid（纯色背景，默认）/ transparent（透明背景，截图后可叠加到 PPT 模板底图上）"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT 幻灯片模式。true 时卡片按 16:9 宽高比渲染，适合直接粘贴到演示文稿。默认 false 沿用自适应内容宽度"
"Section heading text, e.g. Completed this week": "节标题文本，如「本周完成」"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "标题级别：1=一级（最大），2=二级，3=三级，默认1"
"Body paragraph text (optional; used together with elements)": "正文段落文本（可选，与 elements 配合使用）"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "结构化元素数组（可选）：paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "元素类型：paragraph（段落）/ bullet_list（无序列表）/ ordered_list（有序列表）/ table（表格）/ image（图片）/ page_break（分页）/ divider（分隔线）/ callout（高亮提示框）/ kpi（大数字指标）/ quote（引用块）/ code（代码块）"
"Text content (used when type=paragraph/callout/quote/code)": "文本内容（type=paragraph/callout/quote/code 时使用）"
"List item array (used when type=bullet_list or ordered_list)": "列表条目数组（type=bullet_list 或 ordered_list 时使用）"
"Table header row (required when type=table)": "表格列标题（type=table 时必填）"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "表格数据行（type=table 时必填），每行为一个单元格值数组，如 [[\"张三\",\"85\"],[\"李四\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "表格样式（type=table 时可选）：headerBgColor 表头背景色、headerFontColor 表头字色、stripeColor 斑马纹色"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "图片 URL（type=image 时必填），支持 https:// 外链或 /cube/image?id=xxx 内部附件"
"Image width in centimeters (type=image); default 14cm": "图片宽度（厘米），type=image 时有效，默认 14cm"
"Image height in centimeters (type=image); default 10cm": "图片高度（厘米），type=image 时有效，默认 10cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "是否加粗（type=paragraph/callout/quote 时可选）"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "是否斜体（type=paragraph/callout/quote 时可选）"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "是否下划线（type=paragraph/callout/quote 时可选）"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "字号（磅），如 12（type=paragraph/callout 时可选）"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "文字颜色（16进制 RGB，如 \"2563EB\"，type=paragraph/callout/quote 时可选）"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "文字对齐：left/center/right/justify（type=paragraph 时可选）"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "段落背景色（16进制 RGB，如 \"EFF6FF\"，type=paragraph 时可选）"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "高亮框变体（type=callout 时有效）：info（蓝）/ success（绿）/ warning（黄）/ danger（红），默认 info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI 指标数值（type=kpi 时必填），如 \"1,768万\""
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI 指标说明（type=kpi 时可选），如 \"环比增长\""
"KPI trend (optional when type=kpi): up / down / flat": "KPI 趋势（type=kpi 时可选）：up（上升）/ down（下降）/ flat（持平）"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "引用来源（type=quote 时可选），如 \"《2026年度报告》\""
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "代码语言（type=code 时可选），如 sql/python/javascript，用于选择语法高亮色"
"Worksheet name, e.g. Q2 Data": "工作表名称，如「Q2数据」"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "列标题数组，如 [\"日期\",\"营收\",\"环比\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "数据行（二维数组），每行为一个单元格值数组，如 [[\"张三\",\"85\"],[\"李四\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "表头样式（可选）：headerBgColor 表头背景色、headerFontColor 表头字色、stripeColor 斑马纹色"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "列宽数组（可选），如 [12, 20, 15]，数字单位近似字符宽度"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "数字格式（可选），如 \"#,##0.00\" 或 \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "条件格式数组（可选）。每项字段：range（如\"C2:C10\"）、type（dataBar/colorScale/greaterThan/lessThan 等）、color（主色）、value（阈值）"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "图表定义数组（可选）：type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "冻结首几行（0=不冻结，1=冻结首行，默认1）"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "自动筛选范围（如 \"A1:E1\"，为空则不启用）"
"Dropdown validation array (optional)": "下拉列表验证数组（可选）"
"Applied range (e.g. \"C2:C10\")": "应用范围（如 \"C2:C10\"）"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "条件类型：dataBar（数据条）/ colorScale（色阶）/ greaterThan（大于）/ lessThan（小于）/ equal（等于）/ between（介于）"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "颜色（16进制 RGB，如 \"2563EB\"），用于数据条/色阶/高亮"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "阈值或公式（如 \"1000\" 或 \"=AVERAGE(C2:C10)\"）"
"Chart type: bar / line / pie": "图表类型：bar（柱状）/ line（折线）/ pie（饼图）"
"Chart title (optional)": "图表标题（可选）"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "分类轴标签数组，如 [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "数据系列数组，每项含 name 和 data"
"Applied range (e.g. \"A2:A100\")": "应用范围（如 \"A2:A100\"）"
"Dropdown option array": "下拉选项数组"
"Title of this slide": "本页幻灯片的标题"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "页面布局：title_only（仅标题，封面用）/ title_content（标题+正文，默认）/ two_column（左右两栏）/ chart_only（全幅图表）/ blank（空白画布）"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "幻灯片背景色，16进制 RGB，如 \"1F497D\"。不填时使用主题默认背景"
"Slide element list; each element describes a text block, table, chart, or image": "页面元素列表，每个元素描述一段文字、表格、图表或图片"
"Footer text displayed at the bottom of the slide; null hides it": "页脚文本，显示在幻灯片底部，null 表示不显示"
"Whether to show the slide number in the bottom-right corner; default false": "是否在右下角显示幻灯片序号，默认 false"
"Speaker notes used as a reminder while presenting": "演讲者备注文本，用于演讲时提示"
"Transition animation: fade / push / wipe / zoom / split / cut": "切换动画：fade（淡入淡出）/ push（推入）/ wipe（擦除）/ zoom（缩放）/ split（分裂）/ cut（直切）"
"Element type: text / table / chart / image": "元素类型：text（文字）/ table（表格）/ chart（图表）/ image（图片）"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "语义角色（text 元素专用）：title（标题）/ subtitle（副标题）/ body（正文）/ caption（注释/来源）/ kpi（大数字指标）。布局引擎据此自动定位，无需指定坐标"
"Text content (required when type=text)": "文字内容（type=text 时必填）"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "字号（磅），可选，不填时由布局引擎按 role 自动决定（title≈28、kpi≈44、body≈16）"
"Whether the text is bold; default false": "是否加粗，默认 false"
"Whether the text is italic (optional for type=text); default false": "是否斜体（type=text 时可选），默认 false"
"Whether the text is underlined (optional for type=text); default false": "是否下划线（type=text 时可选），默认 false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "文字颜色，16进制 RGB，如 \"FFFFFF\"。不填时继承主题文字色"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "表格列标题数组（type=table 时必填），如 [\"指标\",\"Q1\",\"Q2\",\"环比\"]"
"Chart type (required when type=chart): bar / line / pie": "图表类型（type=chart 时必填）：bar（柱状图）/ line（折线图）/ pie（饼图）"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "图表分类标签（type=chart 时必填），如 [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "数据系列（type=chart 时必填），每项包含 name（系列名）和 data（数值数组）"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "文字对齐（text 元素）：l（左对齐）/ ctr（居中）/ r（右对齐）"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "文本框背景色（text 元素），16进制 RGB，如 \"EFF6FF\"，为空则透明"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "富文本片段（text 元素，有内容时忽略 Content/FontSize/Bold/Color）"
"Shape configuration (required when type=shape)": "基本形状配置（type=shape 时必填）"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "表格样式（type=table 时可选）：headerBgColor 表头背景色、headerFontColor 表头字色、stripeColor 斑马纹色"
"Text content": "文本内容"
"Font size in points; 0 inherits the text box default": "字号（磅），0 表示继承文本框默认字号"
"Whether the text is bold": "是否粗体"
"Whether the text is italic": "是否斜体"
"Whether the text is underlined": "是否下划线"
"Text color, hex RGB such as \"FF6B6B\"": "文字颜色，16进制 RGB，如 \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "超链接 URL，不为空时点击该片段跳转"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "形状类型：rect（矩形）/ ellipse（椭圆）/ roundRect（圆角矩形）/ triangle（三角形）/ diamond（菱形）/ arrow（箭头）"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "填充色（16进制 RGB，如 \"2563EB\"），null 表示无填充"
"Border color (hex RGB); null means no border": "边框颜色（16进制 RGB），null 表示无边框"
"Text displayed inside the shape (optional)": "形状内显示的文字（可选）"
"Text color inside the shape (hex RGB)": "形状内文字颜色（16进制 RGB）"
"Font size of the text inside the shape (points); 0 means default": "形状内文字字号（磅），0 表示默认"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "表头行背景色（16进制 RGB，如 \"2563EB\"），不填则无特殊样式"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "表头行文字颜色（16进制 RGB，如 \"FFFFFF\"），不填则继承默认"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "斑马纹颜色（偶数数据行背景色，如 \"EFF6FF\" 浅蓝），不填则无斑马纹"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "列唯一标识（必填），如 \"todo\"、\"doing\"、\"done\""
"Column title (required, up to 20 characters)": "列标题（必填，≤ 20 字）"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "列标题颜色（可选），十六进制，如 \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "WIP 上限（可选），超限时列标题变红"
"Card array (required)": "卡片数组（必填）"
"Unique card ID (required)": "卡片唯一标识（必填）"
"Card title (required, up to 40 characters)": "卡片标题（必填，≤ 40 字）"
"Supplementary description (optional, up to 100 characters)": "补充说明（可选，≤ 100 字）"
"Priority (optional): high | medium | low": "优先级（可选）：high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "标签字符串数组（可选），如 [\"设计\",\"前端\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "截止日期（可选），ISO 8601 格式如 \"2026-07-15\""
"Assignee name (optional)": "负责人姓名（可选）"
"Subtask checklist (optional); each item has title and done": "子任务清单（可选），每项含 title（标题）和 done（是否完成）"
"Completion progress (optional), 0-100": "完成进度（可选）0-100"
"Related link URL (optional)": "关联链接 URL（可选）"
"Subtask title": "子任务标题"
"Whether the subtask is done": "是否已完成"
"Unique swimlane ID (required)": "泳道唯一标识（必填）"
"Swimlane title (required)": "泳道标题（必填）"
"Column ID array contained in this swimlane (required)": "该泳道包含的列 ID 数组（必填）"
"City or place name (required), e.g. Beijing": "城市/点位名称（必填），如 \"北京\""
"Latitude (required), WGS84 decimal degrees": "纬度（必填），WGS84 十进制度"
"Longitude (required), WGS84 decimal degrees": "经度（必填），WGS84 十进制度"
"Marker label text (optional); supports \\n line breaks": "标注标签文字（可选），支持 \\n 换行"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "标注颜色（可选），十六进制如 \"#E74C3C\"；不填自动按配色方案轮转"
"Marker size (optional); default 7": "标注尺寸（可选），默认 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "省份名称（必填），支持全称或简称，如 \"广东省\" 或 \"广东\""
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "高亮颜色（可选），十六进制如 \"#FFB347\"；不填使用默认色"
"Highlight label (optional), e.g. No.1 GDP": "高亮标签（可选），如 \"GDP第一\""
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "事件日期（必填），任意格式，如 \"2024-01\"、\"2024年Q3\"、\"第一阶段\""
"Event title (required, up to 30 characters)": "事件标题（必填，≤ 30 字）"
"Supplementary description (optional, up to 80 characters)": "补充说明（可选，≤ 80 字）"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "十六进制颜色（可选），如 \"#5470c6\"；不填则自动轮转配色"
"Event category label (optional), e.g. Milestone, Release, Issue": "事件类别标签（可选），如 \"里程碑\"、\"发布\"、\"问题\""
