"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Tematip: light / dark / auto (følg systemet). Den genererede HTML bør vælge baggrunds- og tekstfarve derefter; sendes ikke til frontend-rendereren"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Indledende widgetshøjde i px (80-1200). Standard 480. Brug 300-400 til kompakte kort og 600-800 til store diagrammer"
