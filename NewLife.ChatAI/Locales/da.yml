"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Opretter et Word-dokument (.docx) og returnerer et downloadlink. Understøtter overskrifter, afsnit, lister, tabeller, billeder, sideskift, skillelinjer, fremhævede felter, KPI'er, citater og kodeblokke. JSON-arrayet sections beskriver hvert afsnit med heading, content og elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Dokumenttitel (højst 30 tegn), for eksempel Kvartalsrapport Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Array med afsnit (JSON). Felter pr. afsnit: heading (afsnitsoverskrift), headingLevel (1-3, standard 1), content (brødtekstafsnit, valgfrit), elements (elementarray, valgfrit). Elementtyper: paragraph ({type,text, valgfrit bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, valgfrit tableStyle}; rows er et todimensionelt array, hvor hver række er et array af celle værdier, for eksempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (valgfrit): nøgle til kortstil (for eksempel enterprise-blue) eller indbygget navn (blue/dark/corporate/warm/green/minimal); hvis det udelades, bruges samtalestilen eller brandets standard"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Opretter en Excel-projektmappe (.xlsx) og returnerer et downloadlink. Understøtter flere regneark, overskriftsstile, kolonnebredder, talformater, betinget formatering, fastfrosne ruder, autofiltre og validering af rullelister. Parameteren theme accepterer en kortstilsnøgle eller et indbygget navn (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Projektmappetitel (højst 30 tegn), for eksempel Indtægtsrapport Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Array med regneark (JSON). Felter pr. ark: name, headers (overskriftsarray), rows (todimensionelt array; hver række er et array af celle værdier, for eksempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (for eksempel [12,20,15]), numberFormat (for eksempel \"#,##0.00\" eller \"yyyy-MM-dd\"), conditionalFormats (array af {range,type,color,value?}; type understøtter dataBar/colorScale/greaterThan osv.), charts (diagramarray), freezeRows (antal frosne rækker), autoFilter (filterområde), dropdowns (rullelisevalidering)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (valgfrit): nøgle til kortstil (for eksempel enterprise-blue) eller indbygget navn (blue/dark/corporate/warm/green/minimal) der styrer overskrift og overordnede farver; hvis det udelades, bruges samtalestilen eller brandets standard"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Opretter en PowerPoint-præsentation (.pptx) og returnerer et downloadlink. To gensidigt udelukkende inputtilstande: (1) slides-tilstand, hvor AI beskriver struktureret indhold, og layoutet genereres automatisk; (2) widgetSrc-tilstand, der indlejrer tidligere oprettede show_widget-kort som slidebilleder. Parameteren theme accepterer en kortstilsnøgle (for eksempel enterprise-blue/raycast-dark/ppt-executive) eller et indbygget navn (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Præsentationstitel (højst 30 tegn), for eksempel Kvartalsgennemgang Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Array med slides (JSON). Et element = et slide; flere = en komplet præsentation. Gensidigt udelukkende med widgetSrc. Felter pr. slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hexfarve), footer, showPageNumber (true/false), elements (elementliste), notes, transition. elements understøtter: text (role=title/subtitle/body/kpi/caption; valgfrit bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows er et todimensionelt array, hvor hver række er et array af celle værdier, for eksempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; valgfrit tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Eksempel: [{\"title\":\"Forside\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Gennemgang Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife-teamet\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Kommasepareret liste af show_widget-kort-ID'er, for eksempel 'call_abc123,call_def456'. Gensidigt udelukkende med slides. Gengiver de oprettede kort som slidebilleder"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (valgfrit): nøgle til kortstil (for eksempel enterprise-blue/ppt-executive) eller indbygget navn (blue/dark/corporate/warm/green/minimal osv.); hvis det udelades, bruges samtalestilen eller brandets standard"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Viser data som et interaktivt diagram (zoom, svæv, eksport som billede). Cirka 20 gange hurtigere end show_widget: kun en JSON-specifikation (cirka 200 tokens) er nødvendig, og frontend gengiver den straks med ECharts. Understøtter: bar, line (linje/område), pie (cirkel/ring), scatter, radar, map_china (varmekort pr. kinesisk provins), heatmap (matrix-varmekort), gauge, funnel og treemap. Velegnet til numeriske sammenligninger, tidsserier (linje), andelsanalyser og geografisk fordeling. Bemærk: til rejseplaner, historiske begivenheder, milepæle og tidslinjer skal du bruge show_timeline; dette værktøj understøtter ikke typen timeline. Visuel stil: send et farveskema via data.colors i stedet for at stole på ECharts-standarder. Forslag: brandfarve til én serie, jævnt fordelte nuancer (10-12 farver) til flere serier, komplementærfarver til sammenligninger og en enkeltfarvet gradient til tendenser. Blå og guld til finans, blå/grøn/hvid til sundhed og violet/blå/cyan til teknik og AI. Ved store datasæt sættes data.animation=false for at reducere gengivelsesomkostningerne."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Diagramtype: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Diagramtitel (højst 30 tegn), for eksempel BNP pr. provins 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON-objekt; strukturen er beskrevet i værktøjsbeskrivelsen. bar-eksempel: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Indtægter\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; radar-eksempel med flere serier: {\"indicators\":[{\"name\":\"Hastighed\",\"max\":100},{\"name\":\"Styrke\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar-krav: antallet af indicators skal svare til længden af hver series[i].data, og data må kun indeholde tal"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Henter oplysninger om den aktuelt loggede bruger, inklusive brugernavn, visningsnavn, e-mail, mobil, kode, roller, afdeling, køn, alder, fødselsdag og bemærkning samt besøgendes IP-adresse, by og detaljeret geografisk placering"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Søger databaseskemaer efter nøgleord. Resultatet har to dele: (1) en mapping tabel-til-forbindelse (Markdown-tabel der viser, hvilken forbindelse hver tabel hører til; tabeller med samme navn under forskellige forbindelser vises separat); (2) tabel-skemaet XML for hver forbindelse. Senere run_sql-kald skal bruge forbindelsesnavnet fra mappingtabellen"
"Search keywords, separated by commas or spaces": "Søgeord adskilt af kommaer eller mellemrum"
"Restrict to a connection name; empty searches all connections": "Begræns til et forbindelsesnavn; tomt søger i alle forbindelser"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Kører en SQL-sætning på den angivne databaseforbindelse. SELECT/WITH-forespørgsler returnerer rækker; ikke-forespørgselssætninger som INSERT/UPDATE/DELETE returnerer antallet af berørte rækker. connName skal svare til forbindelseskolonnen, som search_table returnerer"
"Database connection name (from the connection column of search_table)": "Databaseforbindelsesnavn (fra forbindelseskolonnen i search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL-sætning. SELECT/WITH returnerer et resultatsæt; ikke-forespørgselssætninger returnerer antallet af berørte rækker"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Slår månedskalenderdato, solterm og arbejdsdagsstatus (arbejdsdag/helligdag/erstatningsdag) op for en dato"
"Date to query in yyyy-MM-dd format. Defaults to today": "Dato der skal slås op i formatet yyyy-MM-dd. Standard er i dag"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Viser en opgaveliste som en kanbantavle med flere kolonner (for eksempel Skal gøres -> I gang -> Færdig). Velegnet til projektopdeling, sprintplanlægning, arbejdsgangsvisning og opgavestatusklassificering. Hver kolonne kan have en farvemarkering og en WIP-grænse; hvert kort kan have titel, beskrivelse, prioritet, tags, forfaldsdato, ansvarlig, tjekliste, fremdrift og link. To layouts: board (standardtavle med flere kolonner) og swimlane (kolonner grupperet efter team eller modul)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Tavltitel (højst 30 tegn), for eksempel Sprint 1-tavle"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "JSON-array med kolonnedefinitioner. Eksempel: [{\"id\":\"todo\",\"title\":\"Skal gøres\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Kravanalyse\",\"description\":\"Indsaml brugerkrav\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview brugere\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Alle felter undtagen id og title er valgfrie"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Layouttilstand: board (standardtavle med flere kolonner) eller swimlane (kolonner grupperet efter team eller modul; parameteren swimlanes er påkrævet)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "JSON-array med swimlane-definitioner (bruges når layout=swimlane). Eksempel: [{\"id\":\"sl1\",\"title\":\"Frontend-team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Backend-team\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Markerer koordinatpunkter (byer eller POI'er) eller fremhæver provinser på et kort over Kina, opretter et annoteret SVG-kort og gengiver det i chatboblen. Understøtter: (1) provinsfyldning med egne farver; (2) WGS84-markeringer med bredde- og længdegrad samt etiket tekst; (3) automatisk forklaring i nederste højre hjørne. Typiske anvendelser: datadistribution pr. provins, byplaceringer og regionale salgsvarmekort."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Korttitel (højst 30 tegn), for eksempel BNP pr. provins 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "JSON-array med markeringer (kan være et tomt array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376 mia\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng er WGS84-decimalgrader; color/size er valgfrie"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "JSON-array med provinsfremhævninger (kan være et tomt array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"Nr. 1 BNP\"}]. name accepterer det kinesiske provinsnavn (fuldt eller kort); label er valgfrit"
"Legend title (optional), e.g. GDP scale": "Forklaringstitel (valgfrit), for eksempel BNP-skala"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Farveskema (valgfrit): blue/orange/green/purple/red; standard blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Markeringsstil (valgfrit): circle/pin/square; standard circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Viser videnshierarkier eller begrebsrelationer som et sammenklappeligt interaktivt mindmap. Input er en Markdown-disposition (# / ## / ###), som frontend omdanner til et visuelt træ. Velegnet til vidensorganisering, begrebsopdeling, teknologisammenligning, valgmulighedsvurdering og indholdssammenfatning. Visuel stil: vælg branchColors (3-8 afstemte farver), maxDepth (kompleksitet) og collapsed (indledningsvist sammenklappet for fokus) ud fra emnet. Kolde farver (blå/violet/cyan) til teknik og data, varme farver (orange/guld/rød) til forretning og marketing, og grønne til natur og sundhed. Ved tætte knuder sættes maxDepth=2 for læsbarhed. 6 layouts: tree (indrykket træ, standard, generel) / radial (radial venstre-højre, bedst til videnskort) / lr (fra midten til højre, flowchart/beslutningstræer) / rl (fra midten til venstre, bagudgående sporing) / tb (fra midten nedad, organisationsdiagrammer) / bt (fra midten opad, hierarki nedefra og op)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Mindmap-titel (højst 30 tegn), for eksempel AI-teknologistak"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown-disposition med # / ## / ### for niveauerne 1-3. Eksempel:\n# Kunstig intelligens\n## Maskinlæring\n### Superviseret læring\n### Uden tilsyn læring\n## Dybdelæring\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Layouttilstand: tree (indrykket træ, standard, generel) / radial (radial venstre-højre, bedst til videnskort) / lr (fra midten til højre, flowchart/beslutningstræer) / rl (fra midten til venstre, bagudgående sporing) / tb (fra midten nedad, organisationsdiagrammer) / bt (fra midten opad, hierarki nedefra og op)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "JSON-array med grenfarver, for eksempel [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3 til 8 hexfarver tildeles i rækkefølge til førsteniveaugrenene. Hvis det udelades, bruges standardpaletten blå/violet, grøn, gul, rød, himmelblå, mørkegrøn, orange, violet"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "JSON-array med ID'er på knuder, der er sammenklappet fra start, for eksempel [\"n2\",\"n5\"]. Tomt udvider alt. Bruges til at fokusere på vigtige grene"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Maksimal synlig dybde: 1 = kun førsteniveaugrene, 2 = to niveauer, ubegrænset som standard. Ved tætte knuder sættes 2 for læsbarhed"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Viser tidsseriedata som pæne tidslinjekort. Kun JSON (cirka 100 tokens) er nødvendig, og frontend gengiver det øjeblikkeligt. Velegnet til projektmilepæle, historiske begivenheder, udgivelsesplaner og udviklingshistorik. Hver begivenhed kan have dato, titel, beskrivelse, farve og kategori. Visuel stil: angiv en global palette via parameteren palette (for eksempel blå-violet gradient, varm bronze, brandfarver) for en ensartet stemning; item.color tilsidesætter en enkelt post. Brug density=relaxed til 5 eller færre udvalgte begivenheder og density=compact til 10 eller flere. 8 layouts: vertical (5-20 poster) / alternating-top (skiftevis over, omvendt kronologisk) / alternating-bottom (skiftevis under, kronologisk) / horizontal-left (vandret til venstre, omvendt kronologisk) / horizontal-right (vandret til højre, kronologisk) / s-curve (S-formet sti, 8 poster eller færre) / fishbone-left (fiskeben til venstre, omvendt kronologisk) / fishbone-right (fiskeben til højre, kronologisk)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Tidslinjetitel (højst 30 tegn), for eksempel Produktmilepæle"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "JSON-array med tidslinjebegivenheder. Eksempel: [{\"date\":\"2024-01\",\"title\":\"v1.0 udgivet\",\"description\":\"Kernefunktioner lanceret\",\"color\":\"#5470c6\",\"category\":\"Milepæl\"}]. description/color/category er valgfrie"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Layouttilstand: vertical / alternating-top (skiftevis over, omvendt rækkefølge) / alternating-bottom (skiftevis under, kronologisk) / horizontal-left (vandret, omvendt kronologisk) / horizontal-right (vandret, kronologisk) / s-curve / fishbone-left (fiskeben, omvendt kronologisk) / fishbone-right (fiskeben, kronologisk)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "JSON-array med global palette, for eksempel [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Erstatter standardrotationen med 8 farver. item.color har forrang"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Afstand mellem poster: compact (12px) / normal (20px, standard) / relaxed (32px). relaxed passer til 5 eller færre udvalgte begivenheder; compact til 10 eller flere"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Gengiver et SVG- eller HTML-fragment i chatboblen. Brug den til tidslinjer og relationsdiagrammer (SVG), formularforhåndsvisninger og datakort (HTML) samt statistiske diagrammer (SVG). Brug den ikke til Mermaid-diagrammer; angiv Mermaid som en ```mermaid-kodeblok i svaret. Grænser: højst 200 KB; <script src=...> kun fra betroede CDN'er. Visuel stil: vælg informationsarkitektur (Bento/kortflow/Grid), typografisk hierarki og farvesystem ud fra emnet. Kolde sans-serif-toner til tekniske diskussioner, neutrale farver med fremhævede tal til forretningsrapporter og gradienter/glassmorphism/mikroanimationer til kreativt arbejde. Angiv altid font-family og color eksplicit; stol ikke på browserens standardstile."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widgettitel (højst 30 tegn), for eksempel Ordrestatusflow"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG skal begynde med <svg; HTML-fragmenter skal begynde med rodelementet og må ikke indeholde <html><body>. Højst 200 KB; <script src=...> kun fra betroede CDN'er. Angiv ikke Mermaid-syntaks (flowchart/graph/sequenceDiagram osv.); angiv Mermaid som en ```mermaid-kodeblok i svaret"
