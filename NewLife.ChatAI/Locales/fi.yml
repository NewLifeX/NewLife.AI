"Card array (required)": "Korttien taulukko (pakollinen)"
"Unique card ID (required)": "Kortin yksilöllinen tunniste (pakollinen)"
"Card title (required, up to 40 characters)": "Kortin otsikko (pakollinen, enintään 40 merkkiä)"
"Supplementary description (optional, up to 100 characters)": "Täydentävä kuvaus (valinnainen, enintään 100 merkkiä)"
