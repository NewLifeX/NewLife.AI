"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Asiakirjan otsikko (enintään 30 merkkiä), esimerkiksi Q2-osavuosikatsaus"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Osioiden taulukko (JSON). Jokaisen osion kentät: heading (osion otsikko), headingLevel (1-3, oletus 1), content (leipätekstikappale, valinnainen), elements (elementtitaulukko, valinnainen). Elementtityypit: paragraph ({type,text, valinnaisesti bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, valinnaisesti tableStyle}; rows on kaksiulotteinen taulukko, jossa jokainen rivi on soluarvojen taulukko, esimerkiksi [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Teema (valinnainen): kortin tyylin avain (esimerkiksi enterprise-blue) tai sisäänrakennettu nimi (blue/dark/corporate/warm/green/minimal); jos jätetään pois, käytetään keskustelun tyyliä tai brändin oletusta"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Luo Excel-työkirjan (.xlsx) ja palauttaa latauslinkin. Tukee useita laskentataulukoita, otsikkotyylejä, sarakeleveyksiä, lukumuotoja, ehdollista muotoilua, kiinnitettyjä ruutuja, automaattisuodattimia ja avattavien luetteloiden tarkistusta. Parametri theme hyväksyy kortin tyylin avaimen tai sisäänrakennetun nimen (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Työkirjan otsikko (enintään 30 merkkiä), esimerkiksi Q2-tuottoraportti"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Laskentataulukoiden taulukko (JSON). Jokaisen taulukon kentät: name, headers (otsikkotaulukko), rows (kaksiulotteinen taulukko; jokainen rivi on soluarvojen taulukko, esimerkiksi [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (esimerkiksi [12,20,15]), numberFormat (esimerkiksi \"#,##0.00\" tai \"yyyy-MM-dd\"), conditionalFormats ({range,type,color,value?}-taulukko; type tukee dataBar/colorScale/greaterThan jne.), charts (kaaviotaulukko), freezeRows (kiinnitettävien rivien määrä), autoFilter (suodatusalue), dropdowns (avattavan luettelon tarkistus)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Teema (valinnainen): kortin tyylin avain (esimerkiksi enterprise-blue) tai sisäänrakennettu nimi (blue/dark/corporate/warm/green/minimal), joka ohjaa otsikkoa ja yleisvärejä; jos jätetään pois, käytetään keskustelun tyyliä tai brändin oletusta"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Luo PowerPoint-esityksen (.pptx) ja palauttaa latauslinkin. Kaksi toisensa poissulkevaa syöttötilaa: (1) slides-tila, jossa tekoäly kuvaa jäsennellyn sisällön ja asettelu luodaan automaattisesti; (2) widgetSrc-tila, joka upottaa aiemmin luodut show_widget-kortit dia­kuviksi. Parametri theme hyväksyy kortin tyylin avaimen (esimerkiksi enterprise-blue/raycast-dark/ppt-executive) tai sisäänrakennetun nimen (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Esityksen otsikko (enintään 30 merkkiä), esimerkiksi Q2-neljänneskatsaus"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Diojen taulukko (JSON). Yksi elementti = yksi dia; useita = koko esitys. Ristiriidassa widgetSrc:n kanssa. Jokaisen dian kentät: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex-väri), footer, showPageNumber (true/false), elements (elementtiluettelo), notes, transition. elements tukee: text (role=title/subtitle/body/kpi/caption; valinnaisesti bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows on kaksiulotteinen taulukko, jossa jokainen rivi on soluarvojen taulukko, esimerkiksi [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; valinnaisesti tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Esimerkki: [{\"title\":\"Kansikuva\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2-katsaus\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife-tiimi\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Pilkuilla erotettu luettelo show_widget-korttien tunnisteista, esimerkiksi 'call_abc123,call_def456'. Ristiriidassa slides-parametrin kanssa. Muuntaa luodut kortit dia­kuviksi"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Teema (valinnainen): kortin tyylin avain (esimerkiksi enterprise-blue/ppt-executive) tai sisäänrakennettu nimi (blue/dark/corporate/warm/green/minimal jne.); jos jätetään pois, käytetään keskustelun tyyliä tai brändin oletusta"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Näyttää tiedot interaktiivisena kaaviona (zoomaus, osoittaminen, vienti kuvaksi). Noin 20 kertaa nopeampi kuin show_widget: riittää JSON-määrittely (noin 200 tokenia), ja käyttöliittymä piirtää sen heti EChartsilla. Tukee: bar, line (viiva/alue), pie (ympyrä/rengas), scatter, radar, map_china (Kiinan provinssien lämpökartta), heatmap (matriisilämpökartta), gauge, funnel ja treemap. Sopii lukujen vertailuun, aikasarjoihin (viiva), osuuksien analysointiin ja maantieteelliseen jakautumiseen. Huom: matkasuunnitelmiin, historiallisiin tapahtumiin, virstanpylväisiin ja aikajanoihin käytä show_timeline-työkalua; tämä työkalu ei tue timeline-tyyppiä. Visuaalinen tyyli: välitä värimaailma data.colors-kentän kautta sen sijaan, että luottaisit EChartsin oletuksiin. Suositukset: brändiväri yhdelle sarjalle, tasaisesti jaetut sävyt (10-12 väriä) usealle sarjalle, täydentävät värit vertailuun ja yksivärinen liukuväri trendeille. Sininen ja kulta talouteen, sininen/vihreä/valkoinen terveyteen ja violetti/sininen/syaani teknologiaan ja tekoälyyn. Suurilla aineistoilla aseta data.animation=false keventääksesi piirtoa."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Kaavion tyyppi: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Kaavion otsikko (enintään 30 merkkiä), esimerkiksi BKT provinsseittain 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON-objekti; rakenne on kuvattu työkalun kuvauksessa. bar-esimerkki: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Tuotot\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; radar-esimerkki usealla sarjalla: {\"indicators\":[{\"name\":\"Nopeus\",\"max\":100},{\"name\":\"Voima\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar-vaatimus: indicators-määrän on oltava yhtä suuri kuin jokaisen series[i].data-pituus, ja data saa sisältää vain lukuja"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Palauttaa kirjautuneen käyttäjän tiedot, mukaan lukien käyttäjänimi, näyttönimi, sähköposti, matkapuhelin, koodi, roolit, osasto, sukupuoli, ikä, syntymäpäivä ja huomautus, sekä vierailijan IP-osoite, kaupunki ja tarkka sijainti"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Etsii tietokantataulujen skeemoja avainsanalla. Tulos koostuu kahdesta osasta: (1) taulukko-yhteys-kartoitus (Markdown-taulukko, joka kertoo, mihin yhteyteen kukin taulu kuuluu; samannimiset taulut eri yhteyksissä luetellaan erikseen); (2) taulujen skeema XML jokaiselle yhteydelle. Myöhempien run_sql-kutsujen on käytettävä kartoitustaulukon yhteysnimeä"
"Search keywords, separated by commas or spaces": "Hakusanat pilkuilla tai välilyönneillä erotettuina"
"Restrict to a connection name; empty searches all connections": "Rajoita yhteyden nimeen; tyhjä hakee kaikista yhteyksistä"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Suorittaa SQL-lauseen annetussa tietokantayhteydessä. SELECT/WITH-kyselyt palauttavat rivejä; muut kuin kyselyt, kuten INSERT/UPDATE/DELETE, palauttavat muutettujen rivien määrän. connNamein on vastattava search_tablen palauttamaa yhteys­saraketta"
"Database connection name (from the connection column of search_table)": "Tietokantayhteyden nimi (search_tablen yhteys­sarakkeesta)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL-lause. SELECT/WITH palauttaa tulosjoukon; muut kuin kyselyt palauttavat muutettujen rivien määrän"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Selvittää päivämäärän kuukalenterin päivämäärän, aurinkotermin ja työpäivän tilan (työpäivä/vapaapäivä/korvaava työpäivä)"
"Date to query in yyyy-MM-dd format. Defaults to today": "Kysyttävä päivämäärä muodossa yyyy-MM-dd. Oletus tänään"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Näyttää tehtäväluettelon monisarakkeisena kanban-tauluna (esimerkiksi Tehtävä -> Työn alla -> Valmis). Sopii projektin pilkontaan, sprintin suunnitteluun, työnkulun näyttämiseen ja tehtävien tilaluokitteluun. Jokaisella sarakkeella voi olla värimerkintä ja WIP-raja; jokaisella kortilla voi olla otsikko, kuvaus, prioriteetti, tunnisteet, määräpäivä, vastuuhenkilö, tarkistuslista, edistyminen ja linkki. Kaksi asettelua: board (oletus, monisarakkeinen taulu) ja swimlane (sarakkeet ryhmiteltyinä tiimin tai moduulin mukaan)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Taulun otsikko (enintään 30 merkkiä), esimerkiksi Sprint 1 -taulu"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "JSON-taulukko sarakemäärittelyistä. Esimerkki: [{\"id\":\"todo\",\"title\":\"Tehtävä\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Vaatimusanalyysi\",\"description\":\"Kerää käyttäjävaatimukset\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Haastattele käyttäjiä\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Kaikki kentät paitsi id ja title ovat valinnaisia"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Asettelutila: board (oletus, monisarakkeinen taulu) tai swimlane (sarakkeet ryhmiteltyinä tiimin tai moduulin mukaan; swimlanes-parametri vaaditaan)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "JSON-taulukko kaistamäärittelyistä (käytetään, kun layout=swimlane). Esimerkki: [{\"id\":\"sl1\",\"title\":\"Frontend-tiimi\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Backend-tiimi\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Merkitsee koordinaattipisteet (kaupungit tai POI-kohteet) tai korostaa provinsseja Kiinan kartalla, luo annotoidun SVG-kartan ja piirtää sen chat-kuplaan. Tukee: (1) provinssien täyttö omilla väreillä; (2) WGS84-leveys- ja pituusaste­merkit sekä etiketin teksti; (3) automaattinen selite oikeassa alakulmassa. Tyypillisiä käyttötapoja: tietojen jakautuminen provinsseittain, kaupunkien sijainnit ja alueelliset myynnin lämpökartat."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Kartan otsikko (enintään 30 merkkiä), esimerkiksi BKT provinsseittain 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "JSON-taulukko merkeistä (voi olla tyhjä taulukko []). Muoto: [{\"name\":\"Peking\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Peking\\n4376 mrd\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng ovat WGS84-desimaaliasteita; color/size ovat valinnaisia"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "JSON-taulukko provinssikorostuksista (voi olla tyhjä taulukko []). Muoto: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"Nro 1 BKT\"}]. name hyväksyy kiinankielisen provinssin nimen (täysi tai lyhyt); label on valinnainen"
"Legend title (optional), e.g. GDP scale": "Selitteen otsikko (valinnainen), esimerkiksi BKT-asteikko"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Värimaailma (valinnainen): blue/orange/green/purple/red; oletus blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Merkin tyyli (valinnainen): circle/pin/square; oletus circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Näyttää tietämyshierarkiat tai käsitesuhteet kokoontaitettavana interaktiivisena miellekarttana. Syöte on Markdown-jäsennys (# / ## / ###), jonka käyttöliittymä muuntaa visuaaliseksi puuksi. Sopii tiedon jäsentämiseen, käsitteiden pilkontaan, teknologiavertailuun, vaihtoehtojen arviointiin ja sisällön tiivistämiseen. Visuaalinen tyyli: valitse aiheen mukaan branchColors (3-8 yhteensopivaa väriä), maxDepth (monimutkaisuus) ja collapsed (alkuun taitettu keskittymisen vuoksi). Kylmät värit (sininen/violetti/syaani) teknologiaan ja dataan, lämpimät (oranssi/kulta/punainen) liiketoimintaan ja markkinointiin sekä vihreät luontoon ja terveyteen. Tiheissä solmuissa aseta maxDepth=2 luettavuuden vuoksi. 6 asettelua: tree (sisennetty puu, oletus, yleiskäyttöinen) / radial (vasen-oikea säteittäinen, paras tietokartoille) / lr (keskeltä oikealle, vuokaaviot/päätöspuut) / rl (keskeltä vasemmalle, taaksepäin jäljitys) / tb (keskeltä alaspäin, organisaatiokaaviot) / bt (keskeltä ylöspäin, hierarkia alhaalta ylös)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Miellekartan otsikko (enintään 30 merkkiä), esimerkiksi AI-teknologiapino"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown-jäsennys, jossa # / ## / ### osoittavat tasot 1-3. Esimerkki:\n# Tekoäly\n## Koneoppiminen\n### Ohjattu oppiminen\n### Ohjaamaton oppiminen\n## Syväoppiminen\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Asettelutila: tree (sisennetty puu, oletus, yleiskäyttöinen) / radial (vasen-oikea säteittäinen, paras tietokartoille) / lr (keskeltä oikealle, vuokaaviot/päätöspuut) / rl (keskeltä vasemmalle, taaksepäin jäljitys) / tb (keskeltä alaspäin, organisaatiokaaviot) / bt (keskeltä ylöspäin, hierarkia alhaalta ylös)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "JSON-taulukko haaraväreistä, esimerkiksi [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex-väriä annetaan järjestyksessä ensimmäisen tason haaroille. Jos jätetään pois, käytetään oletuspalettia sininen/violetti, vihreä, keltainen, punainen, taivaansininen, tummanvihreä, oranssi, violetti"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "JSON-taulukko alun perin taitettujen solmujen tunnisteista, esimerkiksi [\"n2\",\"n5\"]. Tyhjä avaa kaikki. Käytetään keskittymiseen tärkeisiin haaroihin"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Näkyvä enimmäissyvyys: 1 = vain ensimmäisen tason haarat, 2 = kaksi tasoa, oletuksena rajoittamaton. Tiheissä solmuissa aseta 2 luettavuuden vuoksi"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Näyttää aikasarjatiedot tyylikkäinä aikajanan kortteina. Riittää JSON (noin 100 tokenia), ja käyttöliittymä piirtää sen heti. Sopii projektin virstanpylväisiin, historiallisiin tapahtumiin, julkaisusuunnitelmiin ja kehityshistoriaan. Jokaisella tapahtumalla voi olla päivämäärä, otsikko, kuvaus, väri ja luokka. Visuaalinen tyyli: aseta yleinen paletti palette-parametrilla (esimerkiksi sinivioletti liukuväri, lämmin pronssi, brändivärit) yhtenäisen tunnelman luomiseksi; item.color ohittaa yksittäisen kohteen. Käytä density=relaxed 5 tai vähemmälle valitulle tapahtumalle ja density=compact 10 tai useammalle. 8 asettelua: vertical (5-20 kohdetta) / alternating-top (vuorotellen ylhäällä, käänteinen aikajärjestys) / alternating-bottom (vuorotellen alhaalla, aikajärjestys) / horizontal-left (vaakasuoraan vasemmalle, käänteinen aikajärjestys) / horizontal-right (vaakasuoraan oikealle, aikajärjestys) / s-curve (S-muotoinen polku, 8 kohdetta tai vähemmän) / fishbone-left (ruodot vasemmalle, käänteinen aikajärjestys) / fishbone-right (ruodot oikealle, aikajärjestys)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Aikajanan otsikko (enintään 30 merkkiä), esimerkiksi Tuotteen virstanpylväät"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "JSON-taulukko aikajanan tapahtumista. Esimerkki: [{\"date\":\"2024-01\",\"title\":\"v1.0 julkaistu\",\"description\":\"Ydinominaisuudet käyttöön\",\"color\":\"#5470c6\",\"category\":\"Virstanpylväs\"}]. description/color/category ovat valinnaisia"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Asettelutila: vertical / alternating-top (vuorotellen ylhäällä, käänteinen järjestys) / alternating-bottom (vuorotellen alhaalla, aikajärjestys) / horizontal-left (vaakasuoraan, käänteinen aikajärjestys) / horizontal-right (vaakasuoraan, aikajärjestys) / s-curve / fishbone-left (ruodot, käänteinen aikajärjestys) / fishbone-right (ruodot, aikajärjestys)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "JSON-taulukko yleisestä paletista, esimerkiksi [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Korvaa oletusarvoisen 8 värin kierron. item.color on ensisijainen"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Kohteiden väli: compact (12px) / normal (20px, oletus) / relaxed (32px). relaxed sopii 5 tai vähemmälle valitulle tapahtumalle; compact 10 tai useammalle"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Piirtää SVG- tai HTML-fragmentin chat-kuplaan. Käytä sitä aikajanoihin ja relaatiokaavioihin (SVG), lomake-esikatseluihin ja tietokortteihin (HTML) sekä tilastokaavioihin (SVG). Älä käytä sitä Mermaid-kaavioihin; anna Mermaid ```mermaid-koodilohkona vastauksessa. Rajoitukset: enintään 200 KB; <script src=...> vain luotetuista CDN-palveluista. Visuaalinen tyyli: valitse aiheen mukaan tietoarkkitehtuuri (Bento/korttivirta/Grid), typografinen hierarkia ja värijärjestelmä. Kylmät päätteettömät sävyt teknisiin keskusteluihin, neutraalit värit korostettuine lukuineen liiketoimintaraportteihin ja liukuvärit/glassmorphism/mikroanimaatiot luovaan työhön. Aseta aina font-family ja color eksplisiittisesti; älä luota selaimen oletustyyleihin."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widgetin otsikko (enintään 30 merkkiä), esimerkiksi Tilauksen tilavirta"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG:n on alettava merkillä <svg; HTML-fragmenttien on alettava juurielementillä eikä niissä saa olla <html><body>. Enintään 200 KB; <script src=...> vain luotetuista CDN-palveluista. Älä välitä Mermaid-syntaksia (flowchart/graph/sequenceDiagram jne.); anna Mermaid ```mermaid-koodilohkona vastauksessa"
"Placeholder text shown while loading (optional)": "Latauksen aikana näytettävä paikkamerkkiteksti (valinnainen)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Teemavihje: light / dark / auto (järjestelmän mukaan). Luodun HTML:n tulisi valita tausta- ja tekstiväri sen mukaisesti; ei välitetä käyttöliittymän renderöijälle"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Widgetin aloituskorkeus pikseleinä (80-1200). Oletus 480. Käytä 300-400 kompakteihin kortteihin ja 600-800 suuriin kaavioihin"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Taustatila: solid (oletus) / transparent (kuvakaappausten asettamiseen PPT-mallin päälle)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT-diatila. Kun true, kortti piirretään 16:9-suhteessa ja on valmis liitettäväksi esitykseen. Oletus false, joka säilyttää sisällön mukaisen leveyden"
"Section heading text, e.g. Completed this week": "Osion otsikkoteksti, esimerkiksi Tällä viikolla valmistunut"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Otsikkotaso: 1 = taso 1 (suurin), 2 = taso 2, 3 = taso 3; oletus 1"
"Body paragraph text (optional; used together with elements)": "Leipätekstikappale (valinnainen; käytetään yhdessä elements-kentän kanssa)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Jäsenneltyjen elementtien taulukko (valinnainen): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Elementin tyyppi: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Tekstisisältö (käytetään, kun type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Luettelokohteiden taulukko (käytetään, kun type=bullet_list tai ordered_list)"
"Table header row (required when type=table)": "Taulukon otsikkorivi (pakollinen, kun type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Taulukon tietorivit (pakollinen, kun type=table); jokainen rivi on soluarvojen taulukko, esimerkiksi [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Taulukon tyyli (valinnainen, kun type=table): headerBgColor (otsikon tausta), headerFontColor (otsikon tekstiväri), stripeColor (raidalliset rivit)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "Kuvan URL (pakollinen, kun type=image); tukee ulkoisia https://-linkkejä tai sisäisiä liitteitä, kuten /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Kuvan leveys senttimetreinä (type=image); oletus 14 cm"
"Image height in centimeters (type=image); default 10cm": "Kuvan korkeus senttimetreinä (type=image); oletus 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Onko teksti lihavoitu (valinnainen, kun type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Onko teksti kursivoitu (valinnainen, kun type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Onko teksti alleviivattu (valinnainen, kun type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Fontin koko pisteinä, esimerkiksi 12 (valinnainen, kun type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Tekstin väri (hex-RGB, esimerkiksi 2563EB; valinnainen, kun type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Tekstin tasaus: left/center/right/justify (valinnainen, kun type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Kappaleen taustaväri (hex-RGB, esimerkiksi EFF6FF; valinnainen, kun type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Korostuslaatikon variantti (type=callout): info (sininen) / success (vihreä) / warning (keltainen) / danger (punainen); oletus info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI-arvo (pakollinen, kun type=kpi), esimerkiksi 17,68 milj."
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI-selite (valinnainen, kun type=kpi), esimerkiksi kasvu edelliseen kuukauteen verrattuna"
"KPI trend (optional when type=kpi): up / down / flat": "KPI-trendi (valinnainen, kun type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Lainauksen lähde (valinnainen, kun type=quote), esimerkiksi Vuosikertomus 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Koodikieli (valinnainen, kun type=code), esimerkiksi sql/python/javascript; valitsee syntaksin korostusvärit"
"Worksheet name, e.g. Q2 Data": "Laskentataulukon nimi, esimerkiksi Q2-tiedot"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Sarakeotsikoiden taulukko, esimerkiksi [\"Päivä\",\"Tuotot\",\"Muutos\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Tietorivit (kaksiulotteinen taulukko); jokainen rivi on soluarvojen taulukko, esimerkiksi [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Otsikon tyyli (valinnainen): headerBgColor (otsikon tausta), headerFontColor (otsikon tekstiväri), stripeColor (raidalliset rivit)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Sarakkeiden leveystaulukko (valinnainen), esimerkiksi [12, 20, 15]; arvot ovat likimääräisiä merkkileveyksiä"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Lukumuoto (valinnainen), esimerkiksi \"#,##0.00\" tai \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Ehdollisen muotoilun taulukko (valinnainen). Jokaisen kohteen kentät: range (esimerkiksi \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan jne.), color (pääväri), value (kynnysarvo)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Kaavion määrittelyjen taulukko (valinnainen): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Kiinnitettävien ylärivien määrä (0 = ei mitään, 1 = kiinnitä ensimmäinen rivi; oletus 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Automaattisuodattimen alue (esimerkiksi \"A1:E1\"); pois käytöstä, kun tyhjä"
"Dropdown validation array (optional)": "Avattavien luetteloiden tarkistusten taulukko (valinnainen)"
"Applied range (e.g. \"C2:C10\")": "Käytetty alue (esimerkiksi \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Ehdon tyyppi: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Väri (hex-RGB, esimerkiksi 2563EB), jota käytetään tietopalkkeihin, väriasteikkoihin tai korostuksiin"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Kynnysarvo tai kaava (esimerkiksi 1000 tai =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Kaavion tyyppi: bar / line / pie"
"Chart title (optional)": "Kaavion otsikko (valinnainen)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Luokka-akselin tunnisteiden taulukko, esimerkiksi [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Tietosarjojen taulukko; jokaisella kohteella on name ja data"
"Applied range (e.g. \"A2:A100\")": "Käytetty alue (esimerkiksi \"A2:A100\")"
"Dropdown option array": "Avattavan luettelon vaihtoehtojen taulukko"
"Title of this slide": "Tämän dian otsikko"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Dian asettelu: title_only (vain otsikko, kansikuville) / title_content (otsikko + leipäteksti, oletus) / two_column (kaksi saraketta) / chart_only (kaavio koko leveydeltä) / blank (tyhjä kangas)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Dian taustaväri, hex-RGB kuten \"1F497D\"; jos jätetään pois, käytetään teeman taustaa"
"Slide element list; each element describes a text block, table, chart, or image": "Dian elementtiluettelo; jokainen elementti kuvaa tekstilohkon, taulukon, kaavion tai kuvan"
"Footer text displayed at the bottom of the slide; null hides it": "Dian alaosassa näytettävä alatunnisteteksti; null piilottaa sen"
"Whether to show the slide number in the bottom-right corner; default false": "Näytetäänkö dianumero oikeassa alakulmassa; oletus false"
"Speaker notes used as a reminder while presenting": "Puhujan muistiinpanot muistutuksena esityksen aikana"
"Transition animation: fade / push / wipe / zoom / split / cut": "Siirtymäanimaatio: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Elementin tyyppi: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Semanttinen rooli (vain text-elementit): title / subtitle / body / caption / kpi. Asettelumoottori käyttää sitä elementin automaattiseen sijoittamiseen, koordinaatteja ei tarvita"
"Text content (required when type=text)": "Tekstisisältö (pakollinen, kun type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Fontin koko pisteinä (valinnainen); jos jätetään pois, asettelumoottori valitsee koon roolin mukaan (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Onko teksti lihavoitu; oletus false"
"Whether the text is italic (optional for type=text); default false": "Onko teksti kursivoitu (valinnainen, kun type=text); oletus false"
"Whether the text is underlined (optional for type=text); default false": "Onko teksti alleviivattu (valinnainen, kun type=text); oletus false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Tekstin väri, hex-RGB kuten \"FFFFFF\"; jos jätetään pois, peritään teeman tekstiväri"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Taulukon otsikkotaulukko (pakollinen, kun type=table), esimerkiksi [\"Mittari\",\"Q1\",\"Q2\",\"Muutos\"]"
"Chart type (required when type=chart): bar / line / pie": "Kaavion tyyppi (pakollinen, kun type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Kaavion luokkatunnisteet (pakollinen, kun type=chart), esimerkiksi [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Tietosarjat (pakollinen, kun type=chart); jokaisella kohteella on name (sarjan nimi) ja data (lukutaulukko)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Tekstin tasaus (text-elementit): l (vasen) / ctr (keski) / r (oikea)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Tekstiruudun taustaväri (text-elementit), hex-RGB kuten \"EFF6FF\"; läpinäkyvä, kun tyhjä"
