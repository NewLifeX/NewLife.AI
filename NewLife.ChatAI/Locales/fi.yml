"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "Sarakkeen yksilöllinen tunniste (pakollinen), esimerkiksi \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "Sarakkeen otsikko (pakollinen, enintään 20 merkkiä)"
