"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Taulukon tyyli (valinnainen, kun type=table): headerBgColor (otsikon tausta), headerFontColor (otsikon tekstiväri), stripeColor (raidalliset rivit)"
"Text content": "Tekstisisältö"
"Font size in points; 0 inherits the text box default": "Fontin koko pisteinä; 0 perii tekstiruudun oletuksen"
"Whether the text is bold": "Onko teksti lihavoitu"
