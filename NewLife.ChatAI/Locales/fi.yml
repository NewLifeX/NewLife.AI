"Column ID array contained in this swimlane (required)": "Tässä kaistassa olevien saraketunnisteiden taulukko (pakollinen)"
"City or place name (required), e.g. Beijing": "Kaupungin tai paikan nimi (pakollinen), esimerkiksi Peking"
"Latitude (required), WGS84 decimal degrees": "Leveysaste (pakollinen), WGS84-desimaaliasteet"
"Longitude (required), WGS84 decimal degrees": "Pituusaste (pakollinen), WGS84-desimaaliasteet"
"Marker label text (optional); supports \\n line breaks": "Merkin etiketin teksti (valinnainen); tukee \\\\n-rivinvaihtoa"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "Merkin väri (valinnainen), hex kuten \"#E74C3C\"; jos jätetään pois, värit kiertävät värimaailman mukaan"
"Marker size (optional); default 7": "Merkin koko (valinnainen); oletus 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "Provinssin nimi (pakollinen); hyväksyy kiinankielisen provinssin nimen (täysi tai lyhyt), esimerkiksi Guangdong"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "Korostuksen väri (valinnainen), hex kuten \"#FFB347\"; oletuksena paletin väri"
"Highlight label (optional), e.g. No.1 GDP": "Korostuksen etiketti (valinnainen), esimerkiksi Nro 1 BKT"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "Tapahtuman päivämäärä (pakollinen); mikä tahansa muoto, esimerkiksi \"2024-01\", \"2024 Q3\" tai \"Vaihe 1\""
"Event title (required, up to 30 characters)": "Tapahtuman otsikko (pakollinen, enintään 30 merkkiä)"
"Supplementary description (optional, up to 80 characters)": "Täydentävä kuvaus (valinnainen, enintään 80 merkkiä)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "Hex-väri (valinnainen), esimerkiksi \"#5470c6\"; jos jätetään pois, paletti kiertää automaattisesti"
"Event category label (optional), e.g. Milestone, Release, Issue": "Tapahtuman luokkatunniste (valinnainen), esimerkiksi Virstanpylväs, Julkaisu, Ongelma"
