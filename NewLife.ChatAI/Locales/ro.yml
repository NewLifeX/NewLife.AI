"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Creează un document Word (.docx) și returnează un link de descărcare. Acceptă titluri, paragrafe, liste, tabele, imagini, întreruperi de pagină, separatoare, casete de evidențiere, carduri KPI, citate și blocuri de cod. Matricea JSON sections descrie fiecare secțiune prin heading, content și elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Titlul documentului (maximum 30 de caractere), de exemplu Raport trimestrul 2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Matricea de secțiuni (JSON). Câmpurile fiecărei secțiuni: heading (titlul secțiunii), headingLevel (1-3, implicit 1), content (paragraf de text, opțional), elements (matrice de elemente, opțional). Tipuri de elemente: paragraph ({type,text,opțional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,opțional tableStyle}; rows este o matrice bidimensională, fiecare rând fiind o matrice de valori de celule, de exemplu [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Temă (opțional): cheia stilului de card (de exemplu enterprise-blue) sau un nume încorporat (blue/dark/corporate/warm/green/minimal); dacă este omisă, se folosește stilul conversației sau implicitul mărcii"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Creează un registru Excel (.xlsx) și returnează un link de descărcare. Acceptă mai multe foi, stiluri de antet, lățimi de coloane, formate numerice, formatare condiționată, fixarea panourilor, filtrare automată și validare prin listă derulantă. Parametrul theme acceptă cheia stilului de card sau un nume încorporat (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Titlul registrului (maximum 30 de caractere), de exemplu Raport venituri trimestrul 2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Matricea de foi (JSON). Câmpurile fiecărei foi: name, headers (matrice de antete), rows (matrice bidimensională; fiecare rând este o matrice de valori de celule, de exemplu [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (de exemplu [12,20,15]), numberFormat (de exemplu \"#,##0.00\" sau \"yyyy-MM-dd\"), conditionalFormats (matrice de {range,type,color,value?}; type acceptă dataBar/colorScale/greaterThan și altele), charts (matrice de grafice), freezeRows (numărul de rânduri fixate), autoFilter (intervalul de filtrare) și dropdowns (validare prin listă derulantă)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Temă (opțional): cheia stilului de card (de exemplu enterprise-blue) sau un nume încorporat (blue/dark/corporate/warm/green/minimal) care controlează antetul și culorile generale; dacă este omisă, se folosește stilul conversației sau implicitul mărcii"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Creează o prezentare PowerPoint (.pptx) și returnează un link de descărcare. Două moduri de intrare care se exclud reciproc: (1) modul slides, în care AI descrie conținut structurat și aspectul este generat automat; (2) modul widgetSrc, care încorporează cardurile show_widget deja generate ca imagini de diapozitiv. Parametrul theme acceptă cheia stilului de card (de exemplu enterprise-blue/raycast-dark/ppt-executive) sau un nume încorporat (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Titlul prezentării (maximum 30 de caractere), de exemplu Analiza trimestrului 2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Matricea de diapozitive (JSON). Un element = un diapozitiv, mai multe elemente = prezentare completă. Se exclude reciproc cu widgetSrc. Câmpurile fiecărui diapozitiv: title, layout (title_only/title_content/two_column/chart_only/blank), background (culoare hexazecimală), footer, showPageNumber (true/false), elements (lista de elemente), notes și transition. elements acceptă: text (role=title/subtitle/body/kpi/caption; opțional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows matrice bidimensională, fiecare rând o matrice de valori de celule, de exemplu [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; opțional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Exemplu: [{\"title\":\"Copertă\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Analiza trimestrului 2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Echipa NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Listă de identificatori de carduri show_widget separați prin virgule, de exemplu 'call_abc123,call_def456'. Se exclude reciproc cu slides. Transformă cardurile generate în imagini de diapozitiv"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Temă (opțional): cheia stilului de card (de exemplu enterprise-blue/ppt-executive) sau un nume încorporat (blue/dark/corporate/warm/green/minimal etc.); dacă este omisă, se folosește stilul conversației sau implicitul mărcii"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Afișează datele ca grafic interactiv (zoom, hover, export ca imagine). De aproximativ 20 de ori mai rapid decât show_widget: este suficientă o specificație JSON (aproximativ 200 de tokenuri) și interfața îl desenează imediat cu ECharts. Acceptă: bar, line (linie/arie), pie (disc/gaură), scatter, radar, map_china (hartă termică pe provinciile Chinei), heatmap (hartă termică matricială), gauge, funnel, treemap. Potrivit pentru comparații numerice, serii temporale (linie), analiza proporțiilor și distribuție geografică. Notă: pentru rute, evenimente istorice, repere și cronologii folosiți show_timeline; acest instrument nu acceptă tipul timeline. Stil vizual: furnizați o paletă prin data.colors în loc să vă bazați pe valorile implicite ECharts. Sugestii: culoarea mărcii pentru o singură serie, nuanțe distribuite uniform (10-12 culori) pentru mai multe serii, culori complementare pentru comparații, gradient monocrom pentru tendințe. Albastru și auriu pentru financiar, albastru/verde/alb pentru sănătate, violet/albastru/cyan pentru tehnologie și AI. Pentru seturi mari de date setați data.animation=false pentru a reduce costul de randare."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Tipul graficului: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Titlul graficului (maximum 30 de caractere), de exemplu PIB pe provincii 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Obiect JSON; structura este descrisă în descrierea instrumentului. Exemplu bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Venit\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; exemplu radar cu mai multe serii: {\"indicators\":[{\"name\":\"Viteză\",\"max\":100},{\"name\":\"Putere\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; condiție radar: numărul de indicators trebuie să fie egal cu lungimea fiecărui series[i].data, iar data trebuie să conțină doar numere"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Returnează detaliile utilizatorului autentificat: nume de utilizator, nume afișat, e-mail, mobil, cod, roluri, departament, sex, vârstă, data nașterii și note, plus adresa IP, orașul și locația geografică detaliată a vizitatorului"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Caută schemele tabelelor bazei de date după cuvânt-cheie. Rezultatul are două părți: (1) harta tabel-conexiune (tabel Markdown care arată cărei conexiuni aparține fiecare tabel; tabelele cu același nume în conexiuni diferite sunt listate separat); (2) schema XML a tabelelor pentru fiecare conexiune. Apelurile ulterioare run_sql trebuie să folosească numele conexiunii din tabelul hartă"
"Search keywords, separated by commas or spaces": "Cuvinte-cheie de căutare separate prin virgule sau spații"
"Restrict to a connection name; empty searches all connections": "Restrânge la numele conexiunii; gol înseamnă căutare în toate conexiunile"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Execută o instrucțiune SQL pe conexiunea de bază de date specificată. Interogările SELECT/WITH returnează rânduri; instrucțiunile non-interogare precum INSERT/UPDATE/DELETE returnează numărul de rânduri afectate. connName trebuie să corespundă coloanei de conexiune returnate de search_table"
"Database connection name (from the connection column of search_table)": "Numele conexiunii la baza de date (din coloana de conexiune a search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Instrucțiunea SQL. SELECT/WITH returnează un set de rezultate; instrucțiunile non-interogare returnează numărul de rânduri afectate"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Interoghează data în calendarul lunar, termenul solar și starea zilei de lucru (zi lucrătoare/zi liberă/zi de recuperare) pentru o dată anume"
"Date to query in yyyy-MM-dd format. Defaults to today": "Data căutată în format yyyy-MM-dd. Implicit astăzi"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Afișează sarcinile ca un panou Kanban cu mai multe coloane (de exemplu De făcut -> În lucru -> Finalizat). Potrivit pentru împărțirea proiectului în etape, planificarea sprinturilor, afișarea fluxului de lucru și clasificarea stării sarcinilor. Fiecare coloană poate avea etichetă de culoare și limită WIP; fiecare card poate avea titlu, descriere, prioritate, etichete, termen, responsabil, listă de subsarcini, progres și link. Două aspecte: board (panou implicit cu mai multe coloane) și swimlane (coloane grupate pe echipă sau unitate)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Titlul panoului (maximum 30 de caractere), de exemplu Panoul Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Matricea JSON cu definițiile coloanelor. Exemplu: [{\"id\":\"todo\",\"title\":\"De făcut\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Analiza cerințelor\",\"description\":\"Colectarea cerințelor utilizatorilor\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interviu cu utilizatorii\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Toate câmpurile în afară de id și title sunt opționale"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Modul de aspect: board (panou implicit cu mai multe coloane) sau swimlane (coloane grupate pe echipă sau unitate; parametrul swimlanes este obligatoriu)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Matricea JSON cu definițiile benzilor (folosită când layout=swimlane). Exemplu: [{\"id\":\"sl1\",\"title\":\"Echipa frontend\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Echipa backend\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Marchează puncte de coordonate (orașe sau POI) sau evidențiază provincii pe harta Chinei, creează o hartă SVG adnotată și o afișează în balonul conversației. Acceptă: (1) colorarea provinciilor cu culori personalizate; (2) markere WGS84 cu latitudine, longitudine și text de etichetă; (3) legendă automată în colțul din dreapta jos. Utilizări tipice: distribuția datelor pe provincii, poziția orașelor, hărți termice ale vânzărilor regionale."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Titlul hărții (maximum 30 de caractere), de exemplu PIB pe provincii 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Matricea JSON a markerelor (poate fi o matrice goală []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376 miliarde\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng în grade zecimale WGS84; color/size opționale"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Matricea JSON a evidențierilor de provincii (poate fi o matrice goală []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"PIB pe primul loc\"}]. name acceptă numele provinciei în chineză (complet sau abreviat); label opțional"
"Legend title (optional), e.g. GDP scale": "Titlul legendei (opțional), de exemplu Scala PIB"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Schema de culori (opțional): blue/orange/green/purple/red; implicit blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Forma markerului (opțional): circle/pin/square; implicit circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Afișează ierarhii de cunoștințe sau relații între concepte ca o hartă mentală interactivă pliabilă. Intrare este o schiță Markdown (# / ## / ###) pe care interfața o transformă într-un arbore vizual. Potrivit pentru organizarea cunoștințelor, descompunerea conceptelor, compararea tehnologiilor, evaluarea opțiunilor și rezumarea conținutului. Stil vizual: alegeți branchColors (3-8 culori armonioase), maxDepth (complexitate) și collapsed (pliere inițială pentru focalizare) în funcție de subiect. Folosiți culori reci (albastru/violet/cyan) pentru tehnologie și date, culori calde (portocaliu/auriu/roșu) pentru afaceri și marketing, verde pentru natură și sănătate. Pentru noduri dense setați maxDepth=2 pentru a păstra lizibilitatea. 6 aspecte: tree (implicit, arbore dințat, general) / radial (radial stânga-dreapta, cel mai bun pentru hărți de cunoștințe) / lr (din centru spre dreapta, diagrame de flux/arbori de decizie) / rl (din centru spre stânga, urmărire inversă) / tb (din centru în jos, organigrame) / bt (din centru în sus, ierarhie de jos în sus)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Titlul hărții mentale (maximum 30 de caractere), de exemplu Stackul tehnologic AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Schiță Markdown cu # / ## / ### pentru nivelurile 1-3. Exemplu:\n# Inteligență artificială\n## Învățare automată\n### Învățare supervizată\n### Învățare nesupervizată\n## Învățare profundă\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Modul de aspect: tree (implicit, arbore dințat, general) / radial (radial stânga-dreapta, cel mai bun pentru hărți de cunoștințe) / lr (din centru spre dreapta, diagrame de flux/arbori de decizie) / rl (din centru spre stânga, urmărire inversă) / tb (din centru în jos, organigrame) / bt (din centru în sus, ierarhie de jos în sus)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Matricea JSON a culorilor ramurilor, de exemplu [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Atribuie în ordine 3-8 culori hexazecimale ramurilor de nivel unu. Dacă este omisă, se folosește paleta implicită albastru/violet, verde, galben, roșu, cyan, verde închis, portocaliu și violet"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Matricea JSON a identificatorilor nodurilor pliate inițial, de exemplu [\"n2\",\"n5\"]. Goală extinde totul. Folosită pentru a concentra atenția pe ramurile importante"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Adâncimea maximă afișată: 1 = doar ramurile de nivel unu, 2 = două niveluri, implicit fără limită. Pentru noduri dense setați 2 pentru a păstra lizibilitatea"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Afișează datele de tip serie temporală ca fișe elegante de cronologie. Este suficient JSON (aproximativ 100 de tokenuri) și interfața le afișează imediat. Potrivit pentru repere de proiect, evenimente istorice, planuri de lansare și istoric de dezvoltare. Fiecare eveniment poate avea dată, titlu, descriere, culoare și categorie. Stil vizual: setați o paletă generală prin parametrul palette (de exemplu gradient albastru-violet, bronz cald, culorile mărcii) pentru ca cronologia să aibă un caracter unitar; item.color înlocuiește elemente individuale. Folosiți density=relaxed pentru cinci evenimente selectate sau mai puține și density=compact pentru zece sau mai multe. 8 aspecte: vertical (5-20 elemente) / alternating-top (alternant sus, ordine inversă) / alternating-bottom (alternant jos, ordine cronologică) / horizontal-left (orizontal spre stânga, invers) / horizontal-right (orizontal spre dreapta, cronologic) / s-curve (curbă S, 8 elemente sau mai puține) / fishbone-left (os de pește spre stânga, invers) / fishbone-right (os de pește spre dreapta, cronologic)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Titlul cronologiei (maximum 30 de caractere), de exemplu Repere ale produsului"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Matricea JSON a evenimentelor cronologiei. Exemplu: [{\"date\":\"2024-01\",\"title\":\"Lansare v1.0\",\"description\":\"Introducerea funcțiilor de bază\",\"color\":\"#5470c6\",\"category\":\"reper\"}]. description/color/category sunt opționale"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Modul de aspect: vertical / alternating-top (alternant sus, invers) / alternating-bottom (alternant jos, cronologic) / horizontal-left (orizontal, invers) / horizontal-right (orizontal, cronologic) / s-curve / fishbone-left (os de pește, invers) / fishbone-right (os de pește, cronologic)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Matricea JSON a paletei generale, de exemplu [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Înlocuiește rotația implicită de opt culori. item.color are prioritate"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Spațierea elementelor: compact (12px) / normal (20px, implicit) / relaxed (32px). relaxed se potrivește pentru cinci evenimente selectate sau mai puține; compact pentru zece sau mai multe"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Afișează un fragment SVG sau HTML în balonul conversației. Folosiți-l pentru cronologii și diagrame de relații (SVG), previzualizări de formulare și carduri de date (HTML), grafice statistice (SVG). Nu îl folosiți pentru diagrame Mermaid; furnizați Mermaid ca bloc de cod ```mermaid în răspuns. Limite: maximum 200 KB; <script src=...> doar din CDN de încredere. Stil vizual: alegeți arhitectura informației (Bento/flux de carduri/Grid), ierarhia tipografică și sistemul de culori în funcție de subiect. Tonuri reci fără colțuri pentru discuții tehnice, culori neutre cu cifre proeminente pentru rapoarte de afaceri, gradiente/efect de sticlă/animatii subtile pentru lucrări creative. Specificați întotdeauna explicit font-family și color; nu vă bazați pe stilurile implicite ale browserului."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Titlul widgetului (maximum 30 de caractere), de exemplu Fluxul stării comenzii"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG trebuie să înceapă cu <svg; fragmentele HTML trebuie să înceapă cu elementul rădăcină și nu trebuie să conțină <html><body>. Maximum 200 KB; <script src=...> doar din CDN de încredere. Nu transmiteți sintaxă Mermaid (flowchart/graph/sequenceDiagram etc.); furnizați Mermaid ca bloc de cod ```mermaid în răspuns"
"Placeholder text shown while loading (optional)": "Textul substituent afișat în timpul încărcării (opțional)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Indiciu de temă: light / dark / auto (după sistem). HTML-ul generat trebuie să aleagă culorile de fundal și de text în consecință; nu este transmis vizualizatorului de interfață"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Înălțimea inițială a widgetului în pixeli (80-1200). Implicit 480. Folosiți 300-400 pentru carduri compacte și 600-800 pentru grafice mari"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Modul de fundal: solid (implicit) / transparent (pentru lipirea capturilor de ecran pe un șablon PPT)"
