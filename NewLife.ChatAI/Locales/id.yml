"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Membuat dokumen Word (.docx) dan mengembalikan tautan unduhan. Mendukung judul, paragraf, daftar, tabel, gambar, pemisah halaman, garis pemisah, kotak sorotan, kartu KPI, kutipan, dan blok kode. Larik JSON sections mendeskripsikan setiap bagian dengan heading, content, dan elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Judul dokumen (maksimal 30 karakter), misalnya Laporan Kuartal 2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Larik bagian (JSON). Kolom setiap bagian: heading (judul bagian), headingLevel (1-3, bawaan 1), content (paragraf teks, opsional), elements (larik elemen, opsional). Jenis elemen: paragraph ({type,text,opsional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,opsional tableStyle}; rows adalah larik dua dimensi, tiap baris berupa larik nilai sel, misalnya [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (opsional): kunci gaya kartu (misalnya enterprise-blue) atau nama bawaan (blue/dark/corporate/warm/green/minimal); jika dihilangkan, digunakan gaya percakapan atau bawaan merek"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Membuat buku kerja Excel (.xlsx) dan mengembalikan tautan unduhan. Mendukung beberapa lembar, gaya tajuk, lebar kolom, format angka, pemformatan bersyarat, pembekuan panel, filter otomatis, dan validasi daftar tarik-turun. Parameter theme menerima kunci gaya kartu atau nama bawaan (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Judul buku kerja (maksimal 30 karakter), misalnya Laporan Pendapatan Kuartal 2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Larik lembar (JSON). Kolom setiap lembar: name, headers (larik tajuk), rows (larik dua dimensi; tiap baris berupa larik nilai sel, misalnya [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (misalnya [12,20,15]), numberFormat (misalnya \"#,##0.00\" atau \"yyyy-MM-dd\"), conditionalFormats (larik {range,type,color,value?}; type mendukung dataBar/colorScale/greaterThan dan lainnya), charts (larik bagan), freezeRows (jumlah baris yang dibekukan), autoFilter (rentang filter), dan dropdowns (validasi daftar tarik-turun)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (opsional): kunci gaya kartu (misalnya enterprise-blue) atau nama bawaan (blue/dark/corporate/warm/green/minimal) yang mengatur tajuk dan warna keseluruhan; jika dihilangkan, digunakan gaya percakapan atau bawaan merek"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Membuat presentasi PowerPoint (.pptx) dan mengembalikan tautan unduhan. Dua mode masukan yang saling eksklusif: (1) mode slides, AI mendeskripsikan konten terstruktur dan tata letak dibuat otomatis; (2) mode widgetSrc yang menyematkan kartu show_widget yang sudah dibuat sebagai gambar slide. Parameter theme menerima kunci gaya kartu (misalnya enterprise-blue/raycast-dark/ppt-executive) atau nama bawaan (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Judul presentasi (maksimal 30 karakter), misalnya Tinjauan Kuartal 2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Larik slide (JSON). Satu elemen = satu slide, beberapa elemen = presentasi penuh. Saling eksklusif dengan widgetSrc. Kolom setiap slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (warna heksadesimal), footer, showPageNumber (true/false), elements (daftar elemen), notes, dan transition. elements mendukung: text (role=title/subtitle/body/kpi/caption; opsional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows larik dua dimensi, tiap baris larik nilai sel, misalnya [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; opsional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Contoh: [{\"title\":\"Sampul\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Tinjauan Kuartal 2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Tim NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Daftar ID kartu show_widget yang dipisahkan koma, misalnya 'call_abc123,call_def456'. Saling eksklusif dengan slides. Mengubah kartu yang sudah dibuat menjadi gambar slide"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (opsional): kunci gaya kartu (misalnya enterprise-blue/ppt-executive) atau nama bawaan (blue/dark/corporate/warm/green/minimal dan lainnya); jika dihilangkan, digunakan gaya percakapan atau bawaan merek"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Menampilkan data sebagai bagan interaktif (perbesar, arahkan kursor, ekspor gambar). Sekitar 20 kali lebih cepat daripada show_widget: cukup spesifikasi JSON (sekitar 200 token) dan antarmuka langsung menggambarnya dengan ECharts. Mendukung: bar, line (garis/area), pie (pai/cincin), scatter, radar, map_china (peta panas per provinsi Tiongkok), heatmap (peta panas matriks), gauge, funnel, treemap. Cocok untuk perbandingan angka, deret waktu (garis), analisis proporsi, dan distribusi geografis. Catatan: untuk rute, peristiwa sejarah, tonggak, dan garis waktu gunakan show_timeline; alat ini tidak mendukung tipe timeline. Gaya visual: berikan palet warna melalui data.colors alih-alih mengandalkan bawaan ECharts. Saran: warna merek untuk satu seri, nuansa berjarak merata (10-12 warna) untuk banyak seri, warna saling melengkapi untuk perbandingan, gradien satu warna untuk tren. Biru dan emas untuk keuangan, biru/hijau/putih untuk kesehatan, ungu/biru/cyan untuk teknologi dan AI. Untuk kumpulan data besar, atur data.animation=false untuk mengurangi biaya render."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Jenis bagan: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Judul bagan (maksimal 30 karakter), misalnya PDB per Provinsi 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Objek JSON; strukturnya dijelaskan pada deskripsi alat. Contoh bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Pendapatan\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; contoh radar banyak seri: {\"indicators\":[{\"name\":\"Kecepatan\",\"max\":100},{\"name\":\"Kekuatan\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; syarat radar: jumlah indicators harus sama dengan panjang setiap series[i].data, dan data hanya boleh berisi angka"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Mengembalikan detail pengguna yang sudah masuk, termasuk nama pengguna, nama tampilan, email, ponsel, kode, peran, departemen, jenis kelamin, usia, tanggal lahir, dan catatan, serta alamat IP, kota, dan lokasi geografis terperinci pengunjung"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Mencari skema tabel basis data dengan kata kunci. Hasil terdiri dari dua bagian: (1) peta tabel- koneksi (tabel Markdown yang menunjukkan koneksi setiap tabel; tabel dengan nama sama di koneksi berbeda dicantumkan terpisah); (2) skema XML tabel untuk setiap koneksi. Panggilan run_sql berikutnya harus menggunakan nama koneksi pada tabel peta"
"Search keywords, separated by commas or spaces": "Kata kunci pencarian yang dipisahkan koma atau spasi"
"Restrict to a connection name; empty searches all connections": "Batasi ke nama koneksi; kosong berarti mencari di semua koneksi"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Menjalankan pernyataan SQL pada koneksi basis data yang ditentukan. Kueri SELECT/WITH mengembalikan baris; pernyataan non-kueri seperti INSERT/UPDATE/DELETE mengembalikan jumlah baris terpengaruh. connName harus cocok dengan kolom koneksi yang dikembalikan search_table"
"Database connection name (from the connection column of search_table)": "Nama koneksi basis data (dari kolom koneksi search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Pernyataan SQL. SELECT/WITH mengembalikan himpunan hasil; pernyataan non-kueri mengembalikan jumlah baris terpengaruh"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Mencari tanggal kalender lunar, istilah matahari, dan status hari kerja (hari kerja/libur/hari pengganti) untuk tanggal tertentu"
"Date to query in yyyy-MM-dd format. Defaults to today": "Tanggal yang dicari dalam format yyyy-MM-dd. Bawaan hari ini"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Menampilkan tugas sebagai papan Kanban multikolom (misalnya Akan Dikerjakan -> Sedang Dikerjakan -> Selesai). Cocok untuk pembagian fase proyek, perencanaan Sprint, menampilkan alur kerja, dan mengklasifikasikan status tugas. Setiap kolom dapat memiliki label warna dan batas WIP; setiap kartu dapat memiliki judul, deskripsi, prioritas, tag, tenggat, penanggung jawab, daftar subtugas, kemajuan, dan tautan. Dua tata letak: board (bawaan, papan multikolom) dan swimlane (kolom dikelompokkan per tim atau unit)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Judul papan (maksimal 30 karakter), misalnya Papan Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Larik JSON definisi kolom. Contoh: [{\"id\":\"todo\",\"title\":\"Akan Dikerjakan\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Analisis kebutuhan\",\"description\":\"Kumpulkan kebutuhan pengguna\",\"priority\":\"high\",\"tags\":[\"desain\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Wawancara pengguna\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Semua kolom selain id dan title bersifat opsional"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Mode tata letak: board (bawaan, papan multikolom) atau swimlane (kolom dikelompokkan per tim atau unit; parameter swimlanes wajib)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Larik JSON definisi lajur (dipakai saat layout=swimlane). Contoh: [{\"id\":\"sl1\",\"title\":\"Tim antarmuka\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Tim backend\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Menandai titik koordinat (kota atau POI) atau menyorot provinsi pada peta Tiongkok, membuat peta SVG beranotasi dan menampilkannya di balon percakapan. Mendukung: (1) pengisian warna provinsi khusus; (2) penanda WGS84 dengan lintang, bujur, dan teks label; (3) legenda otomatis di sudut kanan bawah. Penggunaan umum: distribusi data per provinsi, lokasi kota, peta panas penjualan regional."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Judul peta (maksimal 30 karakter), misalnya PDB per Provinsi 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Larik JSON penanda (boleh larik kosong []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376 miliar\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng dalam derajat desimal WGS84; color/size opsional"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Larik JSON sorotan provinsi (boleh larik kosong []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"PDB peringkat 1\"}]. name menerima nama provinsi dalam bahasa Mandarin (lengkap atau singkat); label opsional"
"Legend title (optional), e.g. GDP scale": "Judul legenda (opsional), misalnya Skala PDB"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Skema warna (opsional): blue/orange/green/purple/red; bawaan blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Bentuk penanda (opsional): circle/pin/square; bawaan circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Menampilkan hierarki pengetahuan atau hubungan antar konsep sebagai peta pikiran interaktif yang dapat dilipat. Masukannya kerangka Markdown (# / ## / ###) yang diubah antarmuka menjadi pohon visual. Cocok untuk menata pengetahuan, menguraikan konsep, membandingkan teknologi, mengevaluasi opsi, dan meringkas konten. Gaya visual: pilih branchColors (3-8 warna serasi), maxDepth (kompleksitas), dan collapsed (lipat awal untuk fokus) sesuai topik. Gunakan warna dingin (biru/ungu/cyan) untuk teknologi dan data, warna hangat (oranye/emas/merah) untuk bisnis dan pemasaran, hijau untuk alam dan kesehatan. Untuk simpul padat, atur maxDepth=2 agar tetap terbaca. 6 tata letak: tree (bawaan, pohon bergerigi, umum) / radial (memancar kiri-kanan, terbaik untuk peta pengetahuan) / lr (dari pusat ke kanan, diagram alur/pohon keputusan) / rl (dari pusat ke kiri, penelusuran balik) / tb (dari pusat ke bawah, bagan organisasi) / bt (dari pusat ke atas, hierarki dari bawah)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Judul peta pikiran (maksimal 30 karakter), misalnya Tumpukan Teknologi AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Kerangka Markdown dengan # / ## / ### untuk tingkat 1-3. Contoh:\n# Kecerdasan Buatan\n## Pembelajaran Mesin\n### Pembelajaran Terbimbing\n### Pembelajaran Tak Terbimbing\n## Pembelajaran Mendalam\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Mode tata letak: tree (bawaan, pohon bergerigi, umum) / radial (memancar kiri-kanan, terbaik untuk peta pengetahuan) / lr (dari pusat ke kanan, diagram alur/pohon keputusan) / rl (dari pusat ke kiri, penelusuran balik) / tb (dari pusat ke bawah, bagan organisasi) / bt (dari pusat ke atas, hierarki dari bawah)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Larik JSON warna cabang, misalnya [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Memberikan 3-8 warna heksadesimal berurutan pada cabang tingkat satu. Jika dihilangkan, dipakai palet bawaan biru/ungu, hijau, kuning, merah, cyan, hijau tua, oranye, dan ungu"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Larik JSON ID simpul yang dilipat awal, misalnya [\"n2\",\"n5\"]. Kosong berarti semua dibentangkan. Dipakai untuk memusatkan perhatian pada cabang penting"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Kedalaman tampil maksimum: 1 = hanya cabang tingkat satu, 2 = dua tingkat, bawaan tanpa batas. Untuk simpul padat, atur 2 agar tetap terbaca"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Menampilkan data deret waktu sebagai kartu garis waktu yang elegan. Cukup JSON (sekitar 100 token) dan antarmuka langsung menampilkannya. Cocok untuk tonggak proyek, peristiwa sejarah, rencana rilis, dan riwayat pengembangan. Setiap peristiwa dapat memiliki tanggal, judul, deskripsi, warna, dan kategori. Gaya visual: atur palet keseluruhan melalui parameter palette (misalnya gradien biru-ungu, perunggu hangat, warna merek) agar garis waktu terasa selaras; item.color menggantikan per item. Gunakan density=relaxed untuk lima peristiwa terpilih atau kurang dan density=compact untuk sepuluh atau lebih. 8 tata letak: vertical (5-20 item) / alternating-top (selang-seling atas, kronologi terbalik) / alternating-bottom (selang-seling bawah, kronologi) / horizontal-left (horizontal ke kiri, terbalik) / horizontal-right (horizontal ke kanan, kronologi) / s-curve (kurva S, 8 item atau kurang) / fishbone-left (tulang ikan ke kiri, terbalik) / fishbone-right (tulang ikan ke kanan, kronologi)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Judul garis waktu (maksimal 30 karakter), misalnya Tonggak Produk"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Larik JSON peristiwa garis waktu. Contoh: [{\"date\":\"2024-01\",\"title\":\"Rilis v1.0\",\"description\":\"Peluncuran fitur inti\",\"color\":\"#5470c6\",\"category\":\"tonggak\"}]. description/color/category opsional"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Mode tata letak: vertical / alternating-top (selang-seling atas, terbalik) / alternating-bottom (selang-seling bawah, kronologi) / horizontal-left (horizontal, terbalik) / horizontal-right (horizontal, kronologi) / s-curve / fishbone-left (tulang ikan, terbalik) / fishbone-right (tulang ikan, kronologi)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Larik JSON palet warna keseluruhan, misalnya [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Menggantikan rotasi delapan warna bawaan. item.color lebih diutamakan"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Jarak item: compact (12px) / normal (20px, bawaan) / relaxed (32px). relaxed cocok untuk lima peristiwa terpilih atau kurang; compact untuk sepuluh atau lebih"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Menampilkan fragmen SVG atau HTML di dalam balon percakapan. Gunakan untuk garis waktu dan diagram hubungan (SVG), pratinjau formulir dan kartu data (HTML), grafik statistik (SVG). Jangan gunakan untuk bagan Mermaid; keluarkan Mermaid sebagai blok kode ```mermaid dalam balasan. Batasan: maksimal 200 KB; <script src=...> hanya dari CDN tepercaya. Gaya visual: pilih arsitektur informasi (Bento/aliran kartu/Grid), hierarki tipografi, dan sistem warna sesuai topik. Nuansa dingin tanpa sudut untuk diskusi teknis, warna netral dengan angka menonjol untuk laporan bisnis, gradien/efek kaca/animasi halus untuk karya kreatif. Selalu tentukan font-family dan color secara eksplisit; jangan mengandalkan gaya bawaan peramban."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Judul widget (maksimal 30 karakter), misalnya Alur Status Pesanan"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG harus dimulai dengan <svg; fragmen HTML harus dimulai dengan elemen akar dan tidak boleh memuat <html><body>. Maksimal 200 KB; <script src=...> hanya dari CDN tepercaya. Jangan meneruskan sintaks Mermaid (flowchart/graph/sequenceDiagram dan sejenisnya); keluarkan Mermaid sebagai blok kode ```mermaid dalam balasan"
"Placeholder text shown while loading (optional)": "Teks pengganti yang ditampilkan saat memuat (opsional)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Petunjuk tema: light / dark / auto (mengikuti sistem). HTML yang dihasilkan harus memilih warna latar dan teks yang sesuai; tidak diteruskan ke penampil antarmuka"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Tinggi awal widget dalam piksel (80-1200). Bawaan 480. Gunakan 300-400 untuk kartu ringkas dan 600-800 untuk grafik besar"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Mode latar: solid (bawaan) / transparent (untuk menempelkan tangkapan layar ke templat PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Mode slide PPT. Jika true, kartu ditampilkan dalam rasio 16:9 siap ditempel ke presentasi. Bawaan false yang menampilkan sesuai konten"
