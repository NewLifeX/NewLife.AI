"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Mencipta dokumen Word (.docx) dan mengembalikan pautan muat turun. Menyokong tajuk, perenggan, senarai, jadual, imej, pemisah halaman, garis pemisah, kotak sorotan, kad KPI, petikan dan blok kod. Tatasusunan JSON sections menerangkan setiap bahagian dengan heading, content dan elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Tajuk dokumen (maksimum 30 aksara), contohnya Laporan Suku Tahun 2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Tatasusunan bahagian (JSON). Medan setiap bahagian: heading (tajuk bahagian), headingLevel (1-3, lalai 1), content (perenggan teks, pilihan), elements (tatasusunan elemen, pilihan). Jenis elemen: paragraph ({type,text,pilihan bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,pilihan tableStyle}; rows ialah tatasusunan dua dimensi, setiap baris tatasusunan nilai sel, contohnya [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (pilihan): kunci gaya kad (contohnya enterprise-blue) atau nama terbina dalam (blue/dark/corporate/warm/green/minimal); jika ditinggalkan, gaya perbualan atau lalai jenama digunakan"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Mencipta buku kerja Excel (.xlsx) dan mengembalikan pautan muat turun. Menyokong berbilang helaian, gaya tajuk, lebar lajur, format nombor, pemformatan bersyarat, pembekuan anak tetingkap, penapis automatik dan pengesahan senarai juntai bawah. Parameter theme menerima kunci gaya kad atau nama terbina dalam (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Tajuk buku kerja (maksimum 30 aksara), contohnya Laporan Hasil Suku Tahun 2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Tatasusunan helaian (JSON). Medan setiap helaian: name, headers (tatasusunan tajuk), rows (tatasusunan dua dimensi; setiap baris tatasusunan nilai sel, contohnya [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (contohnya [12,20,15]), numberFormat (contohnya \"#,##0.00\" atau \"yyyy-MM-dd\"), conditionalFormats (tatasusunan {range,type,color,value?}; type menyokong dataBar/colorScale/greaterThan dan lain-lain), charts (tatasusunan carta), freezeRows (bilangan baris dibekukan), autoFilter (julat penapis) dan dropdowns (pengesahan senarai juntai bawah)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (pilihan): kunci gaya kad (contohnya enterprise-blue) atau nama terbina dalam (blue/dark/corporate/warm/green/minimal) yang mengawal tajuk dan warna keseluruhan; jika ditinggalkan, gaya perbualan atau lalai jenama digunakan"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Mencipta persembahan PowerPoint (.pptx) dan mengembalikan pautan muat turun. Dua mod input yang saling eksklusif: (1) mod slides, AI menerangkan kandungan berstruktur dan susun atur dijana secara automatik; (2) mod widgetSrc yang membenamkan kad show_widget yang telah dijana sebagai imej slaid. Parameter theme menerima kunci gaya kad (contohnya enterprise-blue/raycast-dark/ppt-executive) atau nama terbina dalam (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Tajuk persembahan (maksimum 30 aksara), contohnya Semakan Suku Tahun 2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Tatasusunan slaid (JSON). Satu elemen = satu slaid, beberapa elemen = persembahan penuh. Saling eksklusif dengan widgetSrc. Medan setiap slaid: title, layout (title_only/title_content/two_column/chart_only/blank), background (warna heksadesimal), footer, showPageNumber (true/false), elements (senarai elemen), notes dan transition. elements menyokong: text (role=title/subtitle/body/kpi/caption; pilihan bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows tatasusunan dua dimensi, setiap baris tatasusunan nilai sel, contohnya [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; pilihan tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Contoh: [{\"title\":\"Muka Depan\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Semakan Suku Tahun 2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Pasukan NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Senarai ID kad show_widget yang dipisahkan koma, contohnya 'call_abc123,call_def456'. Saling eksklusif dengan slides. Menukar kad yang telah dijana menjadi imej slaid"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (pilihan): kunci gaya kad (contohnya enterprise-blue/ppt-executive) atau nama terbina dalam (blue/dark/corporate/warm/green/minimal dan lain-lain); jika ditinggalkan, gaya perbualan atau lalai jenama digunakan"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Memaparkan data sebagai carta interaktif (zum, tuding, eksport imej). Kira-kira 20 kali lebih pantas daripada show_widget: spesifikasi JSON (kira-kira 200 token) sudah cukup dan antara muka melukisnya serta-merta dengan ECharts. Menyokong: bar, line (garis/kawasan), pie (pai/donat), scatter, radar, map_china (peta haba wilayah China), heatmap (peta haba matriks), gauge, funnel, treemap. Sesuai untuk perbandingan nombor, siri masa (garis), analisis perkadaran dan taburan geografi. Nota: untuk laluan, peristiwa sejarah, pencapaian dan garis masa gunakan show_timeline; alat ini tidak menyokong jenis timeline. Gaya visual: berikan palet warna melalui data.colors dan bukannya bergantung pada lalai ECharts. Cadangan: warna jenama untuk satu siri, nuansa berjarak sama (10-12 warna) untuk banyak siri, warna pelengkap untuk perbandingan, kecerunan satu warna untuk trend. Biru dan emas untuk kewangan, biru/hijau/putih untuk kesihatan, ungu/biru/sian untuk teknologi dan AI. Untuk set data besar, tetapkan data.animation=false untuk mengurangkan kos paparan."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Jenis carta: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Tajuk carta (maksimum 30 aksara), contohnya KDNK mengikut Wilayah 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Objek JSON; strukturnya diterangkan dalam huraian alat. Contoh bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Hasil\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; contoh radar berbilang siri: {\"indicators\":[{\"name\":\"Kelajuan\",\"max\":100},{\"name\":\"Kekuatan\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; syarat radar: bilangan indicators mesti sama dengan panjang setiap series[i].data, dan data hanya boleh mengandungi nombor"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Mengembalikan butiran pengguna yang sedang log masuk, termasuk nama pengguna, nama paparan, e-mel, telefon bimbit, kod, peranan, jabatan, jantina, umur, tarikh lahir dan catatan, serta alamat IP, bandar dan lokasi geografi terperinci pelawat"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Mencari skema jadual pangkalan data dengan kata kunci. Hasil terdiri daripada dua bahagian: (1) peta jadual- sambungan (jadual Markdown yang menunjukkan sambungan setiap jadual; jadual dengan nama sama dalam sambungan berbeza disenaraikan berasingan); (2) skema XML jadual bagi setiap sambungan. Panggilan run_sql seterusnya mesti menggunakan nama sambungan daripada jadual peta"
"Search keywords, separated by commas or spaces": "Kata kunci carian dipisahkan koma atau ruang"
"Restrict to a connection name; empty searches all connections": "Hadkan kepada nama sambungan; kosong bermaksud mencari dalam semua sambungan"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Menjalankan pernyataan SQL pada sambungan pangkalan data yang ditentukan. Pertanyaan SELECT/WITH mengembalikan baris; pernyataan bukan pertanyaan seperti INSERT/UPDATE/DELETE mengembalikan bilangan baris terjejas. connName mesti sepadan dengan lajur sambungan yang dikembalikan search_table"
"Database connection name (from the connection column of search_table)": "Nama sambungan pangkalan data (daripada lajur sambungan search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Pernyataan SQL. SELECT/WITH mengembalikan set hasil; pernyataan bukan pertanyaan mengembalikan bilangan baris terjejas"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Mencari tarikh kalendar qamari, istilah suria dan status hari bekerja (hari bekerja/cuti/hari ganti) bagi tarikh tertentu"
"Date to query in yyyy-MM-dd format. Defaults to today": "Tarikh yang dicari dalam format yyyy-MM-dd. Lalai hari ini"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Memaparkan tugasan sebagai papan Kanban berbilang lajur (contohnya Akan Dilakukan -> Sedang Dilakukan -> Selesai). Sesuai untuk pembahagian fasa projek, perancangan Sprint, paparan aliran kerja dan pengelasan status tugasan. Setiap lajur boleh mempunyai label warna dan had WIP; setiap kad boleh mempunyai tajuk, huraian, keutamaan, teg, tarikh akhir, orang bertanggungjawab, senarai subtugas, kemajuan dan pautan. Dua susun atur: board (papan berbilang lajur lalai) dan swimlane (lajur dikumpulkan mengikut pasukan atau unit)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Tajuk papan (maksimum 30 aksara), contohnya Papan Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Tatasusunan JSON definisi lajur. Contoh: [{\"id\":\"todo\",\"title\":\"Akan Dilakukan\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Analisis keperluan\",\"description\":\"Kumpulkan keperluan pengguna\",\"priority\":\"high\",\"tags\":[\"reka bentuk\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Temu bual pengguna\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Semua medan selain id dan title adalah pilihan"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Mod susun atur: board (papan berbilang lajur lalai) atau swimlane (lajur dikumpulkan mengikut pasukan atau unit; parameter swimlanes diperlukan)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Tatasusunan JSON definisi lorong (digunakan apabila layout=swimlane). Contoh: [{\"id\":\"sl1\",\"title\":\"Pasukan antara muka\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Pasukan pelayan belakang\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Menanda titik koordinat (bandar atau POI) atau menyerlahkan wilayah pada peta China, mencipta peta SVG beranotasi dan memaparkannya dalam gelembung perbualan. Menyokong: (1) pengisian warna wilayah tersuai; (2) penanda WGS84 dengan latitud, longitud dan teks label; (3) legenda automatik di sudut kanan bawah. Kegunaan biasa: taburan data mengikut wilayah, lokasi bandar, peta haba jualan serantau."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Tajuk peta (maksimum 30 aksara), contohnya KDNK mengikut Wilayah 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Tatasusunan JSON penanda (boleh tatasusunan kosong []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376 bilion\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng dalam darjah perpuluhan WGS84; color/size pilihan"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Tatasusunan JSON penyerlahan wilayah (boleh tatasusunan kosong []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"KDNK tempat pertama\"}]. name menerima nama wilayah dalam bahasa Cina (penuh atau singkat); label pilihan"
"Legend title (optional), e.g. GDP scale": "Tajuk legenda (pilihan), contohnya Skala KDNK"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Skema warna (pilihan): blue/orange/green/purple/red; lalai blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Bentuk penanda (pilihan): circle/pin/square; lalai circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Memaparkan hierarki pengetahuan atau hubungan antara konsep sebagai peta minda interaktif yang boleh dilipat. Input ialah rangka Markdown (# / ## / ###) yang ditukar oleh antara muka menjadi pokok visual. Sesuai untuk menyusun pengetahuan, menguraikan konsep, membandingkan teknologi, menilai pilihan dan meringkaskan kandungan. Gaya visual: pilih branchColors (3-8 warna harmoni), maxDepth (kerumitan) dan collapsed (lipat awal untuk fokus) mengikut topik. Gunakan warna sejuk (biru/ungu/sian) untuk teknologi dan data, warna hangat (jingga/emas/merah) untuk perniagaan dan pemasaran, hijau untuk alam semula jadi dan kesihatan. Untuk nod padat, tetapkan maxDepth=2 agar kekal mudah dibaca. 6 susun atur: tree (lalai, pokok bergerigi, umum) / radial (memancar kiri-kanan, terbaik untuk peta pengetahuan) / lr (dari pusat ke kanan, carta alir/pokok keputusan) / rl (dari pusat ke kiri, surih balik) / tb (dari pusat ke bawah, carta organisasi) / bt (dari pusat ke atas, hierarki dari bawah)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Tajuk peta minda (maksimum 30 aksara), contohnya Timbunan Teknologi AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Rangka Markdown dengan # / ## / ### untuk aras 1-3. Contoh:\n# Kecerdasan Buatan\n## Pembelajaran Mesin\n### Pembelajaran Terselia\n### Pembelajaran Tidak Terselia\n## Pembelajaran Mendalam\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Mod susun atur: tree (lalai, pokok bergerigi, umum) / radial (memancar kiri-kanan, terbaik untuk peta pengetahuan) / lr (dari pusat ke kanan, carta alir/pokok keputusan) / rl (dari pusat ke kiri, surih balik) / tb (dari pusat ke bawah, carta organisasi) / bt (dari pusat ke atas, hierarki dari bawah)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Tatasusunan JSON warna cabang, contohnya [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Memberikan 3-8 warna heksadesimal berturutan kepada cabang aras pertama. Jika ditinggalkan, palet lalai biru/ungu, hijau, kuning, merah, sian, hijau gelap, jingga dan ungu digunakan"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Tatasusunan JSON ID nod yang dilipat awal, contohnya [\"n2\",\"n5\"]. Kosong bermaksud semua dibentangkan. Digunakan untuk memberi tumpuan kepada cabang penting"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Kedalaman paparan maksimum: 1 = cabang aras pertama sahaja, 2 = dua aras, lalai tanpa had. Untuk nod padat, tetapkan 2 agar kekal mudah dibaca"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Memaparkan data siri masa sebagai kad garis masa yang elegan. JSON (kira-kira 100 token) sudah cukup dan antara muka memaparkannya serta-merta. Sesuai untuk pencapaian projek, peristiwa sejarah, pelan pelepasan dan sejarah pembangunan. Setiap peristiwa boleh mempunyai tarikh, tajuk, huraian, warna dan kategori. Gaya visual: tetapkan palet keseluruhan melalui parameter palette (contohnya kecerunan biru-ungu, gangsa hangat, warna jenama) supaya garis masa kelihatan selaras; item.color menggantikan item individu. Gunakan density=relaxed untuk lima peristiwa terpilih atau kurang dan density=compact untuk sepuluh atau lebih. 8 susun atur: vertical (5-20 item) / alternating-top (berselang atas, kronologi terbalik) / alternating-bottom (berselang bawah, kronologi) / horizontal-left (mendatar ke kiri, terbalik) / horizontal-right (mendatar ke kanan, kronologi) / s-curve (lengkung S, 8 item atau kurang) / fishbone-left (tulang ikan ke kiri, terbalik) / fishbone-right (tulang ikan ke kanan, kronologi)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Tajuk garis masa (maksimum 30 aksara), contohnya Pencapaian Produk"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Tatasusunan JSON peristiwa garis masa. Contoh: [{\"date\":\"2024-01\",\"title\":\"Keluaran v1.0\",\"description\":\"Pelancaran ciri teras\",\"color\":\"#5470c6\",\"category\":\"pencapaian\"}]. description/color/category adalah pilihan"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Mod susun atur: vertical / alternating-top (berselang atas, terbalik) / alternating-bottom (berselang bawah, kronologi) / horizontal-left (mendatar, terbalik) / horizontal-right (mendatar, kronologi) / s-curve / fishbone-left (tulang ikan, terbalik) / fishbone-right (tulang ikan, kronologi)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Tatasusunan JSON palet warna keseluruhan, contohnya [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Menggantikan putaran lapan warna lalai. item.color diberi keutamaan"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Jarak item: compact (12px) / normal (20px, lalai) / relaxed (32px). relaxed sesuai untuk lima peristiwa terpilih atau kurang; compact untuk sepuluh atau lebih"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Memaparkan serpihan SVG atau HTML dalam gelembung perbualan. Gunakan untuk garis masa dan gambar rajah hubungan (SVG), pratonton borang dan kad data (HTML), grafik statistik (SVG). Jangan gunakan untuk carta Mermaid; keluarkan Mermaid sebagai blok kod ```mermaid dalam balasan. Had: maksimum 200 KB; <script src=...> hanya daripada CDN dipercayai. Gaya visual: pilih seni bina maklumat (Bento/aliran kad/Grid), hierarki tipografi dan sistem warna mengikut topik. Nada sejuk tanpa sudut untuk perbincangan teknikal, warna neutral dengan nombor menonjol untuk laporan perniagaan, kecerunan/kesan kaca/animasi halus untuk kerja kreatif. Sentiasa nyatakan font-family dan color secara eksplisit; jangan bergantung pada gaya lalai pelayar."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Tajuk widget (maksimum 30 aksara), contohnya Aliran Status Pesanan"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG mesti bermula dengan <svg; serpihan HTML mesti bermula dengan elemen akar dan tidak boleh mengandungi <html><body>. Maksimum 200 KB; <script src=...> hanya daripada CDN dipercayai. Jangan hantar sintaks Mermaid (flowchart/graph/sequenceDiagram dan seumpamanya); keluarkan Mermaid sebagai blok kod ```mermaid dalam balasan"
