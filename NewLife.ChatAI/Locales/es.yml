"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Genera un documento de Word (.docx) y devuelve un enlace de descarga. Admite encabezados, párrafos, listas, tablas, imágenes, saltos de página, separadores, cuadros destacados, KPI, citas y bloques de código. El arreglo JSON sections describe cada sección con heading, content y elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Título del documento (máximo 30 caracteres), por ejemplo Informe trimestral Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Arreglo de secciones (JSON). Campos de cada sección: heading (título de sección), headingLevel (1-3, por defecto 1), content (párrafo del cuerpo, opcional), elements (arreglo de elementos, opcional). Tipos de elemento: paragraph ({type,text, opcional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, opcional tableStyle}; rows es un arreglo bidimensional donde cada fila es un arreglo de valores de celda, por ejemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (opcional): clave de estilo de tarjeta (por ejemplo enterprise-blue) o nombre integrado (blue/dark/corporate/warm/green/minimal); si se omite, se usa el estilo de la conversación o el predeterminado de la marca"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Genera un libro de Excel (.xlsx) y devuelve un enlace de descarga. Admite varias hojas, estilos de encabezado, anchos de columna, formatos numéricos, formatos condicionales, paneles inmovilizados, autofiltros y validación de listas desplegables. El parámetro theme acepta una clave de estilo de tarjeta o un nombre integrado (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Título del libro (máximo 30 caracteres), por ejemplo Informe de ingresos Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Arreglo de hojas (JSON). Campos de cada hoja: name, headers (arreglo de encabezados), rows (arreglo bidimensional; cada fila es un arreglo de valores de celda, por ejemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (por ejemplo [12,20,15]), numberFormat (por ejemplo \"#,##0.00\" o \"yyyy-MM-dd\"), conditionalFormats (arreglo de {range,type,color,value?}; type admite dataBar/colorScale/greaterThan, etc.), charts (arreglo de gráficos), freezeRows (número de filas inmovilizadas), autoFilter (rango de filtro), dropdowns (validación de lista)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (opcional): clave de estilo de tarjeta (por ejemplo enterprise-blue) o nombre integrado (blue/dark/corporate/warm/green/minimal) que controla el encabezado y los colores generales; si se omite, se usa el estilo de la conversación o el predeterminado de la marca"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Genera una presentación de PowerPoint (.pptx) y devuelve un enlace de descarga. Dos modos de entrada mutuamente excluyentes: (1) modo slides, donde la IA describe contenido estructurado y el diseño se genera automáticamente; (2) modo widgetSrc, que incrusta tarjetas show_widget ya generadas como imágenes de diapositiva. El parámetro theme acepta una clave de estilo de tarjeta (por ejemplo enterprise-blue/raycast-dark/ppt-executive) o un nombre integrado (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Título de la presentación (máximo 30 caracteres), por ejemplo Revisión trimestral Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Arreglo de diapositivas (JSON). Un elemento = una diapositiva; varios = una presentación completa. Mutuamente excluyente con widgetSrc. Campos de cada diapositiva: title, layout (title_only/title_content/two_column/chart_only/blank), background (color hexadecimal), footer, showPageNumber (true/false), elements (lista de elementos), notes, transition. elements admite: text (role=title/subtitle/body/kpi/caption; opcional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows es un arreglo bidimensional donde cada fila es un arreglo de valores de celda, por ejemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; opcional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Ejemplo: [{\"title\":\"Portada\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Revisión Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Equipo NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Lista de ID de tarjetas show_widget separados por comas, por ejemplo 'call_abc123,call_def456'. Mutuamente excluyente con slides. Convierte las tarjetas generadas en imágenes de diapositiva"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (opcional): clave de estilo de tarjeta (por ejemplo enterprise-blue/ppt-executive) o nombre integrado (blue/dark/corporate/warm/green/minimal, etc.); si se omite, se usa el estilo de la conversación o el predeterminado de la marca"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Muestra los datos como un gráfico interactivo (zoom, desplazamiento, exportación como imagen). Unas 20 veces más rápido que show_widget: solo se necesita una especificación JSON (unos 200 tokens) y el frontend lo renderiza de inmediato con ECharts. Admite: bar, line (línea/área), pie (circular/anel), scatter, radar, map_china (mapa de calor por provincia de China), heatmap (mapa de calor matricial), gauge, funnel y treemap. Útil para comparaciones numéricas, series temporales (línea), análisis de proporciones y distribución geográfica. Nota: para itinerarios, eventos históricos, hitos y cronologías usa show_timeline; esta herramienta no admite el tipo timeline. Estilo visual: pasa un esquema de colores mediante data.colors en lugar de depender de los valores predeterminados de ECharts. Sugerencias: color de marca para una sola serie, tonos uniformemente distribuidos (10-12 colores) para varias series, colores complementarios para comparaciones y degradado de un solo color para tendencias. Azul y dorado para finanzas, azul/verde/blanco para salud y violeta/azul/cian para tecnología e IA. Para conjuntos de datos grandes, define data.animation=false para reducir el coste de renderizado."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Tipo de gráfico: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Título del gráfico (máximo 30 caracteres), por ejemplo PIB por provincia 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Objeto JSON; la estructura se describe en la descripción de la herramienta. Ejemplo bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Ingresos\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; ejemplo radar multi-serie: {\"indicators\":[{\"name\":\"Velocidad\",\"max\":100},{\"name\":\"Fuerza\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; requisito de radar: el número de indicators debe ser igual a la longitud de cada series[i].data, y data solo debe contener números"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Obtiene los detalles del usuario que ha iniciado sesión, incluidos nombre de usuario, nombre para mostrar, correo, móvil, código, roles, departamento, sexo, edad, cumpleaños y observaciones, además de la dirección IP del visitante, la ciudad y la ubicación geográfica detallada"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Busca esquemas de tablas de base de datos por palabra clave. El resultado tiene dos partes: (1) una correspondencia tabla-conexión (tabla Markdown que indica a qué conexión pertenece cada tabla; las tablas con el mismo nombre en conexiones distintas se listan por separado); (2) el XML del esquema de tablas de cada conexión. Las llamadas posteriores a run_sql deben usar el nombre de conexión indicado en la tabla de correspondencia"
"Search keywords, separated by commas or spaces": "Palabras clave de búsqueda, separadas por comas o espacios"
"Restrict to a connection name; empty searches all connections": "Limitar a un nombre de conexión; vacío busca todas las conexiones"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Ejecuta una instrucción SQL en la conexión de base de datos indicada. Las consultas SELECT/WITH devuelven filas; las instrucciones que no son consultas, como INSERT/UPDATE/DELETE, devuelven el número de filas afectadas. connName debe coincidir con la columna de conexión devuelta por search_table"
"Database connection name (from the connection column of search_table)": "Nombre de la conexión de base de datos (de la columna de conexión de search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Instrucción SQL. SELECT/WITH devuelve un conjunto de resultados; las instrucciones que no son consultas devuelven el número de filas afectadas"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Consulta la fecha del calendario lunar, el término solar y el estado laboral (día laborable/festivo/día de recuperación) de una fecha"
"Date to query in yyyy-MM-dd format. Defaults to today": "Fecha a consultar en formato yyyy-MM-dd. Por defecto hoy"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Muestra una lista de tareas como un tablero kanban de varias columnas (por ejemplo Por hacer -> En curso -> Hecho). Adecuado para descomposición de proyectos, planificación de sprints, visualización de flujos de trabajo y clasificación de estados de tareas. Cada columna puede tener un marcador de color y un límite WIP; cada tarjeta puede tener título, descripción, prioridad, etiquetas, fecha de vencimiento, responsable, lista de comprobación, progreso y enlace. Dos diseños: board (tablero multicolumna por defecto) y swimlane (columnas agrupadas por equipo o módulo)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Título del tablero (máximo 30 caracteres), por ejemplo Tablero Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Arreglo JSON de definiciones de columnas. Ejemplo: [{\"id\":\"todo\",\"title\":\"Por hacer\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Análisis de requisitos\",\"description\":\"Recopilar requisitos de usuario\",\"priority\":\"high\",\"tags\":[\"diseño\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Entrevistar usuarios\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Todos los campos excepto id y title son opcionales"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Modo de diseño: board (tablero multicolumna por defecto) o swimlane (columnas agrupadas por equipo o módulo; se requiere el parámetro swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Arreglo JSON de definiciones de carriles (se usa cuando layout=swimlane). Ejemplo: [{\"id\":\"sl1\",\"title\":\"Equipo frontend\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Equipo backend\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Marca puntos de coordenadas (ciudades o POI) o resalta provincias en un mapa de China, genera un mapa SVG anotado y lo renderiza en la burbuja de chat. Admite: (1) relleno de provincias con colores personalizados; (2) marcadores WGS84 de latitud/longitud con texto de etiqueta; (3) leyenda automática en la esquina inferior derecha. Usos típicos: distribución de datos por provincia, ubicación de ciudades y mapas de calor de ventas regionales."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Título del mapa (máximo 30 caracteres), por ejemplo PIB por provincia 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Arreglo JSON de marcadores (puede ser un arreglo vacío []). Formato: [{\"name\":\"Pekín\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Pekín\\n4376 MM\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng son grados decimales WGS84; color/size son opcionales"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Arreglo JSON de resaltados de provincias (puede ser un arreglo vacío []). Formato: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"N.º 1 PIB\"}]. name acepta el nombre chino de la provincia (completo o abreviado); label es opcional"
"Legend title (optional), e.g. GDP scale": "Título de la leyenda (opcional), por ejemplo Escala del PIB"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Esquema de colores (opcional): blue/orange/green/purple/red; por defecto blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Estilo de marcador (opcional): circle/pin/square; por defecto circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Muestra jerarquías de conocimiento o relaciones conceptuales como un mapa mental interactivo plegable. La entrada es un esquema Markdown (# / ## / ###) que el frontend convierte en un árbol visual. Útil para organizar conocimiento, descomponer conceptos, comparar tecnologías, evaluar opciones y resumir contenido. Estilo visual: elige branchColors (3-8 colores coordinados), maxDepth (complejidad) y collapsed (plegado inicial para centrarse) según el tema. Colores fríos (azul/violeta/cian) para tecnología y datos, cálidos (naranja/oro/rojo) para negocios y marketing, y verdes para naturaleza y salud. Para nodos densos, define maxDepth=2 para mantener la legibilidad. 6 diseños: tree (árbol con sangría por defecto, uso general) / radial (radial izquierda-derecha, ideal para mapas de conocimiento) / lr (del centro a la derecha, diagramas de flujo/árboles de decisión) / rl (del centro a la izquierda, trazado inverso) / tb (del centro hacia abajo, organigramas) / bt (del centro hacia arriba, jerarquía ascendente)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Título del mapa mental (máximo 30 caracteres), por ejemplo Pila tecnológica de IA"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Esquema Markdown usando # / ## / ### para los niveles 1 a 3. Ejemplo:\n# Inteligencia artificial\n## Aprendizaje automático\n### Aprendizaje supervisado\n### Aprendizaje no supervisado\n## Aprendizaje profundo\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Modo de diseño: tree (árbol con sangría por defecto, uso general) / radial (radial izquierda-derecha, ideal para mapas de conocimiento) / lr (del centro a la derecha, diagramas de flujo/árboles de decisión) / rl (del centro a la izquierda, trazado inverso) / tb (del centro hacia abajo, organigramas) / bt (del centro hacia arriba, jerarquía ascendente)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Arreglo JSON de colores de rama, por ejemplo [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3 a 8 colores hexadecimales asignados en orden a las ramas de primer nivel. Si se omite, se usa la paleta predeterminada azul/violeta, verde, amarillo, rojo, azul cielo, verde oscuro, naranja, violeta"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Arreglo JSON de ID de nodos plegados inicialmente, por ejemplo [\"n2\",\"n5\"]. Vacío expande todo. Sirve para centrarse en ramas clave"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Profundidad visible máxima: 1 = solo ramas de primer nivel, 2 = dos niveles, ilimitada por defecto. Para nodos densos, define 2 para mantener la legibilidad"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Muestra datos temporales como tarjetas de línea de tiempo atractivas. Solo se necesita JSON (unos 100 tokens) y el frontend lo renderiza al instante. Útil para hitos de proyecto, eventos históricos, planes de versión e historial de desarrollo. Cada evento puede tener fecha, título, descripción, color y categoría. Estilo visual: define una paleta global mediante el parámetro palette (por ejemplo degradado azul-violeta, bronce cálido, colores de marca) para una ambientación coherente; item.color sobrescribe un elemento individual. Usa density=relaxed para 5 eventos o menos y density=compact para 10 o más. 8 diseños: vertical (5-20 elementos) / alternating-top (alternando arriba, orden inverso) / alternating-bottom (alternando abajo, orden cronológico) / horizontal-left (horizontal a la izquierda, orden inverso) / horizontal-right (horizontal a la derecha, orden cronológico) / s-curve (ruta en S, 8 elementos o menos) / fishbone-left (espina de pescado a la izquierda, orden inverso) / fishbone-right (espina de pescado a la derecha, orden cronológico)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Título de la línea de tiempo (máximo 30 caracteres), por ejemplo Hitos del producto"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Arreglo JSON de eventos de la línea de tiempo. Ejemplo: [{\"date\":\"2024-01\",\"title\":\"Lanzamiento v1.0\",\"description\":\"Funciones principales en línea\",\"color\":\"#5470c6\",\"category\":\"Hito\"}]. description/color/category son opcionales"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Modo de diseño: vertical / alternating-top (alternando arriba, orden inverso) / alternating-bottom (alternando abajo, cronológico) / horizontal-left (horizontal, orden inverso) / horizontal-right (horizontal, cronológico) / s-curve / fishbone-left (espina de pescado, orden inverso) / fishbone-right (espina de pescado, cronológico)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Arreglo JSON de paleta global, por ejemplo [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Sobrescribe la rotación predeterminada de 8 colores. item.color tiene prioridad"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Espaciado de elementos: compact (12px) / normal (20px, por defecto) / relaxed (32px). relaxed conviene a 5 eventos o menos; compact a 10 o más"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Muestra un fragmento SVG o HTML dentro de la burbuja de chat. Úsalo para líneas de tiempo y diagramas de relaciones (SVG), vistas previas de formularios y tarjetas de datos (HTML) y gráficos estadísticos (SVG). No lo uses para diagramas Mermaid; envía Mermaid como bloque de código ```mermaid en la respuesta. Límites: 200 KB o menos; <script src=...> solo desde CDN de confianza. Estilo visual: elige la arquitectura de información (Bento/flujo de tarjetas/Grid), la jerarquía tipográfica y el sistema de color según el tema. Tonos fríos sin serifa para debates técnicos, colores neutros con cifras destacadas para informes de negocio y degradados/glassmorphism/microanimaciones para creatividad. Define siempre font-family y color de forma explícita; no dependas de los estilos predeterminados del navegador."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Título del widget (máximo 30 caracteres), por ejemplo Flujo de estado del pedido"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "El SVG debe empezar por <svg; los fragmentos HTML deben empezar por el elemento raíz y no incluir <html><body>. Máximo 200 KB; <script src=...> solo desde CDN de confianza. No pases sintaxis Mermaid (flowchart/graph/sequenceDiagram, etc.); envía Mermaid como bloque de código ```mermaid en la respuesta"
"Placeholder text shown while loading (optional)": "Texto de marcador de posición que se muestra durante la carga (opcional)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Indicación de tema: light / dark / auto (seguir el sistema). El HTML generado debe elegir los colores de fondo y texto en consecuencia; no se pasa al renderizador del frontend"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Altura inicial del widget en px (80-1200). Por defecto 480. Usa 300-400 para tarjetas compactas y 600-800 para gráficos grandes"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Modo de fondo: solid (por defecto) / transparent (para superponer capturas sobre una plantilla de PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Modo diapositiva de PPT. Si es true, la tarjeta se renderiza en proporción 16:9, lista para pegar en una presentación. Por defecto false, que mantiene el ancho adaptado al contenido"
"Section heading text, e.g. Completed this week": "Texto del encabezado de sección, por ejemplo Completado esta semana"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Nivel de encabezado: 1 = nivel 1 (el mayor), 2 = nivel 2, 3 = nivel 3; por defecto 1"
"Body paragraph text (optional; used together with elements)": "Texto del párrafo del cuerpo (opcional; se usa junto con elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Arreglo de elementos estructurados (opcional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Tipo de elemento: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Contenido de texto (se usa cuando type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Arreglo de elementos de lista (se usa cuando type=bullet_list u ordered_list)"
"Table header row (required when type=table)": "Fila de encabezado de la tabla (obligatoria cuando type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Filas de datos de la tabla (obligatorias cuando type=table); cada fila es un arreglo de valores de celda, por ejemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Estilo de la tabla (opcional para type=table): headerBgColor (fondo del encabezado), headerFontColor (color del texto del encabezado), stripeColor (filas alternas)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL de la imagen (obligatoria cuando type=image); admite enlaces externos https:// o adjuntos internos como /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Ancho de la imagen en centímetros (type=image); por defecto 14 cm"
"Image height in centimeters (type=image); default 10cm": "Alto de la imagen en centímetros (type=image); por defecto 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Indica si el texto está en negrita (opcional para type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Indica si el texto está en cursiva (opcional para type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Indica si el texto está subrayado (opcional para type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Tamaño de fuente en puntos, por ejemplo 12 (opcional para type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Color del texto (RGB hexadecimal, por ejemplo 2563EB; opcional para type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Alineación del texto: left/center/right/justify (opcional para type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Color de fondo del párrafo (RGB hexadecimal, por ejemplo EFF6FF; opcional para type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Variante del cuadro destacado (type=callout): info (azul) / success (verde) / warning (amarillo) / danger (rojo); por defecto info"
"KPI value (required when type=kpi), e.g. 17.68M": "Valor del KPI (obligatorio cuando type=kpi), por ejemplo 17,68 M"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Etiqueta del KPI (opcional cuando type=kpi), por ejemplo crecimiento intermensual"
"KPI trend (optional when type=kpi): up / down / flat": "Tendencia del KPI (opcional cuando type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Fuente de la cita (opcional cuando type=quote), por ejemplo Informe anual 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Lenguaje del código (opcional cuando type=code), por ejemplo sql/python/javascript; selecciona los colores de resaltado de sintaxis"
"Worksheet name, e.g. Q2 Data": "Nombre de la hoja, por ejemplo Datos Q2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Arreglo de encabezados de columna, por ejemplo [\"Fecha\",\"Ingresos\",\"Variación\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Filas de datos (arreglo bidimensional); cada fila es un arreglo de valores de celda, por ejemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Estilo del encabezado (opcional): headerBgColor (fondo del encabezado), headerFontColor (color del texto del encabezado), stripeColor (filas alternas)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Arreglo de anchos de columna (opcional), por ejemplo [12, 20, 15]; los valores son anchos aproximados en caracteres"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Formato numérico (opcional), por ejemplo \"#,##0.00\" o \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Arreglo de formatos condicionales (opcional). Campos de cada elemento: range (por ejemplo \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (color principal), value (umbral)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Arreglo de definiciones de gráficos (opcional): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Número de filas superiores inmovilizadas (0 = ninguna, 1 = inmovilizar la primera fila; por defecto 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Rango del autofiltro (por ejemplo \"A1:E1\"); desactivado si está vacío"
"Dropdown validation array (optional)": "Arreglo de validaciones de lista desplegable (opcional)"
"Applied range (e.g. \"C2:C10\")": "Rango aplicado (por ejemplo \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Tipo de condición: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Color (RGB hexadecimal, por ejemplo 2563EB) usado para barras de datos, escalas de color o resaltados"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Umbral o fórmula (por ejemplo 1000 o =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Tipo de gráfico: bar / line / pie"
"Chart title (optional)": "Título del gráfico (opcional)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Arreglo de etiquetas del eje de categorías, por ejemplo [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Arreglo de series de datos; cada elemento tiene name y data"
"Applied range (e.g. \"A2:A100\")": "Rango aplicado (por ejemplo \"A2:A100\")"
"Dropdown option array": "Arreglo de opciones de la lista desplegable"
"Title of this slide": "Título de esta diapositiva"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Diseño de la diapositiva: title_only (solo título, para portadas) / title_content (título + cuerpo, por defecto) / two_column (dos columnas) / chart_only (gráfico a todo el ancho) / blank (lienzo vacío)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Color de fondo de la diapositiva, RGB hexadecimal como \"1F497D\"; si se omite, se usa el fondo del tema"
"Slide element list; each element describes a text block, table, chart, or image": "Lista de elementos de la diapositiva; cada elemento describe un bloque de texto, una tabla, un gráfico o una imagen"
"Footer text displayed at the bottom of the slide; null hides it": "Texto del pie de página mostrado en la parte inferior; null lo oculta"
"Whether to show the slide number in the bottom-right corner; default false": "Indica si se muestra el número de diapositiva en la esquina inferior derecha; por defecto false"
"Speaker notes used as a reminder while presenting": "Notas del ponente que sirven de recordatorio durante la presentación"
"Transition animation: fade / push / wipe / zoom / split / cut": "Animación de transición: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Tipo de elemento: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Rol semántico (solo elementos text): title / subtitle / body / caption / kpi. El motor de diseño lo usa para posicionar el elemento automáticamente, sin necesidad de coordenadas"
"Text content (required when type=text)": "Contenido de texto (obligatorio cuando type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Tamaño de fuente en puntos (opcional); si se omite, el motor de diseño elige uno según el role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Indica si el texto está en negrita; por defecto false"
"Whether the text is italic (optional for type=text); default false": "Indica si el texto está en cursiva (opcional para type=text); por defecto false"
"Whether the text is underlined (optional for type=text); default false": "Indica si el texto está subrayado (opcional para type=text); por defecto false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Color del texto, RGB hexadecimal como \"FFFFFF\"; si se omite, se hereda el color de texto del tema"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Arreglo de encabezados de la tabla (obligatorio cuando type=table), por ejemplo [\"Métrica\",\"Q1\",\"Q2\",\"Variación\"]"
"Chart type (required when type=chart): bar / line / pie": "Tipo de gráfico (obligatorio cuando type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Etiquetas de categoría del gráfico (obligatorias cuando type=chart), por ejemplo [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Series de datos (obligatorias cuando type=chart); cada elemento tiene name (nombre de la serie) y data (arreglo de números)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Alineación del texto (elementos text): l (izquierda) / ctr (centro) / r (derecha)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Color de fondo del cuadro de texto (elementos text), RGB hexadecimal como \"EFF6FF\"; transparente si está vacío"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Fragmentos de texto enriquecido (elementos text); si están presentes, se ignoran Content/FontSize/Bold/Color"
"Shape configuration (required when type=shape)": "Configuración de la forma (obligatoria cuando type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Estilo de la tabla (opcional para type=table): headerBgColor (fondo del encabezado), headerFontColor (color del texto del encabezado), stripeColor (filas alternas)"
"Text content": "Contenido de texto"
"Font size in points; 0 inherits the text box default": "Tamaño de fuente en puntos; 0 hereda el valor predeterminado del cuadro de texto"
"Whether the text is bold": "Indica si el texto está en negrita"
"Whether the text is italic": "Indica si el texto está en cursiva"
"Whether the text is underlined": "Indica si el texto está subrayado"
"Text color, hex RGB such as \"FF6B6B\"": "Color del texto, RGB hexadecimal como \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL del hipervínculo; si se define, el fragmento se vuelve clicable"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Tipo de forma: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Color de relleno (RGB hexadecimal, por ejemplo 2563EB); null significa sin relleno"
"Border color (hex RGB); null means no border": "Color del borde (RGB hexadecimal); null significa sin borde"
"Text displayed inside the shape (optional)": "Texto mostrado dentro de la forma (opcional)"
"Text color inside the shape (hex RGB)": "Color del texto dentro de la forma (RGB hexadecimal)"
"Font size of the text inside the shape (points); 0 means default": "Tamaño de fuente del texto dentro de la forma (puntos); 0 significa el valor predeterminado"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Color de fondo de la fila de encabezado (RGB hexadecimal, por ejemplo 2563EB); si se omite, no se aplica ningún estilo especial"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "Color del texto de la fila de encabezado (RGB hexadecimal, por ejemplo FFFFFF); si se omite, se hereda el predeterminado"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "Color de las filas alternas (fondo de las filas de datos pares, por ejemplo EFF6FF azul claro); si se omite, no se dibujan franjas"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "ID único de la columna (obligatorio), por ejemplo \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "Título de la columna (obligatorio, máximo 20 caracteres)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "Color del título de la columna (opcional), hexadecimal, por ejemplo \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "Límite WIP (opcional); el título de la columna se vuelve rojo cuando se supera"
"Card array (required)": "Arreglo de tarjetas (obligatorio)"
"Unique card ID (required)": "ID único de la tarjeta (obligatorio)"
"Card title (required, up to 40 characters)": "Título de la tarjeta (obligatorio, máximo 40 caracteres)"
"Supplementary description (optional, up to 100 characters)": "Descripción complementaria (opcional, máximo 100 caracteres)"
"Priority (optional): high | medium | low": "Prioridad (opcional): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "Arreglo de cadenas de etiquetas (opcional), por ejemplo [\"diseño\",\"frontend\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "Fecha de vencimiento (opcional), ISO 8601 como \"2026-07-15\""
"Assignee name (optional)": "Nombre del responsable (opcional)"
"Subtask checklist (optional); each item has title and done": "Lista de comprobación de subtareas (opcional); cada elemento tiene title y done"
"Completion progress (optional), 0-100": "Progreso de finalización (opcional), 0-100"
"Related link URL (optional)": "URL del enlace relacionado (opcional)"
"Subtask title": "Título de la subtarea"
"Whether the subtask is done": "Indica si la subtarea está hecha"
"Unique swimlane ID (required)": "ID único del carril (obligatorio)"
"Swimlane title (required)": "Título del carril (obligatorio)"
"Column ID array contained in this swimlane (required)": "Arreglo de ID de columnas contenidas en este carril (obligatorio)"
"City or place name (required), e.g. Beijing": "Nombre de ciudad o lugar (obligatorio), por ejemplo Pekín"
"Latitude (required), WGS84 decimal degrees": "Latitud (obligatoria), grados decimales WGS84"
"Longitude (required), WGS84 decimal degrees": "Longitud (obligatoria), grados decimales WGS84"
"Marker label text (optional); supports \\n line breaks": "Texto de la etiqueta del marcador (opcional); admite \\\\n para saltos de línea"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "Color del marcador (opcional), hexadecimal como \"#E74C3C\"; si se omite, los colores rotan según el esquema"
"Marker size (optional); default 7": "Tamaño del marcador (opcional); por defecto 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "Nombre de la provincia (obligatorio); acepta el nombre chino de la provincia (completo o abreviado), por ejemplo Guangdong"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "Color del resaltado (opcional), hexadecimal como \"#FFB347\"; por defecto el color de la paleta"
"Highlight label (optional), e.g. No.1 GDP": "Etiqueta del resaltado (opcional), por ejemplo N.º 1 PIB"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "Fecha del evento (obligatoria); cualquier formato, por ejemplo \"2024-01\", \"2024 Q3\" o \"Fase 1\""
"Event title (required, up to 30 characters)": "Título del evento (obligatorio, máximo 30 caracteres)"
"Supplementary description (optional, up to 80 characters)": "Descripción complementaria (opcional, máximo 80 caracteres)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "Color hexadecimal (opcional), por ejemplo \"#5470c6\"; si se omite, la paleta rota automáticamente"
"Event category label (optional), e.g. Milestone, Release, Issue": "Etiqueta de categoría del evento (opcional), por ejemplo Hito, Lanzamiento, Problema"
