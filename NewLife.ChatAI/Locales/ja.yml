"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Word 文書（.docx）を生成し、ダウンロードリンクを返します。見出し、段落、リスト、表、画像、改ページ、区切り線、コールアウト、KPI、引用、コードブロックに対応。sections JSON 配列で各セクションを記述します（heading、content、elements）"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "文書タイトル（30 文字以内）。例: Q2 四半期報告書"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "セクション配列（JSON）。各セクションのフィールド: heading（見出し）、headingLevel（1〜3、既定 1）、content（本文段落、任意）、elements（要素配列、任意）。要素タイプ: paragraph（{type,text,任意で bold/italic/underline/fontSize/color/alignment/backgroundColor}）、bullet_list（{type,items}）、ordered_list（{type,items}）、table（{type,headers,rows,任意で tableStyle}。rows は 2 次元配列で各行がセル値の配列。例: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]）、image（{type,src,widthCm?,heightCm?}）、page_break（{type}）、divider（{type}）、callout（{type,text,variant?=info/success/warning/danger}）、kpi（{type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}）、quote（{type,text,quoteSource?}）、code（{type,text,codeLanguage?}）"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "テーマ（任意）: カードスタイルのキー（例: enterprise-blue）または組み込み名（blue/dark/corporate/warm/green/minimal）。省略時は会話スタイルまたはブランド既定値を使用"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Excel ワークブック（.xlsx）を生成し、ダウンロードリンクを返します。複数シート、ヘッダー書式、列幅、数値書式、条件付き書式、ウィンドウ枠の固定、オートフィルター、ドロップダウン検証に対応。theme パラメーターはカードスタイルのキーまたは組み込み名（blue/dark/corporate/warm/green/minimal）を受け付けます"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "ワークブックのタイトル（30 文字以内）。例: Q2 売上レポート"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "ワークシート配列（JSON）。各シートのフィールド: name、headers（ヘッダー配列）、rows（2 次元配列。各行がセル値の配列。例: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]）、style（{headerBgColor,headerFontColor,stripeColor}）、columnWidths（例: [12,20,15]）、numberFormat（例: \"#,##0.00\" や \"yyyy-MM-dd\"）、conditionalFormats（{range,type,color,value?} の配列。type は dataBar/colorScale/greaterThan など）、charts（グラフ配列）、freezeRows（固定する行数）、autoFilter（フィルター範囲）、dropdowns（ドロップダウン検証）"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "テーマ（任意）: カードスタイルのキー（例: enterprise-blue）または組み込み名（blue/dark/corporate/warm/green/minimal）。ヘッダーと全体の配色を制御します。省略時は会話スタイルまたはブランド既定値を使用"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "PowerPoint プレゼンテーション（.pptx）を生成し、ダウンロードリンクを返します。排他的な 2 つの入力モード: (1) slides モード（AI が構造化コンテンツを記述し、レイアウトを自動生成）、(2) widgetSrc モード（生成済みの show_widget カードをスライド画像として埋め込み）。theme パラメーターはカードスタイルのキー（例: enterprise-blue/raycast-dark/ppt-executive）または組み込み名（blue/dark/green/warm/corporate/minimal）を受け付けます。"
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "プレゼンテーションのタイトル（30 文字以内）。例: Q2 四半期レビュー"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "スライド配列（JSON）。1 要素 = 1 枚、複数要素 = デッキ全体。widgetSrc とは排他的です。各スライドのフィールド: title、layout（title_only/title_content/two_column/chart_only/blank）、background（16 進数カラー）、footer、showPageNumber（true/false）、elements（要素リスト）、notes、transition。elements は次に対応: text（role=title/subtitle/body/kpi/caption。任意で bold/italic/underline/alignment=l/ctr/r/backgroundColor/color）、table（headers+rows。rows は 2 次元配列で各行がセル値の配列。例: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]。任意で tableStyle={headerBgColor/headerFontColor/stripeColor}）、chart（chartType=bar/line/pie/area/scatter+categories+series）、image（src）、shape（shape={shapeType,fillColor,lineColor,text,fontColor}）。例: [{\"title\":\"表紙\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 レビュー\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife チーム\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "show_widget カード ID のカンマ区切りリスト（例: 'call_abc123,call_def456'）。slides とは排他的です。生成済みカードをスライド画像としてレンダリングします"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "テーマ（任意）: カードスタイルのキー（例: enterprise-blue/ppt-executive）または組み込み名（blue/dark/corporate/warm/green/minimal など）。省略時は会話スタイルまたはブランド既定値を使用"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "データをインタラクティブなグラフとして描画します（ズーム、ホバー、画像エクスポート）。show_widget より約 20 倍高速で、JSON 仕様（約 200 トークン）だけでフロントエンドが ECharts で即座に描画します。対応: bar、line（折れ線/面）、pie（円/ドーナツ）、scatter、radar、map_china（中国省別ヒートマップ）、heatmap（マトリクスヒートマップ）、gauge、funnel、treemap。数値比較、時系列の変化（折れ線）、構成比、地理分布に適しています。注意: 旅程、歴史的事象、マイルストーン、タイムラインには show_timeline を使用してください。このツールは timeline タイプに対応していません。ビジュアル: ECharts の既定値に頼らず data.colors で配色を指定してください。推奨: 単一シリーズはブランドカラー、複数シリーズは色相環を均等に（10〜12 色）、比較図は補色、トレンドは単色グラデーション。財務は青と金、医療は青緑白、技術と AI は紫青シアン。データ量が多い場合は data.animation=false で描画負荷を下げてください。"
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "グラフの種類: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "グラフのタイトル（30 文字以内）。例: 2024 年 省別 GDP 分布"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON オブジェクト。構造はツールの説明を参照。bar の例: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"売上\",\"data\":[100,200]}],\"unit\":\"万元\"}、radar の複数シリーズ例: {\"indicators\":[{\"name\":\"速度\",\"max\":100},{\"name\":\"パワー\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}。radar の要件: indicators の数は各 series[i].data の長さと一致し、data は数値のみであること"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "現在サインインしているユーザーの詳細（ユーザー名、表示名、メール、携帯、コード、ロール、部署、性別、年齢、誕生日、備考）と、アクセス元 IP、都市、詳細な位置情報を取得します"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "キーワードでデータベースのテーブルスキーマを検索します。結果は 2 部構成: (1) テーブルと接続の対応表（各テーブルがどの接続に属するかを示す Markdown 表。同名テーブルは接続ごとに別行）、(2) 各接続のテーブルスキーマ XML。後続の run_sql では対応表の接続名を使用する必要があります"
"Search keywords, separated by commas or spaces": "検索キーワード（カンマまたはスペース区切り）"
"Restrict to a connection name; empty searches all connections": "接続名で絞り込みます。空の場合はすべての接続を検索します"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "指定したデータベース接続で SQL 文を実行します。SELECT/WITH は行を返し、INSERT/UPDATE/DELETE などの非クエリ文は影響行数を返します。connName は search_table が返す接続列と一致する必要があります"
"Database connection name (from the connection column of search_table)": "データベース接続名（search_table の接続列）"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL 文。SELECT/WITH は結果セットを返し、非クエリ文は影響行数を返します"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "指定日の旧暦、二十四節気、勤務日区分（勤務日/休日/振替出勤）を調べます"
"Date to query in yyyy-MM-dd format. Defaults to today": "照会する日付（yyyy-MM-dd 形式）。既定は今日"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "タスクリストを複数列のカンバンボードとして描画します（例: 未着手 -> 進行中 -> 完了）。プロジェクト分解、スプリント計画、ワークフロー表示、タスク状態の分類に適しています。各列には色マーカーと WIP 上限を設定でき、各カードにはタイトル、説明、優先度、タグ、期限、担当者、チェックリスト、進捗、リンクを含められます。レイアウトは 2 種類: board（既定の複数列ボード）と swimlane（チームやモジュール別に列をまとめる）。"
"Board title (up to 30 characters), e.g. Sprint 1 Board": "ボードのタイトル（30 文字以内）。例: Sprint 1 ボード"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "列定義の JSON 配列。例: [{\"id\":\"todo\",\"title\":\"未着手\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"要件分析\",\"description\":\"ユーザー要件を整理\",\"priority\":\"high\",\"tags\":[\"設計\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"ユーザーにヒアリング\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]。id と title 以外はすべて任意です"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "レイアウトモード: board（既定の複数列ボード）または swimlane（チームやモジュール別に列をまとめる。swimlanes パラメーターが必要）"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "スイムレーン定義の JSON 配列（layout=swimlane の場合に使用）。例: [{\"id\":\"sl1\",\"title\":\"フロントエンドチーム\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"バックエンドチーム\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "中国地図上に座標点（都市や POI）をマークするか省エリアを強調し、注釈付き SVG 地図を生成してチャットバブルに描画します。対応: (1) 任意の色で省を塗りつぶし、(2) WGS84 の緯度経度マーカー（ラベル付き）、(3) 右下の自動凡例。用途: 省別のデータ分布、都市の位置表示、地域別売上ヒートマップ。"
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "地図のタイトル（30 文字以内）。例: 2024 年 省別 GDP 分布"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "マーカーの JSON 配列（空配列 [] も可）。形式: [{\"name\":\"北京\",\"lat\":39.9,\"lng\":116.4,\"label\":\"北京\\n4376 億\",\"color\":\"#E74C3C\",\"size\":8}]。lat/lng は WGS84 の十進度、color/size は任意です"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "省の強調表示 JSON 配列（空配列 [] も可）。形式: [{\"name\":\"広東省\",\"color\":\"#FFB347\",\"label\":\"GDP 1 位\"}]。name は中国語の省名（正式名または略称）を受け付けます。label は任意です"
"Legend title (optional), e.g. GDP scale": "凡例のタイトル（任意）。例: GDP 規模"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "配色（任意）: blue/orange/green/purple/red。既定は blue"
"Marker style (optional): circle/pin/square; defaults to circle": "マーカーのスタイル（任意）: circle/pin/square。既定は circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "知識の階層や概念の関係を、折りたたみ可能なインタラクティブなマインドマップとして描画します。入力は Markdown アウトライン（# / ## / ###）で、フロントエンドが視覚的なツリーに変換します。知識の整理、概念の分解、技術比較、選択肢の評価、内容の要約に適しています。ビジュアル: 話題に応じて branchColors（3〜8 色の調和色）、maxDepth（複雑さ）、collapsed（重点に絞るため初期折りたたみ）を選んでください。技術とデータは寒色（青紫シアン）、ビジネスとマーケティングは暖色（橙金赤）、自然と健康は緑系。ノードが密な場合は maxDepth=2 で読みやすくします。レイアウトは 6 種類: tree（既定のインデントツリー、汎用）/ radial（左右放射、知識マップに最適）/ lr（中心から右、フローチャート/決定木）/ rl（中心から左、遡及）/ tb（中心から下、組織図）/ bt（中心から上、ボトムアップ階層）。"
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "マインドマップのタイトル（30 文字以内）。例: 人工知能の技術体系"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown アウトライン。# / ## / ### で 1〜3 階層を表します。例:\n# 人工知能\n## 機械学習\n### 教師あり学習\n### 教師なし学習\n## 深層学習\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "レイアウトモード: tree（既定のインデントツリー、汎用）/ radial（左右放射、知識マップに最適）/ lr（中心から右、フローチャート/決定木）/ rl（中心から左、遡及）/ tb（中心から下、組織図）/ bt（中心から上、ボトムアップ階層）"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "分岐色の JSON 配列（例: [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]）。3〜8 色の 16 進数カラーを上位分岐に順に割り当てます。省略時は青紫/緑/黄/赤/空色/深緑/橙/紫の既定パレットを使用"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "初期折りたたみノード ID の JSON 配列（例: [\"n2\",\"n5\"]）。空の場合はすべて展開します。重要な分岐に絞るときに使用"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "表示する最大深さ: 1 = 第 1 階層のみ、2 = 2 階層、既定は無制限。ノードが密な場合は 2 を推奨"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "時系列データを見栄えのするタイムラインカードとして描画します。JSON（約 100 トークン）だけでフロントエンドが即座に描画します。プロジェクトのマイルストーン、歴史的事象、リリース計画、沿革に適しています。各イベントには日付、タイトル、説明、色、カテゴリを含められます。ビジュアル: palette パラメーターで全体の配色を設定（青紫グラデーション、暖かいブロンズ、ブランドカラーなど）し、一貫した雰囲気にします。item.color で個別に上書きできます。5 件以下の厳選イベントは density=relaxed、10 件以上の密なタイムラインは density=compact を推奨。レイアウトは 8 種類: vertical（5〜20 件）/ alternating-top（上下交互、新しい順）/ alternating-bottom（上下交互、古い順）/ horizontal-left（横方向、新しい順、矢印は左）/ horizontal-right（横方向、古い順、矢印は右）/ s-curve（S 字パス、8 件以下）/ fishbone-left（フィッシュボーン左、新しい順）/ fishbone-right（フィッシュボーン右、古い順）。"
"Timeline title (up to 30 characters), e.g. Product Milestones": "タイムラインのタイトル（30 文字以内）。例: 製品開発のマイルストーン"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "タイムラインイベントの JSON 配列。例: [{\"date\":\"2024-01\",\"title\":\"v1.0 リリース\",\"description\":\"主要機能を公開\",\"color\":\"#5470c6\",\"category\":\"マイルストーン\"}]。description/color/category は任意です"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "レイアウトモード: vertical / alternating-top（上下交互、新しい順）/ alternating-bottom（上下交互、古い順）/ horizontal-left（横方向、新しい順）/ horizontal-right（横方向、古い順）/ s-curve / fishbone-left（フィッシュボーン、新しい順）/ fishbone-right（フィッシュボーン、古い順）"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "全体配色の JSON 配列（例: [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]）。既定の 8 色ローテーションを上書きします。item.color が優先されます"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "項目の間隔: compact（12px）/ normal（20px、既定）/ relaxed（32px）。5 件以下の厳選イベントは relaxed、10 件以上は compact を推奨"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "SVG または HTML の断片をチャットバブル内に描画します。タイムラインや関係図（SVG）、フォームプレビューやデータカード（HTML）、統計グラフ（SVG）に使用します。Mermaid 図には使用しないでください。Mermaid は返信内で ```mermaid コードブロックとして出力してください。制限: 200KB 以下、<script src=...> は信頼できる CDN のみ。ビジュアル: 話題に応じて情報設計（Bento/カードフロー/Grid）、文字階層、配色を選んでください。技術的な議論は寒色のサンセリフ、ビジネスレポートは中性色と数字の強調、クリエイティブはグラデーション/グラスモーフィズム/マイクロアニメーション。font-family と color を必ず明示し、ブラウザ既定のスタイルに頼らないでください。"
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widget のタイトル（30 文字以内）。例: 注文ステータスのフロー"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG は <svg で始まる必要があります。HTML 断片はルート要素で始まり、<html><body> を含めてはいけません。最大 200KB、<script src=...> は信頼できる CDN のみ。Mermaid 構文（flowchart/graph/sequenceDiagram など）を渡さないでください。Mermaid は返信内で ```mermaid コードブロックとして出力してください"
"Placeholder text shown while loading (optional)": "読み込み中に表示するプレースホルダーテキスト（任意）"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "テーマのヒント: light / dark / auto（システムに従う）。生成する HTML はこれに合わせて背景色と文字色を選んでください。フロントエンドのレンダラーには渡されません"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Widget の初期高さ（px、80〜1200）。既定は 480。コンパクトなカードは 300〜400、大きなグラフは 600〜800 を推奨"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "背景モード: solid（既定）/ transparent（スクリーンショットを PPT テンプレートに重ねる場合）"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT スライドモード。true の場合はカードを 16:9 比率で描画し、プレゼンテーションにそのまま貼り付けられます。既定は false（内容に応じた幅）"
"Section heading text, e.g. Completed this week": "セクション見出しのテキスト。例: 今週の完了項目"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "見出しレベル: 1 = 第 1 階層（最大）、2 = 第 2 階層、3 = 第 3 階層。既定は 1"
"Body paragraph text (optional; used together with elements)": "本文段落のテキスト（任意。elements と併用）"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "構造化要素の配列（任意）: paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "要素タイプ: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "テキスト内容（type=paragraph/callout/quote/code の場合に使用）"
"List item array (used when type=bullet_list or ordered_list)": "リスト項目の配列（type=bullet_list または ordered_list の場合に使用）"
"Table header row (required when type=table)": "表のヘッダー行（type=table の場合は必須）"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "表のデータ行（type=table の場合は必須）。各行はセル値の配列（例: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]）"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "表のスタイル（type=table の場合は任意）: headerBgColor（ヘッダー背景色）、headerFontColor（ヘッダー文字色）、stripeColor（縞模様の色）"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "画像 URL（type=image の場合は必須）。外部 https:// リンクまたは内部添付（例: /cube/image?id=xxx）に対応"
"Image width in centimeters (type=image); default 14cm": "画像の幅（センチ、type=image）。既定は 14cm"
"Image height in centimeters (type=image); default 10cm": "画像の高さ（センチ、type=image）。既定は 10cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "テキストを太字にするか（type=paragraph/callout/quote の場合は任意）"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "テキストを斜体にするか（type=paragraph/callout/quote の場合は任意）"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "テキストに下線を引くか（type=paragraph/callout/quote の場合は任意）"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "フォントサイズ（ポイント、例: 12。type=paragraph/callout の場合は任意）"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "文字色（16 進数 RGB、例: 2563EB。type=paragraph/callout/quote の場合は任意）"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "文字の配置: left/center/right/justify（type=paragraph の場合は任意）"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "段落の背景色（16 進数 RGB、例: EFF6FF。type=paragraph の場合は任意）"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "コールアウトの種類（type=callout）: info（青）/ success（緑）/ warning（黄）/ danger（赤）。既定は info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI の値（type=kpi の場合は必須）。例: 17.68M"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI の説明（type=kpi の場合は任意）。例: 前月比成長"
"KPI trend (optional when type=kpi): up / down / flat": "KPI のトレンド（type=kpi の場合は任意）: up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "引用元（type=quote の場合は任意）。例: 2026 年度報告書"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "コードの言語（type=code の場合は任意）。例: sql/python/javascript。シンタックスハイライトの配色を選択します"
"Worksheet name, e.g. Q2 Data": "ワークシート名。例: Q2 データ"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "列見出しの配列。例: [\"日付\",\"売上\",\"前月比\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "データ行（2 次元配列）。各行はセル値の配列（例: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]）"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "ヘッダーのスタイル（任意）: headerBgColor（ヘッダー背景色）、headerFontColor（ヘッダー文字色）、stripeColor（縞模様の色）"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "列幅の配列（任意）。例: [12, 20, 15]。値はおおよその文字幅です"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "数値書式（任意）。例: \"#,##0.00\" や \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "条件付き書式の配列（任意）。各項目のフィールド: range（例: \"C2:C10\"）、type（dataBar/colorScale/greaterThan/lessThan など）、color（主色）、value（しきい値）"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "グラフ定義の配列（任意）: type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "固定する先頭行数（0 = なし、1 = 先頭行を固定、既定 1）"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "オートフィルターの範囲（例: \"A1:E1\"）。空の場合は無効"
"Dropdown validation array (optional)": "ドロップダウン検証の配列（任意）"
"Applied range (e.g. \"C2:C10\")": "適用範囲（例: \"C2:C10\"）"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "条件タイプ: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "色（16 進数 RGB、例: 2563EB）。データバー、カラースケール、強調表示に使用"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "しきい値または数式（例: 1000 または =AVERAGE(C2:C10)）"
"Chart type: bar / line / pie": "グラフの種類: bar / line / pie"
"Chart title (optional)": "グラフのタイトル（任意）"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "分類軸ラベルの配列。例: [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "データ系列の配列。各項目に name と data を含みます"
"Applied range (e.g. \"A2:A100\")": "適用範囲（例: \"A2:A100\"）"
"Dropdown option array": "ドロップダウンの選択肢の配列"
"Title of this slide": "このスライドのタイトル"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "スライドのレイアウト: title_only（タイトルのみ、表紙用）/ title_content（タイトル+本文、既定）/ two_column（左右 2 段）/ chart_only（全面グラフ）/ blank（白紙）"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "スライドの背景色（16 進数 RGB、例: \"1F497D\"）。省略時はテーマの背景を使用"
"Slide element list; each element describes a text block, table, chart, or image": "スライドの要素リスト。各要素はテキスト、表、グラフ、画像のいずれかを表します"
"Footer text displayed at the bottom of the slide; null hides it": "スライド下部に表示するフッターテキスト。null の場合は非表示"
"Whether to show the slide number in the bottom-right corner; default false": "右下にスライド番号を表示するか。既定は false"
"Speaker notes used as a reminder while presenting": "発表時に参照するスピーカーノート"
"Transition animation: fade / push / wipe / zoom / split / cut": "切り替えアニメーション: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "要素タイプ: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "セマンティックロール（text 要素のみ）: title / subtitle / body / caption / kpi。レイアウトエンジンがこれに基づいて自動配置するため、座標指定は不要です"
"Text content (required when type=text)": "テキスト内容（type=text の場合は必須）"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "フォントサイズ（ポイント、任意）。省略時はレイアウトエンジンが role に応じて決定します（title≈28、kpi≈44、body≈16）"
"Whether the text is bold; default false": "テキストを太字にするか。既定は false"
"Whether the text is italic (optional for type=text); default false": "テキストを斜体にするか（type=text の場合は任意）。既定は false"
"Whether the text is underlined (optional for type=text); default false": "テキストに下線を引くか（type=text の場合は任意）。既定は false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "文字色（16 進数 RGB、例: \"FFFFFF\"）。省略時はテーマの文字色を継承"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "表のヘッダー配列（type=table の場合は必須）。例: [\"指標\",\"Q1\",\"Q2\",\"前月比\"]"
"Chart type (required when type=chart): bar / line / pie": "グラフの種類（type=chart の場合は必須）: bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "グラフの分類ラベル（type=chart の場合は必須）。例: [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "データ系列（type=chart の場合は必須）。各項目に name（系列名）と data（数値配列）を含みます"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "文字の配置（text 要素）: l（左）/ ctr（中央）/ r（右）"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "テキストボックスの背景色（text 要素、16 進数 RGB、例: \"EFF6FF\"）。空の場合は透明"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "リッチテキストの断片（text 要素）。指定時は Content/FontSize/Bold/Color を無視します"
"Shape configuration (required when type=shape)": "図形の設定（type=shape の場合は必須）"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "表のスタイル（type=table の場合は任意）: headerBgColor（ヘッダー背景色）、headerFontColor（ヘッダー文字色）、stripeColor（縞模様の色）"
"Text content": "テキスト内容"
"Font size in points; 0 inherits the text box default": "フォントサイズ（ポイント）。0 はテキストボックスの既定値を継承"
"Whether the text is bold": "テキストを太字にするか"
"Whether the text is italic": "テキストを斜体にするか"
"Whether the text is underlined": "テキストに下線を引くか"
"Text color, hex RGB such as \"FF6B6B\"": "文字色（16 進数 RGB、例: \"FF6B6B\"）"
"Hyperlink URL; the run becomes clickable when set": "ハイパーリンク URL。設定するとこの断片がクリック可能になります"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "図形の種類: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "塗りつぶし色（16 進数 RGB、例: 2563EB）。null は塗りつぶしなし"
"Border color (hex RGB); null means no border": "枠線色（16 進数 RGB）。null は枠線なし"
"Text displayed inside the shape (optional)": "図形内に表示するテキスト（任意）"
"Text color inside the shape (hex RGB)": "図形内の文字色（16 進数 RGB）"
"Font size of the text inside the shape (points); 0 means default": "図形内の文字サイズ（ポイント）。0 は既定値"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "ヘッダー行の背景色（16 進数 RGB、例: 2563EB）。省略時は特別なスタイルを適用しません"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "ヘッダー行の文字色（16 進数 RGB、例: FFFFFF）。省略時は既定値を継承"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "縞模様の色（偶数データ行の背景色、例: EFF6FF 淡い青）。省略時は縞模様を描画しません"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "列の一意 ID（必須）。例: \"todo\"、\"doing\"、\"done\""
"Column title (required, up to 20 characters)": "列のタイトル（必須、20 文字以内）"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "列タイトルの色（任意）、16 進数、例: \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "WIP 上限（任意）。超過すると列タイトルが赤くなります"
"Card array (required)": "カード配列（必須）"
"Unique card ID (required)": "カードの一意 ID（必須）"
"Card title (required, up to 40 characters)": "カードのタイトル（必須、40 文字以内）"
"Supplementary description (optional, up to 100 characters)": "補足説明（任意、100 文字以内）"
"Priority (optional): high | medium | low": "優先度（任意）: high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "タグ文字列の配列（任意）。例: [\"設計\",\"フロントエンド\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "期限（任意）、ISO 8601（例: \"2026-07-15\"）"
"Assignee name (optional)": "担当者名（任意）"
"Subtask checklist (optional); each item has title and done": "サブタスクのチェックリスト（任意）。各項目に title と done を含みます"
"Completion progress (optional), 0-100": "完了進捗（任意）、0〜100"
"Related link URL (optional)": "関連リンクの URL（任意）"
"Subtask title": "サブタスクのタイトル"
"Whether the subtask is done": "サブタスクが完了しているか"
"Unique swimlane ID (required)": "スイムレーンの一意 ID（必須）"
"Swimlane title (required)": "スイムレーンのタイトル（必須）"
"Column ID array contained in this swimlane (required)": "このスイムレーンに含まれる列 ID の配列（必須）"
"City or place name (required), e.g. Beijing": "都市または地点名（必須）。例: 北京"
"Latitude (required), WGS84 decimal degrees": "緯度（必須）、WGS84 十進度"
"Longitude (required), WGS84 decimal degrees": "経度（必須）、WGS84 十進度"
"Marker label text (optional); supports \\n line breaks": "マーカーのラベルテキスト（任意）。\\\\n で改行できます"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "マーカーの色（任意）、16 進数、例: \"#E74C3C\"。省略時は配色に沿って順に色が付きます"
"Marker size (optional); default 7": "マーカーのサイズ（任意）。既定は 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "省名（必須）。中国語の省名（正式名または略称）を受け付けます。例: 広東省"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "強調表示の色（任意）、16 進数、例: \"#FFB347\"。既定はパレットの色"
"Highlight label (optional), e.g. No.1 GDP": "強調表示のラベル（任意）。例: GDP 1 位"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "イベントの日付（必須）。形式は自由（例: \"2024-01\"、\"2024 Q3\"、\"第 1 フェーズ\"）"
"Event title (required, up to 30 characters)": "イベントのタイトル（必須、30 文字以内）"
"Supplementary description (optional, up to 80 characters)": "補足説明（任意、80 文字以内）"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "16 進数の色（任意）。例: \"#5470c6\"。省略時は配色を自動でローテーション"
"Event category label (optional), e.g. Milestone, Release, Issue": "イベントのカテゴリラベル（任意）。例: マイルストーン、リリース、課題"
