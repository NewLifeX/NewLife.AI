"Card array (required)": "Tablica kart (wymagana)"
"Unique card ID (required)": "Unikalny identyfikator karty (wymagany)"
"Card title (required, up to 40 characters)": "Tytuł karty (wymagany, maksymalnie 40 znaków)"
"Supplementary description (optional, up to 100 characters)": "Opis uzupełniający (opcjonalnie, maksymalnie 100 znaków)"
"Priority (optional): high | medium | low": "Priorytet (opcjonalnie): high | medium | low"
