"Column title (required, up to 20 characters)": "Tytuł kolumny (wymagany, maksymalnie 20 znaków)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "Kolor tytułu kolumny (opcjonalnie), szesnastkowo, na przykład \"#3b82f6\""
