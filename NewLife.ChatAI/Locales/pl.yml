"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "Kolor znacznika (opcjonalnie), szesnastkowo np. \"#E74C3C\"; jeśli pominięty, kolory rotują zgodnie ze schematem"
"Marker size (optional); default 7": "Rozmiar znacznika (opcjonalnie); domyślnie 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "Nazwa prowincji (wymagana); przyjmuje chińską nazwę prowincji (pełną lub skróconą), na przykład Guangdong"
