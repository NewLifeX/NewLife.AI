"Completion progress (optional), 0-100": "Postęp ukończenia (opcjonalnie), 0-100"
"Related link URL (optional)": "URL powiązanego linku (opcjonalnie)"
"Subtask title": "Tytuł podzadania"
"Whether the subtask is done": "Czy podzadanie jest ukończone"
"Unique swimlane ID (required)": "Unikalny identyfikator toru (wymagany)"
