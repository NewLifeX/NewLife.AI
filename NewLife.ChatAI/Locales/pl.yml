"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Generuje dokument Word (.docx) i zwraca link do pobrania. Obsługuje nagłówki, akapity, listy, tabele, obrazy, podziały stron, separatory, ramki wyróżniające, KPI, cytaty i bloki kodu. Tablica JSON sections opisuje każdą sekcję polami heading, content i elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Tytuł dokumentu (maksymalnie 30 znaków), na przykład Raport kwartalny Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Tablica sekcji (JSON). Pola każdej sekcji: heading (tytuł sekcji), headingLevel (1-3, domyślnie 1), content (akapit, opcjonalnie), elements (tablica elementów, opcjonalnie). Typy elementów: paragraph ({type,text, opcjonalnie bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, opcjonalnie tableStyle}; rows to tablica dwuwymiarowa, każdy wiersz to tablica wartości komórek, na przykład [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Motyw (opcjonalnie): klucz stylu karty (na przykład enterprise-blue) lub nazwa wbudowana (blue/dark/corporate/warm/green/minimal); jeśli pominięty, używany jest styl rozmowy lub domyślny marki"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Generuje skoroszyt Excel (.xlsx) i zwraca link do pobrania. Obsługuje wiele arkuszy, style nagłówków, szerokości kolumn, formaty liczb, formatowanie warunkowe, zablokowane okienka, autofiltry i listy rozwijane. Parametr theme przyjmuje klucz stylu karty lub nazwę wbudowaną (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Tytuł skoroszytu (maksymalnie 30 znaków), na przykład Raport przychodów Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Tablica arkuszy (JSON). Pola każdego arkusza: name, headers (tablica nagłówków), rows (tablica dwuwymiarowa; każdy wiersz to tablica wartości komórek, na przykład [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (na przykład [12,20,15]), numberFormat (na przykład \"#,##0.00\" lub \"yyyy-MM-dd\"), conditionalFormats (tablica {range,type,color,value?}; type obsługuje dataBar/colorScale/greaterThan itd.), charts (tablica wykresów), freezeRows (liczba zablokowanych wierszy), autoFilter (zakres filtra), dropdowns (lista rozwijana)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Motyw (opcjonalnie): klucz stylu karty (na przykład enterprise-blue) lub nazwa wbudowana (blue/dark/corporate/warm/green/minimal) określająca nagłówek i kolory ogólne; jeśli pominięty, używany jest styl rozmowy lub domyślny marki"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Generuje prezentację PowerPoint (.pptx) i zwraca link do pobrania. Dwa wykluczające się tryby wejścia: (1) tryb slides, w którym AI opisuje ustrukturyzowaną treść, a układ jest generowany automatycznie; (2) tryb widgetSrc, który osadza wcześniej wygenerowane karty show_widget jako obrazy slajdów. Parametr theme przyjmuje klucz stylu karty (na przykład enterprise-blue/raycast-dark/ppt-executive) lub nazwę wbudowaną (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Tytuł prezentacji (maksymalnie 30 znaków), na przykład Przegląd kwartalny Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Tablica slajdów (JSON). Jeden element = jeden slajd; kilka = pełna prezentacja. Wyklucza się z widgetSrc. Pola każdego slajdu: title, layout (title_only/title_content/two_column/chart_only/blank), background (kolor szesnastkowy), footer, showPageNumber (true/false), elements (lista elementów), notes, transition. elements obsługuje: text (role=title/subtitle/body/kpi/caption; opcjonalnie bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows to tablica dwuwymiarowa, każdy wiersz to tablica wartości komórek, na przykład [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; opcjonalnie tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Przykład: [{\"title\":\"Okładka\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Przegląd Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Zespół NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Lista identyfikatorów kart show_widget oddzielonych przecinkami, na przykład 'call_abc123,call_def456'. Wyklucza się z slides. Zamienia wygenerowane karty na obrazy slajdów"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Motyw (opcjonalnie): klucz stylu karty (na przykład enterprise-blue/ppt-executive) lub nazwa wbudowana (blue/dark/corporate/warm/green/minimal itd.); jeśli pominięty, używany jest styl rozmowy lub domyślny marki"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Wyświetla dane jako interaktywny wykres (powiększanie, najechanie, eksport do obrazu). Około 20 razy szybciej niż show_widget: wystarczy specyfikacja JSON (około 200 tokenów), a frontend od razu renderuje ją przez ECharts. Obsługuje: bar, line (linia/obszar), pie (koło/pierścień), scatter, radar, map_china (mapa cieplna prowincji Chin), heatmap (mapa cieplna macierzy), gauge, funnel i treemap. Przydatne do porównań liczb, szeregów czasowych (linia), analizy udziałów i rozkładu geograficznego. Uwaga: dla tras, wydarzeń historycznych, kamieni milowych i osi czasu użyj show_timeline; to narzędzie nie obsługuje typu timeline. Styl wizualny: przekazuj schemat kolorów przez data.colors zamiast polegać na wartościach domyślnych ECharts. Sugestie: kolor marki dla jednej serii, równomiernie rozłożone odcienie (10-12 kolorów) dla wielu serii, kolory dopełniające dla porównań i gradient jednokolorowy dla trendów. Niebieski i złoty dla finansów, niebieski/zielony/biały dla zdrowia, fioletowy/niebieski/cyjan dla technologii i AI. Przy dużych zbiorach danych ustaw data.animation=false, aby zmniejszyć koszt renderowania."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Typ wykresu: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Tytuł wykresu (maksymalnie 30 znaków), na przykład PKB według prowincji 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Obiekt JSON; struktura jest opisana w opisie narzędzia. Przykład bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Przychody\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; przykład radar z wieloma seriami: {\"indicators\":[{\"name\":\"Szybkość\",\"max\":100},{\"name\":\"Siła\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; wymóg radar: liczba indicators musi być równa długości każdego series[i].data, a data może zawierać wyłącznie liczby"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Zwraca dane zalogowanego użytkownika, w tym nazwę użytkownika, nazwę wyświetlaną, e-mail, telefon, kod, role, dział, płeć, wiek, datę urodzenia i uwagi, a także adres IP odwiedzającego, miasto i szczegółową lokalizację"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Wyszukuje schematy tabel bazy danych według słowa kluczowego. Wynik składa się z dwóch części: (1) mapowanie tabela-połączenie (tabela Markdown wskazująca, do którego połączenia należy każda tabela; tabele o tej samej nazwie w różnych połączeniach są wymieniane osobno); (2) schemat XML tabel dla każdego połączenia. Kolejne wywołania run_sql muszą używać nazwy połączenia z tabeli mapowania"
"Search keywords, separated by commas or spaces": "Słowa kluczowe wyszukiwania, oddzielone przecinkami lub spacjami"
"Restrict to a connection name; empty searches all connections": "Ogranicz do nazwy połączenia; puste przeszukuje wszystkie połączenia"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Wykonuje instrukcję SQL na wskazanym połączeniu z bazą danych. Zapytania SELECT/WITH zwracają wiersze; instrukcje niebędące zapytaniami, takie jak INSERT/UPDATE/DELETE, zwracają liczbę zmodyfikowanych wierszy. connName musi odpowiadać kolumnie połączenia zwracanej przez search_table"
"Database connection name (from the connection column of search_table)": "Nazwa połączenia z bazą danych (z kolumny połączenia search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Instrukcja SQL. SELECT/WITH zwraca zbiór wyników; instrukcje niebędące zapytaniami zwracają liczbę zmodyfikowanych wierszy"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Sprawdza datę kalendarza księżycowego, termin słoneczny i status dnia pracy (dzień roboczy/święto/dzień odrobienia) dla danej daty"
"Date to query in yyyy-MM-dd format. Defaults to today": "Data do sprawdzenia w formacie yyyy-MM-dd. Domyślnie dzisiaj"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Wyświetla listę zadań jako wielokolumnową tablicę kanban (na przykład Do zrobienia -> W toku -> Gotowe). Odpowiednie do dekompozycji projektu, planowania sprintu, prezentacji przepływu pracy i klasyfikacji stanów zadań. Każda kolumna może mieć znacznik koloru i limit WIP; każda karta może zawierać tytuł, opis, priorytet, etykiety, termin, osobę odpowiedzialną, listę kontrolną, postęp i link. Dwa układy: board (domyślna tablica wielokolumnowa) i swimlane (kolumny pogrupowane według zespołu lub modułu)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Tytuł tablicy (maksymalnie 30 znaków), na przykład Tablica Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Tablica JSON z definicjami kolumn. Przykład: [{\"id\":\"todo\",\"title\":\"Do zrobienia\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Analiza wymagań\",\"description\":\"Zebrać wymagania użytkowników\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Wywiady z użytkownikami\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Wszystkie pola poza id i title są opcjonalne"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Tryb układu: board (domyślna tablica wielokolumnowa) lub swimlane (kolumny pogrupowane według zespołu lub modułu; wymagany parametr swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Tablica JSON z definicjami torów (używana przy layout=swimlane). Przykład: [{\"id\":\"sl1\",\"title\":\"Zespół frontend\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Zespół backend\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Oznacza punkty współrzędnych (miasta lub POI) albo wyróżnia prowincje na mapie Chin, generuje opisaną mapę SVG i wyświetla ją w bańce czatu. Obsługuje: (1) wypełnienie prowincji własnymi kolorami; (2) znaczniki WGS84 szerokości i długości geograficznej z tekstem etykiety; (3) automatyczną legendę w prawym dolnym rogu. Typowe zastosowania: rozkład danych według prowincji, położenie miast i mapy cieplne sprzedaży regionalnej."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Tytuł mapy (maksymalnie 30 znaków), na przykład PKB według prowincji 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Tablica JSON ze znacznikami (może być pusta tablica []). Format: [{\"name\":\"Pekin\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Pekin\\n4376 mld\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng to stopnie dziesiętne WGS84; color/size są opcjonalne"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Tablica JSON z wyróżnieniami prowincji (może być pusta tablica []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"Nr 1 PKB\"}]. name przyjmuje chińską nazwę prowincji (pełną lub skróconą); label jest opcjonalny"
"Legend title (optional), e.g. GDP scale": "Tytuł legendy (opcjonalnie), na przykład Skala PKB"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Schemat kolorów (opcjonalnie): blue/orange/green/purple/red; domyślnie blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Styl znacznika (opcjonalnie): circle/pin/square; domyślnie circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Wyświetla hierarchie wiedzy lub relacje pojęć jako składaną interaktywną mapę myśli. Dane wejściowe to konspekt Markdown (# / ## / ###), który frontend zamienia na drzewo wizualne. Przydatne do porządkowania wiedzy, rozkładania pojęć, porównywania technologii, oceny opcji i podsumowywania treści. Styl wizualny: wybierz branchColors (3-8 spójnych kolorów), maxDepth (złożoność) i collapsed (początkowe zwinięcie dla skupienia) zależnie od tematu. Zimne kolory (niebieski/fioletowy/cyjan) dla technologii i danych, ciepłe (pomarańczowy/złoty/czerwony) dla biznesu i marketingu, zielenie dla natury i zdrowia. Przy gęstych węzłach ustaw maxDepth=2 dla czytelności. 6 układów: tree (domyślne drzewo z wcięciami, uniwersalne) / radial (promieniowe lewo-prawo, najlepsze dla map wiedzy) / lr (od środka w prawo, schematy blokowe/drzewa decyzyjne) / rl (od środka w lewo, śledzenie wsteczne) / tb (od środka w dół, schematy organizacyjne) / bt (od środka w górę, hierarchia oddolna)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Tytuł mapy myśli (maksymalnie 30 znaków), na przykład Stos technologiczny AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Konspekt Markdown z # / ## / ### dla poziomów 1-3. Przykład:\n# Sztuczna inteligencja\n## Uczenie maszynowe\n### Uczenie nadzorowane\n### Uczenie nienadzorowane\n## Uczenie głębokie\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Tryb układu: tree (domyślne drzewo z wcięciami, uniwersalne) / radial (promieniowe lewo-prawo, najlepsze dla map wiedzy) / lr (od środka w prawo, schematy blokowe/drzewa decyzyjne) / rl (od środka w lewo, śledzenie wsteczne) / tb (od środka w dół, schematy organizacyjne) / bt (od środka w górę, hierarchia oddolna)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Tablica JSON z kolorami gałęzi, na przykład [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Od 3 do 8 kolorów szesnastkowych przypisywanych po kolei gałęziom pierwszego poziomu. Jeśli pominięto, używana jest domyślna paleta niebieski/fioletowy, zielony, żółty, czerwony, błękitny, ciemnozielony, pomarańczowy, fioletowy"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Tablica JSON z identyfikatorami początkowo zwiniętych węzłów, na przykład [\"n2\",\"n5\"]. Pusta rozwija wszystko. Służy do skupienia się na kluczowych gałęziach"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Maksymalna widoczna głębokość: 1 = tylko gałęzie pierwszego poziomu, 2 = dwa poziomy, domyślnie bez limitu. Przy gęstych węzłach ustaw 2 dla czytelności"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Wyświetla dane szeregów czasowych jako staranne karty osi czasu. Wystarczy JSON (około 100 tokenów), a frontend renderuje je natychmiast. Przydatne do kamieni milowych projektu, wydarzeń historycznych, planów wydania i historii rozwoju. Każde wydarzenie może mieć datę, tytuł, opis, kolor i kategorię. Styl wizualny: ustaw globalną paletę przez parametr palette (na przykład gradient niebiesko-fioletowy, ciepły brąz, kolory marki), aby oś czasu miała spójny nastrój; item.color zastępuje pojedynczy element. Użyj density=relaxed dla 5 lub mniej wybranych wydarzeń i density=compact dla 10 lub więcej. 8 układów: vertical (5-20 elementów) / alternating-top (naprzemiennie nad, odwrotna kolejność) / alternating-bottom (naprzemiennie pod, chronologicznie) / horizontal-left (poziomo w lewo, odwrotna kolejność) / horizontal-right (poziomo w prawo, chronologicznie) / s-curve (ścieżka w kształcie S, 8 elementów lub mniej) / fishbone-left (ości ryby w lewo, odwrotna kolejność) / fishbone-right (ości ryby w prawo, chronologicznie)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Tytuł osi czasu (maksymalnie 30 znaków), na przykład Kamienie milowe produktu"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Tablica JSON wydarzeń osi czasu. Przykład: [{\"date\":\"2024-01\",\"title\":\"Wydanie v1.0\",\"description\":\"Główne funkcje online\",\"color\":\"#5470c6\",\"category\":\"Kamień milowy\"}]. description/color/category są opcjonalne"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Tryb układu: vertical / alternating-top (naprzemiennie nad, odwrotna kolejność) / alternating-bottom (naprzemiennie pod, chronologicznie) / horizontal-left (poziomo, odwrotna kolejność) / horizontal-right (poziomo, chronologicznie) / s-curve / fishbone-left (ości ryby, odwrotna kolejność) / fishbone-right (ości ryby, chronologicznie)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Tablica JSON globalnej palety, na przykład [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Zastępuje domyślną rotację 8 kolorów. item.color ma pierwszeństwo"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Odstęp elementów: compact (12px) / normal (20px, domyślnie) / relaxed (32px). relaxed pasuje do 5 lub mniej wybranych wydarzeń; compact do 10 lub więcej"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Wyświetla fragment SVG lub HTML w bańce czatu. Używaj do osi czasu i diagramów relacji (SVG), podglądów formularzy i kart danych (HTML) oraz wykresów statystycznych (SVG). Nie używaj do diagramów Mermaid; Mermaid podawaj jako blok kodu ```mermaid w odpowiedzi. Limity: maksymalnie 200 KB; <script src=...> tylko z zaufanych CDN. Styl wizualny: wybierz architekturę informacji (Bento/przepływ kart/Grid), hierarchię typograficzną i system kolorów zależnie od tematu. Zimne tony bezszeryfowe do dyskusji technicznych, neutralne kolory z wyróżnionymi liczbami do raportów biznesowych oraz gradienty/glassmorphism/mikroanimacje do pracy twórczej. Zawsze ustawiaj font-family i color jawnie; nie polegaj na domyślnych stylach przeglądarki."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Tytuł widżetu (maksymalnie 30 znaków), na przykład Przebieg statusu zamówienia"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG musi zaczynać się od <svg; fragmenty HTML muszą zaczynać się od elementu głównego i nie mogą zawierać <html><body>. Maksymalnie 200 KB; <script src=...> tylko z zaufanych CDN. Nie przekazuj składni Mermaid (flowchart/graph/sequenceDiagram itd.); Mermaid podawaj jako blok kodu ```mermaid w odpowiedzi"
"Placeholder text shown while loading (optional)": "Tekst zastępczy wyświetlany podczas ładowania (opcjonalnie)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Wskazówka motywu: light / dark / auto (zgodnie z systemem). Wygenerowany HTML powinien dobrać kolory tła i tekstu odpowiednio; nie jest przekazywany do renderera frontendu"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Początkowa wysokość widżetu w px (80-1200). Domyślnie 480. Użyj 300-400 dla kompaktowych kart i 600-800 dla dużych wykresów"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Tryb tła: solid (domyślnie) / transparent (do nakładania zrzutów ekranu na szablon PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Tryb slajdu PPT. Gdy true, karta jest renderowana w proporcji 16:9, gotowa do wklejenia w prezentacji. Domyślnie false, co zachowuje szerokość dopasowaną do treści"
"Section heading text, e.g. Completed this week": "Tekst nagłówka sekcji, na przykład Ukończone w tym tygodniu"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Poziom nagłówka: 1 = poziom 1 (największy), 2 = poziom 2, 3 = poziom 3; domyślnie 1"
"Body paragraph text (optional; used together with elements)": "Tekst akapitu (opcjonalnie; używany razem z elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Tablica elementów strukturalnych (opcjonalnie): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Typ elementu: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Treść tekstowa (używana przy type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Tablica elementów listy (używana przy type=bullet_list lub ordered_list)"
"Table header row (required when type=table)": "Wiersz nagłówka tabeli (wymagany przy type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Wiersze danych tabeli (wymagane przy type=table); każdy wiersz to tablica wartości komórek, na przykład [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Styl tabeli (opcjonalnie przy type=table): headerBgColor (tło nagłówka), headerFontColor (kolor tekstu nagłówka), stripeColor (wiersze naprzemienne)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL obrazu (wymagany przy type=image); obsługuje zewnętrzne linki https:// lub załączniki wewnętrzne, na przykład /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Szerokość obrazu w centymetrach (type=image); domyślnie 14 cm"
"Image height in centimeters (type=image); default 10cm": "Wysokość obrazu w centymetrach (type=image); domyślnie 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Czy tekst jest pogrubiony (opcjonalnie przy type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Czy tekst jest pochylony (opcjonalnie przy type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Czy tekst jest podkreślony (opcjonalnie przy type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Rozmiar czcionki w punktach, na przykład 12 (opcjonalnie przy type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Kolor tekstu (RGB szesnastkowo, na przykład 2563EB; opcjonalnie przy type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Wyrównanie tekstu: left/center/right/justify (opcjonalnie przy type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Kolor tła akapitu (RGB szesnastkowo, na przykład EFF6FF; opcjonalnie przy type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Wariant ramki wyróżniającej (type=callout): info (niebieski) / success (zielony) / warning (żółty) / danger (czerwony); domyślnie info"
"KPI value (required when type=kpi), e.g. 17.68M": "Wartość KPI (wymagana przy type=kpi), na przykład 17,68 mln"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Etykieta KPI (opcjonalna przy type=kpi), na przykład wzrost względem poprzedniego miesiąca"
"KPI trend (optional when type=kpi): up / down / flat": "Trend KPI (opcjonalny przy type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Źródło cytatu (opcjonalne przy type=quote), na przykład Raport roczny 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Język kodu (opcjonalny przy type=code), na przykład sql/python/javascript; wybiera kolory podświetlania składni"
"Worksheet name, e.g. Q2 Data": "Nazwa arkusza, na przykład Dane Q2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Tablica nagłówków kolumn, na przykład [\"Data\",\"Przychody\",\"Zmiana\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Wiersze danych (tablica dwuwymiarowa); każdy wiersz to tablica wartości komórek, na przykład [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Styl nagłówka (opcjonalnie): headerBgColor (tło nagłówka), headerFontColor (kolor tekstu nagłówka), stripeColor (wiersze naprzemienne)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Tablica szerokości kolumn (opcjonalnie), na przykład [12, 20, 15]; wartości to przybliżone szerokości w znakach"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Format liczbowy (opcjonalnie), na przykład \"#,##0.00\" lub \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Tablica formatowań warunkowych (opcjonalnie). Pola każdego elementu: range (na przykład \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan itd.), color (kolor główny), value (próg)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Tablica definicji wykresów (opcjonalnie): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Liczba zablokowanych górnych wierszy (0 = brak, 1 = zablokuj pierwszy wiersz; domyślnie 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Zakres autofiltra (na przykład \"A1:E1\"); pusty wyłącza filtr"
"Dropdown validation array (optional)": "Tablica list rozwijanych (opcjonalnie)"
"Applied range (e.g. \"C2:C10\")": "Zastosowany zakres (na przykład \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Typ warunku: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Kolor (RGB szesnastkowo, na przykład 2563EB) używany do pasków danych, skal kolorów lub wyróżnień"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Próg lub formuła (na przykład 1000 lub =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Typ wykresu: bar / line / pie"
"Chart title (optional)": "Tytuł wykresu (opcjonalnie)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Tablica etykiet osi kategorii, na przykład [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Tablica serii danych; każdy element ma name i data"
"Applied range (e.g. \"A2:A100\")": "Zastosowany zakres (na przykład \"A2:A100\")"
"Dropdown option array": "Tablica opcji listy rozwijanej"
"Title of this slide": "Tytuł tego slajdu"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Układ slajdu: title_only (tylko tytuł, do okładek) / title_content (tytuł + treść, domyślnie) / two_column (dwie kolumny) / chart_only (wykres na pełną szerokość) / blank (puste płótno)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Kolor tła slajdu, RGB szesnastkowo np. \"1F497D\"; jeśli pominięty, używane jest tło motywu"
"Slide element list; each element describes a text block, table, chart, or image": "Lista elementów slajdu; każdy element opisuje blok tekstu, tabelę, wykres lub obraz"
"Footer text displayed at the bottom of the slide; null hides it": "Tekst stopki u dołu slajdu; null go ukrywa"
"Whether to show the slide number in the bottom-right corner; default false": "Czy pokazywać numer slajdu w prawym dolnym rogu; domyślnie false"
"Speaker notes used as a reminder while presenting": "Notatki prelegenta używane jako przypomnienie podczas prezentacji"
"Transition animation: fade / push / wipe / zoom / split / cut": "Animacja przejścia: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Typ elementu: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Rola semantyczna (tylko elementy text): title / subtitle / body / caption / kpi. Silnik układu używa jej do automatycznego pozycjonowania, współrzędne nie są potrzebne"
"Text content (required when type=text)": "Treść tekstowa (wymagana przy type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Rozmiar czcionki w punktach (opcjonalnie); jeśli pominięty, silnik układu wybiera go według role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Czy tekst jest pogrubiony; domyślnie false"
"Whether the text is italic (optional for type=text); default false": "Czy tekst jest pochylony (opcjonalnie przy type=text); domyślnie false"
"Whether the text is underlined (optional for type=text); default false": "Czy tekst jest podkreślony (opcjonalnie przy type=text); domyślnie false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Kolor tekstu, RGB szesnastkowo np. \"FFFFFF\"; jeśli pominięty, dziedziczony jest kolor tekstu motywu"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Tablica nagłówków tabeli (wymagana przy type=table), na przykład [\"Metryka\",\"Q1\",\"Q2\",\"Zmiana\"]"
"Chart type (required when type=chart): bar / line / pie": "Typ wykresu (wymagany przy type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Etykiety kategorii wykresu (wymagane przy type=chart), na przykład [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Serie danych (wymagane przy type=chart); każdy element ma name (nazwa serii) i data (tablica liczb)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Wyrównanie tekstu (elementy text): l (lewo) / ctr (środek) / r (prawo)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Kolor tła pola tekstowego (elementy text), RGB szesnastkowo np. \"EFF6FF\"; przezroczysty, gdy pusty"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Fragmenty tekstu sformatowanego (elementy text); jeśli występują, Content/FontSize/Bold/Color są ignorowane"
"Shape configuration (required when type=shape)": "Konfiguracja kształtu (wymagana przy type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Styl tabeli (opcjonalnie przy type=table): headerBgColor (tło nagłówka), headerFontColor (kolor tekstu nagłówka), stripeColor (wiersze naprzemienne)"
"Text content": "Treść tekstowa"
"Font size in points; 0 inherits the text box default": "Rozmiar czcionki w punktach; 0 dziedziczy domyślną wartość pola tekstowego"
"Whether the text is bold": "Czy tekst jest pogrubiony"
"Whether the text is italic": "Czy tekst jest pochylony"
"Whether the text is underlined": "Czy tekst jest podkreślony"
"Text color, hex RGB such as \"FF6B6B\"": "Kolor tekstu, RGB szesnastkowo np. \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL hiperłącza; po ustawieniu fragment staje się klikalny"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Typ kształtu: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Kolor wypełnienia (RGB szesnastkowo, na przykład 2563EB); null oznacza brak wypełnienia"
"Border color (hex RGB); null means no border": "Kolor obramowania (RGB szesnastkowo); null oznacza brak obramowania"
"Text displayed inside the shape (optional)": "Tekst wyświetlany wewnątrz kształtu (opcjonalnie)"
"Text color inside the shape (hex RGB)": "Kolor tekstu wewnątrz kształtu (RGB szesnastkowo)"
"Font size of the text inside the shape (points); 0 means default": "Rozmiar czcionki tekstu wewnątrz kształtu (punkty); 0 oznacza wartość domyślną"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Kolor tła wiersza nagłówka (RGB szesnastkowo, na przykład 2563EB); jeśli pominięty, nie stosuje się specjalnego stylu"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "Kolor tekstu wiersza nagłówka (RGB szesnastkowo, na przykład FFFFFF); jeśli pominięty, dziedziczona jest wartość domyślna"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "Kolor wierszy naprzemiennych (tło parzystych wierszy danych, na przykład EFF6FF jasnoniebieski); jeśli pominięty, paski nie są rysowane"
