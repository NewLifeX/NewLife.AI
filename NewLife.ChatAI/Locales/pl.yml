"Event title (required, up to 30 characters)": "Tytuł wydarzenia (wymagany, maksymalnie 30 znaków)"
"Supplementary description (optional, up to 80 characters)": "Opis uzupełniający (opcjonalnie, maksymalnie 80 znaków)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "Kolor szesnastkowy (opcjonalnie), na przykład \"#5470c6\"; jeśli pominięty, paleta rotuje automatycznie"
