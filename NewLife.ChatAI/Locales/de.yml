"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Erzeugt ein Word-Dokument (.docx) und liefert einen Download-Link. Unterstützt Überschriften, Absätze, Listen, Tabellen, Bilder, Seitenumbrüche, Trennlinien, Hinweisboxen, KPIs, Zitate und Codeblöcke. Das sections-JSON-Array beschreibt jeden Abschnitt mit heading, content und elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Dokumenttitel (max. 30 Zeichen), z. B. Q2-Quartalsbericht"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Abschnittsarray (JSON). Felder je Abschnitt: heading (Abschnittstitel), headingLevel (1-3, Standard 1), content (Textabsatz, optional), elements (Elementarray, optional). Elementtypen: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows ist ein 2-D-Array, jede Zeile ein Array von Zellwerten, z. B. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Design (optional): Schlüssel eines Kartenstils (z. B. enterprise-blue) oder eingebauter Name (blue/dark/corporate/warm/green/minimal); wenn weggelassen, wird der Gesprächsstil oder Markenstandard verwendet"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Erzeugt eine Excel-Arbeitsmappe (.xlsx) und liefert einen Download-Link. Unterstützt mehrere Arbeitsblätter, Kopfzeilenstile, Spaltenbreiten, Zahlenformate, bedingte Formatierung, fixierte Fenster, Autofilter und Dropdown-Validierung. Der Parameter theme akzeptiert einen Kartenstil-Schlüssel oder einen eingebauten Namen (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Arbeitsmappentitel (max. 30 Zeichen), z. B. Q2-Umsatzbericht"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Arbeitsblattarray (JSON). Felder je Blatt: name, headers (Kopfzeilenarray), rows (2-D-Array; jede Zeile ein Array von Zellwerten, z. B. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (z. B. [12,20,15]), numberFormat (z. B. \"#,##0.00\" oder \"yyyy-MM-dd\"), conditionalFormats (Array aus {range,type,color,value?}; type unterstützt dataBar/colorScale/greaterThan usw.), charts (Diagramm-Array), freezeRows (Anzahl fixierter Zeilen), autoFilter (Filterbereich), dropdowns (Dropdown-Validierung)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Design (optional): Schlüssel eines Kartenstils (z. B. enterprise-blue) oder eingebauter Name (blue/dark/corporate/warm/green/minimal), der Kopfzeile und Gesamtfarben steuert; wenn weggelassen, wird der Gesprächsstil oder Markenstandard verwendet"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Erzeugt eine PowerPoint-Präsentation (.pptx) und liefert einen Download-Link. Zwei sich ausschließende Eingabemodi: (1) slides-Modus, in dem die KI strukturierte Inhalte beschreibt und das Layout automatisch erzeugt wird; (2) widgetSrc-Modus, der zuvor erzeugte show_widget-Karten als Folienbilder einbettet. Der Parameter theme akzeptiert einen Kartenstil-Schlüssel (z. B. enterprise-blue/raycast-dark/ppt-executive) oder einen eingebauten Namen (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Präsentationstitel (max. 30 Zeichen), z. B. Q2-Quartalsrückblick"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Folienarray (JSON). Ein Element = eine Folie, mehrere = vollständiges Deck. Schließt sich mit widgetSrc aus. Felder je Folie: title, layout (title_only/title_content/two_column/chart_only/blank), background (Hex-Farbe), footer, showPageNumber (true/false), elements (Elementliste), notes, transition. elements unterstützt: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows ist ein 2-D-Array, jede Zeile ein Array von Zellwerten, z. B. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Beispiel: [{\"title\":\"Titel\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2-Rückblick\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife-Team\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Kommagetrennte Liste von show_widget-Karten-IDs, z. B. 'call_abc123,call_def456'. Schließt sich mit slides aus. Rendert die erzeugten Karten als Folienbilder"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Design (optional): Schlüssel eines Kartenstils (z. B. enterprise-blue/ppt-executive) oder eingebauter Name (blue/dark/corporate/warm/green/minimal usw.); wenn weggelassen, wird der Gesprächsstil oder Markenstandard verwendet"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Rendert Daten als interaktives Diagramm (Zoomen, Hover, Export als Bild). Rund 20-mal schneller als show_widget: Es genügt eine JSON-Spezifikation (etwa 200 Tokens), und das Frontend rendert sofort mit ECharts. Unterstützt: bar, line (Linie/Fläche), pie (Kreis/Ring), scatter, radar, map_china (Heatmap der chinesischen Provinzen), heatmap (Matrix-Heatmap), gauge, funnel und treemap. Geeignet für Zahlenvergleiche, Zeitreihen (Linie), Anteilsanalysen und geografische Verteilung. Hinweis: Für Reisepläne, historische Ereignisse, Meilensteine und Zeitachsen bitte show_timeline verwenden; dieses Tool unterstützt den Typ timeline nicht. Visueller Stil: Übergeben Sie ein Farbschema über data.colors, statt sich auf ECharts-Standards zu verlassen. Empfehlungen: Markenfarbe für eine einzelne Reihe, gleichmäßig verteilte Farbtöne (10-12 Farben) für mehrere Reihen, Komplementärfarben für Vergleiche, einfarbiger Verlauf für Trends. Blau und Gold für Finanzen, Blau/Grün/Weiß für Gesundheit, Violett/Blau/Cyan für Technik und KI. Bei großen Datenmengen data.animation=false setzen, um die Renderlast zu senken."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Diagrammtyp: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Diagrammtitel (max. 30 Zeichen), z. B. BIP nach Provinz 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON-Objekt; die Struktur steht in der Tool-Beschreibung. bar-Beispiel: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Umsatz\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; radar-Beispiel mit mehreren Reihen: {\"indicators\":[{\"name\":\"Tempo\",\"max\":100},{\"name\":\"Kraft\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar-Anforderung: Die Anzahl der indicators muss der Länge jedes series[i].data entsprechen, und data darf nur Zahlen enthalten"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Liefert Details zum aktuell angemeldeten Benutzer, einschließlich Benutzername, Anzeigename, E-Mail, Mobilfunknummer, Code, Rollen, Abteilung, Geschlecht, Alter, Geburtstag und Bemerkung sowie Besucher-IP, Stadt und ausführlichen Standort"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Durchsucht Datenbankschemata nach Schlüsselwort. Das Ergebnis hat zwei Teile: (1) eine Zuordnung Tabelle-zu-Verbindung (Markdown-Tabelle, die zeigt, zu welcher Verbindung jede Tabelle gehört; gleichnamige Tabellen unter verschiedenen Verbindungen werden getrennt aufgeführt); (2) das Tabellenschema-XML je Verbindung. Spätere run_sql-Aufrufe müssen den Verbindungsnamen aus der Zuordnungstabelle verwenden"
"Search keywords, separated by commas or spaces": "Suchbegriffe, durch Kommas oder Leerzeichen getrennt"
"Restrict to a connection name; empty searches all connections": "Auf einen Verbindungsnamen beschränken; leer durchsucht alle Verbindungen"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Führt eine SQL-Anweisung auf der angegebenen Datenbankverbindung aus. SELECT/WITH liefert Datenzeilen; Nicht-Abfrage-Anweisungen wie INSERT/UPDATE/DELETE liefern die Anzahl betroffener Zeilen. connName muss der von search_table zurückgegebenen Verbindungsspalte entsprechen"
"Database connection name (from the connection column of search_table)": "Datenbankverbindungsname (aus der Verbindungsspalte von search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL-Anweisung. SELECT/WITH liefert ein Resultset; Nicht-Abfrage-Anweisungen liefern die Anzahl betroffener Zeilen"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Ermittelt Mondkalenderdatum, Sonnenbegriff und Arbeitsstatus (Arbeitstag/Feiertag/Nachholtag) eines Datums"
"Date to query in yyyy-MM-dd format. Defaults to today": "Abfragedatum im Format yyyy-MM-dd. Standard ist heute"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Rendert eine Aufgabenliste als mehrspaltiges Kanban-Board (z. B. Zu erledigen -> In Arbeit -> Erledigt). Geeignet für Projektzerlegung, Sprint-Planung, Workflow-Anzeige und Aufgabenzustände. Jede Spalte kann eine Farbmarkierung und ein WIP-Limit haben; jede Karte kann Titel, Beschreibung, Priorität, Tags, Fälligkeitsdatum, Verantwortlichen, Checkliste, Fortschritt und Link enthalten. Zwei Layouts: board (mehrspaltiges Board, Standard) und swimlane (Spalten nach Team oder Modul gruppiert)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Board-Titel (max. 30 Zeichen), z. B. Sprint-1-Board"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "JSON-Array mit Spaltendefinitionen. Beispiel: [{\"id\":\"todo\",\"title\":\"Zu erledigen\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Anforderungsanalyse\",\"description\":\"Nutzeranforderungen sammeln\",\"priority\":\"high\",\"tags\":[\"Design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Nutzer interviewen\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Alle Felder außer id und title sind optional"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Layoutmodus: board (mehrspaltiges Board, Standard) oder swimlane (Spalten nach Team oder Modul gruppiert; der Parameter swimlanes ist erforderlich)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "JSON-Array mit Swimlane-Definitionen (bei layout=swimlane). Beispiel: [{\"id\":\"sl1\",\"title\":\"Frontend-Team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Backend-Team\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Markiert Koordinatenpunkte (Städte oder POIs) oder hebt Provinzflächen auf einer China-Karte hervor, erzeugt eine beschriftete SVG-Karte und rendert sie in der Chatblase. Unterstützt: (1) Provinzfüllungen mit eigenen Farben; (2) Marker mit WGS84-Koordinaten und Beschriftungstext; (3) automatische Legende unten rechts. Typische Verwendung: Datenverteilung nach Provinz, Städtepositionen und regionale Umsatz-Heatmaps."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Kartentitel (max. 30 Zeichen), z. B. BIP nach Provinz 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "JSON-Array mit Markern (kann ein leeres Array [] sein). Format: [{\"name\":\"Peking\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Peking\\n4376 Mrd.\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng sind WGS84-Dezimalgrad; color/size sind optional"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "JSON-Array mit Provinzhervorhebungen (kann ein leeres Array [] sein). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"Nr. 1 BIP\"}]. name akzeptiert den chinesischen Provinznamen (vollständig oder kurz); label ist optional"
"Legend title (optional), e.g. GDP scale": "Legendentitel (optional), z. B. BIP-Größe"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Farbschema (optional): blue/orange/green/purple/red; Standard ist blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Marker-Stil (optional): circle/pin/square; Standard ist circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Rendert Wissenshierarchien oder Konzeptbeziehungen als einklappbare interaktive Mindmap. Die Eingabe ist eine Markdown-Gliederung (# / ## / ###), die das Frontend in einen visuellen Baum umwandelt. Geeignet für Wissensorganisation, Konzeptzerlegung, Technologievergleich, Optionsbewertung und Zusammenfassungen. Visueller Stil: Wählen Sie je nach Thema branchColors (3-8 abgestimmte Farben), maxDepth (Komplexität) und collapsed (anfangs eingeklappt, um zu fokussieren). Kalte Farben (Blau/Violett/Cyan) für Technik und Daten, warme Farben (Orange/Gold/Rot) für Business und Marketing, Grüntöne für Natur und Gesundheit. Bei dichten Knoten maxDepth=2 für Lesbarkeit setzen. 6 Layouts: tree (eingerückter Baum, Standard, universell) / radial (links-rechts-radial, am besten für Wissenskarten) / lr (Mitte nach rechts, Flussdiagramme/Entscheidungsbäume) / rl (Mitte nach links, Rückverfolgung) / tb (Mitte nach unten, Organigramme) / bt (Mitte nach oben, hierarchisch von unten nach oben)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Mindmap-Titel (max. 30 Zeichen), z. B. KI-Technologie-Stack"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown-Gliederung mit # / ## / ### für die Ebenen 1-3. Beispiel:\n# Künstliche Intelligenz\n## Maschinelles Lernen\n### Überwachtes Lernen\n### Unüberwachtes Lernen\n## Deep Learning\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Layoutmodus: tree (eingerückter Baum, Standard, universell) / radial (links-rechts-radial, am besten für Wissenskarten) / lr (Mitte nach rechts, Flussdiagramme/Entscheidungsbäume) / rl (Mitte nach links, Rückverfolgung) / tb (Mitte nach unten, Organigramme) / bt (Mitte nach oben, hierarchisch von unten nach oben)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "JSON-Array mit Zweigfarben, z. B. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 Hex-Farben werden der Reihe nach den Hauptzweigen zugewiesen. Ohne Angabe wird die Standardpalette Blau/Violett, Grün, Gelb, Rot, Himmelblau, Dunkelgrün, Orange, Violett verwendet"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "JSON-Array anfangs eingeklappter Knoten-IDs, z. B. [\"n2\",\"n5\"]. Leer klappt alles auf. Dient dem Fokus auf wichtige Zweige"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Maximal sichtbare Tiefe: 1 = nur Hauptzweige, 2 = zwei Ebenen, standardmäßig unbegrenzt. Bei dichten Knoten 2 für Lesbarkeit setzen"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Rendert Zeitreihendaten als ansprechende Zeitstrahl-Karten. Es genügt JSON (etwa 100 Tokens), und das Frontend rendert sofort. Geeignet für Projektmeilensteine, historische Ereignisse, Release-Pläne und Entwicklungsverlauf. Jedes Ereignis kann Datum, Titel, Beschreibung, Farbe und Kategorie enthalten. Visueller Stil: Legen Sie über den Parameter palette ein globales Farbschema fest (z. B. Blau-Violett-Verlauf, warmes Bronze, Markenfarben), damit der Zeitstrahl eine einheitliche Stimmung hat; item.color überschreibt einzelne Einträge. density=relaxed eignet sich für bis zu 5 ausgewählte Ereignisse, density=compact für 10+ dichte Zeitstrahlen. 8 Layouts: vertical (5-20 Einträge) / alternating-top (abwechselnd oben, neueste zuerst) / alternating-bottom (abwechselnd unten, chronologisch) / horizontal-left (waagerecht, neueste zuerst) / horizontal-right (waagerecht, chronologisch) / s-curve (S-förmiger Pfad, bis 8 Einträge) / fishbone-left (Fischgräte links, neueste zuerst) / fishbone-right (Fischgräte rechts, chronologisch)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Zeitstrahl-Titel (max. 30 Zeichen), z. B. Produktmeilensteine"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "JSON-Array mit Zeitstrahl-Ereignissen. Beispiel: [{\"date\":\"2024-01\",\"title\":\"v1.0 veröffentlicht\",\"description\":\"Kernfunktionen online\",\"color\":\"#5470c6\",\"category\":\"Meilenstein\"}]. description/color/category sind optional"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Layoutmodus: vertical / alternating-top (abwechselnd oben, neueste zuerst) / alternating-bottom (abwechselnd unten, chronologisch) / horizontal-left (waagerecht, neueste zuerst) / horizontal-right (waagerecht, chronologisch) / s-curve / fishbone-left (Fischgräte, neueste zuerst) / fishbone-right (Fischgräte, chronologisch)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "JSON-Array mit globalem Farbschema, z. B. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Überschreibt die standardmäßige 8-Farben-Rotation. item.color hat Vorrang"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Abstand der Einträge: compact (12px) / normal (20px, Standard) / relaxed (32px). relaxed eignet sich für bis zu 5 ausgewählte Ereignisse; compact für 10+"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Rendert ein SVG- oder HTML-Fragment in der Chatblase. Verwenden Sie es für Zeitstrahlen und Beziehungsdiagramme (SVG), Formularvorschauen und Datenkarten (HTML) sowie statistische Diagramme (SVG). Nicht für Mermaid-Diagramme verwenden; geben Sie Mermaid als ```mermaid-Codeblock in der Antwort aus. Grenzen: höchstens 200 KB; <script src=...> nur von vertrauenswürdigen CDNs. Visueller Stil: Wählen Sie je nach Thema die Informationsarchitektur (Bento/Kartenfluss/Grid), Typografie und das Farbsystem. Kalte serifenlose Töne für technische Diskussionen, neutrale Farben mit hervorgehobenen Zahlen für Geschäftsberichte, Verläufe/Glaseffekte/Mikroanimationen für Kreatives. Setzen Sie font-family und color immer explizit; verlassen Sie sich nicht auf Browserstandards."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widget-Titel (max. 30 Zeichen), z. B. Bestellstatus-Ablauf"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG muss mit <svg beginnen; HTML-Fragmente müssen mit dem Wurzelelement beginnen und dürfen <html><body> nicht enthalten. Maximal 200 KB; <script src=...> nur von vertrauenswürdigen CDNs. Übergeben Sie keine Mermaid-Syntax (flowchart/graph/sequenceDiagram usw.); geben Sie Mermaid als ```mermaid-Codeblock in der Antwort aus"
