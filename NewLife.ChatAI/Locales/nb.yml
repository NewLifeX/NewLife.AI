"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Oppretter et Word-dokument (.docx) og returnerer en nedlastingslenke. Støtter overskrifter, avsnitt, lister, tabeller, bilder, sideskift, skillelinjer, fremhevede felt, KPI-er, sitater og kodeblokker. JSON-arrayen sections beskriver hver seksjon med heading, content og elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Dokumenttittel (høyst 30 tegn), for eksempel Kvartalsrapport Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Array med seksjoner (JSON). Felt per seksjon: heading (seksjonsoverskrift), headingLevel (1-3, standard 1), content (brødtekstavsnitt, valgfritt), elements (elementarray, valgfritt). Elementtyper: paragraph ({type,text, valgfritt bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, valgfritt tableStyle}; rows er en todimensjonal array der hver rad er en array av celleverdier, for eksempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (valgfritt): nøkkel for kortstil (for eksempel enterprise-blue) eller innebygd navn (blue/dark/corporate/warm/green/minimal); hvis det utelates, brukes samtalestilen eller merkevarens standard"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Oppretter en Excel-arbeidsbok (.xlsx) og returnerer en nedlastingslenke. Støtter flere ark, overskriftsstiler, kolonnebredder, tallformater, betinget formatering, frosne ruter, autofiltre og validering av rullegardinelister. Parameteren theme godtar en kortstilsnøkkel eller et innebygd navn (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Arbeidsboktittel (høyst 30 tegn), for eksempel Inntektsrapport Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Array med ark (JSON). Felt per ark: name, headers (overskriftsarray), rows (todimensjonal array; hver rad er en array av celleverdier, for eksempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (for eksempel [12,20,15]), numberFormat (for eksempel \"#,##0.00\" eller \"yyyy-MM-dd\"), conditionalFormats (array av {range,type,color,value?}; type støtter dataBar/colorScale/greaterThan osv.), charts (diagramarray), freezeRows (antall frosne rader), autoFilter (filterområde), dropdowns (rullegardineliste)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (valgfritt): nøkkel for kortstil (for eksempel enterprise-blue) eller innebygd navn (blue/dark/corporate/warm/green/minimal) som styrer overskrift og overordnede farger; hvis det utelates, brukes samtalestilen eller merkevarens standard"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Oppretter en PowerPoint-presentasjon (.pptx) og returnerer en nedlastingslenke. To gjensidig utelukkende inndatamoduser: (1) slides-modus, der AI beskriver strukturert innhold og oppsettet genereres automatisk; (2) widgetSrc-modus, som bygger inn tidligere genererte show_widget-kort som lysbildefbilder. Parameteren theme godtar en kortstilsnøkkel (for eksempel enterprise-blue/raycast-dark/ppt-executive) eller et innebygd navn (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Presentasjonstittel (høyst 30 tegn), for eksempel Kvartalsgjennomgang Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Array med lysbilder (JSON). Ett element = ett lysbilde; flere = en fullstendig presentasjon. Gjensidig utelukkende med widgetSrc. Felt per lysbilde: title, layout (title_only/title_content/two_column/chart_only/blank), background (hexfarge), footer, showPageNumber (true/false), elements (elementliste), notes, transition. elements støtter: text (role=title/subtitle/body/kpi/caption; valgfritt bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows er en todimensjonal array der hver rad er en array av celleverdier, for eksempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; valgfritt tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Eksempel: [{\"title\":\"Forside\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Gjennomgang Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife-teamet\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Kommaseparert liste med show_widget-kort-ID-er, for eksempel 'call_abc123,call_def456'. Gjensidig utelukkende med slides. Gjengir de genererte kortene som lysbildefbilder"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (valgfritt): nøkkel for kortstil (for eksempel enterprise-blue/ppt-executive) eller innebygd navn (blue/dark/corporate/warm/green/minimal osv.); hvis det utelates, brukes samtalestilen eller merkevarens standard"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Viser data som et interaktivt diagram (zoom, sveving, eksport som bilde). Omtrent 20 ganger raskere enn show_widget: bare en JSON-spesifikasjon (omtrent 200 tokens) er nødvendig, og frontenden gjengir den umiddelbart med ECharts. Støtter: bar, line (linje/område), pie (kake/ring), scatter, radar, map_china (varmekart per kinesisk provins), heatmap (matrise-varmekart), gauge, funnel og treemap. Egnet for numeriske sammenligninger, tidsserier (linje), andelsanalyser og geografisk fordeling. Merk: for reiseruter, historiske hendelser, milepæler og tidslinjer bruk show_timeline; dette verktøyet støtter ikke typen timeline. Visuell stil: send et fargeskjema via data.colors i stedet for å stole på ECharts-standarder. Forslag: merkevarefarge for én serie, jevnt fordelte nyanser (10-12 farger) for flere serier, komplementærfarger for sammenligninger og en enfarget gradient for trender. Blått og gull for finans, blått/grønt/hvitt for helse og fiolett/blått/cyan for teknologi og AI. For store datasett settes data.animation=false for å redusere gjengivelseskostnaden."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Diagramtype: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Diagramtittel (høyst 30 tegn), for eksempel BNP per provins 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON-objekt; strukturen er beskrevet i verktøybeskrivelsen. bar-eksempel: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Inntekter\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; radar-eksempel med flere serier: {\"indicators\":[{\"name\":\"Hastighet\",\"max\":100},{\"name\":\"Styrke\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar-krav: antallet indicators må være lik lengden på hver series[i].data, og data må bare inneholde tall"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Henter detaljer om den innloggede brukeren, inkludert brukernavn, visningsnavn, e-post, mobil, kode, roller, avdeling, kjønn, alder, fødselsdag og merknad, samt besøkendes IP-adresse, by og detaljert geografisk plassering"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Søker i databaseskjemaer etter nøkkelord. Resultatet har to deler: (1) en mapping tabell-til-tilkobling (Markdown-tabell som viser hvilken tilkobling hver tabell tilhører; tabeller med samme navn under ulike tilkoblinger listes separat); (2) tabellskjemaet XML for hver tilkobling. Senere run_sql-kall må bruke tilkoblingsnavnet fra mappingtabellen"
"Search keywords, separated by commas or spaces": "Søkeord atskilt med komma eller mellomrom"
"Restrict to a connection name; empty searches all connections": "Begrens til et tilkoblingsnavn; tomt søker i alle tilkoblinger"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Kjører en SQL-setning på den angitte databasetilkoblingen. SELECT/WITH-spørringer returnerer rader; ikke-spørringssetninger som INSERT/UPDATE/DELETE returnerer antall berørte rader. connName må samsvare med tilkoblingskolonnen som search_table returnerer"
"Database connection name (from the connection column of search_table)": "Databasetilkoblingsnavn (fra tilkoblingskolonnen i search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL-setning. SELECT/WITH returnerer et resultatsett; ikke-spørringssetninger returnerer antall berørte rader"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Slår opp månedskalenderdato, solterm og arbeidsdagsstatus (arbeidsdag/helligdag/erstatningsdag) for en dato"
"Date to query in yyyy-MM-dd format. Defaults to today": "Dato som skal slås opp i formatet yyyy-MM-dd. Standard er i dag"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Viser en oppgaveliste som en kanbantavle med flere kolonner (for eksempel Skal gjøres -> Pågår -> Ferdig). Egnet for prosjektoppdeling, sprintplanlegging, arbeidsflytvisning og oppgavestatusklassifisering. Hver kolonne kan ha en fargemarkering og en WIP-grense; hvert kort kan ha tittel, beskrivelse, prioritet, tagger, forfallsdato, ansvarlig, sjekkliste, fremdrift og lenke. To oppsett: board (standardtavle med flere kolonner) og swimlane (kolonner gruppert etter team eller modul)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Tavletittel (høyst 30 tegn), for eksempel Sprint 1-tavle"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "JSON-array med kolonnedefinisjoner. Eksempel: [{\"id\":\"todo\",\"title\":\"Skal gjøres\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Kravanalyse\",\"description\":\"Samle brukerkrav\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Intervju brukere\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Alle felt unntatt id og title er valgfrie"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Oppsettmodus: board (standardtavle med flere kolonner) eller swimlane (kolonner gruppert etter team eller modul; parameteren swimlanes kreves)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "JSON-array med swimlane-definisjoner (brukes når layout=swimlane). Eksempel: [{\"id\":\"sl1\",\"title\":\"Frontend-team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Backend-team\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Markerer koordinatpunkter (byer eller POI-er) eller fremhever provinser på et kart over Kina, genererer et annotert SVG-kart og gjengir det i chatboblen. Støtter: (1) provinsfylling med egendefinerte farger; (2) WGS84-markeringer med bredde- og lengdegrad samt etikettekst; (3) automatisk forklaring nederst til høyre. Typiske bruksområder: datadistribusjon per provins, byplasseringer og regionale salgsvarmekart."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Karttittel (høyst 30 tegn), for eksempel BNP per provins 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "JSON-array med markeringer (kan være en tom array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376 mrd\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng er WGS84-desimalgrader; color/size er valgfrie"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "JSON-array med provinsfremhevinger (kan være en tom array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"Nr. 1 BNP\"}]. name godtar det kinesiske provinsnavnet (fullt eller kort); label er valgfritt"
"Legend title (optional), e.g. GDP scale": "Forklaringstittel (valgfritt), for eksempel BNP-skala"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Fargeskjema (valgfritt): blue/orange/green/purple/red; standard blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Markeringsstil (valgfritt): circle/pin/square; standard circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Viser kunnskapshierarkier eller begrepsrelasjoner som et sammenleggbart interaktivt tankekart. Inndata er en Markdown-disposisjon (# / ## / ###) som frontenden gjør om til et visuelt tre. Egnet for kunnskapsorganisering, begrepsoppdeling, teknologisammenligning, alternativvurdering og innholdssammendrag. Visuell stil: velg branchColors (3-8 samordnede farger), maxDepth (kompleksitet) og collapsed (initielt sammenslått for fokus) ut fra temaet. Kjølige farger (blått/fiolett/cyan) for teknologi og data, varme farger (oransje/gull/rødt) for forretning og markedsføring, og grønt for natur og helse. For tette noder settes maxDepth=2 for lesbarhet. 6 oppsett: tree (innrykket tre, standard, generelt) / radial (radialt venstre-høyre, best for kunnskapskart) / lr (fra midten til høyre, flytskjemaer/beslutningstrær) / rl (fra midten til venstre, baklengs sporing) / tb (fra midten nedover, organisasjonskart) / bt (fra midten oppover, hierarki nedenfra og opp)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Tankekarttittel (høyst 30 tegn), for eksempel AI-teknologistakk"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown-disposisjon med # / ## / ### for nivåene 1-3. Eksempel:\n# Kunstig intelligens\n## Maskinlæring\n### Veiledet læring\n### Uveiledet læring\n## Dyp læring\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Oppsettmodus: tree (innrykket tre, standard, generelt) / radial (radialt venstre-høyre, best for kunnskapskart) / lr (fra midten til høyre, flytskjemaer/beslutningstrær) / rl (fra midten til venstre, baklengs sporing) / tb (fra midten nedover, organisasjonskart) / bt (fra midten oppover, hierarki nedenfra og opp)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "JSON-array med grenfarger, for eksempel [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3 til 8 hexfarger tildeles i rekkefølge til førstenivågrenene. Hvis det utelates, brukes standardpaletten blått/fiolett, grønt, gult, rødt, himmelblått, mørkegrønt, oransje, fiolett"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "JSON-array med ID-er for noder som er slått sammen fra start, for eksempel [\"n2\",\"n5\"]. Tomt utvider alt. Brukes for å fokusere på viktige grener"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Maksimal synlig dybde: 1 = bare førstenivågrener, 2 = to nivåer, ubegrenset som standard. For tette noder settes 2 for lesbarhet"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Viser tidsseriedata som pene tidslinjekort. Bare JSON (omtrent 100 tokens) er nødvendig, og frontenden gjengir det umiddelbart. Egnet for prosjektmilepæler, historiske hendelser, utgivelsesplaner og utviklingshistorikk. Hver hendelse kan ha dato, tittel, beskrivelse, farge og kategori. Visuell stil: angi en global palett via parameteren palette (for eksempel blå-fiolett gradient, varm bronse, merkevarefarger) for en ensartet stemning; item.color overstyrer en enkelt post. Bruk density=relaxed for 5 eller færre utvalgte hendelser og density=compact for 10 eller flere. 8 oppsett: vertical (5-20 poster) / alternating-top (vekselvis over, omvendt kronologisk) / alternating-bottom (vekselvis under, kronologisk) / horizontal-left (horisontalt venstre, omvendt kronologisk) / horizontal-right (horisontalt høyre, kronologisk) / s-curve (S-formet bane, 8 poster eller færre) / fishbone-left (fiskebein venstre, omvendt kronologisk) / fishbone-right (fiskebein høyre, kronologisk)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Tidslinjetittel (høyst 30 tegn), for eksempel Produktmilepæler"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "JSON-array med tidslinjehendelser. Eksempel: [{\"date\":\"2024-01\",\"title\":\"v1.0 utgitt\",\"description\":\"Kjernefunksjoner lansert\",\"color\":\"#5470c6\",\"category\":\"Milepæl\"}]. description/color/category er valgfrie"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Oppsettmodus: vertical / alternating-top (vekselvis over, omvendt rekkefølge) / alternating-bottom (vekselvis under, kronologisk) / horizontal-left (horisontalt, omvendt kronologisk) / horizontal-right (horisontalt, kronologisk) / s-curve / fishbone-left (fiskebein, omvendt kronologisk) / fishbone-right (fiskebein, kronologisk)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "JSON-array med global palett, for eksempel [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Erstatter standardrotasjonen med 8 farger. item.color har prioritet"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Avstand mellom poster: compact (12px) / normal (20px, standard) / relaxed (32px). relaxed passer for 5 eller færre utvalgte hendelser; compact for 10 eller flere"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Gjengir et SVG- eller HTML-fragment i chatboblen. Bruk den til tidslinjer og relasjonsdiagrammer (SVG), skjemaforhåndsvisninger og datakort (HTML) samt statistiske diagrammer (SVG). Ikke bruk den til Mermaid-diagrammer; oppgi Mermaid som en ```mermaid-kodeblokk i svaret. Grenser: høyst 200 KB; <script src=...> bare fra klarerte CDN-er. Visuell stil: velg informasjonsarkitektur (Bento/kortflyt/Grid), typografisk hierarki og fargesystem ut fra temaet. Kjølige sans-serif-toner for tekniske diskusjoner, nøytrale farger med fremhevede tall for forretningsrapporter og gradienter/glassmorphism/mikroanimasjoner for kreativt arbeid. Angi alltid font-family og color eksplisitt; ikke stol på nettleserens standardstiler."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widgettittel (høyst 30 tegn), for eksempel Ordrestatusflyt"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG må begynne med <svg; HTML-fragmenter må begynne med rotelementet og må ikke inneholde <html><body>. Høyst 200 KB; <script src=...> bare fra klarerte CDN-er. Ikke send Mermaid-syntaks (flowchart/graph/sequenceDiagram osv.); oppgi Mermaid som en ```mermaid-kodeblokk i svaret"
"Placeholder text shown while loading (optional)": "Plassholdertekst som vises under lasting (valgfritt)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Tematips: light / dark / auto (følg systemet). Den genererte HTML-en bør velge bakgrunns- og tekstfarge deretter; sendes ikke til frontend-rendereren"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Innledende widgetshøyde i px (80-1200). Standard 480. Bruk 300-400 for kompakte kort og 600-800 for store diagrammer"
