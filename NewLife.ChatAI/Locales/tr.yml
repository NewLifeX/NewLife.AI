"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Word belgesi (.docx) oluşturur ve indirme bağlantısı döndürür. Başlıkları, paragrafları, listeleri, tabloları, resimleri, sayfa sonlarını, ayırıcıları, vurgu kutularını, KPI kartlarını, alıntıları ve kod bloklarını destekler. JSON bölüm dizisi her bölümü heading, content ve elements ile tanımlar"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Belge başlığı (en fazla 30 karakter), örneğin 2. Çeyrek Raporu"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Bölüm dizisi (JSON). Her bölümün alanları: heading (bölüm başlığı), headingLevel (1-3, varsayılan 1), content (metin paragrafı, isteğe bağlı), elements (öğe dizisi, isteğe bağlı). Öğe türleri: paragraph ({type,text,isteğe bağlı bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,isteğe bağlı tableStyle}; rows iki boyutlu dizidir, her satır hücre değerleri dizisidir, örneğin [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (isteğe bağlı): kart stil anahtarı (örneğin enterprise-blue) veya yerleşik ad (blue/dark/corporate/warm/green/minimal); atlanırsa sohbet stili veya marka varsayılanı kullanılır"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Excel çalışma kitabı (.xlsx) oluşturur ve indirme bağlantısı döndürür. Birden fazla sayfayı, başlık stillerini, sütun genişliklerini, sayı biçimlerini, koşullu biçimlendirmeyi, bölmeleri dondurmayı, otomatik filtreyi ve açılır liste doğrulamasını destekler. theme parametresi kart stil anahtarını veya yerleşik adı (blue/dark/corporate/warm/green/minimal) kabul eder"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Çalışma kitabı başlığı (en fazla 30 karakter), örneğin 2. Çeyrek Gelir Raporu"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Sayfa dizisi (JSON). Her sayfanın alanları: name, headers (başlık dizisi), rows (iki boyutlu dizi; her satır hücre değerleri dizisidir, örneğin [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (örneğin [12,20,15]), numberFormat (örneğin \"#,##0.00\" veya \"yyyy-MM-dd\"), conditionalFormats ({range,type,color,value?} dizisi; type için dataBar/colorScale/greaterThan gibi değerler desteklenir), charts (grafik dizisi), freezeRows (dondurulacak satır sayısı), autoFilter (filtre aralığı) ve dropdowns (açılır liste doğrulaması)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (isteğe bağlı): kart stil anahtarı (örneğin enterprise-blue) veya yerleşik ad (blue/dark/corporate/warm/green/minimal); başlık ve genel renkleri belirler; atlanırsa sohbet stili veya marka varsayılanı kullanılır"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "PowerPoint sunusu (.pptx) oluşturur ve indirme bağlantısı döndürür. Karşılıklı dışlayan iki giriş modu vardır: (1) slides modu, yapay zekâ yapılandırılmış içeriği tanımlar ve düzen otomatik üretilir; (2) widgetSrc modu, önceden oluşturulmuş show_widget kartlarını slayt görüntüsü olarak gömer. theme parametresi kart stil anahtarını (örneğin enterprise-blue/raycast-dark/ppt-executive) veya yerleşik adı (blue/dark/green/warm/corporate/minimal) kabul eder."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Sunum başlığı (en fazla 30 karakter), örneğin 2. Çeyrek Değerlendirmesi"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Slayt dizisi (JSON). Bir öğe = tek slayt, birden çok öğe = tam sunum. widgetSrc ile karşılıklı dışlayan. Her slaydın alanları: title, layout (title_only/title_content/two_column/chart_only/blank), background (onaltılık renk), footer, showPageNumber (true/false), elements (öğe listesi), notes ve transition. elements şunları destekler: text (role=title/subtitle/body/kpi/caption; isteğe bağlı bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows iki boyutlu dizi, her satır hücre değerleri dizisidir, örneğin [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; isteğe bağlı tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Örnek: [{\"title\":\"Kapak\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"2. Çeyrek Değerlendirmesi\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Ekibi\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "show_widget kart kimliklerinin virgülle ayrılmış listesi, örneğin 'call_abc123,call_def456'. slides ile karşılıklı dışlayan. Oluşturulmuş kartları slayt görüntüsüne dönüştürür"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (isteğe bağlı): kart stil anahtarı (örneğin enterprise-blue/ppt-executive) veya yerleşik ad (blue/dark/corporate/warm/green/minimal vb.); atlanırsa sohbet stili veya marka varsayılanı kullanılır"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Verileri etkileşimli grafik olarak gösterir (yakınlaştırma, üzerine gelme, görüntü olarak dışa aktarma). show_widget'dan yaklaşık 20 kat hızlıdır: JSON tanımı (yaklaşık 200 token) yeterlidir, ön yüz ECharts ile hemen çizer. Desteklenenler: bar, line (çizgi/alan), pie (daire/halka), scatter, radar, map_china (Çin il haritası), heatmap (matris ısı haritası), gauge, funnel, treemap. Sayısal karşılaştırmalar, zaman serileri (çizgi), pay analizi ve coğrafi dağılım için uygundur. Not: rotalar, tarihsel olaylar, dönüm noktaları ve zaman çizelgeleri için show_timeline kullanın; bu araç timeline türünü desteklemez. Görsel stil: ECharts varsayılanlarına güvenmek yerine data.colors ile renk paleti verin. Öneriler: tek seri için marka rengi, çok seri için eşit aralıklı tonlar (10-12 renk), karşılaştırma için tamamlayıcı renkler, trendler için tek renk gradyan. Finans için mavi ve altın, sağlık için mavi/yeşil/beyaz, teknoloji ve yapay zekâ için mor/mavi/camgöbeği. Büyük veri kümelerinde çizim maliyetini azaltmak için data.animation=false ayarlayın."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Grafik türü: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Grafik başlığı (en fazla 30 karakter), örneğin 2024 İllere Göre GSYİH"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON nesnesi; yapısı aracın açıklamasında belirtilmiştir. bar örneği: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Gelir\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; çok serili radar örneği: {\"indicators\":[{\"name\":\"Hız\",\"max\":100},{\"name\":\"Güç\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar koşulu: indicators sayısı her series[i].data uzunluğuna eşit olmalı ve data yalnızca sayı içermelidir"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Giriş yapmış kullanıcının ayrıntılarını döndürür: kullanıcı adı, görünen ad, e-posta, cep telefonu, kod, roller, departman, cinsiyet, yaş, doğum tarihi ve notlar ile ziyaretçinin IP adresi, şehri ve ayrıntılı coğrafi konumu"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Veritabanı tablo şemalarını anahtar sözcükle arar. Sonuç iki bölümden oluşur: (1) tablo-bağlantı haritası (her tablonun hangi bağlantıya ait olduğunu gösteren Markdown tablosu; aynı adlı tablolar farklı bağlantılarda ayrı ayrı listelenir); (2) her bağlantı için tabloların XML şeması. Sonraki run_sql çağrıları harita tablosundaki bağlantı adını kullanmalıdır"
"Search keywords, separated by commas or spaces": "Virgül veya boşlukla ayrılmış arama anahtar sözcükleri"
"Restrict to a connection name; empty searches all connections": "Bağlantı adıyla sınırla; boşsa tüm bağlantılarda arar"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Belirtilen veritabanı bağlantısında SQL çalıştırır. SELECT/WITH sorguları satır döndürür; INSERT/UPDATE/DELETE gibi sorgu olmayan ifadeler etkilenen satır sayısını döndürür. connName, search_table'ın döndürdüğü bağlantı sütunuyla eşleşmelidir"
"Database connection name (from the connection column of search_table)": "Veritabanı bağlantı adı (search_table'ın bağlantı sütunundan)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL ifadesi. SELECT/WITH sonuç kümesi döndürür; sorgu olmayan ifadeler etkilenen satır sayısını döndürür"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Belirli bir tarih için ay takvimi tarihini, güneş terimini ve çalışma günü durumunu (iş günü/tatil/telafi günü) arar"
"Date to query in yyyy-MM-dd format. Defaults to today": "İstenen tarih, yyyy-MM-dd biçiminde. Varsayılan bugündür"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Görevleri çok sütunlu Kanban panosu olarak gösterir (örneğin Yapılacak -> Devam Ediyor -> Bitti). Proje bölümleme, sprint planlama, iş akışı gösterimi ve görev durumu sınıflandırması için uygundur. Her sütunda renk etiketi ve WIP sınırı olabilir; her kartta başlık, açıklama, öncelik, etiketler, bitiş tarihi, atanan kişi, alt görev listesi, ilerleme ve bağlantı bulunabilir. İki düzen: board (varsayılan çok sütunlu pano) ve swimlane (sütunlar ekip veya birime göre gruplanır)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Pano başlığı (en fazla 30 karakter), örneğin Sprint 1 Panosu"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Sütun tanımlarının JSON dizisi. Örnek: [{\"id\":\"todo\",\"title\":\"Yapılacak\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Gereksinim analizi\",\"description\":\"Kullanıcı gereksinimlerini topla\",\"priority\":\"high\",\"tags\":[\"tasarım\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Kullanıcı görüşmesi\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. id ve title dışındaki tüm alanlar isteğe bağlıdır"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Düzen modu: board (varsayılan çok sütunlu pano) veya swimlane (sütunlar ekip veya birime göre gruplanır; swimlanes parametresi gerekir)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Şerit tanımlarının JSON dizisi (layout=swimlane olduğunda kullanılır). Örnek: [{\"id\":\"sl1\",\"title\":\"Ön yüz ekibi\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Arka uç ekibi\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Çin haritasında koordinat noktalarını (şehirler veya ilgi noktaları) işaretler veya illeri vurgular, açıklamalı bir SVG harita oluşturup sohbet balonunda gösterir. Desteklenenler: (1) illeri özel renklerle doldurma; (2) enlem-boylam ve etiket metniyle WGS84 işaretleri; (3) sağ alt köşede otomatik açıklama. Tipik kullanımlar: illere göre veri dağılımı, şehir konumları, bölgesel satış ısı haritaları."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Harita başlığı (en fazla 30 karakter), örneğin 2024 İllere Göre GSYİH"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "İşaretlerin JSON dizisi (boş dizi [] olabilir). Biçim: [{\"name\":\"Pekin\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Pekin\\n4376 milyar\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng ondalık derece WGS84; color/size isteğe bağlı"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "İl vurgularının JSON dizisi (boş dizi [] olabilir). Biçim: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"GSYİH'de birinci\"}]. name, il adını Çince (tam veya kısaltılmış) kabul eder; label isteğe bağlı"
"Legend title (optional), e.g. GDP scale": "Açıklama başlığı (isteğe bağlı), örneğin GSYİH ölçeği"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Renk şeması (isteğe bağlı): blue/orange/green/purple/red; varsayılan blue"
"Marker style (optional): circle/pin/square; defaults to circle": "İşaret biçimi (isteğe bağlı): circle/pin/square; varsayılan circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Bilgi hiyerarşilerini veya kavramlar arası ilişkileri katlanabilir, etkileşimli bir zihin haritası olarak gösterir. Girdi, ön yüzün görsel ağaca dönüştürdüğü Markdown ana hat (# / ## / ###) biçimindedir. Bilgi düzenleme, kavram ayrıştırma, teknoloji karşılaştırma, seçenek değerlendirme ve içerik özetleme için uygundur. Görsel stil: konuya göre branchColors (3-8 uyumlu renk), maxDepth (karmaşıklık) ve collapsed (başlangıçta katlayarak odaklanma) seçin. Teknoloji ve veri için soğuk renkler (mavi/mor/camgöbeği), iş ve pazarlama için sıcak renkler (turuncu/altın/kırmızı), doğa ve sağlık için yeşil kullanın. Yoğun düğümlerde okunabilirliği korumak için maxDepth=2 ayarlayın. 6 düzen: tree (varsayılan, dişli ağaç, genel) / radial (sağ-sol ışınsal, bilgi haritaları için en iyi) / lr (merkezden sağa, akış grafikleri/karar ağaçları) / rl (merkezden sola, geriye izleme) / tb (merkezden aşağı, organizasyon şemaları) / bt (merkezden yukarı, aşağıdan yukarıya hiyerarşi)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Zihin haritası başlığı (en fazla 30 karakter), örneğin Yapay Zekâ Teknoloji Yığını"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "1-3 düzeyleri için # / ## / ### kullanılan Markdown ana hat. Örnek:\n# Yapay Zekâ\n## Makine Öğrenmesi\n### Denetimli Öğrenme\n### Denetimsiz Öğrenme\n## Derin Öğrenme\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Düzen modu: tree (varsayılan, dişli ağaç, genel) / radial (sağ-sol ışınsal, bilgi haritaları için en iyi) / lr (merkezden sağa, akış grafikleri/karar ağaçları) / rl (merkezden sola, geriye izleme) / tb (merkezden aşağı, organizasyon şemaları) / bt (merkezden yukarı, aşağıdan yukarıya hiyerarşi)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Dal renklerinin JSON dizisi, örneğin [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Birinci düzey dallara sırayla 3-8 onaltılık renk atanır. Atlanırsa varsayılan palet mavi/mor, yeşil, sarı, kırmızı, camgöbeği, koyu yeşil, turuncu ve mor kullanılır"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Başlangıçta katlanacak düğüm kimliklerinin JSON dizisi, örneğin [\"n2\",\"n5\"]. Boşsa tümü açılır. Önemli dallara odaklanmak için kullanılır"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "En fazla görünür derinlik: 1 = yalnızca birinci düzey dallar, 2 = iki düzey, varsayılan sınırsız. Yoğun düğümlerde okunabilirliği korumak için 2 ayarlayın"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Zaman serisi verilerini zarif zaman çizelgesi kartları olarak gösterir. JSON yeterlidir (yaklaşık 100 token) ve ön yüz hemen çizer. Proje dönüm noktaları, tarihsel olaylar, sürüm planları ve geliştirme geçmişi için uygundur. Her olayda tarih, başlık, açıklama, renk ve kategori olabilir. Görsel stil: zaman çizelgesine tutarlı bir karakter vermek için palette parametresiyle (örneğin mavi-mor gradyan, sıcak bronz, marka renkleri) genel palet verin; item.color tek tek öğeyi değiştirir. Beş veya daha az seçkin olay için density=relaxed, on veya daha fazla için density=compact kullanın. 8 düzen: vertical (5-20 öğe) / alternating-top (üstte dönüşümlü, ters kronoloji) / alternating-bottom (altta dönüşümlü, kronoloji) / horizontal-left (sola yatay, ters) / horizontal-right (sağa yatay, kronoloji) / s-curve (S eğrisi, 8 öğe veya daha az) / fishbone-left (sola kılçık, ters) / fishbone-right (sağa kılçık, kronoloji)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Zaman çizelgesi başlığı (en fazla 30 karakter), örneğin Ürünün Dönüm Noktaları"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Zaman çizelgesi olaylarının JSON dizisi. Örnek: [{\"date\":\"2024-01\",\"title\":\"v1.0 sürümü\",\"description\":\"Temel özelliklerin yayını\",\"color\":\"#5470c6\",\"category\":\"dönüm noktası\"}]. description/color/category isteğe bağlıdır"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Düzen modu: vertical / alternating-top (üstte dönüşümlü, ters kronoloji) / alternating-bottom (altta dönüşümlü, kronoloji) / horizontal-left (yatay, ters) / horizontal-right (yatay, kronoloji) / s-curve / fishbone-left (kılçık, ters) / fishbone-right (kılçık, kronoloji)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Genel renk paletinin JSON dizisi, örneğin [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Varsayılan sekiz renkli dönüşümü değiştirir. item.color önceliklidir"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Öğe aralığı: compact (12px) / normal (20px, varsayılan) / relaxed (32px). relaxed beş veya daha az seçkin olay için, compact on veya daha fazla olay için uygundur"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Sohbet balonu içinde SVG veya HTML parçası gösterir. Zaman çizelgeleri ve ilişki grafikleri (SVG), form önizlemeleri ve veri kartları (HTML), istatistiksel grafikler (SVG) için kullanın. Mermaid grafikleri için kullanmayın; Mermaid'i yanıtta ```mermaid kod bloğu olarak verin. Sınırlar: en fazla 200 KB; <script src=...> yalnızca güvenilen CDN'den. Görsel stil: konuya göre bilgi mimarisini (Bento/kart akışı/Grid), tipografik hiyerarşiyi ve renk sistemini seçin. Teknik tartışmalar için köşesiz soğuk tonlar, iş raporları için belirgin sayılarla nötr renkler, yaratıcı işler için gradyanlar/cam efekti/ince hareketler. font-family ve color değerlerini her zaman açıkça belirtin; tarayıcı varsayılan stillerine güvenmeyin."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Bileşen başlığı (en fazla 30 karakter), örneğin Sipariş Durumu Akışı"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG <svg ile başlamalıdır; HTML parçaları kök öğeyle başlamalı ve <html><body> içermemelidir. En fazla 200 KB; <script src=...> yalnızca güvenilen CDN'den. Mermaid biçimini (flowchart/graph/sequenceDiagram vb.) geçirmeyin; Mermaid'i yanıtta ```mermaid kod bloğu olarak verin"
"Placeholder text shown while loading (optional)": "Yüklenirken gösterilen yer tutucu metin (isteğe bağlı)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Tema ipucu: light / dark / auto (sisteme göre). Üretilen HTML buna göre arka plan ve metin renklerini seçmelidir; ön yüz görüntüleyicisine aktarılmaz"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Bileşenin başlangıç yüksekliği (piksel, 80-1200). Varsayılan 480. Kompakt kartlar için 300-400, büyük grafikler için 600-800 kullanın"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Arka plan modu: solid (varsayılan) / transparent (ekran görüntülerini PPT şablonuna yerleştirmek için)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT slayt modu. true olduğunda kart 16:9 oranında sunuma yapıştırmaya hazır gösterilir. Varsayılan false içeriğe göre görüntüler"
"Section heading text, e.g. Completed this week": "Bölüm başlığı metni, örneğin Bu Hafta Tamamlananlar"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Başlık düzeyi: 1 = birinci düzey (en büyük), 2 = ikinci düzey, 3 = üçüncü düzey; varsayılan 1"
"Body paragraph text (optional; used together with elements)": "Metin paragrafı (isteğe bağlı; elements ile birlikte kullanılır)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Yapılandırılmış öğe dizisi (isteğe bağlı): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Öğe türü: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Metin içeriği (type=paragraph/callout/quote/code olduğunda kullanılır)"
"List item array (used when type=bullet_list or ordered_list)": "Liste öğeleri dizisi (type=bullet_list veya ordered_list olduğunda kullanılır)"
"Table header row (required when type=table)": "Tablo başlık satırı (type=table olduğunda zorunlu)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Tablo veri satırları (type=table olduğunda zorunlu); her satır hücre değerleri dizisidir, örneğin [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Tablo stili (type=table olduğunda isteğe bağlı): headerBgColor (başlık arka planı), headerFontColor (başlık metin rengi), stripeColor (dönüşümlü satırlar)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "Resim URL'si (type=image olduğunda zorunlu); harici https:// bağlantılarını veya /cube/image?id=xxx gibi iç ekleri destekler"
"Image width in centimeters (type=image); default 14cm": "Resim genişliği, santimetre (type=image); varsayılan 14 cm"
"Image height in centimeters (type=image); default 10cm": "Resim yüksekliği, santimetre (type=image); varsayılan 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Metin kalın mı (type=paragraph/callout/quote olduğunda isteğe bağlı)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Metin eğik mi (type=paragraph/callout/quote olduğunda isteğe bağlı)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Metin altı çizili mi (type=paragraph/callout/quote olduğunda isteğe bağlı)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Yazı tipi boyutu, punto, örneğin 12 (type=paragraph/callout olduğunda isteğe bağlı)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Metin rengi (onaltılık RGB, örneğin 2563EB; type=paragraph/callout/quote olduğunda isteğe bağlı)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Metin hizalaması: left/center/right/justify (type=paragraph olduğunda isteğe bağlı)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Paragraf arka plan rengi (onaltılık RGB, örneğin EFF6FF; type=paragraph olduğunda isteğe bağlı)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Vurgu kutusu stili (type=callout): info (mavi) / success (yeşil) / warning (sarı) / danger (kırmızı); varsayılan info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI değeri (type=kpi olduğunda zorunlu), örneğin 17,68 milyon"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI etiketi (type=kpi olduğunda isteğe bağlı), örneğin geçen aya göre büyüme"
"KPI trend (optional when type=kpi): up / down / flat": "KPI eğilimi (type=kpi olduğunda isteğe bağlı): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Alıntı kaynağı (type=quote olduğunda isteğe bağlı), örneğin 2026 Yıllık Raporu"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Kod dili (type=code olduğunda isteğe bağlı), örneğin sql/python/javascript; söz dizimi renklendirmesini belirler"
"Worksheet name, e.g. Q2 Data": "Çalışma sayfası adı, örneğin 2. Çeyrek Verileri"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Sütun başlıkları dizisi, örneğin [\"Tarih\",\"Gelir\",\"Değişim\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Veri satırları (iki boyutlu dizi); her satır hücre değerleri dizisidir, örneğin [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Başlık stili (isteğe bağlı): headerBgColor (başlık arka planı), headerFontColor (başlık metin rengi), stripeColor (dönüşümlü satırlar)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Sütun genişlikleri dizisi (isteğe bağlı), örneğin [12, 20, 15]; değerler yaklaşık karakter genişliğidir"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Sayı biçimi (isteğe bağlı), örneğin \"#,##0.00\" veya \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Koşullu biçimlendirme dizisi (isteğe bağlı). Her öğenin alanları: range (örneğin \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan vb.), color (ana renk), value (eşik)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Grafik tanımları dizisi (isteğe bağlı): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Dondurulacak üst satır sayısı (0 = yok, 1 = ilk satırı dondur; varsayılan 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Otomatik filtre aralığı (örneğin \"A1:E1\"); boşsa devre dışı"
"Dropdown validation array (optional)": "Açılır liste doğrulama işlemleri dizisi (isteğe bağlı)"
"Applied range (e.g. \"C2:C10\")": "Uygulanacak aralık (örneğin \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Koşul türü: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Veri çubukları, renk ölçekleri veya vurgulama için kullanılan renk (onaltılık RGB, örneğin 2563EB)"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Eşik veya formül (örneğin 1000 veya =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Grafik türü: bar / line / pie"
"Chart title (optional)": "Grafik başlığı (isteğe bağlı)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Kategori ekseni etiketleri dizisi, örneğin [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Veri serileri dizisi; her öğe name ve data içerir"
"Applied range (e.g. \"A2:A100\")": "Uygulanacak aralık (örneğin \"A2:A100\")"
"Dropdown option array": "Açılır liste seçenekleri dizisi"
"Title of this slide": "Bu slaydın başlığı"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Slayt düzeni: title_only (yalnızca başlık, kapaklar için) / title_content (başlık + metin, varsayılan) / two_column (iki sütun) / chart_only (tam genişlikte grafik) / blank (boş alan)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Slayt arka plan rengi, onaltılık RGB, örneğin \"1F497D\"; atlanırsa tema arka planı kullanılır"
"Slide element list; each element describes a text block, table, chart, or image": "Slayt öğeleri listesi; her öğe bir metin bloğu, tablo, grafik veya resim tanımlar"
"Footer text displayed at the bottom of the slide; null hides it": "Slaydın altında gösterilen alt bilgi metni; null gizler"
"Whether to show the slide number in the bottom-right corner; default false": "Sağ alt köşede slayt numarası gösterilsin mi; varsayılan false"
"Speaker notes used as a reminder while presenting": "Sunum sırasında hatırlatıcı olarak kullanılan konuşmacı notları"
"Transition animation: fade / push / wipe / zoom / split / cut": "Geçiş efekti: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Öğe türü: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Anlamsal rol (yalnızca text öğeleri): title / subtitle / body / caption / kpi. Düzen motoru öğeyi otomatik konumlandırmak için kullanır; koordinat gerekmez"
"Text content (required when type=text)": "Metin içeriği (type=text olduğunda zorunlu)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Yazı tipi boyutu, punto (isteğe bağlı); atlanırsa düzen motoru role göre seçer (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Metin kalın mı; varsayılan false"
"Whether the text is italic (optional for type=text); default false": "Metin eğik mi (type=text olduğunda isteğe bağlı); varsayılan false"
"Whether the text is underlined (optional for type=text); default false": "Metin altı çizili mi (type=text olduğunda isteğe bağlı); varsayılan false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Metin rengi, onaltılık RGB, örneğin \"FFFFFF\"; atlanırsa tema metin rengi devralınır"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Tablo başlık dizisi (type=table olduğunda zorunlu), örneğin [\"Gösterge\",\"Q1\",\"Q2\",\"Değişim\"]"
"Chart type (required when type=chart): bar / line / pie": "Grafik türü (type=chart olduğunda zorunlu): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Grafik kategori etiketleri (type=chart olduğunda zorunlu), örneğin [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Veri serileri (type=chart olduğunda zorunlu); her öğe name (seri adı) ve data (sayı dizisi) içerir"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Metin hizalaması (text öğeleri): l (sol) / ctr (orta) / r (sağ)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Metin kutusu arka plan rengi (text öğeleri), onaltılık RGB, örneğin \"EFF6FF\"; boşsa saydam"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Zengin metin parçaları (text öğeleri); verildiğinde Content/FontSize/Bold/Color yok sayılır"
"Shape configuration (required when type=shape)": "Şekil yapılandırması (type=shape olduğunda zorunlu)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Tablo stili (type=table olduğunda isteğe bağlı): headerBgColor (başlık arka planı), headerFontColor (başlık metin rengi), stripeColor (dönüşümlü satırlar)"
"Text content": "Metin içeriği"
"Font size in points; 0 inherits the text box default": "Yazı tipi boyutu, punto; 0 metin kutusu varsayılanını devralır"
"Whether the text is bold": "Metin kalın mı"
"Whether the text is italic": "Metin eğik mi"
"Whether the text is underlined": "Metin altı çizili mi"
"Text color, hex RGB such as \"FF6B6B\"": "Metin rengi, onaltılık RGB, örneğin \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "Köprü URL'si; ayarlandığında parça tıklanabilir olur"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Şekil türü: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Dolgu rengi (onaltılık RGB, örneğin 2563EB); null dolgu yok demektir"
"Border color (hex RGB); null means no border": "Kenarlık rengi (onaltılık RGB); null kenarlık yok demektir"
"Text displayed inside the shape (optional)": "Şeklin içinde gösterilen metin (isteğe bağlı)"
"Text color inside the shape (hex RGB)": "Şekil içindeki metin rengi (onaltılık RGB)"
"Font size of the text inside the shape (points); 0 means default": "Şekil içindeki metin yazı tipi boyutu (punto); 0 varsayılan anlamına gelir"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Başlık satırı arka plan rengi (onaltılık RGB, örneğin 2563EB); atlanırsa özel stil uygulanmaz"
