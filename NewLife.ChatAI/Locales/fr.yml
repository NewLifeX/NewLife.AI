"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Génère un document Word (.docx) et renvoie un lien de téléchargement. Prend en charge titres, paragraphes, listes, tableaux, images, sauts de page, séparateurs, encadrés, KPI, citations et blocs de code. Le tableau JSON sections décrit chaque section avec heading, content et elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Titre du document (30 caractères max), par exemple Rapport trimestriel Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Tableau de sections (JSON). Champs de chaque section : heading (titre de section), headingLevel (1-3, par défaut 1), content (paragraphe, facultatif), elements (tableau d'éléments, facultatif). Types d'éléments : paragraph ({type,text, éventuellement bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, éventuellement tableStyle} ; rows est un tableau 2D, chaque ligne étant un tableau de valeurs de cellules, par exemple [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Thème (facultatif) : clé de style de carte (par exemple enterprise-blue) ou nom intégré (blue/dark/corporate/warm/green/minimal) ; si omis, le style de la conversation ou la valeur de marque par défaut est utilisé"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Génère un classeur Excel (.xlsx) et renvoie un lien de téléchargement. Prend en charge plusieurs feuilles, styles d'en-tête, largeurs de colonnes, formats numériques, mises en forme conditionnelles, volets figés, filtres automatiques et listes déroulantes. Le paramètre theme accepte une clé de style de carte ou un nom intégré (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Titre du classeur (30 caractères max), par exemple Rapport de chiffre d'affaires Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Tableau de feuilles (JSON). Champs de chaque feuille : name, headers (tableau d'en-têtes), rows (tableau 2D ; chaque ligne est un tableau de valeurs de cellules, par exemple [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (par exemple [12,20,15]), numberFormat (par exemple \"#,##0.00\" ou \"yyyy-MM-dd\"), conditionalFormats (tableau de {range,type,color,value?} ; type prend en charge dataBar/colorScale/greaterThan, etc.), charts (tableau de graphiques), freezeRows (nombre de lignes figées), autoFilter (plage de filtre), dropdowns (validation par liste)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Thème (facultatif) : clé de style de carte (par exemple enterprise-blue) ou nom intégré (blue/dark/corporate/warm/green/minimal) contrôlant l'en-tête et les couleurs globales ; si omis, le style de la conversation ou la valeur de marque par défaut est utilisé"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Génère une présentation PowerPoint (.pptx) et renvoie un lien de téléchargement. Deux modes d'entrée mutuellement exclusifs : (1) mode slides, où l'IA décrit un contenu structuré et la mise en page est générée automatiquement ; (2) mode widgetSrc, qui intègre des cartes show_widget déjà générées comme images de diapositive. Le paramètre theme accepte une clé de style de carte (par exemple enterprise-blue/raycast-dark/ppt-executive) ou un nom intégré (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Titre de la présentation (30 caractères max), par exemple Revue trimestrielle Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Tableau de diapositives (JSON). Un élément = une diapositive ; plusieurs = une présentation complète. Mutuellement exclusif avec widgetSrc. Champs de chaque diapositive : title, layout (title_only/title_content/two_column/chart_only/blank), background (couleur hexadécimale), footer, showPageNumber (true/false), elements (liste d'éléments), notes, transition. elements prend en charge : text (role=title/subtitle/body/kpi/caption ; éventuellement bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows ; rows est un tableau 2D, chaque ligne étant un tableau de valeurs de cellules, par exemple [[\"Alice\",\"85\"],[\"Bob\",\"92\"]] ; éventuellement tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Exemple : [{\"title\":\"Couverture\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Revue Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Équipe NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Liste d'ID de cartes show_widget séparés par des virgules, par exemple 'call_abc123,call_def456'. Mutuellement exclusif avec slides. Convertit les cartes générées en images de diapositive"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Thème (facultatif) : clé de style de carte (par exemple enterprise-blue/ppt-executive) ou nom intégré (blue/dark/corporate/warm/green/minimal, etc.) ; si omis, le style de la conversation ou la valeur de marque par défaut est utilisé"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Affiche les données sous forme de graphique interactif (zoom, survol, export en image). Environ 20 fois plus rapide que show_widget : seule une spécification JSON (environ 200 jetons) est nécessaire et le frontend l'affiche immédiatement avec ECharts. Types pris en charge : bar, line (ligne/aire), pie (camembert/anneau), scatter, radar, map_china (carte de chaleur par province chinoise), heatmap (carte de chaleur matricielle), gauge, funnel et treemap. Utile pour les comparaisons numériques, les séries temporelles (ligne), l'analyse de répartition et la distribution géographique. Remarque : pour les itinéraires, événements historiques, jalons et chronologies, utilisez show_timeline ; cet outil ne prend pas en charge le type timeline. Style visuel : transmettez un jeu de couleurs via data.colors plutôt que de vous fier aux valeurs ECharts par défaut. Suggestions : couleur de marque pour une série unique, teintes régulièrement réparties (10-12 couleurs) pour plusieurs séries, couleurs complémentaires pour les comparaisons, dégradé monochrome pour les tendances. Bleu et or pour la finance, bleu/vert/blanc pour la santé, violet/bleu/cyan pour la technologie et l'IA. Pour de grands jeux de données, définissez data.animation=false pour réduire le coût de rendu."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Type de graphique : bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Titre du graphique (30 caractères max), par exemple PIB par province 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Objet JSON ; la structure est décrite dans la description de l'outil. Exemple bar : {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenus\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; exemple radar multi-séries : {\"indicators\":[{\"name\":\"Vitesse\",\"max\":100},{\"name\":\"Puissance\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; exigence radar : le nombre d'indicators doit être égal à la longueur de chaque series[i].data, et data ne doit contenir que des nombres"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Renvoie les détails de l'utilisateur connecté, y compris nom, nom d'affichage, e-mail, mobile, code, rôles, service, sexe, âge, anniversaire et remarque, ainsi que l'adresse IP du visiteur, la ville et la localisation détaillée"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Recherche les schémas de tables de base de données par mot-clé. Le résultat comporte deux parties : (1) une correspondance table-connexion (tableau Markdown indiquant à quelle connexion appartient chaque table ; les tables de même nom sous des connexions différentes sont listées séparément) ; (2) le schéma XML des tables pour chaque connexion. Les appels run_sql suivants doivent utiliser le nom de connexion indiqué dans le tableau de correspondance"
"Search keywords, separated by commas or spaces": "Mots-clés de recherche, séparés par des virgules ou des espaces"
"Restrict to a connection name; empty searches all connections": "Limiter à un nom de connexion ; vide recherche toutes les connexions"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Exécute une instruction SQL sur la connexion de base de données indiquée. Les requêtes SELECT/WITH renvoient des lignes ; les instructions non-requêtes comme INSERT/UPDATE/DELETE renvoient le nombre de lignes affectées. connName doit correspondre à la colonne de connexion renvoyée par search_table"
"Database connection name (from the connection column of search_table)": "Nom de la connexion de base de données (issu de la colonne de connexion de search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Instruction SQL. SELECT/WITH renvoie un jeu de résultats ; les instructions non-requêtes renvoient le nombre de lignes affectées"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Recherche la date du calendrier lunaire, le terme solaire et le statut de travail (jour ouvré/ferié/jour de rattrapage) d'une date"
"Date to query in yyyy-MM-dd format. Defaults to today": "Date à consulter au format yyyy-MM-dd. Par défaut aujourd'hui"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Affiche une liste de tâches sous forme de tableau kanban multicolonne (par exemple À faire -> En cours -> Terminé). Adapté à la décomposition de projet, la planification de sprint, l'affichage de workflow et le classement des états de tâche. Chaque colonne peut avoir un marqueur de couleur et une limite WIP ; chaque carte peut contenir un titre, une description, une priorité, des étiquettes, une échéance, un responsable, une checklist, une progression et un lien. Deux dispositions : board (tableau multicolonne par défaut) et swimlane (colonnes regroupées par équipe ou module)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Titre du tableau (30 caractères max), par exemple Tableau Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Tableau JSON de définitions de colonnes. Exemple : [{\"id\":\"todo\",\"title\":\"À faire\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Analyse des besoins\",\"description\":\"Recueillir les besoins utilisateurs\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interroger les utilisateurs\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Tous les champs sauf id et title sont facultatifs"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Mode de disposition : board (tableau multicolonne par défaut) ou swimlane (colonnes regroupées par équipe ou module ; le paramètre swimlanes est requis)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Tableau JSON de définitions de couloirs (utilisé quand layout=swimlane). Exemple : [{\"id\":\"sl1\",\"title\":\"Équipe frontend\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Équipe backend\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Marque des points de coordonnées (villes ou POI) ou met en évidence des provinces sur une carte de Chine, génère une carte SVG annotée et l'affiche dans la bulle de conversation. Prend en charge : (1) le remplissage des provinces avec des couleurs personnalisées ; (2) des marqueurs WGS84 latitude/longitude avec texte d'étiquette ; (3) une légende automatique en bas à droite. Usages typiques : répartition des données par province, position des villes et cartes de chaleur des ventes régionales."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Titre de la carte (30 caractères max), par exemple PIB par province 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Tableau JSON de marqueurs (peut être un tableau vide []). Format : [{\"name\":\"Pékin\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Pékin\\n4376 Md\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng sont en degrés décimaux WGS84 ; color/size sont facultatifs"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Tableau JSON de mises en évidence de provinces (peut être un tableau vide []). Format : [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"N°1 PIB\"}]. name accepte le nom chinois de la province (complet ou abrégé) ; label est facultatif"
"Legend title (optional), e.g. GDP scale": "Titre de la légende (facultatif), par exemple Échelle du PIB"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Jeu de couleurs (facultatif) : blue/orange/green/purple/red ; par défaut blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Style de marqueur (facultatif) : circle/pin/square ; par défaut circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Affiche des hiérarchies de connaissances ou des relations conceptuelles sous forme de carte mentale interactive repliable. L'entrée est un plan Markdown (# / ## / ###) que le frontend convertit en arbre visuel. Utile pour l'organisation des connaissances, la décomposition de concepts, la comparaison technologique, l'évaluation d'options et la synthèse de contenu. Style visuel : choisissez branchColors (3-8 couleurs coordonnées), maxDepth (complexité) et collapsed (repli initial pour se concentrer) selon le sujet. Couleurs froides (bleu/violet/cyan) pour la technologie et les données, couleurs chaudes (orange/or/rouge) pour le business et le marketing, verts pour la nature et la santé. Pour des nœuds denses, réglez maxDepth=2 pour la lisibilité. 6 dispositions : tree (arbre indenté par défaut, polyvalent) / radial (radial gauche-droite, idéal pour les cartes de connaissances) / lr (du centre vers la droite, organigrammes/arbres de décision) / rl (du centre vers la gauche, traçage inverse) / tb (du centre vers le bas, organigrammes) / bt (du centre vers le haut, hiérarchie ascendante)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Titre de la carte mentale (30 caractères max), par exemple Stack technologique IA"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Plan Markdown utilisant # / ## / ### pour les niveaux 1 à 3. Exemple :\n# Intelligence artificielle\n## Apprentissage automatique\n### Apprentissage supervisé\n### Apprentissage non supervisé\n## Apprentissage profond\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Mode de disposition : tree (arbre indenté par défaut, polyvalent) / radial (radial gauche-droite, idéal pour les cartes de connaissances) / lr (du centre vers la droite, organigrammes/arbres de décision) / rl (du centre vers la gauche, traçage inverse) / tb (du centre vers le bas, organigrammes) / bt (du centre vers le haut, hiérarchie ascendante)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Tableau JSON de couleurs de branches, par exemple [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3 à 8 couleurs hexadécimales attribuées dans l'ordre aux branches de premier niveau. Si omis, la palette par défaut bleu/violet, vert, jaune, rouge, bleu ciel, vert foncé, orange, violet est utilisée"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Tableau JSON d'ID de nœuds initialement repliés, par exemple [\"n2\",\"n5\"]. Vide déploie tout. Sert à se concentrer sur les branches clés"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Profondeur visible maximale : 1 = branches de premier niveau uniquement, 2 = deux niveaux, illimité par défaut. Pour des nœuds denses, réglez sur 2 pour la lisibilité"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Affiche des données temporelles sous forme de cartes de chronologie soignées. Seul du JSON (environ 100 jetons) est nécessaire et le frontend l'affiche aussitôt. Utile pour les jalons de projet, événements historiques, plans de version et historiques de développement. Chaque événement peut avoir une date, un titre, une description, une couleur et une catégorie. Style visuel : définissez une palette globale via le paramètre palette (par exemple dégradé bleu-violet, bronze chaud, couleurs de marque) pour une ambiance cohérente ; item.color remplace un élément individuel. Utilisez density=relaxed pour 5 événements ou moins et density=compact pour 10 chronologies ou plus. 8 dispositions : vertical (5-20 éléments) / alternating-top (alternance au-dessus, ordre antéchronologique) / alternating-bottom (alternance en dessous, ordre chronologique) / horizontal-left (horizontal vers la gauche, ordre antéchronologique) / horizontal-right (horizontal vers la droite, ordre chronologique) / s-curve (chemin en S, 8 éléments ou moins) / fishbone-left (arête de poisson à gauche, antéchronologique) / fishbone-right (arête de poisson à droite, chronologique)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Titre de la chronologie (30 caractères max), par exemple Jalons produit"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Tableau JSON d'événements de chronologie. Exemple : [{\"date\":\"2024-01\",\"title\":\"Sortie v1.0\",\"description\":\"Fonctions principales en ligne\",\"color\":\"#5470c6\",\"category\":\"Jalon\"}]. description/color/category sont facultatifs"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Mode de disposition : vertical / alternating-top (alternance au-dessus, ordre inverse) / alternating-bottom (alternance en dessous, chronologique) / horizontal-left (horizontal, antéchronologique) / horizontal-right (horizontal, chronologique) / s-curve / fishbone-left (arête de poisson, antéchronologique) / fishbone-right (arête de poisson, chronologique)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Tableau JSON de palette globale, par exemple [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Remplace la rotation par défaut de 8 couleurs. item.color est prioritaire"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Espacement des éléments : compact (12px) / normal (20px, par défaut) / relaxed (32px). relaxed convient à 5 événements ou moins ; compact à 10 ou plus"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Affiche un fragment SVG ou HTML dans la bulle de conversation. Utilisez-le pour les chronologies et diagrammes de relations (SVG), les aperçus de formulaires et cartes de données (HTML) et les graphiques statistiques (SVG). Ne l'utilisez pas pour les diagrammes Mermaid ; produisez Mermaid sous forme de bloc de code ```mermaid dans la réponse. Limites : 200 Ko maximum ; <script src=...> uniquement depuis des CDN de confiance. Style visuel : choisissez l'architecture de l'information (Bento/flux de cartes/Grid), la hiérarchie typographique et le système de couleurs selon le sujet. Tons froids sans empattement pour les discussions techniques, couleurs neutres avec chiffres mis en avant pour les rapports business, dégradés/glassmorphism/micro-animations pour la créativité. Définissez toujours explicitement font-family et color ; ne vous fiez pas aux styles par défaut du navigateur."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Titre du widget (30 caractères max), par exemple Flux de statut de commande"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "Le SVG doit commencer par <svg ; les fragments HTML doivent commencer par l'élément racine et ne pas inclure <html><body>. Maximum 200 Ko ; <script src=...> uniquement depuis des CDN de confiance. Ne transmettez pas de syntaxe Mermaid (flowchart/graph/sequenceDiagram, etc.) ; produisez Mermaid sous forme de bloc de code ```mermaid dans la réponse"
"Placeholder text shown while loading (optional)": "Texte d'espace réservé affiché pendant le chargement (facultatif)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Indication de thème : light / dark / auto (suivre le système). Le HTML généré doit choisir ses couleurs de fond et de texte en conséquence ; non transmis au moteur de rendu frontend"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Hauteur initiale du widget en px (80-1200). Par défaut 480. Utilisez 300-400 pour des cartes compactes et 600-800 pour de grands graphiques"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Mode d'arrière-plan : solid (par défaut) / transparent (pour superposer des captures sur un modèle PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Mode diapositive PPT. Si true, la carte est rendue au format 16:9, prête à être collée dans une présentation. Par défaut false, ce qui conserve une largeur adaptée au contenu"
"Section heading text, e.g. Completed this week": "Texte du titre de section, par exemple Terminé cette semaine"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Niveau de titre : 1 = niveau 1 (le plus grand), 2 = niveau 2, 3 = niveau 3 ; par défaut 1"
"Body paragraph text (optional; used together with elements)": "Texte du paragraphe de corps (facultatif ; utilisé avec elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Tableau d'éléments structurés (facultatif) : paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Type d'élément : paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Contenu texte (utilisé quand type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Tableau d'éléments de liste (utilisé quand type=bullet_list ou ordered_list)"
"Table header row (required when type=table)": "Ligne d'en-tête du tableau (obligatoire quand type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Lignes de données du tableau (obligatoires quand type=table) ; chaque ligne est un tableau de valeurs de cellules, par exemple [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Style du tableau (facultatif pour type=table) : headerBgColor (fond d'en-tête), headerFontColor (couleur du texte d'en-tête), stripeColor (lignes alternées)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL de l'image (obligatoire quand type=image) ; prend en charge les liens externes https:// ou les pièces jointes internes comme /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Largeur de l'image en centimètres (type=image) ; par défaut 14 cm"
"Image height in centimeters (type=image); default 10cm": "Hauteur de l'image en centimètres (type=image) ; par défaut 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Indique si le texte est en gras (facultatif pour type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Indique si le texte est en italique (facultatif pour type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Indique si le texte est souligné (facultatif pour type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Taille de police en points, par exemple 12 (facultatif pour type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Couleur du texte (RVB hexadécimal, par exemple 2563EB ; facultatif pour type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Alignement du texte : left/center/right/justify (facultatif pour type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Couleur de fond du paragraphe (RVB hexadécimal, par exemple EFF6FF ; facultatif pour type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Variante d'encadré (type=callout) : info (bleu) / success (vert) / warning (jaune) / danger (rouge) ; par défaut info"
"KPI value (required when type=kpi), e.g. 17.68M": "Valeur KPI (obligatoire quand type=kpi), par exemple 17,68 M"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Libellé KPI (facultatif quand type=kpi), par exemple croissance d'un mois sur l'autre"
"KPI trend (optional when type=kpi): up / down / flat": "Tendance KPI (facultatif quand type=kpi) : up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Source de la citation (facultatif quand type=quote), par exemple Rapport annuel 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Langage du code (facultatif quand type=code), par exemple sql/python/javascript ; sélectionne les couleurs de coloration syntaxique"
"Worksheet name, e.g. Q2 Data": "Nom de la feuille, par exemple Données Q2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Tableau des en-têtes de colonnes, par exemple [\"Date\",\"Revenus\",\"Variation\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Lignes de données (tableau 2D) ; chaque ligne est un tableau de valeurs de cellules, par exemple [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Style d'en-tête (facultatif) : headerBgColor (fond d'en-tête), headerFontColor (couleur du texte d'en-tête), stripeColor (lignes alternées)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Tableau des largeurs de colonnes (facultatif), par exemple [12, 20, 15] ; les valeurs sont des largeurs approximatives en caractères"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Format numérique (facultatif), par exemple \"#,##0.00\" ou \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Tableau de mises en forme conditionnelles (facultatif). Champs de chaque élément : range (par exemple \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (couleur principale), value (seuil)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Tableau de définitions de graphiques (facultatif) : type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Nombre de lignes supérieures figées (0 = aucune, 1 = figer la première ligne ; par défaut 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Plage du filtre automatique (par exemple \"A1:E1\") ; désactivé si vide"
"Dropdown validation array (optional)": "Tableau de validations par liste déroulante (facultatif)"
"Applied range (e.g. \"C2:C10\")": "Plage appliquée (par exemple \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Type de condition : dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Couleur (RVB hexadécimal, par exemple 2563EB) utilisée pour les barres de données, échelles de couleurs ou mises en évidence"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Seuil ou formule (par exemple 1000 ou =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Type de graphique : bar / line / pie"
"Chart title (optional)": "Titre du graphique (facultatif)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Tableau de libellés d'axe des catégories, par exemple [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Tableau de séries de données ; chaque élément a name et data"
"Applied range (e.g. \"A2:A100\")": "Plage appliquée (par exemple \"A2:A100\")"
"Dropdown option array": "Tableau des options de la liste déroulante"
"Title of this slide": "Titre de cette diapositive"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Disposition de la diapositive : title_only (titre seul, pour les couvertures) / title_content (titre + corps, par défaut) / two_column (deux colonnes) / chart_only (graphique pleine largeur) / blank (zone vide)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Couleur de fond de la diapositive, RVB hexadécimal tel que \"1F497D\" ; si omis, le fond du thème est utilisé"
"Slide element list; each element describes a text block, table, chart, or image": "Liste des éléments de la diapositive ; chaque élément décrit un bloc de texte, un tableau, un graphique ou une image"
"Footer text displayed at the bottom of the slide; null hides it": "Texte de pied de page affiché en bas de la diapositive ; null le masque"
"Whether to show the slide number in the bottom-right corner; default false": "Indique s'il faut afficher le numéro de diapositive en bas à droite ; par défaut false"
"Speaker notes used as a reminder while presenting": "Notes du présentateur servant de rappel pendant la présentation"
"Transition animation: fade / push / wipe / zoom / split / cut": "Animation de transition : fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Type d'élément : text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Rôle sémantique (éléments text uniquement) : title / subtitle / body / caption / kpi. Le moteur de mise en page l'utilise pour positionner l'élément automatiquement, aucune coordonnée n'est nécessaire"
"Text content (required when type=text)": "Contenu texte (obligatoire quand type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Taille de police en points (facultatif) ; si omis, le moteur de mise en page en choisit une selon le role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Indique si le texte est en gras ; par défaut false"
"Whether the text is italic (optional for type=text); default false": "Indique si le texte est en italique (facultatif pour type=text) ; par défaut false"
"Whether the text is underlined (optional for type=text); default false": "Indique si le texte est souligné (facultatif pour type=text) ; par défaut false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Couleur du texte, RVB hexadécimal tel que \"FFFFFF\" ; si omis, la couleur de texte du thème est héritée"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Tableau d'en-têtes du tableau (obligatoire quand type=table), par exemple [\"Indicateur\",\"Q1\",\"Q2\",\"Variation\"]"
"Chart type (required when type=chart): bar / line / pie": "Type de graphique (obligatoire quand type=chart) : bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Libellés de catégories du graphique (obligatoires quand type=chart), par exemple [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Séries de données (obligatoires quand type=chart) ; chaque élément a name (nom de la série) et data (tableau de nombres)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Alignement du texte (éléments text) : l (gauche) / ctr (centre) / r (droite)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Couleur de fond de la zone de texte (éléments text), RVB hexadécimal tel que \"EFF6FF\" ; transparent si vide"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Segments de texte enrichi (éléments text) ; s'ils sont présents, Content/FontSize/Bold/Color sont ignorés"
"Shape configuration (required when type=shape)": "Configuration de la forme (obligatoire quand type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Style du tableau (facultatif pour type=table) : headerBgColor (fond d'en-tête), headerFontColor (couleur du texte d'en-tête), stripeColor (lignes alternées)"
"Text content": "Contenu texte"
"Font size in points; 0 inherits the text box default": "Taille de police en points ; 0 hérite de la valeur par défaut de la zone de texte"
"Whether the text is bold": "Indique si le texte est en gras"
"Whether the text is italic": "Indique si le texte est en italique"
"Whether the text is underlined": "Indique si le texte est souligné"
"Text color, hex RGB such as \"FF6B6B\"": "Couleur du texte, RVB hexadécimal tel que \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL du lien hypertexte ; s'il est défini, le segment devient cliquable"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Type de forme : rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Couleur de remplissage (RVB hexadécimal, par exemple 2563EB) ; null signifie aucun remplissage"
"Border color (hex RGB); null means no border": "Couleur de bordure (RVB hexadécimal) ; null signifie aucune bordure"
"Text displayed inside the shape (optional)": "Texte affiché à l'intérieur de la forme (facultatif)"
"Text color inside the shape (hex RGB)": "Couleur du texte à l'intérieur de la forme (RVB hexadécimal)"
"Font size of the text inside the shape (points); 0 means default": "Taille de police du texte à l'intérieur de la forme (points) ; 0 signifie la valeur par défaut"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Couleur de fond de la ligne d'en-tête (RVB hexadécimal, par exemple 2563EB) ; si omis, aucun style particulier n'est appliqué"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "Couleur du texte de la ligne d'en-tête (RVB hexadécimal, par exemple FFFFFF) ; si omis, la valeur par défaut est héritée"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "Couleur des lignes alternées (fond des lignes de données paires, par exemple EFF6FF bleu clair) ; si omis, aucune rayure n'est dessinée"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "ID unique de colonne (obligatoire), par exemple \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "Titre de la colonne (obligatoire, 20 caractères max)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "Couleur du titre de colonne (facultatif), hexadécimal, par exemple \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "Limite WIP (facultatif) ; le titre de la colonne devient rouge en cas de dépassement"
"Card array (required)": "Tableau de cartes (obligatoire)"
"Unique card ID (required)": "ID unique de la carte (obligatoire)"
"Card title (required, up to 40 characters)": "Titre de la carte (obligatoire, 40 caractères max)"
"Supplementary description (optional, up to 100 characters)": "Description complémentaire (facultatif, 100 caractères max)"
"Priority (optional): high | medium | low": "Priorité (facultatif) : high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "Tableau de chaînes d'étiquettes (facultatif), par exemple [\"design\",\"frontend\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "Échéance (facultatif), ISO 8601 tel que \"2026-07-15\""
"Assignee name (optional)": "Nom du responsable (facultatif)"
"Subtask checklist (optional); each item has title and done": "Checklist de sous-tâches (facultatif) ; chaque élément a title et done"
"Completion progress (optional), 0-100": "Progression en pourcentage (facultatif), 0-100"
"Related link URL (optional)": "URL du lien associé (facultatif)"
"Subtask title": "Titre de la sous-tâche"
"Whether the subtask is done": "Indique si la sous-tâche est terminée"
"Unique swimlane ID (required)": "ID unique du couloir (obligatoire)"
"Swimlane title (required)": "Titre du couloir (obligatoire)"
"Column ID array contained in this swimlane (required)": "Tableau des ID de colonnes contenus dans ce couloir (obligatoire)"
"City or place name (required), e.g. Beijing": "Nom de ville ou de lieu (obligatoire), par exemple Pékin"
"Latitude (required), WGS84 decimal degrees": "Latitude (obligatoire), degrés décimaux WGS84"
