"Marker label text (optional); supports \\n line breaks": "Texte d'étiquette du marqueur (facultatif) ; prend en charge \\\\n pour le retour à la ligne"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "Couleur du marqueur (facultatif), hexadécimal tel que \"#E74C3C\" ; si omis, les couleurs alternent selon le jeu de couleurs"
