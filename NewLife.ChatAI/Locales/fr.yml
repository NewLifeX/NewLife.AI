"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "Nom de la province (obligatoire) ; accepte le nom chinois de la province (complet ou abrégé), par exemple Guangdong"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "Couleur de mise en évidence (facultatif), hexadécimal tel que \"#FFB347\" ; par défaut la couleur de la palette"
"Highlight label (optional), e.g. No.1 GDP": "Libellé de mise en évidence (facultatif), par exemple N°1 PIB"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "Date de l'événement (obligatoire) ; tout format, par exemple \"2024-01\", \"2024 Q3\" ou \"Phase 1\""
"Event title (required, up to 30 characters)": "Titre de l'événement (obligatoire, 30 caractères max)"
"Supplementary description (optional, up to 80 characters)": "Description complémentaire (facultatif, 80 caractères max)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "Couleur hexadécimale (facultatif), par exemple \"#5470c6\" ; si omis, la palette alterne automatiquement"
"Event category label (optional), e.g. Milestone, Release, Issue": "Libellé de catégorie de l'événement (facultatif), par exemple Jalon, Version, Problème"
