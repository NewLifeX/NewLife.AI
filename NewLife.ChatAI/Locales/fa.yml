"Regenerate context is missing the user message. AssistantMessage.Id={0}, HistoryMessages.Count={1}, beforeMessages.Count={2}": "زمینه تولید مجدد پیام کاربر را ندارد. AssistantMessage.Id={0}، HistoryMessages.Count={1}، beforeMessages.Count={2}"
"Handler {0} failed: {1}": "پردازشگر {0} ناموفق بود: {1}"
"Failed to regenerate the reply: {0}": "تولید مجدد پاسخ ناموفق بود: {0}"
"Background generation completion callback failed: {0}": "فراخوانی پایان تولید پس‌زمینه ناموفق بود: {0}"
"Handler [{0}] OnBefore failed: {1}": "Handler [{0}] OnBefore ناموفق بود: {1}"
"Handler [{0}] OnAfter failed: {1}": "Handler [{0}] OnAfter ناموفق بود: {1}"
"Handler [{0}] OnBefore failed (non-streaming): {1}": "Handler [{0}] OnBefore ناموفق بود (غیرجریانی): {1}"
"Handler [{0}] OnAfter failed (non-streaming): {1}": "Handler [{0}] OnAfter ناموفق بود (غیرجریانی): {1}"
"Streaming generation failed: {0}": "تولید جریانی ناموفق بود: {0}"
"LLM context is missing the user message; skipping the call. ContextMessages.Count={0}": "زمینه LLM پیام کاربر را ندارد؛ فراخوانی نادیده گرفته می‌شود. ContextMessages.Count={0}"
"Context window budget exceeded; interrupting the tool call loop": "بودجه پنجره زمینه بیش از حد شد؛ حلقه فراخوانی ابزار متوقف می‌شود"
"Upstream rate limited (429), retry {0}, waiting {1}ms": "محدودیت نرخ بالادست (429)، تلاش {0}، انتظار {1}ms"
"Upstream error {0}, retry {1}": "خطای بالادست {0}، تلاش {1}"
"Failed to pre-create gateway conversation: {0}": "پیش‌ایجاد گفتگوی دروازه ناموفق بود: {0}"
"Failed to record gateway conversation: {0}": "ثبت گفتگوی دروازه ناموفق بود: {0}"
"Failed to save gateway attachment: {0}": "ذخیره پیوست دروازه ناموفق بود: {0}"
"Name cannot be empty": "نام نمی‌تواند خالی باشد"
"Name '{0}' already exists": "نام '{0}' از قبل وجود دارد"
"Embedded resource china-map.svg was not found; make sure the csproj contains <EmbeddedResource Include=\"Resources\\china-map.svg\" />": "منبع توکار china-map.svg یافت نشد؛ مطمئن شوید csproj شامل <EmbeddedResource Include=\"Resources\\china-map.svg\" /> است"
"The message does not exist or the role does not match": "پیام وجود ندارد یا نقش مطابقت ندارد"
"The conversation does not exist": "گفتگو وجود ندارد"
"Model '{0}' is unavailable": "مدل '{0}' در دسترس نیست"
"No model is available; configure and enable at least one model in the admin console first": "هیچ مدلی در دسترس نیست؛ لطفاً ابتدا حداقل یک مدل را در کنسول مدیریت پیکربندی و فعال کنید"
"Invalid parameter: sections cannot be empty": "پارامتر نامعتبر: sections نمی‌تواند خالی باشد"
"Invalid parameter: sheets cannot be empty": "پارامتر نامعتبر: sheets نمی‌تواند خالی باشد"
"MCP tool not found: '{0}'": "ابزار MCP یافت نشد: '{0}'"
"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "یک سند Word ‏(.docx) می‌سازد و پیوند دانلود برمی‌گرداند. عنوان‌ها، بندها، فهرست‌ها، جدول‌ها، تصاویر، شکست صفحه، جداکننده‌ها، کادرهای برجسته، کارت‌های KPI، نقل‌قول‌ها و بلوک‌های کد را پشتیبانی می‌کند. آرایهٔ JSON با نام sections هر بخش را با heading و content و elements توصیف می‌کند"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "عنوان سند (حداکثر ۳۰ نویسه)، مانند گزارش سه‌ماههٔ دوم"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "آرایهٔ بخش‌ها (JSON). فیلدهای هر بخش: heading (عنوان بخش)، headingLevel (۱ تا ۳، پیش‌فرض ۱)، content (بند متنی، اختیاری)، elements (آرایهٔ عناصر، اختیاری). انواع عناصر: paragraph ({type,text,اختیاری bold/italic/underline/fontSize/color/alignment/backgroundColor})، bullet_list ({type,items})، ordered_list ({type,items})، table ({type,headers,rows,اختیاری tableStyle}؛ rows آرایهٔ دوبعدی است و هر سطر آرایهٔ مقادیر خانه‌هاست، مانند [[\"Alice\",\"85\"],[\"Bob\",\"92\"]])، image ({type,src,widthCm?,heightCm?})، page_break ({type})، divider ({type})، callout ({type,text,variant?=info/success/warning/danger})، kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat})، quote ({type,text,quoteSource?})، code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "پوسته (اختیاری): کلید سبک کارت (مانند enterprise-blue) یا نام داخلی (blue/dark/corporate/warm/green/minimal)؛ اگر حذف شود، سبک گفتگو یا پیش‌فرض برند استفاده می‌شود"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "یک کاربرگ Excel ‏(.xlsx) می‌سازد و پیوند دانلود برمی‌گرداند. چند برگه، سبک سرصفحه، عرض ستون‌ها، قالب‌های عددی، قالب‌بندی شرطی، ثابت کردن پنجره‌ها، پالایش خودکار و اعتبارسنجی فهرست کشویی را پشتیبانی می‌کند. پارامتر theme کلید سبک کارت یا نام داخلی (blue/dark/corporate/warm/green/minimal) را می‌پذیرد"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "عنوان کاربرگ (حداکثر ۳۰ نویسه)، مانند گزارش درآمد سه‌ماههٔ دوم"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "آرایهٔ برگه‌ها (JSON). فیلدهای هر برگه: name و headers (آرایهٔ سرصفحه‌ها) و rows (آرایهٔ دوبعدی؛ هر سطر آرایهٔ مقادیر خانه‌هاست، مانند [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]) و style ({headerBgColor,headerFontColor,stripeColor}) و columnWidths (مانند [12,20,15]) و numberFormat (مانند \"#,##0.00\" یا \"yyyy-MM-dd\") و conditionalFormats (آرایهٔ {range,type,color,value?}؛ type مقادیر dataBar/colorScale/greaterThan و مانند آن را پشتیبانی می‌کند) و charts (آرایهٔ نمودارها) و freezeRows (تعداد سطرهای ثابت‌شده) و autoFilter (محدودهٔ پالایش) و dropdowns (اعتبارسنجی فهرست کشویی)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "پوسته (اختیاری): کلید سبک کارت (مانند enterprise-blue) یا نام داخلی (blue/dark/corporate/warm/green/minimal) که سرصفحه و رنگ‌های کلی را کنترل می‌کند؛ اگر حذف شود، سبک گفتگو یا پیش‌فرض برند استفاده می‌شود"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "یک ارائهٔ PowerPoint ‏(.pptx) می‌سازد و پیوند دانلود برمی‌گرداند. دو حالت ورودی ناسازگار با هم: (۱) حالت slides که در آن هوش مصنوعی محتوای ساخت‌یافته را توصیف می‌کند و چیدمان به‌طور خودکار ساخته می‌شود؛ (۲) حالت widgetSrc که کارت‌های show_widget ساخته‌شده را به‌صورت تصویر اسلاید جاسازی می‌کند. پارامتر theme کلید سبک کارت (مانند enterprise-blue/raycast-dark/ppt-executive) یا نام داخلی (blue/dark/green/warm/corporate/minimal) را می‌پذیرد."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "عنوان ارائه (حداکثر ۳۰ نویسه)، مانند مرور سه‌ماههٔ دوم"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "آرایهٔ اسلایدها (JSON). یک عنصر = یک اسلاید، چند عنصر = ارائهٔ کامل. ناسازگار با widgetSrc. فیلدهای هر اسلاید: title و layout (title_only/title_content/two_column/chart_only/blank) و background (رنگ شانزده‌شانزدهی) و footer و showPageNumber (true/false) و elements (فهرست عناصر) و notes و transition. elements این موارد را پشتیبانی می‌کند: text (role=title/subtitle/body/kpi/caption؛ اختیاری bold/italic/underline/alignment=l/ctr/r/backgroundColor/color)، table (headers+rows؛ rows آرایهٔ دوبعدی و هر سطر آرایهٔ مقادیر خانه‌هاست، مانند [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]؛ اختیاری tableStyle={headerBgColor/headerFontColor/stripeColor})، chart (chartType=bar/line/pie/area/scatter+categories+series)، image (src)، shape (shape={shapeType,fillColor,lineColor,text,fontColor}). نمونه: [{\"title\":\"جلد\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"مرور سه‌ماههٔ دوم\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"تیم NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "فهرست شناسه‌های کارت show_widget جدا‌شده با کاما، مانند 'call_abc123,call_def456'. ناسازگار با slides. کارت‌های ساخته‌شده را به تصویر اسلاید تبدیل می‌کند"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "پوسته (اختیاری): کلید سبک کارت (مانند enterprise-blue/ppt-executive) یا نام داخلی (blue/dark/corporate/warm/green/minimal و مانند آن)؛ اگر حذف شود، سبک گفتگو یا پیش‌فرض برند استفاده می‌شود"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "داده‌ها را به‌صورت نمودار تعاملی نمایش می‌دهد (بزرگ‌نمایی، نگه‌داشتن نشانگر، خروجی تصویر). حدود ۲۰ برابر سریع‌تر از show_widget است: یک مشخصات JSON (حدود ۲۰۰ توکن) کافی است و رابط کاربری آن را بی‌درنگ با ECharts رسم می‌کند. انواع پشتیبانی‌شده: bar، line (خط/ناحیه)، pie (دایره/حلقه)، scatter، radar، map_china (نقشهٔ حرارتی استان‌های چین)، heatmap (نقشهٔ حرارتی ماتریسی)، gauge، funnel، treemap. برای مقایسه‌های عددی، سری‌های زمانی (خط)، تحلیل سهم و توزیع جغرافیایی مناسب است. توجه: برای مسیرها، رویدادهای تاریخی، نقاط عطف و خط زمان از show_timeline استفاده کنید؛ این ابزار نوع timeline را پشتیبانی نمی‌کند. سبک بصری: پالت رنگ را از طریق data.colors بدهید و به پیش‌فرض‌های ECharts تکیه نکنید. پیشنهادها: رنگ برند برای یک سری، سایه‌های با فاصلهٔ یکسان (۱۰ تا ۱۲ رنگ) برای چند سری، رنگ‌های مکمل برای مقایسه، گرادیان تک‌رنگ برای روندها. آبی و طلایی برای مالی، آبی/سبز/سفید برای سلامت، بنفش/آبی/فیروزه‌ای برای فناوری و هوش مصنوعی. برای مجموعه‌داده‌های بزرگ data.animation=false را تنظیم کنید تا هزینهٔ رندر کاهش یابد."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "نوع نمودار: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "عنوان نمودار (حداکثر ۳۰ نویسه)، مانند تولید ناخالص داخلی به تفکیک استان ۲۰۲۴"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "شیء JSON؛ ساختار آن در توصیف ابزار آمده است. نمونهٔ bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"درآمد\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}؛ نمونهٔ radar چندسری: {\"indicators\":[{\"name\":\"سرعت\",\"max\":100},{\"name\":\"قدرت\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}؛ شرط radar: تعداد indicators باید با طول هر series[i].data برابر باشد و data فقط باید عدد داشته باشد"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "جزئیات کاربر وارد‌شده را برمی‌گرداند، شامل نام کاربری، نام نمایشی، ایمیل، موبایل، کد، نقش‌ها، بخش، جنسیت، سن، تاریخ تولد و یادداشت‌ها، به‌همراه نشانی IP، شهر و موقعیت جغرافیایی دقیق بازدیدکننده"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "طرح‌وارهٔ جدول‌های پایگاه داده را با کلیدواژه جستجو می‌کند. نتیجه دو بخش دارد: (۱) نقشهٔ جدول-اتصال (جدول Markdown که نشان می‌دهد هر جدول به کدام اتصال تعلق دارد؛ جدول‌های هم‌نام در اتصال‌های مختلف جداگانه فهرست می‌شوند)؛ (۲) طرح‌وارهٔ XML جدول‌ها برای هر اتصال. فراخوانی‌های بعدی run_sql باید از نام اتصال در جدول نقشه استفاده کنند"
"Search keywords, separated by commas or spaces": "کلیدواژه‌های جستجو جدا‌شده با کاما یا فاصله"
"Restrict to a connection name; empty searches all connections": "محدود کردن به نام اتصال؛ خالی یعنی جستجو در همهٔ اتصال‌ها"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "دستور SQL را روی اتصال پایگاه دادهٔ مشخص‌شده اجرا می‌کند. پرس‌وجوهای SELECT/WITH سطرها را برمی‌گردانند؛ دستورهای غیرپرس‌وجو مانند INSERT/UPDATE/DELETE تعداد سطرهای تحت تأثیر را برمی‌گردانند. connName باید با ستون اتصال بازگشتی از search_table مطابقت داشته باشد"
"Database connection name (from the connection column of search_table)": "نام اتصال پایگاه داده (از ستون اتصال search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "دستور SQL. SELECT/WITH مجموعهٔ نتیجه را برمی‌گرداند؛ دستورهای غیرپرس‌وجو تعداد سطرهای تحت تأثیر را برمی‌گردانند"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "تاریخ تقویم قمری، اصطلاح خورشیدی و وضعیت روز کاری (روز کاری/تعطیل/روز جبرانی) را برای یک تاریخ مشخص جستجو می‌کند"
"Date to query in yyyy-MM-dd format. Defaults to today": "تاریخ مورد نظر با قالب yyyy-MM-dd. پیش‌فرض امروز"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "کارها را به‌صورت تختهٔ Kanban چندستونه نمایش می‌دهد (مانند انجام‌نشده -> در حال انجام -> انجام‌شده). برای تقسیم فازهای پروژه، برنامه‌ریزی Sprint، نمایش گردش کار و دسته‌بندی وضعیت کارها مناسب است. هر ستون می‌تواند برچسب رنگی و محدودیت WIP داشته باشد؛ هر کارت می‌تواند عنوان، توضیح، اولویت، برچسب‌ها، مهلت، مسئول، فهرست زیرکارها، پیشرفت و پیوند داشته باشد. دو چیدمان: board (تختهٔ چندستونهٔ پیش‌فرض) و swimlane (ستون‌ها بر اساس تیم یا واحد گروه‌بندی می‌شوند)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "عنوان تخته (حداکثر ۳۰ نویسه)، مانند تختهٔ Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "آرایهٔ JSON تعریف ستون‌ها. نمونه: [{\"id\":\"todo\",\"title\":\"انجام‌نشده\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"تحلیل نیازمندی‌ها\",\"description\":\"جمع‌آوری نیازهای کاربران\",\"priority\":\"high\",\"tags\":[\"طراحی\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"مصاحبه با کاربران\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. همهٔ فیلدها به‌جز id و title اختیاری هستند"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "حالت چیدمان: board (تختهٔ چندستونهٔ پیش‌فرض) یا swimlane (ستون‌ها بر اساس تیم یا واحد گروه‌بندی می‌شوند؛ پارامتر swimlanes لازم است)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "آرایهٔ JSON تعریف خطوط (در حالت layout=swimlane استفاده می‌شود). نمونه: [{\"id\":\"sl1\",\"title\":\"تیم رابط کاربری\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"تیم بک‌اند\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "نقاط مختصات (شهرها یا نقاط دیدنی) را علامت می‌زند یا استان‌ها را روی نقشهٔ چین برجسته می‌کند، نقشهٔ SVG حاشیه‌نویسی‌شده می‌سازد و آن را در حباب گفتگو نمایش می‌دهد. پشتیبانی می‌کند از: (۱) رنگ‌آمیزی استان‌ها با رنگ‌های سفارشی؛ (۲) نشانگرهای WGS84 با عرض و طول جغرافیایی و متن برچسب؛ (۳) راهنمای خودکار در گوشهٔ پایین راست. کاربردهای معمول: توزیع داده بر اساس استان، موقعیت شهرها، نقشه‌های حرارتی فروش منطقه‌ای."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "عنوان نقشه (حداکثر ۳۰ نویسه)، مانند تولید ناخالص داخلی به تفکیک استان ۲۰۲۴"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "آرایهٔ JSON نشانگرها (می‌تواند آرایهٔ خالی [] باشد). قالب: [{\"name\":\"پکن\",\"lat\":39.9,\"lng\":116.4,\"label\":\"پکن\\n۴۳۷۶ میلیارد\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng بر حسب درجهٔ اعشاری WGS84؛ color/size اختیاری"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "آرایهٔ JSON برجسته‌سازی استان‌ها (می‌تواند آرایهٔ خالی [] باشد). قالب: [{\"name\":\"گوانگ‌دونگ\",\"color\":\"#FFB347\",\"label\":\"تولید ناخالص داخلی رتبهٔ یک\"}]. name نام استان را به چینی (کامل یا کوتاه) می‌پذیرد؛ label اختیاری"
"Legend title (optional), e.g. GDP scale": "عنوان راهنما (اختیاری)، مانند مقیاس تولید ناخالص داخلی"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "طرح رنگ (اختیاری): blue/orange/green/purple/red؛ پیش‌فرض blue"
"Marker style (optional): circle/pin/square; defaults to circle": "شکل نشانگر (اختیاری): circle/pin/square؛ پیش‌فرض circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "سلسله‌مراتب دانش یا روابط میان مفاهیم را به‌صورت نقشهٔ ذهنی تعاملی و تاشو نمایش می‌دهد. ورودی، طرح کلی Markdown ‏(# / ## / ###) است که رابط کاربری آن را به درخت بصری تبدیل می‌کند. برای سازمان‌دهی دانش، تجزیهٔ مفاهیم، مقایسهٔ فناوری‌ها، ارزیابی گزینه‌ها و خلاصه‌سازی محتوا مناسب است. سبک بصری: بسته به موضوع branchColors (۳ تا ۸ رنگ هماهنگ)، maxDepth (پیچیدگی) و collapsed (تاشدن اولیه برای تمرکز) را انتخاب کنید. برای فناوری و داده از رنگ‌های سرد (آبی/بنفش/فیروزه‌ای)، برای کسب‌وکار و بازاریابی از رنگ‌های گرم (نارنجی/طلایی/قرمز) و برای طبیعت و سلامت از سبز استفاده کنید. برای گره‌های متراکم maxDepth=2 را تنظیم کنید تا خوانایی حفظ شود. ۶ چیدمان: tree (پیش‌فرض، درخت دندانه‌دار، عمومی) / radial (شعاعی چپ-راست، بهترین برای نقشه‌های دانش) / lr (از مرکز به راست، نمودارهای گردش کار/درخت تصمیم) / rl (از مرکز به چپ، ردیابی معکوس) / tb (از مرکز به پایین، نمودارهای سازمانی) / bt (از مرکز به بالا، سلسله‌مراتب از پایین به بالا)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "عنوان نقشهٔ ذهنی (حداکثر ۳۰ نویسه)، مانند پشتهٔ فناوری هوش مصنوعی"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "طرح کلی Markdown با # / ## / ### برای سطوح ۱ تا ۳. نمونه:\n# هوش مصنوعی\n## یادگیری ماشین\n### یادگیری با نظارت\n### یادگیری بدون نظارت\n## یادگیری عمیق\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "حالت چیدمان: tree (پیش‌فرض، درخت دندانه‌دار، عمومی) / radial (شعاعی چپ-راست، بهترین برای نقشه‌های دانش) / lr (از مرکز به راست، نمودارهای گردش کار/درخت تصمیم) / rl (از مرکز به چپ، ردیابی معکوس) / tb (از مرکز به پایین، نمودارهای سازمانی) / bt (از مرکز به بالا، سلسله‌مراتب از پایین به بالا)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "آرایهٔ JSON رنگ شاخه‌ها، مانند [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. به‌ترتیب ۳ تا ۸ رنگ شانزده‌شانزدهی به شاخه‌های سطح اول اختصاص می‌دهد. اگر حذف شود، پالت پیش‌فرض آبی/بنفش، سبز، زرد، قرمز، فیروزه‌ای، سبز تیره، نارنجی و بنفش استفاده می‌شود"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "آرایهٔ JSON شناسهٔ گره‌هایی که در ابتدا تا می‌شوند، مانند [\"n2\",\"n5\"]. خالی یعنی همه باز شوند. برای تمرکز بر شاخه‌های مهم استفاده می‌شود"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "حداکثر عمق نمایش: ۱ = فقط شاخه‌های سطح اول، ۲ = دو سطح، پیش‌فرض بی‌محدودیت. برای گره‌های متراکم ۲ را تنظیم کنید تا خوانایی حفظ شود"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "داده‌های سری زمانی را به‌صورت کارت‌های زیبای خط زمان نمایش می‌دهد. JSON (حدود ۱۰۰ توکن) کافی است و رابط کاربری بی‌درنگ آن را نمایش می‌دهد. برای نقاط عطف پروژه، رویدادهای تاریخی، برنامه‌های انتشار و تاریخچهٔ توسعه مناسب است. هر رویداد می‌تواند تاریخ، عنوان، توضیح، رنگ و دسته داشته باشد. سبک بصری: پالت کلی را از طریق پارامتر palette تنظیم کنید (مانند گرادیان آبی-بنفش، برنز گرم، رنگ‌های برند) تا خط زمان ظاهری یکدست داشته باشد؛ item.color یک آیتم را جایگزین می‌کند. برای پنج رویداد گزیده یا کمتر density=relaxed و برای ده یا بیشتر density=compact استفاده کنید. ۸ چیدمان: vertical (۵ تا ۲۰ آیتم) / alternating-top (یک‌درمیان بالا، ترتیب زمانی معکوس) / alternating-bottom (یک‌درمیان پایین، ترتیب زمانی) / horizontal-left (افقی به چپ، معکوس) / horizontal-right (افقی به راست، ترتیب زمانی) / s-curve (منحنی S، ۸ آیتم یا کمتر) / fishbone-left (استخوان ماهی به چپ، معکوس) / fishbone-right (استخوان ماهی به راست، ترتیب زمانی)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "عنوان خط زمان (حداکثر ۳۰ نویسه)، مانند نقاط عطف محصول"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "آرایهٔ JSON رویدادهای خط زمان. نمونه: [{\"date\":\"2024-01\",\"title\":\"انتشار v1.0\",\"description\":\"معرفی ویژگی‌های اصلی\",\"color\":\"#5470c6\",\"category\":\"نقطهٔ عطف\"}]. description/color/category اختیاری هستند"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "حالت چیدمان: vertical / alternating-top (یک‌درمیان بالا، معکوس) / alternating-bottom (یک‌درمیان پایین، ترتیب زمانی) / horizontal-left (افقی، معکوس) / horizontal-right (افقی، ترتیب زمانی) / s-curve / fishbone-left (استخوان ماهی، معکوس) / fishbone-right (استخوان ماهی، ترتیب زمانی)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "آرایهٔ JSON پالت کلی، مانند [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. چرخش پیش‌فرض هشت‌رنگه را جایگزین می‌کند. item.color اولویت دارد"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "فاصلهٔ آیتم‌ها: compact (۱۲px) / normal (۲۰px، پیش‌فرض) / relaxed (۳۲px). relaxed برای پنج رویداد گزیده یا کمتر و compact برای ده یا بیشتر مناسب است"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "یک قطعهٔ SVG یا HTML را درون حباب گفتگو نمایش می‌دهد. برای خط زمان و نمودارهای رابطه (SVG)، پیش‌نمایش فرم و کارت‌های داده (HTML) و نمودارهای آماری (SVG) از آن استفاده کنید. برای نمودارهای Mermaid از آن استفاده نکنید؛ Mermaid را به‌صورت بلوک کد ```mermaid در پاسخ ارائه دهید. محدودیت‌ها: حداکثر ۲۰۰ کیلوبایت؛ <script src=...> فقط از CDN معتبر. سبک بصری: معماری اطلاعات (Bento/جریان کارت/Grid)، سلسله‌مراتب تایپوگرافی و سیستم رنگ را بسته به موضوع انتخاب کنید. لحن‌های سرد بدون گوشه برای بحث‌های فنی، رنگ‌های خنثی با اعداد برجسته برای گزارش‌های تجاری، گرادیان/افکت شیشه‌ای/انیمیشن‌های ظریف برای کارهای خلاقانه. همیشه font-family و color را صریحاً مشخص کنید؛ به سبک‌های پیش‌فرض مرورگر تکیه نکنید."
"Widget title (up to 30 characters), e.g. Order Status Flow": "عنوان ویجت (حداکثر ۳۰ نویسه)، مانند جریان وضعیت سفارش"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG باید با <svg شروع شود؛ قطعه‌های HTML باید با عنصر ریشه آغاز شوند و نباید <html><body> داشته باشند. حداکثر ۲۰۰ کیلوبایت؛ <script src=...> فقط از CDN معتبر. نحو Mermaid ‏(flowchart/graph/sequenceDiagram و مانند آن) را منتقل نکنید؛ Mermaid را به‌صورت بلوک کد ```mermaid در پاسخ ارائه دهید"
"Placeholder text shown while loading (optional)": "متن جانگهدار که هنگام بارگیری نمایش داده می‌شود (اختیاری)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "راهنمای پوسته: light / dark / auto (بر اساس سیستم). HTML تولیدشده باید رنگ پس‌زمینه و متن را بر این اساس انتخاب کند؛ به نمایشگر رابط کاربری منتقل نمی‌شود"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "ارتفاع اولیهٔ ویجت بر حسب پیکسل (۸۰ تا ۱۲۰۰). پیش‌فرض ۴۸۰. برای کارت‌های فشرده ۳۰۰ تا ۴۰۰ و برای نمودارهای بزرگ ۶۰۰ تا ۸۰۰ استفاده کنید"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "حالت پس‌زمینه: solid (پیش‌فرض) / transparent (برای چسباندن تصاویر صفحه‌نمایش روی قالب PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "حالت اسلاید PPT. وقتی true باشد کارت با نسبت ۱۶:۹ و آمادهٔ چسباندن در ارائه نمایش داده می‌شود. پیش‌فرض false که بر اساس محتوا نمایش می‌دهد"
"Section heading text, e.g. Completed this week": "متن عنوان بخش، مانند آنچه این هفته انجام شد"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "سطح عنوان: ۱ = سطح اول (بزرگ‌ترین)، ۲ = سطح دوم، ۳ = سطح سوم؛ پیش‌فرض ۱"
"Body paragraph text (optional; used together with elements)": "بند متنی (اختیاری؛ همراه با elements استفاده می‌شود)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "آرایهٔ عناصر ساخت‌یافته (اختیاری): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "نوع عنصر: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "محتوای متن (وقتی type=paragraph/callout/quote/code باشد استفاده می‌شود)"
"List item array (used when type=bullet_list or ordered_list)": "آرایهٔ آیتم‌های فهرست (وقتی type=bullet_list یا ordered_list باشد استفاده می‌شود)"
"Table header row (required when type=table)": "سطر سرصفحهٔ جدول (وقتی type=table باشد الزامی است)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "سطرهای دادهٔ جدول (وقتی type=table باشد الزامی است)؛ هر سطر آرایهٔ مقادیر خانه‌هاست، مانند [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "سبک جدول (وقتی type=table باشد اختیاری): headerBgColor (پس‌زمینهٔ سرصفحه)، headerFontColor (رنگ متن سرصفحه)، stripeColor (سطرهای یک‌درمیان)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "نشانی تصویر (وقتی type=image باشد الزامی است)؛ پیوندهای بیرونی https:// یا پیوست‌های داخلی مانند /cube/image?id=xxx را پشتیبانی می‌کند"
"Image width in centimeters (type=image); default 14cm": "عرض تصویر بر حسب سانتی‌متر (type=image)؛ پیش‌فرض ۱۴ سانتی‌متر"
"Image height in centimeters (type=image); default 10cm": "ارتفاع تصویر بر حسب سانتی‌متر (type=image)؛ پیش‌فرض ۱۰ سانتی‌متر"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "آیا متن پررنگ است (وقتی type=paragraph/callout/quote باشد اختیاری)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "آیا متن کج است (وقتی type=paragraph/callout/quote باشد اختیاری)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "آیا متن زیرخط دارد (وقتی type=paragraph/callout/quote باشد اختیاری)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "اندازهٔ قلم بر حسب پوینت، مانند ۱۲ (وقتی type=paragraph/callout باشد اختیاری)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "رنگ متن (RGB شانزده‌شانزدهی، مانند 2563EB؛ وقتی type=paragraph/callout/quote باشد اختیاری)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "ترازبندی متن: left/center/right/justify (وقتی type=paragraph باشد اختیاری)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "رنگ پس‌زمینهٔ بند (RGB شانزده‌شانزدهی، مانند EFF6FF؛ وقتی type=paragraph باشد اختیاری)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "سبک کادر برجسته (type=callout): info (آبی) / success (سبز) / warning (زرد) / danger (قرمز)؛ پیش‌فرض info"
"KPI value (required when type=kpi), e.g. 17.68M": "مقدار KPI (وقتی type=kpi باشد الزامی است)، مانند ۱۷٬۶۸ میلیون"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "برچسب KPI (وقتی type=kpi باشد اختیاری)، مانند رشد نسبت به ماه گذشته"
"KPI trend (optional when type=kpi): up / down / flat": "روند KPI (وقتی type=kpi باشد اختیاری): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "منبع نقل‌قول (وقتی type=quote باشد اختیاری)، مانند گزارش سالانهٔ ۲۰۲۶"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "زبان کد (وقتی type=code باشد اختیاری)، مانند sql/python/javascript؛ رنگ‌آمیزی نحو را تعیین می‌کند"
"Worksheet name, e.g. Q2 Data": "نام برگهٔ کاری، مانند داده‌های سه‌ماههٔ دوم"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "آرایهٔ سرصفحهٔ ستون‌ها، مانند [\"تاریخ\",\"درآمد\",\"تغییر\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "سطرهای داده (آرایهٔ دوبعدی)؛ هر سطر آرایهٔ مقادیر خانه‌هاست، مانند [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "سبک سرصفحه (اختیاری): headerBgColor (پس‌زمینهٔ سرصفحه)، headerFontColor (رنگ متن سرصفحه)، stripeColor (سطرهای یک‌درمیان)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "آرایهٔ عرض ستون‌ها (اختیاری)، مانند [12, 20, 15]؛ مقادیر، عرض تقریبی بر حسب نویسه هستند"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "قالب عدد (اختیاری)، مانند \"#,##0.00\" یا \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "آرایهٔ قالب‌بندی شرطی (اختیاری). فیلدهای هر آیتم: range (مانند \"C2:C10\")، type (dataBar/colorScale/greaterThan/lessThan و مانند آن)، color (رنگ اصلی)، value (آستانه)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "آرایهٔ تعریف نمودارها (اختیاری): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "تعداد سطرهای بالای ثابت‌شده (۰ = هیچ، ۱ = ثابت کردن سطر اول؛ پیش‌فرض ۱)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "محدودهٔ پالایش خودکار (مانند \"A1:E1\")؛ وقتی خالی باشد غیرفعال است"
"Dropdown validation array (optional)": "آرایهٔ عملیات اعتبارسنجی فهرست کشویی (اختیاری)"
"Applied range (e.g. \"C2:C10\")": "محدودهٔ اعمال‌شده (مانند \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "نوع شرط: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "رنگ (RGB شانزده‌شانزدهی، مانند 2563EB) که برای نوارهای داده، مقیاس‌های رنگ یا برجسته‌سازی استفاده می‌شود"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "آستانه یا فرمول (مانند ۱۰۰۰ یا =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "نوع نمودار: bar / line / pie"
"Chart title (optional)": "عنوان نمودار (اختیاری)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "آرایهٔ برچسب‌های محور دسته، مانند [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "آرایهٔ سری‌های داده؛ هر آیتم شامل name و data است"
"Applied range (e.g. \"A2:A100\")": "محدودهٔ اعمال‌شده (مانند \"A2:A100\")"
"Dropdown option array": "آرایهٔ گزینه‌های فهرست کشویی"
"Title of this slide": "عنوان این اسلاید"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "چیدمان اسلاید: title_only (فقط عنوان، برای جلد) / title_content (عنوان + متن، پیش‌فرض) / two_column (دو ستون) / chart_only (نمودار تمام‌عرض) / blank (فضای خالی)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "رنگ پس‌زمینهٔ اسلاید، RGB شانزده‌شانزدهی مانند \"1F497D\"؛ اگر حذف شود، پس‌زمینهٔ پوسته استفاده می‌شود"
"Slide element list; each element describes a text block, table, chart, or image": "فهرست عناصر اسلاید؛ هر عنصر یک بلوک متن، جدول، نمودار یا تصویر را توصیف می‌کند"
"Footer text displayed at the bottom of the slide; null hides it": "متن پانویس که زیر اسلاید نمایش داده می‌شود؛ null آن را پنهان می‌کند"
"Whether to show the slide number in the bottom-right corner; default false": "آیا شمارهٔ اسلاید در گوشهٔ پایین راست نمایش داده شود؛ پیش‌فرض false"
"Speaker notes used as a reminder while presenting": "یادداشت‌های سخنران که در طول ارائه به‌عنوان یادآور استفاده می‌شوند"
"Transition animation: fade / push / wipe / zoom / split / cut": "افکت انتقال: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "نوع عنصر: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "نقش معنایی (فقط عناصر text): title / subtitle / body / caption / kpi. موتور چیدمان از آن برای جای‌گذاری خودکار عنصر استفاده می‌کند، بدون مختصات"
"Text content (required when type=text)": "محتوای متن (وقتی type=text باشد الزامی است)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "اندازهٔ قلم بر حسب پوینت (اختیاری)؛ اگر حذف شود، موتور چیدمان بر اساس role انتخاب می‌کند (title≈28، kpi≈44، body≈16)"
"Whether the text is bold; default false": "آیا متن پررنگ است؛ پیش‌فرض false"
"Whether the text is italic (optional for type=text); default false": "آیا متن کج است (وقتی type=text باشد اختیاری)؛ پیش‌فرض false"
"Whether the text is underlined (optional for type=text); default false": "آیا متن زیرخط دارد (وقتی type=text باشد اختیاری)؛ پیش‌فرض false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "رنگ متن، RGB شانزده‌شانزدهی مانند \"FFFFFF\"؛ اگر حذف شود، رنگ متن پوسته به ارث می‌رسد"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "آرایهٔ سرصفحهٔ جدول (وقتی type=table باشد الزامی است)، مانند [\"شاخص\",\"Q1\",\"Q2\",\"تغییر\"]"
"Chart type (required when type=chart): bar / line / pie": "نوع نمودار (وقتی type=chart باشد الزامی است): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "برچسب‌های دستهٔ نمودار (وقتی type=chart باشد الزامی است)، مانند [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "سری‌های داده (وقتی type=chart باشد الزامی است)؛ هر آیتم شامل name (نام سری) و data (آرایهٔ اعداد) است"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "ترازبندی متن (عناصر text): l (چپ) / ctr (وسط) / r (راست)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "رنگ پس‌زمینهٔ کادر متن (عناصر text)، RGB شانزده‌شانزدهی مانند \"EFF6FF\"؛ در صورت خالی بودن شفاف است"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "قطعه‌های متن قالب‌بندی‌شده (عناصر text)؛ در صورت وجود، Content/FontSize/Bold/Color نادیده گرفته می‌شود"
"Shape configuration (required when type=shape)": "پیکربندی شکل (وقتی type=shape باشد الزامی است)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "سبک جدول (وقتی type=table باشد اختیاری): headerBgColor (پس‌زمینهٔ سرصفحه)، headerFontColor (رنگ متن سرصفحه)، stripeColor (سطرهای یک‌درمیان)"
"Text content": "محتوای متن"
"Font size in points; 0 inherits the text box default": "اندازهٔ قلم بر حسب پوینت؛ ۰ یعنی ارث‌بری پیش‌فرض کادر متن"
"Whether the text is bold": "آیا متن پررنگ است"
"Whether the text is italic": "آیا متن کج است"
"Whether the text is underlined": "آیا متن زیرخط دارد"
"Text color, hex RGB such as \"FF6B6B\"": "رنگ متن، RGB شانزده‌شانزدهی مانند \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "نشانی ابرپیوند؛ وقتی تنظیم شود، قطعه قابل کلیک می‌شود"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "نوع شکل: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "رنگ پرکردن (RGB شانزده‌شانزدهی، مانند 2563EB)؛ null یعنی بدون پرکردن"
"Border color (hex RGB); null means no border": "رنگ حاشیه (RGB شانزده‌شانزدهی)؛ null یعنی بدون حاشیه"
"Text displayed inside the shape (optional)": "متنی که داخل شکل نمایش داده می‌شود (اختیاری)"
"Text color inside the shape (hex RGB)": "رنگ متن داخل شکل (RGB شانزده‌شانزدهی)"
"Font size of the text inside the shape (points); 0 means default": "اندازهٔ قلم متن داخل شکل (پوینت)؛ ۰ یعنی پیش‌فرض"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "رنگ پس‌زمینهٔ سطر سرصفحه (RGB شانزده‌شانزدهی، مانند 2563EB)؛ اگر حذف شود، سبک ویژه‌ای اعمال نمی‌شود"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "رنگ متن سطر سرصفحه (RGB شانزده‌شانزدهی، مانند FFFFFF)؛ اگر حذف شود، پیش‌فرض به ارث می‌رسد"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "رنگ سطرهای یک‌درمیان (پس‌زمینهٔ سطرهای زوج داده، مانند EFF6FF آبی روشن)؛ اگر حذف شود، نوارها رسم نمی‌شوند"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "شناسهٔ یکتای ستون (الزامی)، مانند \"todo\"، \"doing\"، \"done\""
"Column title (required, up to 20 characters)": "عنوان ستون (الزامی، حداکثر ۲۰ نویسه)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "رنگ عنوان ستون (اختیاری)، شانزده‌شانزدهی، مانند \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "محدودیت WIP (اختیاری)؛ در صورت عبور، عنوان ستون قرمز می‌شود"
"Card array (required)": "آرایهٔ کارت‌ها (الزامی)"
"Unique card ID (required)": "شناسهٔ یکتای کارت (الزامی)"
"Card title (required, up to 40 characters)": "عنوان کارت (الزامی، حداکثر ۴۰ نویسه)"
"Supplementary description (optional, up to 100 characters)": "توضیح تکمیلی (اختیاری، حداکثر ۱۰۰ نویسه)"
"Priority (optional): high | medium | low": "اولویت (اختیاری): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "آرایهٔ برچسب‌ها (اختیاری)، مانند [\"طراحی\",\"رابط کاربری\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "مهلت (اختیاری)، ISO 8601 مانند \"2026-07-15\""
"Assignee name (optional)": "نام مسئول (اختیاری)"
"Subtask checklist (optional); each item has title and done": "فهرست زیرکارها (اختیاری)؛ هر آیتم شامل title و done است"
"Completion progress (optional), 0-100": "درصد پیشرفت (اختیاری)، ۰ تا ۱۰۰"
"Related link URL (optional)": "نشانی پیوند (اختیاری)"
"Subtask title": "عنوان زیرکار"
"Whether the subtask is done": "آیا زیرکار انجام شده است"
"Unique swimlane ID (required)": "شناسهٔ یکتای خط (الزامی)"
"Swimlane title (required)": "عنوان خط (الزامی)"
"Column ID array contained in this swimlane (required)": "آرایهٔ شناسهٔ ستون‌های این خط (الزامی)"
"City or place name (required), e.g. Beijing": "نام شهر یا مکان (الزامی)، مانند پکن"
"Latitude (required), WGS84 decimal degrees": "عرض جغرافیایی (الزامی)، درجهٔ اعشاری WGS84"
"Longitude (required), WGS84 decimal degrees": "طول جغرافیایی (الزامی)، درجهٔ اعشاری WGS84"
"Marker label text (optional); supports \\n line breaks": "متن برچسب نشانگر (اختیاری)؛ از \\\\n برای شکستن سطر پشتیبانی می‌کند"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "رنگ نشانگر (اختیاری)، شانزده‌شانزدهی مانند \"#E74C3C\"؛ اگر حذف شود، رنگ‌ها بر اساس طرح یک‌درمیان می‌شوند"
"Marker size (optional); default 7": "اندازهٔ نشانگر (اختیاری)؛ پیش‌فرض ۷"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "نام استان (الزامی)؛ نام استان را به چینی (کامل یا کوتاه) می‌پذیرد، مانند گوانگ‌دونگ"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "رنگ برجسته‌سازی (اختیاری)، شانزده‌شانزدهی مانند \"#FFB347\"؛ پیش‌فرض رنگ پالت"
"Highlight label (optional), e.g. No.1 GDP": "برچسب برجسته‌سازی (اختیاری)، مانند تولید ناخالص داخلی رتبهٔ یک"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "تاریخ رویداد (الزامی)؛ هر قالبی، مانند \"2024-01\" یا \"2024 Q3\" یا \"مرحلهٔ ۱\""
"Event title (required, up to 30 characters)": "عنوان رویداد (الزامی، حداکثر ۳۰ نویسه)"
"Supplementary description (optional, up to 80 characters)": "توضیح تکمیلی (اختیاری، حداکثر ۸۰ نویسه)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "رنگ شانزده‌شانزدهی (اختیاری)، مانند \"#5470c6\"؛ اگر حذف شود، پالت به‌طور خودکار یک‌درمیان می‌شود"
"Event category label (optional), e.g. Milestone, Release, Issue": "برچسب دستهٔ رویداد (اختیاری)، مانند نقطهٔ عطف، انتشار، رخداد"
