"Secrecy directive trigger pattern detected in AI reply": "Εντοπίστηκε μοτίβο ενεργοποίησης οδηγίας απορρήτου στην απάντηση της AI"
"Regenerate context is missing the user message. AssistantMessage.Id={0}, HistoryMessages.Count={1}, beforeMessages.Count={2}": "Από το περιβάλλον αναδημιουργίας λείπει το μήνυμα του χρήστη. AssistantMessage.Id={0}, HistoryMessages.Count={1}, beforeMessages.Count={2}"
"Handler {0} failed: {1}": "Το handler {0} απέτυχε: {1}"
"Failed to regenerate the reply: {0}": "Η αναδημιουργία της απάντησης απέτυχε: {0}"
"Background generation completion callback failed: {0}": "Η επιστροφή κλήσης ολοκλήρωσης της παραγωγής στο παρασκήνιο απέτυχε: {0}"
"Handler [{0}] OnBefore failed: {1}": "Το Handler [{0}] OnBefore απέτυχε: {1}"
"Handler [{0}] OnAfter failed: {1}": "Το Handler [{0}] OnAfter απέτυχε: {1}"
"Handler [{0}] OnBefore failed (non-streaming): {1}": "Το Handler [{0}] OnBefore απέτυχε (χωρίς ροή): {1}"
"Handler [{0}] OnAfter failed (non-streaming): {1}": "Το Handler [{0}] OnAfter απέτυχε (χωρίς ροή): {1}"
"Streaming generation failed: {0}": "Η παραγωγή ροής απέτυχε: {0}"
"LLM context is missing the user message; skipping the call. ContextMessages.Count={0}": "Από το περιβάλλον LLM λείπει το μήνυμα του χρήστη· η κλήση θα παραλειφθεί. ContextMessages.Count={0}"
"Context window budget exceeded; interrupting the tool call loop": "Ο προϋπολογισμός του παραθύρου περιβάλλοντος υπερβάθηκε· διακόπτεται ο βρόχος κλήσεων εργαλείων"
"Upstream rate limited (429), retry {0}, waiting {1}ms": "Upstream όριο ρυθμού (429), επανάληψη {0}, αναμονή {1}ms"
"Upstream error {0}, retry {1}": "Σφάλμα upstream {0}, επανάληψη {1}"
"Failed to pre-create gateway conversation: {0}": "Η προδημιουργία συνομιλίας πύλης απέτυχε: {0}"
"Failed to record gateway conversation: {0}": "Η καταγραφή συνομιλίας πύλης απέτυχε: {0}"
"Failed to save gateway attachment: {0}": "Η αποθήκευση συνημμένου πύλης απέτυχε: {0}"
"Name cannot be empty": "Το name δεν μπορεί να είναι κενό"
"Name '{0}' already exists": "Το όνομα '{0}' υπάρχει ήδη"
"Embedded resource china-map.svg was not found; make sure the csproj contains <EmbeddedResource Include=\"Resources\\china-map.svg\" />": "Ο ενσωματωμένος πόρος china-map.svg δεν βρέθηκε· βεβαιωθείτε ότι το csproj περιέχει <EmbeddedResource Include=\"Resources\\china-map.svg\" />"
"The message does not exist or the role does not match": "Το μήνυμα δεν υπάρχει ή ο ρόλος δεν ταιριάζει"
"The conversation does not exist": "Η συνομιλία δεν υπάρχει"
"Model '{0}' is unavailable": "Το μοντέλο '{0}' δεν είναι διαθέσιμο"
"No model is available; configure and enable at least one model in the admin console first": "Δεν υπάρχει διαθέσιμο μοντέλο· ρυθμίστε και ενεργοποιήστε πρώτα τουλάχιστον ένα μοντέλο στην κονσόλα διαχείρισης"
"Invalid parameter: sections cannot be empty": "Μη έγκυρη παράμετρος: το sections δεν μπορεί να είναι κενό"
"Invalid parameter: sheets cannot be empty": "Μη έγκυρη παράμετρος: το sheets δεν μπορεί να είναι κενό"
"MCP tool not found: '{0}'": "Το εργαλείο MCP δεν βρέθηκε: '{0}'"
"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Δημιουργεί έγγραφο Word (.docx) και επιστρέφει σύνδεσμο λήψης. Υποστηρίζει τίτλους, παραγράφους, λίστες, πίνακες, εικόνες, αλλαγές σελίδας, διαχωριστικά, πλαίσια επισήμανσης, κάρτες KPI, παραθέσεις και μπλοκ κώδικα. Ο πίνακας JSON sections περιγράφει κάθε ενότητα με heading, content και elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Τίτλος εγγράφου (έως 30 χαρακτήρες), π.χ. Αναφορά 2ου τριμήνου"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Πίνακας ενοτήτων (JSON). Πεδία κάθε ενότητας: heading (τίτλος ενότητας), headingLevel (1-3, προεπιλογή 1), content (παράγραφος κειμένου, προαιρετικό), elements (πίνακας στοιχείων, προαιρετικό). Τύποι στοιχείων: paragraph ({type,text,προαιρετικά bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,προαιρετικά tableStyle}; το rows είναι δισδιάστατος πίνακας, κάθε γραμμή είναι πίνακας τιμών κελιών, π.χ. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Θέμα (προαιρετικό): κλειδί στυλ κάρτας (π.χ. enterprise-blue) ή ενσωματωμένο όνομα (blue/dark/corporate/warm/green/minimal)· αν παραλειφθεί, χρησιμοποιείται το στυλ της συνομιλίας ή η προεπιλογή της επωνυμίας"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Δημιουργεί βιβλίο εργασίας Excel (.xlsx) και επιστρέφει σύνδεσμο λήψης. Υποστηρίζει πολλά φύλλα, στυλ κεφαλίδας, πλάτη στηλών, μορφές αριθμών, μορφοποίηση υπό συνθήκη, καθήλωση παραθύρων, αυτόματο φίλτρο και επικύρωση αναπτυσσόμενης λίστας. Η παράμετρος theme δέχεται κλειδί στυλ κάρτας ή ενσωματωμένο όνομα (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Τίτλος βιβλίου εργασίας (έως 30 χαρακτήρες), π.χ. Αναφορά εσόδων 2ου τριμήνου"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Πίνακας φύλλων (JSON). Πεδία κάθε φύλλου: name, headers (πίνακας κεφαλίδων), rows (δισδιάστατος πίνακας· κάθε γραμμή είναι πίνακας τιμών κελιών, π.χ. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (π.χ. [12,20,15]), numberFormat (π.χ. \"#,##0.00\" ή \"yyyy-MM-dd\"), conditionalFormats (πίνακας {range,type,color,value?}· το type υποστηρίζει dataBar/colorScale/greaterThan και άλλα), charts (πίνακας γραφημάτων), freezeRows (αριθμός καθηλωμένων γραμμών), autoFilter (εύρος φίλτρου) και dropdowns (επικύρωση αναπτυσσόμενης λίστας)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Θέμα (προαιρετικό): κλειδί στυλ κάρτας (π.χ. enterprise-blue) ή ενσωματωμένο όνομα (blue/dark/corporate/warm/green/minimal) που ελέγχει την κεφαλίδα και τα γενικά χρώματα· αν παραλειφθεί, χρησιμοποιείται το στυλ της συνομιλίας ή η προεπιλογή της επωνυμίας"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Δημιουργεί παρουσίαση PowerPoint (.pptx) και επιστρέφει σύνδεσμο λήψης. Δύο αμοιβαία αποκλειόμενοι τρόποι εισόδου: (1) λειτουργία slides, όπου η AI περιγράφει δομημένο περιεχόμενο και η διάταξη δημιουργείται αυτόματα· (2) λειτουργία widgetSrc, που ενσωματώνει τις ήδη δημιουργημένες κάρτες show_widget ως εικόνες διαφανειών. Η παράμετρος theme δέχεται κλειδί στυλ κάρτας (π.χ. enterprise-blue/raycast-dark/ppt-executive) ή ενσωματωμένο όνομα (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Τίτλος παρουσίασης (έως 30 χαρακτήρες), π.χ. Ανασκόπηση 2ου τριμήνου"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Πίνακας διαφανειών (JSON). Ένα στοιχείο = μία διαφάνεια, πολλά στοιχεία = πλήρης παρουσίαση. Αμοιβαία αποκλειόμενο με το widgetSrc. Πεδία κάθε διαφάνειας: title, layout (title_only/title_content/two_column/chart_only/blank), background (δεκαεξαδικό χρώμα), footer, showPageNumber (true/false), elements (λίστα στοιχείων), notes και transition. Το elements υποστηρίζει: text (role=title/subtitle/body/kpi/caption· προαιρετικά bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows· το rows δισδιάστατος πίνακας, κάθε γραμμή πίνακας τιμών κελιών, π.χ. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]· προαιρετικά tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Παράδειγμα: [{\"title\":\"Εξώφυλλο\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Ανασκόπηση 2ου τριμήνου\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Ομάδα NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Λίστα αναγνωριστικών καρτών show_widget χωρισμένη με κόμματα, π.χ. 'call_abc123,call_def456'. Αμοιβαία αποκλειόμενο με το slides. Μετατρέπει τις δημιουργημένες κάρτες σε εικόνες διαφανειών"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Θέμα (προαιρετικό): κλειδί στυλ κάρτας (π.χ. enterprise-blue/ppt-executive) ή ενσωματωμένο όνομα (blue/dark/corporate/warm/green/minimal κ.λπ.)· αν παραλειφθεί, χρησιμοποιείται το στυλ της συνομιλίας ή η προεπιλογή της επωνυμίας"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Εμφανίζει δεδομένα ως διαδραστικό γράφημα (ζουμ, αιώρηση, εξαγωγή ως εικόνα). Περίπου 20 φορές ταχύτερο από το show_widget: αρκεί μια προδιαγραφή JSON (περίπου 200 tokens) και το frontend το σχεδιάζει αμέσως με ECharts. Υποστηρίζει: bar, line (γραμμή/περιοχή), pie (πίτα/δακτύλιος), scatter, radar, map_china (θερμικός χάρτης επαρχιών Κίνας), heatmap (θερμικός χάρτης πίνακα), gauge, funnel, treemap. Κατάλληλο για αριθμητικές συγκρίσεις, χρονοσειρές (γραμμή), ανάλυση αναλογιών και γεωγραφική κατανομή. Σημείωση: για διαδρομές, ιστορικά γεγονότα, ορόσημα και χρονολόγια χρησιμοποιήστε το show_timeline· αυτό το εργαλείο δεν υποστηρίζει τον τύπο timeline. Οπτικό στυλ: δώστε παλέτα μέσω του data.colors αντί να βασίζεστε στις προεπιλογές του ECharts. Προτάσεις: χρώμα επωνυμίας για μία σειρά, ομοιόμορφα κατανεμημένες αποχρώσεις (10-12 χρώματα) για πολλές σειρές, συμπληρωματικά χρώματα για συγκρίσεις, μονόχρωμη διαβάθμιση για τάσεις. Μπλε και χρυσό για οικονομικά, μπλε/πράσινο/λευκό για υγεία, μωβ/μπλε/κυανό για τεχνολογία και AI. Για μεγάλα σύνολα δεδομένων ορίστε data.animation=false για μείωση του κόστους απόδοσης."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Τύπος γραφήματος: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Τίτλος γραφήματος (έως 30 χαρακτήρες), π.χ. ΑΕΠ ανά επαρχία 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Αντικείμενο JSON· η δομή περιγράφεται στην περιγραφή του εργαλείου. Παράδειγμα bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Έσοδα\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; παράδειγμα radar πολλαπλών σειρών: {\"indicators\":[{\"name\":\"Ταχύτητα\",\"max\":100},{\"name\":\"Ισχύς\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; συνθήκη radar: ο αριθμός των indicators πρέπει να ισούται με το μήκος κάθε series[i].data και το data πρέπει να περιέχει μόνο αριθμούς"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Επιστρέφει τα στοιχεία του συνδεδεμένου χρήστη, συμπεριλαμβανομένων ονόματος χρήστη, εμφανιζόμενου ονόματος, email, κινητού, κωδικού, ρόλων, τμήματος, φύλου, ηλικίας, ημερομηνίας γέννησης και σημειώσεων, καθώς και της διεύθυνσης IP, της πόλης και της λεπτομερούς γεωγραφικής θέσης του επισκέπτη"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Αναζητά σχήματα πινάκων βάσης δεδομένων με λέξη-κλειδί. Το αποτέλεσμα αποτελείται από δύο μέρη: (1) χάρτης πίνακα-σύνδεσης (πίνακας Markdown που δείχνει σε ποια σύνδεση ανήκει κάθε πίνακας· πίνακες με το ίδιο όνομα σε διαφορετικές συνδέσεις εμφανίζονται χωριστά)· (2) σχήμα XML των πινάκων για κάθε σύνδεση. Οι επόμενες κλήσεις run_sql πρέπει να χρησιμοποιούν το όνομα σύνδεσης από τον πίνακα χάρτη"
"Search keywords, separated by commas or spaces": "Λέξεις-κλειδιά αναζήτησης χωρισμένες με κόμμα ή κενό"
"Restrict to a connection name; empty searches all connections": "Περιορισμός σε όνομα σύνδεσης· κενό σημαίνει αναζήτηση σε όλες τις συνδέσεις"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Εκτελεί δήλωση SQL στην καθορισμένη σύνδεση βάσης δεδομένων. Τα ερωτήματα SELECT/WITH επιστρέφουν γραμμές· οι δηλώσεις μη-ερωτήματος όπως INSERT/UPDATE/DELETE επιστρέφουν τον αριθμό των επηρεαζόμενων γραμμών. Το connName πρέπει να αντιστοιχεί στη στήλη σύνδεσης που επιστρέφει το search_table"
"Database connection name (from the connection column of search_table)": "Όνομα σύνδεσης βάσης δεδομένων (από τη στήλη σύνδεσης του search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Δήλωση SQL. Το SELECT/WITH επιστρέφει σύνολο αποτελεσμάτων· οι δηλώσεις μη-ερωτήματος επιστρέφουν τον αριθμό των επηρεαζόμενων γραμμών"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Αναζητά την ημερομηνία σε σεληνιακό ημερολόγιο, τον ηλιακό όρο και την κατάσταση εργάσιμης ημέρας (εργάσιμη/αργία/ημέρα αναπλήρωσης) για συγκεκριμένη ημερομηνία"
"Date to query in yyyy-MM-dd format. Defaults to today": "Η ζητούμενη ημερομηνία σε μορφή yyyy-MM-dd. Προεπιλογή σήμερα"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Εμφανίζει τις εργασίες ως πίνακα Kanban πολλαπλών στηλών (π.χ. Προς εκτέλεση -> Σε εξέλιξη -> Ολοκληρωμένο). Κατάλληλο για διαχωρισμό φάσεων έργου, σχεδιασμό Sprint, εμφάνιση ροής εργασίας και ταξινόμηση κατάστασης εργασιών. Κάθε στήλη μπορεί να έχει έγχρωμη ετικέτα και όριο WIP· κάθε κάρτα μπορεί να έχει τίτλο, περιγραφή, προτεραιότητα, ετικέτες, ημερομηνία λήξης, υπεύθυνο, λίστα υποεργασιών, πρόοδο και σύνδεσμο. Δύο διατάξεις: board (προεπιλεγμένος πίνακας πολλαπλών στηλών) και swimlane (στήλες ομαδοποιημένες ανά ομάδα ή μονάδα)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Τίτλος πίνακα (έως 30 χαρακτήρες), π.χ. Πίνακας Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Πίνακας JSON με ορισμούς στηλών. Παράδειγμα: [{\"id\":\"todo\",\"title\":\"Προς εκτέλεση\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Ανάλυση απαιτήσεων\",\"description\":\"Συλλογή απαιτήσεων χρηστών\",\"priority\":\"high\",\"tags\":[\"σχεδίαση\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Συνέντευξη χρηστών\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Όλα τα πεδία εκτός από id και title είναι προαιρετικά"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Λειτουργία διάταξης: board (προεπιλεγμένος πίνακας πολλαπλών στηλών) ή swimlane (στήλες ομαδοποιημένες ανά ομάδα ή μονάδα· απαιτείται η παράμετρος swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Πίνακας JSON με ορισμούς λωρίδων (χρησιμοποιείται όταν layout=swimlane). Παράδειγμα: [{\"id\":\"sl1\",\"title\":\"Ομάδα frontend\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Ομάδα backend\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Σημειώνει σημεία συντεταγμένων (πόλεις ή POI) ή επισημαίνει επαρχίες στον χάρτη της Κίνας, δημιουργεί σχολιασμένο χάρτη SVG και τον εμφανίζει στο συννεφάκι συνομιλίας. Υποστηρίζει: (1) χρωματισμό επαρχιών με προσαρμοσμένα χρώματα· (2) δείκτες WGS84 με γεωγραφικό πλάτος, μήκος και κείμενο ετικέτας· (3) αυτόματο υπόμνημα στην κάτω δεξιά γωνία. Τυπικές χρήσεις: κατανομή δεδομένων ανά επαρχία, θέσεις πόλεων, θερμικοί χάρτες περιφερειακών πωλήσεων."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Τίτλος χάρτη (έως 30 χαρακτήρες), π.χ. ΑΕΠ ανά επαρχία 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Πίνακας JSON δεικτών (μπορεί να είναι κενός πίνακας []). Μορφή: [{\"name\":\"Πεκίνο\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Πεκίνο\\n4376 δισ.\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng σε δεκαδικές μοίρες WGS84· color/size προαιρετικά"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Πίνακας JSON επισημάνσεων επαρχιών (μπορεί να είναι κενός πίνακας []). Μορφή: [{\"name\":\"Γκουανγκντόνγκ\",\"color\":\"#FFB347\",\"label\":\"ΑΕΠ πρώτο\"}]. Το name δέχεται το όνομα της επαρχίας στα κινεζικά (πλήρες ή συντομευμένο)· το label προαιρετικό"
"Legend title (optional), e.g. GDP scale": "Τίτλος υπομνήματος (προαιρετικό), π.χ. Κλίμακα ΑΕΠ"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Χρωματική παλέτα (προαιρετικό): blue/orange/green/purple/red· προεπιλογή blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Σχήμα δείκτη (προαιρετικό): circle/pin/square· προεπιλογή circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Εμφανίζει ιεραρχίες γνώσης ή σχέσεις μεταξύ εννοιών ως διαδραστικό, αναδιπλούμενο νοητικό χάρτη. Η είσοδος είναι σκιαγράφηση Markdown (# / ## / ###) που το frontend μετατρέπει σε οπτικό δέντρο. Κατάλληλο για οργάνωση γνώσης, αποδόμηση εννοιών, σύγκριση τεχνολογιών, αξιολόγηση επιλογών και σύνοψη περιεχομένου. Οπτικό στυλ: επιλέξτε branchColors (3-8 αρμονικά χρώματα), maxDepth (πολυπλοκότητα) και collapsed (αρχική αναδίπλωση για εστίαση) ανάλογα με το θέμα. Χρησιμοποιήστε ψυχρά χρώματα (μπλε/μωβ/κυανό) για τεχνολογία και δεδομένα, θερμά (πορτοκαλί/χρυσό/κόκκινο) για επιχειρήσεις και μάρκετινγκ, πράσινο για φύση και υγεία. Για πυκνούς κόμβους ορίστε maxDepth=2 για διατήρηση αναγνωσιμότητας. 6 διατάξεις: tree (προεπιλογή, οδοντωτό δέντρο, γενικό) / radial (ακτινωτό αριστερά-δεξιά, καλύτερο για χάρτες γνώσης) / lr (από κέντρο προς δεξιά, διαγράμματα ροής/δέντρα αποφάσεων) / rl (από κέντρο προς αριστερά, αντίστροφη ιχνηλάτηση) / tb (από κέντρο προς τα κάτω, οργανογράμματα) / bt (από κέντρο προς τα πάνω, ιεραρχία από κάτω)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Τίτλος νοητικού χάρτη (έως 30 χαρακτήρες), π.χ. Τεχνολογικό stack AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Σκιαγράφηση Markdown με # / ## / ### για επίπεδα 1-3. Παράδειγμα:\n# Τεχνητή νοημοσύνη\n## Μηχανική μάθηση\n### Επιβλεπόμενη μάθηση\n### Μη επιβλεπόμενη μάθηση\n## Βαθιά μάθηση\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Λειτουργία διάταξης: tree (προεπιλογή, οδοντωτό δέντρο, γενικό) / radial (ακτινωτό αριστερά-δεξιά, καλύτερο για χάρτες γνώσης) / lr (από κέντρο προς δεξιά, διαγράμματα ροής/δέντρα αποφάσεων) / rl (από κέντρο προς αριστερά, αντίστροφη ιχνηλάτηση) / tb (από κέντρο προς τα κάτω, οργανογράμματα) / bt (από κέντρο προς τα πάνω, ιεραρχία από κάτω)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Πίνακας JSON χρωμάτων κλάδων, π.χ. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Αναθέτει με σειρά 3-8 δεκαεξαδικά χρώματα στους κλάδους πρώτου επιπέδου. Αν παραλειφθεί, χρησιμοποιείται η προεπιλεγμένη παλέτα μπλε/μωβ, πράσινο, κίτρινο, κόκκινο, κυανό, σκούρο πράσινο, πορτοκαλί και μωβ"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Πίνακας JSON με αναγνωριστικά κόμβων που είναι αρχικά αναδιπλωμένοι, π.χ. [\"n2\",\"n5\"]. Κενό σημαίνει ανάπτυξη όλων. Χρησιμοποιείται για εστίαση σε σημαντικούς κλάδους"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Μέγιστο ορατό βάθος: 1 = μόνο κλάδοι πρώτου επιπέδου, 2 = δύο επίπεδα, προεπιλογή χωρίς όριο. Για πυκνούς κόμβους ορίστε 2 για διατήρηση αναγνωσιμότητας"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Εμφανίζει δεδομένα χρονοσειρών ως κομψές κάρτες χρονολογίου. Αρκεί JSON (περίπου 100 tokens) και το frontend το εμφανίζει αμέσως. Κατάλληλο για ορόσημα έργου, ιστορικά γεγονότα, σχέδια κυκλοφορίας και ιστορικό ανάπτυξης. Κάθε γεγονός μπορεί να έχει ημερομηνία, τίτλο, περιγραφή, χρώμα και κατηγορία. Οπτικό στυλ: ορίστε γενική παλέτα μέσω της παραμέτρου palette (π.χ. διαβάθμιση μπλε-μωβ, ζεστό μπρούντζο, χρώματα επωνυμίας) ώστε το χρονολόγιο να έχει ενιαίο χαρακτήρα· το item.color αντικαθιστά μεμονωμένα στοιχεία. Χρησιμοποιήστε density=relaxed για πέντε ή λιγότερα επιλεγμένα γεγονότα και density=compact για δέκα ή περισσότερα. 8 διατάξεις: vertical (5-20 στοιχεία) / alternating-top (εναλλάξ πάνω, αντίστροφη χρονολογία) / alternating-bottom (εναλλάξ κάτω, χρονολογία) / horizontal-left (οριζόντια αριστερά, αντίστροφα) / horizontal-right (οριζόντια δεξιά, χρονολογία) / s-curve (καμπύλη S, 8 στοιχεία ή λιγότερα) / fishbone-left (κόκαλο ψαριού αριστερά, αντίστροφα) / fishbone-right (κόκαλο ψαριού δεξιά, χρονολογία)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Τίτλος χρονολογίου (έως 30 χαρακτήρες), π.χ. Ορόσημα προϊόντος"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Πίνακας JSON γεγονότων χρονολογίου. Παράδειγμα: [{\"date\":\"2024-01\",\"title\":\"Κυκλοφορία v1.0\",\"description\":\"Εισαγωγή βασικών λειτουργιών\",\"color\":\"#5470c6\",\"category\":\"ορόσημο\"}]. Τα description/color/category είναι προαιρετικά"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Λειτουργία διάταξης: vertical / alternating-top (εναλλάξ πάνω, αντίστροφα) / alternating-bottom (εναλλάξ κάτω, χρονολογία) / horizontal-left (οριζόντια, αντίστροφα) / horizontal-right (οριζόντια, χρονολογία) / s-curve / fishbone-left (κόκαλο ψαριού, αντίστροφα) / fishbone-right (κόκαλο ψαριού, χρονολογία)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Πίνακας JSON γενικής παλέτας, π.χ. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Αντικαθιστά την προεπιλεγμένη εναλλαγή οκτώ χρωμάτων. Το item.color έχει προτεραιότητα"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Απόσταση στοιχείων: compact (12px) / normal (20px, προεπιλογή) / relaxed (32px). Το relaxed ταιριάζει για πέντε ή λιγότερα επιλεγμένα γεγονότα· το compact για δέκα ή περισσότερα"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Εμφανίζει τμήμα SVG ή HTML μέσα στο συννεφάκι συνομιλίας. Χρησιμοποιήστε το για χρονολόγια και διαγράμματα σχέσεων (SVG), προεπισκοπήσεις φορμών και κάρτες δεδομένων (HTML), στατιστικά γραφήματα (SVG). Μην το χρησιμοποιείτε για διαγράμματα Mermaid· εξάγετε το Mermaid ως μπλοκ κώδικα ```mermaid στην απάντηση. Όρια: έως 200 KB· <script src=...> μόνο από αξιόπιστο CDN. Οπτικό στυλ: επιλέξτε αρχιτεκτονική πληροφορίας (Bento/ροή καρτών/Grid), τυπογραφική ιεραρχία και σύστημα χρωμάτων ανάλογα με το θέμα. Ψυχροί τόνοι χωρίς γωνίες για τεχνικές συζητήσεις, ουδέτερα χρώματα με εμφανείς αριθμούς για επιχειρηματικές αναφορές, διαβαθμίσεις/γυάλινο εφέ/λεπτές κινήσεις για δημιουργικές εργασίες. Καθορίζετε πάντα ρητά τα font-family και color· μην βασίζεστε στα προεπιλεγμένα στυλ του προγράμματος περιήγησης."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Τίτλος widget (έως 30 χαρακτήρες), π.χ. Ροή κατάστασης παραγγελίας"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "Το SVG πρέπει να ξεκινά με <svg· τα τμήματα HTML πρέπει να ξεκινούν με το ριζικό στοιχείο και δεν πρέπει να περιέχουν <html><body>. Έως 200 KB· <script src=...> μόνο από αξιόπιστο CDN. Μη μεταβιβάζετε σύνταξη Mermaid (flowchart/graph/sequenceDiagram κ.λπ.)· εξάγετε το Mermaid ως μπλοκ κώδικα ```mermaid στην απάντηση"
"Placeholder text shown while loading (optional)": "Κείμενο αντικαταστάτη που εμφανίζεται κατά τη φόρτωση (προαιρετικό)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Υπόδειξη θέματος: light / dark / auto (κατά το σύστημα). Το παραγόμενο HTML πρέπει να επιλέγει ανάλογα τα χρώματα φόντου και κειμένου· δεν μεταβιβάζεται στον προβολέα του frontend"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Αρχικό ύψος του widget σε pixel (80-1200). Προεπιλογή 480. Χρησιμοποιήστε 300-400 για συμπαγείς κάρτες και 600-800 για μεγάλα γραφήματα"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Λειτουργία φόντου: solid (προεπιλογή) / transparent (για επικόλληση στιγμιοτύπων σε πρότυπο PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Λειτουργία διαφάνειας PPT. Όταν είναι true, η κάρτα εμφανίζεται σε αναλογία 16:9 έτοιμη για επικόλληση σε παρουσίαση. Προεπιλογή false που εμφανίζει ανάλογα με το περιεχόμενο"
"Section heading text, e.g. Completed this week": "Κείμενο τίτλου ενότητας, π.χ. Όσα ολοκληρώθηκαν αυτή την εβδομάδα"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Επίπεδο τίτλου: 1 = πρώτο επίπεδο (μεγαλύτερο), 2 = δεύτερο επίπεδο, 3 = τρίτο επίπεδο· προεπιλογή 1"
"Body paragraph text (optional; used together with elements)": "Παράγραφος κειμένου (προαιρετικό· χρησιμοποιείται μαζί με elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Πίνακας δομημένων στοιχείων (προαιρετικό): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Τύπος στοιχείου: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Περιεχόμενο κειμένου (χρησιμοποιείται όταν type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Πίνακας στοιχείων λίστας (χρησιμοποιείται όταν type=bullet_list ή ordered_list)"
"Table header row (required when type=table)": "Γραμμή κεφαλίδας πίνακα (απαιτείται όταν type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Γραμμές δεδομένων πίνακα (απαιτούνται όταν type=table)· κάθε γραμμή είναι πίνακας τιμών κελιών, π.χ. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Στυλ πίνακα (προαιρετικό όταν type=table): headerBgColor (φόντο κεφαλίδας), headerFontColor (χρώμα κειμένου κεφαλίδας), stripeColor (εναλλασσόμενες γραμμές)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL εικόνας (απαιτείται όταν type=image)· υποστηρίζει εξωτερικούς συνδέσμους https:// ή εσωτερικά συνημμένα όπως /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Πλάτος εικόνας σε εκατοστά (type=image)· προεπιλογή 14 cm"
"Image height in centimeters (type=image); default 10cm": "Ύψος εικόνας σε εκατοστά (type=image)· προεπιλογή 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Αν το κείμενο είναι έντονο (προαιρετικό όταν type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Αν το κείμενο είναι πλάγιο (προαιρετικό όταν type=paragraph/callout/quote)"
