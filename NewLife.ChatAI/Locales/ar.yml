"Chart definition array (optional): type=bar/line/pie + title + categories + series": "مصفوفة تعريفات الرسوم البيانية (اختياري): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "عدد الصفوف العلوية المثبتة (0 = لا شيء، 1 = تثبيت الصف الأول؛ الافتراضي 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "نطاق التصفية التلقائية (مثل \"A1:E1\")؛ معطل عندما يكون فارغًا"
"Dropdown validation array (optional)": "مصفوفة عمليات التحقق بالقوائم المنسدلة (اختياري)"
"Applied range (e.g. \"C2:C10\")": "النطاق المطبق (مثل \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "نوع الشرط: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "اللون (RGB سداسي عشري، مثل 2563EB) المستخدم لأشرطة البيانات أو تدرجات الألوان أو الإبراز"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "الحد أو الصيغة (مثل 1000 أو =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "نوع الرسم: bar / line / pie"
"Chart title (optional)": "عنوان الرسم (اختياري)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "مصفوفة تسميات محور الفئات، مثل [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "مصفوفة سلاسل البيانات؛ كل عنصر يحتوي على name وdata"
"Applied range (e.g. \"A2:A100\")": "النطاق المطبق (مثل \"A2:A100\")"
"Dropdown option array": "مصفوفة خيارات القائمة المنسدلة"
"Title of this slide": "عنوان هذه الشريحة"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "تخطيط الشريحة: title_only (العنوان فقط، للأغلفة) / title_content (عنوان + نص، الافتراضي) / two_column (عمودان) / chart_only (رسم بعرض كامل) / blank (مساحة فارغة)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "لون خلفية الشريحة، RGB سداسي عشري مثل \"1F497D\"؛ عند الحذف تُستخدم خلفية السمة"
"Slide element list; each element describes a text block, table, chart, or image": "قائمة عناصر الشريحة؛ يصف كل عنصر كتلة نص أو جدولًا أو رسمًا أو صورة"
"Footer text displayed at the bottom of the slide; null hides it": "نص التذييل المعروض أسفل الشريحة؛ null يخفيه"
"Whether to show the slide number in the bottom-right corner; default false": "هل يظهر رقم الشريحة في الزاوية اليمنى السفلى؛ الافتراضي false"
"Speaker notes used as a reminder while presenting": "ملاحظات المحاضر المستخدمة كتذكير أثناء العرض"
"Transition animation: fade / push / wipe / zoom / split / cut": "حركة الانتقال: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "نوع العنصر: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "الدور الدلالي (عناصر text فقط): title / subtitle / body / caption / kpi. يستخدمه محرك التخطيط لتحديد موضع العنصر تلقائيًا، فلا حاجة للإحداثيات"
"Text content (required when type=text)": "محتوى النص (مطلوب عندما type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "حجم الخط بالنقاط (اختياري)؛ عند الحذف يختار محرك التخطيط حجمًا حسب role (title≈28 وkpi≈44 وbody≈16)"
"Whether the text is bold; default false": "هل النص عريض؛ الافتراضي false"
"Whether the text is italic (optional for type=text); default false": "هل النص مائل (اختياري عندما type=text)؛ الافتراضي false"
"Whether the text is underlined (optional for type=text); default false": "هل النص تحته خط (اختياري عندما type=text)؛ الافتراضي false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "لون النص، RGB سداسي عشري مثل \"FFFFFF\"؛ عند الحذف يُورث لون نص السمة"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "مصفوفة رؤوس الجدول (مطلوبة عندما type=table)، مثل [\"المؤشر\",\"Q1\",\"Q2\",\"التغير\"]"
