"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "تسميات فئات الرسم (مطلوبة عندما type=chart)، مثل [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "سلاسل البيانات (مطلوبة عندما type=chart)؛ كل عنصر يحتوي على name (اسم السلسلة) وdata (مصفوفة أرقام)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "محاذاة النص (عناصر text): l (يسار) / ctr (وسط) / r (يمين)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "لون خلفية مربع النص (عناصر text)، RGB سداسي عشري مثل \"EFF6FF\"؛ شفاف عند الفراغ"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "مقاطع النص المنسق (عناصر text)؛ عند وجودها تُتجاهل Content/FontSize/Bold/Color"
"Shape configuration (required when type=shape)": "تكوين الشكل (مطلوب عندما type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "نمط الجدول (اختياري عندما type=table): headerBgColor (خلفية الرأس) وheaderFontColor (لون نص الرأس) وstripeColor (الصفوف المتناوبة)"
"Text content": "محتوى النص"
"Font size in points; 0 inherits the text box default": "حجم الخط بالنقاط؛ 0 يورث الافتراضي لمربع النص"
