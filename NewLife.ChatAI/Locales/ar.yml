"Upstream rate limited (429), retry {0}, waiting {1}ms": "تحديد معدل المنبع (429)، المحاولة {0}، الانتظار {1}ms"
"Upstream error {0}, retry {1}": "خطأ المنبع {0}، المحاولة {1}"
"Failed to pre-create gateway conversation: {0}": "فشل إنشاء محادثة البوابة مسبقًا: {0}"
"Failed to record gateway conversation: {0}": "فشل تسجيل محادثة البوابة: {0}"
"Failed to save gateway attachment: {0}": "فشل حفظ مرفق البوابة: {0}"
"Name cannot be empty": "لا يمكن أن يكون الاسم فارغًا"
"Name '{0}' already exists": "الاسم '{0}' موجود بالفعل"
"Embedded resource china-map.svg was not found; make sure the csproj contains <EmbeddedResource Include=\"Resources\\china-map.svg\" />": "لم يتم العثور على المورد المضمّن china-map.svg؛ تأكد من أن csproj يحتوي على <EmbeddedResource Include=\"Resources\\china-map.svg\" />"
"The message does not exist or the role does not match": "الرسالة غير موجودة أو الدور غير مطابق"
"The conversation does not exist": "المحادثة غير موجودة"
"Model '{0}' is unavailable": "النموذج '{0}' غير متاح"
"No model is available; configure and enable at least one model in the admin console first": "لا يوجد نموذج متاح؛ يرجى أولًا تكوين نموذج واحد على الأقل وتمكينه في لوحة الإدارة"
"Invalid parameter: sections cannot be empty": "معامل غير صالح: لا يمكن أن تكون sections فارغة"
"Invalid parameter: sheets cannot be empty": "معامل غير صالح: لا يمكن أن تكون sheets فارغة"
"MCP tool not found: '{0}'": "لم يتم العثور على أداة MCP: '{0}'"
"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "ينشئ مستند Word ‏(.docx) ويعيد رابط تنزيل. يدعم العناوين والفقرات والقوائم والجداول والصور وفواصل الصفحات والفواصل والصناديق المميزة ومؤشرات KPI والاقتباسات وكتل التعليمات البرمجية. تصف مصفوفة JSON ‏sections كل قسم باستخدام heading وcontent وelements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "عنوان المستند (حتى 30 حرفًا)، مثل تقرير الربع الثاني"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "مصفوفة الأقسام (JSON). حقول كل قسم: heading (عنوان القسم)، headingLevel (1-3، الافتراضي 1)، content (فقرة النص، اختياري)، elements (مصفوفة العناصر، اختياري). أنواع العناصر: paragraph ({type,text, واختياريًا bold/italic/underline/fontSize/color/alignment/backgroundColor})، bullet_list ({type,items})، ordered_list ({type,items})، table ({type,headers,rows, واختياريًا tableStyle}؛ rows مصفوفة ثنائية الأبعاد كل صف فيها مصفوفة قيم خلايا، مثل [[\"Alice\",\"85\"],[\"Bob\",\"92\"]])، image ({type,src,widthCm?,heightCm?})، page_break ({type})، divider ({type})، callout ({type,text,variant?=info/success/warning/danger})، kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat})، quote ({type,text,quoteSource?})، code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "السمة (اختياري): مفتاح نمط البطاقة (مثل enterprise-blue) أو اسم مدمج (blue/dark/corporate/warm/green/minimal)؛ عند حذفه يُستخدم نمط المحادثة أو الافتراضي للعلامة التجارية"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "ينشئ مصنف Excel ‏(.xlsx) ويعيد رابط تنزيل. يدعم عدة أوراق وأنماط الرؤوس وعروض الأعمدة وتنسيقات الأرقام والتنسيق الشرطي وتثبيت الأجزاء والتصفية التلقائية والتحقق من القوائم المنسدلة. تقبل المعلمة theme مفتاح نمط البطاقة أو اسمًا مدمجًا (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "عنوان المصنف (حتى 30 حرفًا)، مثل تقرير إيرادات الربع الثاني"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "مصفوفة الأوراق (JSON). حقول كل ورقة: name وheaders (مصفوفة الرؤوس) وrows (مصفوفة ثنائية الأبعاد؛ كل صف مصفوفة قيم خلايا، مثل [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]) وstyle ({headerBgColor,headerFontColor,stripeColor}) وcolumnWidths (مثل [12,20,15]) وnumberFormat (مثل \"#,##0.00\" أو \"yyyy-MM-dd\") وconditionalFormats (مصفوفة من {range,type,color,value?}؛ يدعم type القيم dataBar/colorScale/greaterThan وغيرها) وcharts (مصفوفة الرسوم البيانية) وfreezeRows (عدد الصفوف المثبتة) وautoFilter (نطاق التصفية) وdropdowns (التحقق من القائمة المنسدلة)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "السمة (اختياري): مفتاح نمط البطاقة (مثل enterprise-blue) أو اسم مدمج (blue/dark/corporate/warm/green/minimal) يتحكم في الرأس والألوان العامة؛ عند حذفه يُستخدم نمط المحادثة أو الافتراضي للعلامة التجارية"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "ينشئ عرضًا تقديميًا PowerPoint ‏(.pptx) ويعيد رابط تنزيل. وضعا إدخال متعارضان: (1) وضع slides حيث تصف الذكاء الاصطناعي محتوى منظمًا ويُنشأ التخطيط تلقائيًا؛ (2) وضع widgetSrc الذي يضم بطاقات show_widget التي تم إنشاؤها مسبقًا كصور شرائح. تقبل المعلمة theme مفتاح نمط البطاقة (مثل enterprise-blue/raycast-dark/ppt-executive) أو اسمًا مدمجًا (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "عنوان العرض (حتى 30 حرفًا)، مثل مراجعة الربع الثاني"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "مصفوفة الشرائح (JSON). عنصر واحد = شريحة واحدة؛ عدة عناصر = عرض كامل. متعارض مع widgetSrc. حقول كل شريحة: title وlayout (title_only/title_content/two_column/chart_only/blank) وbackground (لون سداسي عشري) وfooter وshowPageNumber (true/false) وelements (قائمة العناصر) وnotes وtransition. يدعم elements: text (role=title/subtitle/body/kpi/caption؛ واختياريًا bold/italic/underline/alignment=l/ctr/r/backgroundColor/color) وtable (headers+rows؛ rows مصفوفة ثنائية الأبعاد كل صف فيها مصفوفة قيم خلايا، مثل [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]؛ واختياريًا tableStyle={headerBgColor/headerFontColor/stripeColor}) وchart (chartType=bar/line/pie/area/scatter+categories+series) وimage (src) وshape (shape={shapeType,fillColor,lineColor,text,fontColor}). مثال: [{\"title\":\"الغلاف\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"مراجعة الربع الثاني\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"فريق NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "قائمة مفصولة بفواصل لمعرفات بطاقات show_widget، مثل 'call_abc123,call_def456'. متعارضة مع slides. تحول البطاقات التي تم إنشاؤها إلى صور شرائح"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "السمة (اختياري): مفتاح نمط البطاقة (مثل enterprise-blue/ppt-executive) أو اسم مدمج (blue/dark/corporate/warm/green/minimal وغيرها)؛ عند حذفه يُستخدم نمط المحادثة أو الافتراضي للعلامة التجارية"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "يعرض البيانات كرسم بياني تفاعلي (تكبير، تحويم، تصدير كصورة). أسرع بنحو 20 مرة من show_widget: يكفي مواصفة JSON (نحو 200 رمز) وتقوم الواجهة بعرضها فورًا باستخدام ECharts. يدعم: bar وline (خط/مساحة) وpie (دائري/حلقي) وscatter وradar وmap_china (خريطة حرارية للمقاطعات الصينية) وheatmap (خريطة حرارية مصفوفية) وgauge وfunnel وtreemap. مناسب للمقارنات الرقمية والسلاسل الزمنية (خط) وتحليل الحصص والتوزيع الجغرافي. ملاحظة: للمسارات والأحداث التاريخية والمعالم والجداول الزمنية استخدم show_timeline؛ فهذه الأداة لا تدعم النوع timeline. النمط البصري: مرر نظام ألوان عبر data.colors بدلًا من الاعتماد على قيم ECharts الافتراضية. اقتراحات: لون العلامة التجارية لسلسلة واحدة، ودرجات موزعة بالتساوي (10-12 لونًا) لعدة سلاسل، وألوان متكاملة للمقارنات، وتدرج أحادي اللون للاتجاهات. الأزرق والذهبي للمال، والأزرق/الأخضر/الأبيض للصحة، والبنفسجي/الأزرق/السماوي للتقنية والذكاء الاصطناعي. للمجموعات الكبيرة اضبط data.animation=false لتقليل تكلفة العرض."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "نوع الرسم: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "عنوان الرسم (حتى 30 حرفًا)، مثل الناتج المحلي الإجمالي حسب المقاطعة 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "كائن JSON؛ البنية موصوفة في وصف الأداة. مثال bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"الإيرادات\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}؛ مثال radar متعدد السلاسل: {\"indicators\":[{\"name\":\"السرعة\",\"max\":100},{\"name\":\"القوة\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}؛ شرط radar: يجب أن يساوي عدد indicators طول كل series[i].data، ويجب أن تحتوي data على أرقام فقط"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "يعيد تفاصيل المستخدم المسجل الدخول، بما في ذلك اسم المستخدم والاسم المعروض والبريد والجوال والرمز والأدوار والقسم والجنس والعمر وتاريخ الميلاد والملاحظات، إضافة إلى عنوان IP للزائر والمدينة والموقع الجغرافي التفصيلي"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "يبحث في مخططات جداول قاعدة البيانات بكلمة مفتاحية. تتكون النتيجة من جزأين: (1) خريطة الجدول إلى الاتصال (جدول Markdown يوضح الاتصال الذي ينتمي إليه كل جدول؛ تُدرج الجداول المتجانسة في اتصالات مختلفة بشكل منفصل)؛ (2) مخطط XML للجداول لكل اتصال. يجب أن تستخدم استدعاءات run_sql اللاحقة اسم الاتصال الوارد في جدول الخريطة"
"Search keywords, separated by commas or spaces": "كلمات البحث مفصولة بفواصل أو مسافات"
"Restrict to a connection name; empty searches all connections": "التقييد باسم اتصال؛ فارغ يبحث في كل الاتصالات"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "ينفذ عبارة SQL على اتصال قاعدة البيانات المحدد. تُرجع استعلامات SELECT/WITH صفوفًا؛ وتُرجع العبارات غير الاستعلامية مثل INSERT/UPDATE/DELETE عدد الصفوف المتأثرة. يجب أن يطابق connName عمود الاتصال الذي يعيده search_table"
"Database connection name (from the connection column of search_table)": "اسم اتصال قاعدة البيانات (من عمود الاتصال في search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "عبارة SQL. يعيد SELECT/WITH مجموعة نتائج؛ وتُرجع العبارات غير الاستعلامية عدد الصفوف المتأثرة"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "يبحث عن تاريخ التقويم القمري والمصطلح الشمسي وحالة يوم العمل (يوم عمل/عطلة/يوم تعويضي) لتاريخ معين"
"Date to query in yyyy-MM-dd format. Defaults to today": "التاريخ المطلوب بصيغة yyyy-MM-dd. الافتراضي اليوم"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "يعرض قائمة مهام كلوحة كانبان متعددة الأعمدة (مثل للتنفيذ -> قيد التنفيذ -> تم). مناسب لتقسيم المشروع وتخطيط Sprint وعرض سير العمل وتصنيف حالات المهام. يمكن لكل عمود أن يحتوي على علامة لون وحد WIP؛ ويمكن لكل بطاقة أن تحتوي على عنوان ووصف وأولوية ووسوم وتاريخ استحقاق ومسؤول وقائمة مهام فرعية وتقدم ورابط. تخطيطان: board (لوحة متعددة الأعمدة افتراضيًا) وswimlane (أعمدة مجمعة حسب الفريق أو الوحدة)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "عنوان اللوحة (حتى 30 حرفًا)، مثل لوحة Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "مصفوفة JSON لتعريفات الأعمدة. مثال: [{\"id\":\"todo\",\"title\":\"للتنفيذ\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"تحليل المتطلبات\",\"description\":\"جمع متطلبات المستخدم\",\"priority\":\"high\",\"tags\":[\"تصميم\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"مقابلة المستخدمين\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. جميع الحقول عدا id وtitle اختيارية"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "وضع التخطيط: board (لوحة متعددة الأعمدة افتراضيًا) أو swimlane (أعمدة مجمعة حسب الفريق أو الوحدة؛ المعلمة swimlanes مطلوبة)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "مصفوفة JSON لتعريفات المسارات (تُستخدم عندما layout=swimlane). مثال: [{\"id\":\"sl1\",\"title\":\"فريق الواجهة\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"فريق الخلفية\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "يضع علامات على نقاط إحداثية (مدن أو POI) أو يبرز مقاطعات على خريطة الصين، وينشئ خريطة SVG مشروحة ويعرضها في فقاعة المحادثة. يدعم: (1) تعبئة المقاطعات بألوان مخصصة؛ (2) علامات WGS84 بخط العرض والطول مع نص التسمية؛ (3) مفتاحًا تلقائيًا في الزاوية اليمنى السفلى. استخدامات نموذجية: توزيع البيانات حسب المقاطعة ومواقع المدن وخرائط حرارية للمبيعات الإقليمية."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "عنوان الخريطة (حتى 30 حرفًا)، مثل الناتج المحلي الإجمالي حسب المقاطعة 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "مصفوفة JSON للعلامات (يمكن أن تكون مصفوفة فارغة []). التنسيق: [{\"name\":\"بكين\",\"lat\":39.9,\"lng\":116.4,\"label\":\"بكين\\n4376 مليار\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng بالدرجات العشرية WGS84؛ color/size اختياريان"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "مصفوفة JSON لإبرازات المقاطعات (يمكن أن تكون مصفوفة فارغة []). التنسيق: [{\"name\":\"قوانغدونغ\",\"color\":\"#FFB347\",\"label\":\"الأول في الناتج\"}]. يقبل name اسم المقاطعة بالصينية (كاملًا أو مختصرًا)؛ label اختياري"
"Legend title (optional), e.g. GDP scale": "عنوان المفتاح (اختياري)، مثل مقياس الناتج المحلي"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "نظام الألوان (اختياري): blue/orange/green/purple/red؛ الافتراضي blue"
"Marker style (optional): circle/pin/square; defaults to circle": "نمط العلامة (اختياري): circle/pin/square؛ الافتراضي circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "يعرض تسلسلات هرمية للمعرفة أو علاقات بين المفاهيم كخريطة ذهنية تفاعلية قابلة للطي. الإدخال مخطط Markdown ‏(# / ## / ###) تحوله الواجهة إلى شجرة بصرية. مناسب لتنظيم المعرفة وتفكيك المفاهيم ومقارنة التقنيات وتقييم الخيارات وتلخيص المحتوى. النمط البصري: اختر branchColors (3-8 ألوان متناسقة) وmaxDepth (التعقيد) وcollapsed (الطي المبدئي للتركيز) حسب الموضوع. استخدم الألوان الباردة (أزرق/بنفسجي/سماوي) للتقنية والبيانات، والدافئة (برتقالي/ذهبي/أحمر) للأعمال والتسويق، والأخضر للطبيعة والصحة. للعقد الكثيفة اضبط maxDepth=2 للحفاظ على القراءة. 6 تخطيطات: tree (شجرة مسننة افتراضيًا، عام) / radial (شعاعي يمين-يسار، الأفضل لخرائط المعرفة) / lr (من المركز إلى اليمين، مخططات التدفق/أشجار القرار) / rl (من المركز إلى اليسار، التتبع العكسي) / tb (من المركز لأسفل، الهياكل التنظيمية) / bt (من المركز لأعلى، تسلسل هرمي من الأسفل للأعلى)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "عنوان الخريطة الذهنية (حتى 30 حرفًا)، مثل حزمة تقنيات الذكاء الاصطناعي"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "مخطط Markdown باستخدام # / ## / ### للمستويات 1-3. مثال:\n# الذكاء الاصطناعي\n## تعلم الآلة\n### التعلم بإشراف\n### التعلم دون إشراف\n## التعلم العميق\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "وضع التخطيط: tree (شجرة مسننة افتراضيًا، عام) / radial (شعاعي يمين-يسار، الأفضل لخرائط المعرفة) / lr (من المركز إلى اليمين، مخططات التدفق/أشجار القرار) / rl (من المركز إلى اليسار، التتبع العكسي) / tb (من المركز لأسفل، الهياكل التنظيمية) / bt (من المركز لأعلى، تسلسل هرمي من الأسفل للأعلى)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "مصفوفة JSON لألوان الفروع، مثل [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. يُخصص من 3 إلى 8 ألوان سداسية عشرية بالترتيب لفروع المستوى الأول. عند الحذف تُستخدم اللوحة الافتراضية أزرق/بنفسجي وأخضر وأصفر وأحمر وأزرق سماوي وأخضر داكن وبرتقالي وبنفسجي"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "مصفوفة JSON لمعرفات العقد المطوية مبدئيًا، مثل [\"n2\",\"n5\"]. فارغة توسع كل شيء. تُستخدم للتركيز على الفروع المهمة"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "أقصى عمق مرئي: 1 = فروع المستوى الأول فقط، 2 = مستويان، بلا حد افتراضيًا. للعقد الكثيفة اضبط 2 للحفاظ على القراءة"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "يعرض بيانات السلاسل الزمنية كبطاقات جدول زمني أنيقة. يكفي JSON (نحو 100 رمز) وتعيد الواجهة عرضه فورًا. مناسب لمعالم المشروع والأحداث التاريخية وخطط الإصدار وتاريخ التطوير. يمكن لكل حدث أن يحتوي على تاريخ وعنوان ووصف ولون وفئة. النمط البصري: اضبط لوحة عامة عبر المعلمة palette (مثل تدرج أزرق-بنفسجي أو برونز دافئ أو ألوان العلامة) ليمنح الجدول الزمني طابعًا موحدًا؛ ويُستبدل item.color عنصرًا منفردًا. استخدم density=relaxed لخمسة أحداث مختارة أو أقل وdensity=compact لعشرة أو أكثر. 8 تخطيطات: vertical (5-20 عنصرًا) / alternating-top (متناوب أعلى، ترتيب زمني عكسي) / alternating-bottom (متناوب أسفل، ترتيب زمني) / horizontal-left (أفقي لليسار، ترتيب عكسي) / horizontal-right (أفقي لليمين، ترتيب زمني) / s-curve (مسار على شكل S، 8 عناصر أو أقل) / fishbone-left (عظم سمكة لليسار، ترتيب عكسي) / fishbone-right (عظم سمكة لليمين، ترتيب زمني)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "عنوان الجدول الزمني (حتى 30 حرفًا)، مثل معالم المنتج"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "مصفوفة JSON لأحداث الجدول الزمني. مثال: [{\"date\":\"2024-01\",\"title\":\"إصدار v1.0\",\"description\":\"إطلاق الميزات الأساسية\",\"color\":\"#5470c6\",\"category\":\"معلم\"}]. description/color/category اختيارية"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "وضع التخطيط: vertical / alternating-top (متناوب أعلى، ترتيب عكسي) / alternating-bottom (متناوب أسفل، ترتيب زمني) / horizontal-left (أفقي، ترتيب عكسي) / horizontal-right (أفقي، ترتيب زمني) / s-curve / fishbone-left (عظم سمكة، ترتيب عكسي) / fishbone-right (عظم سمكة، ترتيب زمني)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "مصفوفة JSON للوحة الألوان العامة، مثل [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. تستبدل التناوب الافتراضي لثمانية ألوان. item.color له الأولوية"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "تباعد العناصر: compact (12px) / normal (20px، الافتراضي) / relaxed (32px). يناسب relaxed خمسة أحداث مختارة أو أقل؛ وcompact عشرة أو أكثر"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "يعرض مقطع SVG أو HTML داخل فقاعة المحادثة. استخدمها للجداول الزمنية ومخططات العلاقات (SVG) ومعاينات النماذج وبطاقات البيانات (HTML) والرسوم الإحصائية (SVG). لا تستخدمها لمخططات Mermaid؛ أخرج Mermaid ككتلة تعليمات برمجية ```mermaid في الرد. الحدود: 200 كيلوبايت أو أقل؛ <script src=...> من CDN موثوق فقط. النمط البصري: اختر بنية المعلومات (Bento/تدفق البطاقات/Grid) والتسلسل الطباعي ونظام الألوان حسب الموضوع. نغمات باردة بلا حواف لل نقاشات التقنية، وألوان محايدة مع أرقام بارزة للتقارير التجارية، وتدرجات/زجاجية/حركات دقيقة للعمل الإبداعي. حدد font-family وcolor دائمًا بشكل صريح؛ لا تعتمد على أنماط المتصفح الافتراضية."
"Widget title (up to 30 characters), e.g. Order Status Flow": "عنوان الودجت (حتى 30 حرفًا)، مثل تدفق حالة الطلب"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "يجب أن يبدأ SVG بـ <svg؛ ويجب أن تبدأ مقاطع HTML بالعنصر الجذري وألا تتضمن <html><body>. الحد الأقصى 200 كيلوبايت؛ <script src=...> من CDN موثوق فقط. لا تمرر صيغة Mermaid ‏(flowchart/graph/sequenceDiagram وغيرها)؛ أخرج Mermaid ككتلة تعليمات برمجية ```mermaid في الرد"
"Placeholder text shown while loading (optional)": "نص العنصر النائب المعروض أثناء التحميل (اختياري)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "تلميح السمة: light / dark / auto (حسب النظام). يجب أن يختار HTML الناتج ألوان الخلفية والنص وفقًا لذلك؛ ولا يُمرر إلى عارض الواجهة"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "ارتفاع الودجت الأولي بالبكسل (80-1200). الافتراضي 480. استخدم 300-400 للبطاقات المدمجة و600-800 للرسوم الكبيرة"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "وضع الخلفية: solid (الافتراضي) / transparent (لتركيب لقطات الشاشة على قالب PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "وضع شريحة PPT. عند true تُعرض البطاقة بنسبة 16:9 جاهزة للصق في عرض تقديمي. الافتراضي false الذي يحافظ على العرض حسب المحتوى"
"Section heading text, e.g. Completed this week": "نص عنوان القسم، مثل ما تم إنجازه هذا الأسبوع"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "مستوى العنوان: 1 = المستوى 1 (الأكبر)، 2 = المستوى 2، 3 = المستوى 3؛ الافتراضي 1"
"Body paragraph text (optional; used together with elements)": "فقرة النص (اختياري؛ تُستخدم مع elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "مصفوفة العناصر المنظمة (اختياري): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "نوع العنصر: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "محتوى النص (يُستخدم عندما type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "مصفوفة عناصر القائمة (تُستخدم عندما type=bullet_list أو ordered_list)"
"Table header row (required when type=table)": "صف رأس الجدول (مطلوب عندما type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "صفوف بيانات الجدول (مطلوبة عندما type=table)؛ كل صف مصفوفة قيم خلايا، مثل [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "نمط الجدول (اختياري عندما type=table): headerBgColor (خلفية الرأس) وheaderFontColor (لون نص الرأس) وstripeColor (الصفوف المتناوبة)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "عنوان URL للصورة (مطلوب عندما type=image)؛ يدعم روابط https:// الخارجية أو المرفقات الداخلية مثل /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "عرض الصورة بالسنتيمتر (type=image)؛ الافتراضي 14 سم"
"Image height in centimeters (type=image); default 10cm": "ارتفاع الصورة بالسنتيمتر (type=image)؛ الافتراضي 10 سم"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "هل النص عريض (اختياري عندما type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "هل النص مائل (اختياري عندما type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "هل النص تحته خط (اختياري عندما type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "حجم الخط بالنقاط، مثل 12 (اختياري عندما type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "لون النص (RGB سداسي عشري، مثل 2563EB؛ اختياري عندما type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "محاذاة النص: left/center/right/justify (اختياري عندما type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "لون خلفية الفقرة (RGB سداسي عشري، مثل EFF6FF؛ اختياري عندما type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "نمط صندوق التمييز (type=callout): info (أزرق) / success (أخضر) / warning (أصفر) / danger (أحمر)؛ الافتراضي info"
"KPI value (required when type=kpi), e.g. 17.68M": "قيمة KPI (مطلوبة عندما type=kpi)، مثل 17.68 مليون"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "وصف KPI (اختياري عندما type=kpi)، مثل النمو مقارنة بالشهر السابق"
"KPI trend (optional when type=kpi): up / down / flat": "اتجاه KPI (اختياري عندما type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "مصدر الاقتباس (اختياري عندما type=quote)، مثل التقرير السنوي 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "لغة التعليمات البرمجية (اختياري عندما type=code)، مثل sql/python/javascript؛ تحدد ألوان إبراز الصياغة"
"Worksheet name, e.g. Q2 Data": "اسم ورقة العمل، مثل بيانات الربع الثاني"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "مصفوفة رؤوس الأعمدة، مثل [\"التاريخ\",\"الإيرادات\",\"التغير\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "صفوف البيانات (مصفوفة ثنائية الأبعاد)؛ كل صف مصفوفة قيم خلايا، مثل [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "نمط الرأس (اختياري): headerBgColor (خلفية الرأس) وheaderFontColor (لون نص الرأس) وstripeColor (الصفوف المتناوبة)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "مصفوفة عروض الأعمدة (اختياري)، مثل [12, 20, 15]؛ القيم تقريبية بعرض الأحرف"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "تنسيق الأرقام (اختياري)، مثل \"#,##0.00\" أو \"yyyy-MM-dd\""
