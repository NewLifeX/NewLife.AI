"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Word-dokumentumot (.docx) hoz létre, és letöltési hivatkozást ad vissza. Támogatja a címeket, bekezdéseket, listákat, táblázatokat, képeket, oldaltöréseket, elválasztókat, kiemelődobozokat, KPI-kártyákat, idézeteket és kódblokkokat. A JSON sections tömb minden szakaszt heading, content és elements mezőkkel ír le"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Dokumentum címe (legfeljebb 30 karakter), például 2. negyedéves jelentés"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Szakaszok tömbje (JSON). Az egyes szakaszok mezői: heading (szakaszcím), headingLevel (1-3, alapértelmezett 1), content (szövegbekezdés, opcionális), elements (elemek tömbje, opcionális). Elemtípusok: paragraph ({type,text,opcionális bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,opcionális tableStyle}; a rows kétdimenziós tömb, minden sor egy cellaérték-tömb, például [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Téma (opcionális): kártyastílus-kulcs (például enterprise-blue) vagy beépített név (blue/dark/corporate/warm/green/minimal); ha kimarad, a beszélgetés stílusa vagy a márka alapértelmezése érvényes"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Excel-munkafüzetet (.xlsx) hoz létre, és letöltési hivatkozást ad vissza. Támogatja a több munkalapot, fejlécstílusokat, oszlopszélességeket, számformátumokat, feltételes formázást, ablaktáblák rögzítését, automatikus szűrést és a legördülő lista érvényesítését. A theme paraméter kártyastílus-kulcsot vagy beépített nevet fogad el (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Munkafüzet címe (legfeljebb 30 karakter), például 2. negyedéves bevételi jelentés"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Munkalapok tömbje (JSON). Az egyes munkalapok mezői: name, headers (fejlécek tömbje), rows (kétdimenziós tömb; minden sor egy cellaérték-tömb, például [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (például [12,20,15]), numberFormat (például \"#,##0.00\" vagy \"yyyy-MM-dd\"), conditionalFormats ({range,type,color,value?} tömbje; a type támogatja többek között a dataBar/colorScale/greaterThan értékeket), charts (diagramok tömbje), freezeRows (rögzített sorok száma), autoFilter (szűrési tartomány) és dropdowns (legördülő lista érvényesítése)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Téma (opcionális): kártyastílus-kulcs (például enterprise-blue) vagy beépített név (blue/dark/corporate/warm/green/minimal), amely a fejlécet és az összeszínt szabályozza; ha kimarad, a beszélgetés stílusa vagy a márka alapértelmezése érvényes"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "PowerPoint-prezentációt (.pptx) hoz létre, és letöltési hivatkozást ad vissza. Két egymást kizáró bemeneti mód: (1) slides mód, ahol az AI strukturált tartalmat ír le, és az elrendezés automatikusan készül; (2) widgetSrc mód, amely a korábban létrehozott show_widget kártyákat diákképként ágyazza be. A theme paraméter kártyastílus-kulcsot (például enterprise-blue/raycast-dark/ppt-executive) vagy beépített nevet fogad el (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "A prezentáció címe (legfeljebb 30 karakter), például 2. negyedéves áttekintés"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Diák tömbje (JSON). Egy elem = egy diák, több elem = teljes prezentáció. Egymást kizáró a widgetSrc paraméterrel. Az egyes diák mezői: title, layout (title_only/title_content/two_column/chart_only/blank), background (hexadecimális szín), footer, showPageNumber (true/false), elements (elemek listája), notes és transition. Az elements a következőket támogatja: text (role=title/subtitle/body/kpi/caption; opcionális bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; a rows kétdimenziós tömb, minden sor egy cellaérték-tömb, például [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; opcionális tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Példa: [{\"title\":\"Borító\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"2. negyedéves áttekintés\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife csapat\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "show_widget kártyaazonosítók vesszővel elválasztott listája, például 'call_abc123,call_def456'. Egymást kizáró a slides paraméterrel. A létrehozott kártyákat diákképpé alakítja"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Téma (opcionális): kártyastílus-kulcs (például enterprise-blue/ppt-executive) vagy beépített név (blue/dark/corporate/warm/green/minimal stb.); ha kimarad, a beszélgetés stílusa vagy a márka alapértelmezése érvényes"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Az adatokat interaktív diagramként jeleníti meg (nagyítás, rámutatás, képként exportálás). Körülbelül 20-szor gyorsabb a show_widgetnél: elég egy JSON-leírás (körülbelül 200 token), és a felület azonnal kirajzolja ECharts segítségével. Támogatott típusok: bar, line (vonal/terület), pie (kör/torta), scatter, radar, map_china (kínai tartományi hőtérkép), heatmap (mátrix hőtérkép), gauge, funnel, treemap. Számszerű összehasonlításhoz, idősorokhoz (vonal), arányelemzéshez és földrajzi eloszláshoz alkalmas. Megjegyzés: útvonalakhoz, történelmi eseményekhez, mérföldkövekhez és idővonalakhoz a show_timeline eszközt használja; ez az eszköz nem támogatja a timeline típust. Vizuális stílus: a data.colors mezőn keresztül adjon színpalettát az ECharts alapértelmezéseire támaszkodás helyett. Javaslatok: márkaszín egy sorozathoz, egyenletesen elosztott árnyalatok (10-12 szín) több sorozathoz, kiegészítő színek összehasonlításhoz, egyszínű színátmenet trendekhez. Kék és arany a pénzügyhöz, kék/zöld/fehér az egészségügyhöz, lila/kék/cián a technológiához és az AI-hoz. Nagy adathalmazoknál állítsa a data.animation értékét false-ra a megjelenítési költség csökkentéséhez."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Diagramtípus: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "A diagram címe (legfeljebb 30 karakter), például GDP tartományonként 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON-objektum; a szerkezetét az eszköz leírása tartalmazza. bar példa: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Bevétel\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; több sorozatú radar példa: {\"indicators\":[{\"name\":\"Sebesség\",\"max\":100},{\"name\":\"Erő\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar feltétel: az indicators száma egyezzen meg minden series[i].data hosszával, és a data csak számokat tartalmazhat"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Visszaadja a bejelentkezett felhasználó adatait: felhasználónév, megjelenített név, e-mail, mobil, kód, szerepkörök, részleg, nem, életkor, születési dátum és megjegyzések, valamint a látogató IP-címe, városa és részletes földrajzi helye"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Adatbázistáblák sémáját keresi kulcsszóval. Az eredmény két részből áll: (1) tábla-kapcsolat térkép (Markdown-táblázat, amely megmutatja, melyik tábla melyik kapcsolathoz tartozik; az azonos nevű táblák különböző kapcsolatokban külön szerepelnek); (2) a táblák XML-sémája kapcsolatonként. A későbbi run_sql hívásoknak a térkép táblázatában szereplő kapcsolatnevet kell használniuk"
"Search keywords, separated by commas or spaces": "Vesszővel vagy szóközzel elválasztott keresőkulcsszavak"
"Restrict to a connection name; empty searches all connections": "Korlátozás kapcsolatnévre; üresen minden kapcsolatban keres"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "SQL-utasítást futtat a megadott adatbázis-kapcsolaton. A SELECT/WITH lekérdezések sorokat adnak vissza; a nem lekérdező utasítások, például az INSERT/UPDATE/DELETE, az érintett sorok számát adják vissza. A connName értékének meg kell egyeznie a search_table által visszaadott kapcsolat oszloppal"
"Database connection name (from the connection column of search_table)": "Az adatbázis-kapcsolat neve (a search_table kapcsolat oszlopából)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL-utasítás. A SELECT/WITH eredményhalmazt ad vissza; a nem lekérdező utasítások az érintett sorok számát adják vissza"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Egy adott dátum holdnaptári dátumát, napfogalmát és munkanap-státuszát keresi (munkanap/szabadnap/ledolgozó nap)"
"Date to query in yyyy-MM-dd format. Defaults to today": "A keresett dátum yyyy-MM-dd formátumban. Alapértelmezett a mai nap"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "A feladatokat többoszlopos Kanban-táblaként jeleníti meg (például Teendő -> Folyamatban -> Kész). Projektfázisok bontásához, sprinttervezéshez, munkafolyamat-megjelenítéshez és feladatállapot-osztályozáshoz alkalmas. Minden oszlophoz tartozhat színcímke és WIP-korlát; minden kártyához cím, leírás, prioritás, címkék, határidő, felelős, részfeladat-lista, előrehaladás és hivatkozás. Két elrendezés: board (alapértelmezett többoszlopos tábla) és swimlane (az oszlopok csapat vagy egység szerint csoportosítva)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "A tábla címe (legfeljebb 30 karakter), például Sprint 1 tábla"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Az oszlopdefiníciók JSON-tömbje. Példa: [{\"id\":\"todo\",\"title\":\"Teendő\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Követelményelemzés\",\"description\":\"Felhasználói igények összegyűjtése\",\"priority\":\"high\",\"tags\":[\"tervezés\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Felhasználói interjú\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Az id és title kivételével minden mező opcionális"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Elrendezési mód: board (alapértelmezett többoszlopos tábla) vagy swimlane (az oszlopok csapat vagy egység szerint csoportosítva; a swimlanes paraméter kötelező)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "A sávdefiníciók JSON-tömbje (layout=swimlane esetén használatos). Példa: [{\"id\":\"sl1\",\"title\":\"Frontend csapat\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Backend csapat\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Koordinátapontokat (városokat vagy POI-kat) jelöl meg, vagy tartományokat emel ki Kína térképén, feliratozott SVG-térképet készít, és a beszélgetésbuborékban megjeleníti. Támogatja: (1) tartományok egyedi színezését; (2) WGS84-jelölőket szélességgel, hosszúsággal és címketexttel; (3) automatikus jelmagyarázatot a jobb alsó sarokban. Tipikus felhasználás: adatok tartomány szerinti eloszlása, városok helyzete, regionális értékesítési hőtérképek."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "A térkép címe (legfeljebb 30 karakter), például GDP tartományonként 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "A jelölők JSON-tömbje (üres tömb is lehet: []). Formátum: [{\"name\":\"Peking\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Peking\\n4376 milliárd\",\"color\":\"#E74C3C\",\"size\":8}]. A lat/lng tizedes fokban, WGS84 szerint; a color/size opcionális"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "A tartománykiemelések JSON-tömbje (üres tömb is lehet: []). Formátum: [{\"name\":\"Kuangtung\",\"color\":\"#FFB347\",\"label\":\"GDP első\"}]. A name a tartomány kínai nevét fogadja el (teljes vagy rövidített formában); a label opcionális"
"Legend title (optional), e.g. GDP scale": "A jelmagyarázat címe (opcionális), például GDP-skála"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Színséma (opcionális): blue/orange/green/purple/red; alapértelmezett blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Jelölőforma (opcionális): circle/pin/square; alapértelmezett circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Tudáshierarchiákat vagy fogalmak közötti kapcsolatokat jelenít meg összecsukható, interaktív gondolattérképként. A bemenet Markdown-vázlat (# / ## / ###), amelyet a felület vizuális fává alakít. Tudásrendezéshez, fogalmak bontásához, technológiák összehasonlításához, lehetőségek értékeléséhez és tartalom-összegzéshez alkalmas. Vizuális stílus: a témához válasszon branchColors (3-8 harmonikus szín), maxDepth (bonyolultság) és collapsed (kezdeti összecsukás a fókusz érdekében) értéket. Hideg színeket (kék/lila/cián) használjon a technológiához és adatokhoz, meleg színeket (narancs/arany/piros) az üzlethez és marketinghez, zöldet a természethez és egészséghez. Sűrű csomópontoknál állítsa a maxDepth értékét 2-re az olvashatóság megőrzéséhez. 6 elrendezés: tree (alapértelmezett, fogazott fa, általános) / radial (sugárirányú balra-jobbra, tudástérképekhez a legjobb) / lr (középről jobbra, folyamatábrák/döntési fák) / rl (középről balra, visszakövetés) / tb (középről lefelé, szervezeti ábrák) / bt (középről felfelé, alulról felfelé épülő hierarchia)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "A gondolattérkép címe (legfeljebb 30 karakter), például AI technológiai stack"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown-vázlat # / ## / ### jelöléssel az 1-3. szinthez. Példa:\n# Mesterséges intelligencia\n## Gépi tanulás\n### Felügyelt tanulás\n### Nem felügyelt tanulás\n## Mélytanulás\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Elrendezési mód: tree (alapértelmezett, fogazott fa, általános) / radial (sugárirányú balra-jobbra, tudástérképekhez a legjobb) / lr (középről jobbra, folyamatábrák/döntési fák) / rl (középről balra, visszakövetés) / tb (középről lefelé, szervezeti ábrák) / bt (középről felfelé, alulról felfelé épülő hierarchia)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Az ágszínek JSON-tömbje, például [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Sorban 3-8 hexadecimális színt rendel az első szintű ágakhoz. Ha kimarad, az alapértelmezett paletta érvényes: kék/lila, zöld, sárga, piros, cián, sötétzöld, narancs és lila"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "A kezdetben összecsukott csomópontok azonosítóinak JSON-tömbje, például [\"n2\",\"n5\"]. Üresen minden kinyílik. A fontos ágakra való összpontosításhoz használható"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Maximális látható mélység: 1 = csak első szintű ágak, 2 = két szint, alapértelmezésben korlátlan. Sűrű csomópontoknál állítsa 2-re az olvashatóság megőrzéséhez"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Az idősoros adatokat elegáns idővonal-kártyákként jeleníti meg. Elég a JSON (körülbelül 100 token), és a felület azonnal megjeleníti. Projektmérföldkövekhez, történelmi eseményekhez, kiadási tervekhez és fejlesztési előzményekhez alkalmas. Minden eseményhez tartozhat dátum, cím, leírás, szín és kategória. Vizuális stílus: a palette paraméterrel (például kék-lila színátmenet, meleg bronz, márkaszínek) adjon egységes palettát, hogy az idővonal egységes karaktert kapjon; az item.color az egyes elemeket írja felül. Öt vagy kevesebb válogatott eseményhez density=relaxed, tíz vagy több eseményhez density=compact használjon. 8 elrendezés: vertical (5-20 elem) / alternating-top (felváltva felül, fordított időrend) / alternating-bottom (felváltva alul, időrend) / horizontal-left (vízszintesen balra, fordított) / horizontal-right (vízszintesen jobbra, időrend) / s-curve (S-görbe, 8 elem vagy kevesebb) / fishbone-left (halszálka balra, fordított) / fishbone-right (halszálka jobbra, időrend)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Az idővonal címe (legfeljebb 30 karakter), például Termékmérföldkövek"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Az idővonal-események JSON-tömbje. Példa: [{\"date\":\"2024-01\",\"title\":\"v1.0 kiadás\",\"description\":\"Alapfunkciók bevezetése\",\"color\":\"#5470c6\",\"category\":\"mérföldkő\"}]. A description/color/category opcionális"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Elrendezési mód: vertical / alternating-top (felváltva felül, fordított) / alternating-bottom (felváltva alul, időrend) / horizontal-left (vízszintes, fordított) / horizontal-right (vízszintes, időrend) / s-curve / fishbone-left (halszálka, fordított) / fishbone-right (halszálka, időrend)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Az általános színpaletta JSON-tömbje, például [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Felülírja az alapértelmezett nyolcszínű váltakozást. Az item.color élvez elsőbbséget"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Elemtávolság: compact (12px) / normal (20px, alapértelmezett) / relaxed (32px). A relaxed öt vagy kevesebb válogatott eseményhez, a compact tíz vagy több eseményhez illik"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "SVG- vagy HTML-töredéket jelenít meg a beszélgetésbuborékban. Idővonalakhoz és kapcsolati ábrákhoz (SVG), űrlapelőnézetekhez és adatkártyákhoz (HTML), statisztikai grafikákhoz (SVG) használja. Mermaid-diagramokhoz ne használja; a Mermaid kódot ```mermaid kódblokként adja meg a válaszban. Korlátok: legfeljebb 200 KB; <script src=...> csak megbízható CDN-ről. Vizuális stílus: a témához válasszon információarchitektúrát (Bento/kártyafolyam/Grid), tipográfiai hierarchiát és színrendszert. Technikai vitákhoz sarok nélküli hideg tónusok, üzleti jelentésekhez semleges színek kiemelt számokkal, kreatív munkákhoz színátmenetek/üveghatás/finom animációk. Mindig adja meg kifejezetten a font-family és color értékeket; ne támaszkodjon a böngésző alapértelmezett stílusaira."
"Widget title (up to 30 characters), e.g. Order Status Flow": "A widget címe (legfeljebb 30 karakter), például Rendelésállapot-folyamat"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "Az SVG-nek <svg-vel kell kezdődnie; a HTML-töredéknek a gyökérelemmel kell kezdődnie, és nem tartalmazhat <html><body> elemet. Legfeljebb 200 KB; <script src=...> csak megbízható CDN-ről. Ne adjon át Mermaid-szintaxist (flowchart/graph/sequenceDiagram stb.); a Mermaid kódot ```mermaid kódblokként adja meg a válaszban"
"Placeholder text shown while loading (optional)": "A betöltés közben megjelenő helyőrző szöveg (opcionális)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Témajelzés: light / dark / auto (rendszer szerint). A generált HTML-nek ennek megfelelően kell megválasztania a háttér- és szövegszínt; nem kerül át a felületi megjelenítőnek"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "A widget kezdeti magassága pixelben (80-1200). Alapértelmezett 480. Kompakt kártyákhoz 300-400, nagy diagramokhoz 600-800 használjon"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Háttérmód: solid (alapértelmezett) / transparent (képernyőképek PPT-sablonba illesztéséhez)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT-diamód. Ha true, a kártya 16:9 arányban, prezentációba illesztésre készen jelenik meg. Az alapértelmezett false a tartalomhoz igazodó megjelenítés"
"Section heading text, e.g. Completed this week": "A szakasz címének szövege, például Ezen a héten elkészült"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Címszint: 1 = első szint (legnagyobb), 2 = második szint, 3 = harmadik szint; alapértelmezett 1"
"Body paragraph text (optional; used together with elements)": "Szövegbekezdés (opcionális; az elements mellett használatos)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Strukturált elemek tömbje (opcionális): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Elemtípus: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Szövegtartalom (type=paragraph/callout/quote/code esetén használatos)"
"List item array (used when type=bullet_list or ordered_list)": "Listaelemek tömbje (type=bullet_list vagy ordered_list esetén használatos)"
"Table header row (required when type=table)": "Táblázat fejlécsora (type=table esetén kötelező)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Táblázat adatsorai (type=table esetén kötelező); minden sor egy cellaérték-tömb, például [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Táblázatstílus (type=table esetén opcionális): headerBgColor (fejléc háttere), headerFontColor (fejléc szövegszíne), stripeColor (váltakozó sorok)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "Kép URL-je (type=image esetén kötelező); támogatja a külső https:// hivatkozásokat vagy a belső mellékleteket, például /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Képszélesség centiméterben (type=image); alapértelmezett 14 cm"
"Image height in centimeters (type=image); default 10cm": "Képmagasság centiméterben (type=image); alapértelmezett 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "A szöveg félkövér-e (type=paragraph/callout/quote esetén opcionális)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "A szöveg dőlt-e (type=paragraph/callout/quote esetén opcionális)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "A szöveg aláhúzott-e (type=paragraph/callout/quote esetén opcionális)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Betűméret pontban, például 12 (type=paragraph/callout esetén opcionális)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Szövegszín (hexadecimális RGB, például 2563EB; type=paragraph/callout/quote esetén opcionális)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Szövegigazítás: left/center/right/justify (type=paragraph esetén opcionális)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Bekezdés háttérszíne (hexadecimális RGB, például EFF6FF; type=paragraph esetén opcionális)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Kiemelődoboz stílusa (type=callout): info (kék) / success (zöld) / warning (sárga) / danger (piros); alapértelmezett info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI-érték (type=kpi esetén kötelező), például 17,68 millió"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI-címke (type=kpi esetén opcionális), például növekedés az előző hónaphoz képest"
"KPI trend (optional when type=kpi): up / down / flat": "KPI-trend (type=kpi esetén opcionális): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Idézetforrás (type=quote esetén opcionális), például 2026. évi jelentés"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Kódnyelv (type=code esetén opcionális), például sql/python/javascript; meghatározza a szintaxiskiemelést"
"Worksheet name, e.g. Q2 Data": "Munkalap neve, például 2. negyedéves adatok"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Oszlopfejlécek tömbje, például [\"Dátum\",\"Bevétel\",\"Változás\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Adatsorok (kétdimenziós tömb); minden sor egy cellaérték-tömb, például [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Fejlécstílus (opcionális): headerBgColor (fejléc háttere), headerFontColor (fejléc szövegszíne), stripeColor (váltakozó sorok)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Oszlopszélességek tömbje (opcionális), például [12, 20, 15]; az értékek hozzávetőleges karakterszélességek"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Számformátum (opcionális), például \"#,##0.00\" vagy \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Feltételes formázások tömbje (opcionális). Az egyes elemek mezői: range (például \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan stb.), color (fő szín), value (küszöb)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Diagramdefiníciók tömbje (opcionális): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Rögzítendő felső sorok száma (0 = nincs, 1 = első sor rögzítése; alapértelmezett 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Automatikus szűrés tartománya (például \"A1:E1\"); üresen letiltva"
"Dropdown validation array (optional)": "Legördülő lista érvényesítési műveleteinek tömbje (opcionális)"
"Applied range (e.g. \"C2:C10\")": "Az alkalmazott tartomány (például \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Feltételtípus: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Az adatsávokhoz, színskálákhoz vagy kiemeléshez használt szín (hexadecimális RGB, például 2563EB)"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Küszöb vagy képlet (például 1000 vagy =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Diagramtípus: bar / line / pie"
"Chart title (optional)": "A diagram címe (opcionális)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Kategóriatengely-címkék tömbje, például [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Adatsorozatok tömbje; minden elem name és data mezőt tartalmaz"
"Applied range (e.g. \"A2:A100\")": "Az alkalmazott tartomány (például \"A2:A100\")"
"Dropdown option array": "Legördülő lista beállításainak tömbje"
"Title of this slide": "A dia címe"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Diaelrendezés: title_only (csak cím, borítókhoz) / title_content (cím + szöveg, alapértelmezett) / two_column (két oszlop) / chart_only (teljes szélességű diagram) / blank (üres terület)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "A dia háttérszíne, hexadecimális RGB, például \"1F497D\"; ha kimarad, a téma háttere érvényes"
"Slide element list; each element describes a text block, table, chart, or image": "A dia elemeinek listája; minden elem egy szövegblokkot, táblázatot, diagramot vagy képet ír le"
"Footer text displayed at the bottom of the slide; null hides it": "A dia alján megjelenő láblécszöveg; a null elrejti"
"Whether to show the slide number in the bottom-right corner; default false": "Megjelenjen-e a dia száma a jobb alsó sarokban; alapértelmezett false"
"Speaker notes used as a reminder while presenting": "Előadói jegyzetek, amelyek emlékeztetőként szolgálnak az előadás során"
"Transition animation: fade / push / wipe / zoom / split / cut": "Átmeneti effektus: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Elemtípus: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Szemantikai szerep (csak text elemeknél): title / subtitle / body / caption / kpi. Az elrendezésmotor ezt használja az elem automatikus elhelyezéséhez, koordináták nélkül"
"Text content (required when type=text)": "Szövegtartalom (type=text esetén kötelező)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Betűméret pontban (opcionális); ha kimarad, az elrendezésmotor a role szerint választ (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "A szöveg félkövér-e; alapértelmezett false"
"Whether the text is italic (optional for type=text); default false": "A szöveg dőlt-e (type=text esetén opcionális); alapértelmezett false"
"Whether the text is underlined (optional for type=text); default false": "A szöveg aláhúzott-e (type=text esetén opcionális); alapértelmezett false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Szövegszín, hexadecimális RGB, például \"FFFFFF\"; ha kimarad, a téma szövegszínét örökli"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Táblázat fejlécsorának tömbje (type=table esetén kötelező), például [\"Mutató\",\"Q1\",\"Q2\",\"Változás\"]"
"Chart type (required when type=chart): bar / line / pie": "Diagramtípus (type=chart esetén kötelező): bar / line / pie"
