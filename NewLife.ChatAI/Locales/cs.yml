"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Vytvoří dokument Word (.docx) a vrátí odkaz ke stažení. Podporuje nadpisy, odstavce, seznamy, tabulky, obrázky, zlomy stránek, oddělovače, zvýrazněné rámečky, KPI, citace a bloky kódu. Pole JSON sections popisuje každou sekci pomocí heading, content a elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Název dokumentu (maximálně 30 znaků), například Čtvrtletní zpráva Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Pole sekcí (JSON). Pole každé sekce: heading (název sekce), headingLevel (1-3, výchozí 1), content (odstavec, volitelné), elements (pole prvků, volitelné). Typy prvků: paragraph ({type,text, volitelně bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, volitelně tableStyle}; rows je dvourozměrné pole, každý řádek je pole hodnot buněk, například [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Téma (volitelné): klíč stylu karty (například enterprise-blue) nebo vestavěný název (blue/dark/corporate/warm/green/minimal); pokud chybí, použije se styl konverzace nebo výchozí hodnota značky"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Vytvoří sešit Excel (.xlsx) a vrátí odkaz ke stažení. Podporuje více listů, styly záhlaví, šířky sloupců, číselné formáty, podmíněné formátování, ukotvená okna, automatické filtry a ověřování rozevíracích seznamů. Parametr theme přijímá klíč stylu karty nebo vestavěný název (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Název sešitu (maximálně 30 znaků), například Zpráva o výnosech Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Pole listů (JSON). Pole každého listu: name, headers (pole záhlaví), rows (dvourozměrné pole; každý řádek je pole hodnot buněk, například [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (například [12,20,15]), numberFormat (například \"#,##0.00\" nebo \"yyyy-MM-dd\"), conditionalFormats (pole {range,type,color,value?}; type podporuje dataBar/colorScale/greaterThan atd.), charts (pole grafů), freezeRows (počet ukotvených řádků), autoFilter (rozsah filtru), dropdowns (ověřování rozevíracího seznamu)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Téma (volitelné): klíč stylu karty (například enterprise-blue) nebo vestavěný název (blue/dark/corporate/warm/green/minimal), který řídí záhlaví a celkové barvy; pokud chybí, použije se styl konverzace nebo výchozí hodnota značky"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Vytvoří prezentaci PowerPoint (.pptx) a vrátí odkaz ke stažení. Dva vzájemně se vylučující režimy vstupu: (1) režim slides, kdy AI popíše strukturovaný obsah a rozvržení se vytvoří automaticky; (2) režim widgetSrc, který vloží dříve vytvořené karty show_widget jako obrázky snímků. Parametr theme přijímá klíč stylu karty (například enterprise-blue/raycast-dark/ppt-executive) nebo vestavěný název (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Název prezentace (maximálně 30 znaků), například Čtvrtletní přehled Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Pole snímků (JSON). Jeden prvek = jeden snímek; více prvků = celá prezentace. Vylučuje se s widgetSrc. Pole každého snímku: title, layout (title_only/title_content/two_column/chart_only/blank), background (hexadecimální barva), footer, showPageNumber (true/false), elements (seznam prvků), notes, transition. elements podporuje: text (role=title/subtitle/body/kpi/caption; volitelně bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows je dvourozměrné pole, každý řádek je pole hodnot buněk, například [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; volitelně tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Příklad: [{\"title\":\"Titulní\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Přehled Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Tým NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Seznam ID karet show_widget oddělený čárkami, například 'call_abc123,call_def456'. Vylučuje se s slides. Převede vytvořené karty na obrázky snímků"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Téma (volitelné): klíč stylu karty (například enterprise-blue/ppt-executive) nebo vestavěný název (blue/dark/corporate/warm/green/minimal atd.); pokud chybí, použije se styl konverzace nebo výchozí hodnota značky"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Zobrazí data jako interaktivní graf (přibližování, najetí, export jako obrázek). Přibližně 20krát rychlejší než show_widget: stačí specifikace JSON (asi 200 tokenů) a frontend ji okamžitě vykreslí pomocí ECharts. Podporuje: bar, line (čára/plocha), pie (koláč/prstenec), scatter, radar, map_china (teplotní mapa čínských provincií), heatmap (maticová teplotní mapa), gauge, funnel a treemap. Vhodné pro porovnání čísel, časové řady (čára), analýzu podílů a geografické rozložení. Poznámka: pro itineráře, historické události, milníky a časové osy použijte show_timeline; tento nástroj typ timeline nepodporuje. Vizuální styl: předejte barevné schéma přes data.colors místo spoléhání na výchozí hodnoty ECharts. Doporučení: barva značky pro jednu řadu, rovnoměrně rozložené odstíny (10-12 barev) pro více řad, doplňkové barvy pro srovnání a jednobarevný přechod pro trendy. Modrá a zlatá pro finance, modrá/zelená/bílá pro zdravotnictví a fialová/modrá/azurová pro techniku a AI. U velkých datových sad nastavte data.animation=false pro snížení nákladů na vykreslení."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Typ grafu: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Název grafu (maximálně 30 znaků), například HDP podle provincií 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Objekt JSON; struktura je popsána v popisu nástroje. Příklad bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Výnosy\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; příklad radar s více řadami: {\"indicators\":[{\"name\":\"Rychlost\",\"max\":100},{\"name\":\"Síla\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; požadavek radar: počet indicators musí odpovídat délce každého series[i].data a data musí obsahovat pouze čísla"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Vrátí podrobnosti o přihlášeném uživateli včetně uživatelského jména, zobrazovaného jména, e-mailu, mobilu, kódu, rolí, oddělení, pohlaví, věku, data narození a poznámky, dále IP adresu návštěvníka, město a podrobnou geografickou polohu"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Vyhledá schémata databázových tabulek podle klíčového slova. Výsledek má dvě části: (1) mapování tabulka-spojení (tabulka Markdown, která ukazuje, ke kterému spojení každá tabulka patří; stejnojmenné tabulky v různých spojeních jsou uvedeny samostatně); (2) XML schématu tabulek pro každé spojení. Pozdější volání run_sql musí použít název spojení z mapovací tabulky"
"Search keywords, separated by commas or spaces": "Klíčová slova hledání oddělená čárkami nebo mezerami"
"Restrict to a connection name; empty searches all connections": "Omezit na název spojení; prázdné prohledá všechna spojení"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Spustí příkaz SQL na zadaném databázovém spojení. Dotazy SELECT/WITH vracejí řádky; příkazy, které nejsou dotazy, jako INSERT/UPDATE/DELETE, vracejí počet ovlivněných řádků. connName musí odpovídat sloupci spojení vrácenému funkcí search_table"
"Database connection name (from the connection column of search_table)": "Název databázového spojení (ze sloupce spojení v search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Příkaz SQL. SELECT/WITH vrací sadu výsledků; příkazy, které nejsou dotazy, vracejí počet ovlivněných řádků"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Zjistí datum lunárního kalendáře, sluneční termín a stav pracovního dne (pracovní den/svátek/náhradní den) pro dané datum"
"Date to query in yyyy-MM-dd format. Defaults to today": "Datum k dotazu ve formátu yyyy-MM-dd. Výchozí je dnes"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Zobrazí seznam úkolů jako více sloupcovou kanbanovou tabuli (například K udělání -> Probíhá -> Hotovo). Vhodné pro rozklad projektu, plánování sprintu, zobrazení pracovního postupu a klasifikaci stavů úkolů. Každý sloupec může mít barevný ukazatel a limit WIP; každá karta může mít název, popis, prioritu, štítky, termín, řešitele, kontrolní seznam, průběh a odkaz. Dvě rozvržení: board (výchozí více sloupcová tabule) a swimlane (sloupce seskupené podle týmu nebo modulu)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Název tabule (maximálně 30 znaků), například Tabule Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Pole JSON s definicemi sloupců. Příklad: [{\"id\":\"todo\",\"title\":\"K udělání\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Analýza požadavků\",\"description\":\"Shromáždit požadavky uživatelů\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Rozhovory s uživateli\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Všechna pole kromě id a title jsou volitelná"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Režim rozvržení: board (výchozí více sloupcová tabule) nebo swimlane (sloupce seskupené podle týmu nebo modulu; vyžaduje parametr swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Pole JSON s definicemi plavebních drah (použije se při layout=swimlane). Příklad: [{\"id\":\"sl1\",\"title\":\"Frontendový tým\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Backendový tým\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Označí body souřadnic (města nebo POI) nebo zvýrazní provincie na mapě Číny, vytvoří anotovanou SVG mapu a vykreslí ji v bublině chatu. Podporuje: (1) vyplnění provincií vlastními barvami; (2) značky WGS84 se zeměpisnou šířkou a délkou a textem popisku; (3) automatickou legendu v pravém dolním rohu. Typické použití: rozložení dat podle provincií, poloha měst a teplotní mapy regionálních prodejů."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Název mapy (maximálně 30 znaků), například HDP podle provincií 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Pole JSON se značkami (může být prázdné pole []). Formát: [{\"name\":\"Peking\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Peking\\n4376 mld\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng jsou desetinné stupně WGS84; color/size jsou volitelné"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Pole JSON se zvýrazněním provincií (může být prázdné pole []). Formát: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"č. 1 HDP\"}]. name přijímá čínský název provincie (úplný nebo zkrácený); label je volitelný"
"Legend title (optional), e.g. GDP scale": "Název legendy (volitelné), například Škála HDP"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Barevné schéma (volitelné): blue/orange/green/purple/red; výchozí blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Styl značky (volitelné): circle/pin/square; výchozí circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Zobrazí hierarchie znalostí nebo vztahy pojmů jako sbalitelnou interaktivní myšlenkovou mapu. Vstupem je osnova Markdown (# / ## / ###), kterou frontend převede na vizuální strom. Vhodné pro organizaci znalostí, rozklad pojmů, srovnání technologií, hodnocení možností a shrnutí obsahu. Vizuální styl: vyberte branchColors (3-8 sladěných barev), maxDepth (složitost) a collapsed (počáteční sbalení pro zaměření) podle tématu. Studené barvy (modrá/fialová/azurová) pro techniku a data, teplé (oranžová/zlatá/červená) pro byznys a marketing, zelené pro přírodu a zdraví. U hustých uzlů nastavte maxDepth=2 pro čitelnost. 6 rozvržení: tree (výchozí odsazený strom, univerzální) / radial (radiální zleva doprava, nejlepší pro mapy znalostí) / lr (ze středu doprava, vývojové diagramy/rozhodovací stromy) / rl (ze středu doleva, zpětné sledování) / tb (ze středu dolů, organizační schémata) / bt (ze středu nahoru, hierarchie zdola nahoru)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Název myšlenkové mapy (maximálně 30 znaků), například Technologický stack AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Osnova Markdown s # / ## / ### pro úrovně 1-3. Příklad:\n# Umělá inteligence\n## Strojové učení\n### Učení s učitelem\n### Učení bez učitele\n## Hluboké učení\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Režim rozvržení: tree (výchozí odsazený strom, univerzální) / radial (radiální zleva doprava, nejlepší pro mapy znalostí) / lr (ze středu doprava, vývojové diagramy/rozhodovací stromy) / rl (ze středu doleva, zpětné sledování) / tb (ze středu dolů, organizační schémata) / bt (ze středu nahoru, hierarchie zdola nahoru)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Pole JSON s barvami větví, například [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3 až 8 hexadecimálních barev přiřazených v pořadí větvím první úrovně. Pokud chybí, použije se výchozí paleta modrá/fialová, zelená, žlutá, červená, blankytná, tmavě zelená, oranžová, fialová"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Pole JSON s ID uzlů sbalených na začátku, například [\"n2\",\"n5\"]. Prázdné rozbalí vše. Slouží k zaměření na klíčové větve"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Maximální viditelná hloubka: 1 = pouze větve první úrovně, 2 = dvě úrovně, výchozí bez omezení. U hustých uzlů nastavte 2 pro čitelnost"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Zobrazí data časových řad jako elegantní karty časové osy. Stačí JSON (asi 100 tokenů) a frontend je okamžitě vykreslí. Vhodné pro milníky projektu, historické události, plány vydání a historii vývoje. Každá událost může mít datum, název, popis, barvu a kategorii. Vizuální styl: nastavte globální paletu pomocí parametru palette (například modrofialový přechod, teplý bronz, barvy značky) pro jednotnou atmosféru; item.color přepíše jednotlivou položku. Použijte density=relaxed pro 5 nebo méně vybraných událostí a density=compact pro 10 a více. 8 rozvržení: vertical (5-20 položek) / alternating-top (střídavě nahoře, obrácené pořadí) / alternating-bottom (střídavě dole, chronologicky) / horizontal-left (vodorovně vlevo, obrácené pořadí) / horizontal-right (vodorovně vpravo, chronologicky) / s-curve (dráha ve tvaru S, 8 položek nebo méně) / fishbone-left (rybí kost vlevo, obrácené pořadí) / fishbone-right (rybí kost vpravo, chronologicky)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Název časové osy (maximálně 30 znaků), například Milníky produktu"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Pole JSON s událostmi časové osy. Příklad: [{\"date\":\"2024-01\",\"title\":\"Vydání v1.0\",\"description\":\"Hlavní funkce spuštěny\",\"color\":\"#5470c6\",\"category\":\"Milník\"}]. description/color/category jsou volitelné"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Režim rozvržení: vertical / alternating-top (střídavě nahoře, obrácené pořadí) / alternating-bottom (střídavě dole, chronologicky) / horizontal-left (vodorovně, obrácené pořadí) / horizontal-right (vodorovně, chronologicky) / s-curve / fishbone-left (rybí kost, obrácené pořadí) / fishbone-right (rybí kost, chronologicky)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Pole JSON globální palety, například [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Nahrazuje výchozí rotaci 8 barev. item.color má přednost"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Odstup položek: compact (12px) / normal (20px, výchozí) / relaxed (32px). relaxed se hodí pro 5 nebo méně vybraných událostí; compact pro 10 a více"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Vykreslí fragment SVG nebo HTML do bubliny chatu. Použijte pro časové osy a diagramy vztahů (SVG), náhledy formulářů a datové karty (HTML) a statistické grafy (SVG). Nepoužívejte pro diagramy Mermaid; Mermaid uvádějte jako blok kódu ```mermaid v odpovědi. Omezení: maximálně 200 KB; <script src=...> pouze z důvěryhodných CDN. Vizuální styl: vyberte informační architekturu (Bento/tok karet/Grid), typografickou hierarchii a barevný systém podle tématu. Studené bezpatkové tóny pro technické diskuse, neutrální barvy se zvýrazněnými čísly pro obchodní zprávy a přechody/glassmorphism/mikroanimace pro kreativní práci. Vždy výslovně nastavte font-family a color; nespoléhejte na výchozí styly prohlížeče."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Název widgetu (maximálně 30 znaků), například Tok stavu objednávky"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG musí začínat <svg; fragmenty HTML musí začínat kořenovým prvkem a nesmí obsahovat <html><body>. Maximálně 200 KB; <script src=...> pouze z důvěryhodných CDN. Nepředávejte syntaxi Mermaid (flowchart/graph/sequenceDiagram atd.); Mermaid uvádějte jako blok kódu ```mermaid v odpovědi"
"Placeholder text shown while loading (optional)": "Zástupný text zobrazený během načítání (volitelné)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Nápověda tématu: light / dark / auto (podle systému). Generované HTML by podle toho mělo zvolit barvu pozadí a textu; do frontendového rendereru se nepředává"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Počáteční výška widgetu v px (80-1200). Výchozí 480. Pro kompaktní karty použijte 300-400 a pro velké grafy 600-800"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Režim pozadí: solid (výchozí) / transparent (pro překrytí snímků obrazovky šablonou PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Režim snímku PPT. Při true se karta vykreslí v poměru 16:9 a je připravena k vložení do prezentace. Výchozí false zachovává šířku podle obsahu"
"Section heading text, e.g. Completed this week": "Text nadpisu sekce, například Dokončeno tento týden"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Úroveň nadpisu: 1 = úroveň 1 (největší), 2 = úroveň 2, 3 = úroveň 3; výchozí 1"
"Body paragraph text (optional; used together with elements)": "Text odstavce (volitelné; používá se spolu s elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Pole strukturovaných prvků (volitelné): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Typ prvku: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Textový obsah (používá se při type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Pole položek seznamu (používá se při type=bullet_list nebo ordered_list)"
"Table header row (required when type=table)": "Řádek záhlaví tabulky (vyžadováno při type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Řádky dat tabulky (vyžadováno při type=table); každý řádek je pole hodnot buněk, například [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Styl tabulky (volitelné při type=table): headerBgColor (pozadí záhlaví), headerFontColor (barva textu záhlaví), stripeColor (střídavé řádky)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL obrázku (vyžadováno při type=image); podporuje externí odkazy https:// nebo interní přílohy jako /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Šířka obrázku v centimetrech (type=image); výchozí 14 cm"
"Image height in centimeters (type=image); default 10cm": "Výška obrázku v centimetrech (type=image); výchozí 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Zda je text tučný (volitelné při type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Zda je text kurzívou (volitelné při type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Zda je text podtržený (volitelné při type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Velikost písma v bodech, například 12 (volitelné při type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Barva textu (hexadecimální RGB, například 2563EB; volitelné při type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Zarovnání textu: left/center/right/justify (volitelné při type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Barva pozadí odstavce (hexadecimální RGB, například EFF6FF; volitelné při type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Varianta zvýrazněného rámečku (type=callout): info (modrá) / success (zelená) / warning (žlutá) / danger (červená); výchozí info"
"KPI value (required when type=kpi), e.g. 17.68M": "Hodnota KPI (vyžadováno při type=kpi), například 17,68 mil."
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Popisek KPI (volitelné při type=kpi), například růst proti předchozímu měsíci"
"KPI trend (optional when type=kpi): up / down / flat": "Trend KPI (volitelné při type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Zdroj citace (volitelné při type=quote), například Výroční zpráva 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Jazyk kódu (volitelné při type=code), například sql/python/javascript; volí barvy zvýraznění syntaxe"
"Worksheet name, e.g. Q2 Data": "Název listu, například Data Q2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Pole záhlaví sloupců, například [\"Datum\",\"Výnosy\",\"Změna\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Řádky dat (dvourozměrné pole); každý řádek je pole hodnot buněk, například [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Styl záhlaví (volitelné): headerBgColor (pozadí záhlaví), headerFontColor (barva textu záhlaví), stripeColor (střídavé řádky)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Pole šířek sloupců (volitelné), například [12, 20, 15]; hodnoty jsou přibližné šířky ve znacích"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Číselný formát (volitelné), například \"#,##0.00\" nebo \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Pole podmíněného formátování (volitelné). Pole každé položky: range (například \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan atd.), color (hlavní barva), value (prahová hodnota)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Pole definic grafů (volitelné): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Počet ukotvených horních řádků (0 = žádné, 1 = ukotvit první řádek; výchozí 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Rozsah automatického filtru (například \"A1:E1\"); prázdné jej vypne"
"Dropdown validation array (optional)": "Pole ověřování rozevíracího seznamu (volitelné)"
"Applied range (e.g. \"C2:C10\")": "Použitý rozsah (například \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Typ podmínky: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Barva (hexadecimální RGB, například 2563EB) použitá pro datové pruhy, barevné škály nebo zvýraznění"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Prahová hodnota nebo vzorec (například 1000 nebo =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Typ grafu: bar / line / pie"
"Chart title (optional)": "Název grafu (volitelné)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Pole popisků osy kategorií, například [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Pole datových řad; každá položka má name a data"
"Applied range (e.g. \"A2:A100\")": "Použitý rozsah (například \"A2:A100\")"
"Dropdown option array": "Pole možností rozevíracího seznamu"
"Title of this slide": "Název tohoto snímku"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Rozvržení snímku: title_only (pouze název, pro titulní snímky) / title_content (název + text, výchozí) / two_column (dva sloupce) / chart_only (graf na plnou šířku) / blank (prázdné plátno)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Barva pozadí snímku, hexadecimální RGB jako \"1F497D\"; pokud chybí, použije se pozadí tématu"
"Slide element list; each element describes a text block, table, chart, or image": "Seznam prvků snímku; každý prvek popisuje textový blok, tabulku, graf nebo obrázek"
"Footer text displayed at the bottom of the slide; null hides it": "Text zápatí zobrazený ve spodní části snímku; null jej skryje"
"Whether to show the slide number in the bottom-right corner; default false": "Zda zobrazit číslo snímku v pravém dolním rohu; výchozí false"
"Speaker notes used as a reminder while presenting": "Poznámky přednášejícího sloužící jako připomínka během prezentace"
"Transition animation: fade / push / wipe / zoom / split / cut": "Přechodová animace: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Typ prvku: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Sémantická role (pouze prvky text): title / subtitle / body / caption / kpi. Rozvrhovací engine ji používá k automatickému umístění, souřadnice nejsou potřeba"
"Text content (required when type=text)": "Textový obsah (vyžadováno při type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Velikost písma v bodech (volitelné); pokud chybí, rozvrhovací engine zvolí velikost podle role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Zda je text tučný; výchozí false"
"Whether the text is italic (optional for type=text); default false": "Zda je text kurzívou (volitelné při type=text); výchozí false"
"Whether the text is underlined (optional for type=text); default false": "Zda je text podtržený (volitelné při type=text); výchozí false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Barva textu, hexadecimální RGB jako \"FFFFFF\"; pokud chybí, dědí se barva textu tématu"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Pole záhlaví tabulky (vyžadováno při type=table), například [\"Metrika\",\"Q1\",\"Q2\",\"Změna\"]"
"Chart type (required when type=chart): bar / line / pie": "Typ grafu (vyžadováno při type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Popisky kategorií grafu (vyžadováno při type=chart), například [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Datové řady (vyžadováno při type=chart); každá položka má name (název řady) a data (pole čísel)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Zarovnání textu (prvky text): l (vlevo) / ctr (na střed) / r (vpravo)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Barva pozadí textového pole (prvky text), hexadecimální RGB jako \"EFF6FF\"; prázdné znamená průhledné"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Fragmenty formátovaného textu (prvky text); pokud jsou zadány, Content/FontSize/Bold/Color se ignorují"
"Shape configuration (required when type=shape)": "Konfigurace tvaru (vyžadováno při type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Styl tabulky (volitelné při type=table): headerBgColor (pozadí záhlaví), headerFontColor (barva textu záhlaví), stripeColor (střídavé řádky)"
"Text content": "Textový obsah"
"Font size in points; 0 inherits the text box default": "Velikost písma v bodech; 0 dědí výchozí hodnotu textového pole"
"Whether the text is bold": "Zda je text tučný"
"Whether the text is italic": "Zda je text kurzívou"
"Whether the text is underlined": "Zda je text podtržený"
"Text color, hex RGB such as \"FF6B6B\"": "Barva textu, hexadecimální RGB jako \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL hypertextového odkazu; pokud je nastaven, fragment je klikatelný"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Typ tvaru: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Barva výplně (hexadecimální RGB, například 2563EB); null znamená bez výplně"
"Border color (hex RGB); null means no border": "Barva ohraničení (hexadecimální RGB); null znamená bez ohraničení"
"Text displayed inside the shape (optional)": "Text zobrazený uvnitř tvaru (volitelné)"
"Text color inside the shape (hex RGB)": "Barva textu uvnitř tvaru (hexadecimální RGB)"
"Font size of the text inside the shape (points); 0 means default": "Velikost písma textu uvnitř tvaru (body); 0 znamená výchozí"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Barva pozadí řádku záhlaví (hexadecimální RGB, například 2563EB); pokud chybí, nepoužije se zvláštní styl"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "Barva textu řádku záhlaví (hexadecimální RGB, například FFFFFF); pokud chybí, dědí se výchozí hodnota"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "Barva střídavých řádků (pozadí sudých datových řádků, například EFF6FF světle modrá); pokud chybí, pruhy se nekreslí"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "Jedinečné ID sloupce (vyžadováno), například \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "Název sloupce (vyžadováno, maximálně 20 znaků)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "Barva názvu sloupce (volitelné), hexadecimální, například \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "Limit WIP (volitelné); při překročení název sloupce zčervená"
"Card array (required)": "Pole karet (vyžadováno)"
"Unique card ID (required)": "Jedinečné ID karty (vyžadováno)"
"Card title (required, up to 40 characters)": "Název karty (vyžadováno, maximálně 40 znaků)"
