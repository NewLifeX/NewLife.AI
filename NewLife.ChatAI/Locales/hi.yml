"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Word दस्तावेज़ (.docx) बनाता है और डाउनलोड लिंक लौटाता है। शीर्षक, अनुच्छेद, सूचियाँ, तालिकाएँ, छवियाँ, पृष्ठ विराम, विभाजक, हाइलाइट बॉक्स, KPI कार्ड, उद्धरण और कोड ब्लॉक समर्थित हैं। JSON sections सरणी प्रत्येक अनुभाग को heading, content और elements से वर्णित करती है"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "दस्तावेज़ शीर्षक (अधिकतम 30 अक्षर), जैसे Q2 रिपोर्ट"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "अनुभागों की सरणी (JSON)। प्रत्येक अनुभाग के फ़ील्ड: heading (अनुभाग शीर्षक), headingLevel (1-3, डिफ़ॉल्ट 1), content (पाठ अनुच्छेद, वैकल्पिक), elements (तत्वों की सरणी, वैकल्पिक)। तत्व प्रकार: paragraph ({type,text,वैकल्पिक bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,वैकल्पिक tableStyle}; rows द्वि-आयामी सरणी है, प्रत्येक पंक्ति सेल मानों की सरणी है, जैसे [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "थीम (वैकल्पिक): कार्ड शैली कुंजी (जैसे enterprise-blue) या अंतर्निहित नाम (blue/dark/corporate/warm/green/minimal); छोड़ने पर वार्तालाप शैली या ब्रांड डिफ़ॉल्ट उपयोग होता है"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Excel कार्यपुस्तिका (.xlsx) बनाता है और डाउनलोड लिंक लौटाता है। कई शीट, शीर्षलेख शैलियाँ, स्तंभ चौड़ाई, संख्या प्रारूप, सशर्त स्वरूपण, फलक स्थिरीकरण, स्वतः फ़िल्टर और ड्रॉपडाउन सूची सत्यापन समर्थित हैं। theme पैरामीटर कार्ड शैली कुंजी या अंतर्निहित नाम (blue/dark/corporate/warm/green/minimal) स्वीकार करता है"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "कार्यपुस्तिका शीर्षक (अधिकतम 30 अक्षर), जैसे Q2 राजस्व रिपोर्ट"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "शीटों की सरणी (JSON)। प्रत्येक शीट के फ़ील्ड: name, headers (शीर्षलेखों की सरणी), rows (द्वि-आयामी सरणी; प्रत्येक पंक्ति सेल मानों की सरणी है, जैसे [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (जैसे [12,20,15]), numberFormat (जैसे \"#,##0.00\" या \"yyyy-MM-dd\"), conditionalFormats ({range,type,color,value?} की सरणी; type में dataBar/colorScale/greaterThan आदि समर्थित हैं), charts (चार्ट की सरणी), freezeRows (स्थिर पंक्तियों की संख्या), autoFilter (फ़िल्टर सीमा) और dropdowns (ड्रॉपडाउन सूची सत्यापन)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "थीम (वैकल्पिक): कार्ड शैली कुंजी (जैसे enterprise-blue) या अंतर्निहित नाम (blue/dark/corporate/warm/green/minimal) जो शीर्षलेख और समग्र रंग नियंत्रित करता है; छोड़ने पर वार्तालाप शैली या ब्रांड डिफ़ॉल्ट उपयोग होता है"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "PowerPoint प्रस्तुति (.pptx) बनाता है और डाउनलोड लिंक लौटाता है। दो परस्पर अपवर्जी इनपुट मोड: (1) slides मोड जिसमें AI संरचित सामग्री वर्णित करता है और लेआउट स्वतः बनता है; (2) widgetSrc मोड जो पहले बनाए गए show_widget कार्ड को स्लाइड छवियों के रूप में एम्बेड करता है। theme पैरामीटर कार्ड शैली कुंजी (जैसे enterprise-blue/raycast-dark/ppt-executive) या अंतर्निहित नाम (blue/dark/green/warm/corporate/minimal) स्वीकार करता है।"
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "प्रस्तुति शीर्षक (अधिकतम 30 अक्षर), जैसे Q2 समीक्षा"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "स्लाइडों की सरणी (JSON)। एक तत्व = एक स्लाइड, कई तत्व = पूर्ण प्रस्तुति। widgetSrc के साथ परस्पर अपवर्जी। प्रत्येक स्लाइड के फ़ील्ड: title, layout (title_only/title_content/two_column/chart_only/blank), background (हेक्स रंग), footer, showPageNumber (true/false), elements (तत्वों की सूची), notes और transition। elements ये समर्थित करता है: text (role=title/subtitle/body/kpi/caption; वैकल्पिक bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows द्वि-आयामी सरणी, प्रत्येक पंक्ति सेल मानों की सरणी, जैसे [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; वैकल्पिक tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor})। उदाहरण: [{\"title\":\"आवरण\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 समीक्षा\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife टीम\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "show_widget कार्ड ID की अल्पविराम-पृथक सूची, जैसे 'call_abc123,call_def456'। slides के साथ परस्पर अपवर्जी। बनाए गए कार्ड को स्लाइड छवि में बदलता है"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "थीम (वैकल्पिक): कार्ड शैली कुंजी (जैसे enterprise-blue/ppt-executive) या अंतर्निहित नाम (blue/dark/corporate/warm/green/minimal आदि); छोड़ने पर वार्तालाप शैली या ब्रांड डिफ़ॉल्ट उपयोग होता है"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "डेटा को इंटरैक्टिव चार्ट के रूप में दिखाता है (ज़ूम, होवर, छवि के रूप में निर्यात)। show_widget से लगभग 20 गुना तेज़: JSON विनिर्देश (लगभग 200 टोकन) पर्याप्त है और फ़्रंटएंड ECharts से तुरंत बना देता है। समर्थित: bar, line (रेखा/क्षेत्र), pie (पाई/डोनट), scatter, radar, map_china (चीन के प्रांतों का ताप मानचित्र), heatmap (मैट्रिक्स ताप मानचित्र), gauge, funnel, treemap. संख्यात्मक तुलना, समय श्रेणी (रेखा), हिस्सेदारी विश्लेषण और भौगोलिक वितरण के लिए उपयुक्त। ध्यान दें: मार्ग, ऐतिहासिक घटनाएँ, मील के पत्थर और समयरेखा के लिए show_timeline उपयोग करें; यह टूल timeline प्रकार समर्थित नहीं करता। दृश्य शैली: ECharts के डिफ़ॉल्ट पर निर्भर रहने के बजाय data.colors से रंग पैलेट दें। सुझाव: एक श्रेणी के लिए ब्रांड रंग, कई श्रेणियों के लिए समान अंतराल के शेड (10-12 रंग), तुलना के लिए पूरक रंग, प्रवृत्तियों के लिए एकल-रंग ग्रेडिएंट। वित्त के लिए नीला और सुनहरा, स्वास्थ्य के लिए नीला/हरा/सफ़ेद, तकनीक और AI के लिए बैंगनी/नीला/सियान। बड़े डेटा सेट के लिए रेंडर लागत घटाने हेतु data.animation=false सेट करें।"
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "चार्ट प्रकार: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "चार्ट शीर्षक (अधिकतम 30 अक्षर), जैसे 2024 में प्रांतवार सकल घरेलू उत्पाद"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON ऑब्जेक्ट; संरचना टूल के विवरण में बताई गई है। bar उदाहरण: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"राजस्व\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; बहु-श्रेणी radar उदाहरण: {\"indicators\":[{\"name\":\"गति\",\"max\":100},{\"name\":\"शक्ति\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar शर्त: indicators की संख्या प्रत्येक series[i].data की लंबाई के बराबर होनी चाहिए, और data में केवल संख्याएँ होनी चाहिए"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "लॉग-इन उपयोगकर्ता का विवरण लौटाता है, जिसमें उपयोगकर्ता नाम, प्रदर्शित नाम, ईमेल, मोबाइल, कोड, भूमिकाएँ, विभाग, लिंग, आयु, जन्म तिथि और टिप्पणियाँ, तथा आगंतुक का IP पता, शहर और विस्तृत भौगोलिक स्थान शामिल हैं"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "कीवर्ड से डेटाबेस तालिका स्कीमा खोजता है। परिणाम के दो भाग हैं: (1) तालिका-कनेक्शन मानचित्र (Markdown तालिका जो दिखाती है कि कौन-सी तालिका किस कनेक्शन की है; भिन्न कनेक्शनों में समान नाम की तालिकाएँ अलग सूचीबद्ध होती हैं); (2) प्रत्येक कनेक्शन के लिए तालिकाओं का XML स्कीमा। बाद के run_sql कॉल में मानचित्र तालिका का कनेक्शन नाम उपयोग करना चाहिए"
"Search keywords, separated by commas or spaces": "अल्पविराम या स्थान से पृथक खोज कीवर्ड"
"Restrict to a connection name; empty searches all connections": "कनेक्शन नाम तक सीमित; खाली होने पर सभी कनेक्शनों में खोज"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "निर्दिष्ट डेटाबेस कनेक्शन पर SQL कथन चलाता है। SELECT/WITH क्वेरी पंक्तियाँ लौटाती हैं; INSERT/UPDATE/DELETE जैसे गैर-क्वेरी कथन प्रभावित पंक्तियों की संख्या लौटाते हैं। connName को search_table द्वारा लौटाए गए कनेक्शन स्तंभ से मेल खाना चाहिए"
"Database connection name (from the connection column of search_table)": "डेटाबेस कनेक्शन नाम (search_table के कनेक्शन स्तंभ से)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL कथन। SELECT/WITH परिणाम सेट लौटाता है; गैर-क्वेरी कथन प्रभावित पंक्तियों की संख्या लौटाते हैं"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "किसी विशेष तिथि के लिए चंद्र कैलेंडर तिथि, सौर अवधि और कार्यदिवस स्थिति (कार्यदिवस/अवकाश/प्रतिपूरक दिवस) खोजता है"
"Date to query in yyyy-MM-dd format. Defaults to today": "माँगी गई तिथि yyyy-MM-dd प्रारूप में। डिफ़ॉल्ट आज"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "कार्यों को बहु-स्तंभ Kanban बोर्ड के रूप में दिखाता है (जैसे करना है -> हो रहा है -> हो गया)। प्रोजेक्ट चरण विभाजन, Sprint योजना, कार्यप्रवाह प्रदर्शन और कार्य स्थिति वर्गीकरण के लिए उपयुक्त। प्रत्येक स्तंभ में रंग लेबल और WIP सीमा हो सकती है; प्रत्येक कार्ड में शीर्षक, विवरण, प्राथमिकता, टैग, नियत तिथि, ज़िम्मेदार व्यक्ति, उपकार्य सूची, प्रगति और लिंक हो सकते हैं। दो लेआउट: board (डिफ़ॉल्ट बहु-स्तंभ बोर्ड) और swimlane (स्तंभ टीम या इकाई के अनुसार समूहित)।"
"Board title (up to 30 characters), e.g. Sprint 1 Board": "बोर्ड शीर्षक (अधिकतम 30 अक्षर), जैसे Sprint 1 बोर्ड"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "स्तंभ परिभाषाओं की JSON सरणी। उदाहरण: [{\"id\":\"todo\",\"title\":\"करना है\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"आवश्यकता विश्लेषण\",\"description\":\"उपयोगकर्ता आवश्यकताएँ एकत्र करें\",\"priority\":\"high\",\"tags\":[\"डिज़ाइन\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"उपयोगकर्ता साक्षात्कार\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]। id और title के अतिरिक्त सभी फ़ील्ड वैकल्पिक हैं"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "लेआउट मोड: board (डिफ़ॉल्ट बहु-स्तंभ बोर्ड) या swimlane (स्तंभ टीम या इकाई के अनुसार समूहित; swimlanes पैरामीटर आवश्यक)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "स्विमलेन परिभाषाओं की JSON सरणी (जब layout=swimlane हो तब उपयोग)। उदाहरण: [{\"id\":\"sl1\",\"title\":\"फ़्रंटएंड टीम\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"बैकएंड टीम\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "चीन के नक्शे पर निर्देशांक बिंदु (शहर या POI) चिह्नित करता है या प्रांतों को उजागर करता है, टिप्पणी-सहित SVG नक्शा बनाता है और उसे चैट बुलबुले में दिखाता है। समर्थित: (1) प्रांतों को कस्टम रंगों से भरना; (2) अक्षांश, देशांतर और लेबल टेक्स्ट के साथ WGS84 मार्कर; (3) निचले-दाएँ कोने में स्वतः लेजेंड। सामान्य उपयोग: प्रांतवार डेटा वितरण, शहर स्थान, क्षेत्रीय बिक्री ताप मानचित्र।"
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "नक्शा शीर्षक (अधिकतम 30 अक्षर), जैसे 2024 में प्रांतवार सकल घरेलू उत्पाद"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "मार्कर की JSON सरणी (रिक्त सरणी [] भी हो सकती है)। प्रारूप: [{\"name\":\"बीजिंग\",\"lat\":39.9,\"lng\":116.4,\"label\":\"बीजिंग\\n4376 अरब\",\"color\":\"#E74C3C\",\"size\":8}]। lat/lng दशमलव डिग्री WGS84 में; color/size वैकल्पिक"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "प्रांत उजागर की JSON सरणी (रिक्त सरणी [] भी हो सकती है)। प्रारूप: [{\"name\":\"ग्वांगडोंग\",\"color\":\"#FFB347\",\"label\":\"GDP में प्रथम\"}]। name प्रांत का चीनी नाम (पूर्ण या संक्षिप्त) स्वीकार करता है; label वैकल्पिक"
"Legend title (optional), e.g. GDP scale": "लेजेंड शीर्षक (वैकल्पिक), जैसे GDP पैमाना"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "रंग योजना (वैकल्पिक): blue/orange/green/purple/red; डिफ़ॉल्ट blue"
"Marker style (optional): circle/pin/square; defaults to circle": "मार्कर आकार (वैकल्पिक): circle/pin/square; डिफ़ॉल्ट circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "ज्ञान पदानुक्रम या अवधारणाओं के बीच संबंध को संक्षिप्त करने योग्य इंटरैक्टिव माइंड मैप के रूप में दिखाता है। इनपुट Markdown रूपरेखा (# / ## / ###) है जिसे फ़्रंटएंड दृश्य वृक्ष में बदलता है। ज्ञान व्यवस्थित करने, अवधारणाएँ विघटित करने, तकनीक तुलना करने, विकल्प आँकने और सामग्री सारांश के लिए उपयुक्त। दृश्य शैली: विषय के अनुसार branchColors (3-8 सामंजस्यपूर्ण रंग), maxDepth (जटिलता) और collapsed (फ़ोकस हेतु प्रारंभिक संक्षिप्ति) चुनें। तकनीक और डेटा के लिए ठंडे रंग (नीला/बैंगनी/सियान), व्यवसाय और विपणन के लिए गर्म रंग (नारंगी/सुनहरा/लाल), प्रकृति और स्वास्थ्य के लिए हरा उपयोग करें। घने नोड्स के लिए पठनीयता बनाए रखने हेतु maxDepth=2 सेट करें। 6 लेआउट: tree (डिफ़ॉल्ट, दाँतेदार वृक्ष, सामान्य) / radial (बाएँ-दाएँ त्रिज्यीय, ज्ञान मानचित्र के लिए सर्वोत्तम) / lr (केंद्र से दाएँ, प्रवाह चार्ट/निर्णय वृक्ष) / rl (केंद्र से बाएँ, विपरीत अनुरेखण) / tb (केंद्र से नीचे, संगठन चार्ट) / bt (केंद्र से ऊपर, नीचे से ऊपर पदानुक्रम)।"
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "माइंड मैप शीर्षक (अधिकतम 30 अक्षर), जैसे AI तकनीकी स्टैक"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "स्तर 1-3 के लिए # / ## / ### के साथ Markdown रूपरेखा। उदाहरण:\n# कृत्रिम बुद्धिमत्ता\n## मशीन लर्निंग\n### पर्यवेक्षित लर्निंग\n### अपर्यवेक्षित लर्निंग\n## गहन लर्निंग\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "लेआउट मोड: tree (डिफ़ॉल्ट, दाँतेदार वृक्ष, सामान्य) / radial (बाएँ-दाएँ त्रिज्यीय, ज्ञान मानचित्र के लिए सर्वोत्तम) / lr (केंद्र से दाएँ, प्रवाह चार्ट/निर्णय वृक्ष) / rl (केंद्र से बाएँ, विपरीत अनुरेखण) / tb (केंद्र से नीचे, संगठन चार्ट) / bt (केंद्र से ऊपर, नीचे से ऊपर पदानुक्रम)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "शाखा रंगों की JSON सरणी, जैसे [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]। प्रथम-स्तरीय शाखाओं को क्रम से 3-8 हेक्स रंग देता है। छोड़ने पर डिफ़ॉल्ट पैलेट नीला/बैंगनी, हरा, पीला, लाल, सियान, गहरा हरा, नारंगी और बैंगनी उपयोग होता है"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "प्रारंभ में संक्षिप्त नोड आईडी की JSON सरणी, जैसे [\"n2\",\"n5\"]। रिक्त का अर्थ सब कुछ विस्तारित। महत्वपूर्ण शाखाओं पर ध्यान केंद्रित करने के लिए उपयोग"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "अधिकतम दृश्य गहराई: 1 = केवल प्रथम-स्तरीय शाखाएँ, 2 = दो स्तर, डिफ़ॉल्ट रूप से असीमित। घने नोड्स के लिए पठनीयता बनाए रखने हेतु 2 सेट करें"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "समय-श्रेणी डेटा को सुरुचिपूर्ण टाइमलाइन कार्ड के रूप में दिखाता है। JSON (लगभग 100 टोकन) पर्याप्त है और फ़्रंटएंड तुरंत दिखा देता है। प्रोजेक्ट मील के पत्थर, ऐतिहासिक घटनाएँ, रिलीज़ योजनाएँ और विकास इतिहास के लिए उपयुक्त। प्रत्येक घटना में तिथि, शीर्षक, विवरण, रंग और श्रेणी हो सकते हैं। दृश्य शैली: टाइमलाइन को एकरूप रखने के लिए palette पैरामीटर (जैसे नीला-बैंगनी ग्रेडिएंट, गर्म कांस्य, ब्रांड रंग) से समग्र पैलेट सेट करें; item.color व्यक्तिगत आइटम बदलता है। पाँच या कम चुनी हुई घटनाओं के लिए density=relaxed और दस या अधिक के लिए density=compact उपयोग करें। 8 लेआउट: vertical (5-20 आइटम) / alternating-top (ऊपर एकांतर, उल्टा कालक्रम) / alternating-bottom (नीचे एकांतर, कालक्रम) / horizontal-left (क्षैतिज बाएँ, उल्टा) / horizontal-right (क्षैतिज दाएँ, कालक्रम) / s-curve (S वक्र, 8 आइटम या कम) / fishbone-left (मछली काँटा बाएँ, उल्टा) / fishbone-right (मछली काँटा दाएँ, कालक्रम)।"
"Timeline title (up to 30 characters), e.g. Product Milestones": "टाइमलाइन शीर्षक (अधिकतम 30 अक्षर), जैसे उत्पाद मील के पत्थर"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "टाइमलाइन घटनाओं की JSON सरणी। उदाहरण: [{\"date\":\"2024-01\",\"title\":\"v1.0 रिलीज़\",\"description\":\"मुख्य सुविधाओं का शुभारंभ\",\"color\":\"#5470c6\",\"category\":\"मील का पत्थर\"}]। description/color/category वैकल्पिक हैं"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "लेआउट मोड: vertical / alternating-top (ऊपर एकांतर, उल्टा) / alternating-bottom (नीचे एकांतर, कालक्रम) / horizontal-left (क्षैतिज, उल्टा) / horizontal-right (क्षैतिज, कालक्रम) / s-curve / fishbone-left (मछली काँटा, उल्टा) / fishbone-right (मछली काँटा, कालक्रम)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "समग्र पैलेट की JSON सरणी, जैसे [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]। डिफ़ॉल्ट आठ-रंग चक्र को बदलता है। item.color को प्राथमिकता है"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "आइटम अंतराल: compact (12px) / normal (20px, डिफ़ॉल्ट) / relaxed (32px)। relaxed पाँच या कम चुनी हुई घटनाओं के लिए उपयुक्त; compact दस या अधिक के लिए"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "चैट बुलबुले के भीतर SVG या HTML अंश दिखाता है। टाइमलाइन और संबंध चार्ट (SVG), फ़ॉर्म पूर्वावलोकन और डेटा कार्ड (HTML), सांख्यिकीय ग्राफ़िक्स (SVG) के लिए उपयोग करें। Mermaid चार्ट के लिए उपयोग न करें; Mermaid को उत्तर में ```mermaid कोड ब्लॉक के रूप में दें। सीमाएँ: अधिकतम 200 KB; <script src=...> केवल विश्वसनीय CDN से। दृश्य शैली: विषय के अनुसार सूचना वास्तुकला (Bento/कार्ड प्रवाह/Grid), टाइपोग्राफ़िक पदानुक्रम और रंग प्रणाली चुनें। तकनीकी चर्चाओं के लिए कोने-रहित ठंडे टोन, व्यावसायिक रिपोर्ट के लिए प्रमुख संख्याओं वाले तटस्थ रंग, रचनात्मक कार्यों के लिए ग्रेडिएंट/काँच प्रभाव/सूक्ष्म एनिमेशन। font-family और color सदैव स्पष्ट रूप से निर्दिष्ट करें; ब्राउज़र की डिफ़ॉल्ट शैलियों पर निर्भर न रहें।"
"Widget title (up to 30 characters), e.g. Order Status Flow": "विजेट शीर्षक (अधिकतम 30 अक्षर), जैसे ऑर्डर स्थिति प्रवाह"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG को <svg से शुरू होना चाहिए; HTML अंश मूल तत्व से शुरू होने चाहिए और उनमें <html><body> नहीं होना चाहिए। अधिकतम 200 KB; <script src=...> केवल विश्वसनीय CDN से। Mermaid सिंटैक्स (flowchart/graph/sequenceDiagram आदि) न भेजें; Mermaid को उत्तर में ```mermaid कोड ब्लॉक के रूप में दें"
"Placeholder text shown while loading (optional)": "लोड होते समय दिखाया जाने वाला प्लेसहोल्डर टेक्स्ट (वैकल्पिक)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "थीम संकेत: light / dark / auto (सिस्टम के अनुसार)। उत्पन्न HTML को तदनुसार पृष्ठभूमि और टेक्स्ट रंग चुनने चाहिए; यह फ़्रंटएंड व्यूअर को पास नहीं होता"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "विजेट की प्रारंभिक ऊँचाई पिक्सेल में (80-1200)। डिफ़ॉल्ट 480। संक्षिप्त कार्ड के लिए 300-400 और बड़े चार्ट के लिए 600-800 उपयोग करें"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "पृष्ठभूमि मोड: solid (डिफ़ॉल्ट) / transparent (स्क्रीनशॉट को PPT टेम्पलेट पर चिपकाने के लिए)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT स्लाइड मोड। true होने पर कार्ड 16:9 अनुपात में प्रस्तुति में चिपकाने के लिए तैयार दिखता है। डिफ़ॉल्ट false जो सामग्री के अनुसार दिखाता है"
"Section heading text, e.g. Completed this week": "अनुभाग शीर्षक टेक्स्ट, जैसे इस सप्ताह पूरा हुआ"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "शीर्षक स्तर: 1 = प्रथम स्तर (सबसे बड़ा), 2 = द्वितीय स्तर, 3 = तृतीय स्तर; डिफ़ॉल्ट 1"
"Body paragraph text (optional; used together with elements)": "पाठ अनुच्छेद (वैकल्पिक; elements के साथ उपयोग)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "संरचित तत्वों की सरणी (वैकल्पिक): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "तत्व प्रकार: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "टेक्स्ट सामग्री (जब type=paragraph/callout/quote/code हो तब उपयोग)"
"List item array (used when type=bullet_list or ordered_list)": "सूची आइटम की सरणी (जब type=bullet_list या ordered_list हो तब उपयोग)"
"Table header row (required when type=table)": "तालिका शीर्षलेख पंक्ति (जब type=table हो तब आवश्यक)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "तालिका डेटा पंक्तियाँ (जब type=table हो तब आवश्यक); प्रत्येक पंक्ति सेल मानों की सरणी है, जैसे [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "तालिका शैली (जब type=table हो तब वैकल्पिक): headerBgColor (शीर्षलेख पृष्ठभूमि), headerFontColor (शीर्षलेख टेक्स्ट रंग), stripeColor (एकांतर पंक्तियाँ)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "छवि URL (जब type=image हो तब आवश्यक); बाहरी https:// लिंक या आंतरिक अनुलग्नक जैसे /cube/image?id=xxx समर्थित"
"Image width in centimeters (type=image); default 14cm": "छवि चौड़ाई सेंटीमीटर में (type=image); डिफ़ॉल्ट 14 सेमी"
"Image height in centimeters (type=image); default 10cm": "छवि ऊँचाई सेंटीमीटर में (type=image); डिफ़ॉल्ट 10 सेमी"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "क्या टेक्स्ट बोल्ड है (जब type=paragraph/callout/quote हो तब वैकल्पिक)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "क्या टेक्स्ट इटैलिक है (जब type=paragraph/callout/quote हो तब वैकल्पिक)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "क्या टेक्स्ट रेखांकित है (जब type=paragraph/callout/quote हो तब वैकल्पिक)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "फ़ॉन्ट आकार पॉइंट में, जैसे 12 (जब type=paragraph/callout हो तब वैकल्पिक)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "टेक्स्ट रंग (हेक्स RGB, जैसे 2563EB; जब type=paragraph/callout/quote हो तब वैकल्पिक)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "टेक्स्ट संरेखण: left/center/right/justify (जब type=paragraph हो तब वैकल्पिक)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "अनुच्छेद पृष्ठभूमि रंग (हेक्स RGB, जैसे EFF6FF; जब type=paragraph हो तब वैकल्पिक)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "हाइलाइट बॉक्स शैली (type=callout): info (नीला) / success (हरा) / warning (पीला) / danger (लाल); डिफ़ॉल्ट info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI मान (जब type=kpi हो तब आवश्यक), जैसे 1.768 करोड़"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI लेबल (जब type=kpi हो तब वैकल्पिक), जैसे पिछले माह की तुलना में वृद्धि"
"KPI trend (optional when type=kpi): up / down / flat": "KPI प्रवृत्ति (जब type=kpi हो तब वैकल्पिक): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "उद्धरण स्रोत (जब type=quote हो तब वैकल्पिक), जैसे 2026 वार्षिक रिपोर्ट"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "कोड भाषा (जब type=code हो तब वैकल्पिक), जैसे sql/python/javascript; सिंटैक्स हाइलाइटिंग निर्धारित करती है"
"Worksheet name, e.g. Q2 Data": "वर्कशीट नाम, जैसे Q2 डेटा"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "स्तंभ शीर्षलेखों की सरणी, जैसे [\"तिथि\",\"राजस्व\",\"परिवर्तन\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "डेटा पंक्तियाँ (द्वि-आयामी सरणी); प्रत्येक पंक्ति सेल मानों की सरणी है, जैसे [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "शीर्षलेख शैली (वैकल्पिक): headerBgColor (शीर्षलेख पृष्ठभूमि), headerFontColor (शीर्षलेख टेक्स्ट रंग), stripeColor (एकांतर पंक्तियाँ)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "स्तंभ चौड़ाइयों की सरणी (वैकल्पिक), जैसे [12, 20, 15]; मान अनुमानित अक्षर चौड़ाई हैं"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "संख्या प्रारूप (वैकल्पिक), जैसे \"#,##0.00\" या \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "सशर्त स्वरूपण की सरणी (वैकल्पिक)। प्रत्येक आइटम के फ़ील्ड: range (जैसे \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan आदि), color (मुख्य रंग), value (सीमा)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "चार्ट परिभाषाओं की सरणी (वैकल्पिक): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "स्थिर की जाने वाली शीर्ष पंक्तियों की संख्या (0 = कोई नहीं, 1 = पहली पंक्ति स्थिर करें; डिफ़ॉल्ट 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "स्वतः फ़िल्टर सीमा (जैसे \"A1:E1\"); खाली होने पर अक्षम"
"Dropdown validation array (optional)": "ड्रॉपडाउन सूची सत्यापन संचालनों की सरणी (वैकल्पिक)"
"Applied range (e.g. \"C2:C10\")": "लागू सीमा (जैसे \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "शर्त प्रकार: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "डेटा बार, रंग पैमानों या हाइलाइटिंग के लिए उपयोग होने वाला रंग (हेक्स RGB, जैसे 2563EB)"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "सीमा या सूत्र (जैसे 1000 या =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "चार्ट प्रकार: bar / line / pie"
"Chart title (optional)": "चार्ट शीर्षक (वैकल्पिक)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "श्रेणी अक्ष लेबलों की सरणी, जैसे [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "डेटा श्रेणियों की सरणी; प्रत्येक आइटम में name और data है"
"Applied range (e.g. \"A2:A100\")": "लागू सीमा (जैसे \"A2:A100\")"
"Dropdown option array": "ड्रॉपडाउन सूची विकल्पों की सरणी"
"Title of this slide": "इस स्लाइड का शीर्षक"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "स्लाइड लेआउट: title_only (केवल शीर्षक, आवरण के लिए) / title_content (शीर्षक + टेक्स्ट, डिफ़ॉल्ट) / two_column (दो स्तंभ) / chart_only (पूर्ण-चौड़ाई चार्ट) / blank (खाली स्थान)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "स्लाइड पृष्ठभूमि रंग, हेक्स RGB जैसे \"1F497D\"; छोड़ने पर थीम पृष्ठभूमि उपयोग होती है"
"Slide element list; each element describes a text block, table, chart, or image": "स्लाइड तत्वों की सूची; प्रत्येक तत्व एक टेक्स्ट ब्लॉक, तालिका, चार्ट या छवि वर्णित करता है"
"Footer text displayed at the bottom of the slide; null hides it": "स्लाइड के नीचे दिखाया जाने वाला फ़ुटर टेक्स्ट; null इसे छिपा देता है"
"Whether to show the slide number in the bottom-right corner; default false": "क्या निचले-दाएँ कोने में स्लाइड संख्या दिखाई जाए; डिफ़ॉल्ट false"
"Speaker notes used as a reminder while presenting": "प्रस्तुति के दौरान अनुस्मारक के रूप में उपयोग होने वाले वक्ता नोट्स"
"Transition animation: fade / push / wipe / zoom / split / cut": "संक्रमण प्रभाव: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "तत्व प्रकार: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "अर्थपूर्ण भूमिका (केवल text तत्व): title / subtitle / body / caption / kpi। लेआउट इंजन इसे बिना निर्देशांक के तत्व को स्वतः स्थापित करने के लिए उपयोग करता है"
"Text content (required when type=text)": "टेक्स्ट सामग्री (जब type=text हो तब आवश्यक)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "फ़ॉन्ट आकार पॉइंट में (वैकल्पिक); छोड़ने पर लेआउट इंजन role के अनुसार चुनता है (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "क्या टेक्स्ट बोल्ड है; डिफ़ॉल्ट false"
"Whether the text is italic (optional for type=text); default false": "क्या टेक्स्ट इटैलिक है (जब type=text हो तब वैकल्पिक); डिफ़ॉल्ट false"
"Whether the text is underlined (optional for type=text); default false": "क्या टेक्स्ट रेखांकित है (जब type=text हो तब वैकल्पिक); डिफ़ॉल्ट false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "टेक्स्ट रंग, हेक्स RGB जैसे \"FFFFFF\"; छोड़ने पर थीम का टेक्स्ट रंग विरासत में मिलता है"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "तालिका शीर्षलेखों की सरणी (जब type=table हो तब आवश्यक), जैसे [\"मीट्रिक\",\"Q1\",\"Q2\",\"परिवर्तन\"]"
"Chart type (required when type=chart): bar / line / pie": "चार्ट प्रकार (जब type=chart हो तब आवश्यक): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "चार्ट श्रेणी लेबल (जब type=chart हो तब आवश्यक), जैसे [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "डेटा श्रेणियाँ (जब type=chart हो तब आवश्यक); प्रत्येक आइटम में name (श्रेणी नाम) और data (संख्याओं की सरणी) है"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "टेक्स्ट संरेखण (text तत्व): l (बाएँ) / ctr (केंद्र) / r (दाएँ)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "टेक्स्ट बॉक्स पृष्ठभूमि रंग (text तत्व), हेक्स RGB जैसे \"EFF6FF\"; खाली होने पर पारदर्शी"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "स्वरूपित टेक्स्ट अंश (text तत्व); मौजूद होने पर Content/FontSize/Bold/Color अनदेखा किए जाते हैं"
"Shape configuration (required when type=shape)": "आकृति कॉन्फ़िगरेशन (जब type=shape हो तब आवश्यक)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "तालिका शैली (जब type=table हो तब वैकल्पिक): headerBgColor (शीर्षलेख पृष्ठभूमि), headerFontColor (शीर्षलेख टेक्स्ट रंग), stripeColor (एकांतर पंक्तियाँ)"
"Text content": "टेक्स्ट सामग्री"
"Font size in points; 0 inherits the text box default": "फ़ॉन्ट आकार पॉइंट में; 0 का अर्थ टेक्स्ट बॉक्स का डिफ़ॉल्ट विरासत में लेना"
"Whether the text is bold": "क्या टेक्स्ट बोल्ड है"
"Whether the text is italic": "क्या टेक्स्ट इटैलिक है"
"Whether the text is underlined": "क्या टेक्स्ट रेखांकित है"
"Text color, hex RGB such as \"FF6B6B\"": "टेक्स्ट रंग, हेक्स RGB जैसे \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "हाइपरलिंक URL; सेट होने पर अंश क्लिक करने योग्य हो जाता है"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "आकृति प्रकार: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "भरण रंग (हेक्स RGB, जैसे 2563EB); null का अर्थ भरण नहीं"
"Border color (hex RGB); null means no border": "किनारा रंग (हेक्स RGB); null का अर्थ किनारा नहीं"
"Text displayed inside the shape (optional)": "आकृति के भीतर दिखाया जाने वाला टेक्स्ट (वैकल्पिक)"
"Text color inside the shape (hex RGB)": "आकृति के भीतर टेक्स्ट रंग (हेक्स RGB)"
"Font size of the text inside the shape (points); 0 means default": "आकृति के भीतर टेक्स्ट का फ़ॉन्ट आकार (पॉइंट); 0 का अर्थ डिफ़ॉल्ट"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "शीर्षलेख पंक्ति का पृष्ठभूमि रंग (हेक्स RGB, जैसे 2563EB); छोड़ने पर विशेष शैली लागू नहीं होती"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "शीर्षलेख पंक्ति का टेक्स्ट रंग (हेक्स RGB, जैसे FFFFFF); छोड़ने पर डिफ़ॉल्ट विरासत में मिलता है"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "एकांतर पंक्तियों का रंग (सम डेटा पंक्तियों की पृष्ठभूमि, जैसे EFF6FF हल्का नीला); छोड़ने पर धारियाँ नहीं बनाई जातीं"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "अद्वितीय स्तंभ ID (आवश्यक), जैसे \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "स्तंभ शीर्षक (आवश्यक, अधिकतम 20 अक्षर)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "स्तंभ शीर्षक रंग (वैकल्पिक), हेक्स, जैसे \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "WIP सीमा (वैकल्पिक); पार होने पर स्तंभ शीर्षक लाल हो जाता है"
"Card array (required)": "कार्डों की सरणी (आवश्यक)"
"Unique card ID (required)": "अद्वितीय कार्ड ID (आवश्यक)"
"Card title (required, up to 40 characters)": "कार्ड शीर्षक (आवश्यक, अधिकतम 40 अक्षर)"
"Supplementary description (optional, up to 100 characters)": "पूरक विवरण (वैकल्पिक, अधिकतम 100 अक्षर)"
"Priority (optional): high | medium | low": "प्राथमिकता (वैकल्पिक): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "टैग की सरणी (वैकल्पिक), जैसे [\"डिज़ाइन\",\"इंटरफ़ेस\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "नियत तिथि (वैकल्पिक), ISO 8601 जैसे \"2026-07-15\""
"Assignee name (optional)": "ज़िम्मेदार व्यक्ति का नाम (वैकल्पिक)"
"Subtask checklist (optional); each item has title and done": "उपकार्य सूची (वैकल्पिक); प्रत्येक आइटम में title और done है"
"Completion progress (optional), 0-100": "पूर्णता प्रतिशत (वैकल्पिक), 0-100"
"Related link URL (optional)": "लिंक URL (वैकल्पिक)"
"Subtask title": "उपकार्य शीर्षक"
"Whether the subtask is done": "क्या उपकार्य पूरा हुआ"
"Unique swimlane ID (required)": "अद्वितीय स्विमलेन ID (आवश्यक)"
"Swimlane title (required)": "स्विमलेन शीर्षक (आवश्यक)"
"Column ID array contained in this swimlane (required)": "इस स्विमलेन में स्तंभ ID की सरणी (आवश्यक)"
"City or place name (required), e.g. Beijing": "शहर या स्थान का नाम (आवश्यक), जैसे बीजिंग"
"Latitude (required), WGS84 decimal degrees": "अक्षांश (आवश्यक), दशमलव डिग्री WGS84"
"Longitude (required), WGS84 decimal degrees": "देशांतर (आवश्यक), दशमलव डिग्री WGS84"
"Marker label text (optional); supports \\n line breaks": "मार्कर लेबल टेक्स्ट (वैकल्पिक); पंक्ति तोड़ने के लिए \\\\n समर्थित"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "मार्कर रंग (वैकल्पिक), हेक्स जैसे \"#E74C3C\"; छोड़ने पर रंग योजना के अनुसार चक्रित होते हैं"
"Marker size (optional); default 7": "मार्कर आकार (वैकल्पिक); डिफ़ॉल्ट 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "प्रांत का नाम (आवश्यक); प्रांत का चीनी नाम (पूर्ण या संक्षिप्त) स्वीकार करता है, जैसे ग्वांगडोंग"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "उजागर रंग (वैकल्पिक), हेक्स जैसे \"#FFB347\"; डिफ़ॉल्ट पैलेट रंग"
"Highlight label (optional), e.g. No.1 GDP": "उजागर लेबल (वैकल्पिक), जैसे GDP में प्रथम"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "घटना की तिथि (आवश्यक); कोई भी प्रारूप, जैसे \"2024-01\" या \"2024 Q3\" या \"चरण 1\""
"Event title (required, up to 30 characters)": "घटना शीर्षक (आवश्यक, अधिकतम 30 अक्षर)"
"Supplementary description (optional, up to 80 characters)": "पूरक विवरण (वैकल्पिक, अधिकतम 80 अक्षर)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "हेक्स रंग (वैकल्पिक), जैसे \"#5470c6\"; छोड़ने पर पैलेट स्वतः चक्रित होता है"
"Event category label (optional), e.g. Milestone, Release, Issue": "घटना श्रेणी लेबल (वैकल्पिक), जैसे मील का पत्थर, रिलीज़, घटना"
"Word Document": "Word दस्तावेज़"
"Excel Workbook": "Excel कार्यपुस्तिका"
"PowerPoint Slides": "PowerPoint स्लाइड"
"Interactive Chart": "इंटरैक्टिव चार्ट"
"Current User": "वर्तमान उपयोगकर्ता"
"Search Database Tables": "डेटाबेस तालिकाएँ खोजें"
"Run SQL": "SQL चलाएँ"
"Date and Holiday": "तिथि और अवकाश"
"Task Kanban": "कार्य कानबन"
"China Map Annotation": "चीन मानचित्र एनोटेशन"
"Mind Map": "माइंड मैप"
"Timeline": "टाइमलाइन"
"Visual Widget": "विज़ुअल विजेट"
