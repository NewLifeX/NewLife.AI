"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Getalnotatie (optioneel), bijvoorbeeld \"#,##0.00\" of \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Array met voorwaardelijke opmaak (optioneel). Velden per item: range (bijvoorbeeld \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, enz.), color (hoofdkleur), value (drempel)"
