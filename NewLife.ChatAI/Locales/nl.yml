"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Genereert een Word-document (.docx) en geeft een downloadlink terug. Ondersteunt koppen, alinea's, lijsten, tabellen, afbeeldingen, pagina-einden, scheidingslijnen, uitgelichte kaders, KPI's, citaten en codeblokken. De JSON-array sections beschrijft elke sectie met heading, content en elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Documenttitel (maximaal 30 tekens), bijvoorbeeld Kwartaalrapport Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Array met secties (JSON). Velden per sectie: heading (sectiekop), headingLevel (1-3, standaard 1), content (alinea, optioneel), elements (array met elementen, optioneel). Elementtypen: paragraph ({type,text, optioneel bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optioneel tableStyle}; rows is een 2D-array waarbij elke rij een array met celwaarden is, bijvoorbeeld [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Thema (optioneel): sleutel van een kaartstijl (bijvoorbeeld enterprise-blue) of ingebouwde naam (blue/dark/corporate/warm/green/minimal); indien weggelaten wordt de gespreksstijl of de merkstandaard gebruikt"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Genereert een Excel-werkmap (.xlsx) en geeft een downloadlink terug. Ondersteunt meerdere werkbladen, kopstijlen, kolombreedtes, getalnotaties, voorwaardelijke opmaak, bevroren deelvensters, automatische filters en vervolgkeuzelijsten. De parameter theme accepteert een kaartstijlsleutel of een ingebouwde naam (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Werkmapptitel (maximaal 30 tekens), bijvoorbeeld Omzetrapport Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Array met werkbladen (JSON). Velden per werkblad: name, headers (array met koppen), rows (2D-array; elke rij is een array met celwaarden, bijvoorbeeld [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (bijvoorbeeld [12,20,15]), numberFormat (bijvoorbeeld \"#,##0.00\" of \"yyyy-MM-dd\"), conditionalFormats (array van {range,type,color,value?}; type ondersteunt dataBar/colorScale/greaterThan, enz.), charts (array met grafieken), freezeRows (aantal bevroren rijen), autoFilter (filterbereik), dropdowns (vervolgkeuzelijst)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Thema (optioneel): sleutel van een kaartstijl (bijvoorbeeld enterprise-blue) of ingebouwde naam (blue/dark/corporate/warm/green/minimal) die de kop en algemene kleuren bepaalt; indien weggelaten wordt de gespreksstijl of de merkstandaard gebruikt"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Genereert een PowerPoint-presentatie (.pptx) en geeft een downloadlink terug. Twee elkaar uitsluitende invoermodi: (1) slides-modus, waarin de AI gestructureerde inhoud beschrijft en de lay-out automatisch wordt gegenereerd; (2) widgetSrc-modus, die eerder gegenereerde show_widget-kaarten als dia-afbeeldingen insluit. De parameter theme accepteert een kaartstijlsleutel (bijvoorbeeld enterprise-blue/raycast-dark/ppt-executive) of een ingebouwde naam (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Presentatietitel (maximaal 30 tekens), bijvoorbeeld Kwartaalreview Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Array met dia's (JSON). Eén element = één dia; meerdere = een volledige presentatie. Sluit widgetSrc uit. Velden per dia: title, layout (title_only/title_content/two_column/chart_only/blank), background (hexkleur), footer, showPageNumber (true/false), elements (lijst met elementen), notes, transition. elements ondersteunt: text (role=title/subtitle/body/kpi/caption; optioneel bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is een 2D-array waarbij elke rij een array met celwaarden is, bijvoorbeeld [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optioneel tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Voorbeeld: [{\"title\":\"Omslag\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Review Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife-team\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Door komma's gescheiden lijst met show_widget-kaart-ID's, bijvoorbeeld 'call_abc123,call_def456'. Sluit slides uit. Zet de gegenereerde kaarten om in dia-afbeeldingen"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Thema (optioneel): sleutel van een kaartstijl (bijvoorbeeld enterprise-blue/ppt-executive) of ingebouwde naam (blue/dark/corporate/warm/green/minimal, enz.); indien weggelaten wordt de gespreksstijl of de merkstandaard gebruikt"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Toont gegevens als interactieve grafiek (zoomen, hover, exporteren als afbeelding). Ongeveer 20 keer sneller dan show_widget: alleen een JSON-specificatie (ongeveer 200 tokens) is nodig en de frontend rendert direct met ECharts. Ondersteunt: bar, line (lijn/gebied), pie (taart/donut), scatter, radar, map_china (heatmap per Chinese provincie), heatmap (matrix-heatmap), gauge, funnel en treemap. Geschikt voor numerieke vergelijkingen, tijdreeksen (lijn), aandeelanalyses en geografische spreiding. Let op: gebruik show_timeline voor reisroutes, historische gebeurtenissen, mijlpalen en tijdlijnen; deze tool ondersteunt het type timeline niet. Visuele stijl: geef een kleurenschema mee via data.colors in plaats van te vertrouwen op ECharts-standaarden. Suggesties: merkkleur voor één reeks, gelijkmatig verdeelde tinten (10-12 kleuren) voor meerdere reeksen, complementaire kleuren voor vergelijkingen en een eenkleurige gradient voor trends. Blauw en goud voor financiën, blauw/groen/wit voor gezondheidszorg en paars/blauw/cyaan voor techniek en AI. Stel voor grote datasets data.animation=false in om de rendercositie te verlagen."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Grafiektype: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Grafiektitel (maximaal 30 tekens), bijvoorbeeld BBP per provincie 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON-object; de structuur staat in de toolbeschrijving. bar-voorbeeld: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Omzet\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; radar-voorbeeld met meerdere reeksen: {\"indicators\":[{\"name\":\"Snelheid\",\"max\":100},{\"name\":\"Kracht\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar-vereiste: het aantal indicators moet gelijk zijn aan de lengte van elke series[i].data en data mag alleen getallen bevatten"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Haalt details op van de huidige ingelogde gebruiker, inclusief gebruikersnaam, weergavenaam, e-mail, mobiel, code, rollen, afdeling, geslacht, leeftijd, verjaardag en opmerking, plus het IP-adres van de bezoeker, de stad en de gedetailleerde geolocatie"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Zoekt databasetabellenschema's op trefwoord. Het resultaat bestaat uit twee delen: (1) een koppeling tabel-verbinding (Markdown-tabel die aangeeft bij welke verbinding elke tabel hoort; gelijknamige tabellen onder verschillende verbindingen worden apart vermeld); (2) de tabelschema-XML per verbinding. Latere run_sql-aanroepen moeten de verbindingsnaam uit de koppelingstabel gebruiken"
"Search keywords, separated by commas or spaces": "Zoekwoorden, gescheiden door komma's of spaties"
"Restrict to a connection name; empty searches all connections": "Beperken tot een verbindingsnaam; leeg doorzoekt alle verbindingen"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Voert een SQL-instructie uit op de opgegeven databaseverbinding. SELECT/WITH-query's geven rijen terug; niet-query-instructies zoals INSERT/UPDATE/DELETE geven het aantal getroffen rijen terug. connName moet overeenkomen met de verbindingskolom die search_table teruggeeft"
"Database connection name (from the connection column of search_table)": "Naam van de databaseverbinding (uit de verbindingskolom van search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL-instructie. SELECT/WITH geeft een resultatenset terug; niet-query-instructies geven het aantal getroffen rijen terug"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Zoekt de maankalenderdatum, het zonnejaargetijde en de werkdagstatus (werkdag/feestdag/inhaaldag) van een datum op"
"Date to query in yyyy-MM-dd format. Defaults to today": "Op te zoeken datum in de notatie yyyy-MM-dd. Standaard vandaag"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Toont een takenlijst als een kanbanbord met meerdere kolommen (bijvoorbeeld Te doen -> In uitvoering -> Klaar). Geschikt voor projectopsplitsing, sprintplanning, workflowweergave en taakstatusindeling. Elke kolom kan een kleurmarkering en een WIP-limiet hebben; elke kaart kan een titel, beschrijving, prioriteit, tags, vervaldatum, toegewezene, checklist, voortgang en link bevatten. Twee lay-outs: board (standaard bord met meerdere kolommen) en swimlane (kolommen gegroepeerd per team of module)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Bordtitel (maximaal 30 tekens), bijvoorbeeld Bord Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "JSON-array met kolomdefinities. Voorbeeld: [{\"id\":\"todo\",\"title\":\"Te doen\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirementanalyse\",\"description\":\"Gebruikersvereisten verzamelen\",\"priority\":\"high\",\"tags\":[\"ontwerp\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Gebruikers interviewen\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Alle velden behalve id en title zijn optioneel"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Lay-outmodus: board (standaard bord met meerdere kolommen) of swimlane (kolommen gegroepeerd per team of module; de parameter swimlanes is vereist)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "JSON-array met zwembandefinities (gebruikt bij layout=swimlane). Voorbeeld: [{\"id\":\"sl1\",\"title\":\"Frontendteam\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Backendteam\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Markeert coördinatenpunten (steden of POI's) of licht provincies uit op een kaart van China, genereert een geannoteerde SVG-kaart en toont die in de chatbubbel. Ondersteunt: (1) provincievulling met eigen kleuren; (2) WGS84-markeringen met lengte- en breedtegraad en labeltekst; (3) automatische legenda rechtsonder. Typisch gebruik: gegevensverdeling per provincie, stedelijke locaties en regionale verkoopheatmaps."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Kaarttitel (maximaal 30 tekens), bijvoorbeeld BBP per provincie 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "JSON-array met markeringen (mag een lege array [] zijn). Notatie: [{\"name\":\"Peking\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Peking\\n4376 mld\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng zijn WGS84-decimale graden; color/size zijn optioneel"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "JSON-array met provincie-uitlichtingen (mag een lege array [] zijn). Notatie: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"Nr. 1 BBP\"}]. name accepteert de Chinese provincienaam (volledig of kort); label is optioneel"
"Legend title (optional), e.g. GDP scale": "Legendatitel (optioneel), bijvoorbeeld BBP-schaal"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Kleurenschema (optioneel): blue/orange/green/purple/red; standaard blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Markeringsstijl (optioneel): circle/pin/square; standaard circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Toont kennis hiërarchieën of conceptrelaties als een inklapbare interactieve mindmap. De invoer is een Markdown-overzicht (# / ## / ###) dat de frontend omzet in een visuele boom. Geschikt voor kennisordening, conceptopsplitsing, technologievergelijking, optiebeoordeling en samenvatting. Visuele stijl: kies branchColors (3-8 afgestemde kleuren), maxDepth (complexiteit) en collapsed (aanvankelijk ingeklapt om te focussen) op basis van het onderwerp. Koude kleuren (blauw/paars/cyaan) voor techniek en data, warme kleuren (oranje/goud/rood) voor business en marketing, en groentinten voor natuur en gezondheid. Stel bij dichte knooppunten maxDepth=2 in voor leesbaarheid. 6 lay-outs: tree (standaard ingesprongen boom, algemeen) / radial (links-rechts radiaal, het beste voor kenniskaarten) / lr (vanuit het midden naar rechts, stroomdiagrammen/beslisbomen) / rl (vanuit het midden naar links, terugwaartse tracering) / tb (vanuit het midden omlaag, organigrammen) / bt (vanuit het midden omhoog, hiërarchie van onder naar boven)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Mindmaptitel (maximaal 30 tekens), bijvoorbeeld AI-technologiestack"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown-overzicht met # / ## / ### voor niveaus 1-3. Voorbeeld:\n# Kunstmatige intelligentie\n## Machine learning\n### Supervised learning\n### Unsupervised learning\n## Deep learning\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Lay-outmodus: tree (standaard ingesprongen boom, algemeen) / radial (links-rechts radiaal, het beste voor kenniskaarten) / lr (vanuit het midden naar rechts, stroomdiagrammen/beslisbomen) / rl (vanuit het midden naar links, terugwaartse tracering) / tb (vanuit het midden omlaag, organigrammen) / bt (vanuit het midden omhoog, hiërarchie van onder naar boven)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "JSON-array met takkleuren, bijvoorbeeld [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3 tot 8 hexkleuren worden op volgorde aan de hoofdtakken toegewezen. Indien weggelaten wordt het standaardpalet blauw/paars, groen, geel, rood, hemelblauw, donkergroen, oranje, paars gebruikt"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "JSON-array met ID's van aanvankelijk ingeklapte knooppunten, bijvoorbeeld [\"n2\",\"n5\"]. Leeg klapt alles uit. Dient om op belangrijke takken te focussen"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Maximaal zichtbare diepte: 1 = alleen hoofdtakken, 2 = twee niveaus, standaard onbeperkt. Stel bij dichte knooppunten 2 in voor leesbaarheid"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Toont tijdreeksgegevens als verzorgde tijdlijnkaarten. Alleen JSON (ongeveer 100 tokens) is nodig en de frontend rendert direct. Geschikt voor projectmijlpalen, historische gebeurtenissen, releaseplannen en ontwikkelgeschiedenis. Elk evenement kan een datum, titel, beschrijving, kleur en categorie hebben. Visuele stijl: stel een globaal palet in via de parameter palette (bijvoorbeeld blauw-paarse gradient, warm brons, merkkleuren) voor een consistente sfeer; item.color overschrijft een afzonderlijk item. Gebruik density=relaxed voor 5 of minder zorgvuldig gekozen evenementen en density=compact voor 10 of meer. 8 lay-outs: vertical (5-20 items) / alternating-top (afwisselend boven, omgekeerd chronologisch) / alternating-bottom (afwisselend onder, chronologisch) / horizontal-left (horizontaal naar links, omgekeerd chronologisch) / horizontal-right (horizontaal naar rechts, chronologisch) / s-curve (S-vormig pad, 8 items of minder) / fishbone-left (visgraat naar links, omgekeerd chronologisch) / fishbone-right (visgraat naar rechts, chronologisch)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Tijdlijntitel (maximaal 30 tekens), bijvoorbeeld Productmijlpalen"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "JSON-array met tijdlijnevenementen. Voorbeeld: [{\"date\":\"2024-01\",\"title\":\"v1.0 uitgebracht\",\"description\":\"Kernfuncties live\",\"color\":\"#5470c6\",\"category\":\"Mijlpaal\"}]. description/color/category zijn optioneel"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Lay-outmodus: vertical / alternating-top (afwisselend boven, omgekeerde volgorde) / alternating-bottom (afwisselend onder, chronologisch) / horizontal-left (horizontaal, omgekeerd chronologisch) / horizontal-right (horizontaal, chronologisch) / s-curve / fishbone-left (visgraat, omgekeerd chronologisch) / fishbone-right (visgraat, chronologisch)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "JSON-array met globaal palet, bijvoorbeeld [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Vervangt de standaardrotatie van 8 kleuren. item.color heeft voorrang"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Afstand tussen items: compact (12px) / normal (20px, standaard) / relaxed (32px). relaxed past bij 5 of minder zorgvuldig gekozen evenementen; compact bij 10 of meer"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Toont een SVG- of HTML-fragment in de chatbubbel. Gebruik het voor tijdlijnen en relatieschema's (SVG), formuliervoorbeelden en gegevenskaarten (HTML) en statistische grafieken (SVG). Gebruik het niet voor Mermaid-diagrammen; geef Mermaid als ```mermaid-codeblok in het antwoord. Limieten: maximaal 200 KB; <script src=...> alleen van vertrouwde CDN's. Visuele stijl: kies de informatiearchitectuur (Bento/kaartstroom/Grid), typografische hiërarchie en het kleursysteem op basis van het onderwerp. Koude schreefloze tinten voor technische discussies, neutrale kleuren met uitgelichte cijfers voor bedrijfsrapporten en gradients/glassmorphism/micro-animaties voor creatief werk. Stel font-family en color altijd expliciet in; vertrouw niet op browserstandaarden."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widgettitel (maximaal 30 tekens), bijvoorbeeld Orderstatus-stroom"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG moet beginnen met <svg; HTML-fragmenten moeten beginnen met het root-element en mogen geen <html><body> bevatten. Maximaal 200 KB; <script src=...> alleen van vertrouwde CDN's. Geef geen Mermaid-syntaxis door (flowchart/graph/sequenceDiagram, enz.); geef Mermaid als ```mermaid-codeblok in het antwoord"
"Placeholder text shown while loading (optional)": "Tijdelijke tekst die tijdens het laden wordt getoond (optioneel)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Themahint: light / dark / auto (systeem volgen). De gegenereerde HTML moet daarop de achtergrond- en tekstkleur kiezen; wordt niet aan de frontend-renderer doorgegeven"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Initiële widgethoogte in px (80-1200). Standaard 480. Gebruik 300-400 voor compacte kaarten en 600-800 voor grote grafieken"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Achtergrondmodus: solid (standaard) / transparent (om screenshots over een PPT-sjabloon te leggen)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT-diamodus. Bij true wordt de kaart in 16:9 gerenderd, klaar om in een presentatie te plakken. Standaard false, wat de op inhoud gebaseerde breedte behoudt"
"Section heading text, e.g. Completed this week": "Tekst van de sectiekop, bijvoorbeeld Deze week afgerond"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Kopniveau: 1 = niveau 1 (grootst), 2 = niveau 2, 3 = niveau 3; standaard 1"
"Body paragraph text (optional; used together with elements)": "Tekst van de alinea (optioneel; wordt samen met elements gebruikt)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Array met gestructureerde elementen (optioneel): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Elementtype: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
