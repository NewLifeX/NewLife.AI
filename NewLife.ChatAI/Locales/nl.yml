"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Kopstijl (optioneel): headerBgColor (kopachtergrond), headerFontColor (koptekstkleur), stripeColor (zebrastrepen)"
