"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "নথির শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন দ্বিতীয় প্রান্তিক প্রতিবেদন"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "অংশগুলোর অ্যারে (JSON)। প্রতিটি অংশের ফিল্ড: heading (অংশের শিরোনাম), headingLevel (১-৩, ডিফল্ট ১), content (টেক্সট অনুচ্ছেদ, ঐচ্ছিক), elements (উপাদানের অ্যারে, ঐচ্ছিক)। উপাদানের ধরন: paragraph ({type,text,ঐচ্ছিক bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,ঐচ্ছিক tableStyle}; rows দ্বিমাত্রিক অ্যারে, প্রতিটি সারি সেল মানের অ্যারে, যেমন [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "থিম (ঐচ্ছিক): কার্ড স্টাইল কী (যেমন enterprise-blue) অথবা অন্তর্নির্মিত নাম (blue/dark/corporate/warm/green/minimal); বাদ দিলে কথোপকথনের স্টাইল বা ব্র্যান্ড ডিফল্ট ব্যবহৃত হয়"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "একটি Excel ওয়ার্কবুক (.xlsx) তৈরি করে এবং ডাউনলোড লিংক ফিরিয়ে দেয়। একাধিক শিট, হেডার স্টাইল, কলামের প্রস্থ, সংখ্যা ফরম্যাট, শর্তসাপেক্ষ ফরম্যাটিং, প্যানেল স্থিরকরণ, স্বয়ংক্রিয় ফিল্টার এবং ড্রপডাউন তালিকা যাচাই সমর্থিত। theme প্যারামিটার কার্ড স্টাইল কী বা অন্তর্নির্মিত নাম (blue/dark/corporate/warm/green/minimal) গ্রহণ করে"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "ওয়ার্কবুকের শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন দ্বিতীয় প্রান্তিক রাজস্ব প্রতিবেদন"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "শিটগুলোর অ্যারে (JSON)। প্রতিটি শিটের ফিল্ড: name, headers (হেডারের অ্যারে), rows (দ্বিমাত্রিক অ্যারে; প্রতিটি সারি সেল মানের অ্যারে, যেমন [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (যেমন [12,20,15]), numberFormat (যেমন \"#,##0.00\" বা \"yyyy-MM-dd\"), conditionalFormats ({range,type,color,value?}-এর অ্যারে; type-এ dataBar/colorScale/greaterThan ইত্যাদি সমর্থিত), charts (চার্টের অ্যারে), freezeRows (স্থির সারির সংখ্যা), autoFilter (ফিল্টার পরিসীমা) এবং dropdowns (ড্রপডাউন তালিকা যাচাই)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "থিম (ঐচ্ছিক): কার্ড স্টাইল কী (যেমন enterprise-blue) অথবা অন্তর্নির্মিত নাম (blue/dark/corporate/warm/green/minimal) যা হেডার এবং সামগ্রিক রঙ নিয়ন্ত্রণ করে; বাদ দিলে কথোপকথনের স্টাইল বা ব্র্যান্ড ডিফল্ট ব্যবহৃত হয়"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "একটি PowerPoint উপস্থাপনা (.pptx) তৈরি করে এবং ডাউনলোড লিংক ফিরিয়ে দেয়। দুটি পরস্পর-বর্জনকারী ইনপুট মোড: (১) slides মোড যেখানে এআই কাঠামোবদ্ধ বিষয়বস্তু বর্ণনা করে এবং লেআউট স্বয়ংক্রিয়ভাবে তৈরি হয়; (২) widgetSrc মোড যা আগে তৈরি show_widget কার্ডগুলো স্লাইড চিত্র হিসেবে এমবেড করে। theme প্যারামিটার কার্ড স্টাইল কী (যেমন enterprise-blue/raycast-dark/ppt-executive) বা অন্তর্নির্মিত নাম (blue/dark/green/warm/corporate/minimal) গ্রহণ করে।"
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "উপস্থাপনার শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন দ্বিতীয় প্রান্তিক পর্যালোচনা"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "স্লাইডের অ্যারে (JSON)। একটি উপাদান = একটি স্লাইড, একাধিক উপাদান = সম্পূর্ণ উপস্থাপনা। widgetSrc-এর সাথে পরস্পর-বর্জনকারী। প্রতিটি স্লাইডের ফিল্ড: title, layout (title_only/title_content/two_column/chart_only/blank), background (হেক্স রঙ), footer, showPageNumber (true/false), elements (উপাদানের তালিকা), notes এবং transition। elements যেগুলো সমর্থন করে: text (role=title/subtitle/body/kpi/caption; ঐচ্ছিক bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows দ্বিমাত্রিক অ্যারে, প্রতিটি সারি সেল মানের অ্যারে, যেমন [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; ঐচ্ছিক tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor})। উদাহরণ: [{\"title\":\"প্রচ্ছদ\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"দ্বিতীয় প্রান্তিক পর্যালোচনা\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife দল\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "show_widget কার্ড আইডির কমা-বিভক্ত তালিকা, যেমন 'call_abc123,call_def456'। slides-এর সাথে পরস্পর-বর্জনকারী। তৈরি করা কার্ডগুলোকে স্লাইড চিত্রে রূপান্তর করে"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "থিম (ঐচ্ছিক): কার্ড স্টাইল কী (যেমন enterprise-blue/ppt-executive) অথবা অন্তর্নির্মিত নাম (blue/dark/corporate/warm/green/minimal ইত্যাদি); বাদ দিলে কথোপকথনের স্টাইল বা ব্র্যান্ড ডিফল্ট ব্যবহৃত হয়"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "ডেটা ইন্টারঅ্যাকটিভ চার্ট হিসেবে দেখায় (জুম, হোভার, ছবি হিসেবে রপ্তানি)। show_widget-এর চেয়ে প্রায় ২০ গুণ দ্রুত: একটি JSON স্পেসিফিকেশন (প্রায় ২০০ টোকেন) যথেষ্ট এবং ফ্রন্টএন্ড ECharts দিয়ে সাথে সাথে আঁকে। সমর্থিত: bar, line (রেখা/এলাকা), pie (পাই/ডোনাট), scatter, radar, map_china (চীনের প্রদেশভিত্তিক তাপ মানচিত্র), heatmap (ম্যাট্রিক্স তাপ মানচিত্র), gauge, funnel, treemap। সাংখ্যিক তুলনা, সময় সিরিজ (রেখা), অনুপাত বিশ্লেষণ এবং ভৌগোলিক বণ্টনের জন্য উপযুক্ত। দ্রষ্টব্য: পথ, ঐতিহাসিক ঘটনা, মাইলফলক এবং টাইমলাইনের জন্য show_timeline ব্যবহার করুন; এই টুলটি timeline ধরন সমর্থন করে না। ভিজ্যুয়াল স্টাইল: ECharts-এর ডিফল্টের উপর নির্ভর না করে data.colors দিয়ে রঙ প্যালেট দিন। পরামর্শ: একটি সিরিজের জন্য ব্র্যান্ড রঙ, একাধিক সিরিজের জন্য সমান ব্যবধানের শেড (১০-১২ রঙ), তুলনার জন্য পরিপূরক রঙ, প্রবণতার জন্য একরঙা গ্রেডিয়েন্ট। অর্থায়নের জন্য নীল ও সোনালি, স্বাস্থ্যের জন্য নীল/সবুজ/সাদা, প্রযুক্তি ও এআই-এর জন্য বেগুনি/নীল/সায়ান। বড় ডেটাসেটের জন্য রেন্ডার খরচ কমাতে data.animation=false সেট করুন।"
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "চার্টের ধরন: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "চার্টের শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন ২০২৪ সালে প্রদেশভিত্তিক জিডিপি"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON অবজেক্ট; গঠনটি টুলের বর্ণনায় দেওয়া আছে। bar উদাহরণ: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"রাজস্ব\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; বহু-সিরিজ radar উদাহরণ: {\"indicators\":[{\"name\":\"গতি\",\"max\":100},{\"name\":\"শক্তি\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar শর্ত: indicators-এর সংখ্যা প্রতিটি series[i].data-এর দৈর্ঘ্যের সমান হতে হবে এবং data-তে শুধু সংখ্যা থাকতে হবে"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "লগ-ইন করা ব্যবহারকারীর বিবরণ ফিরিয়ে দেয়, যার মধ্যে ব্যবহারকারীর নাম, প্রদর্শিত নাম, ইমেইল, মোবাইল, কোড, ভূমিকা, বিভাগ, লিঙ্গ, বয়স, জন্মতারিখ এবং মন্তব্য, সাথে দর্শনার্থীর IP ঠিকানা, শহর এবং বিস্তারিত ভৌগোলিক অবস্থান রয়েছে"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "কীওয়ার্ড দিয়ে ডেটাবেস সারণির স্কিমা খোঁজে। ফলাফলের দুইটি অংশ: (১) সারণি-সংযোগ মানচিত্র (Markdown সারণি যা দেখায় কোন সারণি কোন সংযোগের অন্তর্গত; ভিন্ন সংযোগে একই নামের সারণিগুলো আলাদাভাবে তালিকাভুক্ত হয়); (২) প্রতিটি সংযোগের জন্য সারণিগুলোর XML স্কিমা। পরবর্তী run_sql কলগুলোকে মানচিত্র সারণির সংযোগ নাম ব্যবহার করতে হবে"
"Search keywords, separated by commas or spaces": "কমা বা স্পেস দিয়ে বিভক্ত অনুসন্ধান কীওয়ার্ড"
"Restrict to a connection name; empty searches all connections": "সংযোগ নামে সীমাবদ্ধ করুন; খালি মানে সব সংযোগে খোঁজা"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "নির্দিষ্ট ডেটাবেস সংযোগে SQL বিবৃতি চালায়। SELECT/WITH কুয়েরি সারি ফিরিয়ে দেয়; INSERT/UPDATE/DELETE-এর মতো অ-কুয়েরি বিবৃতি প্রভাবিত সারির সংখ্যা ফিরিয়ে দেয়। connName অবশ্যই search_table-এর ফেরত দেওয়া সংযোগ কলামের সাথে মিলতে হবে"
"Database connection name (from the connection column of search_table)": "ডেটাবেস সংযোগের নাম (search_table-এর সংযোগ কলাম থেকে)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL বিবৃতি। SELECT/WITH ফলাফল সেট ফিরিয়ে দেয়; অ-কুয়েরি বিবৃতি প্রভাবিত সারির সংখ্যা ফিরিয়ে দেয়"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "একটি নির্দিষ্ট তারিখের জন্য চন্দ্র পঞ্জিকার তারিখ, সৌর পদ এবং কর্মদিবসের অবস্থা (কর্মদিবস/ছুটি/প্রতিপূরণ দিবস) খোঁজে"
"Date to query in yyyy-MM-dd format. Defaults to today": "প্রয়োজনীয় তারিখ yyyy-MM-dd ফরম্যাটে। ডিফল্ট আজ"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "কাজগুলোকে বহু-কলাম Kanban বোর্ড হিসেবে দেখায় (যেমন করতে হবে -> চলছে -> সম্পন্ন)। প্রকল্পের পর্যায় বিভাজন, স্প্রিন্ট পরিকল্পনা, কার্যপ্রবাহ প্রদর্শন এবং কাজের অবস্থা শ্রেণিবিভাগের জন্য উপযুক্ত। প্রতিটি কলামে রঙ লেবেল এবং WIP সীমা থাকতে পারে; প্রতিটি কার্ডে শিরোনাম, বর্ণনা, অগ্রাধিকার, ট্যাগ, নির্ধারিত তারিখ, দায়িত্বপ্রাপ্ত ব্যক্তি, উপকরণ তালিকা, অগ্রগতি এবং লিংক থাকতে পারে। দুটি বিন্যাস: board (ডিফল্ট বহু-কলাম বোর্ড) এবং swimlane (কলাম দল বা ইউনিট অনুযায়ী গোষ্ঠীভুক্ত)।"
"Board title (up to 30 characters), e.g. Sprint 1 Board": "বোর্ডের শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন স্প্রিন্ট ১ বোর্ড"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "কলাম সংজ্ঞার JSON অ্যারে। উদাহরণ: [{\"id\":\"todo\",\"title\":\"করতে হবে\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"প্রয়োজন বিশ্লেষণ\",\"description\":\"ব্যবহারকারীর চাহিদা সংগ্রহ করুন\",\"priority\":\"high\",\"tags\":[\"ডিজাইন\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"ব্যবহারকারীর সাক্ষাৎকার\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]। id এবং title ছাড়া সব ফিল্ড ঐচ্ছিক"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "বিন্যাস মোড: board (ডিফল্ট বহু-কলাম বোর্ড) অথবা swimlane (কলাম দল বা ইউনিট অনুযায়ী গোষ্ঠীভুক্ত; swimlanes প্যারামিটার প্রয়োজন)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "লেন সংজ্ঞার JSON অ্যারে (layout=swimlane হলে ব্যবহৃত)। উদাহরণ: [{\"id\":\"sl1\",\"title\":\"ফ্রন্টএন্ড দল\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"ব্যাকএন্ড দল\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "চীনের মানচিত্রে স্থানাঙ্ক বিন্দু (শহর বা POI) চিহ্নিত করে বা প্রদেশগুলো হাইলাইট করে, টীকাযুক্ত SVG মানচিত্র তৈরি করে এবং চ্যাট বাবলে দেখায়। সমর্থিত: (১) প্রদেশগুলো কাস্টম রঙে ভরাট; (২) অক্ষাংশ, দ্রাঘিমাংশ ও লেবেল টেক্সটসহ WGS84 মার্কার; (৩) নিচের-ডান কোণে স্বয়ংক্রিয় লিজেন্ড। সাধারণ ব্যবহার: প্রদেশভিত্তিক ডেটা বণ্টন, শহরের অবস্থান, আঞ্চলিক বিক্রয়ের তাপ মানচিত্র।"
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "মানচিত্রের শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন ২০২৪ সালে প্রদেশভিত্তিক জিডিপি"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "মার্কারের JSON অ্যারে (খালি অ্যারে [] হতে পারে)। বিন্যাস: [{\"name\":\"বেইজিং\",\"lat\":39.9,\"lng\":116.4,\"label\":\"বেইজিং\\n৪৩৭৬ বিলিয়ন\",\"color\":\"#E74C3C\",\"size\":8}]। lat/lng দশমিক ডিগ্রি WGS84-এ; color/size ঐচ্ছিক"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "প্রদেশ হাইলাইটের JSON অ্যারে (খালি অ্যারে [] হতে পারে)। বিন্যাস: [{\"name\":\"গুয়াংডং\",\"color\":\"#FFB347\",\"label\":\"জিডিপিতে প্রথম\"}]। name প্রদেশের চীনা নাম (সম্পূর্ণ বা সংক্ষিপ্ত) গ্রহণ করে; label ঐচ্ছিক"
"Legend title (optional), e.g. GDP scale": "লিজেন্ড শিরোনাম (ঐচ্ছিক), যেমন জিডিপি স্কেল"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "রঙ স্কিম (ঐচ্ছিক): blue/orange/green/purple/red; ডিফল্ট blue"
"Marker style (optional): circle/pin/square; defaults to circle": "মার্কারের আকৃতি (ঐচ্ছিক): circle/pin/square; ডিফল্ট circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "জ্ঞানের অনুক্রম বা ধারণার মধ্যে সম্পর্ককে ভাঁজযোগ্য ইন্টারঅ্যাকটিভ মাইন্ড ম্যাপ হিসেবে দেখায়। ইনপুট হলো Markdown রূপরেখা (# / ## / ###) যা ফ্রন্টএন্ড দৃশ্য গাছে রূপান্তর করে। জ্ঞান সংগঠিত করা, ধারণা বিশ্লেষণ, প্রযুক্তি তুলনা, বিকল্প মূল্যায়ন এবং বিষয়বস্তু সারসংক্ষেপের জন্য উপযুক্ত। ভিজ্যুয়াল স্টাইল: বিষয় অনুযায়ী branchColors (৩-৮টি সুসংগত রঙ), maxDepth (জটিলতা) এবং collapsed (ফোকাসের জন্য প্রাথমিক ভাঁজ) নির্বাচন করুন। প্রযুক্তি ও ডেটার জন্য শীতল রঙ (নীল/বেগুনি/সায়ান), ব্যবসা ও বিপণনের জন্য উষ্ণ রঙ (কমলা/সোনালি/লাল), প্রকৃতি ও স্বাস্থ্যের জন্য সবুজ ব্যবহার করুন। ঘন নোডের জন্য পঠনযোগ্যতা ধরে রাখতে maxDepth=2 সেট করুন। ৬টি বিন্যাস: tree (ডিফল্ট, দন্তযুক্ত বৃক্ষ, সাধারণ) / radial (বাম-ডান ব্যাসার্ধীয়, জ্ঞান মানচিত্রের জন্য সেরা) / lr (কেন্দ্র থেকে ডানে, প্রবাহ চার্ট/সিদ্ধান্ত বৃক্ষ) / rl (কেন্দ্র থেকে বামে, বিপরীত অনুসরণ) / tb (কেন্দ্র থেকে নিচে, সাংগঠনিক চার্ট) / bt (কেন্দ্র থেকে উপরে, নিচ থেকে উপরে অনুক্রম)।"
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "মাইন্ড ম্যাপের শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন এআই প্রযুক্তি স্ট্যাক"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "স্তর ১-৩-এর জন্য # / ## / ### সহ Markdown রূপরেখা। উদাহরণ:\n# কৃত্রিম বুদ্ধিমত্তা\n## মেশিন লার্নিং\n### তত্ত্বাবধায়িত শিখন\n### অতত্ত্বাবধায়িত শিখন\n## গভীর শিখন\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "বিন্যাস মোড: tree (ডিফল্ট, দন্তযুক্ত বৃক্ষ, সাধারণ) / radial (বাম-ডান ব্যাসার্ধীয়, জ্ঞান মানচিত্রের জন্য সেরা) / lr (কেন্দ্র থেকে ডানে, প্রবাহ চার্ট/সিদ্ধান্ত বৃক্ষ) / rl (কেন্দ্র থেকে বামে, বিপরীত অনুসরণ) / tb (কেন্দ্র থেকে নিচে, সাংগঠনিক চার্ট) / bt (কেন্দ্র থেকে উপরে, নিচ থেকে উপরে অনুক্রম)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "শাখার রঙের JSON অ্যারে, যেমন [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]। প্রথম স্তরের শাখাগুলোতে ক্রমে ৩-৮টি হেক্স রঙ নির্ধারণ করে। বাদ দিলে ডিফল্ট প্যালেট নীল/বেগুনি, সবুজ, হলুদ, লাল, সায়ান, গাঢ় সবুজ, কমলা এবং বেগুনি ব্যবহৃত হয়"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "প্রাথমিকভাবে ভাঁজ করা নোড আইডির JSON অ্যারে, যেমন [\"n2\",\"n5\"]। খালি মানে সব প্রসারিত। গুরুত্বপূর্ণ শাখায় ফোকাস করতে ব্যবহৃত হয়"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "সর্বোচ্চ দৃশ্যমান গভীরতা: ১ = শুধু প্রথম স্তরের শাখা, ২ = দুই স্তর, ডিফল্ট সীমাহীন। ঘন নোডের জন্য পঠনযোগ্যতা ধরে রাখতে ২ সেট করুন"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "সময় সিরিজ ডেটা সুন্দর টাইমলাইন কার্ড হিসেবে দেখায়। JSON (প্রায় ১০০ টোকেন) যথেষ্ট এবং ফ্রন্টএন্ড সাথে সাথে দেখায়। প্রকল্পের মাইলফলক, ঐতিহাসিক ঘটনা, প্রকাশ পরিকল্পনা এবং উন্নয়ন ইতিহাসের জন্য উপযুক্ত। প্রতিটি ঘটনায় তারিখ, শিরোনাম, বর্ণনা, রঙ এবং বিভাগ থাকতে পারে। ভিজ্যুয়াল স্টাইল: palette প্যারামিটার দিয়ে (যেমন নীল-বেগুনি গ্রেডিয়েন্ট, উষ্ণ ব্রোঞ্জ, ব্র্যান্ড রঙ) সামগ্রিক প্যালেট সেট করুন যাতে টাইমলাইনের চরিত্র একরকম হয়; item.color আলাদা আইটেম প্রতিস্থাপন করে। পাঁচ বা কম বাছাই করা ঘটনার জন্য density=relaxed এবং দশ বা বেশি ঘটনার জন্য density=compact ব্যবহার করুন। ৮টি বিন্যাস: vertical (৫-২০ আইটেম) / alternating-top (উপরে পর্যায়ক্রমে, বিপরীত কালানুক্রম) / alternating-bottom (নিচে পর্যায়ক্রমে, কালানুক্রম) / horizontal-left (আনুভূমিক বামে, বিপরীত) / horizontal-right (আনুভূমিক ডানে, কালানুক্রম) / s-curve (S বক্ররেখা, ৮ আইটেম বা কম) / fishbone-left (মাছের কাঁটা বামে, বিপরীত) / fishbone-right (মাছের কাঁটা ডানে, কালানুক্রম)।"
"Timeline title (up to 30 characters), e.g. Product Milestones": "টাইমলাইনের শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন পণ্যের মাইলফলক"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "টাইমলাইন ঘটনার JSON অ্যারে। উদাহরণ: [{\"date\":\"2024-01\",\"title\":\"v1.0 প্রকাশ\",\"description\":\"মূল বৈশিষ্ট্য চালু\",\"color\":\"#5470c6\",\"category\":\"মাইলফলক\"}]। description/color/category ঐচ্ছিক"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "বিন্যাস মোড: vertical / alternating-top (উপরে পর্যায়ক্রমে, বিপরীত) / alternating-bottom (নিচে পর্যায়ক্রমে, কালানুক্রম) / horizontal-left (আনুভূমিক, বিপরীত) / horizontal-right (আনুভূমিক, কালানুক্রম) / s-curve / fishbone-left (মাছের কাঁটা, বিপরীত) / fishbone-right (মাছের কাঁটা, কালানুক্রম)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "সামগ্রিক প্যালেটের JSON অ্যারে, যেমন [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]। ডিফল্ট আট-রঙ চক্র প্রতিস্থাপন করে। item.color অগ্রাধিকার পায়"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "আইটেমের দূরত্ব: compact (12px) / normal (20px, ডিফল্ট) / relaxed (32px)। relaxed পাঁচ বা কম বাছাই করা ঘটনার জন্য উপযুক্ত; compact দশ বা বেশি জন্য"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "চ্যাট বাবলের ভেতরে SVG বা HTML খণ্ড দেখায়। টাইমলাইন এবং সম্পর্ক চার্ট (SVG), ফর্ম প্রিভিউ এবং ডেটা কার্ড (HTML), পরিসংখ্যান গ্রাফিক্স (SVG) জন্য ব্যবহার করুন। Mermaid চার্টের জন্য ব্যবহার করবেন না; উত্তরে Mermaid ```mermaid কোড ব্লক হিসেবে দিন। সীমা: সর্বোচ্চ 200 KB; <script src=...> শুধু বিশ্বস্ত CDN থেকে। ভিজ্যুয়াল স্টাইল: বিষয় অনুযায়ী তথ্য স্থাপত্য (Bento/কার্ড প্রবাহ/Grid), টাইপোগ্রাফিক অনুক্রম এবং রঙ ব্যবস্থা নির্বাচন করুন। প্রযুক্তিগত আলোচনার জন্য কোণহীন শীতল টোন, ব্যবসায়িক প্রতিবেদনের জন্য স্পষ্ট সংখ্যাসহ নিরপেক্ষ রঙ, সৃজনশীল কাজের জন্য গ্রেডিয়েন্ট/কাচের প্রভাব/সূক্ষ্ম অ্যানিমেশন। সর্বদা font-family এবং color স্পষ্টভাবে উল্লেখ করুন; ব্রাউজারের ডিফল্ট স্টাইলের উপর নির্ভর করবেন না।"
"Widget title (up to 30 characters), e.g. Order Status Flow": "উইজেটের শিরোনাম (সর্বোচ্চ ৩০ অক্ষর), যেমন অর্ডার অবস্থার প্রবাহ"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG অবশ্যই <svg দিয়ে শুরু হতে হবে; HTML খণ্ড মূল উপাদান দিয়ে শুরু হতে হবে এবং <html><body> থাকতে পারবে না। সর্বোচ্চ 200 KB; <script src=...> শুধু বিশ্বস্ত CDN থেকে। Mermaid সিনট্যাক্স (flowchart/graph/sequenceDiagram ইত্যাদি) পাঠাবেন না; উত্তরে Mermaid ```mermaid কোড ব্লক হিসেবে দিন"
"Placeholder text shown while loading (optional)": "লোড হওয়ার সময় দেখানো প্লেসহোল্ডার টেক্সট (ঐচ্ছিক)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "থিম ইঙ্গিত: light / dark / auto (সিস্টেম অনুযায়ী)। উৎপন্ন HTML সেই অনুযায়ী পটভূমি ও টেক্সট রঙ নির্বাচন করা উচিত; এটি ফ্রন্টএন্ড ভিউয়ারে পাঠানো হয় না"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "উইজেটের প্রাথমিক উচ্চতা পিক্সেলে (৮০-১২০০)। ডিফল্ট ৪৮০। কম্প্যাক্ট কার্ডের জন্য ৩০০-৪০০ এবং বড় চার্টের জন্য ৬০০-৮০০ ব্যবহার করুন"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "পটভূমি মোড: solid (ডিফল্ট) / transparent (স্ক্রিনশট PPT টেমপ্লেটে বসানোর জন্য)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT স্লাইড মোড। true হলে কার্ডটি 16:9 অনুপাতে উপস্থাপনায় বসানোর জন্য প্রস্তুত দেখানো হয়। ডিফল্ট false যা বিষয়বস্তু অনুযায়ী দেখায়"
"Section heading text, e.g. Completed this week": "অংশের শিরোনাম টেক্সট, যেমন এই সপ্তাহে যা সম্পন্ন হয়েছে"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "শিরোনামের স্তর: ১ = প্রথম স্তর (সবচেয়ে বড়), ২ = দ্বিতীয় স্তর, ৩ = তৃতীয় স্তর; ডিফল্ট ১"
"Body paragraph text (optional; used together with elements)": "টেক্সট অনুচ্ছেদ (ঐচ্ছিক; elements-এর সাথে ব্যবহৃত)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "কাঠামোবদ্ধ উপাদানের অ্যারে (ঐচ্ছিক): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "উপাদানের ধরন: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "টেক্সট বিষয়বস্তু (type=paragraph/callout/quote/code হলে ব্যবহৃত)"
"List item array (used when type=bullet_list or ordered_list)": "তালিকা আইটেমের অ্যারে (type=bullet_list বা ordered_list হলে ব্যবহৃত)"
"Table header row (required when type=table)": "সারণির হেডার সারি (type=table হলে আবশ্যক)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "সারণির ডেটা সারি (type=table হলে আবশ্যক); প্রতিটি সারি সেল মানের অ্যারে, যেমন [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "সারণির স্টাইল (type=table হলে ঐচ্ছিক): headerBgColor (হেডার পটভূমি), headerFontColor (হেডার টেক্সট রঙ), stripeColor (পর্যায়ক্রমিক সারি)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "ছবির URL (type=image হলে আবশ্যক); বাহ্যিক https:// লিংক বা /cube/image?id=xxx-এর মতো অভ্যন্তরীণ সংযুক্তি সমর্থিত"
"Image width in centimeters (type=image); default 14cm": "ছবির প্রস্থ সেন্টিমিটারে (type=image); ডিফল্ট ১৪ সেমি"
"Image height in centimeters (type=image); default 10cm": "ছবির উচ্চতা সেন্টিমিটারে (type=image); ডিফল্ট ১০ সেমি"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "টেক্সট বোল্ড কিনা (type=paragraph/callout/quote হলে ঐচ্ছিক)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "টেক্সট ইটালিক কিনা (type=paragraph/callout/quote হলে ঐচ্ছিক)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "টেক্সট আন্ডারলাইন কিনা (type=paragraph/callout/quote হলে ঐচ্ছিক)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "ফন্ট আকার পয়েন্টে, যেমন ১২ (type=paragraph/callout হলে ঐচ্ছিক)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "টেক্সটের রঙ (হেক্স RGB, যেমন 2563EB; type=paragraph/callout/quote হলে ঐচ্ছিক)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "টেক্সট সারিবদ্ধকরণ: left/center/right/justify (type=paragraph হলে ঐচ্ছিক)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "অনুচ্ছেদের পটভূমি রঙ (হেক্স RGB, যেমন EFF6FF; type=paragraph হলে ঐচ্ছিক)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "হাইলাইট বাক্সের স্টাইল (type=callout): info (নীল) / success (সবুজ) / warning (হলুদ) / danger (লাল); ডিফল্ট info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI মান (type=kpi হলে আবশ্যক), যেমন ১.৭৬৮ কোটি"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI লেবেল (type=kpi হলে ঐচ্ছিক), যেমন গত মাসের তুলনায় বৃদ্ধি"
"KPI trend (optional when type=kpi): up / down / flat": "KPI প্রবণতা (type=kpi হলে ঐচ্ছিক): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "উদ্ধৃতির উৎস (type=quote হলে ঐচ্ছিক), যেমন ২০২৬ বার্ষিক প্রতিবেদন"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "কোডের ভাষা (type=code হলে ঐচ্ছিক), যেমন sql/python/javascript; সিনট্যাক্স হাইলাইটিং নির্ধারণ করে"
"Worksheet name, e.g. Q2 Data": "ওয়ার্কশিটের নাম, যেমন দ্বিতীয় প্রান্তিকের ডেটা"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "কলাম হেডারের অ্যারে, যেমন [\"তারিখ\",\"রাজস্ব\",\"পরিবর্তন\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "ডেটা সারি (দ্বিমাত্রিক অ্যারে); প্রতিটি সারি সেল মানের অ্যারে, যেমন [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "হেডার স্টাইল (ঐচ্ছিক): headerBgColor (হেডার পটভূমি), headerFontColor (হেডার টেক্সট রঙ), stripeColor (পর্যায়ক্রমিক সারি)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "কলামের প্রস্থের অ্যারে (ঐচ্ছিক), যেমন [12, 20, 15]; মানগুলো আনুমানিক অক্ষর প্রস্থ"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "সংখ্যা ফরম্যাট (ঐচ্ছিক), যেমন \"#,##0.00\" বা \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "শর্তসাপেক্ষ ফরম্যাটিংয়ের অ্যারে (ঐচ্ছিক)। প্রতিটি আইটেমের ফিল্ড: range (যেমন \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan ইত্যাদি), color (প্রধান রঙ), value (সীমা)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "চার্ট সংজ্ঞার অ্যারে (ঐচ্ছিক): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "স্থির করা উপরের সারির সংখ্যা (০ = নেই, ১ = প্রথম সারি স্থির; ডিফল্ট ১)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "স্বয়ংক্রিয় ফিল্টার পরিসীমা (যেমন \"A1:E1\"); খালি হলে নিষ্ক্রিয়"
"Dropdown validation array (optional)": "ড্রপডাউন তালিকা যাচাই অপারেশনের অ্যারে (ঐচ্ছিক)"
"Applied range (e.g. \"C2:C10\")": "প্রয়োগকৃত পরিসীমা (যেমন \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "শর্তের ধরন: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "ডেটা বার, রঙ স্কেল বা হাইলাইটের জন্য ব্যবহৃত রঙ (হেক্স RGB, যেমন 2563EB)"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "সীমা বা সূত্র (যেমন ১০০০ বা =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "চার্টের ধরন: bar / line / pie"
"Chart title (optional)": "চার্টের শিরোনাম (ঐচ্ছিক)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "বিভাগ অক্ষের লেবেলের অ্যারে, যেমন [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "ডেটা সিরিজের অ্যারে; প্রতিটি আইটেমে name এবং data থাকে"
"Applied range (e.g. \"A2:A100\")": "প্রয়োগকৃত পরিসীমা (যেমন \"A2:A100\")"
"Dropdown option array": "ড্রপডাউন তালিকার বিকল্পের অ্যারে"
"Title of this slide": "এই স্লাইডের শিরোনাম"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "স্লাইডের বিন্যাস: title_only (শুধু শিরোনাম, প্রচ্ছদের জন্য) / title_content (শিরোনাম + টেক্সট, ডিফল্ট) / two_column (দুই কলাম) / chart_only (পূর্ণ-প্রস্থ চার্ট) / blank (খালি স্থান)"
