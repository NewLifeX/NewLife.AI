"Upstream rate limited (429), retry {0}, waiting {1}ms": "Зовнішній сервіс обмежив частоту (429), спроба {0}, очікування {1}мс"
"Upstream error {0}, retry {1}": "Помилка зовнішнього сервісу {0}, спроба {1}"
"Failed to pre-create gateway conversation: {0}": "Не вдалося заздалегідь створити діалог шлюзу: {0}"
"Failed to record gateway conversation: {0}": "Не вдалося записати діалог шлюзу: {0}"
"Failed to save gateway attachment: {0}": "Не вдалося зберегти вкладення шлюзу: {0}"
"Name cannot be empty": "name не може бути порожнім"
"Name '{0}' already exists": "Назва '{0}' вже існує"
"Embedded resource china-map.svg was not found; make sure the csproj contains <EmbeddedResource Include=\"Resources\\china-map.svg\" />": "Вбудований ресурс china-map.svg не знайдено; переконайтеся, що в csproj є <EmbeddedResource Include=\"Resources\\china-map.svg\" />"
"The message does not exist or the role does not match": "Повідомлення не існує або роль не збігається"
"The conversation does not exist": "Діалог не існує"
"Model '{0}' is unavailable": "Модель '{0}' недоступна"
"No model is available; configure and enable at least one model in the admin console first": "Немає доступних моделей; спочатку налаштуйте та ввімкніть принаймні одну модель у панелі адміністратора"
"Invalid parameter: sections cannot be empty": "Недійсний параметр: sections не може бути порожнім"
"Invalid parameter: sheets cannot be empty": "Недійсний параметр: sheets не може бути порожнім"
"MCP tool not found: '{0}'": "Інструмент MCP не знайдено: '{0}'"
"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Створює документ Word (.docx) і повертає посилання для завантаження. Підтримує заголовки, абзаци, списки, таблиці, зображення, розриви сторінок, розділювачі, виділені блоки, картки KPI, цитати та блоки коду. Масив JSON sections описує кожен розділ через heading, content і elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Заголовок документа (до 30 символів), наприклад Звіт за 2 квартал"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Масив розділів (JSON). Поля кожного розділу: heading (заголовок розділу), headingLevel (1-3, типово 1), content (текстовий абзац, необов'язково), elements (масив елементів, необов'язково). Типи елементів: paragraph ({type,text,необов'язково bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,необов'язково tableStyle}; rows — двовимірний масив, кожен рядок є масивом значень комірок, наприклад [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Тема (необов'язково): ключ стилю картки (наприклад enterprise-blue) або вбудована назва (blue/dark/corporate/warm/green/minimal); якщо пропущено, використовується стиль розмови або типове оформлення бренду"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Створює книгу Excel (.xlsx) і повертає посилання для завантаження. Підтримує кілька аркушів, стилі заголовків, ширину стовпців, числові формати, умовне форматування, закріплення областей, автоматичний фільтр і перевірку розкривних списків. Параметр theme приймає ключ стилю картки або вбудовану назву (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Заголовок книги (до 30 символів), наприклад Звіт про доходи за 2 квартал"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Масив аркушів (JSON). Поля кожного аркуша: name, headers (масив заголовків), rows (двовимірний масив; кожен рядок є масивом значень комірок, наприклад [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (наприклад [12,20,15]), numberFormat (наприклад \"#,##0.00\" або \"yyyy-MM-dd\"), conditionalFormats (масив {range,type,color,value?}; type підтримує dataBar/colorScale/greaterThan та інші), charts (масив діаграм), freezeRows (кількість закріплених рядків), autoFilter (діапазон фільтра) і dropdowns (перевірка розкривного списку)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Тема (необов'язково): ключ стилю картки (наприклад enterprise-blue) або вбудована назва (blue/dark/corporate/warm/green/minimal), що визначає заголовок і загальні кольори; якщо пропущено, використовується стиль розмови або типове оформлення бренду"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Створює презентацію PowerPoint (.pptx) і повертає посилання для завантаження. Два взаємовиключні режими введення: (1) режим slides, де ШІ описує структурований вміст і макет створюється автоматично; (2) режим widgetSrc, який вбудовує вже створені картки show_widget як зображення слайдів. Параметр theme приймає ключ стилю картки (наприклад enterprise-blue/raycast-dark/ppt-executive) або вбудовану назву (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Заголовок презентації (до 30 символів), наприклад Огляд 2 кварталу"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Масив слайдів (JSON). Один елемент = один слайд, кілька елементів = повна презентація. Взаємовиключний з widgetSrc. Поля кожного слайда: title, layout (title_only/title_content/two_column/chart_only/blank), background (шістнадцятковий колір), footer, showPageNumber (true/false), elements (список елементів), notes і transition. elements підтримує: text (role=title/subtitle/body/kpi/caption; необов'язково bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows — двовимірний масив, кожен рядок є масивом значень комірок, наприклад [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; необов'язково tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Приклад: [{\"title\":\"Обкладинка\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Огляд 2 кварталу\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Команда NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Список ідентифікаторів карток show_widget, розділених комами, наприклад 'call_abc123,call_def456'. Взаємовиключний з slides. Перетворює створені картки на зображення слайдів"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Тема (необов'язково): ключ стилю картки (наприклад enterprise-blue/ppt-executive) або вбудована назва (blue/dark/corporate/warm/green/minimal тощо); якщо пропущено, використовується стиль розмови або типове оформлення бренду"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Показує дані як інтерактивну діаграму (масштабування, наведення, експорт у зображення). Приблизно у 20 разів швидше за show_widget: достатньо специфікації JSON (приблизно 200 токенів), і фронтенд одразу малює її за допомогою ECharts. Підтримуються: bar, line (лінія/область), pie (кругова/кільцева), scatter, radar, map_china (теплова карта провінцій Китаю), heatmap (матрична теплова карта), gauge, funnel, treemap. Придатна для числових порівнянь, часових рядів (лінія), аналізу часток і географічного розподілу. Примітка: для маршрутів, історичних подій, віх і хронологій використовуйте show_timeline; цей інструмент не підтримує тип timeline. Візуальний стиль: передавайте палітру через data.colors, а не покладайтеся на типові значення ECharts. Поради: колір бренду для однієї серії, рівномірно розподілені відтінки (10-12 кольорів) для багатьох серій, взаємодоповнювальні кольори для порівнянь, одноколірний градієнт для трендів. Синій і золотий для фінансів, синій/зелений/білий для охорони здоров'я, фіолетовий/синій/блакитний для технологій і ШІ. Для великих наборів даних встановіть data.animation=false, щоб зменшити витрати на відображення."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Тип діаграми: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Заголовок діаграми (до 30 символів), наприклад ВВП за провінціями 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Об'єкт JSON; структура описана в описі інструмента. Приклад bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Дохід\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; приклад radar з кількома серіями: {\"indicators\":[{\"name\":\"Швидкість\",\"max\":100},{\"name\":\"Сила\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; умова radar: кількість indicators має дорівнювати довжині кожного series[i].data, а data має містити лише числа"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Повертає дані поточного користувача: ім'я користувача, відображуване ім'я, електронну пошту, мобільний, код, ролі, відділ, стать, вік, дату народження та примітки, а також IP-адресу, місто й докладне географічне розташування відвідувача"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Шукає схеми таблиць бази даних за ключовим словом. Результат складається з двох частин: (1) карта таблиця-з'єднання (таблиця Markdown, що показує, до якого з'єднання належить кожна таблиця; однойменні таблиці в різних з'єднаннях наводяться окремо); (2) XML-схема таблиць для кожного з'єднання. Подальші виклики run_sql мають використовувати назву з'єднання з таблиці карти"
"Search keywords, separated by commas or spaces": "Ключові слова для пошуку, розділені комами або пробілами"
"Restrict to a connection name; empty searches all connections": "Обмежити назвою з'єднання; порожнє значення означає пошук у всіх з'єднаннях"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Виконує інструкцію SQL у вказаному з'єднанні бази даних. Запити SELECT/WITH повертають рядки; інструкції, що не є запитами, як-от INSERT/UPDATE/DELETE, повертають кількість уражених рядків. connName має збігатися зі стовпцем з'єднання, який повертає search_table"
"Database connection name (from the connection column of search_table)": "Назва з'єднання з базою даних ( зі стовпця з'єднання search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Інструкція SQL. SELECT/WITH повертає набір результатів; інструкції, що не є запитами, повертають кількість уражених рядків"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Визначає місячну дату за місячним календарем, сонячний термін і статус робочого дня (робочий день/вихідний/відпрацювання) для вказаної дати"
"Date to query in yyyy-MM-dd format. Defaults to today": "Потрібна дата у форматі yyyy-MM-dd. Типово сьогодні"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Показує завдання як багатоколонкову дошку Kanban (наприклад До виконання -> У роботі -> Готово). Придатна для поділу проєкту на етапи, планування Sprint, показу робочого процесу та класифікації станів завдань. Кожна колонка може мати кольорову позначку та обмеження WIP; кожна картка може мати заголовок, опис, пріоритет, теги, термін, відповідального, список підзавдань, прогрес і посилання. Два макети: board (типова багатоколонкова дошка) і swimlane (колонки згруповані за командою або підрозділом)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Заголовок дошки (до 30 символів), наприклад Дошка Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Масив JSON з описами колонок. Приклад: [{\"id\":\"todo\",\"title\":\"До виконання\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Аналіз вимог\",\"description\":\"Зібрати вимоги користувачів\",\"priority\":\"high\",\"tags\":[\"дизайн\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Інтерв'ю з користувачами\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Усі поля, крім id і title, необов'язкові"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Режим макета: board (типова багатоколонкова дошка) або swimlane (колонки згруповані за командою або підрозділом; потрібен параметр swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Масив JSON з описами доріжок (використовується, коли layout=swimlane). Приклад: [{\"id\":\"sl1\",\"title\":\"Команда фронтенду\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Команда бекенду\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Позначає точки координат (міста або POI) чи виділяє провінції на карті Китаю, створює анотовану SVG-карту й показує її в бульбашці розмови. Підтримує: (1) заливку провінцій власними кольорами; (2) маркери WGS84 із широтою, довготою та текстом позначки; (3) автоматичну легенду в правому нижньому куті. Типові застосування: розподіл даних за провінціями, розташування міст, теплові карти регіональних продажів."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Заголовок карти (до 30 символів), наприклад ВВП за провінціями 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Масив JSON маркерів (може бути порожній масив []). Формат: [{\"name\":\"Пекін\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Пекін\\n4376 млрд\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng у десяткових градусах WGS84; color/size необов'язкові"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Масив JSON виділень провінцій (може бути порожній масив []). Формат: [{\"name\":\"Гуандун\",\"color\":\"#FFB347\",\"label\":\"ВВП перше місце\"}]. name приймає назву провінції китайською (повну або скорочену); label необов'язковий"
"Legend title (optional), e.g. GDP scale": "Заголовок легенди (необов'язково), наприклад Шкала ВВП"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Колірна схема (необов'язково): blue/orange/green/purple/red; типово blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Форма маркера (необов'язково): circle/pin/square; типово circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Показує ієрархії знань або зв'язки між поняттями як інтерактивну мапу думок, що згортається. Вхідні дані — конспект Markdown (# / ## / ###), який фронтенд перетворює на візуальне дерево. Придатна для впорядкування знань, розкладання понять, порівняння технологій, оцінювання варіантів і узагальнення вмісту. Візуальний стиль: вибирайте branchColors (3-8 гармонійних кольорів), maxDepth (складність) і collapsed (початкове згортання для зосередження) залежно від теми. Використовуйте холодні кольори (синій/фіолетовий/блакитний) для технологій і даних, теплі (помаранчевий/золотий/червоний) для бізнесу й маркетингу, зелений для природи та здоров'я. Для щільних вузлів встановіть maxDepth=2, щоб зберегти читабельність. 6 макетів: tree (типово, зубчасте дерево, загальний) / radial (радіальний ліворуч-праворуч, найкращий для мап знань) / lr (від центру праворуч, блок-схеми/дерева рішень) / rl (від центру ліворуч, зворотне простеження) / tb (від центру вниз, організаційні схеми) / bt (від центру вгору, ієрархія знизу вгору)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Заголовок мапи думок (до 30 символів), наприклад Технологічний стек ШІ"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Конспект Markdown із # / ## / ### для рівнів 1-3. Приклад:\n# Штучний інтелект\n## Машинне навчання\n### Кероване навчання\n### Некероване навчання\n## Глибоке навчання\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Режим макета: tree (типово, зубчасте дерево, загальний) / radial (радіальний ліворуч-праворуч, найкращий для мап знань) / lr (від центру праворуч, блок-схеми/дерева рішень) / rl (від центру ліворуч, зворотне простеження) / tb (від центру вниз, організаційні схеми) / bt (від центру вгору, ієрархія знизу вгору)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Масив JSON кольорів гілок, наприклад [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Призначає по черзі 3-8 шістнадцяткових кольорів гілкам першого рівня. Якщо пропущено, використовується типова палітра синій/фіолетовий, зелений, жовтий, червоний, блакитний, темно-зелений, помаранчевий і фіолетовий"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Масив JSON ідентифікаторів вузлів, згорнутих початково, наприклад [\"n2\",\"n5\"]. Порожній масив розгортає все. Використовується для зосередження на важливих гілках"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Максимальна видима глибина: 1 = лише гілки першого рівня, 2 = два рівні, типово без обмежень. Для щільних вузлів встановіть 2, щоб зберегти читабельність"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Показує дані часових рядів як елегантні картки хронології. Достатньо JSON (приблизно 100 токенів), і фронтенд одразу їх показує. Придатна для віх проєкту, історичних подій, планів випусків і історії розробки. Кожна подія може мати дату, заголовок, опис, колір і категорію. Візуальний стиль: задавайте загальну палітру через параметр palette (наприклад градієнт синій-фіолетовий, тепла бронза, кольори бренду), щоб хронологія мала єдиний характер; item.color замінює окремі елементи. Використовуйте density=relaxed для п'яти або менше вибраних подій і density=compact для десяти або більше. 8 макетів: vertical (5-20 елементів) / alternating-top (почергово вгорі, зворотна хронологія) / alternating-bottom (почергово внизу, хронологія) / horizontal-left (горизонтально ліворуч, зворотно) / horizontal-right (горизонтально праворуч, хронологія) / s-curve (S-подібна крива, 8 елементів або менше) / fishbone-left (риб'яча кістка ліворуч, зворотно) / fishbone-right (риб'яча кістка праворуч, хронологія)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Заголовок хронології (до 30 символів), наприклад Віхи продукту"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Масив JSON подій хронології. Приклад: [{\"date\":\"2024-01\",\"title\":\"Випуск v1.0\",\"description\":\"Запуск основних функцій\",\"color\":\"#5470c6\",\"category\":\"віха\"}]. description/color/category необов'язкові"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Режим макета: vertical / alternating-top (почергово вгорі, зворотно) / alternating-bottom (почергово внизу, хронологія) / horizontal-left (горизонтально, зворотно) / horizontal-right (горизонтально, хронологія) / s-curve / fishbone-left (риб'яча кістка, зворотно) / fishbone-right (риб'яча кістка, хронологія)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Масив JSON загальної палітри, наприклад [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Замінює типову ротацію восьми кольорів. item.color має пріоритет"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Відстань між елементами: compact (12px) / normal (20px, типово) / relaxed (32px). relaxed підходить для п'яти або менше вибраних подій; compact — для десяти або більше"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Показує фрагмент SVG або HTML у бульбашці розмови. Використовуйте для хронологій і діаграм зв'язків (SVG), попередніх переглядів форм і карток даних (HTML), статистичних графіків (SVG). Не використовуйте для діаграм Mermaid; виводьте Mermaid як блок коду ```mermaid у відповіді. Обмеження: до 200 КБ; <script src=...> лише з надійного CDN. Візуальний стиль: вибирайте архітектуру інформації (Bento/потік карток/Grid), типографічну ієрархію та колірну систему залежно від теми. Холодні тони без кутів для технічних обговорень, нейтральні кольори з помітними числами для бізнес-звітів, градієнти/скляний ефект/легкі анімації для творчих робіт. Завжди явно задавайте font-family і color; не покладайтеся на типові стилі браузера."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Заголовок віджета (до 30 символів), наприклад Потік стану замовлення"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG має починатися з <svg; фрагменти HTML мають починатися з кореневого елемента й не містити <html><body>. До 200 КБ; <script src=...> лише з надійного CDN. Не передавайте синтаксис Mermaid (flowchart/graph/sequenceDiagram тощо); виводьте Mermaid як блок коду ```mermaid у відповіді"
"Placeholder text shown while loading (optional)": "Текст-заповнювач, що показується під час завантаження (необов'язково)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Підказка теми: light / dark / auto (за системою). Згенерований HTML має обирати відповідні кольори фону й тексту; не передається до засобу перегляду фронтенду"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Початкова висота віджета в пікселях (80-1200). Типово 480. Використовуйте 300-400 для компактних карток і 600-800 для великих діаграм"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Режим фону: solid (типово) / transparent (для вставлення знімків екрана у шаблон PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Режим слайда PPT. Коли true, картка показується у співвідношенні 16:9, готова до вставлення в презентацію. Типово false, що показує за вмістом"
"Section heading text, e.g. Completed this week": "Текст заголовка розділу, наприклад Що зроблено цього тижня"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Рівень заголовка: 1 = перший рівень (найбільший), 2 = другий рівень, 3 = третій рівень; типово 1"
"Body paragraph text (optional; used together with elements)": "Текстовий абзац (необов'язково; використовується разом з elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Масив структурованих елементів (необов'язково): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Тип елемента: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Вміст тексту (використовується, коли type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Масив елементів списку (використовується, коли type=bullet_list або ordered_list)"
"Table header row (required when type=table)": "Рядок заголовка таблиці (обов'язковий, коли type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Рядки даних таблиці (обов'язкові, коли type=table); кожен рядок є масивом значень комірок, наприклад [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Стиль таблиці (необов'язково, коли type=table): headerBgColor (фон заголовка), headerFontColor (колір тексту заголовка), stripeColor (почергові рядки)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL зображення (обов'язковий, коли type=image); підтримує зовнішні посилання https:// або внутрішні вкладення, як-от /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Ширина зображення в сантиметрах (type=image); типово 14 см"
"Image height in centimeters (type=image); default 10cm": "Висота зображення в сантиметрах (type=image); типово 10 см"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Чи текст напівжирний (необов'язково, коли type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Чи текст курсивний (необов'язково, коли type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Чи текст підкреслений (необов'язково, коли type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Розмір шрифту в пунктах, наприклад 12 (необов'язково, коли type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Колір тексту (шістнадцятковий RGB, наприклад 2563EB; необов'язково, коли type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Вирівнювання тексту: left/center/right/justify (необов'язково, коли type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Колір фону абзацу (шістнадцятковий RGB, наприклад EFF6FF; необов'язково, коли type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Стиль виділеного блоку (type=callout): info (синій) / success (зелений) / warning (жовтий) / danger (червоний); типово info"
"KPI value (required when type=kpi), e.g. 17.68M": "Значення KPI (обов'язкове, коли type=kpi), наприклад 17,68 млн"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Позначка KPI (необов'язково, коли type=kpi), наприклад зростання порівняно з минулим місяцем"
"KPI trend (optional when type=kpi): up / down / flat": "Тренд KPI (необов'язково, коли type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Джерело цитати (необов'язково, коли type=quote), наприклад Річний звіт 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Мова коду (необов'язково, коли type=code), наприклад sql/python/javascript; визначає підсвічування синтаксису"
"Worksheet name, e.g. Q2 Data": "Назва аркуша, наприклад Дані 2 кварталу"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Масив заголовків стовпців, наприклад [\"Дата\",\"Дохід\",\"Зміна\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Рядки даних (двовимірний масив); кожен рядок є масивом значень комірок, наприклад [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Стиль заголовка (необов'язково): headerBgColor (фон заголовка), headerFontColor (колір тексту заголовка), stripeColor (почергові рядки)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Масив ширин стовпців (необов'язково), наприклад [12, 20, 15]; значення є приблизною шириною в символах"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Числовий формат (необов'язково), наприклад \"#,##0.00\" або \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Масив умовного форматування (необов'язково). Поля кожного елемента: range (наприклад \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan тощо), color (основний колір), value (поріг)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Масив описів діаграм (необов'язково): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Кількість закріплених верхніх рядків (0 = немає, 1 = закріпити перший рядок; типово 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Діапазон автоматичного фільтра (наприклад \"A1:E1\"); вимкнено, коли порожній"
"Dropdown validation array (optional)": "Масив операцій перевірки розкривного списку (необов'язково)"
"Applied range (e.g. \"C2:C10\")": "Застосовуваний діапазон (наприклад \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Тип умови: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Колір (шістнадцятковий RGB, наприклад 2563EB) для смуг даних, шкал кольорів або виділення"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Поріг або формула (наприклад 1000 або =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Тип діаграми: bar / line / pie"
"Chart title (optional)": "Заголовок діаграми (необов'язково)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Масив позначок осі категорій, наприклад [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Масив серій даних; кожен елемент містить name і data"
"Applied range (e.g. \"A2:A100\")": "Застосовуваний діапазон (наприклад \"A2:A100\")"
"Dropdown option array": "Масив варіантів розкривного списку"
"Title of this slide": "Заголовок цього слайда"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Макет слайда: title_only (лише заголовок, для обкладинок) / title_content (заголовок + текст, типово) / two_column (дві колонки) / chart_only (діаграма на всю ширину) / blank (порожній простір)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Колір фону слайда, шістнадцятковий RGB, наприклад \"1F497D\"; якщо пропущено, використовується фон теми"
"Slide element list; each element describes a text block, table, chart, or image": "Список елементів слайда; кожен елемент описує текстовий блок, таблицю, діаграму або зображення"
"Footer text displayed at the bottom of the slide; null hides it": "Текст нижнього колонтитула під слайдом; null приховує його"
"Whether to show the slide number in the bottom-right corner; default false": "Чи показувати номер слайда в правому нижньому куті; типово false"
"Speaker notes used as a reminder while presenting": "Нотатки доповідача, що використовуються як нагадування під час презентації"
"Transition animation: fade / push / wipe / zoom / split / cut": "Ефект переходу: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Тип елемента: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Семантична роль (лише елементи text): title / subtitle / body / caption / kpi. Механізм макета використовує її для автоматичного розміщення елемента, без координат"
"Text content (required when type=text)": "Вміст тексту (обов'язковий, коли type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Розмір шрифту в пунктах (необов'язково); якщо пропущено, механізм макета обирає за role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Чи текст напівжирний; типово false"
"Whether the text is italic (optional for type=text); default false": "Чи текст курсивний (необов'язково, коли type=text); типово false"
"Whether the text is underlined (optional for type=text); default false": "Чи текст підкреслений (необов'язково, коли type=text); типово false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Колір тексту, шістнадцятковий RGB, наприклад \"FFFFFF\"; якщо пропущено, успадковується колір тексту теми"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Масив заголовків таблиці (обов'язковий, коли type=table), наприклад [\"Показник\",\"Q1\",\"Q2\",\"Зміна\"]"
"Chart type (required when type=chart): bar / line / pie": "Тип діаграми (обов'язковий, коли type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Позначки категорій діаграми (обов'язкові, коли type=chart), наприклад [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Серії даних (обов'язкові, коли type=chart); кожен елемент містить name (назва серії) і data (масив чисел)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Вирівнювання тексту (елементи text): l (ліворуч) / ctr (по центру) / r (праворуч)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Колір фону текстового блоку (елементи text), шістнадцятковий RGB, наприклад \"EFF6FF\"; прозорий, коли порожній"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Фрагменти форматованого тексту (елементи text); якщо задані, Content/FontSize/Bold/Color ігноруються"
"Shape configuration (required when type=shape)": "Конфігурація фігури (обов'язкова, коли type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Стиль таблиці (необов'язково, коли type=table): headerBgColor (фон заголовка), headerFontColor (колір тексту заголовка), stripeColor (почергові рядки)"
"Text content": "Вміст тексту"
"Font size in points; 0 inherits the text box default": "Розмір шрифту в пунктах; 0 успадковує типове значення текстового блоку"
"Whether the text is bold": "Чи текст напівжирний"
"Whether the text is italic": "Чи текст курсивний"
"Whether the text is underlined": "Чи текст підкреслений"
"Text color, hex RGB such as \"FF6B6B\"": "Колір тексту, шістнадцятковий RGB, наприклад \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL гіперпосилання; коли заданий, фрагмент стає клікабельним"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Тип фігури: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Колір заливки (шістнадцятковий RGB, наприклад 2563EB); null означає без заливки"
"Border color (hex RGB); null means no border": "Колір контуру (шістнадцятковий RGB); null означає без контуру"
"Text displayed inside the shape (optional)": "Текст, що відображається всередині фігури (необов'язково)"
"Text color inside the shape (hex RGB)": "Колір тексту всередині фігури (шістнадцятковий RGB)"
"Font size of the text inside the shape (points); 0 means default": "Розмір шрифту тексту всередині фігури (пункти); 0 означає типове значення"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Колір фону рядка заголовка (шістнадцятковий RGB, наприклад 2563EB); якщо пропущено, особливий стиль не застосовується"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "Колір тексту рядка заголовка (шістнадцятковий RGB, наприклад FFFFFF); якщо пропущено, успадковується типове значення"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "Колір почергових рядків (фон парних рядків даних, наприклад EFF6FF світло-синій); якщо пропущено, смуги не малюються"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "Унікальний ідентифікатор стовпця (обов'язковий), наприклад \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "Заголовок стовпця (обов'язковий, до 20 символів)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "Колір заголовка стовпця (необов'язково), шістнадцятковий, наприклад \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "Обмеження WIP (необов'язково); у разі перевищення заголовок стовпця стає червоним"
"Card array (required)": "Масив карток (обов'язковий)"
"Unique card ID (required)": "Унікальний ідентифікатор картки (обов'язковий)"
"Card title (required, up to 40 characters)": "Заголовок картки (обов'язковий, до 40 символів)"
"Supplementary description (optional, up to 100 characters)": "Додатковий опис (необов'язково, до 100 символів)"
"Priority (optional): high | medium | low": "Пріоритет (необов'язково): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "Масив тегів (необов'язково), наприклад [\"дизайн\",\"інтерфейс\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "Термін виконання (необов'язково), ISO 8601, наприклад \"2026-07-15\""
"Assignee name (optional)": "Ім'я відповідального (необов'язково)"
"Subtask checklist (optional); each item has title and done": "Список підзавдань (необов'язково); кожен елемент містить title і done"
"Completion progress (optional), 0-100": "Відсоток виконання (необов'язково), 0-100"
"Related link URL (optional)": "URL посилання (необов'язково)"
"Subtask title": "Заголовок підзавдання"
"Whether the subtask is done": "Чи підзавдання виконане"
"Unique swimlane ID (required)": "Унікальний ідентифікатор доріжки (обов'язковий)"
"Swimlane title (required)": "Заголовок доріжки (обов'язковий)"
"Column ID array contained in this swimlane (required)": "Масив ідентифікаторів стовпців у цій доріжці (обов'язковий)"
"City or place name (required), e.g. Beijing": "Назва міста або місця (обов'язково), наприклад Пекін"
"Latitude (required), WGS84 decimal degrees": "Широта (обов'язково), десяткові градуси WGS84"
"Longitude (required), WGS84 decimal degrees": "Довгота (обов'язково), десяткові градуси WGS84"
"Marker label text (optional); supports \\n line breaks": "Текст позначки маркера (необов'язково); підтримує \\\\n для розділення рядків"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "Колір маркера (необов'язково), шістнадцятковий, наприклад \"#E74C3C\"; якщо пропущено, кольори чергуються за схемою"
"Marker size (optional); default 7": "Розмір маркера (необов'язково); типово 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "Назва провінції (обов'язково); приймає назву провінції китайською (повну або скорочену), наприклад Гуандун"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "Колір виділення (необов'язково), шістнадцятковий, наприклад \"#FFB347\"; типово колір палітри"
"Highlight label (optional), e.g. No.1 GDP": "Позначка виділення (необов'язково), наприклад ВВП перше місце"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "Дата події (обов'язково); будь-який формат, наприклад \"2024-01\" або \"2024 Q3\" або \"Етап 1\""
"Event title (required, up to 30 characters)": "Заголовок події (обов'язково, до 30 символів)"
"Supplementary description (optional, up to 80 characters)": "Додатковий опис (необов'язково, до 80 символів)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "Шістнадцятковий колір (необов'язково), наприклад \"#5470c6\"; якщо пропущено, палітра чергується автоматично"
"Event category label (optional), e.g. Milestone, Release, Issue": "Позначка категорії події (необов'язково), наприклад віха, випуск, інцидент"
