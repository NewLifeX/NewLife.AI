"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Genera un documento Word (.docx) e restituisce un link per il download. Supporta titoli, paragrafi, elenchi, tabelle, immagini, interruzioni di pagina, separatori, riquadri evidenziati, KPI, citazioni e blocchi di codice. L'array JSON sections descrive ogni sezione con heading, content ed elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Titolo del documento (massimo 30 caratteri), ad esempio Report trimestrale Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Array di sezioni (JSON). Campi di ogni sezione: heading (titolo della sezione), headingLevel (1-3, predefinito 1), content (paragrafo del corpo, facoltativo), elements (array di elementi, facoltativo). Tipi di elemento: paragraph ({type,text, facoltativo bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, facoltativo tableStyle}; rows è un array bidimensionale in cui ogni riga è un array di valori di cella, ad esempio [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (facoltativo): chiave di stile della scheda (ad esempio enterprise-blue) o nome integrato (blue/dark/corporate/warm/green/minimal); se omesso, si usa lo stile della conversazione o il predefinito del marchio"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Genera una cartella di lavoro Excel (.xlsx) e restituisce un link per il download. Supporta più fogli, stili di intestazione, larghezze di colonna, formati numerici, formattazione condizionale, riquadri bloccati, filtri automatici e convalida a discesa. Il parametro theme accetta una chiave di stile della scheda o un nome integrato (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Titolo della cartella di lavoro (massimo 30 caratteri), ad esempio Report ricavi Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Array di fogli (JSON). Campi di ogni foglio: name, headers (array di intestazioni), rows (array bidimensionale; ogni riga è un array di valori di cella, ad esempio [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (ad esempio [12,20,15]), numberFormat (ad esempio \"#,##0.00\" o \"yyyy-MM-dd\"), conditionalFormats (array di {range,type,color,value?}; type supporta dataBar/colorScale/greaterThan, ecc.), charts (array di grafici), freezeRows (numero di righe bloccate), autoFilter (intervallo del filtro), dropdowns (convalida a discesa)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (facoltativo): chiave di stile della scheda (ad esempio enterprise-blue) o nome integrato (blue/dark/corporate/warm/green/minimal) che controlla intestazione e colori complessivi; se omesso, si usa lo stile della conversazione o il predefinito del marchio"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Genera una presentazione PowerPoint (.pptx) e restituisce un link per il download. Due modalità di input mutuamente esclusive: (1) modalità slides, in cui l'IA descrive contenuti strutturati e il layout viene generato automaticamente; (2) modalità widgetSrc, che incorpora schede show_widget già generate come immagini di diapositiva. Il parametro theme accetta una chiave di stile della scheda (ad esempio enterprise-blue/raycast-dark/ppt-executive) o un nome integrato (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Titolo della presentazione (massimo 30 caratteri), ad esempio Revisione trimestrale Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Array di diapositive (JSON). Un elemento = una diapositiva; più elementi = una presentazione completa. Mutuamente esclusivo con widgetSrc. Campi di ogni diapositiva: title, layout (title_only/title_content/two_column/chart_only/blank), background (colore esadecimale), footer, showPageNumber (true/false), elements (elenco di elementi), notes, transition. elements supporta: text (role=title/subtitle/body/kpi/caption; facoltativo bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows è un array bidimensionale in cui ogni riga è un array di valori di cella, ad esempio [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; facoltativo tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Esempio: [{\"title\":\"Copertina\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Revisione Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Team NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Elenco di ID di schede show_widget separati da virgole, ad esempio 'call_abc123,call_def456'. Mutuamente esclusivo con slides. Converte le schede generate in immagini di diapositiva"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (facoltativo): chiave di stile della scheda (ad esempio enterprise-blue/ppt-executive) o nome integrato (blue/dark/corporate/warm/green/minimal, ecc.); se omesso, si usa lo stile della conversazione o il predefinito del marchio"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Mostra i dati come grafico interattivo (zoom, passaggio del mouse, esportazione come immagine). Circa 20 volte più veloce di show_widget: basta una specifica JSON (circa 200 token) e il frontend esegue subito il rendering con ECharts. Supporta: bar, line (linea/area), pie (torta/ciambella), scatter, radar, map_china (mappa di calore per provincia cinese), heatmap (mappa di calore a matrice), gauge, funnel e treemap. Utile per confronti numerici, serie temporali (linea), analisi delle quote e distribuzione geografica. Nota: per itinerari, eventi storici, tappe fondamentali e cronologie usa show_timeline; questo strumento non supporta il tipo timeline. Stile visivo: passa una combinazione di colori tramite data.colors invece di affidarti ai valori predefiniti di ECharts. Suggerimenti: colore del marchio per una singola serie, tonalità distribuite uniformemente (10-12 colori) per più serie, colori complementari per i confronti e gradiente a tinta unica per le tendenze. Blu e oro per la finanza, blu/verde/bianco per la sanità e viola/blu/ciano per tecnologia e IA. Per grandi set di dati imposta data.animation=false per ridurre il costo di rendering."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Tipo di grafico: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Titolo del grafico (massimo 30 caratteri), ad esempio PIL per provincia 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Oggetto JSON; la struttura è descritta nella descrizione dello strumento. Esempio bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Ricavi\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; esempio radar multi-serie: {\"indicators\":[{\"name\":\"Velocità\",\"max\":100},{\"name\":\"Potenza\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; requisito radar: il numero di indicators deve essere uguale alla lunghezza di ogni series[i].data e data deve contenere solo numeri"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Ottiene i dettagli dell'utente connesso, inclusi nome utente, nome visualizzato, e-mail, cellulare, codice, ruoli, reparto, sesso, età, compleanno e note, oltre all'indirizzo IP del visitatore, alla città e alla posizione geografica dettagliata"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Cerca gli schemi delle tabelle del database per parola chiave. Il risultato ha due parti: (1) una mappatura tabella-connessione (tabella Markdown che indica a quale connessione appartiene ogni tabella; le tabelle con lo stesso nome in connessioni diverse sono elencate separatamente); (2) lo schema XML delle tabelle per ogni connessione. Le successive chiamate a run_sql devono usare il nome di connessione indicato nella tabella di mappatura"
"Search keywords, separated by commas or spaces": "Parole chiave di ricerca, separate da virgole o spazi"
"Restrict to a connection name; empty searches all connections": "Limita a un nome di connessione; vuoto cerca tutte le connessioni"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Esegue un'istruzione SQL sulla connessione al database indicata. Le query SELECT/WITH restituiscono righe; le istruzioni non di query come INSERT/UPDATE/DELETE restituiscono il numero di righe interessate. connName deve corrispondere alla colonna di connessione restituita da search_table"
"Database connection name (from the connection column of search_table)": "Nome della connessione al database (dalla colonna di connessione di search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Istruzione SQL. SELECT/WITH restituisce un set di risultati; le istruzioni non di query restituiscono il numero di righe interessate"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Cerca la data del calendario lunare, il termine solare e lo stato lavorativo (giorno lavorativo/festivo/giorno di recupero) di una data"
"Date to query in yyyy-MM-dd format. Defaults to today": "Data da cercare nel formato yyyy-MM-dd. Predefinito oggi"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Mostra un elenco di attività come una bacheca kanban a più colonne (ad esempio Da fare -> In corso -> Fatto). Adatto alla scomposizione di progetti, alla pianificazione degli sprint, alla visualizzazione dei flussi di lavoro e alla classificazione degli stati delle attività. Ogni colonna può avere un indicatore di colore e un limite WIP; ogni scheda può avere titolo, descrizione, priorità, tag, scadenza, assegnatario, checklist, avanzamento e link. Due layout: board (bacheca multicolonna predefinita) e swimlane (colonne raggruppate per team o modulo)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Titolo della bacheca (massimo 30 caratteri), ad esempio Bacheca Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Array JSON di definizioni di colonna. Esempio: [{\"id\":\"todo\",\"title\":\"Da fare\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Analisi dei requisiti\",\"description\":\"Raccogliere i requisiti utente\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Intervistare gli utenti\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Tutti i campi tranne id e title sono facoltativi"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Modalità di layout: board (bacheca multicolonna predefinita) o swimlane (colonne raggruppate per team o modulo; il parametro swimlanes è obbligatorio)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Array JSON di definizioni di corsie (usato quando layout=swimlane). Esempio: [{\"id\":\"sl1\",\"title\":\"Team frontend\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Team backend\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Contrassegna punti di coordinate (città o POI) o evidenzia province su una mappa della Cina, genera una mappa SVG annotata e la visualizza nella bolla della chat. Supporta: (1) riempimento delle province con colori personalizzati; (2) indicatori WGS84 di latitudine/longitudine con testo di etichetta; (3) legenda automatica nell'angolo in basso a destra. Usi tipici: distribuzione dei dati per provincia, posizione delle città e mappe di calore delle vendite regionali."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Titolo della mappa (massimo 30 caratteri), ad esempio PIL per provincia 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Array JSON di indicatori (può essere un array vuoto []). Formato: [{\"name\":\"Pechino\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Pechino\\n4376 mld\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng sono gradi decimali WGS84; color/size sono facoltativi"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Array JSON di evidenziazioni di province (può essere un array vuoto []). Formato: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"N. 1 PIL\"}]. name accetta il nome cinese della provincia (completo o abbreviato); label è facoltativo"
"Legend title (optional), e.g. GDP scale": "Titolo della legenda (facoltativo), ad esempio Scala del PIL"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Combinazione di colori (facoltativa): blue/orange/green/purple/red; predefinito blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Stile dell'indicatore (facoltativo): circle/pin/square; predefinito circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Mostra gerarchie di conoscenza o relazioni concettuali come mappa mentale interattiva comprimibile. L'input è uno schema Markdown (# / ## / ###) che il frontend converte in un albero visivo. Utile per organizzare conoscenze, scomporre concetti, confrontare tecnologie, valutare opzioni e riassumere contenuti. Stile visivo: scegli branchColors (3-8 colori coordinati), maxDepth (complessità) e collapsed (compresso inizialmente per concentrarsi) in base all'argomento. Colori freddi (blu/viola/ciano) per tecnologia e dati, caldi (arancione/oro/rosso) per business e marketing, verdi per natura e salute. Per nodi densi imposta maxDepth=2 per la leggibilità. 6 layout: tree (albero rientrato predefinito, uso generale) / radial (radiale sinistra-destra, ideale per mappe di conoscenza) / lr (dal centro a destra, diagrammi di flusso/alberi decisionali) / rl (dal centro a sinistra, tracciamento inverso) / tb (dal centro verso il basso, organigrammi) / bt (dal centro verso l'alto, gerarchia ascendente)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Titolo della mappa mentale (massimo 30 caratteri), ad esempio Stack tecnologico IA"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Schema Markdown con # / ## / ### per i livelli da 1 a 3. Esempio:\n# Intelligenza artificiale\n## Apprendimento automatico\n### Apprendimento supervisionato\n### Apprendimento non supervisionato\n## Apprendimento profondo\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Modalità di layout: tree (albero rientrato predefinito, uso generale) / radial (radiale sinistra-destra, ideale per mappe di conoscenza) / lr (dal centro a destra, diagrammi di flusso/alberi decisionali) / rl (dal centro a sinistra, tracciamento inverso) / tb (dal centro verso il basso, organigrammi) / bt (dal centro verso l'alto, gerarchia ascendente)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Array JSON di colori dei rami, ad esempio [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Da 3 a 8 colori esadecimali assegnati in ordine ai rami di primo livello. Se omesso, viene usata la tavolozza predefinita blu/viola, verde, giallo, rosso, azzurro, verde scuro, arancione, viola"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Array JSON di ID dei nodi compressi inizialmente, ad esempio [\"n2\",\"n5\"]. Vuoto espande tutto. Serve a concentrarsi sui rami chiave"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Profondità massima visibile: 1 = solo rami di primo livello, 2 = due livelli, illimitata per impostazione predefinita. Per nodi densi imposta 2 per la leggibilità"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Mostra dati temporali come schede cronologiche curate. Basta JSON (circa 100 token) e il frontend esegue subito il rendering. Utile per tappe di progetto, eventi storici, piani di rilascio e cronologia di sviluppo. Ogni evento può avere data, titolo, descrizione, colore e categoria. Stile visivo: imposta una tavolozza globale tramite il parametro palette (ad esempio gradiente blu-viola, bronzo caldo, colori del marchio) per un'atmosfera coerente; item.color sostituisce un singolo elemento. Usa density=relaxed per 5 eventi o meno e density=compact per 10 o più. 8 layout: vertical (5-20 elementi) / alternating-top (alternati sopra, ordine inverso) / alternating-bottom (alternati sotto, ordine cronologico) / horizontal-left (orizzontale a sinistra, ordine inverso) / horizontal-right (orizzontale a destra, ordine cronologico) / s-curve (percorso a S, 8 elementi o meno) / fishbone-left (spina di pesce a sinistra, ordine inverso) / fishbone-right (spina di pesce a destra, ordine cronologico)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Titolo della cronologia (massimo 30 caratteri), ad esempio Tappe del prodotto"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Array JSON di eventi della cronologia. Esempio: [{\"date\":\"2024-01\",\"title\":\"Rilascio v1.0\",\"description\":\"Funzioni principali online\",\"color\":\"#5470c6\",\"category\":\"Tappa\"}]. description/color/category sono facoltativi"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Modalità di layout: vertical / alternating-top (alternati sopra, ordine inverso) / alternating-bottom (alternati sotto, cronologico) / horizontal-left (orizzontale, ordine inverso) / horizontal-right (orizzontale, cronologico) / s-curve / fishbone-left (spina di pesce, ordine inverso) / fishbone-right (spina di pesce, cronologico)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Array JSON della tavolozza globale, ad esempio [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Sostituisce la rotazione predefinita di 8 colori. item.color ha la precedenza"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Spaziatura degli elementi: compact (12px) / normal (20px, predefinita) / relaxed (32px). relaxed è adatta a 5 eventi o meno; compact a 10 o più"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Visualizza un frammento SVG o HTML nella bolla della chat. Usalo per cronologie e diagrammi di relazione (SVG), anteprime di moduli e schede dati (HTML) e grafici statistici (SVG). Non usarlo per diagrammi Mermaid; produci Mermaid come blocco di codice ```mermaid nella risposta. Limiti: 200 KB o meno; <script src=...> solo da CDN affidabili. Stile visivo: scegli l'architettura dell'informazione (Bento/flusso di schede/Grid), la gerarchia tipografica e il sistema di colori in base all'argomento. Toni freddi senza grazie per discussioni tecniche, colori neutri con numeri evidenziati per report aziendali e gradienti/glassmorphism/microanimazioni per la creatività. Imposta sempre esplicitamente font-family e color; non affidarti agli stili predefiniti del browser."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Titolo del widget (massimo 30 caratteri), ad esempio Flusso di stato dell'ordine"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "L'SVG deve iniziare con <svg; i frammenti HTML devono iniziare con l'elemento radice e non includere <html><body>. Massimo 200 KB; <script src=...> solo da CDN affidabili. Non passare sintassi Mermaid (flowchart/graph/sequenceDiagram, ecc.); produci Mermaid come blocco di codice ```mermaid nella risposta"
"Placeholder text shown while loading (optional)": "Testo segnaposto mostrato durante il caricamento (facoltativo)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Indicazione del tema: light / dark / auto (segui il sistema). L'HTML generato deve scegliere di conseguenza i colori di sfondo e del testo; non viene passato al renderer del frontend"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Altezza iniziale del widget in px (80-1200). Predefinito 480. Usa 300-400 per schede compatte e 600-800 per grafici grandi"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Modalità di sfondo: solid (predefinita) / transparent (per sovrapporre screenshot a un modello PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Modalità diapositiva PPT. Se true la scheda viene renderizzata in proporzione 16:9, pronta da incollare in una presentazione. Predefinito false, che mantiene la larghezza adattata al contenuto"
"Section heading text, e.g. Completed this week": "Testo dell'intestazione di sezione, ad esempio Completato questa settimana"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Livello di intestazione: 1 = livello 1 (il più grande), 2 = livello 2, 3 = livello 3; predefinito 1"
"Body paragraph text (optional; used together with elements)": "Testo del paragrafo del corpo (facoltativo; usato insieme a elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Array di elementi strutturati (facoltativo): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Tipo di elemento: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Contenuto testuale (usato quando type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Array di elementi di elenco (usato quando type=bullet_list o ordered_list)"
"Table header row (required when type=table)": "Riga di intestazione della tabella (obbligatoria quando type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Righe di dati della tabella (obbligatorie quando type=table); ogni riga è un array di valori di cella, ad esempio [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Stile della tabella (facoltativo per type=table): headerBgColor (sfondo dell'intestazione), headerFontColor (colore del testo dell'intestazione), stripeColor (righe alternate)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL dell'immagine (obbligatorio quando type=image); supporta link esterni https:// o allegati interni come /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Larghezza dell'immagine in centimetri (type=image); predefinito 14 cm"
"Image height in centimeters (type=image); default 10cm": "Altezza dell'immagine in centimetri (type=image); predefinito 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Indica se il testo è in grassetto (facoltativo per type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Indica se il testo è in corsivo (facoltativo per type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Indica se il testo è sottolineato (facoltativo per type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Dimensione del carattere in punti, ad esempio 12 (facoltativo per type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Colore del testo (RGB esadecimale, ad esempio 2563EB; facoltativo per type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Allineamento del testo: left/center/right/justify (facoltativo per type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Colore di sfondo del paragrafo (RGB esadecimale, ad esempio EFF6FF; facoltativo per type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Variante del riquadro evidenziato (type=callout): info (blu) / success (verde) / warning (giallo) / danger (rosso); predefinito info"
"KPI value (required when type=kpi), e.g. 17.68M": "Valore del KPI (obbligatorio quando type=kpi), ad esempio 17,68 M"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Etichetta del KPI (facoltativa quando type=kpi), ad esempio crescita mese su mese"
"KPI trend (optional when type=kpi): up / down / flat": "Tendenza del KPI (facoltativa quando type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Fonte della citazione (facoltativa quando type=quote), ad esempio Report annuale 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Linguaggio del codice (facoltativo quando type=code), ad esempio sql/python/javascript; seleziona i colori di evidenziazione della sintassi"
"Worksheet name, e.g. Q2 Data": "Nome del foglio, ad esempio Dati Q2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Array di intestazioni di colonna, ad esempio [\"Data\",\"Ricavi\",\"Variazione\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Righe di dati (array bidimensionale); ogni riga è un array di valori di cella, ad esempio [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Stile dell'intestazione (facoltativo): headerBgColor (sfondo dell'intestazione), headerFontColor (colore del testo dell'intestazione), stripeColor (righe alternate)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Array di larghezze di colonna (facoltativo), ad esempio [12, 20, 15]; i valori sono larghezze approssimative in caratteri"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Formato numerico (facoltativo), ad esempio \"#,##0.00\" o \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Array di formattazioni condizionali (facoltativo). Campi di ogni elemento: range (ad esempio \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, ecc.), color (colore principale), value (soglia)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Array di definizioni di grafici (facoltativo): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Numero di righe superiori bloccate (0 = nessuna, 1 = blocca la prima riga; predefinito 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Intervallo del filtro automatico (ad esempio \"A1:E1\"); disattivato se vuoto"
"Dropdown validation array (optional)": "Array di convalide a discesa (facoltativo)"
"Applied range (e.g. \"C2:C10\")": "Intervallo applicato (ad esempio \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Tipo di condizione: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Colore (RGB esadecimale, ad esempio 2563EB) usato per barre dati, scale di colore o evidenziazioni"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Soglia o formula (ad esempio 1000 o =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Tipo di grafico: bar / line / pie"
"Chart title (optional)": "Titolo del grafico (facoltativo)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Array di etichette dell'asse delle categorie, ad esempio [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Array di serie di dati; ogni elemento ha name e data"
"Applied range (e.g. \"A2:A100\")": "Intervallo applicato (ad esempio \"A2:A100\")"
"Dropdown option array": "Array di opzioni dell'elenco a discesa"
"Title of this slide": "Titolo di questa diapositiva"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Layout della diapositiva: title_only (solo titolo, per copertine) / title_content (titolo + corpo, predefinito) / two_column (due colonne) / chart_only (grafico a tutta larghezza) / blank (tela vuota)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Colore di sfondo della diapositiva, RGB esadecimale come \"1F497D\"; se omesso, si usa lo sfondo del tema"
"Slide element list; each element describes a text block, table, chart, or image": "Elenco degli elementi della diapositiva; ogni elemento descrive un blocco di testo, una tabella, un grafico o un'immagine"
"Footer text displayed at the bottom of the slide; null hides it": "Testo del piè di pagina mostrato in fondo alla diapositiva; null lo nasconde"
"Whether to show the slide number in the bottom-right corner; default false": "Indica se mostrare il numero di diapositiva nell'angolo in basso a destra; predefinito false"
"Speaker notes used as a reminder while presenting": "Note del relatore usate come promemoria durante la presentazione"
"Transition animation: fade / push / wipe / zoom / split / cut": "Animazione di transizione: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Tipo di elemento: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Ruolo semantico (solo elementi text): title / subtitle / body / caption / kpi. Il motore di layout lo usa per posizionare automaticamente l'elemento, senza bisogno di coordinate"
"Text content (required when type=text)": "Contenuto testuale (obbligatorio quando type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Dimensione del carattere in punti (facoltativa); se omessa, il motore di layout ne sceglie una in base al role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Indica se il testo è in grassetto; predefinito false"
"Whether the text is italic (optional for type=text); default false": "Indica se il testo è in corsivo (facoltativo per type=text); predefinito false"
"Whether the text is underlined (optional for type=text); default false": "Indica se il testo è sottolineato (facoltativo per type=text); predefinito false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Colore del testo, RGB esadecimale come \"FFFFFF\"; se omesso, viene ereditato il colore del testo del tema"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Array di intestazioni della tabella (obbligatorio quando type=table), ad esempio [\"Metrica\",\"Q1\",\"Q2\",\"Variazione\"]"
"Chart type (required when type=chart): bar / line / pie": "Tipo di grafico (obbligatorio quando type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Etichette di categoria del grafico (obbligatorie quando type=chart), ad esempio [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Serie di dati (obbligatorie quando type=chart); ogni elemento ha name (nome della serie) e data (array di numeri)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Allineamento del testo (elementi text): l (sinistra) / ctr (centro) / r (destra)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Colore di sfondo della casella di testo (elementi text), RGB esadecimale come \"EFF6FF\"; trasparente se vuoto"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Frammenti di testo formattato (elementi text); se presenti, Content/FontSize/Bold/Color vengono ignorati"
"Shape configuration (required when type=shape)": "Configurazione della forma (obbligatoria quando type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Stile della tabella (facoltativo per type=table): headerBgColor (sfondo dell'intestazione), headerFontColor (colore del testo dell'intestazione), stripeColor (righe alternate)"
"Text content": "Contenuto testuale"
"Font size in points; 0 inherits the text box default": "Dimensione del carattere in punti; 0 eredita il valore predefinito della casella di testo"
"Whether the text is bold": "Indica se il testo è in grassetto"
"Whether the text is italic": "Indica se il testo è in corsivo"
"Whether the text is underlined": "Indica se il testo è sottolineato"
"Text color, hex RGB such as \"FF6B6B\"": "Colore del testo, RGB esadecimale come \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL del collegamento ipertestuale; se impostato, il frammento diventa cliccabile"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Tipo di forma: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Colore di riempimento (RGB esadecimale, ad esempio 2563EB); null significa nessun riempimento"
"Border color (hex RGB); null means no border": "Colore del bordo (RGB esadecimale); null significa nessun bordo"
"Text displayed inside the shape (optional)": "Testo visualizzato all'interno della forma (facoltativo)"
"Text color inside the shape (hex RGB)": "Colore del testo all'interno della forma (RGB esadecimale)"
"Font size of the text inside the shape (points); 0 means default": "Dimensione del carattere del testo all'interno della forma (punti); 0 significa predefinito"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Colore di sfondo della riga di intestazione (RGB esadecimale, ad esempio 2563EB); se omesso, non viene applicato alcuno stile speciale"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "Colore del testo della riga di intestazione (RGB esadecimale, ad esempio FFFFFF); se omesso, viene ereditato il predefinito"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "Colore delle righe alternate (sfondo delle righe di dati pari, ad esempio EFF6FF azzurro); se omesso, non vengono disegnate strisce"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "ID univoco della colonna (obbligatorio), ad esempio \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "Titolo della colonna (obbligatorio, massimo 20 caratteri)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "Colore del titolo della colonna (facoltativo), esadecimale, ad esempio \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "Limite WIP (facoltativo); il titolo della colonna diventa rosso quando viene superato"
"Card array (required)": "Array di schede (obbligatorio)"
"Unique card ID (required)": "ID univoco della scheda (obbligatorio)"
"Card title (required, up to 40 characters)": "Titolo della scheda (obbligatorio, massimo 40 caratteri)"
"Supplementary description (optional, up to 100 characters)": "Descrizione aggiuntiva (facoltativa, massimo 100 caratteri)"
"Priority (optional): high | medium | low": "Priorità (facoltativa): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "Array di stringhe di tag (facoltativo), ad esempio [\"design\",\"frontend\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "Data di scadenza (facoltativa), ISO 8601 come \"2026-07-15\""
"Assignee name (optional)": "Nome dell'assegnatario (facoltativo)"
"Subtask checklist (optional); each item has title and done": "Checklist delle sottoattività (facoltativa); ogni elemento ha title e done"
"Completion progress (optional), 0-100": "Avanzamento percentuale (facoltativo), 0-100"
"Related link URL (optional)": "URL del link correlato (facoltativo)"
"Subtask title": "Titolo della sottoattività"
"Whether the subtask is done": "Indica se la sottoattività è completata"
"Unique swimlane ID (required)": "ID univoco della corsia (obbligatorio)"
"Swimlane title (required)": "Titolo della corsia (obbligatorio)"
"Column ID array contained in this swimlane (required)": "Array di ID delle colonne contenute in questa corsia (obbligatorio)"
"City or place name (required), e.g. Beijing": "Nome della città o del luogo (obbligatorio), ad esempio Pechino"
"Latitude (required), WGS84 decimal degrees": "Latitudine (obbligatoria), gradi decimali WGS84"
"Longitude (required), WGS84 decimal degrees": "Longitudine (obbligatoria), gradi decimali WGS84"
"Marker label text (optional); supports \\n line breaks": "Testo dell'etichetta dell'indicatore (facoltativo); supporta \\\\n per gli a capo"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "Colore dell'indicatore (facoltativo), esadecimale come \"#E74C3C\"; se omesso, i colori ruotano secondo lo schema"
"Marker size (optional); default 7": "Dimensione dell'indicatore (facoltativa); predefinito 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "Nome della provincia (obbligatorio); accetta il nome cinese della provincia (completo o abbreviato), ad esempio Guangdong"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "Colore dell'evidenziazione (facoltativo), esadecimale come \"#FFB347\"; per impostazione predefinita il colore della tavolozza"
"Highlight label (optional), e.g. No.1 GDP": "Etichetta dell'evidenziazione (facoltativa), ad esempio N. 1 PIL"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "Data dell'evento (obbligatoria); qualsiasi formato, ad esempio \"2024-01\", \"2024 Q3\" o \"Fase 1\""
"Event title (required, up to 30 characters)": "Titolo dell'evento (obbligatorio, massimo 30 caratteri)"
"Supplementary description (optional, up to 80 characters)": "Descrizione aggiuntiva (facoltativa, massimo 80 caratteri)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "Colore esadecimale (facoltativo), ad esempio \"#5470c6\"; se omesso, la tavolozza ruota automaticamente"
"Event category label (optional), e.g. Milestone, Release, Issue": "Etichetta di categoria dell'evento (facoltativa), ad esempio Tappa, Rilascio, Problema"
