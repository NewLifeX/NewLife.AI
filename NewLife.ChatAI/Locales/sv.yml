"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Dokumenttitel (högst 30 tecken), till exempel Kvartalsrapport Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Array med avsnitt (JSON). Fält per avsnitt: heading (avsnittsrubrik), headingLevel (1-3, standard 1), content (brödtextstycke, valfritt), elements (elementarray, valfritt). Elementtyper: paragraph ({type,text, valfritt bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, valfritt tableStyle}; rows är en tvådimensionell array där varje rad är en array av cellvärden, till exempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (valfritt): nyckel för kortstil (till exempel enterprise-blue) eller inbyggt namn (blue/dark/corporate/warm/green/minimal); om det utelämnas används konversationsstilen eller varumärkets standard"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Skapar en Excel-arbetsbok (.xlsx) och returnerar en nedladdningslänk. Stöder flera kalkylblad, rubrikstilar, kolumnbredder, talformat, villkorsstyrd formatering, frysta rutor, autofilter och listvalidering. Parametern theme accepterar en kortstilsnyckel eller ett inbyggt namn (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Arbetsbokstitel (högst 30 tecken), till exempel Intäktsrapport Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Array med kalkylblad (JSON). Fält per blad: name, headers (rubrikarray), rows (tvådimensionell array; varje rad är en array av cellvärden, till exempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (till exempel [12,20,15]), numberFormat (till exempel \"#,##0.00\" eller \"yyyy-MM-dd\"), conditionalFormats (array av {range,type,color,value?}; type stöder dataBar/colorScale/greaterThan osv.), charts (diagramarray), freezeRows (antal frysta rader), autoFilter (filterområde), dropdowns (listvalidering)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (valfritt): nyckel för kortstil (till exempel enterprise-blue) eller inbyggt namn (blue/dark/corporate/warm/green/minimal) som styr rubrik och övergripande färger; om det utelämnas används konversationsstilen eller varumärkets standard"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Skapar en PowerPoint-presentation (.pptx) och returnerar en nedladdningslänk. Två ömsesidigt uteslutande inmatningslägen: (1) slides-läge, där AI beskriver strukturerat innehåll och layouten skapas automatiskt; (2) widgetSrc-läge, som bäddar in tidigare skapade show_widget-kort som bilder på bilder. Parametern theme accepterar en kortstilsnyckel (till exempel enterprise-blue/raycast-dark/ppt-executive) eller ett inbyggt namn (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Presentationstitel (högst 30 tecken), till exempel Kvartalsgenomgång Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Array med bilder (JSON). Ett element = en bild; flera = en fullständig presentation. Ömsesidigt uteslutande med widgetSrc. Fält per bild: title, layout (title_only/title_content/two_column/chart_only/blank), background (hexfärg), footer, showPageNumber (true/false), elements (elementlista), notes, transition. elements stöder: text (role=title/subtitle/body/kpi/caption; valfritt bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows är en tvådimensionell array där varje rad är en array av cellvärden, till exempel [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; valfritt tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Exempel: [{\"title\":\"Omslag\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Genomgång Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife-teamet\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Kommaseparerad lista med show_widget-kort-ID:n, till exempel 'call_abc123,call_def456'. Ömsesidigt uteslutande med slides. Renderar de skapade korten som bilder"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (valfritt): nyckel för kortstil (till exempel enterprise-blue/ppt-executive) eller inbyggt namn (blue/dark/corporate/warm/green/minimal osv.); om det utelämnas används konversationsstilen eller varumärkets standard"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Visar data som ett interaktivt diagram (zoom, sväva, exportera som bild). Cirka 20 gånger snabbare än show_widget: endast en JSON-specifikation (cirka 200 token) behövs och frontend renderar den direkt med ECharts. Stöder: bar, line (linje/area), pie (cirkel/ring), scatter, radar, map_china (värmekarta per kinesisk provins), heatmap (matrisvärmekarta), gauge, funnel och treemap. Användbart för numeriska jämförelser, tidsserier (linje), andelsanalys och geografisk fördelning. Obs: för resplaner, historiska händelser, milstolpar och tidslinjer använd show_timeline; det här verktyget stöder inte typen timeline. Visuell stil: skicka ett färgschema via data.colors i stället för att förlita dig på ECharts standardvärden. Förslag: varumärkesfärg för en serie, jämnt fördelade nyanser (10-12 färger) för flera serier, komplementfärger för jämförelser och en enfärgad gradient för trender. Blått och guld för finans, blått/grönt/vitt för vård och violet/blått/cyan för teknik och AI. För stora datamängder, sätt data.animation=false för att minska renderingskostnaden."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Diagramtyp: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Diagramtitel (högst 30 tecken), till exempel BNP per provins 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON-objekt; strukturen beskrivs i verktygsbeskrivningen. bar-exempel: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Intäkter\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; radar-exempel med flera serier: {\"indicators\":[{\"name\":\"Hastighet\",\"max\":100},{\"name\":\"Styrka\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; radar-krav: antalet indicators måste vara lika med längden på varje series[i].data, och data får bara innehålla tal"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Hämtar information om den inloggade användaren, inklusive användarnamn, visningsnamn, e-post, mobil, kod, roller, avdelning, kön, ålder, födelsedag och anmärkning, samt besökarens IP-adress, stad och detaljerad geografisk plats"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Söker databastabellscheman efter nyckelord. Resultatet består av två delar: (1) en mappning tabell-till-anslutning (Markdown-tabell som visar vilken anslutning varje tabell tillhör; tabeller med samma namn under olika anslutningar listas separat); (2) tabellschema-XML per anslutning. Senare run_sql-anrop måste använda anslutningsnamnet från mappningstabellen"
"Search keywords, separated by commas or spaces": "Sökord, separerade med kommatecken eller mellanslag"
"Restrict to a connection name; empty searches all connections": "Begränsa till ett anslutningsnamn; tomt söker i alla anslutningar"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Kör en SQL-sats på den angivna databasanslutningen. SELECT/WITH-frågor returnerar rader; icke-frågesatser som INSERT/UPDATE/DELETE returnerar antalet påverkade rader. connName måste matcha anslutningskolumnen som search_table returnerar"
"Database connection name (from the connection column of search_table)": "Databasanslutningsnamn (från anslutningskolumnen i search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL-sats. SELECT/WITH returnerar en resultatmängd; icke-frågesatser returnerar antalet påverkade rader"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Slår upp månkalenderdatum, soltermer och arbetsdagsstatus (arbetsdag/helgdag/återtagandedag) för ett datum"
"Date to query in yyyy-MM-dd format. Defaults to today": "Datum att slå upp i formatet yyyy-MM-dd. Standard är idag"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Visar en uppgiftslista som en kanbantavla med flera kolumner (till exempel Att göra -> Pågår -> Klart). Lämplig för projektnedbrytning, sprintplanering, arbetsflödesvisning och uppgiftsstatusindelning. Varje kolumn kan ha en färgmarkering och en WIP-gräns; varje kort kan ha titel, beskrivning, prioritet, taggar, förfallodatum, ansvarig, checklista, förlopp och länk. Två layouter: board (standardtavla med flera kolumner) och swimlane (kolumner grupperade per team eller modul)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Taveltitel (högst 30 tecken), till exempel Sprint 1-tavla"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "JSON-array med kolumndefinitioner. Exempel: [{\"id\":\"todo\",\"title\":\"Att göra\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Kravanalys\",\"description\":\"Samla användarkrav\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Intervjua användare\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Alla fält utom id och title är valfria"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Layoutläge: board (standardtavla med flera kolumner) eller swimlane (kolumner grupperade per team eller modul; parametern swimlanes krävs)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "JSON-array med simbanedefinitioner (används när layout=swimlane). Exempel: [{\"id\":\"sl1\",\"title\":\"Frontendteamet\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Backendteamet\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Markerar koordinatpunkter (städer eller POI:er) eller framhäver provinser på en karta över Kina, skapar en annoterad SVG-karta och renderar den i chattbubblan. Stöder: (1) provinsfyllning med egna färger; (2) WGS84-markeringar med latitud/longitud och etikettext; (3) automatisk teckenförklaring i nedre högra hörnet. Typiska användningar: datadistribution per provins, stadsplacering och regionala säljvärmekartor."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Karttitel (högst 30 tecken), till exempel BNP per provins 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "JSON-array med markeringar (kan vara en tom array []). Format: [{\"name\":\"Peking\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Peking\\n4376 mdr\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng är WGS84-decimalgrader; color/size är valfria"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "JSON-array med provinsframhävningar (kan vara en tom array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"Nr 1 BNP\"}]. name accepterar det kinesiska provinsnamnet (fullständigt eller kort); label är valfritt"
"Legend title (optional), e.g. GDP scale": "Teckenförklaringsrubrik (valfritt), till exempel BNP-skala"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Färgschema (valfritt): blue/orange/green/purple/red; standard blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Markeringsstil (valfritt): circle/pin/square; standard circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Visar kunskapshierarkier eller begreppsrelationer som en ihopfällbar interaktiv mindmap. Indata är en Markdown-disposition (# / ## / ###) som frontend omvandlar till ett visuellt träd. Användbart för kunskapsorganisering, begreppsnedbrytning, teknikjämförelser, alternativutvärdering och innehållssammanfattning. Visuell stil: välj branchColors (3-8 samordnade färger), maxDepth (komplexitet) och collapsed (initialt ihopfälld för fokus) utifrån ämnet. Kalla färger (blått/violett/cyan) för teknik och data, varma färger (orange/guld/rött) för affärer och marknadsföring, och grönt för natur och hälsa. För täta noder, sätt maxDepth=2 för läsbarhet. 6 layouter: tree (indragen trädstruktur, standard, allmän) / radial (vänster-höger radiell, bäst för kunskapskartor) / lr (från mitten till höger, flödesscheman/beslutsträd) / rl (från mitten till vänster, bakåtgående spårning) / tb (från mitten nedåt, organisationsscheman) / bt (från mitten uppåt, hierarki nedifrån och upp)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Mindmap-titel (högst 30 tecken), till exempel AI-teknikstack"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown-disposition med # / ## / ### för nivåerna 1-3. Exempel:\n# Artificiell intelligens\n## Maskininlärning\n### Övervakad inlärning\n### Oövervakad inlärning\n## Djupinlärning\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Layoutläge: tree (indragen trädstruktur, standard, allmän) / radial (vänster-höger radiell, bäst för kunskapskartor) / lr (från mitten till höger, flödesscheman/beslutsträd) / rl (från mitten till vänster, bakåtgående spårning) / tb (från mitten nedåt, organisationsscheman) / bt (från mitten uppåt, hierarki nedifrån och upp)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "JSON-array med grenfärger, till exempel [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3 till 8 hexfärger tilldelas i ordning till förstagrenarna. Om det utelämnas används standardpaletten blått/violett, grönt, gult, rött, himmelsblått, mörkgrönt, orange, violett"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "JSON-array med ID:n för initialt ihopfällda noder, till exempel [\"n2\",\"n5\"]. Tom expanderar allt. Används för att fokusera på viktiga grenar"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Maximalt synligt djup: 1 = endast förstagrenar, 2 = två nivåer, obegränsat som standard. För täta noder, sätt 2 för läsbarhet"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Visar tidsseriedata som snygga tidslinjekort. Endast JSON (cirka 100 token) behövs och frontend renderar direkt. Användbart för projektmilstolpar, historiska händelser, utgivningsplaner och utvecklingshistorik. Varje händelse kan ha datum, titel, beskrivning, färg och kategori. Visuell stil: ange en global palett via parametern palette (till exempel blåviolett gradient, varm brons, varumärkesfärger) för en enhetlig känsla; item.color åsidosätter en enskild post. Använd density=relaxed för 5 eller färre utvalda händelser och density=compact för 10 eller fler. 8 layouter: vertical (5-20 poster) / alternating-top (växelvis ovan, omvänd kronologisk ordning) / alternating-bottom (växelvis nedan, kronologisk) / horizontal-left (horisontellt vänster, omvänd kronologisk) / horizontal-right (horisontellt höger, kronologisk) / s-curve (S-formad bana, 8 poster eller färre) / fishbone-left (fiskben vänster, omvänd kronologisk) / fishbone-right (fiskben höger, kronologisk)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Tidslinjetitel (högst 30 tecken), till exempel Produktmilstolpar"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "JSON-array med tidslinjehändelser. Exempel: [{\"date\":\"2024-01\",\"title\":\"v1.0 släppt\",\"description\":\"Kärnfunktioner lanserade\",\"color\":\"#5470c6\",\"category\":\"Milstolpe\"}]. description/color/category är valfria"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Layoutläge: vertical / alternating-top (växelvis ovan, omvänd ordning) / alternating-bottom (växelvis nedan, kronologisk) / horizontal-left (horisontellt, omvänd kronologisk) / horizontal-right (horisontellt, kronologisk) / s-curve / fishbone-left (fiskben, omvänd kronologisk) / fishbone-right (fiskben, kronologisk)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "JSON-array med global palett, till exempel [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Ersätter standardrotationen med 8 färger. item.color har prioritet"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Avstånd mellan poster: compact (12px) / normal (20px, standard) / relaxed (32px). relaxed passar 5 eller färre utvalda händelser; compact 10 eller fler"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Renderar en SVG- eller HTML-fragment i chattbubblan. Använd den för tidslinjer och relationsdiagram (SVG), formulärförhandsvisningar och datakort (HTML) samt statistiska diagram (SVG). Använd den inte för Mermaid-diagram; skriv Mermaid som ett ```mermaid-kodblock i svaret. Gränser: högst 200 KB; <script src=...> endast från betrodda CDN:er. Visuell stil: välj informationsarkitektur (Bento/kortflöde/Grid), typografisk hierarki och färgsystem utifrån ämnet. Kalla sans-serif-toner för tekniska diskussioner, neutrala färger med framhävda siffror för affärsrapporter och gradienter/glassmorphism/mikroanimationer för kreativt arbete. Ange alltid font-family och color explicit; förlita dig inte på webbläsarens standardstilar."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widgettitel (högst 30 tecken), till exempel Orderstatusflöde"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG måste börja med <svg; HTML-fragment måste börja med rotelementet och får inte innehålla <html><body>. Högst 200 KB; <script src=...> endast från betrodda CDN:er. Skicka inte Mermaid-syntax (flowchart/graph/sequenceDiagram osv.); skriv Mermaid som ett ```mermaid-kodblock i svaret"
"Placeholder text shown while loading (optional)": "Platshållartext som visas vid laddning (valfritt)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Tematips: light / dark / auto (följ systemet). Den genererade HTML:en bör välja bakgrunds- och textfärg därefter; skickas inte till frontend-renderaren"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Initial widgethöjd i px (80-1200). Standard 480. Använd 300-400 för kompakta kort och 600-800 för stora diagram"
