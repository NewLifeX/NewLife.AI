"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT-bildläge. När true renderas kortet i 16:9-format, redo att klistras in i en presentation. Standard false, vilket behåller den innehållsstyrda bredden"
