"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Rubrikstil (valfritt): headerBgColor (rubrikbakgrund), headerFontColor (rubriktextfärg), stripeColor (randiga rader)"
