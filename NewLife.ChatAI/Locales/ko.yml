"Regenerate context is missing the user message. AssistantMessage.Id={0}, HistoryMessages.Count={1}, beforeMessages.Count={2}": "재생성 컨텍스트에 사용자 메시지가 없습니다. AssistantMessage.Id={0}, HistoryMessages.Count={1}, beforeMessages.Count={2}"
"Handler {0} failed: {1}": "처리기 {0} 실행에 실패했습니다: {1}"
"Failed to regenerate the reply: {0}": "응답 재생성에 실패했습니다: {0}"
