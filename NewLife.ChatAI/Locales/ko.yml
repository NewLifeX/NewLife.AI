"Only system administrators can modify system settings": "시스템 설정을 수정할 수 있는 권한은 시스템 관리자에게만 있습니다"
"Provider not found: provider type '{1}' associated with model '{0}' is not registered": "공급자를 찾을 수 없습니다. '{0}' 모델과 연결된 공급자 유형 '{1}'이 등록되어 있지 않습니다"
"Tool '{0}' not found": "'{0}' 도구를 찾을 수 없습니다"
"Upstream service rate limited, retry attempts exhausted": "업스트림 서비스가 속도 제한 중이며 재시도 횟수를 모두 사용했습니다"
