"Handler [{0}] OnBefore failed (non-streaming): {1}": "처리기 [{0}] OnBefore 실행에 실패했습니다(비스트리밍): {1}"
"Handler [{0}] OnAfter failed (non-streaming): {1}": "처리기 [{0}] OnAfter 실행에 실패했습니다(비스트리밍): {1}"
"Streaming generation failed: {0}": "스트리밍 생성에 실패했습니다: {0}"
"LLM context is missing the user message; skipping the call. ContextMessages.Count={0}": "LLM 컨텍스트에 사용자 메시지가 없으므로 호출을 건너뜁니다. ContextMessages.Count={0}"
"Context window budget exceeded; interrupting the tool call loop": "컨텍스트 창 예산을 초과하여 도구 호출 루프를 중단합니다"
"Upstream rate limited (429), retry {0}, waiting {1}ms": "업스트림 속도 제한(429), 재시도 {0}회, {1}ms 대기"
"Upstream error {0}, retry {1}": "업스트림 오류 {0}, 재시도 {1}회"
"Failed to pre-create gateway conversation: {0}": "게이트웨이 대화 사전 생성에 실패했습니다: {0}"
"Failed to record gateway conversation: {0}": "게이트웨이 대화 기록에 실패했습니다: {0}"
"Failed to save gateway attachment: {0}": "게이트웨이 첨부 파일 저장에 실패했습니다: {0}"
"Name cannot be empty": "이름은 비워 둘 수 없습니다"
"Name '{0}' already exists": "'{0}' 이름이 이미 존재합니다"
"Embedded resource china-map.svg was not found; make sure the csproj contains <EmbeddedResource Include=\"Resources\\china-map.svg\" />": "포함 리소스 china-map.svg를 찾을 수 없습니다. csproj에 <EmbeddedResource Include=\"Resources\\china-map.svg\" />가 포함되어 있는지 확인하세요"
"The message does not exist or the role does not match": "메시지가 존재하지 않거나 역할이 일치하지 않습니다"
"The conversation does not exist": "대화가 존재하지 않습니다"
"Model '{0}' is unavailable": "모델 '{0}'을 사용할 수 없습니다"
"No model is available; configure and enable at least one model in the admin console first": "사용 가능한 모델이 없습니다. 먼저 관리 콘솔에서 모델을 하나 이상 구성하고 활성화하세요"
"Invalid parameter: sections cannot be empty": "잘못된 매개 변수: sections 값은 비워 둘 수 없습니다"
"Invalid parameter: sheets cannot be empty": "잘못된 매개 변수: sheets 값은 비워 둘 수 없습니다"
"MCP tool not found: '{0}'": "MCP 도구를 찾을 수 없습니다: '{0}'"
"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Word 문서(.docx)를 생성하고 다운로드 링크를 반환합니다. 제목, 문단, 목록, 표, 이미지, 페이지 나누기, 구분선, 콜아웃, KPI, 인용, 코드 블록을 지원합니다. sections JSON 배열이 각 섹션의 heading, content, elements를 설명합니다"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "문서 제목(30자 이내). 예: Q2 분기 보고서"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "섹션 배열(JSON). 각 섹션 필드: heading(섹션 제목), headingLevel(1~3, 기본 1), content(본문 문단, 선택), elements(요소 배열, 선택). 요소 유형: paragraph({type,text, 선택 bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list({type,items}), ordered_list({type,items}), table({type,headers,rows, 선택 tableStyle}. rows는 2차원 배열이며 각 행이 셀 값 배열입니다. 예: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image({type,src,widthCm?,heightCm?}), page_break({type}), divider({type}), callout({type,text,variant?=info/success/warning/danger}), kpi({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote({type,text,quoteSource?}), code({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "테마(선택): 카드 스타일 키(예: enterprise-blue) 또는 내장 이름(blue/dark/corporate/warm/green/minimal). 생략하면 대화 스타일 또는 브랜드 기본값을 사용합니다"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Excel 통합 문서(.xlsx)를 생성하고 다운로드 링크를 반환합니다. 여러 워크시트, 머리글 스타일, 열 너비, 숫자 서식, 조건부 서식, 틀 고정, 자동 필터, 드롭다운 유효성 검사를 지원합니다. theme 매개변수는 카드 스타일 키 또는 내장 이름(blue/dark/corporate/warm/green/minimal)을 받습니다"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "통합 문서 제목(30자 이내). 예: Q2 매출 보고서"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "워크시트 배열(JSON). 각 시트 필드: name, headers(머리글 배열), rows(2차원 배열. 각 행이 셀 값 배열. 예: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style({headerBgColor,headerFontColor,stripeColor}), columnWidths(예: [12,20,15]), numberFormat(예: \"#,##0.00\" 또는 \"yyyy-MM-dd\"), conditionalFormats({range,type,color,value?} 배열. type은 dataBar/colorScale/greaterThan 등 지원), charts(차트 배열), freezeRows(고정할 행 수), autoFilter(필터 범위), dropdowns(드롭다운 유효성 검사)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "테마(선택): 카드 스타일 키(예: enterprise-blue) 또는 내장 이름(blue/dark/corporate/warm/green/minimal)으로 머리글과 전체 색상을 제어합니다. 생략하면 대화 스타일 또는 브랜드 기본값을 사용합니다"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "PowerPoint 프레젠테이션(.pptx)을 생성하고 다운로드 링크를 반환합니다. 상호 배타적인 두 가지 입력 모드: (1) slides 모드 - AI가 구조화된 콘텐츠를 설명하면 레이아웃을 자동 생성, (2) widgetSrc 모드 - 이미 생성된 show_widget 카드를 슬라이드 이미지로 포함. theme 매개변수는 카드 스타일 키(예: enterprise-blue/raycast-dark/ppt-executive) 또는 내장 이름(blue/dark/green/warm/corporate/minimal)을 받습니다."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "프레젠테이션 제목(30자 이내). 예: Q2 분기 리뷰"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "슬라이드 배열(JSON). 요소 1개 = 슬라이드 1장, 여러 개 = 전체 덱. widgetSrc와 상호 배타적입니다. 각 슬라이드 필드: title, layout(title_only/title_content/two_column/chart_only/blank), background(16진수 색상), footer, showPageNumber(true/false), elements(요소 목록), notes, transition. elements 지원: text(role=title/subtitle/body/kpi/caption, 선택 bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table(headers+rows, rows는 2차원 배열이며 각 행이 셀 값 배열. 예: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]], 선택 tableStyle={headerBgColor/headerFontColor/stripeColor}), chart(chartType=bar/line/pie/area/scatter+categories+series), image(src), shape(shape={shapeType,fillColor,lineColor,text,fontColor}). 예: [{\"title\":\"표지\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 리뷰\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife 팀\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "쉼표로 구분된 show_widget 카드 ID 목록. 예: 'call_abc123,call_def456'. slides와 상호 배타적입니다. 생성된 카드를 슬라이드 이미지로 렌더링합니다"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "테마(선택): 카드 스타일 키(예: enterprise-blue/ppt-executive) 또는 내장 이름(blue/dark/corporate/warm/green/minimal 등). 생략하면 대화 스타일 또는 브랜드 기본값을 사용합니다"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "데이터를 대화형 차트로 렌더링합니다(확대, 호버, 이미지 내보내기). show_widget보다 약 20배 빠르며 JSON 사양(약 200 토큰)만 있으면 프런트엔드가 ECharts로 즉시 렌더링합니다. 지원: bar, line(선/영역), pie(원형/도넛), scatter, radar, map_china(중국 성별 히트맵), heatmap(매트릭스 히트맵), gauge, funnel, treemap. 수치 비교, 시계열 변화(선), 비중 분석, 지리 분포에 적합합니다. 참고: 여정, 역사적 사건, 마일스톤, 타임라인에는 show_timeline을 사용하세요. 이 도구는 timeline 유형을 지원하지 않습니다. 시각 스타일: ECharts 기본값에 의존하지 말고 data.colors로 색상 체계를 전달하세요. 권장: 단일 시리즈는 브랜드 색상, 다중 시리즈는 색상환을 균등 배분(10~12색), 비교는 보색, 추세는 단색 그라데이션. 재무는 파랑과 금색, 의료는 파랑/초록/흰색, 기술과 AI는 보라/파랑/청록. 데이터가 많으면 data.animation=false로 렌더링 부담을 줄이세요."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "차트 유형: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "차트 제목(30자 이내). 예: 2024년 성별 GDP 분포"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON 개체. 구조는 도구 설명을 참고하세요. bar 예: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"매출\",\"data\":[100,200]}],\"unit\":\"만 위안\"}, radar 다중 시리즈 예: {\"indicators\":[{\"name\":\"속도\",\"max\":100},{\"name\":\"힘\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}. radar 요구 사항: indicators 수가 각 series[i].data 길이와 같아야 하고 data는 숫자만 포함해야 합니다"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "현재 로그인한 사용자의 상세 정보(사용자 이름, 표시 이름, 이메일, 휴대전화, 코드, 역할, 부서, 성별, 나이, 생일, 비고)와 방문 IP 주소, 도시, 상세 위치를 가져옵니다"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "키워드로 데이터베이스 테이블 스키마를 검색합니다. 결과는 두 부분입니다: (1) 테이블과 연결의 대응표(각 테이블이 어느 연결에 속하는지 명확히 보여 주는 Markdown 표. 이름이 같은 테이블은 연결별로 따로 나열), (2) 각 연결의 테이블 스키마 XML. 이후 run_sql 호출은 대응표의 연결 이름을 사용해야 합니다"
"Search keywords, separated by commas or spaces": "검색 키워드. 쉼표 또는 공백으로 구분합니다"
"Restrict to a connection name; empty searches all connections": "연결 이름으로 제한합니다. 비워 두면 모든 연결을 검색합니다"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "지정한 데이터베이스 연결에서 SQL 문을 실행합니다. SELECT/WITH는 데이터 행을 반환하고 INSERT/UPDATE/DELETE 같은 비쿼리 문은 영향받은 행 수를 반환합니다. connName은 search_table이 반환한 연결 열과 일치해야 합니다"
"Database connection name (from the connection column of search_table)": "데이터베이스 연결 이름(search_table의 연결 열)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL 문. SELECT/WITH는 결과 집합을 반환하고 비쿼리 문은 영향받은 행 수를 반환합니다"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "지정한 날짜의 음력, 절기, 근무 상태(근무/휴무/대체 근무)를 조회합니다"
"Date to query in yyyy-MM-dd format. Defaults to today": "조회할 날짜. yyyy-MM-dd 형식. 기본값은 오늘"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "작업 목록을 여러 열의 칸반 보드로 렌더링합니다(예: 할 일 -> 진행 중 -> 완료). 프로젝트 분해, 스프린트 계획, 워크플로 표시, 작업 상태 분류에 적합합니다. 각 열에는 색상 표시와 WIP 제한을 둘 수 있고, 각 카드에는 제목, 설명, 우선순위, 태그, 마감일, 담당자, 체크리스트, 진행률, 링크를 넣을 수 있습니다. 레이아웃 2가지: board(기본 다중 열 보드)와 swimlane(팀 또는 모듈별로 열을 묶음)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "보드 제목(30자 이내). 예: Sprint 1 보드"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "열 정의 JSON 배열. 예: [{\"id\":\"todo\",\"title\":\"할 일\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"요구 분석\",\"description\":\"사용자 요구 정리\",\"priority\":\"high\",\"tags\":[\"설계\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"사용자 인터뷰\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. id와 title을 제외한 모든 필드는 선택입니다"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "레이아웃 모드: board(기본 다중 열 보드) 또는 swimlane(팀 또는 모듈별로 열을 묶음. swimlanes 매개변수 필요)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "스윔레인 정의 JSON 배열(layout=swimlane일 때 사용). 예: [{\"id\":\"sl1\",\"title\":\"프런트엔드 팀\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"백엔드 팀\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "중국 지도에 좌표 지점(도시 또는 POI)을 표시하거나 성 영역을 강조하고, 주석이 있는 SVG 지도를 생성해 채팅 버블에 렌더링합니다. 지원: (1) 사용자 지정 색상으로 성 채우기, (2) WGS84 위경도 마커(레이블 포함), (3) 오른쪽 아래 자동 범례. 용도: 성별 데이터 분포, 도시 위치 표시, 지역별 매출 히트맵."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "지도 제목(30자 이내). 예: 2024년 성별 GDP 분포"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "마커 JSON 배열(빈 배열 [] 가능). 형식: [{\"name\":\"베이징\",\"lat\":39.9,\"lng\":116.4,\"label\":\"베이징\\n4376억\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng는 WGS84 십진 도, color/size는 선택입니다"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "성 강조 JSON 배열(빈 배열 [] 가능). 형식: [{\"name\":\"광둥성\",\"color\":\"#FFB347\",\"label\":\"GDP 1위\"}]. name은 중국어 성 이름(정식 명칭 또는 약칭)을 받습니다. label은 선택입니다"
"Legend title (optional), e.g. GDP scale": "범례 제목(선택). 예: GDP 규모"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "색상 체계(선택): blue/orange/green/purple/red. 기본값 blue"
"Marker style (optional): circle/pin/square; defaults to circle": "마커 스타일(선택): circle/pin/square. 기본값 circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "지식 계층이나 개념 관계를 접을 수 있는 대화형 마인드맵으로 렌더링합니다. 입력은 Markdown 개요(# / ## / ###)이며 프런트엔드가 시각적 트리로 변환합니다. 지식 정리, 개념 분해, 기술 비교, 대안 평가, 내용 요약에 적합합니다. 시각 스타일: 주제에 맞게 branchColors(3~8개의 조화 색상), maxDepth(복잡도), collapsed(핵심에 집중하기 위한 초기 접기)를 선택하세요. 기술과 데이터는 한색(파랑/보라/청록), 비즈니스와 마케팅은 난색(주황/금/빨강), 자연과 건강은 녹색 계열. 노드가 많으면 maxDepth=2로 가독성을 유지하세요. 레이아웃 6가지: tree(기본 들여쓰기 트리, 범용) / radial(좌우 방사형, 지식 맵에 최적) / lr(중심에서 오른쪽, 순서도/의사결정 트리) / rl(중심에서 왼쪽, 역추적) / tb(중심에서 아래, 조직도) / bt(중심에서 위, 상향식 계층)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "마인드맵 제목(30자 이내). 예: 인공지능 기술 체계"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown 개요. # / ## / ### 로 1~3단계 계층을 나타냅니다. 예:\n# 인공지능\n## 머신러닝\n### 지도 학습\n### 비지도 학습\n## 딥러닝\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "레이아웃 모드: tree(기본 들여쓰기 트리, 범용) / radial(좌우 방사형, 지식 맵에 최적) / lr(중심에서 오른쪽, 순서도/의사결정 트리) / rl(중심에서 왼쪽, 역추적) / tb(중심에서 아래, 조직도) / bt(중심에서 위, 상향식 계층)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "분기 색상 JSON 배열. 예: [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3~8개의 16진수 색상을 상위 분기에 순서대로 지정합니다. 생략하면 파랑/보라, 초록, 노랑, 빨강, 하늘색, 진초록, 주황, 보라의 기본 팔레트를 사용합니다"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "초기 접힘 노드 ID의 JSON 배열. 예: [\"n2\",\"n5\"]. 비어 있으면 모두 펼칩니다. 핵심 분기에 집중할 때 사용합니다"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "최대 표시 깊이: 1 = 1단계 분기만, 2 = 2단계, 기본값은 무제한. 노드가 많으면 2를 권장합니다"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "시계열 데이터를 보기 좋은 타임라인 카드로 렌더링합니다. JSON(약 100 토큰)만 있으면 프런트엔드가 즉시 렌더링합니다. 프로젝트 마일스톤, 역사적 사건, 릴리스 계획, 발전 과정에 적합합니다. 각 이벤트에는 날짜, 제목, 설명, 색상, 범주를 넣을 수 있습니다. 시각 스타일: palette 매개변수로 전체 색상(파랑-보라 그라데이션, 따뜻한 청동, 브랜드 색상 등)을 지정해 일관된 분위기를 만드세요. item.color로 개별 항목을 덮어쓸 수 있습니다. 5개 이하의 엄선된 이벤트에는 density=relaxed, 10개 이상의 밀집 타임라인에는 density=compact를 권장합니다. 레이아웃 8가지: vertical(5~20개) / alternating-top(위아래 교대, 최신순) / alternating-bottom(위아래 교대, 시간순) / horizontal-left(가로 왼쪽, 최신순) / horizontal-right(가로 오른쪽, 시간순) / s-curve(S자 경로, 8개 이하) / fishbone-left(피시본 왼쪽, 최신순) / fishbone-right(피시본 오른쪽, 시간순)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "타임라인 제목(30자 이내). 예: 제품 개발 마일스톤"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "타임라인 이벤트 JSON 배열. 예: [{\"date\":\"2024-01\",\"title\":\"v1.0 출시\",\"description\":\"핵심 기능 공개\",\"color\":\"#5470c6\",\"category\":\"마일스톤\"}]. description/color/category는 선택입니다"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "레이아웃 모드: vertical / alternating-top(위아래 교대, 최신순) / alternating-bottom(위아래 교대, 시간순) / horizontal-left(가로, 최신순) / horizontal-right(가로, 시간순) / s-curve / fishbone-left(피시본, 최신순) / fishbone-right(피시본, 시간순)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "전체 색상 JSON 배열. 예: [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 기본 8색 순환을 덮어씁니다. item.color가 우선합니다"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "항목 간격: compact(12px) / normal(20px, 기본) / relaxed(32px). 5개 이하의 엄선된 이벤트에는 relaxed, 10개 이상에는 compact를 권장합니다"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "SVG 또는 HTML 조각을 채팅 버블 안에 렌더링합니다. 타임라인과 관계도(SVG), 양식 미리보기와 데이터 카드(HTML), 통계 차트(SVG)에 사용합니다. Mermaid 다이어그램에는 사용하지 마세요. Mermaid는 답변에서 ```mermaid 코드 블록으로 출력하세요. 제한: 200KB 이하, <script src=...>는 신뢰할 수 있는 CDN만. 시각 스타일: 주제에 맞게 정보 구조(Bento/카드 흐름/Grid), 글꼴 계층, 색상 체계를 선택하세요. 기술 논의는 한색 산세리프, 비즈니스 보고서는 중성 색과 숫자 강조, 창의적 디자인은 그라데이션/글래스모피즘/마이크로 애니메이션. font-family와 color를 반드시 명시하고 브라우저 기본 스타일에 의존하지 마세요."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widget 제목(30자 이내). 예: 주문 상태 흐름"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG는 <svg로 시작해야 합니다. HTML 조각은 루트 요소로 시작해야 하며 <html><body>를 포함하면 안 됩니다. 최대 200KB, <script src=...>는 신뢰할 수 있는 CDN만. Mermaid 문법(flowchart/graph/sequenceDiagram 등)을 전달하지 마세요. Mermaid는 답변에서 ```mermaid 코드 블록으로 출력하세요"
"Placeholder text shown while loading (optional)": "로딩 중에 표시할 자리표시자 텍스트(선택)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "테마 힌트: light / dark / auto(시스템 따름). 생성되는 HTML은 이에 맞춰 배경색과 글자색을 선택해야 합니다. 프런트엔드 렌더러로 전달되지 않습니다"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Widget 초기 높이(px, 80~1200). 기본값 480. 간결한 카드는 300~400, 큰 차트는 600~800을 권장합니다"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "배경 모드: solid(기본) / transparent(스크린샷을 PPT 템플릿 위에 겹칠 때)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT 슬라이드 모드. true이면 카드를 16:9 비율로 렌더링해 프레젠테이션에 바로 붙여넣을 수 있습니다. 기본값 false는 내용에 맞는 너비를 유지합니다"
"Section heading text, e.g. Completed this week": "섹션 제목 텍스트. 예: 이번 주 완료 항목"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "제목 수준: 1 = 1단계(가장 큼), 2 = 2단계, 3 = 3단계. 기본값 1"
"Body paragraph text (optional; used together with elements)": "본문 문단 텍스트(선택. elements와 함께 사용)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "구조화 요소 배열(선택): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "요소 유형: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "텍스트 내용(type=paragraph/callout/quote/code일 때 사용)"
"List item array (used when type=bullet_list or ordered_list)": "목록 항목 배열(type=bullet_list 또는 ordered_list일 때 사용)"
"Table header row (required when type=table)": "표 머리글 행(type=table일 때 필수)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "표 데이터 행(type=table일 때 필수). 각 행은 셀 값 배열입니다. 예: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "표 스타일(type=table일 때 선택): headerBgColor(머리글 배경색), headerFontColor(머리글 글자색), stripeColor(줄무늬 색)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "이미지 URL(type=image일 때 필수). 외부 https:// 링크 또는 내부 첨부(예: /cube/image?id=xxx)를 지원합니다"
"Image width in centimeters (type=image); default 14cm": "이미지 너비(센티미터, type=image). 기본값 14cm"
"Image height in centimeters (type=image); default 10cm": "이미지 높이(센티미터, type=image). 기본값 10cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "텍스트를 굵게 표시할지 여부(type=paragraph/callout/quote일 때 선택)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "텍스트를 기울임꼴로 표시할지 여부(type=paragraph/callout/quote일 때 선택)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "텍스트에 밑줄을 표시할지 여부(type=paragraph/callout/quote일 때 선택)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "글꼴 크기(포인트). 예: 12 (type=paragraph/callout일 때 선택)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "글자색(16진수 RGB, 예: 2563EB. type=paragraph/callout/quote일 때 선택)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "텍스트 정렬: left/center/right/justify(type=paragraph일 때 선택)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "문단 배경색(16진수 RGB, 예: EFF6FF. type=paragraph일 때 선택)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "콜아웃 변형(type=callout): info(파랑) / success(초록) / warning(노랑) / danger(빨강). 기본값 info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI 값(type=kpi일 때 필수). 예: 17.68M"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI 설명(type=kpi일 때 선택). 예: 전월 대비 성장"
"KPI trend (optional when type=kpi): up / down / flat": "KPI 추세(type=kpi일 때 선택): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "인용 출처(type=quote일 때 선택). 예: 2026 연차 보고서"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "코드 언어(type=code일 때 선택). 예: sql/python/javascript. 구문 강조 색상을 선택합니다"
"Worksheet name, e.g. Q2 Data": "워크시트 이름. 예: Q2 데이터"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "열 머리글 배열. 예: [\"날짜\",\"매출\",\"전월 대비\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "데이터 행(2차원 배열). 각 행은 셀 값 배열입니다. 예: [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "머리글 스타일(선택): headerBgColor(머리글 배경색), headerFontColor(머리글 글자색), stripeColor(줄무늬 색)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "열 너비 배열(선택). 예: [12, 20, 15]. 값은 대략적인 문자 너비입니다"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "숫자 서식(선택). 예: \"#,##0.00\" 또는 \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "조건부 서식 배열(선택). 각 항목 필드: range(예: \"C2:C10\"), type(dataBar/colorScale/greaterThan/lessThan 등), color(주 색상), value(임계값)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "차트 정의 배열(선택): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "고정할 상단 행 수(0 = 없음, 1 = 첫 행 고정, 기본 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "자동 필터 범위(예: \"A1:E1\"). 비어 있으면 사용하지 않습니다"
"Dropdown validation array (optional)": "드롭다운 유효성 검사 배열(선택)"
"Applied range (e.g. \"C2:C10\")": "적용 범위(예: \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "조건 유형: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "색상(16진수 RGB, 예: 2563EB). 데이터 막대, 색조, 강조 표시에 사용합니다"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "임계값 또는 수식(예: 1000 또는 =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "차트 유형: bar / line / pie"
"Chart title (optional)": "차트 제목(선택)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "범주 축 레이블 배열. 예: [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "데이터 시리즈 배열. 각 항목에 name과 data가 있습니다"
"Applied range (e.g. \"A2:A100\")": "적용 범위(예: \"A2:A100\")"
"Dropdown option array": "드롭다운 옵션 배열"
"Title of this slide": "이 슬라이드의 제목"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "슬라이드 레이아웃: title_only(제목만, 표지용) / title_content(제목+본문, 기본) / two_column(좌우 2단) / chart_only(전체 차트) / blank(빈 캔버스)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "슬라이드 배경색(16진수 RGB, 예: \"1F497D\"). 생략하면 테마 배경을 사용합니다"
"Slide element list; each element describes a text block, table, chart, or image": "슬라이드 요소 목록. 각 요소는 텍스트, 표, 차트 또는 이미지를 설명합니다"
"Footer text displayed at the bottom of the slide; null hides it": "슬라이드 아래쪽에 표시할 바닥글 텍스트. null이면 표시하지 않습니다"
"Whether to show the slide number in the bottom-right corner; default false": "오른쪽 아래에 슬라이드 번호를 표시할지 여부. 기본값 false"
"Speaker notes used as a reminder while presenting": "발표할 때 참고하는 발표자 노트"
"Transition animation: fade / push / wipe / zoom / split / cut": "전환 애니메이션: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "요소 유형: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "의미 역할(text 요소 전용): title / subtitle / body / caption / kpi. 레이아웃 엔진이 이를 기준으로 자동 배치하므로 좌표를 지정할 필요가 없습니다"
"Text content (required when type=text)": "텍스트 내용(type=text일 때 필수)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "글꼴 크기(포인트, 선택). 생략하면 레이아웃 엔진이 role에 따라 결정합니다(title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "텍스트를 굵게 표시할지 여부. 기본값 false"
"Whether the text is italic (optional for type=text); default false": "텍스트를 기울임꼴로 표시할지 여부(type=text일 때 선택). 기본값 false"
"Whether the text is underlined (optional for type=text); default false": "텍스트에 밑줄을 표시할지 여부(type=text일 때 선택). 기본값 false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "글자색(16진수 RGB, 예: \"FFFFFF\"). 생략하면 테마 글자색을 상속합니다"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "표 머리글 배열(type=table일 때 필수). 예: [\"지표\",\"Q1\",\"Q2\",\"전월 대비\"]"
"Chart type (required when type=chart): bar / line / pie": "차트 유형(type=chart일 때 필수): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "차트 범주 레이블(type=chart일 때 필수). 예: [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "데이터 시리즈(type=chart일 때 필수). 각 항목에 name(시리즈 이름)과 data(숫자 배열)가 있습니다"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "텍스트 정렬(text 요소): l(왼쪽) / ctr(가운데) / r(오른쪽)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "텍스트 상자 배경색(text 요소, 16진수 RGB, 예: \"EFF6FF\"). 비어 있으면 투명합니다"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "서식 있는 텍스트 조각(text 요소). 지정하면 Content/FontSize/Bold/Color를 무시합니다"
"Shape configuration (required when type=shape)": "도형 구성(type=shape일 때 필수)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "표 스타일(type=table일 때 선택): headerBgColor(머리글 배경색), headerFontColor(머리글 글자색), stripeColor(줄무늬 색)"
"Text content": "텍스트 내용"
"Font size in points; 0 inherits the text box default": "글꼴 크기(포인트). 0은 텍스트 상자 기본값을 상속합니다"
"Whether the text is bold": "텍스트를 굵게 표시할지 여부"
"Whether the text is italic": "텍스트를 기울임꼴로 표시할지 여부"
"Whether the text is underlined": "텍스트에 밑줄을 표시할지 여부"
"Text color, hex RGB such as \"FF6B6B\"": "글자색(16진수 RGB, 예: \"FF6B6B\")"
"Hyperlink URL; the run becomes clickable when set": "하이퍼링크 URL. 설정하면 이 조각을 클릭할 수 있습니다"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "도형 유형: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "채우기 색(16진수 RGB, 예: 2563EB). null은 채우기 없음"
"Border color (hex RGB); null means no border": "테두리 색(16진수 RGB). null은 테두리 없음"
"Text displayed inside the shape (optional)": "도형 안에 표시할 텍스트(선택)"
"Text color inside the shape (hex RGB)": "도형 안 텍스트 색상(16진수 RGB)"
"Font size of the text inside the shape (points); 0 means default": "도형 안 텍스트 글꼴 크기(포인트). 0은 기본값"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "머리글 행 배경색(16진수 RGB, 예: 2563EB). 생략하면 특별한 스타일을 적용하지 않습니다"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "머리글 행 글자색(16진수 RGB, 예: FFFFFF). 생략하면 기본값을 상속합니다"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "줄무늬 색(짝수 데이터 행 배경색, 예: EFF6FF 연한 파랑). 생략하면 줄무늬를 그리지 않습니다"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "열 고유 ID(필수). 예: \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "열 제목(필수, 20자 이내)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "열 제목 색상(선택), 16진수, 예: \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "WIP 제한(선택). 초과하면 열 제목이 빨간색이 됩니다"
"Card array (required)": "카드 배열(필수)"
"Unique card ID (required)": "카드 고유 ID(필수)"
"Card title (required, up to 40 characters)": "카드 제목(필수, 40자 이내)"
"Supplementary description (optional, up to 100 characters)": "추가 설명(선택, 100자 이내)"
"Priority (optional): high | medium | low": "우선순위(선택): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "태그 문자열 배열(선택). 예: [\"설계\",\"프런트엔드\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "마감일(선택), ISO 8601 예: \"2026-07-15\""
"Assignee name (optional)": "담당자 이름(선택)"
"Subtask checklist (optional); each item has title and done": "하위 작업 체크리스트(선택). 각 항목에 title과 done이 있습니다"
"Completion progress (optional), 0-100": "완료 진행률(선택), 0~100"
"Related link URL (optional)": "관련 링크 URL(선택)"
"Subtask title": "하위 작업 제목"
"Whether the subtask is done": "하위 작업 완료 여부"
"Unique swimlane ID (required)": "스윔레인 고유 ID(필수)"
"Swimlane title (required)": "스윔레인 제목(필수)"
"Column ID array contained in this swimlane (required)": "이 스윔레인에 포함된 열 ID 배열(필수)"
"City or place name (required), e.g. Beijing": "도시 또는 지점 이름(필수). 예: 베이징"
"Latitude (required), WGS84 decimal degrees": "위도(필수), WGS84 십진 도"
"Longitude (required), WGS84 decimal degrees": "경도(필수), WGS84 십진 도"
"Marker label text (optional); supports \\n line breaks": "마커 레이블 텍스트(선택). \\\\n으로 줄바꿈할 수 있습니다"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "마커 색상(선택), 16진수, 예: \"#E74C3C\". 생략하면 색상 체계에 따라 차례로 지정됩니다"
