"Speaker notes used as a reminder while presenting": "Notas do apresentador usadas como lembrete durante a apresentação"
"Transition animation: fade / push / wipe / zoom / split / cut": "Animação de transição: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Tipo de elemento: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Papel semântico (somente elementos text): title / subtitle / body / caption / kpi. O mecanismo de layout usa isso para posicionar o elemento automaticamente, sem necessidade de coordenadas"
"Text content (required when type=text)": "Conteúdo de texto (obrigatório quando type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Tamanho da fonte em pontos (opcional); se omitido, o mecanismo de layout escolhe um conforme o role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Indica se o texto está em negrito; padrão false"
"Whether the text is italic (optional for type=text); default false": "Indica se o texto está em itálico (opcional para type=text); padrão false"
"Whether the text is underlined (optional for type=text); default false": "Indica se o texto está sublinhado (opcional para type=text); padrão false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Cor do texto, RGB hexadecimal como \"FFFFFF\"; se omitido, herda a cor de texto do tema"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Array de cabeçalhos da tabela (obrigatório quando type=table), por exemplo [\"Métrica\",\"Q1\",\"Q2\",\"Variação\"]"
"Chart type (required when type=chart): bar / line / pie": "Tipo de gráfico (obrigatório quando type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Rótulos de categoria do gráfico (obrigatórios quando type=chart), por exemplo [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
