"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Limite ou fórmula (por exemplo 1000 ou =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Tipo de gráfico: bar / line / pie"
"Chart title (optional)": "Título do gráfico (opcional)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Array de rótulos do eixo de categorias, por exemplo [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Array de séries de dados; cada item tem name e data"
"Applied range (e.g. \"A2:A100\")": "Intervalo aplicado (por exemplo \"A2:A100\")"
"Dropdown option array": "Array de opções da lista suspensa"
"Title of this slide": "Título deste slide"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Layout do slide: title_only (somente título, para capas) / title_content (título + corpo, padrão) / two_column (duas colunas) / chart_only (gráfico em largura total) / blank (tela em branco)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Cor de fundo do slide, RGB hexadecimal como \"1F497D\"; se omitido, usa o fundo do tema"
"Slide element list; each element describes a text block, table, chart, or image": "Lista de elementos do slide; cada elemento descreve um bloco de texto, tabela, gráfico ou imagem"
