"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Gera um documento do Word (.docx) e retorna um link de download. Suporta títulos, parágrafos, listas, tabelas, imagens, quebras de página, separadores, caixas de destaque, KPIs, citações e blocos de código. O array JSON sections descreve cada seção com heading, content e elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Título do documento (até 30 caracteres), por exemplo Relatório trimestral Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Array de seções (JSON). Campos de cada seção: heading (título da seção), headingLevel (1-3, padrão 1), content (parágrafo do corpo, opcional), elements (array de elementos, opcional). Tipos de elemento: paragraph ({type,text, opcional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, opcional tableStyle}; rows é um array bidimensional em que cada linha é um array de valores de célula, por exemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Tema (opcional): chave de estilo de cartão (por exemplo enterprise-blue) ou nome integrado (blue/dark/corporate/warm/green/minimal); se omitido, usa o estilo da conversa ou o padrão da marca"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Gera uma pasta de trabalho do Excel (.xlsx) e retorna um link de download. Suporta várias planilhas, estilos de cabeçalho, larguras de coluna, formatos numéricos, formatação condicional, painéis congelados, filtros automáticos e validação de lista suspensa. O parâmetro theme aceita uma chave de estilo de cartão ou um nome integrado (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Título da pasta de trabalho (até 30 caracteres), por exemplo Relatório de receita Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Array de planilhas (JSON). Campos de cada planilha: name, headers (array de cabeçalhos), rows (array bidimensional; cada linha é um array de valores de célula, por exemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (por exemplo [12,20,15]), numberFormat (por exemplo \"#,##0.00\" ou \"yyyy-MM-dd\"), conditionalFormats (array de {range,type,color,value?}; type suporta dataBar/colorScale/greaterThan, etc.), charts (array de gráficos), freezeRows (número de linhas congeladas), autoFilter (intervalo do filtro), dropdowns (validação de lista)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Tema (opcional): chave de estilo de cartão (por exemplo enterprise-blue) ou nome integrado (blue/dark/corporate/warm/green/minimal) que controla o cabeçalho e as cores gerais; se omitido, usa o estilo da conversa ou o padrão da marca"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Gera uma apresentação do PowerPoint (.pptx) e retorna um link de download. Dois modos de entrada mutuamente exclusivos: (1) modo slides, em que a IA descreve conteúdo estruturado e o layout é gerado automaticamente; (2) modo widgetSrc, que incorpora cartões show_widget já gerados como imagens de slide. O parâmetro theme aceita uma chave de estilo de cartão (por exemplo enterprise-blue/raycast-dark/ppt-executive) ou um nome integrado (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Título da apresentação (até 30 caracteres), por exemplo Revisão trimestral Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Array de slides (JSON). Um elemento = um slide; vários = uma apresentação completa. Mutuamente exclusivo com widgetSrc. Campos de cada slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (cor hexadecimal), footer, showPageNumber (true/false), elements (lista de elementos), notes, transition. elements suporta: text (role=title/subtitle/body/kpi/caption; opcional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows é um array bidimensional em que cada linha é um array de valores de célula, por exemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; opcional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Exemplo: [{\"title\":\"Capa\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Revisão Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Equipe NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Lista de IDs de cartões show_widget separados por vírgula, por exemplo 'call_abc123,call_def456'. Mutuamente exclusivo com slides. Converte os cartões gerados em imagens de slide"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Tema (opcional): chave de estilo de cartão (por exemplo enterprise-blue/ppt-executive) ou nome integrado (blue/dark/corporate/warm/green/minimal, etc.); se omitido, usa o estilo da conversa ou o padrão da marca"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Exibe os dados como um gráfico interativo (zoom, passar o mouse, exportar como imagem). Cerca de 20 vezes mais rápido que show_widget: basta uma especificação JSON (cerca de 200 tokens) e o frontend renderiza imediatamente com ECharts. Suporta: bar, line (linha/área), pie (pizza/anel), scatter, radar, map_china (mapa de calor por província chinesa), heatmap (mapa de calor matricial), gauge, funnel e treemap. Útil para comparações numéricas, séries temporais (linha), análise de proporções e distribuição geográfica. Observação: para itinerários, eventos históricos, marcos e linhas do tempo use show_timeline; esta ferramenta não suporta o tipo timeline. Estilo visual: passe um esquema de cores por data.colors em vez de depender dos padrões do ECharts. Sugestões: cor da marca para uma única série, tons uniformemente distribuídos (10-12 cores) para várias séries, cores complementares para comparações e gradiente de cor única para tendências. Azul e dourado para finanças, azul/verde/branco para saúde e violeta/azul/ciano para tecnologia e IA. Para grandes conjuntos de dados, defina data.animation=false para reduzir o custo de renderização."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Tipo de gráfico: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Título do gráfico (até 30 caracteres), por exemplo PIB por província 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Objeto JSON; a estrutura está na descrição da ferramenta. Exemplo bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Receita\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; exemplo radar multissérie: {\"indicators\":[{\"name\":\"Velocidade\",\"max\":100},{\"name\":\"Força\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; requisito do radar: o número de indicators deve ser igual ao comprimento de cada series[i].data, e data deve conter apenas números"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Obtém os detalhes do usuário conectado, incluindo nome de usuário, nome de exibição, e-mail, celular, código, funções, departamento, sexo, idade, aniversário e observações, além do endereço IP do visitante, cidade e localização geográfica detalhada"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Pesquisa esquemas de tabelas de banco de dados por palavra-chave. O resultado tem duas partes: (1) uma correspondência tabela-conexão (tabela Markdown que indica a qual conexão cada tabela pertence; tabelas com o mesmo nome em conexões diferentes são listadas separadamente); (2) o XML do esquema das tabelas de cada conexão. As chamadas posteriores a run_sql devem usar o nome de conexão indicado na tabela de correspondência"
"Search keywords, separated by commas or spaces": "Palavras-chave de pesquisa, separadas por vírgulas ou espaços"
"Restrict to a connection name; empty searches all connections": "Restringir a um nome de conexão; vazio pesquisa todas as conexões"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Executa uma instrução SQL na conexão de banco de dados indicada. Consultas SELECT/WITH retornam linhas; instruções que não são consultas, como INSERT/UPDATE/DELETE, retornam o número de linhas afetadas. connName deve corresponder à coluna de conexão retornada por search_table"
"Database connection name (from the connection column of search_table)": "Nome da conexão de banco de dados (da coluna de conexão de search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Instrução SQL. SELECT/WITH retorna um conjunto de resultados; instruções que não são consultas retornam o número de linhas afetadas"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Consulta a data do calendário lunar, o termo solar e o status de trabalho (dia útil/feriado/dia de compensação) de uma data"
"Date to query in yyyy-MM-dd format. Defaults to today": "Data a consultar no formato yyyy-MM-dd. Padrão hoje"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Exibe uma lista de tarefas como um quadro kanban de várias colunas (por exemplo A fazer -> Em andamento -> Concluído). Adequado para decomposição de projetos, planejamento de sprint, exibição de fluxo de trabalho e classificação de estados de tarefa. Cada coluna pode ter um marcador de cor e um limite WIP; cada cartão pode ter título, descrição, prioridade, tags, data de vencimento, responsável, checklist, progresso e link. Dois layouts: board (quadro multicoluna padrão) e swimlane (colunas agrupadas por equipe ou módulo)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Título do quadro (até 30 caracteres), por exemplo Quadro Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Array JSON de definições de colunas. Exemplo: [{\"id\":\"todo\",\"title\":\"A fazer\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Análise de requisitos\",\"description\":\"Coletar requisitos do usuário\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Entrevistar usuários\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Todos os campos exceto id e title são opcionais"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Modo de layout: board (quadro multicoluna padrão) ou swimlane (colunas agrupadas por equipe ou módulo; o parâmetro swimlanes é obrigatório)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Array JSON de definições de raias (usado quando layout=swimlane). Exemplo: [{\"id\":\"sl1\",\"title\":\"Equipe frontend\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Equipe backend\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Marca pontos de coordenadas (cidades ou POIs) ou destaca províncias num mapa da China, gera um mapa SVG anotado e o renderiza na bolha de chat. Suporta: (1) preenchimento de províncias com cores personalizadas; (2) marcadores WGS84 de latitude/longitude com texto de rótulo; (3) legenda automática no canto inferior direito. Usos típicos: distribuição de dados por província, localização de cidades e mapas de calor de vendas regionais."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Título do mapa (até 30 caracteres), por exemplo PIB por província 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Array JSON de marcadores (pode ser um array vazio []). Formato: [{\"name\":\"Pequim\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Pequim\\n4376 bi\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng são graus decimais WGS84; color/size são opcionais"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Array JSON de destaques de províncias (pode ser um array vazio []). Formato: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"Nº 1 PIB\"}]. name aceita o nome chinês da província (completo ou abreviado); label é opcional"
"Legend title (optional), e.g. GDP scale": "Título da legenda (opcional), por exemplo Escala do PIB"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Esquema de cores (opcional): blue/orange/green/purple/red; padrão blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Estilo do marcador (opcional): circle/pin/square; padrão circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Exibe hierarquias de conhecimento ou relações conceituais como um mapa mental interativo recolhível. A entrada é um esboço Markdown (# / ## / ###) que o frontend converte em árvore visual. Útil para organizar conhecimento, decompor conceitos, comparar tecnologias, avaliar opções e resumir conteúdo. Estilo visual: escolha branchColors (3-8 cores coordenadas), maxDepth (complexidade) e collapsed (recolhido inicialmente para focar) conforme o tema. Cores frias (azul/violeta/ciano) para tecnologia e dados, quentes (laranja/ouro/vermelho) para negócios e marketing, e verdes para natureza e saúde. Para nós densos, defina maxDepth=2 para manter a legibilidade. 6 layouts: tree (árvore recuada padrão, uso geral) / radial (radial esquerda-direita, ideal para mapas de conhecimento) / lr (do centro para a direita, fluxogramas/árvores de decisão) / rl (do centro para a esquerda, rastreamento reverso) / tb (do centro para baixo, organogramas) / bt (do centro para cima, hierarquia ascendente)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Título do mapa mental (até 30 caracteres), por exemplo Pilha tecnológica de IA"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Esboço Markdown usando # / ## / ### para os níveis 1 a 3. Exemplo:\n# Inteligência artificial\n## Aprendizado de máquina\n### Aprendizado supervisionado\n### Aprendizado não supervisionado\n## Aprendizado profundo\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Modo de layout: tree (árvore recuada padrão, uso geral) / radial (radial esquerda-direita, ideal para mapas de conhecimento) / lr (do centro para a direita, fluxogramas/árvores de decisão) / rl (do centro para a esquerda, rastreamento reverso) / tb (do centro para baixo, organogramas) / bt (do centro para cima, hierarquia ascendente)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Array JSON de cores de ramo, por exemplo [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3 a 8 cores hexadecimais atribuídas em ordem aos ramos de primeiro nível. Se omitido, usa a paleta padrão azul/violeta, verde, amarelo, vermelho, azul-céu, verde-escuro, laranja, violeta"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Array JSON de IDs de nós recolhidos inicialmente, por exemplo [\"n2\",\"n5\"]. Vazio expande tudo. Serve para focar nos ramos principais"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Profundidade visível máxima: 1 = apenas ramos de primeiro nível, 2 = dois níveis, ilimitada por padrão. Para nós densos, defina 2 para manter a legibilidade"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Exibe dados temporais como cartões de linha do tempo atraentes. Basta JSON (cerca de 100 tokens) e o frontend renderiza instantaneamente. Útil para marcos de projeto, eventos históricos, planos de versão e histórico de desenvolvimento. Cada evento pode ter data, título, descrição, cor e categoria. Estilo visual: defina uma paleta global pelo parâmetro palette (por exemplo gradiente azul-violeta, bronze quente, cores da marca) para uma ambientação coerente; item.color sobrescreve um item individual. Use density=relaxed para 5 eventos ou menos e density=compact para 10 ou mais. 8 layouts: vertical (5-20 itens) / alternating-top (alternando acima, ordem inversa) / alternating-bottom (alternando abaixo, ordem cronológica) / horizontal-left (horizontal para a esquerda, ordem inversa) / horizontal-right (horizontal para a direita, ordem cronológica) / s-curve (caminho em S, 8 itens ou menos) / fishbone-left (espinha de peixe à esquerda, ordem inversa) / fishbone-right (espinha de peixe à direita, ordem cronológica)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Título da linha do tempo (até 30 caracteres), por exemplo Marcos do produto"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Array JSON de eventos da linha do tempo. Exemplo: [{\"date\":\"2024-01\",\"title\":\"Lançamento v1.0\",\"description\":\"Recursos principais no ar\",\"color\":\"#5470c6\",\"category\":\"Marco\"}]. description/color/category são opcionais"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Modo de layout: vertical / alternating-top (alternando acima, ordem inversa) / alternating-bottom (alternando abaixo, cronológica) / horizontal-left (horizontal, ordem inversa) / horizontal-right (horizontal, cronológica) / s-curve / fishbone-left (espinha de peixe, ordem inversa) / fishbone-right (espinha de peixe, cronológica)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Array JSON de paleta global, por exemplo [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Substitui a rotação padrão de 8 cores. item.color tem prioridade"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Espaçamento dos itens: compact (12px) / normal (20px, padrão) / relaxed (32px). relaxed convém a 5 eventos ou menos; compact a 10 ou mais"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Exibe um fragmento SVG ou HTML dentro da bolha de chat. Use para linhas do tempo e diagramas de relacionamento (SVG), prévias de formulário e cartões de dados (HTML) e gráficos estatísticos (SVG). Não use para diagramas Mermaid; produza Mermaid como bloco de código ```mermaid na resposta. Limites: 200 KB ou menos; <script src=...> apenas de CDNs confiáveis. Estilo visual: escolha a arquitetura de informação (Bento/fluxo de cartões/Grid), a hierarquia tipográfica e o sistema de cores conforme o tema. Tons frios sem serifa para discussões técnicas, cores neutras com números destacados para relatórios de negócios e gradientes/glassmorphism/microanimações para criatividade. Sempre defina font-family e color explicitamente; não dependa dos padrões do navegador."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Título do widget (até 30 caracteres), por exemplo Fluxo de status do pedido"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "O SVG deve começar com <svg; fragmentos HTML devem começar pelo elemento raiz e não incluir <html><body>. Máximo 200 KB; <script src=...> apenas de CDNs confiáveis. Não passe sintaxe Mermaid (flowchart/graph/sequenceDiagram, etc.); produza Mermaid como bloco de código ```mermaid na resposta"
"Placeholder text shown while loading (optional)": "Texto de espaço reservado exibido durante o carregamento (opcional)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Indicação de tema: light / dark / auto (seguir o sistema). O HTML gerado deve escolher as cores de fundo e de texto de acordo; não é passado ao renderizador do frontend"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Altura inicial do widget em px (80-1200). Padrão 480. Use 300-400 para cartões compactos e 600-800 para gráficos grandes"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Modo de fundo: solid (padrão) / transparent (para sobrepor capturas de tela a um modelo de PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Modo slide de PPT. Se true, o cartão é renderizado em proporção 16:9, pronto para colar numa apresentação. Padrão false, que mantém a largura adaptada ao conteúdo"
"Section heading text, e.g. Completed this week": "Texto do cabeçalho da seção, por exemplo Concluído esta semana"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Nível de cabeçalho: 1 = nível 1 (maior), 2 = nível 2, 3 = nível 3; padrão 1"
"Body paragraph text (optional; used together with elements)": "Texto do parágrafo do corpo (opcional; usado junto com elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Array de elementos estruturados (opcional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Tipo de elemento: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Conteúdo de texto (usado quando type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Array de itens de lista (usado quando type=bullet_list ou ordered_list)"
"Table header row (required when type=table)": "Linha de cabeçalho da tabela (obrigatória quando type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Linhas de dados da tabela (obrigatórias quando type=table); cada linha é um array de valores de célula, por exemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Estilo da tabela (opcional para type=table): headerBgColor (fundo do cabeçalho), headerFontColor (cor do texto do cabeçalho), stripeColor (linhas alternadas)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL da imagem (obrigatória quando type=image); suporta links externos https:// ou anexos internos como /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Largura da imagem em centímetros (type=image); padrão 14 cm"
"Image height in centimeters (type=image); default 10cm": "Altura da imagem em centímetros (type=image); padrão 10 cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Indica se o texto está em negrito (opcional para type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Indica se o texto está em itálico (opcional para type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Indica se o texto está sublinhado (opcional para type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Tamanho da fonte em pontos, por exemplo 12 (opcional para type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Cor do texto (RGB hexadecimal, por exemplo 2563EB; opcional para type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Alinhamento do texto: left/center/right/justify (opcional para type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Cor de fundo do parágrafo (RGB hexadecimal, por exemplo EFF6FF; opcional para type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Variante da caixa de destaque (type=callout): info (azul) / success (verde) / warning (amarelo) / danger (vermelho); padrão info"
"KPI value (required when type=kpi), e.g. 17.68M": "Valor do KPI (obrigatório quando type=kpi), por exemplo 17,68 mi"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Rótulo do KPI (opcional quando type=kpi), por exemplo crescimento mês a mês"
"KPI trend (optional when type=kpi): up / down / flat": "Tendência do KPI (opcional quando type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Fonte da citação (opcional quando type=quote), por exemplo Relatório anual 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Linguagem do código (opcional quando type=code), por exemplo sql/python/javascript; seleciona as cores de realce de sintaxe"
"Worksheet name, e.g. Q2 Data": "Nome da planilha, por exemplo Dados Q2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Array de cabeçalhos de coluna, por exemplo [\"Data\",\"Receita\",\"Variação\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Linhas de dados (array bidimensional); cada linha é um array de valores de célula, por exemplo [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Estilo do cabeçalho (opcional): headerBgColor (fundo do cabeçalho), headerFontColor (cor do texto do cabeçalho), stripeColor (linhas alternadas)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Array de larguras de coluna (opcional), por exemplo [12, 20, 15]; os valores são larguras aproximadas em caracteres"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Formato numérico (opcional), por exemplo \"#,##0.00\" ou \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Array de formatações condicionais (opcional). Campos de cada item: range (por exemplo \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (cor principal), value (limite)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Array de definições de gráficos (opcional): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Número de linhas superiores congeladas (0 = nenhuma, 1 = congelar a primeira linha; padrão 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Intervalo do filtro automático (por exemplo \"A1:E1\"); desativado se vazio"
"Dropdown validation array (optional)": "Array de validações de lista suspensa (opcional)"
"Applied range (e.g. \"C2:C10\")": "Intervalo aplicado (por exemplo \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Tipo de condição: dataBar / colorScale / greaterThan / lessThan / equal / between"
