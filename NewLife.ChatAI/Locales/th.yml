"Invalid parameter: sections cannot be empty": "พารามิเตอร์ไม่ถูกต้อง: sections ต้องไม่ว่างเปล่า"
"Invalid parameter: sheets cannot be empty": "พารามิเตอร์ไม่ถูกต้อง: sheets ต้องไม่ว่างเปล่า"
"MCP tool not found: '{0}'": "ไม่พบเครื่องมือ MCP: '{0}'"
"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "สร้างเอกสาร Word (.docx) และส่งคืนลิงก์ดาวน์โหลด รองรับหัวเรื่อง ย่อหน้า รายการ ตาราง รูปภาพ ตัวแบ่งหน้า เส้นคั่น กล่องไฮไลต์ การ์ด KPI คำอธิบายอ้างอิง และบล็อกโค้ด อาร์เรย์ JSON ชื่อ sections อธิบายแต่ละส่วนด้วย heading, content และ elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "ชื่อเอกสาร (ไม่เกิน 30 อักขระ) เช่น รายงานไตรมาส 2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "อาร์เรย์ของส่วน (JSON) ฟิลด์ของแต่ละส่วน: heading (ชื่อส่วน), headingLevel (1-3 ค่าเริ่มต้น 1), content (ย่อหน้าข้อความ ไม่บังคับ), elements (อาร์เรย์ขององค์ประกอบ ไม่บังคับ) ชนิดองค์ประกอบ: paragraph ({type,text,ไม่บังคับ bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,ไม่บังคับ tableStyle}; rows เป็นอาร์เรย์สองมิติ แต่ละแถวเป็นอาร์เรย์ค่าเซลล์ เช่น [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "ธีม (ไม่บังคับ): คีย์สไตล์การ์ด (เช่น enterprise-blue) หรือชื่อในตัว (blue/dark/corporate/warm/green/minimal) หากไม่ระบุจะใช้สไตล์การสนทนาหรือค่าเริ่มต้นของแบรนด์"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "สร้างสมุดงาน Excel (.xlsx) และส่งคืนลิงก์ดาวน์โหลด รองรับหลายชีต สไตล์หัวตาราง ความกว้างคอลัมน์ รูปแบบตัวเลข การจัดรูปแบบตามเงื่อนไข การตรึงบานหน้าต่าง การกรองอัตโนมัติ และการตรวจสอบความถูกต้องแบบรายการเลื่อนลง พารามิเตอร์ theme รับคีย์สไตล์การ์ดหรือชื่อในตัว (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "ชื่อสมุดงาน (ไม่เกิน 30 อักขระ) เช่น รายงานรายได้ไตรมาส 2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "อาร์เรย์ของชีต (JSON) ฟิลด์ของแต่ละชีต: name, headers (อาร์เรย์หัวตาราง), rows (อาร์เรย์สองมิติ แต่ละแถวเป็นอาร์เรย์ค่าเซลล์ เช่น [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (เช่น [12,20,15]), numberFormat (เช่น \"#,##0.00\" หรือ \"yyyy-MM-dd\"), conditionalFormats (อาร์เรย์ {range,type,color,value?}; type รองรับ dataBar/colorScale/greaterThan และอื่น ๆ), charts (อาร์เรย์แผนภูมิ), freezeRows (จำนวนแถวที่ตรึง), autoFilter (ช่วงการกรอง) และ dropdowns (การตรวจสอบรายการเลื่อนลง)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "ธีม (ไม่บังคับ): คีย์สไตล์การ์ด (เช่น enterprise-blue) หรือชื่อในตัว (blue/dark/corporate/warm/green/minimal) ที่ควบคุมหัวตารางและสีโดยรวม หากไม่ระบุจะใช้สไตล์การสนทนาหรือค่าเริ่มต้นของแบรนด์"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "สร้างงานนำเสนอ PowerPoint (.pptx) และส่งคืนลิงก์ดาวน์โหลด โหมดอินพุตสองแบบที่ใช้ร่วมกันไม่ได้: (1) โหมด slides ซึ่ง AI อธิบายเนื้อหาแบบมีโครงสร้างและสร้างเค้าโครงอัตโนมัติ; (2) โหมด widgetSrc ที่ฝังการ์ด show_widget ที่สร้างไว้แล้วเป็นภาพสไลด์ พารามิเตอร์ theme รับคีย์สไตล์การ์ด (เช่น enterprise-blue/raycast-dark/ppt-executive) หรือชื่อในตัว (blue/dark/green/warm/corporate/minimal)"
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "ชื่องานนำเสนอ (ไม่เกิน 30 อักขระ) เช่น ทบทวนไตรมาส 2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "อาร์เรย์สไลด์ (JSON) หนึ่งองค์ประกอบ = หนึ่งสไลด์ หลายองค์ประกอบ = งานนำเสนอเต็ม ใช้ร่วมกับ widgetSrc ไม่ได้ ฟิลด์ของแต่ละสไลด์: title, layout (title_only/title_content/two_column/chart_only/blank), background (สีฐานสิบหก), footer, showPageNumber (true/false), elements (รายการองค์ประกอบ), notes และ transition elements รองรับ: text (role=title/subtitle/body/kpi/caption; ไม่บังคับ bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows อาร์เรย์สองมิติ แต่ละแถวเป็นอาร์เรย์ค่าเซลล์ เช่น [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; ไม่บังคับ tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}) ตัวอย่าง: [{\"title\":\"หน้าปก\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"ทบทวนไตรมาส 2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"ทีม NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "รายการ ID การ์ด show_widget คั่นด้วยจุลภาค เช่น 'call_abc123,call_def456' ใช้ร่วมกับ slides ไม่ได้ แปลงการ์ดที่สร้างไว้เป็นภาพสไลด์"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "ธีม (ไม่บังคับ): คีย์สไตล์การ์ด (เช่น enterprise-blue/ppt-executive) หรือชื่อในตัว (blue/dark/corporate/warm/green/minimal และอื่น ๆ) หากไม่ระบุจะใช้สไตล์การสนทนาหรือค่าเริ่มต้นของแบรนด์"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "แสดงข้อมูลเป็นแผนภูมิแบบโต้ตอบ (ซูม วางเมาส์ ส่งออกเป็นรูปภาพ) เร็วกว่า show_widget ประมาณ 20 เท่า: ใช้ข้อกำหนด JSON (ประมาณ 200 โทเคน) ก็เพียงพอ และหน้าบ้านวาดทันทีด้วย ECharts รองรับ: bar, line (เส้น/พื้นที่), pie (วงกลม/โดนัท), scatter, radar, map_china (แผนที่ความร้อนรายจังหวัดของจีน), heatmap (แผนที่ความร้อนแบบเมทริกซ์), gauge, funnel, treemap เหมาะสำหรับการเปรียบเทียบตัวเลข อนุกรมเวลา (เส้น) การวิเคราะห์สัดส่วน และการกระจายเชิงภูมิศาสตร์ หมายเหตุ: สำหรับเส้นทาง เหตุการณ์ทางประวัติศาสตร์ หมุดหมาย และไทม์ไลน์ ให้ใช้ show_timeline เพราะเครื่องมือนี้ไม่รองรับชนิด timeline สไตล์ภาพ: ส่งชุดสีผ่าน data.colors แทนการพึ่งค่าเริ่มต้นของ ECharts คำแนะนำ: สีแบรนด์สำหรับอนุกรมเดียว เฉดสีที่เว้นระยะเท่ากัน (10-12 สี) สำหรับหลายอนุกรม สีเสริมสำหรับการเปรียบเทียบ ไล่ระดับสีเดียวสำหรับแนวโน้ม สีน้ำเงินและทองสำหรับการเงิน สีน้ำเงิน/เขียว/ขาวสำหรับสุขภาพ สีม่วง/น้ำเงิน/ฟ้าเทอร์ควอยซ์สำหรับเทคโนโลยีและ AI สำหรับชุดข้อมูลขนาดใหญ่ให้ตั้ง data.animation=false เพื่อลดต้นทุนการแสดงผล"
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "ชนิดแผนภูมิ: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "ชื่อแผนภูมิ (ไม่เกิน 30 อักขระ) เช่น GDP รายจังหวัด ปี 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "ออบเจกต์ JSON โครงสร้างอธิบายไว้ในคำอธิบายเครื่องมือ ตัวอย่าง bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"รายได้\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; ตัวอย่าง radar หลายอนุกรม: {\"indicators\":[{\"name\":\"ความเร็ว\",\"max\":100},{\"name\":\"พลัง\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; เงื่อนไข radar: จำนวน indicators ต้องเท่ากับความยาวของแต่ละ series[i].data และ data ต้องมีเฉพาะตัวเลข"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "ส่งคืนข้อมูลของผู้ใช้ที่เข้าสู่ระบบ รวมถึงชื่อผู้ใช้ ชื่อที่แสดง อีเมล มือถือ รหัส บทบาท แผนก เพศ อายุ วันเกิด และหมายเหตุ พร้อมที่อยู่ IP เมือง และตำแหน่งทางภูมิศาสตร์โดยละเอียดของผู้เยี่ยมชม"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "ค้นหาโครงสร้างตารางฐานข้อมูลด้วยคีย์เวิร์ด ผลลัพธ์มีสองส่วน: (1) แผนที่ตาราง-การเชื่อมต่อ (ตาราง Markdown ที่แสดงว่าตารางใดอยู่ในการเชื่อมต่อใด ตารางชื่อเดียวกันในการเชื่อมต่อต่างกันจะแสดงแยกกัน); (2) โครงสร้าง XML ของตารางสำหรับแต่ละการเชื่อมต่อ การเรียก run_sql ในภายหลังต้องใช้ชื่อการเชื่อมต่อจากตารางแผนที่"
"Search keywords, separated by commas or spaces": "คีย์เวิร์ดค้นหา คั่นด้วยจุลภาคหรือช่องว่าง"
"Restrict to a connection name; empty searches all connections": "จำกัดตามชื่อการเชื่อมต่อ ว่างหมายถึงค้นหาในการเชื่อมต่อทั้งหมด"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "เรียกใช้คำสั่ง SQL บนการเชื่อมต่อฐานข้อมูลที่ระบุ คำสั่ง SELECT/WITH ส่งคืนแถว คำสั่งที่ไม่ใช่คำสั่งสอบถาม เช่น INSERT/UPDATE/DELETE ส่งคืนจำนวนแถวที่ได้รับผลกระทบ connName ต้องตรงกับคอลัมน์การเชื่อมต่อที่ search_table ส่งคืน"
"Database connection name (from the connection column of search_table)": "ชื่อการเชื่อมต่อฐานข้อมูล (จากคอลัมน์การเชื่อมต่อของ search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "คำสั่ง SQL SELECT/WITH ส่งคืนชุดผลลัพธ์ คำสั่งที่ไม่ใช่คำสั่งสอบถามส่งคืนจำนวนแถวที่ได้รับผลกระทบ"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "ค้นหาวันที่ตามปฏิทินจันทรคติ คำศัพท์สุริยคติ และสถานะวันทำการ (วันทำการ/วันหยุด/วันชดเชย) สำหรับวันที่ที่ระบุ"
"Date to query in yyyy-MM-dd format. Defaults to today": "วันที่ที่ต้องการในรูปแบบ yyyy-MM-dd ค่าเริ่มต้นคือวันนี้"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "แสดงงานเป็นบอร์ด Kanban หลายคอลัมน์ (เช่น ต้องทำ -> กำลังทำ -> เสร็จแล้ว) เหมาะสำหรับการแบ่งเฟสโปรเจกต์ การวางแผน Sprint การแสดงเวิร์กโฟลว์ และการจัดประเภทสถานะงาน แต่ละคอลัมน์มีป้ายสีและขีดจำกัด WIP ได้ แต่ละการ์ดมีชื่อเรื่อง คำอธิบาย ลำดับความสำคัญ แท็ก กำหนดส่ง ผู้รับผิดชอบ รายการงานย่อย ความคืบหน้า และลิงก์ได้ สองเค้าโครง: board (บอร์ดหลายคอลัมน์ค่าเริ่มต้น) และ swimlane (คอลัมน์จัดกลุ่มตามทีมหรือหน่วยงาน)"
"Board title (up to 30 characters), e.g. Sprint 1 Board": "ชื่อบอร์ด (ไม่เกิน 30 อักขระ) เช่น บอร์ด Sprint 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "อาร์เรย์ JSON ของคำจำกัดความคอลัมน์ ตัวอย่าง: [{\"id\":\"todo\",\"title\":\"ต้องทำ\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"วิเคราะห์ความต้องการ\",\"description\":\"รวบรวมความต้องการของผู้ใช้\",\"priority\":\"high\",\"tags\":[\"ออกแบบ\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"สัมภาษณ์ผู้ใช้\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}] ฟิลด์ทั้งหมดยกเว้น id และ title เป็นทางเลือก"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "โหมดเค้าโครง: board (บอร์ดหลายคอลัมน์ค่าเริ่มต้น) หรือ swimlane (คอลัมน์จัดกลุ่มตามทีมหรือหน่วยงาน ต้องมีพารามิเตอร์ swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "อาร์เรย์ JSON ของคำจำกัดความเลน (ใช้เมื่อ layout=swimlane) ตัวอย่าง: [{\"id\":\"sl1\",\"title\":\"ทีมหน้าบ้าน\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"ทีมหลังบ้าน\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "ทำเครื่องหมายจุดพิกัด (เมืองหรือ POI) หรือเน้นจังหวัดบนแผนที่จีน สร้างแผนที่ SVG พร้อมคำอธิบาย และแสดงในบับเบิลแชต รองรับ: (1) ระบายสีจังหวัดแบบกำหนดเอง; (2) หมุด WGS84 พร้อมละติจูด ลองจิจูด และข้อความป้าย; (3) คำอธิบายอัตโนมัติที่มุมขวาล่าง การใช้งานทั่วไป: การกระจายข้อมูลรายจังหวัด ตำแหน่งเมือง แผนที่ความร้อนยอดขายตามภูมิภาค"
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "ชื่อแผนที่ (ไม่เกิน 30 อักขระ) เช่น GDP รายจังหวัด ปี 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "อาร์เรย์ JSON ของหมุด (อาจเป็นอาร์เรย์ว่าง []) รูปแบบ: [{\"name\":\"ปักกิ่ง\",\"lat\":39.9,\"lng\":116.4,\"label\":\"ปักกิ่ง\\n4376 พันล้าน\",\"color\":\"#E74C3C\",\"size\":8}] lat/lng เป็นองศาทศนิยม WGS84; color/size ไม่บังคับ"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "อาร์เรย์ JSON ของการเน้นจังหวัด (อาจเป็นอาร์เรย์ว่าง []) รูปแบบ: [{\"name\":\"กวางตุ้ง\",\"color\":\"#FFB347\",\"label\":\"GDP อันดับหนึ่ง\"}] name รับชื่อจังหวัดภาษาจีน (เต็มหรือย่อ); label ไม่บังคับ"
"Legend title (optional), e.g. GDP scale": "ชื่อคำอธิบาย (ไม่บังคับ) เช่น มาตรวัด GDP"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "ชุดสี (ไม่บังคับ): blue/orange/green/purple/red ค่าเริ่มต้น blue"
"Marker style (optional): circle/pin/square; defaults to circle": "รูปทรงหมุด (ไม่บังคับ): circle/pin/square ค่าเริ่มต้น circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "แสดงลำดับชั้นของความรู้หรือความสัมพันธ์ระหว่างแนวคิดเป็นแผนที่ความคิดแบบโต้ตอบที่พับได้ อินพุตเป็นโครงร่าง Markdown (# / ## / ###) ที่หน้าบ้านแปลงเป็นโครงสร้างต้นไม้ รองรับการจัดระเบียบความรู้ การแยกส่วนแนวคิด การเปรียบเทียบเทคโนโลยี การประเมินทางเลือก และการสรุปเนื้อหา สไตล์ภาพ: เลือก branchColors (3-8 สีที่กลมกลืน) maxDepth (ความซับซ้อน) และ collapsed (พับเริ่มต้นเพื่อโฟกัส) ตามหัวข้อ ใช้สีโทนเย็น (น้ำเงิน/ม่วง/ฟ้าเทอร์ควอยซ์) สำหรับเทคโนโลยีและข้อมูล สีโทนร้อน (ส้ม/ทอง/แดง) สำหรับธุรกิจและการตลาด สีเขียวสำหรับธรรมชาติและสุขภาพ สำหรับโหนดที่หนาแน่นให้ตั้ง maxDepth=2 เพื่อคงความอ่านง่าย 6 เค้าโครง: tree (ค่าเริ่มต้น ต้นไม้หยัก ทั่วไป) / radial (แผ่ซ้าย-ขวา เหมาะที่สุดกับแผนที่ความรู้) / lr (จากศูนย์กลางไปขวา แผนผังขั้นตอน/ต้นไม้ตัดสินใจ) / rl (จากศูนย์กลางไปซ้าย การติดตามย้อนกลับ) / tb (จากศูนย์กลางลงล่าง แผนผังองค์กร) / bt (จากศูนย์กลางขึ้นบน ลำดับชั้นจากล่างขึ้นบน)"
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "ชื่อแผนที่ความคิด (ไม่เกิน 30 อักขระ) เช่น สแตกเทคโนโลยี AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "โครงร่าง Markdown ด้วย # / ## / ### สำหรับระดับ 1-3 ตัวอย่าง:\n# ปัญญาประดิษฐ์\n## การเรียนรู้ของเครื่อง\n### การเรียนรู้แบบมีผู้สอน\n### การเรียนรู้แบบไม่มีผู้สอน\n## การเรียนรู้เชิงลึก\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "โหมดเค้าโครง: tree (ค่าเริ่มต้น ต้นไม้หยัก ทั่วไป) / radial (แผ่ซ้าย-ขวา เหมาะที่สุดกับแผนที่ความรู้) / lr (จากศูนย์กลางไปขวา แผนผังขั้นตอน/ต้นไม้ตัดสินใจ) / rl (จากศูนย์กลางไปซ้าย การติดตามย้อนกลับ) / tb (จากศูนย์กลางลงล่าง แผนผังองค์กร) / bt (จากศูนย์กลางขึ้นบน ลำดับชั้นจากล่างขึ้นบน)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "อาร์เรย์ JSON ของสีกิ่ง เช่น [\"#3b82f6\",\"#10b981\",\"#f59e0b\"] กำหนดสีฐานสิบหก 3-8 สีตามลำดับให้กิ่งระดับแรก หากไม่ระบุจะใช้ชุดสีเริ่มต้น น้ำเงิน/ม่วง เขียว เหลือง แดง ฟ้าเทอร์ควอยซ์ เขียวเข้ม ส้ม และม่วง"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "อาร์เรย์ JSON ของ ID โหนดที่พับไว้เริ่มต้น เช่น [\"n2\",\"n5\"] ว่างหมายถึงขยายทั้งหมด ใช้เพื่อโฟกัสที่กิ่งสำคัญ"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "ความลึกที่แสดงสูงสุด: 1 = เฉพาะกิ่งระดับแรก, 2 = สองระดับ, ค่าเริ่มต้นไม่จำกัด สำหรับโหนดที่หนาแน่นให้ตั้ง 2 เพื่อคงความอ่านง่าย"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "แสดงข้อมูลอนุกรมเวลาเป็นการ์ดไทม์ไลน์ที่สวยงาม ใช้ JSON (ประมาณ 100 โทเคน) ก็เพียงพอและหน้าบ้านแสดงทันที เหมาะสำหรับหมุดหมายโปรเจกต์ เหตุการณ์ทางประวัติศาสตร์ แผนการเผยแพร่ และประวัติการพัฒนา แต่ละเหตุการณ์มีวันที่ ชื่อเรื่อง คำอธิบาย สี และหมวดหมู่ได้ สไตล์ภาพ: กำหนดชุดสีโดยรวมผ่านพารามิเตอร์ palette (เช่น ไล่ระดับน้ำเงิน-ม่วง บรอนซ์โทนร้อน สีแบรนด์) เพื่อให้ไทม์ไลน์มีลักษณะสอดคล้องกัน; item.color แทนที่รายการเดี่ยว ใช้ density=relaxed สำหรับห้าเหตุการณ์ที่คัดสรรหรือน้อยกว่า และ density=compact สำหรับสิบหรือมากกว่า 8 เค้าโครง: vertical (5-20 รายการ) / alternating-top (สลับบน ย้อนลำดับเวลา) / alternating-bottom (สลับล่าง ตามลำดับเวลา) / horizontal-left (แนวนอนไปซ้าย ย้อนกลับ) / horizontal-right (แนวนอนไปขวา ตามลำดับเวลา) / s-curve (เส้นโค้ง S, 8 รายการหรือน้อยกว่า) / fishbone-left (ก้างปลาไปซ้าย ย้อนกลับ) / fishbone-right (ก้างปลาไปขวา ตามลำดับเวลา)"
"Timeline title (up to 30 characters), e.g. Product Milestones": "ชื่อไทม์ไลน์ (ไม่เกิน 30 อักขระ) เช่น หมุดหมายผลิตภัณฑ์"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "อาร์เรย์ JSON ของเหตุการณ์ไทม์ไลน์ ตัวอย่าง: [{\"date\":\"2024-01\",\"title\":\"เผยแพร่ v1.0\",\"description\":\"เปิดตัวฟีเจอร์หลัก\",\"color\":\"#5470c6\",\"category\":\"หมุดหมาย\"}] description/color/category ไม่บังคับ"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "โหมดเค้าโครง: vertical / alternating-top (สลับบน ย้อนกลับ) / alternating-bottom (สลับล่าง ตามลำดับเวลา) / horizontal-left (แนวนอน ย้อนกลับ) / horizontal-right (แนวนอน ตามลำดับเวลา) / s-curve / fishbone-left (ก้างปลา ย้อนกลับ) / fishbone-right (ก้างปลา ตามลำดับเวลา)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "อาร์เรย์ JSON ของชุดสีโดยรวม เช่น [\"#3b82f6\",\"#10b981\",\"#f59e0b\"] แทนที่การวนซ้ำแปดสีเริ่มต้น item.color มีลำดับความสำคัญกว่า"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "ระยะห่างรายการ: compact (12px) / normal (20px ค่าเริ่มต้น) / relaxed (32px) relaxed เหมาะกับห้าเหตุการณ์ที่คัดสรรหรือน้อยกว่า; compact สำหรับสิบหรือมากกว่า"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "แสดงส่วน SVG หรือ HTML ภายในบับเบิลแชต ใช้สำหรับไทม์ไลน์และแผนภาพความสัมพันธ์ (SVG) การแสดงตัวอย่างฟอร์มและการ์ดข้อมูล (HTML) กราฟิกสถิติ (SVG) อย่าใช้กับแผนภูมิ Mermaid ให้ส่งออก Mermaid เป็นบล็อกโค้ด ```mermaid ในคำตอบ ข้อจำกัด: ไม่เกิน 200 KB; <script src=...> จาก CDN ที่เชื่อถือได้เท่านั้น สไตล์ภาพ: เลือกสถาปัตยกรรมสารสนเทศ (Bento/การไหลของการ์ด/Grid) ลำดับชั้นตัวอักษร และระบบสีตามหัวข้อ โทนเย็นไม่มีมุมสำหรับการอภิปรายทางเทคนิค สีกลางพร้อมตัวเลขเด่นสำหรับรายงานธุรกิจ ไล่ระดับ/เอฟเฟกต์กระจก/แอนิเมชันละเอียดสำหรับงานสร้างสรรค์ ระบุ font-family และ color อย่างชัดเจนเสมอ อย่าพึ่งสไตล์เริ่มต้นของเบราว์เซอร์"
"Widget title (up to 30 characters), e.g. Order Status Flow": "ชื่อวิดเจ็ต (ไม่เกิน 30 อักขระ) เช่น การไหลของสถานะคำสั่งซื้อ"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG ต้องเริ่มด้วย <svg; ส่วน HTML ต้องเริ่มด้วยองค์ประกอบรากและต้องไม่มี <html><body> ไม่เกิน 200 KB; <script src=...> จาก CDN ที่เชื่อถือได้เท่านั้น อย่าส่งไวยากรณ์ Mermaid (flowchart/graph/sequenceDiagram และอื่น ๆ) ให้ส่งออก Mermaid เป็นบล็อกโค้ด ```mermaid ในคำตอบ"
"Placeholder text shown while loading (optional)": "ข้อความตัวอย่างที่แสดงระหว่างโหลด (ไม่บังคับ)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "คำใบ้ธีม: light / dark / auto (ตามระบบ) HTML ที่สร้างควรเลือกสีพื้นหลังและสีข้อความให้สอดคล้อง ไม่ส่งต่อไปยังตัวแสดงผลหน้าบ้าน"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "ความสูงเริ่มต้นของวิดเจ็ตเป็นพิกเซล (80-1200) ค่าเริ่มต้น 480 ใช้ 300-400 สำหรับการ์ดกะทัดรัด และ 600-800 สำหรับแผนภูมิขนาดใหญ่"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "โหมดพื้นหลัง: solid (ค่าเริ่มต้น) / transparent (สำหรับวางภาพหน้าจอลงในเทมเพลต PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "โหมดสไลด์ PPT เมื่อเป็น true การ์ดจะแสดงในอัตราส่วน 16:9 พร้อมวางในงานนำเสนอ ค่าเริ่มต้น false ซึ่งแสดงตามเนื้อหา"
"Section heading text, e.g. Completed this week": "ข้อความชื่อส่วน เช่น สิ่งที่เสร็จสัปดาห์นี้"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "ระดับหัวเรื่อง: 1 = ระดับหนึ่ง (ใหญ่ที่สุด), 2 = ระดับสอง, 3 = ระดับสาม ค่าเริ่มต้น 1"
"Body paragraph text (optional; used together with elements)": "ย่อหน้าข้อความ (ไม่บังคับ ใช้ร่วมกับ elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "อาร์เรย์ขององค์ประกอบแบบมีโครงสร้าง (ไม่บังคับ): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "ชนิดองค์ประกอบ: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "เนื้อหาข้อความ (ใช้เมื่อ type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "อาร์เรย์รายการ (ใช้เมื่อ type=bullet_list หรือ ordered_list)"
"Table header row (required when type=table)": "แถวหัวตาราง (จำเป็นเมื่อ type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "แถวข้อมูลตาราง (จำเป็นเมื่อ type=table) แต่ละแถวเป็นอาร์เรย์ค่าเซลล์ เช่น [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "สไตล์ตาราง (ไม่บังคับเมื่อ type=table): headerBgColor (พื้นหลังหัวตาราง), headerFontColor (สีข้อความหัวตาราง), stripeColor (แถวสลับสี)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL รูปภาพ (จำเป็นเมื่อ type=image) รองรับลิงก์ https:// ภายนอก หรือไฟล์แนบภายใน เช่น /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "ความกว้างรูปภาพเป็นเซนติเมตร (type=image) ค่าเริ่มต้น 14 ซม."
"Image height in centimeters (type=image); default 10cm": "ความสูงรูปภาพเป็นเซนติเมตร (type=image) ค่าเริ่มต้น 10 ซม."
"Whether the text is bold (optional for type=paragraph/callout/quote)": "ข้อความเป็นตัวหนาหรือไม่ (ไม่บังคับเมื่อ type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "ข้อความเป็นตัวเอียงหรือไม่ (ไม่บังคับเมื่อ type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "ข้อความขีดเส้นใต้หรือไม่ (ไม่บังคับเมื่อ type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "ขนาดตัวอักษรเป็นพอยต์ เช่น 12 (ไม่บังคับเมื่อ type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "สีข้อความ (RGB ฐานสิบหก เช่น 2563EB; ไม่บังคับเมื่อ type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "การจัดตำแหน่งข้อความ: left/center/right/justify (ไม่บังคับเมื่อ type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "สีพื้นหลังย่อหน้า (RGB ฐานสิบหก เช่น EFF6FF; ไม่บังคับเมื่อ type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "สไตล์กล่องไฮไลต์ (type=callout): info (น้ำเงิน) / success (เขียว) / warning (เหลือง) / danger (แดง) ค่าเริ่มต้น info"
"KPI value (required when type=kpi), e.g. 17.68M": "ค่า KPI (จำเป็นเมื่อ type=kpi) เช่น 17.68 ล้าน"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "ป้าย KPI (ไม่บังคับเมื่อ type=kpi) เช่น การเติบโตเทียบกับเดือนก่อน"
"KPI trend (optional when type=kpi): up / down / flat": "แนวโน้ม KPI (ไม่บังคับเมื่อ type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "แหล่งอ้างอิง (ไม่บังคับเมื่อ type=quote) เช่น รายงานประจำปี 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "ภาษาโค้ด (ไม่บังคับเมื่อ type=code) เช่น sql/python/javascript กำหนดการไฮไลต์ไวยากรณ์"
"Worksheet name, e.g. Q2 Data": "ชื่อเวิร์กชีต เช่น ข้อมูลไตรมาส 2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "อาร์เรย์หัวคอลัมน์ เช่น [\"วันที่\",\"รายได้\",\"การเปลี่ยนแปลง\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "แถวข้อมูล (อาร์เรย์สองมิติ) แต่ละแถวเป็นอาร์เรย์ค่าเซลล์ เช่น [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "สไตล์หัวตาราง (ไม่บังคับ): headerBgColor (พื้นหลังหัวตาราง), headerFontColor (สีข้อความหัวตาราง), stripeColor (แถวสลับสี)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "อาร์เรย์ความกว้างคอลัมน์ (ไม่บังคับ) เช่น [12, 20, 15] ค่าเป็นความกว้างโดยประมาณเป็นอักขระ"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "รูปแบบตัวเลข (ไม่บังคับ) เช่น \"#,##0.00\" หรือ \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "อาร์เรย์การจัดรูปแบบตามเงื่อนไข (ไม่บังคับ) ฟิลด์ของแต่ละรายการ: range (เช่น \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan และอื่น ๆ), color (สีหลัก), value (ค่าเกณฑ์)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "อาร์เรย์คำจำกัดความแผนภูมิ (ไม่บังคับ): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "จำนวนแถวบนที่ตรึง (0 = ไม่ตรึง, 1 = ตรึงแถวแรก; ค่าเริ่มต้น 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "ช่วงการกรองอัตโนมัติ (เช่น \"A1:E1\") ปิดใช้งานเมื่อว่าง"
"Dropdown validation array (optional)": "อาร์เรย์การดำเนินการตรวจสอบรายการเลื่อนลง (ไม่บังคับ)"
"Applied range (e.g. \"C2:C10\")": "ช่วงที่ใช้ (เช่น \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "ชนิดเงื่อนไข: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "สี (RGB ฐานสิบหก เช่น 2563EB) ที่ใช้สำหรับแถบข้อมูล มาตรวัดสี หรือการเน้น"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "ค่าเกณฑ์หรือสูตร (เช่น 1000 หรือ =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "ชนิดแผนภูมิ: bar / line / pie"
"Chart title (optional)": "ชื่อแผนภูมิ (ไม่บังคับ)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "อาร์เรย์ป้ายแกนหมวดหมู่ เช่น [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "อาร์เรย์อนุกรมข้อมูล แต่ละรายการมี name และ data"
"Applied range (e.g. \"A2:A100\")": "ช่วงที่ใช้ (เช่น \"A2:A100\")"
"Dropdown option array": "อาร์เรย์ตัวเลือกของรายการเลื่อนลง"
"Title of this slide": "ชื่อสไลด์นี้"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "เค้าโครงสไลด์: title_only (เฉพาะชื่อเรื่อง สำหรับหน้าปก) / title_content (ชื่อเรื่อง + ข้อความ ค่าเริ่มต้น) / two_column (สองคอลัมน์) / chart_only (แผนภูมิเต็มความกว้าง) / blank (พื้นที่ว่าง)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "สีพื้นหลังสไลด์ RGB ฐานสิบหก เช่น \"1F497D\" หากไม่ระบุจะใช้พื้นหลังของธีม"
"Slide element list; each element describes a text block, table, chart, or image": "รายการองค์ประกอบของสไลด์ แต่ละองค์ประกอบอธิบายบล็อกข้อความ ตาราง แผนภูมิ หรือรูปภาพ"
"Footer text displayed at the bottom of the slide; null hides it": "ข้อความส่วนท้ายที่แสดงใต้สไลด์ null จะซ่อน"
"Whether to show the slide number in the bottom-right corner; default false": "จะแสดงหมายเลขสไลด์ที่มุมขวาล่างหรือไม่ ค่าเริ่มต้น false"
"Speaker notes used as a reminder while presenting": "บันทึกผู้นำเสนอที่ใช้เป็นตัวเตือนระหว่างการนำเสนอ"
"Transition animation: fade / push / wipe / zoom / split / cut": "เอฟเฟกต์การเปลี่ยน: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "ชนิดองค์ประกอบ: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "บทบาทเชิงความหมาย (เฉพาะองค์ประกอบ text): title / subtitle / body / caption / kpi เอนจินเค้าโครงใช้เพื่อจัดตำแหน่งองค์ประกอบอัตโนมัติ โดยไม่ต้องระบุพิกัด"
"Text content (required when type=text)": "เนื้อหาข้อความ (จำเป็นเมื่อ type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "ขนาดตัวอักษรเป็นพอยต์ (ไม่บังคับ) หากไม่ระบุเอนจินเค้าโครงจะเลือกตาม role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "ข้อความเป็นตัวหนาหรือไม่ ค่าเริ่มต้น false"
"Whether the text is italic (optional for type=text); default false": "ข้อความเป็นตัวเอียงหรือไม่ (ไม่บังคับเมื่อ type=text) ค่าเริ่มต้น false"
"Whether the text is underlined (optional for type=text); default false": "ข้อความขีดเส้นใต้หรือไม่ (ไม่บังคับเมื่อ type=text) ค่าเริ่มต้น false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "สีข้อความ RGB ฐานสิบหก เช่น \"FFFFFF\" หากไม่ระบุจะสืบทอดสีข้อความของธีม"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "อาร์เรย์หัวตาราง (จำเป็นเมื่อ type=table) เช่น [\"ตัวชี้วัด\",\"Q1\",\"Q2\",\"การเปลี่ยนแปลง\"]"
"Chart type (required when type=chart): bar / line / pie": "ชนิดแผนภูมิ (จำเป็นเมื่อ type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "ป้ายหมวดหมู่ของแผนภูมิ (จำเป็นเมื่อ type=chart) เช่น [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "อนุกรมข้อมูล (จำเป็นเมื่อ type=chart) แต่ละรายการมี name (ชื่ออนุกรม) และ data (อาร์เรย์ตัวเลข)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "การจัดตำแหน่งข้อความ (องค์ประกอบ text): l (ซ้าย) / ctr (กลาง) / r (ขวา)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "สีพื้นหลังกล่องข้อความ (องค์ประกอบ text) RGB ฐานสิบหก เช่น \"EFF6FF\" โปร่งใสเมื่อว่าง"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "ส่วนข้อความที่จัดรูปแบบแล้ว (องค์ประกอบ text) หากมี Content/FontSize/Bold/Color จะถูกละเลย"
"Shape configuration (required when type=shape)": "การกำหนดค่ารูปทรง (จำเป็นเมื่อ type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "สไตล์ตาราง (ไม่บังคับเมื่อ type=table): headerBgColor (พื้นหลังหัวตาราง), headerFontColor (สีข้อความหัวตาราง), stripeColor (แถวสลับสี)"
"Text content": "เนื้อหาข้อความ"
"Font size in points; 0 inherits the text box default": "ขนาดตัวอักษรเป็นพอยต์ 0 หมายถึงสืบทอดค่าเริ่มต้นของกล่องข้อความ"
"Whether the text is bold": "ข้อความเป็นตัวหนาหรือไม่"
"Whether the text is italic": "ข้อความเป็นตัวเอียงหรือไม่"
"Whether the text is underlined": "ข้อความขีดเส้นใต้หรือไม่"
"Text color, hex RGB such as \"FF6B6B\"": "สีข้อความ RGB ฐานสิบหก เช่น \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL ของไฮเปอร์ลิงก์ เมื่อกำหนดแล้วส่วนข้อความจะคลิกได้"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "ชนิดรูปทรง: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "สีเติม (RGB ฐานสิบหก เช่น 2563EB) null หมายถึงไม่เติม"
"Border color (hex RGB); null means no border": "สีเส้นขอบ (RGB ฐานสิบหก) null หมายถึงไม่มีเส้นขอบ"
"Text displayed inside the shape (optional)": "ข้อความที่แสดงภายในรูปทรง (ไม่บังคับ)"
"Text color inside the shape (hex RGB)": "สีข้อความภายในรูปทรง (RGB ฐานสิบหก)"
"Font size of the text inside the shape (points); 0 means default": "ขนาดตัวอักษรของข้อความภายในรูปทรง (พอยต์) 0 หมายถึงค่าเริ่มต้น"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "สีพื้นหลังแถวหัวตาราง (RGB ฐานสิบหก เช่น 2563EB) หากไม่ระบุจะไม่ใช้สไตล์พิเศษ"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "สีข้อความแถวหัวตาราง (RGB ฐานสิบหก เช่น FFFFFF) หากไม่ระบุจะสืบทอดค่าเริ่มต้น"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "สีแถวสลับ (พื้นหลังแถวข้อมูลคู่ เช่น EFF6FF น้ำเงินอ่อน) หากไม่ระบุจะไม่วาดแถบสี"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "ID คอลัมน์ที่ไม่ซ้ำ (จำเป็น) เช่น \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "ชื่อคอลัมน์ (จำเป็น ไม่เกิน 20 อักขระ)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "สีชื่อคอลัมน์ (ไม่บังคับ) ฐานสิบหก เช่น \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "ขีดจำกัด WIP (ไม่บังคับ) เมื่อเกินชื่อคอลัมน์จะเป็นสีแดง"
"Card array (required)": "อาร์เรย์การ์ด (จำเป็น)"
"Unique card ID (required)": "ID การ์ดที่ไม่ซ้ำ (จำเป็น)"
"Card title (required, up to 40 characters)": "ชื่อการ์ด (จำเป็น ไม่เกิน 40 อักขระ)"
"Supplementary description (optional, up to 100 characters)": "คำอธิบายเพิ่มเติม (ไม่บังคับ ไม่เกิน 100 อักขระ)"
"Priority (optional): high | medium | low": "ลำดับความสำคัญ (ไม่บังคับ): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "อาร์เรย์แท็ก (ไม่บังคับ) เช่น [\"ออกแบบ\",\"อินเทอร์เฟซ\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "กำหนดส่ง (ไม่บังคับ) ISO 8601 เช่น \"2026-07-15\""
"Assignee name (optional)": "ชื่อผู้รับผิดชอบ (ไม่บังคับ)"
"Subtask checklist (optional); each item has title and done": "รายการงานย่อย (ไม่บังคับ) แต่ละรายการมี title และ done"
"Completion progress (optional), 0-100": "เปอร์เซ็นต์ความคืบหน้า (ไม่บังคับ) 0-100"
"Related link URL (optional)": "URL ลิงก์ (ไม่บังคับ)"
"Subtask title": "ชื่องานย่อย"
"Whether the subtask is done": "งานย่อยเสร็จแล้วหรือไม่"
"Unique swimlane ID (required)": "ID เลนที่ไม่ซ้ำ (จำเป็น)"
"Swimlane title (required)": "ชื่อเลน (จำเป็น)"
"Column ID array contained in this swimlane (required)": "อาร์เรย์ ID คอลัมน์ในเลนนี้ (จำเป็น)"
"City or place name (required), e.g. Beijing": "ชื่อเมืองหรือสถานที่ (จำเป็น) เช่น ปักกิ่ง"
"Latitude (required), WGS84 decimal degrees": "ละติจูด (จำเป็น) องศาทศนิยม WGS84"
"Longitude (required), WGS84 decimal degrees": "ลองจิจูด (จำเป็น) องศาทศนิยม WGS84"
"Marker label text (optional); supports \\n line breaks": "ข้อความป้ายของหมุด (ไม่บังคับ) รองรับ \\\\n สำหรับขึ้นบรรทัดใหม่"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "สีหมุด (ไม่บังคับ) ฐานสิบหก เช่น \"#E74C3C\" หากไม่ระบุสีจะวนตามชุดสี"
"Marker size (optional); default 7": "ขนาดหมุด (ไม่บังคับ) ค่าเริ่มต้น 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "ชื่อจังหวัด (จำเป็น) รับชื่อจังหวัดภาษาจีน (เต็มหรือย่อ) เช่น กวางตุ้ง"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "สีเน้น (ไม่บังคับ) ฐานสิบหก เช่น \"#FFB347\" ค่าเริ่มต้นคือสีของชุดสี"
"Highlight label (optional), e.g. No.1 GDP": "ป้ายเน้น (ไม่บังคับ) เช่น GDP อันดับหนึ่ง"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "วันที่เหตุการณ์ (จำเป็น) รูปแบบใดก็ได้ เช่น \"2024-01\" หรือ \"2024 Q3\" หรือ \"ระยะที่ 1\""
"Event title (required, up to 30 characters)": "ชื่อเหตุการณ์ (จำเป็น ไม่เกิน 30 อักขระ)"
"Supplementary description (optional, up to 80 characters)": "คำอธิบายเพิ่มเติม (ไม่บังคับ ไม่เกิน 80 อักขระ)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "สีฐานสิบหก (ไม่บังคับ) เช่น \"#5470c6\" หากไม่ระบุชุดสีจะวนอัตโนมัติ"
"Event category label (optional), e.g. Milestone, Release, Issue": "ป้ายหมวดหมู่เหตุการณ์ (ไม่บังคับ) เช่น หมุดหมาย การเผยแพร่ เหตุขัดข้อง"
"Word Document": "เอกสาร Word"
"Excel Workbook": "สมุดงาน Excel"
"PowerPoint Slides": "สไลด์ PowerPoint"
"Interactive Chart": "แผนภูมิแบบโต้ตอบ"
"Current User": "ผู้ใช้ปัจจุบัน"
"Search Database Tables": "ค้นหาตารางฐานข้อมูล"
"Run SQL": "เรียกใช้ SQL"
"Date and Holiday": "วันที่และวันหยุด"
"Task Kanban": "กระดานงานคัมบัง"
"China Map Annotation": "คำอธิบายแผนที่จีน"
"Mind Map": "แผนที่ความคิด"
"Timeline": "ไทม์ไลน์"
"Visual Widget": "วิดเจ็ตภาพ"
