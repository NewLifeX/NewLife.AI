"Failed to record gateway conversation: {0}": "บันทึกบทสนทนาเกตเวย์ล้มเหลว: {0}"
"Failed to save gateway attachment: {0}": "บันทึกไฟล์แนบเกตเวย์ล้มเหลว: {0}"
"Name cannot be empty": "name ต้องไม่ว่างเปล่า"
"Name '{0}' already exists": "name '{0}' มีอยู่แล้ว"
"Embedded resource china-map.svg was not found; make sure the csproj contains <EmbeddedResource Include=\"Resources\\china-map.svg\" />": "ไม่พบทรัพยากรที่ฝังไว้ china-map.svg โปรดตรวจสอบว่า csproj มี <EmbeddedResource Include=\"Resources\\china-map.svg\" />"
