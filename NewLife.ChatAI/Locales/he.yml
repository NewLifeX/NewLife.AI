"Handler [{0}] OnAfter failed (non-streaming): {1}": "Handler [{0}] OnAfter נכשל (לא בזרימה): {1}"
"Streaming generation failed: {0}": "יצירה בזרימה נכשלה: {0}"
"LLM context is missing the user message; skipping the call. ContextMessages.Count={0}": "בהקשר ה-LLM חסרה הודעת המשתמש; הקריאה תדולג. ContextMessages.Count={0}"
"Context window budget exceeded; interrupting the tool call loop": "חריגה מתקציב חלון ההקשר; לולאת קריאות הכלים תיקטע"
"Upstream rate limited (429), retry {0}, waiting {1}ms": "הגבלת קצב במעלה הזרם (429), ניסיון {0}, המתנה {1}ms"
"Upstream error {0}, retry {1}": "שגיאה במעלה הזרם {0}, ניסיון {1}"
"Failed to pre-create gateway conversation: {0}": "יצירה מוקדמת של שיחת השער נכשלה: {0}"
"Failed to record gateway conversation: {0}": "רישום שיחת השער נכשל: {0}"
"Failed to save gateway attachment: {0}": "שמירת קובץ המצורף של השער נכשלה: {0}"
"Name cannot be empty": "השם אינו יכול להיות ריק"
"Name '{0}' already exists": "השם '{0}' כבר קיים"
"Embedded resource china-map.svg was not found; make sure the csproj contains <EmbeddedResource Include=\"Resources\\china-map.svg\" />": "המשאב המוטמע china-map.svg לא נמצא; יש לוודא ש-csproj מכיל <EmbeddedResource Include=\"Resources\\china-map.svg\" />"
"The message does not exist or the role does not match": "ההודעה אינה קיימת או שהתפקיד אינו תואם"
"The conversation does not exist": "השיחה אינה קיימת"
"Model '{0}' is unavailable": "המודל '{0}' אינו זמין"
"No model is available; configure and enable at least one model in the admin console first": "אין מודל זמין; אנא הגדר והפעל לפחות מודל אחד במסוף הניהול תחילה"
"Invalid parameter: sections cannot be empty": "פרמטר לא תקף: sections לא יכול להיות ריק"
"Invalid parameter: sheets cannot be empty": "פרמטר לא תקף: sheets לא יכול להיות ריק"
"MCP tool not found: '{0}'": "כלי MCP לא נמצא: '{0}'"
"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "יוצר מסמך Word (.docx) ומחזיר קישור הורדה. תומך בכותרת, פסקאות, רשימות, טבלאות, תמונות, מעברי עמוד, קווים מפרידים, תיבות הדגשה, כרטיסי KPI, ציטוטים ובלוקי קוד. מערך ה-JSON בשם sections מתאר כל מקטע באמצעות heading, content ו-elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "כותרת המסמך (עד 30 תווים), למשל דוח רבעון 2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "מערך המקטעים (JSON). השדות של כל מקטע: heading (כותרת המקטע), headingLevel (1-3, ברירת מחדל 1), content (פסקת טקסט, אופציונלי), elements (מערך פריטים, אופציונלי). סוגי פריטים: paragraph ({type,text,אופציונלי bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows,אופציונלי tableStyle}; rows הוא מערך דו-ממדי, כל שורה היא מערך ערכי תאים, למשל [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "ערכת נושא (אופציונלי): מפתח סגנון כרטיס (למשל enterprise-blue) או שם מובנה (blue/dark/corporate/warm/green/minimal); אם מושמט, נעשה שימוש בסגנון השיחה או בברירת המחדל של המותג"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "יוצר חוברת עבודה של Excel (.xlsx) ומחזיר קישור הורדה. תומך במספר גיליונות, סגנונות כותרת, רוחבי עמודות, תבניות מספר, עיצוב מותנה, הקפאת חלוניות, סינון אוטומטי ואימות רשימה נפתחת. הפרמטר theme מקבל מפתח סגנון כרטיס או שם מובנה (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "כותרת חוברת העבודה (עד 30 תווים), למשל דוח הכנסות רבעון 2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "מערך הגיליונות (JSON). השדות של כל גיליון: name, headers (מערך כותרות), rows (מערך דו-ממדי; כל שורה היא מערך ערכי תאים, למשל [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (למשל [12,20,15]), numberFormat (למשל \"#,##0.00\" או \"yyyy-MM-dd\"), conditionalFormats (מערך {range,type,color,value?}; type תומך ב-dataBar/colorScale/greaterThan ועוד), charts (מערך תרשימים), freezeRows (מספר השורות המוקפאות), autoFilter (טווח הסינון) ו-dropdowns (אימות רשימה נפתחת)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "ערכת נושא (אופציונלי): מפתח סגנון כרטיס (למשל enterprise-blue) או שם מובנה (blue/dark/corporate/warm/green/minimal) שקובע את הכותרת ואת הצבעים הכלליים; אם מושמט, נעשה שימוש בסגנון השיחה או בברירת המחדל של המותג"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "יוצר מצגת PowerPoint (.pptx) ומחזיר קישור הורדה. שני מצבי קלט בלעדיים זה לזה: (1) מצב slides שבו ה-AI מתאר תוכן מובנה והפריסה נוצרת אוטומטית; (2) מצב widgetSrc שמטביע כרטיסי show_widget שנוצרו קודם כתמונות שקופיות. הפרמטר theme מקבל מפתח סגנון כרטיס (למשל enterprise-blue/raycast-dark/ppt-executive) או שם מובנה (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "כותרת המצגת (עד 30 תווים), למשל סקירת רבעון 2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "מערך השקופיות (JSON). פריט אחד = שקופית אחת, כמה פריטים = מצגת מלאה. בלעדי ל-widgetSrc. השדות של כל שקופית: title, layout (title_only/title_content/two_column/chart_only/blank), background (צבע הקסדצימלי), footer, showPageNumber (true/false), elements (רשימת פריטים), notes ו-transition. elements תומך ב: text (role=title/subtitle/body/kpi/caption; אופציונלי bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows מערך דו-ממדי, כל שורה מערך ערכי תאים, למשל [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; אופציונלי tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). דוגמה: [{\"title\":\"שער\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"סקירת רבעון 2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"צוות NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "רשימת מזהי כרטיסי show_widget מופרדת בפסיקים, למשל 'call_abc123,call_def456'. בלעדי ל-slides. ממיר את הכרטיסים שנוצרו לתמונות שקופיות"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "ערכת נושא (אופציונלי): מפתח סגנון כרטיס (למשל enterprise-blue/ppt-executive) או שם מובנה (blue/dark/corporate/warm/green/minimal ועוד); אם מושמט, נעשה שימוש בסגנון השיחה או בברירת המחדל של המותג"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "מציג נתונים כתרשים אינטראקטיבי (זום, ריחוף, ייצוא כתמונה). מהיר פי 20 בקירוב מ-show_widget: די במפרט JSON (כ-200 אסימונים) והחזית מציירת אותו מיד באמצעות ECharts. נתמכים: bar, line (קו/שטח), pie (עוגה/טבעת), scatter, radar, map_china (מפת חום של מחוזות סין), heatmap (מפת חום מטריציונית), gauge, funnel, treemap. מתאים להשוואות מספריות, סדרות זמן (קו), ניתוח חלוקה והתפלגות גיאוגרפית. הערה: למסלולים, אירועים היסטוריים, אבני דרך וצירי זמן השתמשו ב-show_timeline; כלי זה אינו תומך בסוג timeline. סגנון חזותי: העבירו פלטת צבעים דרך data.colors במקום להסתמך על ברירות המחדל של ECharts. הצעות: צבע המותג לסדרה אחת, גוונים במרווחים שווים (10-12 צבעים) למספר סדרות, צבעים משלימים להשוואות, מעבר חד-גוני למגמות. כחול וזהב לפיננסים, כחול/ירוק/לבן לבריאות, סגול/כחול/תכלת לטכנולוגיה ו-AI. עבור מערכי נתונים גדולים הגדירו data.animation=false כדי לצמצם את עלות הרינדור."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "סוג התרשים: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "כותרת התרשים (עד 30 תווים), למשל תמ\"ג לפי מחוז 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "אובייקט JSON; המבנה מתואר בתיאור הכלי. דוגמת bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"הכנסות\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; דוגמת radar עם כמה סדרות: {\"indicators\":[{\"name\":\"מהירות\",\"max\":100},{\"name\":\"כוח\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; תנאי radar: מספר ה-indicators חייב להיות שווה לאורך של כל series[i].data, ו-data חייב להכיל מספרים בלבד"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "מחזיר את פרטי המשתמש המחובר, כולל שם משתמש, שם תצוגה, דוא\"ל, נייד, קוד, תפקידים, מחלקה, מין, גיל, תאריך לידה והערות, וכן את כתובת ה-IP, העיר והמיקום הגיאוגרפי המפורט של המבקר"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "מחפש סכימות טבלאות של מסד נתונים לפי מילת מפתח. התוצאה כוללת שני חלקים: (1) מפת טבלה-חיבור (טבלת Markdown שמראה לאיזה חיבור שייכת כל טבלה; טבלאות באותו שם בחיבורים שונים מוצגות בנפרד); (2) סכימת XML של הטבלאות לכל חיבור. קריאות run_sql עוקבות חייבות להשתמש בשם החיבור מטבלת המפה"
"Search keywords, separated by commas or spaces": "מילות חיפוש מופרדות בפסיקים או ברווחים"
"Restrict to a connection name; empty searches all connections": "הגבלה לפי שם חיבור; ריק פירושו חיפוש בכל החיבורים"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "מריץ הצהרת SQL בחיבור מסד הנתונים שצוין. שאילתות SELECT/WITH מחזירות שורות; הצהרות שאינן שאילתות כמו INSERT/UPDATE/DELETE מחזירות את מספר השורות שהושפעו. connName חייב להתאים לעמודת החיבור שמוחזרת על ידי search_table"
"Database connection name (from the connection column of search_table)": "שם חיבור מסד הנתונים (מעמודת החיבור של search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "הצהרת SQL. SELECT/WITH מחזיר קבוצת תוצאות; הצהרות שאינן שאילתות מחזירות את מספר השורות שהושפעו"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "מאתר את התאריך בלוח השנה הירחי, את המונח הסולרי ואת סטטוס יום העבודה (יום עבודה/חופשה/יום פיצוי) עבור תאריך נתון"
"Date to query in yyyy-MM-dd format. Defaults to today": "התאריך המבוקש בפורמט yyyy-MM-dd. ברירת מחדל היום"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "מציג משימות כלוח קנבן רב-עמודתי (למשל לביצוע -> בתהליך -> הושלם). מתאים לפיצול שלבי פרויקט, תכנון ספרינט, הצגת זרימת עבודה וסיווג מצב משימות. לכל עמודה יכולים להיות תג צבע ומגבלת WIP; לכל כרטיס יכולים להיות כותרת, תיאור, עדיפות, תגיות, תאריך יעד, אחראי, רשימת תת-משימות, התקדמות וקישור. שני פריסות: board (לוח רב-עמודתי, ברירת מחדל) ו-swimlane (עמודות מקובצות לפי צוות או יחידה)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "כותרת הלוח (עד 30 תווים), למשל לוח ספרינט 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "מערך JSON של הגדרות עמודות. דוגמה: [{\"id\":\"todo\",\"title\":\"לביצוע\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"ניתוח דרישות\",\"description\":\"איסוף דרישות משתמשים\",\"priority\":\"high\",\"tags\":[\"עיצוב\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"ראיונות משתמשים\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. כל השדות למעט id ו-title הם אופציונליים"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "מצב פריסה: board (לוח רב-עמודתי, ברירת מחדל) או swimlane (עמודות מקובצות לפי צוות או יחידה; נדרש הפרמטר swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "מערך JSON של הגדרות מסלולים (בשימוש כאשר layout=swimlane). דוגמה: [{\"id\":\"sl1\",\"title\":\"צוות חזית\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"צוות שרת\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "מסמן נקודות קואורדינטות (ערים או נקודות עניין) או מדגיש מחוזות על מפת סין, יוצר מפת SVG עם הערות ומציג אותה בבועת השיחה. תומך ב: (1) מילוי מחוזות בצבעים מותאמים; (2) סמני WGS84 עם קו רוחב, קו אורך וטקסט תווית; (3) מקרא אוטומטי בפינה הימנית התחתונה. שימושים אופייניים: התפלגות נתונים לפי מחוז, מיקומי ערים, מפות חום של מכירות אזוריות."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "כותרת המפה (עד 30 תווים), למשל תמ\"ג לפי מחוז 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "מערך JSON של סמנים (יכול להיות מערך ריק []). פורמט: [{\"name\":\"בייג'ינג\",\"lat\":39.9,\"lng\":116.4,\"label\":\"בייג'ינג\\n4376 מיליארד\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng במעלות עשרוניות WGS84; color/size אופציונליים"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "מערך JSON של הדגשות מחוזות (יכול להיות מערך ריק []). פורמט: [{\"name\":\"גואנגדונג\",\"color\":\"#FFB347\",\"label\":\"תמ\\\"ג מקום ראשון\"}]. name מקבל את שם המחוז בסינית (מלא או מקוצר); label אופציונלי"
"Legend title (optional), e.g. GDP scale": "כותרת המקרא (אופציונלי), למשל סקאלת תמ\"ג"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "ערכת צבעים (אופציונלי): blue/orange/green/purple/red; ברירת מחדל blue"
"Marker style (optional): circle/pin/square; defaults to circle": "צורת הסמן (אופציונלי): circle/pin/square; ברירת מחדל circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "מציג היררכיות ידע או קשרים בין מושגים כמפת חשיבה אינטראקטיבית שאפשר לקפל. הקלט הוא מתווה Markdown (# / ## / ###) שהחזית הופכת לעץ חזותי. מתאים לארגון ידע, פירוק מושגים, השוואת טכנולוגיות, הערכת אפשרויות וסיכום תוכן. סגנון חזותי: בחרו branchColors (3-8 צבעים הרמוניים), maxDepth (מורכבות) ו-collapsed (קיפול ראשוני למיקוד) בהתאם לנושא. השתמשו בצבעים קרים (כחול/סגול/תכלת) לטכנולוגיה ולנתונים, בצבעים חמים (כתום/זהב/אדום) לעסקים ולשיווק, ובירוק לטבע ולבריאות. עבור צמתים צפופים הגדירו maxDepth=2 כדי לשמור על קריאות. 6 פריסות: tree (ברירת מחדל, עץ משונן, כללי) / radial (קרינה שמאלה-ימינה, הטוב ביותר למפות ידע) / lr (מהמרכז ימינה, תרשימי זרימה/עצי החלטה) / rl (מהמרכז שמאלה, מעקב הפוך) / tb (מהמרכז למטה, תרשימי ארגון) / bt (מהמרכז למעלה, היררכיה מלמטה למעלה)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "כותרת מפת החשיבה (עד 30 תווים), למשל מחסנית טכנולוגיות AI"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "מתווה Markdown עם # / ## / ### עבור רמות 1-3. דוגמה:\n# בינה מלאכותית\n## למידת מכונה\n### למידה מונחית\n### למידה לא מונחית\n## למידה עמוקה\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "מצב פריסה: tree (ברירת מחדל, עץ משונן, כללי) / radial (קרינה שמאלה-ימינה, הטוב ביותר למפות ידע) / lr (מהמרכז ימינה, תרשימי זרימה/עצי החלטה) / rl (מהמרכז שמאלה, מעקב הפוך) / tb (מהמרכז למטה, תרשימי ארגון) / bt (מהמרכז למעלה, היררכיה מלמטה למעלה)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "מערך JSON של צבעי ענפים, למשל [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. מקצה לפי הסדר 3-8 צבעים הקסדצימליים לענפי הרמה הראשונה. אם מושמט, נעשה שימוש בפלטת ברירת המחדל כחול/סגול, ירוק, צהוב, אדום, תכלת, ירוק כהה, כתום וסגול"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "מערך JSON של מזהי צמתים המקופלים מראש, למשל [\"n2\",\"n5\"]. ריק פירושו פתיחת הכול. משמש למיקוד בענפים חשובים"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "עומק תצוגה מרבי: 1 = רק ענפי הרמה הראשונה, 2 = שתי רמות, כברירת מחדל ללא הגבלה. עבור צמתים צפופים הגדירו 2 כדי לשמור על קריאות"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "מציג נתוני סדרות זמן ככרטיסי ציר זמן אלגנטיים. די ב-JSON (כ-100 אסימונים) והחזית מציגה אותם מיד. מתאים לאבני דרך של פרויקט, אירועים היסטוריים, תוכניות שחרור והיסטוריית פיתוח. לכל אירוע יכולים להיות תאריך, כותרת, תיאור, צבע וקטגוריה. סגנון חזותי: הגדירו פלטה כללית דרך הפרמטר palette (למשל מעבר כחול-סגול, ברונזה חמה, צבעי המותג) כדי שלציר הזמן יהיה אופי אחיד; item.color מחליף פריטים בודדים. השתמשו ב-density=relaxed עבור חמישה אירועים נבחרים או פחות וב-density=compact עבור עשרה או יותר. 8 פריסות: vertical (5-20 פריטים) / alternating-top (לסירוגין למעלה, כרונולוגיה הפוכה) / alternating-bottom (לסירוגין למטה, כרונולוגיה) / horizontal-left (אופקי שמאלה, הפוך) / horizontal-right (אופקי ימינה, כרונולוגיה) / s-curve (עקומת S, 8 פריטים או פחות) / fishbone-left (עצם דג שמאלה, הפוך) / fishbone-right (עצם דג ימינה, כרונולוגיה)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "כותרת ציר הזמן (עד 30 תווים), למשל אבני דרך של המוצר"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "מערך JSON של אירועי ציר הזמן. דוגמה: [{\"date\":\"2024-01\",\"title\":\"שחרור v1.0\",\"description\":\"השקת התכונות המרכזיות\",\"color\":\"#5470c6\",\"category\":\"אבן דרך\"}]. description/color/category אופציונליים"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "מצב פריסה: vertical / alternating-top (לסירוגין למעלה, הפוך) / alternating-bottom (לסירוגין למטה, כרונולוגיה) / horizontal-left (אופקי, הפוך) / horizontal-right (אופקי, כרונולוגיה) / s-curve / fishbone-left (עצם דג, הפוך) / fishbone-right (עצם דג, כרונולוגיה)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "מערך JSON של הפלטה הכללית, למשל [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. מחליף את סבב שמונת הצבעים המובנה. ל-item.color יש עדיפות"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "מרווח בין פריטים: compact (12px) / normal (20px, ברירת מחדל) / relaxed (32px). relaxed מתאים לחמישה אירועים נבחרים או פחות; compact לעשרה או יותר"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "מציג קטע SVG או HTML בתוך בועת השיחה. השתמשו בזה לצירי זמן ותרשימי קשרים (SVG), תצוגות מקדימות של טפסים וכרטיסי נתונים (HTML), גרפים סטטיסטיים (SVG). אל תשתמשו בזה לתרשימי Mermaid; הפיקו Mermaid כבלוק קוד ```mermaid בתשובה. מגבלות: עד 200 KB; <script src=...> רק מ-CDN מהימן. סגנון חזותי: בחרו ארכיטקטורת מידע (Bento/זרימת כרטיסים/Grid), היררכיה טיפוגרפית ומערכת צבעים בהתאם לנושא. גוונים קרים ללא פינות לדיונים טכניים, צבעים ניטרליים עם מספרים בולטים לדוחות עסקיים, מעברים/אפקט זכוכית/אנימציות עדינות לעבודה יצירתית. תמיד ציינו במפורש font-family ו-color; אל תסתמכו על סגנונות ברירת המחדל של הדפדפן."
"Widget title (up to 30 characters), e.g. Order Status Flow": "כותרת הווידג'ט (עד 30 תווים), למשל זרימת מצב הזמנה"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "ה-SVG חייב להתחיל ב-<svg; קטעי HTML חייבים להתחיל באלמנט השורש ולא להכיל <html><body>. עד 200 KB; <script src=...> רק מ-CDN מהימן. אל תעבירו תחביר Mermaid (flowchart/graph/sequenceDiagram וכדומה); הפיקו Mermaid כבלוק קוד ```mermaid בתשובה"
"Placeholder text shown while loading (optional)": "טקסט מציין מקום שמוצג בזמן הטעינה (אופציונלי)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "רמז ערכת נושא: light / dark / auto (לפי המערכת). ה-HTML שנוצר צריך לבחור צבעי רקע וטקסט בהתאם; הוא אינו מועבר לצופה החזית"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "גובה התחלתי של הווידג'ט בפיקסלים (80-1200). ברירת מחדל 480. השתמשו ב-300-400 לכרטיסים קומפקטיים וב-600-800 לתרשימים גדולים"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "מצב רקע: solid (ברירת מחדל) / transparent (להדבקת צילומי מסך בתבנית PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "מצב שקופית PPT. כאשר true הכרטיס מוצג ביחס 16:9, מוכן להדבקה במצגת. ברירת מחדל false שמציג לפי התוכן"
"Section heading text, e.g. Completed this week": "טקסט כותרת המקטע, למשל מה הושלם השבוע"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "רמת כותרת: 1 = רמה ראשונה (הגדולה ביותר), 2 = רמה שנייה, 3 = רמה שלישית; ברירת מחדל 1"
"Body paragraph text (optional; used together with elements)": "פסקת טקסט (אופציונלי; בשימוש יחד עם elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "מערך פריטים מובנים (אופציונלי): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "סוג הפריט: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "תוכן הטקסט (בשימוש כאשר type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "מערך פריטי רשימה (בשימוש כאשר type=bullet_list או ordered_list)"
"Table header row (required when type=table)": "שורת הכותרת של הטבלה (חובה כאשר type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "שורות הנתונים של הטבלה (חובה כאשר type=table); כל שורה היא מערך ערכי תאים, למשל [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "סגנון הטבלה (אופציונלי כאשר type=table): headerBgColor (רקע הכותרת), headerFontColor (צבע טקסט הכותרת), stripeColor (שורות לסירוגין)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "כתובת ה-URL של התמונה (חובה כאשר type=image); תומך בקישורי https:// חיצוניים או בקבצים פנימיים כמו /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "רוחב התמונה בסנטימטרים (type=image); ברירת מחדל 14 ס\"מ"
"Image height in centimeters (type=image); default 10cm": "גובה התמונה בסנטימטרים (type=image); ברירת מחדל 10 ס\"מ"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "האם הטקסט מודגש (אופציונלי כאשר type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "האם הטקסט נטוי (אופציונלי כאשר type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "האם הטקסט בקו תחתון (אופציונלי כאשר type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "גודל גופן בנקודות, למשל 12 (אופציונלי כאשר type=paragraph/callout)"
