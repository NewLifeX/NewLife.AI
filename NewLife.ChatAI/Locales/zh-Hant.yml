"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "文件標題（最多 30 字），例如「Q2 季度報告」"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "章節陣列（JSON）。每個章節的欄位：heading（章節標題）、headingLevel（1-3，預設 1）、content（正文段落，可選）、elements（元素陣列，可選）。元素類型：paragraph（{type,text,可選 bold/italic/underline/fontSize/color/alignment/backgroundColor}）、bullet_list（{type,items}）、ordered_list（{type,items}）、table（{type,headers,rows,可選 tableStyle}；rows 為二維陣列，每列為儲存格值陣列，例如 [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]）、image（{type,src,widthCm?,heightCm?}）、page_break（{type}）、divider（{type}）、callout（{type,text,variant?=info/success/warning/danger}）、kpi（{type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}）、quote（{type,text,quoteSource?}）、code（{type,text,codeLanguage?}）"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "主題（可選）：卡片風格 Key（例如 enterprise-blue）或內建名稱（blue/dark/corporate/warm/green/minimal）；省略時沿用對話風格或品牌預設"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "產生 Excel 活頁簿（.xlsx）並返回下載連結。支援多工作表、表頭樣式、欄寬、數字格式、條件格式、凍結窗格、自動篩選與下拉驗證。theme 參數接受卡片風格 Key 或內建名稱（blue/dark/corporate/warm/green/minimal）"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "活頁簿標題（最多 30 字），例如「Q2 營收報告」"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "工作表陣列（JSON）。每個工作表的欄位：name、headers（表頭陣列）、rows（二維陣列；每列為儲存格值陣列，例如 [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]）、style（{headerBgColor,headerFontColor,stripeColor}）、columnWidths（例如 [12,20,15]）、numberFormat（例如 \"#,##0.00\" 或 \"yyyy-MM-dd\"）、conditionalFormats（{range,type,color,value?} 陣列；type 支援 dataBar/colorScale/greaterThan 等）、charts（圖表陣列）、freezeRows（凍結列數）、autoFilter（篩選範圍）、dropdowns（下拉驗證）"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "主題（可選）：卡片風格 Key（例如 enterprise-blue）或內建名稱（blue/dark/corporate/warm/green/minimal），控制表頭與整體配色；省略時沿用對話風格或品牌預設"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "產生 PowerPoint 簡報（.pptx）並返回下載連結。兩種互斥的輸入模式：（1）slides 模式，由 AI 描述結構化內容並自動排版；（2）widgetSrc 模式，將先前產生的 show_widget 卡片嵌入為投影片圖片。theme 參數接受卡片風格 Key（例如 enterprise-blue/raycast-dark/ppt-executive）或內建名稱（blue/dark/green/warm/corporate/minimal）。"
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "簡報標題（最多 30 字），例如「Q2 季度回顧」"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "投影片陣列（JSON）。一個元素代表單張投影片，多個元素代表完整簡報。與 widgetSrc 互斥。每張投影片的欄位：title、layout（title_only/title_content/two_column/chart_only/blank）、background（十六進位顏色）、footer、showPageNumber（true/false）、elements（元素清單）、notes、transition。elements 支援：text（role=title/subtitle/body/kpi/caption；可選 bold/italic/underline/alignment=l/ctr/r/backgroundColor/color）、table（headers+rows；rows 為二維陣列，每列為儲存格值陣列，例如 [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]；可選 tableStyle={headerBgColor/headerFontColor/stripeColor}）、chart（chartType=bar/line/pie/area/scatter+categories+series）、image（src）、shape（shape={shapeType,fillColor,lineColor,text,fontColor}）。範例：[{\"title\":\"封面\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 回顧\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"新生命團隊\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "show_widget 卡片 ID 的清單（以逗號分隔），例如 'call_abc123,call_def456'。與 slides 互斥。將產生的卡片渲染為投影片圖片"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "主題（可選）：卡片風格 Key（例如 enterprise-blue/ppt-executive）或內建名稱（blue/dark/corporate/warm/green/minimal 等）；省略時沿用對話風格或品牌預設"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "將資料渲染為互動式圖表（縮放、懸停、匯出圖片）。比 show_widget 快約 20 倍：只需提供 JSON 規格（約 200 tokens），前端即以 ECharts 立即渲染。支援：bar、line（折線/面積）、pie（圓餅/環形）、scatter、radar、map_china（中國省份熱力圖）、heatmap（矩陣熱力圖）、gauge、funnel、treemap。適用於數值比較、時間序列變化（折線）、佔比分析與地理分布。注意：行程規劃、歷史事件、里程碑與時間軸請改用 show_timeline，本工具不支援 timeline 類型。視覺風格：透過 data.colors 傳遞配色，不要依賴 ECharts 預設值。建議：單一系列用品牌色、多系列用均勻分布的色相（10-12 色）、比較圖用互補色、趨勢圖用單色漸層。財務用藍金、醫療用藍綠白、科技與 AI 用紫藍青。資料量大時設 data.animation=false 以降低渲染負擔。"
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "圖表類型：bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "圖表標題（最多 30 字），例如「2024 年各省 GDP 分布」"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "JSON 物件；結構見工具說明。bar 範例：{\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"營收\",\"data\":[100,200]}],\"unit\":\"萬元\"}；radar 多系列範例：{\"indicators\":[{\"name\":\"速度\",\"max\":100},{\"name\":\"力量\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}；radar 要求：indicators 數量必須等於每個 series[i].data 的長度，data 必須是純數值陣列"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "取得目前登入使用者的詳細資料，包括使用者名稱、顯示名稱、電子郵件、手機、代碼、角色、部門、性別、年齡、生日與備註，以及來訪 IP 位址、城市與詳細地理位置"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "依關鍵字搜尋資料庫資料表結構。結果包含兩部分：（1）資料表對應連線的對照表（Markdown 表格，明確標示每張表所屬連線；同名表在不同連線下分別列出）；（2）各連線下的資料表結構 XML。後續 run_sql 必須使用對照表中的連線名稱"
"Search keywords, separated by commas or spaces": "搜尋關鍵字，以逗號或空格分隔"
"Restrict to a connection name; empty searches all connections": "限定連線名稱；留空則搜尋所有連線"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "在指定資料庫連線上執行 SQL 語句。SELECT/WITH 查詢返回資料列；INSERT/UPDATE/DELETE 等非查詢語句返回受影響列數。connName 必須與 search_table 返回的連線欄位一致"
"Database connection name (from the connection column of search_table)": "資料庫連線名稱（來自 search_table 的連線欄位）"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "SQL 語句。SELECT/WITH 返回結果集；非查詢語句返回受影響列數"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "查詢指定日期的農曆、節氣與工作日狀態（工作日/放假/調休）"
"Date to query in yyyy-MM-dd format. Defaults to today": "要查詢的日期，格式 yyyy-MM-dd。預設為今天"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "將任務清單渲染為多欄看板（例如：待辦 -> 進行中 -> 完成）。適合專案拆解、Sprint 規劃、工作流展示與任務狀態分類。每欄可有顏色標記與 WIP 上限；每張卡片可有標題、描述、優先級、標籤、截止日期、負責人、子任務清單、進度與連結。兩種版面：board（預設多欄看板）與 swimlane（依團隊或模組分組欄位）。"
"Board title (up to 30 characters), e.g. Sprint 1 Board": "看板標題（最多 30 字），例如「Sprint 1 任務看板」"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "欄定義 JSON 陣列。範例：[{\"id\":\"todo\",\"title\":\"待辦\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"需求分析\",\"description\":\"整理使用者需求\",\"priority\":\"high\",\"tags\":[\"設計\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"訪談使用者\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]。除 id 與 title 外，其餘欄位皆可省略"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "版面模式：board（預設多欄看板）或 swimlane（依團隊或模組分組欄位；需提供 swimlanes 參數）"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "泳道定義 JSON 陣列（layout=swimlane 時使用）。範例：[{\"id\":\"sl1\",\"title\":\"前端團隊\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"後端團隊\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "在中國地圖上標註座標點（城市或 POI）或醒目標示省份區域，產生帶標註的 SVG 地圖並渲染到對話氣泡。支援：（1）以自訂顏色填滿省份；（2）WGS84 經緯度標註點（含標籤文字）；（3）右下角自動圖例。典型用途：各省資料分布、城市位置展示與區域銷售熱力圖。"
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "地圖標題（最多 30 字），例如「2024 年各省 GDP 分布」"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "標註點 JSON 陣列（可為空陣列 []）。格式：[{\"name\":\"北京\",\"lat\":39.9,\"lng\":116.4,\"label\":\"北京\\n4376 億\",\"color\":\"#E74C3C\",\"size\":8}]。lat/lng 為 WGS84 十進位度；color/size 可省略"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "省份醒目標示 JSON 陣列（可為空陣列 []）。格式：[{\"name\":\"廣東省\",\"color\":\"#FFB347\",\"label\":\"GDP 第一\"}]。name 接受中文省份全稱或簡稱；label 可省略"
"Legend title (optional), e.g. GDP scale": "圖例標題（可選），例如「GDP 規模」"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "配色方案（可選）：blue/orange/green/purple/red；預設 blue"
"Marker style (optional): circle/pin/square; defaults to circle": "標註點樣式（可選）：circle/pin/square；預設 circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "將知識層級或概念關係渲染為可折疊的互動式心智圖。輸入為 Markdown 大綱（# / ## / ###），前端會轉換為視覺化樹狀圖。適用於知識整理、概念拆解、技術比較、方案評估與內容歸納。視覺風格：依主題選擇 branchColors（3-8 個協調色）、maxDepth（複雜度）與 collapsed（初始折疊以聚焦重點）。技術與資料用冷色系（藍紫青）、商業與行銷用暖色系（橙金紅）、自然與健康用綠色系。節點密集時設 maxDepth=2 以保持可讀性。6 種版面：tree（預設縮排樹，通用）/ radial（左右放射，最適合知識圖）/ lr（中心向右，流程圖/決策樹）/ rl（中心向左，反向追溯）/ tb（中心向下，組織圖）/ bt（中心向上，由下而上的層級）。"
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "心智圖標題（最多 30 字），例如「人工智慧技術體系」"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Markdown 大綱，以 # / ## / ### 表示 1-3 級層級。範例：\n# 人工智慧\n## 機器學習\n### 監督式學習\n### 非監督式學習\n## 深度學習\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "版面模式：tree（預設縮排樹，通用）/ radial（左右放射，最適合知識圖）/ lr（中心向右，流程圖/決策樹）/ rl（中心向左，反向追溯）/ tb（中心向下，組織圖）/ bt（中心向上，由下而上的層級）"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "分支顏色 JSON 陣列，例如 [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]。3-8 個十六進位顏色，依序分配給各一級分支。省略時使用藍紫/綠/黃/紅/天藍/深綠/橙/紫的預設色盤"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "初始折疊節點 ID 的 JSON 陣列，例如 [\"n2\",\"n5\"]。空陣列則全部展開。用於聚焦重點分支"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "最大可見深度：1 表示僅一級分支，2 表示兩級，預設無限制。節點密集時建議設為 2 以保持可讀性"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "將時間序列資料渲染為美觀的時間軸卡片。只需 JSON（約 100 tokens），前端即時渲染。適用於專案里程碑、歷史事件、版本發布計畫與發展歷程。每個事件可有日期、標題、描述、顏色與類別。視覺風格：透過 palette 參數設定全域配色（例如藍紫漸層、暖棕古銅、品牌色系），讓時間軸有統一的調性；item.color 可覆蓋單一項目。5 個以內的精選事件建議 density=relaxed，10 個以上的密集時間軸建議 density=compact。8 種版面：vertical（5-20 項）/ alternating-top（上下交替，時間倒序）/ alternating-bottom（上下交替，時間正序）/ horizontal-left（橫向左，時間倒序）/ horizontal-right（橫向右，時間正序）/ s-curve（S 形路徑，8 項以內）/ fishbone-left（魚骨向左，時間倒序）/ fishbone-right（魚骨向右，時間正序）。"
"Timeline title (up to 30 characters), e.g. Product Milestones": "時間軸標題（最多 30 字），例如「產品發展里程碑」"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "時間軸事件 JSON 陣列。範例：[{\"date\":\"2024-01\",\"title\":\"v1.0 發布\",\"description\":\"核心功能上線\",\"color\":\"#5470c6\",\"category\":\"里程碑\"}]。description/color/category 可省略"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "版面模式：vertical / alternating-top（上下交替，倒序）/ alternating-bottom（上下交替，正序）/ horizontal-left（橫向，倒序）/ horizontal-right（橫向，正序）/ s-curve / fishbone-left（魚骨，倒序）/ fishbone-right（魚骨，正序）"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "全域配色 JSON 陣列，例如 [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]。覆蓋預設 8 色輪替。item.color 優先"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "項目間距：compact（12px）/ normal（20px，預設）/ relaxed（32px）。5 項以下的精選事件建議 relaxed，10 項以上建議 compact"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "將 SVG 或 HTML 片段渲染到對話氣泡中。用於時間軸與關係圖（SVG）、表單預覽與資料卡片（HTML）、統計圖表（SVG）。請勿用於 Mermaid 圖表；Mermaid 請在回覆中以 ```mermaid 程式碼區塊輸出。限制：200KB 以內；<script src=...> 僅限受信任的 CDN。視覺風格：依主題選擇資訊架構（Bento/卡片流/Grid）、字體層級與色彩系統。技術討論用冷色無襯線、商業報告用中性色搭配突顯數字、創意設計可用漸層/玻璃擬態/微動效。務必明確設定 font-family 與 color，不要依賴瀏覽器預設樣式。"
"Widget title (up to 30 characters), e.g. Order Status Flow": "Widget 標題（最多 30 字），例如「訂單狀態流程」"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG 必須以 <svg 開頭；HTML 片段必須以根元素開頭，且不得包含 <html><body>。最大 200KB；<script src=...> 僅限受信任的 CDN。請勿傳入 Mermaid 語法（flowchart/graph/sequenceDiagram 等）；Mermaid 請在回覆中以 ```mermaid 程式碼區塊輸出"
"Placeholder text shown while loading (optional)": "載入時顯示的佔位文字（可選）"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "主題提示：light / dark / auto（跟隨系統）。產生的 HTML 應據此選擇背景色與文字色；不會傳給前端渲染器"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Widget 初始高度（px，80-1200）。預設 480。精簡卡片用 300-400，大圖表用 600-800"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "背景模式：solid（預設）/ transparent（可將截圖疊加到 PPT 範本上）"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "PPT 投影片模式。為 true 時卡片以 16:9 比例渲染，可直接貼到簡報中。預設 false，維持依內容自適應的寬度"
"Section heading text, e.g. Completed this week": "章節標題文字，例如「本週完成」"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "標題層級：1 = 一級（最大），2 = 二級，3 = 三級；預設 1"
"Body paragraph text (optional; used together with elements)": "正文段落文字（可選；與 elements 搭配使用）"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "結構化元素陣列（可選）：paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "元素類型：paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "文字內容（type=paragraph/callout/quote/code 時使用）"
"List item array (used when type=bullet_list or ordered_list)": "清單項目陣列（type=bullet_list 或 ordered_list 時使用）"
"Table header row (required when type=table)": "表格表頭列（type=table 時必填）"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "表格資料列（type=table 時必填）；每列為儲存格值陣列，例如 [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "表格樣式（type=table 時可選）：headerBgColor（表頭背景色）、headerFontColor（表頭文字色）、stripeColor（斑馬紋色）"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "圖片 URL（type=image 時必填）；支援外部 https:// 連結或內部附件（例如 /cube/image?id=xxx）"
"Image width in centimeters (type=image); default 14cm": "圖片寬度（公分，type=image）；預設 14cm"
"Image height in centimeters (type=image); default 10cm": "圖片高度（公分，type=image）；預設 10cm"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "文字是否加粗（type=paragraph/callout/quote 時可選）"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "文字是否斜體（type=paragraph/callout/quote 時可選）"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "文字是否加底線（type=paragraph/callout/quote 時可選）"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "字型大小（磅），例如 12（type=paragraph/callout 時可選）"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "文字顏色（十六進位 RGB，例如 2563EB；type=paragraph/callout/quote 時可選）"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "文字對齊：left/center/right/justify（type=paragraph 時可選）"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "段落背景色（十六進位 RGB，例如 EFF6FF；type=paragraph 時可選）"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "重點提示框變體（type=callout）：info（藍）/ success（綠）/ warning（黃）/ danger（紅）；預設 info"
"KPI value (required when type=kpi), e.g. 17.68M": "KPI 數值（type=kpi 時必填），例如 17.68M"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "KPI 說明（type=kpi 時可選），例如「環比成長」"
"KPI trend (optional when type=kpi): up / down / flat": "KPI 趨勢（type=kpi 時可選）：up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "引用來源（type=quote 時可選），例如「2026 年度報告」"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "程式語言（type=code 時可選），例如 sql/python/javascript；用於選擇語法高亮配色"
"Worksheet name, e.g. Q2 Data": "工作表名稱，例如「Q2 資料」"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "欄標題陣列，例如 [\"日期\",\"營收\",\"環比\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "資料列（二維陣列）；每列為儲存格值陣列，例如 [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "表頭樣式（可選）：headerBgColor（表頭背景色）、headerFontColor（表頭文字色）、stripeColor（斑馬紋色）"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "欄寬陣列（可選），例如 [12, 20, 15]；數值為近似字元寬度"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "數字格式（可選），例如 \"#,##0.00\" 或 \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "條件格式陣列（可選）。每項欄位：range（例如 \"C2:C10\"）、type（dataBar/colorScale/greaterThan/lessThan 等）、color（主色）、value（閾值）"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "圖表定義陣列（可選）：type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "凍結頂端列數（0 = 不凍結，1 = 凍結首列；預設 1）"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "自動篩選範圍（例如 \"A1:E1\"）；留空則停用"
"Dropdown validation array (optional)": "下拉驗證陣列（可選）"
"Applied range (e.g. \"C2:C10\")": "套用範圍（例如 \"C2:C10\"）"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "條件類型：dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "顏色（十六進位 RGB，例如 2563EB），用於資料條、色階或醒目提示"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "閾值或公式（例如 1000 或 =AVERAGE(C2:C10)）"
"Chart type: bar / line / pie": "圖表類型：bar / line / pie"
"Chart title (optional)": "圖表標題（可選）"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "分類軸標籤陣列，例如 [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "資料數列陣列；每項包含 name 與 data"
"Applied range (e.g. \"A2:A100\")": "套用範圍（例如 \"A2:A100\"）"
"Dropdown option array": "下拉選項陣列"
"Title of this slide": "本張投影片的標題"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "投影片版面：title_only（僅標題，封面用）/ title_content（標題+正文，預設）/ two_column（左右兩欄）/ chart_only（全幅圖表）/ blank（空白畫布）"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "投影片背景色，十六進位 RGB，例如 \"1F497D\"；省略時使用主題背景"
"Slide element list; each element describes a text block, table, chart, or image": "投影片元素清單；每個元素描述一段文字、表格、圖表或圖片"
"Footer text displayed at the bottom of the slide; null hides it": "顯示在投影片底部的頁尾文字；null 表示不顯示"
"Whether to show the slide number in the bottom-right corner; default false": "是否在右下角顯示投影片編號；預設 false"
"Speaker notes used as a reminder while presenting": "演講者備註，簡報時作為提示"
"Transition animation: fade / push / wipe / zoom / split / cut": "切換動畫：fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "元素類型：text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "語意角色（僅 text 元素）：title / subtitle / body / caption / kpi。版面引擎據此自動定位，無需指定座標"
"Text content (required when type=text)": "文字內容（type=text 時必填）"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "字型大小（磅，可選）；省略時由版面引擎依 role 決定（title≈28、kpi≈44、body≈16）"
"Whether the text is bold; default false": "文字是否加粗；預設 false"
"Whether the text is italic (optional for type=text); default false": "文字是否斜體（type=text 時可選）；預設 false"
"Whether the text is underlined (optional for type=text); default false": "文字是否加底線（type=text 時可選）；預設 false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "文字顏色，十六進位 RGB，例如 \"FFFFFF\"；省略時繼承主題文字色"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "表格表頭陣列（type=table 時必填），例如 [\"指標\",\"Q1\",\"Q2\",\"環比\"]"
"Chart type (required when type=chart): bar / line / pie": "圖表類型（type=chart 時必填）：bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "圖表分類標籤（type=chart 時必填），例如 [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "資料數列（type=chart 時必填）；每項包含 name（數列名稱）與 data（數值陣列）"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "文字對齊（text 元素）：l（左）/ ctr（中）/ r（右）"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "文字框背景色（text 元素），十六進位 RGB，例如 \"EFF6FF\"；留空則透明"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "富文字片段（text 元素）；有內容時忽略 Content/FontSize/Bold/Color"
"Shape configuration (required when type=shape)": "形狀設定（type=shape 時必填）"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "表格樣式（type=table 時可選）：headerBgColor（表頭背景色）、headerFontColor（表頭文字色）、stripeColor（斑馬紋色）"
"Text content": "文字內容"
"Font size in points; 0 inherits the text box default": "字型大小（磅）；0 表示繼承文字框預設值"
"Whether the text is bold": "文字是否加粗"
"Whether the text is italic": "文字是否斜體"
"Whether the text is underlined": "文字是否加底線"
"Text color, hex RGB such as \"FF6B6B\"": "文字顏色，十六進位 RGB，例如 \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "超連結 URL；設定後該片段可點擊"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "形狀類型：rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "填滿色（十六進位 RGB，例如 2563EB）；null 表示不填滿"
"Border color (hex RGB); null means no border": "邊框色（十六進位 RGB）；null 表示無邊框"
"Text displayed inside the shape (optional)": "形狀內顯示的文字（可選）"
"Text color inside the shape (hex RGB)": "形狀內文字顏色（十六進位 RGB）"
"Font size of the text inside the shape (points); 0 means default": "形狀內文字字型大小（磅）；0 表示預設"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "表頭列背景色（十六進位 RGB，例如 2563EB）；省略時不加特殊樣式"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "表頭列文字顏色（十六進位 RGB，例如 FFFFFF）；省略時繼承預設值"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "斑馬紋色（偶數資料列背景色，例如 EFF6FF 淺藍）；省略時不繪製斑馬紋"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "欄唯一識別碼（必填），例如 \"todo\"、\"doing\"、\"done\""
"Column title (required, up to 20 characters)": "欄標題（必填，最多 20 字）"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "欄標題顏色（可選），十六進位，例如 \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "WIP 上限（可選）；超過時欄標題變紅"
"Card array (required)": "卡片陣列（必填）"
"Unique card ID (required)": "卡片唯一識別碼（必填）"
"Card title (required, up to 40 characters)": "卡片標題（必填，最多 40 字）"
"Supplementary description (optional, up to 100 characters)": "補充說明（可選，最多 100 字）"
"Priority (optional): high | medium | low": "優先級（可選）：high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "標籤字串陣列（可選），例如 [\"設計\",\"前端\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "截止日期（可選），ISO 8601，例如 \"2026-07-15\""
"Assignee name (optional)": "負責人姓名（可選）"
"Subtask checklist (optional); each item has title and done": "子任務清單（可選）；每項包含 title 與 done"
"Completion progress (optional), 0-100": "完成進度（可選），0-100"
"Related link URL (optional)": "相關連結 URL（可選）"
"Subtask title": "子任務標題"
"Whether the subtask is done": "子任務是否完成"
"Unique swimlane ID (required)": "泳道唯一識別碼（必填）"
"Swimlane title (required)": "泳道標題（必填）"
"Column ID array contained in this swimlane (required)": "此泳道包含的欄 ID 陣列（必填）"
"City or place name (required), e.g. Beijing": "城市或地點名稱（必填），例如 北京"
"Latitude (required), WGS84 decimal degrees": "緯度（必填），WGS84 十進位度"
"Longitude (required), WGS84 decimal degrees": "經度（必填），WGS84 十進位度"
"Marker label text (optional); supports \\n line breaks": "標註標籤文字（可選）；支援 \\n 換行"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "標註顏色（可選），十六進位，例如 \"#E74C3C\"；省略時依配色方案輪替"
"Marker size (optional); default 7": "標註大小（可選）；預設 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "省份名稱（必填）；接受中文省份全稱或簡稱，例如 廣東省"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "醒目提示顏色（可選），十六進位，例如 \"#FFB347\"；預設為色盤顏色"
"Highlight label (optional), e.g. No.1 GDP": "醒目提示標籤（可選），例如「GDP 第一」"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "事件日期（必填）；格式不限，例如 \"2024-01\"、\"2024 Q3\"、\"第一階段\""
"Event title (required, up to 30 characters)": "事件標題（必填，最多 30 字）"
"Supplementary description (optional, up to 80 characters)": "補充說明（可選，最多 80 字）"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "十六進位顏色（可選），例如 \"#5470c6\"；省略時自動輪替配色"
"Event category label (optional), e.g. Milestone, Release, Issue": "事件類別標籤（可選），例如「里程碑」、「發布」、「問題」"
