"Generate a Word document (.docx) and return a download link. Supports headings, paragraphs, lists, tables, images, page breaks, dividers, callouts, KPIs, quotes, and code blocks. The sections JSON array describes each section, with heading, content, and elements": "Создаёт документ Word (.docx) и возвращает ссылку для скачивания. Поддерживает заголовки, абзацы, списки, таблицы, изображения, разрывы страниц, разделители, выделенные блоки, KPI, цитаты и блоки кода. Массив JSON sections описывает каждый раздел полями heading, content и elements"
"Document title (up to 30 characters), e.g. Q2 Quarterly Report": "Название документа (до 30 символов), например Квартальный отчёт Q2"
"Section array (JSON). Fields of each section: heading (section title), headingLevel (1-3, default 1), content (body paragraph, optional), elements (element array, optional). Element types: paragraph ({type,text, optional bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, optional tableStyle}; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})": "Массив разделов (JSON). Поля каждого раздела: heading (заголовок раздела), headingLevel (1-3, по умолчанию 1), content (абзац, необязательно), elements (массив элементов, необязательно). Типы элементов: paragraph ({type,text, необязательно bold/italic/underline/fontSize/color/alignment/backgroundColor}), bullet_list ({type,items}), ordered_list ({type,items}), table ({type,headers,rows, необязательно tableStyle}; rows — двумерный массив, каждая строка — массив значений ячеек, например [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), image ({type,src,widthCm?,heightCm?}), page_break ({type}), divider ({type}), callout ({type,text,variant?=info/success/warning/danger}), kpi ({type,kpiValue,kpiLabel?,kpiTrend?=up/down/flat}), quote ({type,text,quoteSource?}), code ({type,text,codeLanguage?})"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal); when omitted, the conversation style or brand default is used": "Тема (необязательно): ключ стиля карточки (например enterprise-blue) или встроенное имя (blue/dark/corporate/warm/green/minimal); если не указано, используется стиль беседы или фирменное значение по умолчанию"
"Generate an Excel workbook (.xlsx) and return a download link. Supports multiple worksheets, header styles, column widths, number formats, conditional formats, frozen panes, auto filters, and dropdown validation. The theme parameter accepts a card style key or a built-in name (blue/dark/corporate/warm/green/minimal)": "Создаёт книгу Excel (.xlsx) и возвращает ссылку для скачивания. Поддерживает несколько листов, стили заголовков, ширину столбцов, числовые форматы, условное форматирование, закреплённые области, автофильтры и проверку раскрывающихся списков. Параметр theme принимает ключ стиля карточки или встроенное имя (blue/dark/corporate/warm/green/minimal)"
"Workbook title (up to 30 characters), e.g. Q2 Revenue Report": "Название книги (до 30 символов), например Отчёт о выручке Q2"
"Worksheet array (JSON). Fields of each sheet: name, headers (header array), rows (2-D array; each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (e.g. [12,20,15]), numberFormat (e.g. \"#,##0.00\" or \"yyyy-MM-dd\"), conditionalFormats (array of {range,type,color,value?}; type supports dataBar/colorScale/greaterThan, etc.), charts (chart array), freezeRows (number of frozen rows), autoFilter (filter range), dropdowns (dropdown validation)": "Массив листов (JSON). Поля каждого листа: name, headers (массив заголовков), rows (двумерный массив; каждая строка — массив значений ячеек, например [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]), style ({headerBgColor,headerFontColor,stripeColor}), columnWidths (например [12,20,15]), numberFormat (например \"#,##0.00\" или \"yyyy-MM-dd\"), conditionalFormats (массив из {range,type,color,value?}; type поддерживает dataBar/colorScale/greaterThan и т. д.), charts (массив диаграмм), freezeRows (число закреплённых строк), autoFilter (диапазон фильтра), dropdowns (проверка раскрывающегося списка)"
"Theme (optional): a card style key (e.g. enterprise-blue) or a built-in name (blue/dark/corporate/warm/green/minimal) that controls header and overall colors; when omitted, the conversation style or brand default is used": "Тема (необязательно): ключ стиля карточки (например enterprise-blue) или встроенное имя (blue/dark/corporate/warm/green/minimal), задающее заголовок и общие цвета; если не указано, используется стиль беседы или фирменное значение по умолчанию"
"Generate a PowerPoint presentation (.pptx) and return a download link. Two mutually exclusive input modes: (1) slides mode, where AI describes structured content and the layout is generated automatically; (2) widgetSrc mode, which embeds previously generated show_widget cards as slide images. The theme parameter accepts a card style key (e.g. enterprise-blue/raycast-dark/ppt-executive) or a built-in name (blue/dark/green/warm/corporate/minimal).": "Создаёт презентацию PowerPoint (.pptx) и возвращает ссылку для скачивания. Два взаимоисключающих режима ввода: (1) режим slides, в котором ИИ описывает структурированное содержимое, а макет создаётся автоматически; (2) режим widgetSrc, который встраивает ранее созданные карточки show_widget как изображения слайдов. Параметр theme принимает ключ стиля карточки (например enterprise-blue/raycast-dark/ppt-executive) или встроенное имя (blue/dark/green/warm/corporate/minimal)."
"Presentation title (up to 30 characters), e.g. Q2 Quarterly Review": "Название презентации (до 30 символов), например Квартальный обзор Q2"
"Slide array (JSON). One element = a single slide; multiple = a full deck. Mutually exclusive with widgetSrc. Fields of each slide: title, layout (title_only/title_content/two_column/chart_only/blank), background (hex color), footer, showPageNumber (true/false), elements (element list), notes, transition. elements supports: text (role=title/subtitle/body/kpi/caption; optional bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows is a 2-D array where each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; optional tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Example: [{\"title\":\"Cover\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Q2 Review\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"NewLife Team\",\"color\":\"94A3B8\"}]}]": "Массив слайдов (JSON). Один элемент — один слайд; несколько — полная презентация. Взаимоисключает widgetSrc. Поля каждого слайда: title, layout (title_only/title_content/two_column/chart_only/blank), background (цвет в HEX), footer, showPageNumber (true/false), elements (список элементов), notes, transition. elements поддерживает: text (role=title/subtitle/body/kpi/caption; необязательно bold/italic/underline/alignment=l/ctr/r/backgroundColor/color), table (headers+rows; rows — двумерный массив, каждая строка — массив значений ячеек, например [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]; необязательно tableStyle={headerBgColor/headerFontColor/stripeColor}), chart (chartType=bar/line/pie/area/scatter+categories+series), image (src), shape (shape={shapeType,fillColor,lineColor,text,fontColor}). Пример: [{\"title\":\"Титул\",\"layout\":\"title_only\",\"background\":\"0F172A\",\"elements\":[{\"type\":\"text\",\"role\":\"title\",\"content\":\"Обзор Q2\",\"alignment\":\"ctr\",\"color\":\"60A5FA\"},{\"type\":\"text\",\"role\":\"subtitle\",\"content\":\"Команда NewLife\",\"color\":\"94A3B8\"}]}]"
"Comma-separated list of show_widget card IDs, e.g. 'call_abc123,call_def456'. Mutually exclusive with slides. Renders the generated cards as slide images": "Список идентификаторов карточек show_widget через запятую, например 'call_abc123,call_def456'. Взаимоисключает slides. Преобразует созданные карточки в изображения слайдов"
"Theme (optional): a card style key (e.g. enterprise-blue/ppt-executive) or a built-in name (blue/dark/corporate/warm/green/minimal, etc.); when omitted, the conversation style or brand default is used": "Тема (необязательно): ключ стиля карточки (например enterprise-blue/ppt-executive) или встроенное имя (blue/dark/corporate/warm/green/minimal и т. д.); если не указано, используется стиль беседы или фирменное значение по умолчанию"
"Render data as an interactive chart (zoom, hover, export as image). About 20x faster than show_widget: only a JSON spec is needed (about 200 tokens) and the front end renders it with ECharts immediately. Supports: bar, line (line/area), pie (pie/donut), scatter, radar, map_china (China province heat map), heatmap (matrix heat map), gauge, funnel, and treemap. Use it for numeric comparison, time-series changes (line), share analysis, and geographic distribution. Note: for itineraries, historical events, milestones, and timelines use show_timeline instead; this tool does not support the timeline type. Visual style: pass a color scheme through data.colors instead of relying on ECharts defaults. Suggestions: brand color for a single series, evenly spaced hues (10-12 colors) for multiple series, complementary colors for comparisons, and a single-color gradient for trends. Blue and gold for finance, blue/green/white for healthcare, and purple/blue/cyan for technology and AI. For large datasets set data.animation=false to reduce rendering cost.": "Отображает данные в виде интерактивной диаграммы (масштабирование, наведение, экспорт в изображение). Примерно в 20 раз быстрее show_widget: достаточно JSON-спецификации (около 200 токенов), и интерфейс сразу отрисовывает её через ECharts. Поддерживаются: bar, line (линия/область), pie (круг/кольцо), scatter, radar, map_china (тепловая карта провинций Китая), heatmap (матричная тепловая карта), gauge, funnel и treemap. Подходит для сравнения чисел, временных рядов (линия), анализа долей и географического распределения. Примечание: для маршрутов, исторических событий, этапов и хронологий используйте show_timeline; этот инструмент не поддерживает тип timeline. Визуальный стиль: передавайте схему цветов через data.colors, не полагаясь на значения ECharts по умолчанию. Рекомендации: фирменный цвет для одной серии, равномерно распределённые оттенки (10-12 цветов) для нескольких серий, дополнительные цвета для сравнений и одноцветный градиент для трендов. Синий и золотой для финансов, синий/зелёный/белый для здравоохранения, фиолетовый/синий/циан для технологий и ИИ. Для больших наборов данных задайте data.animation=false, чтобы снизить нагрузку на отрисовку."
"Chart type: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap": "Тип диаграммы: bar | line | pie | scatter | radar | map_china | heatmap | gauge | funnel | treemap"
"Chart title (up to 30 characters), e.g. 2024 GDP by Province": "Заголовок диаграммы (до 30 символов), например ВВП по провинциям 2024"
"JSON object; see the tool description for the structure. bar example: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Revenue\",\"data\":[100,200]}],\"unit\":\"10k CNY\"} ; radar multi-series example: {\"indicators\":[{\"name\":\"Speed\",\"max\":100},{\"name\":\"Power\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]} ; radar requirement: the number of indicators must equal the length of every series[i].data, and data must contain numbers only": "Объект JSON; структура описана в описании инструмента. Пример bar: {\"xAxis\":[\"Q1\",\"Q2\"],\"series\":[{\"name\":\"Выручка\",\"data\":[100,200]}],\"unit\":\"10k CNY\"}; пример radar с несколькими сериями: {\"indicators\":[{\"name\":\"Скорость\",\"max\":100},{\"name\":\"Сила\",\"max\":100}],\"series\":[{\"name\":\"A\",\"data\":[80,90]},{\"name\":\"B\",\"data\":[70,85]}]}; требование radar: число indicators должно совпадать с длиной каждого series[i].data, а data должно содержать только числа"
"Get details of the current signed-in user, including user name, display name, email, mobile, code, roles, department, gender, age, birthday, and remark, plus the visitor IP address, city, and detailed geo location": "Возвращает сведения о текущем пользователе: имя пользователя, отображаемое имя, почту, мобильный, код, роли, отдел, пол, возраст, дату рождения и примечание, а также IP-адрес посетителя, город и подробное местоположение"
"Search database table schemas by keyword. The result has two parts: (1) a table-to-connection mapping (a Markdown table that makes clear which connection each table belongs to; same-named tables under different connections are listed separately); (2) the table schema XML for each connection. Later run_sql calls must use the connection name given in the mapping table": "Ищет схемы таблиц базы данных по ключевому слову. Результат состоит из двух частей: (1) соответствие таблиц и подключений (таблица Markdown, показывающая, к какому подключению относится каждая таблица; одноимённые таблицы в разных подключениях перечисляются отдельно); (2) XML-схема таблиц для каждого подключения. Последующие вызовы run_sql должны использовать имя подключения из таблицы соответствия"
"Search keywords, separated by commas or spaces": "Ключевые слова поиска, разделённые запятыми или пробелами"
"Restrict to a connection name; empty searches all connections": "Ограничить одним именем подключения; пустое значение ищет во всех подключениях"
"Execute a SQL statement on the given database connection. SELECT/WITH queries return data rows; non-query statements such as INSERT/UPDATE/DELETE return the affected row count. connName must match the connection column returned by search_table": "Выполняет инструкцию SQL в указанном подключении к базе данных. Запросы SELECT/WITH возвращают строки; инструкции, не являющиеся запросами (INSERT/UPDATE/DELETE), возвращают число затронутых строк. connName должен совпадать со столбцом подключения, возвращаемым search_table"
"Database connection name (from the connection column of search_table)": "Имя подключения к базе данных (из столбца подключения search_table)"
"SQL statement. SELECT/WITH returns a result set; non-query statements return the affected row count": "Инструкция SQL. SELECT/WITH возвращает набор результатов; инструкции, не являющиеся запросами, возвращают число затронутых строк"
"Look up the lunar calendar date, solar term, and workday status (workday/holiday/make-up workday) of a date": "Определяет дату по лунному календарю, солнечный термин и статус рабочего дня (рабочий/выходной/компенсационный) для указанной даты"
"Date to query in yyyy-MM-dd format. Defaults to today": "Дата для запроса в формате yyyy-MM-dd. По умолчанию сегодня"
"Render a task list as a multi-column kanban board (e.g. To do -> In progress -> Done). Good for project breakdowns, sprint planning, workflow display, and task state grouping. Each column can have a color marker and a WIP limit; each card can have a title, description, priority, tags, due date, assignee, checklist, progress, and link. Two layouts: board (default multi-column board) and swimlane (columns grouped by team or module).": "Отображает список задач в виде многоколоночной канбан-доски (например Сделать -> В работе -> Готово). Подходит для декомпозиции проекта, планирования спринтов, отображения рабочего процесса и классификации состояний задач. В каждой колонке можно задать цветовую метку и лимит WIP; каждая карточка может содержать заголовок, описание, приоритет, теги, срок, исполнителя, контрольный список, прогресс и ссылку. Два макета: board (многоколоночная доска по умолчанию) и swimlane (колонки, сгруппированные по команде или модулю)."
"Board title (up to 30 characters), e.g. Sprint 1 Board": "Заголовок доски (до 30 символов), например Доска спринта 1"
"Column definition JSON array. Example: [{\"id\":\"todo\",\"title\":\"To do\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Requirement analysis\",\"description\":\"Collect user requirements\",\"priority\":\"high\",\"tags\":[\"design\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Interview users\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Every field except id and title is optional": "Массив JSON с определениями колонок. Пример: [{\"id\":\"todo\",\"title\":\"Сделать\",\"color\":\"#94a3b8\",\"wipLimit\":5,\"cards\":[{\"id\":\"1\",\"title\":\"Анализ требований\",\"description\":\"Собрать требования пользователей\",\"priority\":\"high\",\"tags\":[\"дизайн\"],\"dueDate\":\"2026-07-15\",\"assignee\":\"Alice\",\"checklist\":[{\"title\":\"Интервью с пользователями\",\"done\":true}],\"progress\":60,\"link\":\"https://example.com\"}]}]. Все поля, кроме id и title, необязательны"
"Layout mode: board (default multi-column board) or swimlane (columns grouped by team or module; the swimlanes parameter is required)": "Режим макета: board (многоколоночная доска по умолчанию) или swimlane (колонки, сгруппированные по команде или модулю; требуется параметр swimlanes)"
"Swimlane definition JSON array (used when layout=swimlane). Example: [{\"id\":\"sl1\",\"title\":\"Front-end team\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Back-end team\",\"columnIds\":[\"todo\",\"doing\"]}]": "Массив JSON с определениями дорожек (используется при layout=swimlane). Пример: [{\"id\":\"sl1\",\"title\":\"Команда фронтенда\",\"columnIds\":[\"todo\",\"doing\"]},{\"id\":\"sl2\",\"title\":\"Команда бэкенда\",\"columnIds\":[\"todo\",\"doing\"]}]"
"Mark coordinate points (cities or POIs) or highlight province areas on a map of China, generate an annotated SVG map, and render it in the chat bubble. Supports: (1) province fills with custom colors; (2) WGS84 latitude/longitude markers with label text; (3) an automatic legend in the bottom-right corner. Typical uses: data distribution by province, city locations, and regional sales heat maps.": "Отмечает точки координат (города или POI) либо выделяет провинции на карте Китая, создаёт SVG-карту с аннотациями и отображает её в пузыре чата. Поддерживает: (1) заливку провинций своими цветами; (2) маркеры WGS84 по широте и долготе с текстом метки; (3) автоматическую легенду в правом нижнем углу. Типичное применение: распределение данных по провинциям, расположение городов и тепловые карты региональных продаж."
"Map title (up to 30 characters), e.g. 2024 GDP by Province": "Заголовок карты (до 30 символов), например ВВП по провинциям 2024"
"Marker JSON array (may be an empty array []). Format: [{\"name\":\"Beijing\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Beijing\\n4376B\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng are WGS84 decimal degrees; color/size are optional": "Массив JSON с маркерами (может быть пустым массивом []). Формат: [{\"name\":\"Пекин\",\"lat\":39.9,\"lng\":116.4,\"label\":\"Пекин\\n4376 млрд\",\"color\":\"#E74C3C\",\"size\":8}]. lat/lng — десятичные градусы WGS84; color/size необязательны"
"Province highlight JSON array (may be an empty array []). Format: [{\"name\":\"Guangdong\",\"color\":\"#FFB347\",\"label\":\"No.1 GDP\"}]. name accepts the Chinese province name (full or short form); label is optional": "Массив JSON с выделением провинций (может быть пустым массивом []). Формат: [{\"name\":\"Гуандун\",\"color\":\"#FFB347\",\"label\":\"№ 1 по ВВП\"}]. name принимает китайское название провинции (полное или краткое); label необязателен"
"Legend title (optional), e.g. GDP scale": "Заголовок легенды (необязательно), например Масштаб ВВП"
"Color scheme (optional): blue/orange/green/purple/red; defaults to blue": "Схема цветов (необязательно): blue/orange/green/purple/red; по умолчанию blue"
"Marker style (optional): circle/pin/square; defaults to circle": "Стиль маркера (необязательно): circle/pin/square; по умолчанию circle"
"Render knowledge hierarchies or concept relationships as a collapsible interactive mind map. The input is a Markdown outline (# / ## / ###) that the front end converts into a visual tree. Use it for knowledge organization, concept breakdown, technology comparison, option evaluation, and content summarization. Visual style: choose branchColors (3-8 coordinated colors), maxDepth (complexity), and collapsed (initially collapsed to focus) based on the topic. Use cool colors (blue/purple/cyan) for technology and data, warm colors (orange/gold/red) for business and marketing, and greens for nature and health. For dense nodes, set maxDepth=2 for readability. 6 layouts: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy).": "Отображает иерархии знаний или связи понятий в виде сворачиваемой интерактивной интеллект-карты. Вход — структура Markdown (# / ## / ###), которую интерфейс преобразует в визуальное дерево. Подходит для систематизации знаний, разбора понятий, сравнения технологий, оценки вариантов и обобщения содержимого. Визуальный стиль: выбирайте branchColors (3-8 согласованных цветов), maxDepth (сложность) и collapsed (начальная свёрнутость для фокуса) в зависимости от темы. Холодные цвета (синий/фиолетовый/циан) для технологий и данных, тёплые (оранжевый/золотой/красный) для бизнеса и маркетинга, зелёные для природы и здоровья. При плотных узлах задайте maxDepth=2 для читаемости. 6 макетов: tree (дерево с отступами по умолчанию, универсально) / radial (радиально влево-вправо, лучше всего для карт знаний) / lr (от центра вправо, блок-схемы/деревья решений) / rl (от центра влево, обратная трассировка) / tb (от центра вниз, оргструктуры) / bt (от центра вверх, иерархия снизу вверх)."
"Mind map title (up to 30 characters), e.g. AI Technology Stack": "Заголовок интеллект-карты (до 30 символов), например Стек технологий ИИ"
"Markdown outline using # / ## / ### for levels 1-3. Example:\n# Artificial Intelligence\n## Machine Learning\n### Supervised Learning\n### Unsupervised Learning\n## Deep Learning\n### CNN\n### RNN": "Структура Markdown с # / ## / ### для уровней 1-3. Пример:\n# Искусственный интеллект\n## Машинное обучение\n### Обучение с учителем\n### Обучение без учителя\n## Глубокое обучение\n### CNN\n### RNN"
"Layout mode: tree (default indented tree, general purpose) / radial (left-right radial, best for knowledge maps) / lr (center to right, flowcharts/decision trees) / rl (center to left, backward tracing) / tb (center downward, org charts) / bt (center upward, bottom-up hierarchy)": "Режим макета: tree (дерево с отступами по умолчанию, универсально) / radial (радиально влево-вправо, лучше всего для карт знаний) / lr (от центра вправо, блок-схемы/деревья решений) / rl (от центра влево, обратная трассировка) / tb (от центра вниз, оргструктуры) / bt (от центра вверх, иерархия снизу вверх)"
"Branch color JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. 3-8 hex colors assigned in order to the top-level branches. When omitted, the default blue/purple, green, yellow, red, sky blue, dark green, orange, and purple palette is used": "Массив JSON с цветами ветвей, например [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. От 3 до 8 HEX-цветов назначаются по порядку ветвям первого уровня. Если не указано, используется палитра по умолчанию: синий/фиолетовый, зелёный, жёлтый, красный, голубой, тёмно-зелёный, оранжевый, фиолетовый"
"JSON array of initially collapsed node IDs, e.g. [\"n2\",\"n5\"]. Empty expands everything. Use it to focus on key branches": "Массив JSON с идентификаторами изначально свёрнутых узлов, например [\"n2\",\"n5\"]. Пустой массив разворачивает всё. Служит для фокуса на ключевых ветвях"
"Maximum visible depth: 1 = top-level branches only, 2 = two levels, unlimited by default. For dense nodes, set it to 2 for readability": "Максимальная видимая глубина: 1 — только ветви первого уровня, 2 — два уровня, по умолчанию без ограничений. При плотных узлах задайте 2 для читаемости"
"Render time-series data as attractive timeline cards. Only JSON is needed (about 100 tokens) and the front end renders it instantly. Use it for project milestones, historical events, release plans, and development history. Each event can have a date, title, description, color, and category. Visual style: set a global palette through the palette parameter (e.g. blue-purple gradient, warm bronze, brand colors) so the timeline has a consistent mood; item.color overrides an individual entry. Use density=relaxed for 5 or fewer curated events and density=compact for 10+ dense timelines. 8 layouts: vertical (5-20 items) / alternating-top (alternating above, reverse chronological) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological, arrows left) / horizontal-right (chronological, arrows right) / s-curve (S-shaped path, 8 items or fewer) / fishbone-left (reverse chronological, arrows left) / fishbone-right (chronological, arrows right).": "Отображает данные временных рядов в виде аккуратных карточек хронологии. Достаточно JSON (около 100 токенов), и интерфейс отрисовывает его мгновенно. Подходит для этапов проекта, исторических событий, планов выпуска и истории развития. Каждое событие может содержать дату, заголовок, описание, цвет и категорию. Визуальный стиль: задайте глобальную палитру через параметр palette (например сине-фиолетовый градиент, тёплый бронзовый, фирменные цвета), чтобы хронология имела единое настроение; item.color переопределяет отдельный элемент. Используйте density=relaxed для 5 и менее избранных событий и density=compact для 10 и более. 8 макетов: vertical (5-20 элементов) / alternating-top (поочерёдно сверху, обратный порядок) / alternating-bottom (поочерёдно снизу, хронологический порядок) / horizontal-left (горизонтально влево, обратный порядок) / horizontal-right (горизонтально вправо, хронологический порядок) / s-curve (S-образный путь, 8 элементов и менее) / fishbone-left (рыбья кость влево, обратный порядок) / fishbone-right (рыбья кость вправо, хронологический порядок)."
"Timeline title (up to 30 characters), e.g. Product Milestones": "Заголовок хронологии (до 30 символов), например Этапы развития продукта"
"Timeline event JSON array. Example: [{\"date\":\"2024-01\",\"title\":\"v1.0 release\",\"description\":\"Core features launched\",\"color\":\"#5470c6\",\"category\":\"Milestone\"}]. description/color/category are optional": "Массив JSON событий хронологии. Пример: [{\"date\":\"2024-01\",\"title\":\"Выпуск v1.0\",\"description\":\"Основные функции запущены\",\"color\":\"#5470c6\",\"category\":\"Этап\"}]. description/color/category необязательны"
"Layout mode: vertical / alternating-top (alternating above, reverse order) / alternating-bottom (alternating below, chronological) / horizontal-left (reverse chronological) / horizontal-right (chronological) / s-curve / fishbone-left (reverse chronological) / fishbone-right (chronological)": "Режим макета: vertical / alternating-top (поочерёдно сверху, обратный порядок) / alternating-bottom (поочерёдно снизу, хронологический) / horizontal-left (горизонтально, обратный порядок) / horizontal-right (горизонтально, хронологический) / s-curve / fishbone-left (рыбья кость, обратный порядок) / fishbone-right (рыбья кость, хронологический)"
"Global color scheme JSON array, e.g. [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Overrides the default 8-color rotation. item.color takes precedence": "Массив JSON глобальной палитры, например [\"#3b82f6\",\"#10b981\",\"#f59e0b\"]. Заменяет стандартную ротацию из 8 цветов. item.color имеет приоритет"
"Item spacing: compact (12px) / normal (20px, default) / relaxed (32px). relaxed suits 5 or fewer curated events; compact suits 10+": "Интервал элементов: compact (12px) / normal (20px, по умолчанию) / relaxed (32px). relaxed подходит для 5 и менее избранных событий; compact — для 10 и более"
"Render an SVG or HTML fragment inside the chat bubble. Use it for timelines and relationship diagrams (SVG), form previews and data cards (HTML), and statistical charts (SVG). Do not use it for Mermaid diagrams; output Mermaid as a ```mermaid code block in the reply instead. Limits: 200KB or less; <script src=...> only from trusted CDNs. Visual style: choose the information architecture (Bento/card flow/Grid), type hierarchy, and color system based on the topic. Use cool sans-serif tones for technical discussions, neutral colors with highlighted numbers for business reports, and gradients/glassmorphism/micro-animations for creative work. Always set font-family and color explicitly; do not rely on browser defaults.": "Отображает фрагмент SVG или HTML в пузыре чата. Используйте для хронологий и диаграмм связей (SVG), предпросмотра форм и карточек данных (HTML), статистических диаграмм (SVG). Не используйте для диаграмм Mermaid; выводите Mermaid как блок кода ```mermaid в ответе. Ограничения: не более 200 КБ; <script src=...> только с доверенных CDN. Визуальный стиль: выбирайте информационную архитектуру (Bento/поток карточек/Grid), типографическую иерархию и цветовую систему в зависимости от темы. Холодные тона без засечек для технических обсуждений, нейтральные цвета с выделенными цифрами для бизнес-отчётов, градиенты/глассморфизм/микроанимации для творчества. Всегда задавайте font-family и color явно; не полагайтесь на стили браузера по умолчанию."
"Widget title (up to 30 characters), e.g. Order Status Flow": "Заголовок виджета (до 30 символов), например Схема статуса заказа"
"SVG must start with <svg; HTML fragments must start with the root element and must not include <html><body>. Maximum 200KB; <script src=...> only from trusted CDNs. Do not pass Mermaid syntax (flowchart/graph/sequenceDiagram, etc.); output Mermaid as a ```mermaid code block in the reply": "SVG должен начинаться с <svg; фрагменты HTML должны начинаться с корневого элемента и не содержать <html><body>. Максимум 200 КБ; <script src=...> только с доверенных CDN. Не передавайте синтаксис Mermaid (flowchart/graph/sequenceDiagram и т. д.); выводите Mermaid как блок кода ```mermaid в ответе"
"Placeholder text shown while loading (optional)": "Текст-заглушка, отображаемый во время загрузки (необязательно)"
"Theme hint: light / dark / auto (follow system). The generated HTML should pick background and text colors accordingly; not passed to the front-end renderer": "Подсказка темы: light / dark / auto (как в системе). Сгенерированный HTML должен выбрать цвета фона и текста соответственно; в интерфейс не передаётся"
"Initial widget height in px (80-1200). Default 480. Use 300-400 for compact cards and 600-800 for large charts": "Начальная высота виджета в px (80-1200). По умолчанию 480. Используйте 300-400 для компактных карточек и 600-800 для больших диаграмм"
"Background mode: solid (default) / transparent (for overlaying screenshots on a PPT template)": "Режим фона: solid (по умолчанию) / transparent (для наложения скриншотов на шаблон PPT)"
"PPT slide mode. When true the card renders at a 16:9 aspect ratio, ready to paste into a presentation. Default false, which keeps the content-driven width": "Режим слайда PPT. При true карточка отрисовывается в пропорции 16:9, готовая к вставке в презентацию. По умолчанию false, что сохраняет ширину по содержимому"
"Section heading text, e.g. Completed this week": "Текст заголовка раздела, например Выполнено на этой неделе"
"Heading level: 1 = level 1 (largest), 2 = level 2, 3 = level 3; default 1": "Уровень заголовка: 1 = уровень 1 (наибольший), 2 = уровень 2, 3 = уровень 3; по умолчанию 1"
"Body paragraph text (optional; used together with elements)": "Текст абзаца (необязательно; используется вместе с elements)"
"Structured element array (optional): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code": "Массив структурированных элементов (необязательно): paragraph/bullet_list/ordered_list/table/image/page_break/divider/callout/kpi/quote/code"
"Element type: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code": "Тип элемента: paragraph / bullet_list / ordered_list / table / image / page_break / divider / callout / kpi / quote / code"
"Text content (used when type=paragraph/callout/quote/code)": "Текстовое содержимое (используется при type=paragraph/callout/quote/code)"
"List item array (used when type=bullet_list or ordered_list)": "Массив элементов списка (используется при type=bullet_list или ordered_list)"
"Table header row (required when type=table)": "Строка заголовка таблицы (обязательна при type=table)"
"Table data rows (required when type=table); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Строки данных таблицы (обязательны при type=table); каждая строка — массив значений ячеек, например [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Table style (optional for type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Стиль таблицы (необязательно при type=table): headerBgColor (фон заголовка), headerFontColor (цвет текста заголовка), stripeColor (чередующиеся строки)"
"Image URL (required when type=image); supports external https:// links or internal attachments such as /cube/image?id=xxx": "URL изображения (обязателен при type=image); поддерживаются внешние ссылки https:// и внутренние вложения, например /cube/image?id=xxx"
"Image width in centimeters (type=image); default 14cm": "Ширина изображения в сантиметрах (type=image); по умолчанию 14 см"
"Image height in centimeters (type=image); default 10cm": "Высота изображения в сантиметрах (type=image); по умолчанию 10 см"
"Whether the text is bold (optional for type=paragraph/callout/quote)": "Полужирный ли текст (необязательно при type=paragraph/callout/quote)"
"Whether the text is italic (optional for type=paragraph/callout/quote)": "Курсив ли текст (необязательно при type=paragraph/callout/quote)"
"Whether the text is underlined (optional for type=paragraph/callout/quote)": "Подчёркнут ли текст (необязательно при type=paragraph/callout/quote)"
"Font size in points, e.g. 12 (optional for type=paragraph/callout)": "Размер шрифта в пунктах, например 12 (необязательно при type=paragraph/callout)"
"Text color (hex RGB, e.g. 2563EB; optional for type=paragraph/callout/quote)": "Цвет текста (HEX RGB, например 2563EB; необязательно при type=paragraph/callout/quote)"
"Text alignment: left/center/right/justify (optional for type=paragraph)": "Выравнивание текста: left/center/right/justify (необязательно при type=paragraph)"
"Paragraph background color (hex RGB, e.g. EFF6FF; optional for type=paragraph)": "Цвет фона абзаца (HEX RGB, например EFF6FF; необязательно при type=paragraph)"
"Callout variant (type=callout): info (blue) / success (green) / warning (yellow) / danger (red); default info": "Вариант выделенного блока (type=callout): info (синий) / success (зелёный) / warning (жёлтый) / danger (красный); по умолчанию info"
"KPI value (required when type=kpi), e.g. 17.68M": "Значение KPI (обязательно при type=kpi), например 17,68 млн"
"KPI label (optional when type=kpi), e.g. month-over-month growth": "Подпись KPI (необязательно при type=kpi), например рост к прошлому месяцу"
"KPI trend (optional when type=kpi): up / down / flat": "Тренд KPI (необязательно при type=kpi): up / down / flat"
"Quote source (optional when type=quote), e.g. 2026 Annual Report": "Источник цитаты (необязательно при type=quote), например Годовой отчёт 2026"
"Code language (optional when type=code), e.g. sql/python/javascript; selects the syntax highlighting colors": "Язык кода (необязательно при type=code), например sql/python/javascript; выбирает цвета подсветки синтаксиса"
"Worksheet name, e.g. Q2 Data": "Имя листа, например Данные Q2"
"Column header array, e.g. [\"Date\",\"Revenue\",\"MoM\"]": "Массив заголовков столбцов, например [\"Дата\",\"Выручка\",\"Изменение\"]"
"Data rows (2-D array); each row is an array of cell values, e.g. [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]": "Строки данных (двумерный массив); каждая строка — массив значений ячеек, например [[\"Alice\",\"85\"],[\"Bob\",\"92\"]]"
"Header style (optional): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Стиль заголовка (необязательно): headerBgColor (фон заголовка), headerFontColor (цвет текста заголовка), stripeColor (чередующиеся строки)"
"Column width array (optional), e.g. [12, 20, 15]; values are approximate character widths": "Массив ширин столбцов (необязательно), например [12, 20, 15]; значения — приблизительная ширина в символах"
"Number format (optional), e.g. \"#,##0.00\" or \"yyyy-MM-dd\"": "Числовой формат (необязательно), например \"#,##0.00\" или \"yyyy-MM-dd\""
"Conditional format array (optional). Fields of each item: range (e.g. \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan, etc.), color (primary color), value (threshold)": "Массив условных форматов (необязательно). Поля каждого элемента: range (например \"C2:C10\"), type (dataBar/colorScale/greaterThan/lessThan и т. д.), color (основной цвет), value (порог)"
"Chart definition array (optional): type=bar/line/pie + title + categories + series": "Массив определений диаграмм (необязательно): type=bar/line/pie + title + categories + series"
"Number of frozen top rows (0 = none, 1 = freeze the first row; default 1)": "Число закреплённых верхних строк (0 = нет, 1 = закрепить первую строку; по умолчанию 1)"
"Auto filter range (e.g. \"A1:E1\"); disabled when empty": "Диапазон автофильтра (например \"A1:E1\"); пустое значение отключает фильтр"
"Dropdown validation array (optional)": "Массив проверок раскрывающегося списка (необязательно)"
"Applied range (e.g. \"C2:C10\")": "Применяемый диапазон (например \"C2:C10\")"
"Condition type: dataBar / colorScale / greaterThan / lessThan / equal / between": "Тип условия: dataBar / colorScale / greaterThan / lessThan / equal / between"
"Color (hex RGB, e.g. 2563EB) used for data bars, color scales, or highlighting": "Цвет (HEX RGB, например 2563EB) для гистограмм, цветовых шкал или выделения"
"Threshold or formula (e.g. 1000 or =AVERAGE(C2:C10))": "Порог или формула (например 1000 или =AVERAGE(C2:C10))"
"Chart type: bar / line / pie": "Тип диаграммы: bar / line / pie"
"Chart title (optional)": "Заголовок диаграммы (необязательно)"
"Category axis label array, e.g. [\"Q1\",\"Q2\",\"Q3\"]": "Массив подписей оси категорий, например [\"Q1\",\"Q2\",\"Q3\"]"
"Data series array; each item has name and data": "Массив серий данных; каждый элемент содержит name и data"
"Applied range (e.g. \"A2:A100\")": "Применяемый диапазон (например \"A2:A100\")"
"Dropdown option array": "Массив вариантов раскрывающегося списка"
"Title of this slide": "Заголовок этого слайда"
"Slide layout: title_only (title only, for covers) / title_content (title + body, default) / two_column (two columns) / chart_only (full-width chart) / blank (blank canvas)": "Макет слайда: title_only (только заголовок, для титульных) / title_content (заголовок + текст, по умолчанию) / two_column (две колонки) / chart_only (диаграмма на всю ширину) / blank (пустой холст)"
"Slide background color, hex RGB such as \"1F497D\"; when omitted, the theme background is used": "Цвет фона слайда, HEX RGB например \"1F497D\"; если не указан, используется фон темы"
"Slide element list; each element describes a text block, table, chart, or image": "Список элементов слайда; каждый элемент описывает блок текста, таблицу, диаграмму или изображение"
"Footer text displayed at the bottom of the slide; null hides it": "Текст нижнего колонтитула внизу слайда; null скрывает его"
"Whether to show the slide number in the bottom-right corner; default false": "Показывать ли номер слайда в правом нижнем углу; по умолчанию false"
"Speaker notes used as a reminder while presenting": "Заметки докладчика, используемые как напоминание во время презентации"
"Transition animation: fade / push / wipe / zoom / split / cut": "Анимация перехода: fade / push / wipe / zoom / split / cut"
"Element type: text / table / chart / image": "Тип элемента: text / table / chart / image"
"Semantic role (text elements only): title / subtitle / body / caption / kpi. The layout engine uses it to position the element automatically, so no coordinates are needed": "Семантическая роль (только элементы text): title / subtitle / body / caption / kpi. Механизм макета использует её для автоматического размещения, координаты не нужны"
"Text content (required when type=text)": "Текстовое содержимое (обязательно при type=text)"
"Font size in points (optional); when omitted, the layout engine picks one by role (title≈28, kpi≈44, body≈16)": "Размер шрифта в пунктах (необязательно); если не указан, механизм макета выбирает его по role (title≈28, kpi≈44, body≈16)"
"Whether the text is bold; default false": "Полужирный ли текст; по умолчанию false"
"Whether the text is italic (optional for type=text); default false": "Курсив ли текст (необязательно при type=text); по умолчанию false"
"Whether the text is underlined (optional for type=text); default false": "Подчёркнут ли текст (необязательно при type=text); по умолчанию false"
"Text color, hex RGB such as \"FFFFFF\"; when omitted, the theme text color is inherited": "Цвет текста, HEX RGB например \"FFFFFF\"; если не указан, наследуется цвет текста темы"
"Table header array (required when type=table), e.g. [\"Metric\",\"Q1\",\"Q2\",\"MoM\"]": "Массив заголовков таблицы (обязателен при type=table), например [\"Показатель\",\"Q1\",\"Q2\",\"Изменение\"]"
"Chart type (required when type=chart): bar / line / pie": "Тип диаграммы (обязателен при type=chart): bar / line / pie"
"Chart category labels (required when type=chart), e.g. [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]": "Подписи категорий диаграммы (обязательны при type=chart), например [\"Q1\",\"Q2\",\"Q3\",\"Q4\"]"
"Data series (required when type=chart); each item has name (series name) and data (numeric array)": "Серии данных (обязательны при type=chart); каждый элемент содержит name (имя серии) и data (массив чисел)"
"Text alignment (text elements): l (left) / ctr (center) / r (right)": "Выравнивание текста (элементы text): l (слева) / ctr (по центру) / r (справа)"
"Text box background color (text elements), hex RGB such as \"EFF6FF\"; transparent when empty": "Цвет фона текстового поля (элементы text), HEX RGB например \"EFF6FF\"; пустое значение означает прозрачность"
"Rich text runs (text elements); when present, Content/FontSize/Bold/Color are ignored": "Фрагменты форматированного текста (элементы text); если заданы, Content/FontSize/Bold/Color игнорируются"
"Shape configuration (required when type=shape)": "Конфигурация фигуры (обязательна при type=shape)"
"Table style (optional when type=table): headerBgColor (header background), headerFontColor (header text color), stripeColor (striped rows)": "Стиль таблицы (необязательно при type=table): headerBgColor (фон заголовка), headerFontColor (цвет текста заголовка), stripeColor (чередующиеся строки)"
"Text content": "Текстовое содержимое"
"Font size in points; 0 inherits the text box default": "Размер шрифта в пунктах; 0 наследует значение по умолчанию текстового поля"
"Whether the text is bold": "Полужирный ли текст"
"Whether the text is italic": "Курсив ли текст"
"Whether the text is underlined": "Подчёркнут ли текст"
"Text color, hex RGB such as \"FF6B6B\"": "Цвет текста, HEX RGB например \"FF6B6B\""
"Hyperlink URL; the run becomes clickable when set": "URL гиперссылки; если задан, фрагмент становится кликабельным"
"Shape type: rect / ellipse / roundRect / triangle / diamond / arrow": "Тип фигуры: rect / ellipse / roundRect / triangle / diamond / arrow"
"Fill color (hex RGB, e.g. 2563EB); null means no fill": "Цвет заливки (HEX RGB, например 2563EB); null означает без заливки"
"Border color (hex RGB); null means no border": "Цвет границы (HEX RGB); null означает без границы"
"Text displayed inside the shape (optional)": "Текст внутри фигуры (необязательно)"
"Text color inside the shape (hex RGB)": "Цвет текста внутри фигуры (HEX RGB)"
"Font size of the text inside the shape (points); 0 means default": "Размер шрифта текста внутри фигуры (пункты); 0 означает значение по умолчанию"
"Header row background color (hex RGB, e.g. 2563EB); when omitted, no special style is applied": "Цвет фона строки заголовка (HEX RGB, например 2563EB); если не указан, особый стиль не применяется"
"Header row text color (hex RGB, e.g. FFFFFF); when omitted, the default is inherited": "Цвет текста строки заголовка (HEX RGB, например FFFFFF); если не указан, наследуется значение по умолчанию"
"Striped row color (background of even data rows, e.g. EFF6FF light blue); when omitted, no stripes are drawn": "Цвет чередующихся строк (фон чётных строк данных, например EFF6FF светло-синий); если не указан, полосы не рисуются"
"Unique column ID (required), e.g. \"todo\", \"doing\", \"done\"": "Уникальный идентификатор колонки (обязателен), например \"todo\", \"doing\", \"done\""
"Column title (required, up to 20 characters)": "Заголовок колонки (обязателен, до 20 символов)"
"Column title color (optional), hex, e.g. \"#3b82f6\"": "Цвет заголовка колонки (необязательно), HEX, например \"#3b82f6\""
"WIP limit (optional); the column title turns red when exceeded": "Лимит WIP (необязательно); при превышении заголовок колонки становится красным"
"Card array (required)": "Массив карточек (обязателен)"
"Unique card ID (required)": "Уникальный идентификатор карточки (обязателен)"
"Card title (required, up to 40 characters)": "Заголовок карточки (обязателен, до 40 символов)"
"Supplementary description (optional, up to 100 characters)": "Дополнительное описание (необязательно, до 100 символов)"
"Priority (optional): high | medium | low": "Приоритет (необязательно): high | medium | low"
"Tag string array (optional), e.g. [\"design\",\"frontend\"]": "Массив строк тегов (необязательно), например [\"дизайн\",\"фронтенд\"]"
"Due date (optional), ISO 8601 such as \"2026-07-15\"": "Срок выполнения (необязательно), ISO 8601 например \"2026-07-15\""
"Assignee name (optional)": "Имя исполнителя (необязательно)"
"Subtask checklist (optional); each item has title and done": "Контрольный список подзадач (необязательно); каждый элемент содержит title и done"
"Completion progress (optional), 0-100": "Прогресс выполнения (необязательно), 0-100"
"Related link URL (optional)": "URL связанной ссылки (необязательно)"
"Subtask title": "Заголовок подзадачи"
"Whether the subtask is done": "Выполнена ли подзадача"
"Unique swimlane ID (required)": "Уникальный идентификатор дорожки (обязателен)"
"Swimlane title (required)": "Заголовок дорожки (обязателен)"
"Column ID array contained in this swimlane (required)": "Массив идентификаторов колонок, входящих в эту дорожку (обязателен)"
"City or place name (required), e.g. Beijing": "Название города или места (обязательно), например Пекин"
"Latitude (required), WGS84 decimal degrees": "Широта (обязательна), десятичные градусы WGS84"
"Longitude (required), WGS84 decimal degrees": "Долгота (обязательна), десятичные градусы WGS84"
"Marker label text (optional); supports \\n line breaks": "Текст метки маркера (необязательно); поддерживает \\\\n для переноса строки"
"Marker color (optional), hex such as \"#E74C3C\"; when omitted, colors rotate with the color scheme": "Цвет маркера (необязательно), HEX например \"#E74C3C\"; если не указан, цвета чередуются по схеме"
"Marker size (optional); default 7": "Размер маркера (необязательно); по умолчанию 7"
"Province name (required); accepts the Chinese province name in full or short form, e.g. Guangdong": "Название провинции (обязательно); принимает китайское название провинции (полное или краткое), например Гуандун"
"Highlight color (optional), hex such as \"#FFB347\"; defaults to the palette color": "Цвет выделения (необязательно), HEX например \"#FFB347\"; по умолчанию цвет палитры"
"Highlight label (optional), e.g. No.1 GDP": "Подпись выделения (необязательно), например № 1 по ВВП"
"Event date (required); any format, e.g. \"2024-01\", \"2024 Q3\", or \"Phase 1\"": "Дата события (обязательна); любой формат, например \"2024-01\", \"2024 Q3\" или \"Этап 1\""
"Event title (required, up to 30 characters)": "Заголовок события (обязателен, до 30 символов)"
"Supplementary description (optional, up to 80 characters)": "Дополнительное описание (необязательно, до 80 символов)"
"Hex color (optional), e.g. \"#5470c6\"; when omitted the palette rotates automatically": "HEX-цвет (необязательно), например \"#5470c6\"; если не указан, палитра чередуется автоматически"
"Event category label (optional), e.g. Milestone, Release, Issue": "Метка категории события (необязательно), например Этап, Выпуск, Проблема"
